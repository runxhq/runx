version: "0.1.9"
minimum_runx: 0.12.0
default_method: generate
catalog:
  visibility: public
  category: security
methods:
  generate:
    description: Generate a CycloneDX document and reusable inventory from one admitted local lockfile.
    inputs:
      repo_root:
        type: string
        description: Authorized workspace root.
        default: .
        optional: true
      path:
        type: string
        description: Workspace-relative lockfile path.
      path_scope:
        type: string
        description: Workspace or owning-skill input root.
        default: workspace
        enum:
          - workspace
          - skill
        optional: true
      max_bytes:
        type: number
        description: Complete admitted UTF-8 read budget; native resource ceilings apply.
        optional: true
      lockfile_type:
        type: string
        description: Infer from the conventional filename, or explicitly select a supported lockfile type.
        default: ""
        enum:
          - ""
          - package-lock
          - npm-shrinkwrap
          - pnpm
          - cargo
        optional: true
      scope:
        type: string
        description: Locked declarations, or npm/pnpm direct production dependencies. No claim about installed state.
        default: all-locked
        enum:
          - all-locked
          - direct-production
        optional: true
    result_from:
      - generate
    examples:
      - path: package-lock.json
    steps:
      - id: inventory
        skill: .#inventory-file
        inputs:
          repo_root: $input.repo_root
          path: $input.path
          path_scope: $input.path_scope
          max_bytes: $input.max_bytes
          lockfile_type: $input.lockfile_type
          scope: $input.scope
      - id: generate
        skill: .#from-inventory
        inputs:
          inventory: $steps.inventory.inventory
  inventory-file:
    description: Admit and normalize one local lockfile without generating a second inventory in downstream audits.
    inputs:
      repo_root:
        type: string
        description: Authorized workspace root.
        default: .
        optional: true
      path:
        type: string
        description: Workspace-relative lockfile path.
      path_scope:
        type: string
        description: Workspace or owning-skill input root.
        default: workspace
        enum:
          - workspace
          - skill
        optional: true
      max_bytes:
        type: number
        description: Complete admitted UTF-8 read budget; native resource ceilings apply.
        optional: true
      lockfile_type:
        type: string
        description: Infer from the conventional filename, or explicitly select a supported lockfile type.
        default: ""
        enum:
          - ""
          - package-lock
          - npm-shrinkwrap
          - pnpm
          - cargo
        optional: true
      scope:
        type: string
        description: Locked declarations, or npm/pnpm direct production dependencies. No claim about installed state.
        default: all-locked
        enum:
          - all-locked
          - direct-production
        optional: true
    result_from:
      - inventory
    steps:
      - id: admit
        tool: artifact.admit
        inputs:
          repo_root: $input.repo_root
          path: $input.path
          path_scope: $input.path_scope
          media_type: text/plain
      - id: read
        tool: artifact.read
        inputs:
          artifact_uri: $steps.admit.local_artifact.artifact_uri
          encoding: utf8
          max_bytes: $input.max_bytes
      - id: inventory
        tool:
          module: inventory.mjs
          export: fromFile
          requires:
            - parseData
        inputs:
          page: $steps.read.artifact_page
          path: $input.path
          lockfile_type: $input.lockfile_type
          scope: $input.scope
        outputs:
          inventory: {type: object, packet: runx/sbom-generate.inventory.v1}
  inventory-source:
    description: Normalize already-acquired text, binding its exact UTF-8 bytes without another file or network read.
    inputs:
      source_text:
        type: string
        description: Complete previously acquired lockfile text.
      source_label:
        type: string
        description: Source identity to retain.
      lockfile_type:
        type: string
        description: Infer from the conventional filename, or explicitly select a supported lockfile type.
        default: ""
        enum:
          - ""
          - package-lock
          - npm-shrinkwrap
          - pnpm
          - cargo
        optional: true
      scope:
        type: string
        description: Locked declarations, or npm/pnpm direct production dependencies. No claim about installed state.
        default: all-locked
        enum:
          - all-locked
          - direct-production
        optional: true
    result_from:
      - inventory
    steps:
      - id: digest
        tool: data.digest
        inputs:
          value: $input.source_text
          encoding: utf8_text
      - id: inventory
        tool:
          module: inventory.mjs
          export: fromSource
          requires:
            - parseData
        inputs:
          source_text: $input.source_text
          source_label: $input.source_label
          source_digest: $steps.digest.digest_result.digest
          lockfile_type: $input.lockfile_type
          scope: $input.scope
        outputs:
          inventory: {type: object, packet: runx/sbom-generate.inventory.v1}
  make:
    description: Generate from an already-parsed lockfile. Its canonical JSON digest is explicitly not the original file digest.
    inputs:
      lockfile:
        description: Already-parsed supported lockfile object.
      lockfile_type:
        type: string
        description: Infer from the conventional filename, or explicitly select a supported lockfile type.
        default: package-lock
        enum:
          - ""
          - package-lock
          - npm-shrinkwrap
          - pnpm
          - cargo
        optional: true
      scope:
        type: string
        description: Locked declarations, or npm/pnpm direct production dependencies. No claim about installed state.
        default: all-locked
        enum:
          - all-locked
          - direct-production
        optional: true
    result_from:
      - generate
    steps:
      - id: digest
        tool: data.digest
        inputs:
          value: $input.lockfile
      - id: inventory
        tool:
          module: inventory.mjs
          export: normalize
        inputs:
          lockfile: $input.lockfile
          source_digest: $steps.digest.digest_result.digest
          lockfile_type: $input.lockfile_type
          scope: $input.scope
        outputs:
          inventory: {type: object, packet: runx/sbom-generate.inventory.v1}
      - id: generate
        skill: .#from-inventory
        inputs:
          inventory: $steps.inventory.inventory
  from-inventory:
    description: Render a previously completed inventory without reading or parsing the source again.
    inputs:
      inventory:
        description: Completed shared lockfile inventory.
        packet: runx/sbom-generate.inventory.v1
    result_from:
      - make
    steps:
      - id: digest
        tool: data.digest
        inputs:
          value: $input.inventory
      - id: make
        tool:
          module: sbom-generate.mjs
          export: makeSbom
        inputs:
          inventory: $input.inventory
          inventory_digest: $steps.digest.digest_result.digest
        outputs:
          inventory: {type: object, packet: runx/sbom-generate.inventory.v1}
          sbom_result: {type: object, packet: runx/sbom-generate.sbom.v1}
  save:
    description: Write only the CycloneDX document to a new workspace file; never overwrite an existing file.
    inputs:
      sbom_result:
        description: Previously completed SBOM report.
        packet: runx/sbom-generate.sbom.v1
      path:
        type: string
        description: New workspace-relative output filename, normally sbom.cdx.json.
      repo_root:
        type: string
        description: Authorized workspace root.
        default: .
        optional: true
    result_from:
      - write
    steps:
      - id: render
        tool:
          module: sbom-generate.mjs
          export: renderDocument
        inputs:
          sbom_result: $input.sbom_result
        outputs:
          contents: {type: string}
      - id: write
        tool: fs.write
        inputs:
          repo_root: $input.repo_root
          path: $input.path
          contents: $steps.render.contents
          create: true
