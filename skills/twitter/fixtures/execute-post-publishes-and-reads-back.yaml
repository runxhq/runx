name: execute-post-publishes-and-reads-back
kind: skill
target: ..
runner: execute
operator_journeys:
  - mode: standalone
    confusors: [message-send, moltbook]
    request: Run the next batch of this approved posting plan.
    expected_outcome: Publish the next post alone under its own approval, confirm it by reading it back, and advance the cursor past it.
    prior_evidence:
      - The approved plan, its digest, and the empty execution ledger supplied in the fixture.
    must_not_repeat:
      - Do not publish the post again once the readback confirms it.
      - Do not take the following like into the same batch.
setup:
  credentials: [twitter]
env:
  TWITTER_USER_AUTH: '{"consumer_key":"harness-consumer","consumer_secret":"harness-secret","access_token":"harness-access","access_secret":"harness-access-secret"}'
inputs:
  plan_json:
    decision: ready
    objective: Announce the release and thank the first reviewer.
    principal: account:@example
    acts:
      - { act_id: act-post-1, kind: post, params: { text: Runx 0.5 is out. }, consequence: public_send, rationale: Release announcement. }
      - { act_id: act-like-1, kind: like, params: { post_id: "5001" }, consequence: live_mutation, rationale: Thank the first reviewer. }
    gates: { human_approval_required: true, approval_id: approval:granted }
  plan_digest: sha256:87a42900aefb308c10af4ce8319a97624cb160444980ce4057d951317b8f6d94
  data_source_uri: tenant://twitter/sqlite-post

caller:
  http_exchanges:
    - request:
        method: GET
        url: https://api.x.com/2/users/me?user.fields=created_at%2Cdescription%2Cpublic_metrics
        body: none
      response:
        status: 200
        headers: { content-type: application/json }
        body: '{"data":{"id":"42","username":"example","name":"Example","description":"","public_metrics":{"followers_count":1,"following_count":1,"tweet_count":1}}}'
    - request:
        method: POST
        url: https://api.x.com/2/tweets
        body:
          json: { text: Runx 0.5 is out. }
      response:
        status: 201
        headers: { content-type: application/json }
        body: '{"data":{"id":"6001","text":"Runx 0.5 is out.","edit_history_tweet_ids":["6001"]}}'
    - request:
        method: GET
        url: https://api.x.com/2/tweets/6001
        body: none
      response:
        status: 200
        headers: { content-type: application/json }
        body: '{"data":{"id":"6001","text":"Runx 0.5 is out.","edit_history_tweet_ids":["6001"]}}'
  approvals:
    "request": true
expect:
  status: sealed
  steps: [saved, resolve, ledger, digest, prepare, remember, self, bind, request, apply, persist]
  step_outputs:
    request:
      subset:
        provider_operation:
          data:
            status: success
            provider: twitter
            operation: post.create
            finality: confirmed
            operation_id: "6001"
            result:
              post: { id: "6001", text: Runx 0.5 is out. }
    apply:
      subset:
        twitter_execution:
          data:
            decision: partial
            next_act_index: 1
            remaining_count: 1
            results:
              - { act_id: act-post-1, kind: post, consequence: public_send, status: done, external_id: "6001", detail: null }
            ledger_delta:
              account_id: "42"
              decision: partial
              next_act_index: 1
              batch: { start_act_index: 0, selected_act_count: 1, processed_act_count: 1, succeeded_act_count: 1, failed_act_count: 0, rate_limited: false }
  receipt: { schema: runx.receipt.v1, state: sealed }
metadata: { public_skill: twitter, source_case: execute-post-confirmed, source: skills-fixture }
