minimum_runx: 0.12.0
catalog:
  visibility: internal
methods:
  run:
    inputs:
      plan_json: {type: object}
    result_from: [complete]
    steps:
    - id: digest
      tool: data.digest
      inputs:
        value: $input.plan_json
    - id: batch1
      skill: ../..#execute
      inputs:
        plan_digest: $steps.digest.digest_result.digest
        max_acts: 1
        plan_json: $input.plan_json
    - id: status1
      skill: ../..#status
      inputs:
        plan_digest: $steps.digest.digest_result.digest
        max_acts: 1
    - id: batch2
      skill: ../..#execute
      inputs:
        plan_digest: $steps.digest.digest_result.digest
        max_acts: 1
    - id: status2
      skill: ../..#status
      inputs:
        plan_digest: $steps.digest.digest_result.digest
        max_acts: 1
    - id: batch3
      skill: ../..#execute
      inputs:
        plan_digest: $steps.digest.digest_result.digest
        max_acts: 1
    - id: status3
      skill: ../..#status
      inputs:
        plan_digest: $steps.digest.digest_result.digest
        max_acts: 1
    - id: batch4
      skill: ../..#execute
      inputs:
        plan_digest: $steps.digest.digest_result.digest
        max_acts: 1
    - id: status4
      skill: ../..#status
      inputs:
        plan_digest: $steps.digest.digest_result.digest
        max_acts: 1
    - id: recent
      skill: ../..#recent
      inputs: {}
    - id: complete
      skill: ../..#execute
      inputs:
        plan_digest: $steps.digest.digest_result.digest
