name: read-archive-audit
kind: skill
target: ..
runner: read-archive
operator_journeys:
  - mode: standalone
    confusors: [content-pipeline, message-send]
    request: Audit the posts in this local X archive and return bounded account evidence.
    expected_outcome: Normalize and digest the admitted archive once, then return a truthful read-only audit result.
  - mode: composed
    request: Continue account analysis from this admitted X archive artifact.
    expected_outcome: Reuse the local archive and query without refetching the live account or renormalizing downstream.
    prior_evidence:
      - The admitted archive file, query, and item limit supplied in the fixture.
    must_not_repeat:
      - Do not query the live X provider.
      - Do not reread the archive downstream when its digest-bound result exists.
inputs:
  query: posts
  archive_file: fixtures/data/archive-tweets.js
  archive_base: skill
  max_items: 10
expect:
  status: sealed
  steps: [prepare, normalize, digest, finalize]
  step_outputs:
    finalize:
      subset:
        twitter_evidence:
          data:
            decision: ok
            source: archive
            item_count: 5
            truncated: false
  receipt:
    schema: runx.receipt.v1
metadata:
  public_skill: twitter
  source_case: read-archive-audit
  source: skills-fixture
