      status: 201
      headers:
        content-type: application/json
      body: '{"data":{"id":"6002","text":"Second part."}}'
  - request:
      method: GET
      url: https://api.x.com/2/tweets/6002
      body: none
    response:
      status: 200
      headers:
        content-type: application/json
      body: '{"data":{"id":"6002","text":"Second part."}}'
  - request:
      method: GET
      url: https://api.x.com/2/users/me?user.fields=created_at%2Cdescription%2Cpublic_metrics
      body: none
    response:
      status: 200
      headers:
        content-type: application/json
      body: '{"data":{"id":"42","username":"example","name":"Example","description":"","public_metrics":{"followers_count":1,"following_count":2,"tweet_count":1}}}'
