          text: First part.
    response:
      status: 201
      headers:
        content-type: application/json
      body: '{"data":{"id":"6001","text":"First part."}}'
  - request:
      method: GET
      url: https://api.x.com/2/tweets/6001
      body: none
    response:
      status: 200
