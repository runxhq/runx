skill: twitter
version: "0.5.0"
catalog:
  kind: skill
  audience: public
  visibility: public
  role: branded
  canonical_skill: runx/send-as
  provider: twitter
  runtime_path: twitter
  execution: read
  completion: provider_readback
  requires_adapter: true
  approval: none
  category: growth
connectors:
  twitter:
    operations: [account.snapshot, account.posts.read, account.mentions.read, account.following.read, account.followers.read, posts.read, mentions.read, following.read, followers.read, posts.search, post.create, post.reply, post.quote, posts.delete, users.unfollow, users.follow, users.mute, users.block, posts.like, posts.repost]
runners:
  read:
    default: true
    inputs:
      query:
        type: string
        required: true
        description: "Evidence query kind: snapshot, posts, mentions, search, following, or followers."
        schema: { enum: [snapshot, posts, mentions, search, following, followers] }
      params:
        type: object
        required: false
        description: "Query parameters: user_id (another account; the authenticated account when absent), q (search text), pagination_token (where an earlier read stopped)."
        schema:
          additionalProperties: false
          properties:
            user_id: { type: string, minLength: 1 }
            q: { type: string, minLength: 1 }
            pagination_token: { type: string, minLength: 1 }
      max_items:
        type: integer
        required: false
        default: 200
        description: Items to read across pages. Pages are whole, so a read may return up to one page (99 items) more; next_cursor says where the next read starts.
        schema: { minimum: 1, maximum: 10000 }
    examples:
      - query: snapshot
        max_items: 200
    result_from: [finalize, blocked]
    steps:
      - id: prepare
        inputs:
          query: "$input.query"
          params: "$input.params"
          source: live
          max_items: "$input.max_items"
        tool: { module: twitter-read.mjs, export: prepareRead }
        outputs:
          twitter_read_plan: object
      - id: request
        when:
          field: prepare.twitter_read_plan.decision
          equals: live
        operation: twitter
        context:
          operation: prepare.twitter_read_plan.connector_operation
          input: prepare.twitter_read_plan.provider_input
      - id: normalize
        when:
          field: prepare.twitter_read_plan.decision
          equals: live
        context:
          read_plan: prepare.twitter_read_plan
          provider_operation: request.provider_operation.data
        tool: { module: twitter-read.mjs, export: normalizeRead }
        outputs:
          twitter_read_result: object
      - id: digest
        when:
          field: prepare.twitter_read_plan.decision
          equals: live
        tool: data.digest
        context:
          value: normalize.twitter_read_result.items
      - id: finalize
        when:
          field: prepare.twitter_read_plan.decision
          equals: live
        context:
          read_result: normalize.twitter_read_result
          digest_result: digest.digest_result.data
        tool: { module: twitter-read.mjs, export: finalizeRead }
        outputs:
          twitter_evidence:
            type: object
            schema:
              required: [decision, source, query, account, items, item_count, truncated, next_cursor, provenance, blockers]
              additionalProperties: false
              properties:
                decision: { type: string, enum: [ok, needs_input] }
                source: { type: string, enum: [live, archive] }
                query:
                  type: object
                  required: [kind]
                  maxProperties: 2
                  properties:
                    kind: { type: string, enum: [snapshot, posts, mentions, search, following, followers] }
                    params: { type: object, maxProperties: 50 }
                account: { type: [object, 'null'], maxProperties: 5 }
                items:
                  type: array
                  maxItems: 10099
                  items:
                    oneOf:
                      - type: object
                        required: [id, text, created_at, metrics, has_link, in_reply_to]
                        additionalProperties: false
                        properties:
                          id: { type: [string, integer] }
                          text: { type: string }
                          created_at: { type: [string, 'null'] }
                          metrics:
                            type: object
                            required: [likes, reposts, replies, quotes, impressions]
                            additionalProperties: false
                            properties:
                              likes: { type: number }
                              reposts: { type: number }
                              replies: { type: [number, 'null'] }
                              quotes: { type: [number, 'null'] }
                              impressions: { type: [number, 'null'] }
                          has_link: { type: boolean }
                          in_reply_to: { type: [string, integer, 'null'] }
                      - type: object
                        required: [id, username, name, description, metrics]
                        additionalProperties: false
                        properties:
                          id: { type: [string, integer] }
                          username: { type: [string, 'null'] }
                          name: { type: [string, 'null'] }
                          description: { type: string }
                          metrics:
                            type: [object, 'null']
                            required: [followers, following, posts]
                            additionalProperties: false
                            properties:
                              followers: { type: number }
                              following: { type: number }
                              posts: { type: number }
                item_count: { type: integer, minimum: 0, maximum: 10099 }
                truncated: { type: boolean }
                next_cursor: { type: [string, 'null'], minLength: 1, maxLength: 512 }
                provenance:
                  type: object
                  required: [retrieved_via, content_digest]
                  additionalProperties: false
                  properties:
                    retrieved_via: { type: string, maxLength: 4000 }
                    content_digest: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
                blockers: { type: array, maxItems: 100, items: { type: string, minLength: 1, maxLength: 4000 } }
        artifacts:
          named_emits:
            twitter_evidence: twitter_evidence
          packets:
            twitter_evidence: twitter.evidence.v1
      - id: blocked
        when:
          field: prepare.twitter_read_plan.decision
          not_equals: live
        context:
          read_plan: prepare.twitter_read_plan
        tool: { module: twitter-read.mjs, export: blockedRead }
        outputs:
          twitter_evidence: object
        artifacts:
          named_emits:
            twitter_evidence: twitter_evidence
          packets:
            twitter_evidence: twitter.evidence.v1
  read-archive:
    inputs:
      query:
        type: string
        required: true
        description: "Archive query kind: posts, following, or followers."
        schema: { enum: [posts, following, followers] }
      archive_file:
        type: string
        required: true
        description: Relative path to an X archive export file.
      archive_base:
        type: string
        required: false
        default: workspace
        description: "Archive path base: workspace or skill."
        schema: { enum: [workspace, skill] }
      max_items:
        type: integer
        required: false
        default: 200
        description: Maximum items returned from the archive.
        schema: { minimum: 1, maximum: 10000 }
    examples:
      - query: posts
        archive_file: fixtures/data/archive-tweets.js
        archive_base: skill
        max_items: 10
    result_from: [finalize]
    steps:
      - id: prepare
        inputs:
          query: "$input.query"
          archive_file: "$input.archive_file"
          source: archive
          max_items: "$input.max_items"
        tool: { module: twitter-read.mjs, export: prepareRead }
        outputs:
          twitter_read_plan: object
      - id: normalize
        scopes:
          - fs.read
        inputs:
          archive_file: "$input.archive_file"
          archive_base: "$input.archive_base"
        context:
          read_plan: prepare.twitter_read_plan
        tool: { module: twitter-read.mjs, export: normalizeArchivePage, pages: { path_from: archive_file, path_scope_from: archive_base, media_type: application/javascript, framing: json_array, page_bytes: 524288 } }
        outputs:
          twitter_read_result: object
      - id: digest
        tool: data.digest
        context:
          value: normalize.twitter_read_result.items
      - id: finalize
        context:
          read_result: normalize.twitter_read_result
          digest_result: digest.digest_result.data
        tool: { module: twitter-read.mjs, export: finalizeRead }
        outputs:
          twitter_evidence: object
        artifacts:
          named_emits:
            twitter_evidence: twitter_evidence
          packets:
            twitter_evidence: twitter.evidence.v1
  plan:
    inputs:
      objective:
        type: string
        required: true
        description: One bounded objective for this plan.
      principal:
        type: string
        required: true
        description: The account being operated, for example account:@handle.
      evidence_json:
        type: object
        required: false
        description: A twitter.evidence.v1 packet (or excerpt) grounding the plan; required for any act that references existing posts or users.
        schema:
          properties:
            source: { type: string, enum: [live, archive] }
            query:
              type: object
              required: [kind]
              properties:
                kind: { type: string, enum: [snapshot, posts, mentions, search, following, followers] }
                params: { type: object, maxProperties: 50, additionalProperties: true }
              additionalProperties: false
            items:
              type: array
              maxItems: 10099
              items: { type: object, additionalProperties: true }
            item_count: { type: integer, minimum: 0, maximum: 10099 }
          additionalProperties: true
      operator_policy:
        type: string
        required: false
        description: Operator constraints such as prune criteria, posting cadence, or content boundaries.
      brand_context:
        type: object
        required: false
        description: Brand-voice or taste-profile packet excerpt for public content.
        schema:
          properties:
            schema: { type: string, minLength: 1, maxLength: 256 }
            data: { type: object, additionalProperties: true }
          additionalProperties: true
      operator_context:
        type: string
        required: false
        description: Extra operator guardrails.
    examples:
      - objective: Delete zero-engagement posts from before 2019.
        principal: account:@example
        evidence_json:
          source: archive
          query: { kind: posts }
          items:
            - id: '1001'
              text: Old test post
              created_at: Mon Apr 03 14:00:00 +0000 2017
              metrics: { likes: 0, reposts: 0 }
        operator_policy: Keep anything with likes or reposts.
    result_from: [draft, digest]
    steps:
      - id: draft
        inputs:
          objective: "$input.objective"
          principal: "$input.principal"
          evidence_json: "$input.evidence_json"
          operator_policy: "$input.operator_policy"
          brand_context: "$input.brand_context"
          operator_context: "$input.operator_context"
        agent: { role: builder, task: twitter-plan }
        outputs:
          twitter_plan:
            type: object
            schema:
              required: [decision, objective, principal, acts, gates, evidence_refs, open_questions, blockers, success_checkpoint]
              additionalProperties: false
              properties:
                decision: { type: string, enum: [ready, needs_input, reject] }
                objective: { type: string, minLength: 1, maxLength: 4000 }
                principal: { type: string, minLength: 1, maxLength: 512 }
                acts:
                  type: array
                  maxItems: 50
                  items:
                    type: object
                    required: [act_id, kind, params, consequence, rationale]
                    additionalProperties: false
                    properties:
                      act_id: { type: string, pattern: '^act-[A-Za-z0-9._:-]+$' }
                      kind: { type: string, enum: [post, reply, quote, thread, delete_post, unfollow, follow, mute, block, like, repost] }
                      params: { type: object, minProperties: 1, additionalProperties: true }
                      consequence: { type: string, minLength: 1, maxLength: 256 }
                      rationale: { type: string, minLength: 1, maxLength: 4000 }
                gates:
                  type: object
                  required: [human_approval_required, approval_ref]
                  additionalProperties: false
                  properties:
                    human_approval_required: { const: true }
                    approval_ref: { type: [string, 'null'] }
                evidence_refs:
                  type: array
                  maxItems: 100
                  items: { type: string, minLength: 1, maxLength: 2048 }
                context_bindings:
                  type: array
                  maxItems: 20
                  items:
                    type: object
                    required: [packet_digest, applied_rules]
                    additionalProperties: false
                    properties:
                      packet_digest: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
                      applied_rules:
                        type: array
                        maxItems: 100
                        items: { type: string, minLength: 1, maxLength: 4000 }
                open_questions:
                  type: array
                  maxItems: 100
                  items: { type: string, minLength: 1, maxLength: 4000 }
                blockers:
                  type: array
                  maxItems: 100
                  items: { type: string, minLength: 1, maxLength: 4000 }
                success_checkpoint:
                  type: object
                  required: [milestone, description]
                  additionalProperties: false
                  properties:
                    milestone: { type: string, minLength: 1, maxLength: 256 }
                    description: { type: string, minLength: 1, maxLength: 4000 }
        artifacts:
          wrap_as: twitter_plan
          packet: twitter.plan.v1
      - id: digest
        tool: data.digest
        context:
          value: draft.twitter_plan.data
  select:
    inputs:
      objective:
        type: string
        required: true
        description: One bounded objective for this bulk selection.
      principal:
        type: string
        required: true
        description: The account being operated, for example account:@handle.
      target:
        type: string
        required: false
        default: posts
        description: "What the selection operates over: posts (tweets.js, delete) or users (following.js, unfollow)."
        schema: { enum: [posts, users] }
      archive_file:
        type: string
        required: false
        description: Path to an X tweets.js archive export; required for target posts.
      archive_base:
        type: string
        required: false
        default: workspace
        description: "Archive path base: workspace or skill."
        schema: { enum: [workspace, skill] }
      following_file:
        type: string
        required: false
        description: Path to an X following.js archive export; required for target users.
      followers_file:
        type: string
        required: false
        description: Path to an X follower.js archive export; required for the non_mutual predicate.
      predicate:
        type: object
        required: true
        description: "Typed selection predicate. Posts: rt_of, is_retweet, text_prefix, text_contains, max_likes, max_reposts, before_year, after_year. Users: non_mutual (true), user_ids. Every supplied field must match."
        schema:
          minProperties: 1
          additionalProperties: false
          properties:
            rt_of: { type: string, minLength: 1 }
            is_retweet: { type: boolean }
            text_prefix: { type: string, minLength: 1 }
            text_contains: { type: string, minLength: 1 }
            max_likes: { type: integer, minimum: 0 }
            max_reposts: { type: integer, minimum: 0 }
            before_year: { type: integer, minimum: 2006, maximum: 9999 }
            after_year: { type: integer, minimum: 2006, maximum: 9999 }
            non_mutual: { const: true }
            user_ids:
              type: array
              minItems: 1
              uniqueItems: true
              items: { type: string, minLength: 1 }
      max_acts:
        type: integer
        required: false
        default: 5000
        description: Cap on selected acts; a larger match set is flagged truncated.
        schema: { minimum: 1 }
    examples:
      - objective: Delete all reposts of the BetaList account.
        principal: account:@example
        target: posts
        archive_file: fixtures/data/archive-tweets.js
        archive_base: skill
        predicate: { is_retweet: true, rt_of: BetaList }
        max_acts: 5000
    result_from: [finalize-posts, finalize-users]
    steps:
      - id: prepare
        inputs:
          target: "$input.target"
          archive_file: "$input.archive_file"
          following_file: "$input.following_file"
          followers_file: "$input.followers_file"
          predicate: "$input.predicate"
        tool: { module: twitter-selection.mjs, export: prepareSelection }
        outputs:
          twitter_selection_plan: object
      - id: read-users
        tool: fs.read_bundle
        scopes:
          - fs.read
        when:
          field: prepare.twitter_selection_plan.target
          equals: users
        inputs:
          path_scope: "$input.archive_base"
        context:
          paths: prepare.twitter_selection_plan.paths
      - id: select-posts
        scopes:
          - fs.read
        inputs:
          objective: "$input.objective"
          principal: "$input.principal"
          predicate: "$input.predicate"
          max_acts: "$input.max_acts"
          archive_file: "$input.archive_file"
          archive_base: "$input.archive_base"
        context:
          selection_plan: prepare.twitter_selection_plan
        when:
          field: prepare.twitter_selection_plan.target
          equals: posts
        tool: { module: twitter-selection.mjs, export: selectArchivePage, pages: { path_from: archive_file, path_scope_from: archive_base, media_type: application/javascript, framing: json_array, page_bytes: 524288 } }
        outputs:
          twitter_selection_draft: object
      - id: select-users
        inputs:
          objective: "$input.objective"
          principal: "$input.principal"
          predicate: "$input.predicate"
          max_acts: "$input.max_acts"
        context:
          selection_plan: prepare.twitter_selection_plan
          file_read_bundle: read-users.file_read_bundle.data
        when:
          field: prepare.twitter_selection_plan.target
          equals: users
        tool: { module: twitter-selection.mjs, export: selectUsersArchive }
        outputs:
          twitter_selection_draft: object
      - id: digest-posts
        tool: data.digest
        when:
          field: prepare.twitter_selection_plan.target
          equals: posts
        context:
          value: select-posts.twitter_selection_draft.twitter_plan
      - id: finalize-posts
        when:
          field: prepare.twitter_selection_plan.target
          equals: posts
        context:
          twitter_selection_draft: select-posts.twitter_selection_draft
          digest_result: digest-posts.digest_result.data
        tool: { module: twitter-selection.mjs, export: bindSelectionDigest }
        outputs:
          twitter_selection:
            type: object
            schema:
              required: [decision, objective, principal, source, predicate, matched, scanned, truncated, twitter_plan, plan_digest, blockers]
              additionalProperties: false
              properties:
                decision: { type: string, enum: [ready, needs_input] }
                objective: { type: string, maxLength: 10000 }
                principal: { type: string, maxLength: 1000 }
                source: { type: string, enum: [archive, users_archive] }
                predicate: { type: object, minProperties: 1, maxProperties: 10 }
                matched: { type: integer, minimum: 0 }
                scanned: { type: integer, minimum: 0 }
                truncated: { type: boolean }
                twitter_plan:
                  type: [object, 'null']
                  required: [decision, objective, principal, acts, gates, evidence_refs, open_questions, blockers, success_checkpoint]
                  additionalProperties: false
                  properties:
                    decision: { const: ready }
                    objective: { type: string, minLength: 1, maxLength: 10000 }
                    principal: { type: string, minLength: 1, maxLength: 1000 }
                    acts:
                      type: array
                      maxItems: 5000
                      items:
                        type: object
                        required: [act_id, kind, params, consequence, rationale]
                        additionalProperties: false
                        properties:
                          act_id: { type: string, pattern: '^act-[A-Za-z0-9._:-]+$' }
                          kind: { type: string, enum: [delete_post, unfollow] }
                          params: { type: object, minProperties: 1, maxProperties: 5 }
                          consequence: { const: live_mutation }
                          rationale: { type: string, minLength: 1, maxLength: 4000 }
                    gates:
                      type: object
                      required: [human_approval_required, approval_ref]
                      additionalProperties: false
                      properties:
                        human_approval_required: { const: true }
                        approval_ref: { const: 'approval:pending' }
                    evidence_refs: { type: array, maxItems: 10, items: { type: string, minLength: 1, maxLength: 4000 } }
                    open_questions: { type: array, maxItems: 100, items: { type: string, minLength: 1, maxLength: 4000 } }
                    blockers: { type: array, maxItems: 100, items: { type: string, minLength: 1, maxLength: 4000 } }
                    success_checkpoint:
                      type: object
                      required: [milestone, description]
                      additionalProperties: false
                      properties:
                        milestone: { const: bulk_plan_ready_for_approval }
                        description: { type: string, minLength: 1, maxLength: 4000 }
                plan_digest: { type: string, pattern: '^(?:sha256:[0-9a-f]{64})?$' }
                blockers: { type: array, maxItems: 100, items: { type: string, minLength: 1, maxLength: 4000 } }
        artifacts:
          named_emits:
            twitter_selection: twitter_selection
          packets:
            twitter_selection: twitter.selection.v1
      - id: digest-users
        tool: data.digest
        when:
          field: prepare.twitter_selection_plan.target
          equals: users
        context:
          value: select-users.twitter_selection_draft.twitter_plan
      - id: finalize-users
        when:
          field: prepare.twitter_selection_plan.target
          equals: users
        context:
          twitter_selection_draft: select-users.twitter_selection_draft
          digest_result: digest-users.digest_result.data
        tool: { module: twitter-selection.mjs, export: bindSelectionDigest }
        outputs:
          twitter_selection: object
        artifacts:
          named_emits:
            twitter_selection: twitter_selection
          packets:
            twitter_selection: twitter.selection.v1
  execute:
    act:
      purpose: Execute one approved twitter act plan, batch by batch, and nothing beyond it.
    inputs:
      plan_json:
        type: object
        required: true
        description: The twitter.plan.v1 object to execute.
        schema:
          required: [decision, principal, acts, gates]
          additionalProperties: false
          properties:
            decision: { type: string, enum: [ready, needs_input, reject, refused] }
            objective: { type: string, minLength: 1, maxLength: 4000 }
            principal: { type: string, minLength: 1, maxLength: 512 }
            acts:
              type: array
              maxItems: 5000
              items:
                type: object
                required: [act_id, kind, params, consequence, rationale]
                additionalProperties: false
                properties:
                  act_id: { type: string, pattern: '^act-[A-Za-z0-9._:-]+$' }
                  kind: { type: string, enum: [post, reply, quote, thread, delete_post, unfollow, follow, mute, block, like, repost] }
                  params: { type: object, minProperties: 1, additionalProperties: true }
                  consequence: { type: string, minLength: 1, maxLength: 256 }
                  rationale: { type: string, minLength: 1, maxLength: 4000 }
            gates:
              type: object
              required: [human_approval_required]
              properties:
                human_approval_required: { const: true }
                approval_ref: { type: [string, 'null'] }
              additionalProperties: false
            evidence_refs: { type: array, maxItems: 100, items: { type: string, minLength: 1, maxLength: 2048 } }
            context_bindings:
              type: array
              maxItems: 20
              items:
                type: object
                required: [packet_digest, applied_rules]
                additionalProperties: false
                properties:
                  packet_digest: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
                  applied_rules: { type: array, maxItems: 100, items: { type: string, minLength: 1, maxLength: 4000 } }
            open_questions: { type: array, maxItems: 100, items: { type: string, minLength: 1, maxLength: 4000 } }
            blockers: { type: array, maxItems: 100, items: { type: string, minLength: 1, maxLength: 4000 } }
            success_checkpoint:
              type: object
              required: [milestone, description]
              additionalProperties: false
              properties:
                milestone: { type: string, minLength: 1, maxLength: 256 }
                description: { type: string, minLength: 1, maxLength: 4000 }
      plan_digest:
        type: string
        required: true
        description: Expected canonical digest of plan_json; a mismatch is a hard failure.
      max_acts:
        type: integer
        required: false
        default: 50
        description: Acts one batch may take; a batch is one published act or a run of up to 50 acts of one kind.
        schema: { minimum: 1, maximum: 50 }
      data_source_ref:
        type: string
        required: true
        description: Logical data source holding the execution ledger; the operator binds it to durable local SQLite.
      expected_version:
        type: integer
        required: true
        description: Current durable stream version. The runner independently reads and verifies it before any provider call.
        schema: { minimum: 0 }
      idempotency_key:
        type: string
        required: true
        description: Canonical retry key twitter:<plan_digest>:v<expected_version+1>; mismatches fail before approval.
    examples:
      - plan_json:
          decision: refused
          objective: Delete one post.
          principal: account:@example
          acts:
            - act_id: act-refused-1
              kind: delete_post
              params: { post_id: '1001' }
              consequence: live_mutation
              rationale: This refusal example never reaches the provider.
          gates: { human_approval_required: true, approval_ref: approval:granted }
        plan_digest: sha256:25cd0a74139936a7cad4124f4ef510f7b16aaaa49abced92f39f4fc5c7cfbfc6
        max_acts: 50
        data_source_ref: tenant://twitter/refused-plan
        expected_version: 0
        idempotency_key: twitter:sha256:25cd0a74139936a7cad4124f4ef510f7b16aaaa49abced92f39f4fc5c7cfbfc6:v1
    result_from: [apply, apply_noop, persist]
    steps:
      - id: ledger
        skill: ../data-store
        runner: read_events
        inputs:
          data_source_ref: "$input.data_source_ref"
          resource: twitter_execution
          aggregate_id: "$input.plan_digest"
          limit: 1
      - id: digest
        tool: data.digest
        inputs:
          value: "$input.plan_json"
      - id: prepare
        inputs:
          plan_json: "$input.plan_json"
          plan_digest: "$input.plan_digest"
          expected_version: "$input.expected_version"
          idempotency_key: "$input.idempotency_key"
          max_acts: "$input.max_acts"
        context:
          digest_result: digest.digest_result.data
          execution_ledger: ledger.data_operation_result.data
        tool: { module: twitter-execution.mjs, export: prepareExecution }
        outputs:
          twitter_execution_plan: object
      - id: self
        when:
          field: prepare.twitter_execution_plan.decision
          equals: ready
        operation: twitter/account.snapshot
        result_fields: [account]
        input: {}
      - id: bind
        when:
          field: prepare.twitter_execution_plan.decision
          equals: ready
        context:
          execution_plan: prepare.twitter_execution_plan
          account: self.provider_operation.data.result.account
        tool: { module: twitter-execution.mjs, export: bindExecution }
        outputs:
          twitter_call: object
      - id: request
        when:
          field: prepare.twitter_execution_plan.decision
          equals: ready
        operation: twitter
        idempotency_key: "$input.idempotency_key"
        context:
          operation: bind.twitter_call.operation
          input: bind.twitter_call.input
          approval: bind.twitter_call.approval
      - id: apply
        when:
          field: prepare.twitter_execution_plan.decision
          equals: ready
        context:
          execution_plan: prepare.twitter_execution_plan
          provider_operation: request.provider_operation.data
          account_id: bind.twitter_call.account_id
        tool: { module: twitter-execution-result.mjs, export: finalizeExecution }
        outputs:
          twitter_execution:
            type: object
            schema:
              required: [decision, plan_digest, principal, next_act_index, total_act_count, remaining_count, active_thread, results, ledger_delta, rate, blockers, success_checkpoint]
              additionalProperties: false
              properties:
                decision: { type: string, enum: [executed, partial, stopped, refused, noop] }
                plan_digest: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
                principal: { type: [string, 'null'], maxLength: 1000 }
                next_act_index: { type: integer, minimum: 0 }
                total_act_count: { type: integer, minimum: 0 }
                remaining_count: { type: integer, minimum: 0 }
                active_thread:
                  type: [object, 'null']
                  required: [act_index, next_segment_index, in_reply_to]
                  additionalProperties: false
                  properties:
                    act_index: { type: integer, minimum: 0 }
                    next_segment_index: { type: integer, minimum: 1 }
                    in_reply_to: { type: string, minLength: 1, maxLength: 1000 }
                results:
                  type: array
                  maxItems: 50
                  items:
                    type: object
                    required: [act_id, kind, consequence, status, provider_ref, detail]
                    additionalProperties: false
                    properties:
                      act_id: { type: string, minLength: 1, maxLength: 1000 }
                      kind: { type: string, minLength: 1, maxLength: 100 }
                      consequence: { type: string, minLength: 1, maxLength: 100 }
                      status: { type: string, enum: [done, failed] }
                      provider_ref: { type: [string, 'null'], maxLength: 4000 }
                      detail: { type: [string, 'null'], maxLength: 4000 }
                ledger_delta:
                  type: [object, 'null']
                  required: [schema, type, plan_digest, account_id, decision, next_act_index, total_act_count, active_thread, batch]
                  additionalProperties: false
                  properties:
                    schema: { const: twitter.execution.progress.v1 }
                    type: { const: twitter.execution.progress }
                    plan_digest: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
                    account_id: { type: string, pattern: '^[0-9]{1,19}$' }
                    decision: { type: string, enum: [executed, partial, stopped] }
                    next_act_index: { type: integer, minimum: 0 }
                    total_act_count: { type: integer, minimum: 0 }
                    active_thread: { type: [object, 'null'], maxProperties: 3 }
                    batch:
                      type: object
                      required: [start_act_index, selected_act_count, completed_act_count, failed, rate_limited]
                      additionalProperties: false
                      properties:
                        start_act_index: { type: integer, minimum: 0 }
                        selected_act_count: { type: integer, minimum: 0, maximum: 50 }
                        completed_act_count: { type: integer, minimum: 0, maximum: 50 }
                        failed: { type: boolean }
                        rate_limited: { type: boolean }
                rate:
                  type: object
                  required: [limited, remaining, reset_at]
                  additionalProperties: false
                  properties:
                    limited: { type: boolean }
                    remaining: { type: number }
                    reset_at: { type: [string, 'null'] }
                blockers: { type: array, maxItems: 250, items: { type: string, minLength: 1, maxLength: 4000 } }
                success_checkpoint:
                  type: object
                  required: [milestone, description]
                  additionalProperties: false
                  properties:
                    milestone: { type: string, enum: [plan_fully_executed, plan_partially_executed, plan_refused] }
                    description: { type: string, minLength: 1, maxLength: 4000 }
        artifacts:
          named_emits:
            twitter_execution: twitter_execution
          packets:
            twitter_execution: twitter.execution.v1
      - id: apply_noop
        when:
          field: prepare.twitter_execution_plan.decision
          not_equals: ready
        context:
          execution_plan: prepare.twitter_execution_plan
        tool: { module: twitter-execution-result.mjs, export: finalizeExecution }
        outputs:
          twitter_execution: object
        artifacts:
          named_emits:
            twitter_execution: twitter_execution
          packets:
            twitter_execution: twitter.execution.v1
      - id: persist
        skill: ../data-store
        runner: append_event
        scopes:
          - runx:data:append
        when:
          field: prepare.twitter_execution_plan.decision
          equals: ready
        inputs:
          data_source_ref: "$input.data_source_ref"
          resource: twitter_execution
        context:
          aggregate_id: prepare.twitter_execution_plan.plan_digest
          expected_version: prepare.twitter_execution_plan.expected_version
          idempotency_key: prepare.twitter_execution_plan.idempotency_key
          event: apply.twitter_execution.data.ledger_delta
