                            minimum: 0
                          failed:
                            type: integer
                            minimum: 0
                      last_failure:
                        type:
                        - object
                        - 'null'
                        required:
                        - act_id
                        - reason
                        - evidence_ref
                        additionalProperties: false
                        properties:
                          act_id:
                            type: string
                            minLength: 1
                            maxLength: 1000
                          reason:
                            type: string
                            minLength: 1
                            maxLength: 4000
                          evidence_ref:
                            type: string
                            minLength: 1
                            maxLength: 4000
                      stop:
                        type:
                        - object
                        - 'null'
                        required:
                        - code
                        - reason
                        - action
                        - retry_at
                        additionalProperties: false
                        properties:
                          code:
                            type: string
                            minLength: 1
                            maxLength: 256
                          reason:
                            type: string
                            minLength: 1
                            maxLength: 4000
                          action:
                            type: string
                            enum:
                            - wait
                            - review
                            - reconcile
                          retry_at:
                            type:
                            - string
                            - 'null'
                            maxLength: 64
                      retry_at: { type: [string, 'null'] }
                next_cursor: { type: [string, 'null'] }
