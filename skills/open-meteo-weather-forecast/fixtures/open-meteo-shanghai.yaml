name: open-meteo-shanghai
kind: skill
target: ..
runner: main
operator_journeys:
  - mode: standalone
    confusors: [nws-weather-forecast, weather-forecast]
    request: Fetch a three-day Open-Meteo forecast for Shanghai.
    expected_outcome: Return bounded global forecast evidence with exact coordinates and provider provenance.
  - mode: composed
    request: Acquire Open-Meteo evidence for these already resolved Shanghai coordinates.
    expected_outcome: Reuse supplied coordinates without geocoding again and return one downstream-ready provider packet.
    prior_evidence:
      - The resolved Shanghai name, latitude, longitude, and horizon supplied in the fixture.
    must_not_repeat:
      - Do not geocode Shanghai again.
      - Do not fetch the forecast again downstream when the evidence packet is present.
inputs:
  name: Shanghai
  latitude: "31.2222"
  longitude: "121.4581"
  forecast_days: "3"
caller:
  http_exchanges:
    - request: { method: GET, url: "https://geocoding-api.open-meteo.com/v1/search?count=5&format=json&language=en&name=Shanghai", body: none }
      response:
        status: 200
        headers: { content-type: application/json }
        body: '{"results":[{"id":1796236,"name":"Shanghai","latitude":31.2222,"longitude":121.4581,"country_code":"CN","timezone":"Asia/Shanghai"}]}'
    - request: { method: GET, url: "https://api.open-meteo.com/v1/forecast?current=temperature_2m%2Capparent_temperature%2Cprecipitation%2Cweather_code%2Cwind_speed_10m&daily=weather_code%2Ctemperature_2m_max%2Ctemperature_2m_min%2Cprecipitation_probability_max&forecast_days=3&latitude=31.2222&longitude=121.4581&timezone=auto", body: none }
      response:
        status: 200
        headers: { content-type: application/json }
        body: '{"latitude":31.2222,"longitude":121.4581,"timezone":"Asia/Shanghai","timezone_abbreviation":"GMT+8","utc_offset_seconds":28800,"current":{"time":"2026-08-10T14:00","temperature_2m":31.2,"apparent_temperature":35.1,"precipitation":0,"weather_code":1,"wind_speed_10m":9.4},"daily":{"time":["2026-08-10","2026-08-11","2026-08-12"],"weather_code":[1,2,3],"temperature_2m_max":[33.1,32.4,31.8],"temperature_2m_min":[25.3,25.1,24.9],"precipitation_probability_max":[10,20,30]}}'
expect:
  status: sealed
  receipt:
    schema: runx.receipt.v1
  steps:
    - locate
    - forecast
  step_outputs:
    forecast:
      subset:
        provider_operation:
          data:
            status: success
            provider: open-meteo
            operation: forecast.read
            transport: local_http
            result:
              forecast:
                timezone: Asia/Shanghai
                timezone_abbreviation: GMT+8
                utc_offset_seconds: 28800
metadata:
  public_skill: open-meteo-weather-forecast
  source_case: open-meteo-shanghai
  source: skills-fixture
