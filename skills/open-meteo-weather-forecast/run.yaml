skill: open-meteo-weather-forecast
version: "0.1.5"

catalog:
  kind: graph
  audience: public
  visibility: public
  role: branded
  canonical_skill: runx/weather-forecast
  provider: open-meteo
  runtime_path: http
  execution: read
  completion: provider_readback
  requires_adapter: false
  approval: none
  category: data

connectors:
  open-meteo:
    operations: [geocode.search, forecast.read, air_quality.read]

runners:
  main:
    default: true
    inputs:
      name:
        type: string
        required: true
        description: City or place name to resolve.
      latitude:
        type: string
        required: true
        description: Decimal latitude selected from the location evidence.
      longitude:
        type: string
        required: true
        description: Decimal longitude selected from the location evidence.
      forecast_days:
        type: string
        required: false
        default: "3"
        description: Number of forecast days to request.
    result_from: [locate, forecast]
    steps:
      - id: locate
        operation: open-meteo/geocode.search
        input:
          name: $input.name
      - id: forecast
        operation: open-meteo/forecast.read
        input:
          latitude: $input.latitude
          longitude: $input.longitude
          forecast_days: $input.forecast_days
  air_quality:
    inputs:
      name:
        type: string
        required: true
        description: City or place name to resolve.
      latitude:
        type: string
        required: true
        description: Decimal latitude selected from the location evidence.
      longitude:
        type: string
        required: true
        description: Decimal longitude selected from the location evidence.
    result_from: [locate, air_quality]
    steps:
      - id: locate
        operation: open-meteo/geocode.search
        input:
          name: $input.name
      - id: air_quality
        operation: open-meteo/air_quality.read
        input:
          latitude: $input.latitude
          longitude: $input.longitude
