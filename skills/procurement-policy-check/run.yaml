version: "0.1.9"
minimum_runx: 0.12.0
catalog:
  visibility: public
  category: payments
methods:
  decide:
    inputs:
      procurement_request:
        type: object
        description: One proposed procurement request with payee, amount, currency, and purpose.
        additionalProperties: false
        properties:
          payee:
            type: string
            minLength: 1
            maxLength: 500
            pattern: \S
          amount:
            type: number
            minimum: 0
          currency:
            type: string
            minLength: 1
            maxLength: 10
            pattern: \S
          purpose:
            type: string
            maxLength: 2000
        required:
          - payee
          - amount
          - currency
      procurement_policy:
        type: object
        description: Explicit procurement authority; missing fields refuse instead of guessing.
        additionalProperties: false
        properties:
          currency:
            type: string
            minLength: 1
            maxLength: 10
            pattern: \S
          remaining_budget:
            type: number
            minimum: 0
          request_cap:
            type: number
            minimum: 0
          approved_payees:
            type: array
            maxItems: 500
            items:
              type: string
              minLength: 1
              maxLength: 500
              pattern: \S
            uniqueItems: true
          approval_threshold:
            type: number
            minimum: 0
          human_lane:
            type: string
            minLength: 1
            maxLength: 200
    examples:
      - procurement_request:
          payee: sourcey
          amount: 125
          currency: USD
          purpose: generate public llms.txt docs
        procurement_policy:
          currency: USD
          remaining_budget: 300
          request_cap: 200
          approved_payees:
            - sourcey
            - runx
          approval_threshold: 200
    result_from:
      - decide
    steps:
      - id: digest-request
        tool: data.digest
        inputs:
          value: $input.procurement_request
      - id: digest-policy
        tool: data.digest
        inputs:
          value: $input.procurement_policy
      - id: decide
        inputs:
          procurement_request: $input.procurement_request
          procurement_policy: $input.procurement_policy
          request_digest: $steps.digest-request.digest_result.digest
          policy_digest: $steps.digest-policy.digest_result.digest
        tool:
          module: procurement-policy-check.mjs
          export: decideProcurement
        outputs:
          procurement_approval:
            type: object
            packet: runx/procurement-policy-check.approval.v1
