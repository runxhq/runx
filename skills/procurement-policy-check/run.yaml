skill: procurement-policy-check
version: "0.1.8"

catalog:
  kind: graph
  audience: operator
  visibility: public
  category: payments
  role: canonical
  execution: read
  completion: runtime_receipt
  approval: none

harness:
  files: [fixtures/support/composed.graph]
  cases:
    - name: procurement-policy-check-approves-in-policy
      operator_journeys:
        - mode: standalone
          confusors: [pay, invoice-pay]
          request: Decide whether this procurement request is allowed under the procurement policy before any money moves.
          expected_outcome: Return an approval decision bound to the exact request and policy digests, with no spend executed.
        - mode: composed
          request: Continue from this already decided procurement approval into the spend flow.
          expected_outcome: Reuse the sealed approval decision without re-deciding policy.
          prior_evidence:
            - The procurement request, procurement policy, and sealed decision supplied by the prior step.
          must_not_repeat:
            - Do not re-derive the policy decision already sealed.
      inputs:
        procurement_request:
          payee: sourcey
          amount: 125
          currency: USD
          purpose: generate public llms.txt docs for a maintained OSS project
        procurement_policy:
          currency: USD
          remaining_budget: 300
          request_cap: 200
          approved_payees: [sourcey, runx]
          approval_threshold: 200
      expect:
        status: sealed
        steps: [digest-request, digest-policy, decide]
        step_outputs:
          decide:
            subset:
              procurement_approval:
                data:
                  schema: runx/procurement-policy-check.approval.v1
                  decision: approved
                  payee: sourcey
                  ceiling_amount: 200
                  human_lane: null
                  refused_reason: null
                  spend_executed: false
                  validation: { status: pass, findings: [] }
        receipt: { schema: runx.receipt.v1 }

    - name: procurement-policy-check-refuses-unapproved-payee
      inputs:
        procurement_request:
          payee: unknown-ai-tool
          amount: 450
          currency: USD
          purpose: buy unreviewed credits
        procurement_policy:
          currency: USD
          remaining_budget: 300
          request_cap: 200
          approved_payees: [sourcey, runx]
          approval_threshold: 200
      expect:
        status: sealed
        steps: [digest-request, digest-policy, decide]
        step_outputs:
          decide:
            subset:
              procurement_approval:
                data:
                  decision: refused
                  refused_reason: unapproved_payee
                  spend_executed: false
        receipt: { schema: runx.receipt.v1 }

    - name: procurement-policy-check-routes-threshold-to-human
      inputs:
        procurement_request:
          payee: runx
          amount: 200
          currency: USD
          purpose: annual plan renewal
        procurement_policy:
          currency: USD
          remaining_budget: 500
          request_cap: 400
          approved_payees: [sourcey, runx]
          approval_threshold: 200
          human_lane: finance-review
      expect:
        status: sealed
        steps: [digest-request, digest-policy, decide]
        step_outputs:
          decide:
            subset:
              procurement_approval:
                data:
                  decision: needs_human
                  human_lane: finance-review
                  spend_executed: false
        receipt: { schema: runx.receipt.v1 }

    - name: procurement-policy-check-refuses-missing-policy
      inputs:
        procurement_request:
          payee: sourcey
          amount: 125
          currency: USD
        procurement_policy:
          currency: USD
      expect:
        status: sealed
        steps: [digest-request, digest-policy, decide]
        step_outputs:
          decide:
            subset:
              procurement_approval:
                data:
                  decision: refused
                  refused_reason: missing_policy_authority
                  validation: { status: fail }
        receipt: { schema: runx.receipt.v1 }

runners:
  decide:
    default: true
    inputs:
      procurement_request:
        type: object
        required: true
        description: One proposed procurement request with payee, amount, currency, and purpose.
        schema:
          additionalProperties: false
          properties:
            payee: { type: string, minLength: 1, maxLength: 500 }
            amount: { type: number, exclusiveMinimum: 0 }
            currency: { type: string, minLength: 1, maxLength: 10 }
            purpose: { type: string, maxLength: 2000 }
      procurement_policy:
        type: object
        required: true
        description: Explicit procurement authority; missing fields refuse instead of guessing.
        schema:
          additionalProperties: false
          properties:
            currency: { type: string, minLength: 1, maxLength: 10 }
            remaining_budget: { type: number, exclusiveMinimum: 0 }
            request_cap: { type: number, exclusiveMinimum: 0 }
            approved_payees:
              type: array
              maxItems: 500
              items: { type: string, minLength: 1, maxLength: 500 }
            approval_threshold: { type: number, exclusiveMinimum: 0 }
            human_lane: { type: string, minLength: 1, maxLength: 200 }
    examples:
      - procurement_request:
          payee: sourcey
          amount: 125
          currency: USD
          purpose: generate public llms.txt docs
        procurement_policy:
          currency: USD
          remaining_budget: 300
          request_cap: 200
          approved_payees: [sourcey, runx]
          approval_threshold: 200
    result_from: [decide]
    steps:
      - id: digest-request
        tool: data.digest
        inputs:
          value: $input.procurement_request

      - id: digest-policy
        tool: data.digest
        inputs:
          value: $input.procurement_policy

      - id: decide
        label: apply the procurement policy deterministically
        inputs:
          procurement_request: $input.procurement_request
          procurement_policy: $input.procurement_policy
          request_digest: $steps.digest-request.digest_result.digest
          policy_digest: $steps.digest-policy.digest_result.digest
        tool: { module: procurement-policy-check.mjs, export: decideProcurement }
        outputs:
          procurement_approval:
            type: object
        artifacts:
          named_emits:
            procurement_approval: procurement_approval
          packets:
            procurement_approval: runx/procurement-policy-check.approval.v1
