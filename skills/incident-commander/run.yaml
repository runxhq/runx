skill: incident-commander
version: "0.3.2"

catalog:
  kind: graph
  audience: operator
  visibility: public
  role: context
  execution: plan
  completion: runtime_receipt
  requires_adapter: false
  approval: none
  owner: mossony

runners:
  advance:
    default: true
    inputs:
      case_id:
        type: string
        required: true
        description: Declared incident case id from the folded agency case.
        schema: { minLength: 1, maxLength: 256 }
      driver_id:
        type: string
        required: true
        description: Driver responsible for returning this sealed turn to agency.
        schema: { minLength: 1, maxLength: 256 }
      incident_objective:
        type: string
        required: true
        description: One bounded incident objective.
        schema: { enum: [begin, assign, send, resolve, postmortem] }
      case_state:
        type: json
        required: true
        description: Bounded folded agency projection with declaration, severity, scope, turn, and current evidence.
      roster:
        type: array
        required: true
        description: Fixed commander, responder_lead, and comms_lead entries with principal, skill, and scope ceiling.
        schema:
          minItems: 3
          maxItems: 3
          items:
            type: object
            required: [role, principal, skill, scope]
            additionalProperties: false
            properties:
              role: { type: string, enum: [commander, responder_lead, comms_lead] }
              principal: { type: string, minLength: 1, maxLength: 256 }
              skill: { type: string, minLength: 1, maxLength: 256 }
              scope:
                type: array
                minItems: 1
                maxItems: 32
                uniqueItems: true
                items: { type: string, minLength: 1, maxLength: 256 }
      approval:
        type: object
        required: false
        description: Existing communication approval, matched to the exact comms_lead principal. This skill does not mint approval.
        schema:
          required: [principal, reason]
          additionalProperties: false
          properties:
            principal: { type: string, minLength: 1, maxLength: 256 }
            reason: { type: string, minLength: 1, maxLength: 2000 }
      member_result:
        type: object
        required: false
        description: Outcome and sealed receipt reference from a previously dispatched responder or communications run.
        schema:
          required: [outcome, receipt_ref]
          additionalProperties: false
          properties:
            outcome: { type: string, enum: [completed, mitigated, resolved, verified, delivered, failed] }
            receipt_ref: { type: string, maxLength: 256 }
    examples:
      - case_id: inc-checkout-sev2
        driver_id: primary-driver
        incident_objective: assign
        case_state: { declared: true, severity: SEV-2, scope: checkout-api, turn: 1, named_owner: responder_lead }
        roster:
          - { role: commander, principal: incident:commander:alex, skill: ops-desk, scope: [incident.command] }
          - { role: responder_lead, principal: incident:responder:rio, skill: incident-response, scope: [incident.respond] }
          - { role: comms_lead, principal: incident:comms:morgan, skill: send-as, scope: [stakeholder.send] }
    result_from: [stop, finalize]
    steps:
      - id: admit
        inputs:
          case_id: $input.case_id
          driver_id: $input.driver_id
          incident_objective: $input.incident_objective
          case_state: $input.case_state
          roster: $input.roster
          approval: $input.approval
          member_result: $input.member_result
        tool: { module: incident-turn.mjs, export: admitIncident }
        outputs:
          incident_context: object

      - id: decide
        when:
          value: $steps.admit.incident_context.path
          equals: decide
        skill: ../ops-desk
        runner: advance
        inputs:
          mandate: $input.incident_objective
          case_state: $input.case_state
          candidate_roster: $input.roster
          scope_ref: $input.case_id
          approval_context: $input.approval
          operator_policy: Incident sends require the exact comms_lead approval. Resolution and delivery require linked Runx receipts.

      - id: stop
        when:
          value: $steps.admit.incident_context.path
          equals: stop
        inputs:
          incident_context: $steps.admit.incident_context
        tool: { module: incident-turn.mjs, export: finalizeIncident }
        outputs:
          incident_turn:
            type: object
            schema:
              required: [schema, decision, case_id, driver_id, turn, objective, severity, dispatch, escalation, downstream_handoff, delivery_status, delivery_receipt_ref, resolution_receipt_ref, reason, effect_state, validation]
              additionalProperties: false
              properties:
                schema: { const: runx.incident.turn.v1 }
                decision: { type: string, enum: [advanced, awaiting_approval, resolved, needs_input, refused] }
                case_id: { type: string, minLength: 1 }
                driver_id: { type: string, minLength: 1 }
                turn: { type: integer, minimum: 1 }
                objective: { type: string, enum: [begin, assign, send, resolve, postmortem] }
                severity: { type: string, minLength: 1 }
                dispatch: { type: [object, "null"], additionalProperties: true }
                escalation: { type: [object, "null"], additionalProperties: true }
                downstream_handoff: { type: [object, "null"], additionalProperties: true }
                delivery_status: { type: string, enum: [not_sent, receipt_supplied] }
                delivery_receipt_ref: { type: [string, "null"] }
                resolution_receipt_ref: { type: [string, "null"] }
                reason: { type: string, minLength: 1 }
                effect_state:
                  type: object
                  required: [agency_state, provider_delivery]
                  additionalProperties: false
                  properties:
                    agency_state: { const: not_persisted }
                    provider_delivery: { type: string, enum: [not_executed, receipt_supplied] }
                validation:
                  type: object
                  required: [status, findings]
                  additionalProperties: false
                  properties:
                    status: { type: string, enum: [pass, fail] }
                    findings:
                      type: array
                      maxItems: 50
                      items:
                        type: object
                        required: [code, message]
                        additionalProperties: false
                        properties:
                          code: { type: string, minLength: 1, maxLength: 200 }
                          message: { type: string, minLength: 1, maxLength: 2000 }
        artifacts:
          named_emits:
            incident_turn: incident_turn

      - id: finalize
        when:
          value: $steps.admit.incident_context.path
          equals: decide
        inputs:
          incident_context: $steps.admit.incident_context
          decision: $steps.decide.dispatch_decision
        tool: { module: incident-turn.mjs, export: finalizeIncident }
        outputs:
          incident_turn:
            type: object
            schema:
              required: [schema, decision, case_id, driver_id, turn, objective, severity, dispatch, escalation, downstream_handoff, delivery_status, delivery_receipt_ref, resolution_receipt_ref, reason, effect_state, validation]
              additionalProperties: false
              properties:
                schema: { const: runx.incident.turn.v1 }
                decision: { type: string, enum: [advanced, awaiting_approval, resolved, needs_input, refused] }
                case_id: { type: string, minLength: 1 }
                driver_id: { type: string, minLength: 1 }
                turn: { type: integer, minimum: 1 }
                objective: { type: string, enum: [begin, assign, send, resolve, postmortem] }
                severity: { type: string, minLength: 1 }
                dispatch: { type: [object, "null"], additionalProperties: true }
                escalation: { type: [object, "null"], additionalProperties: true }
                downstream_handoff: { type: [object, "null"], additionalProperties: true }
                delivery_status: { type: string, enum: [not_sent, receipt_supplied] }
                delivery_receipt_ref: { type: [string, "null"] }
                resolution_receipt_ref: { type: [string, "null"] }
                reason: { type: string, minLength: 1 }
                effect_state:
                  type: object
                  required: [agency_state, provider_delivery]
                  additionalProperties: false
                  properties:
                    agency_state: { const: not_persisted }
                    provider_delivery: { type: string, enum: [not_executed, receipt_supplied] }
                validation:
                  type: object
                  required: [status, findings]
                  additionalProperties: false
                  properties:
                    status: { type: string, enum: [pass, fail] }
                    findings:
                      type: array
                      maxItems: 50
                      items:
                        type: object
                        required: [code, message]
                        additionalProperties: false
                        properties:
                          code: { type: string, minLength: 1, maxLength: 200 }
                          message: { type: string, minLength: 1, maxLength: 2000 }
        artifacts:
          named_emits:
            incident_turn: incident_turn
