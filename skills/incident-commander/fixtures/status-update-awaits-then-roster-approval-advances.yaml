name: approved-send-prepares-provider-neutral-handoff
kind: skill
target: ..
runner: advance
operator_journeys:
  - mode: standalone
    confusors: [ops-desk, agency]
    request: Advance this SEV-2 incident and prepare the approved status update handoff.
    expected_outcome: Return the next incident action with roster authority, approval state, and send handoff explicit.
  - mode: composed
    request: Continue incident response from this current case state and approved roster decision.
    expected_outcome: Reuse incident state and completed approvals without replaying earlier turns or sending twice.
    prior_evidence:
      - The incident case state, driver identity, objective, and roster approval supplied in the fixture.
    must_not_repeat:
      - Do not rerun completed incident turns.
      - Do not request an approval already recorded in case state.
inputs:
  case_id: inc-sev2-checkout
  driver_id: driver-primary
  incident_objective: send
  case_state:
    declared: true
    severity: SEV-2
    scope: checkout-api
    turn: 4
    pending_escalation:
      status: awaiting_approval
      lane: human:incident-reviewer
      proposed_handoff:
        skill: send-as
        runner: plan
        principal: incident:comms:morgan
        channel: email
        audience: { list_ref: stakeholders:checkout-api, classification: incident-stakeholders }
        content_digest: sha256:4e44f31f628799267f0957c554b8c47d90d2eabf41e5a84248941d28c45955ae
  roster:
    - { role: commander, principal: incident:commander:alex, skill: ops-desk, scope: [incident.command] }
    - { role: responder_lead, principal: incident:responder:rio, skill: incident-response, scope: [incident.respond] }
    - { role: comms_lead, principal: incident:comms:morgan, skill: send-as, scope: [stakeholder.send] }
  approval:
    principal: incident:comms:morgan
    reason: Approve this exact audience and content digest for send planning.
caller:
  answers:
    agent.ops-desk-advance.output:
      decision: dispatch
      reason: The exact comms_lead approval permits a separate send-as planning run.
      dispatch:
        member: comms_lead
        skill: send-as
        task: Plan the approved stakeholder update from the bound audience and content digest.
        needed_scope: [stakeholder.send]
        consequence: stakeholder_send_handoff
        verification:
          expected_receipt: runx.receipt.v1
          readback: Return the provider-backed send receipt through agency before claiming delivery.
expect:
  status: sealed
  steps: [admit, decide, finalize]
  step_outputs:
    finalize:
      subset:
        incident_turn:
          data:
            schema: runx.incident.turn.v1
            decision: advanced
            downstream_handoff:
              skill: send-as
              runner: plan
              state: ready_for_planning
              delivery_status: not_sent
            delivery_status: not_sent
            effect_state: { agency_state: not_persisted, provider_delivery: not_executed }
            validation: { status: pass, findings: [] }
  receipt: { schema: runx.receipt.v1 }
