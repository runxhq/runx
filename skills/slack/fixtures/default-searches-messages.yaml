name: slack-default-searches-messages
kind: skill
target: ..
operator_journeys:
  - mode: standalone
    confusors: [message-send, conversation-review]
    request: Find the bounded Slack messages about release readiness.
    expected_outcome: Search the configured Slack account once and return bounded provider evidence.
  - mode: composed
    request: Continue a release-readiness review with the Slack evidence it needs.
    expected_outcome: Run one bounded search for the review's exact keywords and hand back the provider evidence for the reviewer to judge.
    prior_evidence:
      - The review's exact keywords, channel types and page limit, supplied in the fixture.
    must_not_repeat:
      - Do not search again for a page already read.
      - Do not post or reply from a search.
inputs:
  query: { keywords: release readiness, channel_types: [public_channel, private_channel], limit: 20 }
caller:
  provider_responses:
    principal_id: operator-fixture
    grant:
        grant_id: slack-search-fixture
        provider: slack
        scopes: [messages.search]
    operations:
      - operation: messages.search
        target: slack://messages
        access: read
        result:
          provider: slack
          external_tenant_id: T123ABC
          connected_subject_id: U123ABC
          messages:
            - provider: slack
              external_tenant_id: T123ABC
              connected_subject_id: U123ABC
              message_locator: slack://T123ABC/C123ABC/1750000000.000001
              thread_locator: slack://T123ABC/C123ABC/1750000000.000001
              author: { external_id: U456ABC, provider_actor_type: user_account }
              conversation: { external_id: C123ABC, type: channel }
              occurred_at: "2026-08-10T10:00:00Z"
              preview: Release readiness checks are green.
              context: []
          next_cursor: ""
expect:
  status: sealed
  steps: [search]
  step_outputs:
    search:
      subset:
        provider_operation:
          data:
            status: success
            provider: slack
            result:
              external_tenant_id: T123ABC
  receipt: { schema: runx.receipt.v1, state: sealed, outcome: completed }
metadata: { public_skill: slack, source_case: direct-default-success, source: skills-fixture }
