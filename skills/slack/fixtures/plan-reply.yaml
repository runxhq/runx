name: slack-plans-one-digest-bound-thread-reply
kind: skill
target: ..
runner: plan_reply
operator_journeys:
  - mode: standalone
    confusors: [slack-notify, send-as]
    request: Prepare the exact reply for this Slack thread and stop before delivery.
    expected_outcome: Return a digest-bound reply plan with exact target, body, principal, and approval boundary.
  - mode: composed
    request: Prepare the final Slack reply from this completed support or operations decision.
    expected_outcome: Reuse final text and thread locator without rereading the thread or sending it.
    prior_evidence:
      - The final reply text, exact thread locator, principal, and provider context supplied in the fixture.
    must_not_repeat:
      - Do not reread or re-summarize the Slack thread.
      - Do not send the reply from the planning runner.
