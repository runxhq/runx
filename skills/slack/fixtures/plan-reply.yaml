      send_plan:
        decision: ready
        action_family: send-as
        principal: { type: user, ref: "user:kam" }
        provider: { name: slack, account_ref: "workspace:T123ABC", runtime_path: slack }
        send_class: internal
        channel: chat
        audience:
          type: thread
          ref: slack://T123ABC/C123ABC/1750000000.000001
          requires_reconfirmation: false
        content:
          draft_ref: inline
          digest: sha256:8604f5c08db8d76b6fa8066c769fbdc6a4992101373d0d17bcfe426cf8e77647
          subject_or_title: Slack thread reply
        gates:
          preflight_required: true
          human_approval_required: true
          approval_ref: slack.deliver-reply.approval
        blockers: []
        provider_actions: [thread.reply]
        evidence_refs: []
        success_checkpoint:
          milestone: plan_ready
          description: Digest-bound Slack reply awaits approved provider execution.
expect:
  status: sealed
  steps: [digest, authorize]
  receipt: { schema: runx.receipt.v1 }
metadata:
  public_skill: slack
  source_case: plan-reply
  source: skills-fixture
