name: reads-normal-reply-permalink
method: read_link
inputs:
  permalink: https://example.slack.com/archives/C123ABC/p1750000100000002?thread_ts=1750000000.000001&cid=C123ABC
  limit: 200
  cursor: prior
providers:
  hosted:
    principal_id: operator-fixture
    grant:
      grant_id: slack-thread-fixture
      provider: slack
      scopes:
        - thread.read
    operations:
      - operation: thread.read
        target: https://example.slack.com/archives/C123ABC/p1750000100000002?thread_ts=1750000000.000001&cid=C123ABC
        access: read
        result:
          provider: slack
          external_tenant_ref: T123ABC
          connected_subject_ref: U123ABC
          thread_locator: slack://T123ABC/C123ABC/1750000000.000001
          messages: []
          next_cursor: next
expect:
  status: sealed
  steps:
    - read
  step_outputs:
    read:
      subset:
        provider_operation:
          data:
            status: success
            result:
              thread_locator: slack://T123ABC/C123ABC/1750000000.000001
              next_cursor: next
  receipt:
    schema: runx.receipt.v1
    state: sealed
    outcome: completed
