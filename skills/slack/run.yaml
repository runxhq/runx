skill: slack
version: "0.2.13"

catalog:
  kind: graph
  audience: operator
  visibility: public
  role: branded
  canonical_skill: runx/send-as
  provider: slack
  execution: execute
  completion: provider_readback
  approval: conditional
  category: ops

connectors:
  slack:
    operations: [messages.search, thread.read, file.read, thread.reply, thread.reply.read]
runners:
  assistant_decide:
    inputs:
      presentation_ref:
        type: string
        required: true
        description: Exact posted Slack message locator that roots this decision thread.
        schema: { pattern: '^slack://[A-Z][A-Z0-9]+/[CGD][A-Z0-9]+/[0-9]+\.[0-9]+$', maxLength: 300 }
      request_digest:
        type: string
        required: true
        schema: { pattern: '^sha256:[0-9a-f]{64}$' }
      nonce:
        type: string
        required: true
        schema: { pattern: '^[0-9a-f]{16}$' }
      authorized_actor_ref:
        type: string
        required: true
        description: Exact Slack member ID authorized to answer this request.
        schema: { pattern: '^[UW][A-Z0-9]{2,}$', maxLength: 100 }
    result_from: [judge]
    steps:
      - id: thread
        skill: .
        runner: read_thread
        inputs:
          thread_locator: $input.presentation_ref
          limit: 15
      - id: judge
        inputs:
          presentation_ref: $input.presentation_ref
          request_digest: $input.request_digest
          nonce: $input.nonce
          authorized_actor_ref: $input.authorized_actor_ref
          provider_operation: $steps.thread.provider_operation
        tool: { module: assistant-source.mjs, export: decideAssistantRequest }
        outputs: { decision_observation: object }
        artifacts:
          named_emits: { decision_observation: decision_observation }
          packets: { decision_observation: runx.decision_observation.v1 }
  assistant_scan:
    inputs:
      config: { type: object, required: true, description: Bounded source search configuration. }
      cursor: { type: string, required: false, description: Opaque source cursor. }
      page_limit: { type: integer, required: true, description: Maximum search rows, schema: { minimum: 1, maximum: 20 } }
    result_from: [finish]
    steps:
      - id: prepare
        inputs: { config: "$input.config", cursor: "$input.cursor", page_limit: "$input.page_limit" }
        tool: { module: assistant-source.mjs, export: prepareAssistantScan }
        outputs: { scan_request: object }
      - id: search
        skill: .
        runner: search
        inputs:
          query: $steps.prepare.scan_request.query
      - id: finish
        inputs:
          page_limit: $input.page_limit
          provider_operation: $steps.search.provider_operation
        tool: { module: assistant-source.mjs, export: finishAssistantScan }
        outputs: { assistant_page: object }
        artifacts:
          named_emits: { assistant_page: assistant_page }
          packets: { assistant_page: runx.conversation_page.v1 }
  assistant_observe:
    inputs:
      config: { type: object, required: true, description: Bound source configuration. }
      item: { type: object, required: true, description: One message from assistant_scan. }
    result_from: [observe]
    steps:
      - id: observe
        inputs: { config: "$input.config", item: "$input.item" }
        tool: { module: assistant-source.mjs, export: observeAssistantMessage }
        outputs: { assistant_observation: object }
        artifacts:
          named_emits: { assistant_observation: assistant_observation }
          packets: { assistant_observation: runx.conversation_observation.v1 }
  assistant_hydrate:
    inputs:
      config: { type: object, required: true, description: Bound source configuration. }
      source_ref: { type: string, required: true, description: Admitted message locator. }
      source_digest: { type: string, required: true, description: Admitted occurrence digest. }
      thread_locator: { type: string, required: true, description: Admitted thread locator. }
      action: { type: object, required: true, description: Canonical open operator action. }
      cursor: { type: string, required: false, description: Opaque thread continuation cursor. }
    result_from: [finish]
    steps:
      - id: prepare
        inputs:
          source_ref: "$input.source_ref"
          thread_locator: "$input.thread_locator"
          action: "$input.action"
          cursor: "$input.cursor"
        tool: { module: assistant-source.mjs, export: prepareAssistantHydrate }
        outputs: { hydrate_request: object }
      - id: thread
        skill: .
        runner: read_thread
        inputs:
          thread_locator: $steps.prepare.hydrate_request.thread_locator
          cursor: $steps.prepare.hydrate_request.cursor
          limit: $steps.prepare.hydrate_request.limit
      - id: finish
        inputs:
          source_ref: "$input.source_ref"
          source_digest: "$input.source_digest"
          thread_locator: "$input.thread_locator"
          action: "$input.action"
          provider_operation: $steps.thread.provider_operation
        tool: { module: assistant-source.mjs, export: finishAssistantHydrate }
        outputs: { assistant_context: object }
        artifacts:
          named_emits: { assistant_context: assistant_context }
          packets: { assistant_context: runx.source_packet.v1 }
  search:
    default: true
    inputs:
      query:
        type: object
        required: true
        description: Bounded Slack search object; requires author_external_id (member-id string), mentions_connected_subject (boolean), or keywords (one phrase string, never an array).
        schema:
          additionalProperties: false
          properties:
            author_external_id: { type: string, pattern: '^[UW][A-Z0-9]{2,}$', maxLength: 100 }
            mentions_connected_subject: { const: true }
            keywords: { type: string, minLength: 1, maxLength: 500, pattern: '^[^?\r\n\u0000-\u001f]+$' }
            after: { type: string, format: date-time, maxLength: 100 }
            before: { type: string, format: date-time, maxLength: 100 }
            channel_types:
              type: array
              minItems: 1
              maxItems: 4
              uniqueItems: true
              items: { type: string, enum: [public_channel, private_channel, mpim, im] }
            limit: { type: integer, minimum: 1, maximum: 20, default: 20 }
            cursor: { type: string, minLength: 1, maxLength: 500 }
          anyOf:
            - required: [author_external_id]
            - required: [mentions_connected_subject]
            - required: [keywords]
    examples:
      - query: { keywords: release readiness, channel_types: [public_channel, private_channel], limit: 20 }
    result_from: [search]
    steps:
      - id: search
        operation: slack/messages.search
        result_fields: [external_tenant_ref, connected_subject_ref, messages, next_cursor]
        input: $input.query

  read_thread:
    inputs:
      thread_locator:
        type: string
        required: true
        description: Exact slack://workspace/channel/timestamp thread locator.
        schema: { pattern: '^slack://[A-Z][A-Z0-9]+/[CGD][A-Z0-9]+/[0-9]+\.[0-9]+$', maxLength: 300 }
      limit:
        type: integer
        required: false
        default: 15
        description: Bounded messages to return; provider maximum is 15.
        schema: { minimum: 1, maximum: 15 }
      cursor:
        type: string
        required: false
        description: Opaque cursor returned by the preceding thread page.
    examples:
      - thread_locator: slack://T123ABC/C123ABC/1750000000.000001
        limit: 15
    result_from: [read]
    steps:
      - id: read
        operation: slack/thread.read
        expected_result:
          thread_locator: $input.thread_locator
        result_fields: [external_tenant_ref, connected_subject_ref, thread_locator, messages, next_cursor]
        input:
          thread_locator: $input.thread_locator
          limit: $input.limit
          cursor: $input.cursor

  read_link:
    inputs:
      permalink:
        type: string
        required: true
        description: Exact https://workspace.slack.com/archives/channel/message permalink.
        schema: { pattern: '^https://[^/]+\.slack\.com/archives/[A-Z0-9]+/p[0-9]+$', maxLength: 2048 }
      limit:
        type: integer
        required: false
        default: 15
        description: Bounded messages to return; provider maximum is 15.
        schema: { minimum: 1, maximum: 15 }
      cursor:
        type: string
        required: false
        description: Opaque cursor returned by the preceding thread page.
    examples:
      - permalink: https://example.slack.com/archives/C123ABC/p1750000000000001
        limit: 15
    result_from: [read]
    steps:
      - id: read
        operation: slack/thread.read
        result_fields: [external_tenant_ref, connected_subject_ref, thread_locator, messages, next_cursor]
        input:
          thread_locator: $input.permalink
          limit: $input.limit
          cursor: $input.cursor

  read_file:
    inputs:
      file_locator:
        type: string
        required: true
        description: Exact slack-file://workspace/file locator returned by read_thread.
        schema: { pattern: '^slack-file://[A-Z][A-Z0-9]+/F[A-Z0-9]+$', maxLength: 300 }
    examples:
      - file_locator: slack-file://T123ABC/F123ABC
    result_from: [read]
    steps:
      - id: read
        operation: slack/file.read
        expected_result:
          file_locator: $input.file_locator
        result_fields: [external_tenant_ref, connected_subject_ref, file_locator, name, mimetype, size_bytes, image_width, image_height, content_digest, data_base64]
        input:
          file_locator: $input.file_locator

  plan_reply:
    inputs:
      principal:
        type: string
        required: true
        description: Principal represented by the connected Slack identity.
      thread_locator:
        type: string
        required: true
        description: Exact Slack thread that would receive the reply.
        schema: { pattern: '^slack://[A-Z][A-Z0-9]+/[CGD][A-Z0-9]+/[0-9]+\.[0-9]+$', maxLength: 300 }
      text:
        type: string
        required: true
        description: Exact proposed reply text.
        schema: { minLength: 1, maxLength: 4000 }
      provider_context:
        type: json
        required: false
        description: Connector and workspace readiness supplied to send-as.
      operator_context:
        type: string
        required: false
        description: Purpose, constraints, and approval posture for this reply.
    examples:
      - principal: user:kam
        thread_locator: slack://T123ABC/C123ABC/1750000000.000001
        text: I’ll verify this now.
        provider_context: { connector: runx-connect, workspace: T123ABC }
        operator_context: Reply only in the supplied thread and require approval before delivery.
    result_from: [authorize]
    steps:
      - id: digest
        tool: data.digest
        inputs:
          value: $input.text
          encoding: utf8_text
      - id: authorize
        skill: ../send-as
        runner: plan
        inputs:
          objective: Authorize one exact Slack thread reply for later provider delivery.
          principal: $input.principal
          provider_context: $input.provider_context
          audience:
            type: thread
            ref: $input.thread_locator
            requires_reconfirmation: false
          operator_context: $input.operator_context
          content_ref: $steps.digest.digest_result

  deliver_reply:
    inputs:
      send_plan:
        type: json
        packet: runx.send_as.plan.v1
        required: true
        description: Exact send_plan emitted by plan_reply.
      thread_locator:
        type: string
        required: true
        description: Exact Slack thread locator bound by the plan and Connect grant.
        schema: { pattern: '^slack://[A-Z][A-Z0-9]+/[CGD][A-Z0-9]+/[0-9]+\.[0-9]+$', maxLength: 300 }
      text:
        type: string
        required: true
        description: Exact reply text whose digest must match the plan.
        schema: { minLength: 1, maxLength: 4000 }
      idempotency_key:
        type: string
        required: true
        description: Stable UUID for this exact Slack reply.
        schema: { format: uuid }
    examples:
      - send_plan:
          decision: ready
          action_family: send-as
          principal: { type: user, ref: "user:kam" }
          provider: { name: slack, account_ref: "workspace:T123ABC", runtime_path: slack }
          send_class: internal
          channel: chat
          audience: { type: thread, ref: 'slack://T123ABC/C123ABC/1750000000.000001', requires_reconfirmation: false }
          content:
            draft_ref: inline
            digest: 'sha256:8604f5c08db8d76b6fa8066c769fbdc6a4992101373d0d17bcfe426cf8e77647'
            subject_or_title: Slack thread reply
          gates: { preflight_required: true, human_approval_required: true, approval_ref: slack.deliver-reply.approval }
          blockers: []
          provider_actions: [thread.reply]
          evidence_refs: []
          success_checkpoint:
            milestone: plan_ready
            description: Digest-bound Slack reply awaits approved provider execution.
        thread_locator: slack://T123ABC/C123ABC/1750000000.000001
        text: I’ll verify this now.
        idempotency_key: 00000000-0000-4000-8000-000000000001
    result_from: [readback]
    steps:
      - id: digest
        tool: data.digest
        inputs:
          value: $input.text
          encoding: utf8_text
      - id: bind-plan
        tool: data.compare
        inputs:
          actual:
            decision: $input.send_plan.decision
            provider: $input.send_plan.provider.name
            channel: $input.send_plan.channel
            audience: $input.send_plan.audience.ref
            approval_required: $input.send_plan.gates.human_approval_required
          expected:
            decision: ready
            provider: slack
            channel: chat
            audience: $input.thread_locator
            approval_required: true
      - id: bind-content
        tool: data.compare
        when:
          value: $steps.bind-plan.comparison.equal
          equals: true
        inputs:
          expected: $input.send_plan.content.digest
          actual: $steps.digest.digest_result.digest
      - id: deliver
        operation: slack/thread.reply
        idempotency_key: $input.idempotency_key
        when:
          value: $steps.bind-content.comparison.equal
          equals: true
        approval:
          reason: Approve posting this exact digest-bound Slack thread reply.
          type: slack_message
        expected_result:
          thread_locator: $input.thread_locator
          content_digest: $input.send_plan.content.digest
        result_fields: [message_locator, conversation_locator, thread_locator, content_digest, occurred_at]
        input:
          thread_locator: $input.thread_locator
          text: $input.text
      - id: prepare-readback
        when:
          value: $steps.bind-content.comparison.equal
          equals: true
        inputs:
          text: $input.text
          delivery: $steps.deliver.provider_operation
        tool: { module: reply-readback.mjs, export: prepareReplyReadback }
        outputs: { read_request: object }
      - id: readback
        when:
          value: $steps.bind-content.comparison.equal
          equals: true
        operation: slack/thread.reply.read
        result_fields: [message_locator, conversation_locator, thread_locator, content_digest, occurred_at]
        expected_result: $steps.deliver.provider_operation.result
        input: $steps.prepare-readback.read_request

harness:
  files: [fixtures/support/composed.graph]
  cases: []
