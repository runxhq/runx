version: "0.2.18"
minimum_runx: 0.12.0
default_method: search
catalog:
  visibility: public
  category: ops
methods:
  assistant_decide:
    description: For an assistant watching Slack, read a decision thread and judge the authorized member's answer in it.
    inputs:
      presentation_locator:
        type: string
        description: Exact posted Slack message locator that roots this decision thread.
        pattern: ^slack://[A-Z][A-Z0-9]+/[CGD][A-Z0-9]+/[0-9]+\.[0-9]+$
        maxLength: 300
      request_digest:
        type: string
        pattern: ^sha256:[0-9a-f]{64}$
      nonce:
        type: string
        pattern: ^[0-9a-f]{16}$
      authorized_actor_id:
        type: string
        description: Exact Slack member ID authorized to answer this request.
        pattern: ^[UW][A-Z0-9]{2,}$
        maxLength: 100
    result_from:
      - judge
    steps:
      - id: thread
        skill: .#read_thread
        inputs:
          thread_locator: $input.presentation_locator
          limit: 15
      - id: judge
        inputs:
          presentation_locator: $input.presentation_locator
          request_digest: $input.request_digest
          nonce: $input.nonce
          authorized_actor_id: $input.authorized_actor_id
          provider_operation: $steps.thread.provider_operation
        tool:
          module: assistant-source.mjs
          export: decideAssistantRequest
        outputs:
          decision_observation: {type: object, packet: runx.decision_observation.v1}
  assistant_scan:
    description: For an assistant watching Slack, search a bounded page of new source messages under its configuration.
    inputs:
      config:
        type: object
        description: Bounded source search configuration.
      cursor:
        type: string
        description: Opaque source cursor.
        optional: true
      page_limit:
        type: integer
        description: Maximum search rows
        minimum: 1
        maximum: 20
    result_from:
      - finish
    steps:
      - id: prepare
        inputs:
          config: $input.config
          cursor: $input.cursor
          page_limit: $input.page_limit
        tool:
          module: assistant-source.mjs
          export: prepareAssistantScan
        outputs:
          scan_request: {type: object}
      - id: search
        skill: .#search
        inputs:
          query: $steps.prepare.scan_request.query
      - id: finish
        inputs:
          page_limit: $input.page_limit
          provider_operation: $steps.search.provider_operation
        tool:
          module: assistant-source.mjs
          export: finishAssistantScan
        outputs:
          assistant_page: {type: object, packet: runx.conversation_page.v1}
  assistant_observe:
    description: For an assistant watching Slack, turn one message assistant_scan found into an observation.
    inputs:
      config:
        type: object
        description: Bound source configuration.
      item:
        type: object
        description: One message from assistant_scan.
    result_from:
      - observe
    steps:
      - id: observe
        inputs:
          config: $input.config
          item: $input.item
        tool:
          module: assistant-source.mjs
          export: observeAssistantMessage
        outputs:
          assistant_observation: {type: object, packet: runx.conversation_observation.v1}
  assistant_hydrate:
    description: For an assistant watching Slack, read the thread of an admitted message for its open action.
    inputs:
      config:
        type: object
        description: Bound source configuration.
      source_locator:
        type: string
        description: Admitted message locator.
      source_digest:
        type: string
        description: Admitted occurrence digest.
      thread_locator:
        type: string
        description: Admitted thread locator.
      action:
        type: object
        description: Canonical open operator action.
      cursor:
        type: string
        description: Opaque thread continuation cursor.
        optional: true
    result_from:
      - finish
    steps:
      - id: prepare
        inputs:
          source_locator: $input.source_locator
          thread_locator: $input.thread_locator
          action: $input.action
          cursor: $input.cursor
        tool:
          module: assistant-source.mjs
          export: prepareAssistantHydrate
        outputs:
          hydrate_request: {type: object}
      - id: thread
        skill: .#read_thread
        inputs:
          thread_locator: $steps.prepare.hydrate_request.thread_locator
          cursor: $steps.prepare.hydrate_request.cursor
          limit: $steps.prepare.hydrate_request.limit
      - id: finish
        inputs:
          source_locator: $input.source_locator
          source_digest: $input.source_digest
          thread_locator: $input.thread_locator
          action: $input.action
          provider_operation: $steps.thread.provider_operation
        tool:
          module: assistant-source.mjs
          export: finishAssistantHydrate
        outputs:
          assistant_context: {type: object, packet: runx.source_packet.v1}
  search:
    description: Read one bounded Slack search page by channel, author, mentions or keywords, or one explicit advanced expression, preserving continuation.
    inputs:
      query:
        type: object
        description: Choose structured channel/member/keyword selectors or one explicit expression. Use exact provider IDs and preserve the same query when continuing a cursor.
        additionalProperties: false
        properties:
          author_external_id:
            type: string
            pattern: ^[UW][A-Z0-9]{2,}$
            maxLength: 100
          mentions_connected_subject:
            const: true
          keywords:
            type: string
            minLength: 1
            maxLength: 500
            pattern: ^[^\r\n\u0000-\u001f]+$
          after:
            type: string
            format: date-time
            maxLength: 100
          before:
            type: string
            format: date-time
            maxLength: 100
          channel_types:
            type: array
            minItems: 1
            maxItems: 4
            uniqueItems: true
            items:
              type: string
              enum:
                - public_channel
                - private_channel
                - mpim
                - im
          limit:
            type: integer
            minimum: 1
            maximum: 20
            default: 20
          cursor:
            type: string
            minLength: 1
            maxLength: 500
          channel_id:
            type: string
            pattern: ^[CGD][A-Z0-9]{2,}$
            maxLength: 100
          mentions_external_id:
            type: string
            pattern: ^[UW][A-Z0-9]{2,}$
            maxLength: 100
          include_bots:
            type: boolean
          expression:
            type: string
            minLength: 1
            maxLength: 1000
            pattern: ^[^\r\n\u0000-\u001f]+$
        anyOf:
          - required:
              - author_external_id
          - required:
              - mentions_connected_subject
          - required:
              - keywords
          - required:
              - channel_id
          - required:
              - mentions_external_id
          - required:
              - expression
        allOf:
          - if:
              required:
                - expression
            then:
              not:
                anyOf:
                  - required:
                      - channel_id
                  - required:
                      - author_external_id
                  - required:
                      - mentions_external_id
                  - required:
                      - mentions_connected_subject
                  - required:
                      - keywords
    examples:
      - query:
          keywords: release readiness
          channel_types:
            - public_channel
            - private_channel
          limit: 20
      - query:
          channel_id: C123ABC
          mentions_external_id: U456ABC
          after: 2026-11-01T00:00:00Z
          limit: 10
      - query:
          expression: in:<#C123ABC> has:pin "release"
          include_bots: false
    result_from:
      - search
    steps:
      - id: search
        operation: slack/messages.search
        result:
          required:
            - external_tenant_ref
            - connected_subject_ref
            - messages
            - next_cursor
        inputs: $input.query
  read_thread:
    description: Read one bounded page of a thread from its exact slack:// locator.
    inputs:
      thread_locator:
        type: string
        description: Exact slack://workspace/channel/timestamp thread locator.
        pattern: ^slack://[A-Z][A-Z0-9]+/[CGD][A-Z0-9]+/[0-9]+\.[0-9]+$
        maxLength: 300
      limit:
        type: integer
        default: 15
        description: Maximum messages requested in this page (1–1000); default 15. Installation limits may yield a smaller page; preserve next_cursor.
        minimum: 1
        maximum: 1000
        optional: true
      cursor:
        type: string
        description: Opaque cursor returned by the preceding thread page.
        optional: true
    examples:
      - thread_locator: slack://T123ABC/C123ABC/1750000000.000001
        limit: 15
    result_from:
      - read
    steps:
      - id: read
        operation: slack/thread.read
        result:
          required:
            - external_tenant_ref
            - connected_subject_ref
            - thread_locator
            - messages
            - next_cursor
          equals:
            thread_locator: $input.thread_locator
        inputs:
          thread_locator: $input.thread_locator
          limit: $input.limit
          cursor: $input.cursor
  read_link:
    description: Read the thread a pasted Slack archive permalink points to, returning its canonical locator.
    inputs:
      permalink:
        type: string
        description: Exact Slack HTTPS archive link, including ordinary reply thread_ts/cid query fields. The selected provider validates the path, queries and workspace.
        maxLength: 2048
        format: uri
      limit:
        type: integer
        default: 15
        description: Maximum messages requested in this page (1–1000); default 15. Installation limits may yield a smaller page; preserve next_cursor.
        minimum: 1
        maximum: 1000
        optional: true
      cursor:
        type: string
        description: Opaque cursor returned by the preceding thread page.
        optional: true
    examples:
      - permalink: https://example.slack.com/archives/C123ABC/p1750000000000001
        limit: 15
    result_from:
      - read
    steps:
      - id: read
        operation: slack/thread.read
        result:
          required:
            - external_tenant_ref
            - connected_subject_ref
            - thread_locator
            - messages
            - next_cursor
        inputs:
          thread_locator: $input.permalink
          limit: $input.limit
          cursor: $input.cursor
  read_file:
    description: Read one image attached to a thread, from the file locator read_thread returned.
    inputs:
      file_locator:
        type: string
        description: Exact slack-file://workspace/file locator returned by read_thread.
        pattern: ^slack-file://[A-Z][A-Z0-9]+/F[A-Z0-9]+$
        maxLength: 300
    examples:
      - file_locator: slack-file://T123ABC/F123ABC
    result_from:
      - read
    steps:
      - id: read
        operation: slack/file.read
        result:
          required:
            - external_tenant_ref
            - connected_subject_ref
            - file_locator
            - name
            - mimetype
            - size_bytes
            - image_width
            - image_height
            - content_digest
            - data_base64
          equals:
            file_locator: $input.file_locator
        inputs:
          file_locator: $input.file_locator
