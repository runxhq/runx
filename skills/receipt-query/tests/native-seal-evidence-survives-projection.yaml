name: native-seal-evidence-survives-projection
method: read
inputs:
  question: Inspect the failed output contract for diagnosis.
  receipt_ids: [rcpt_failed_native_step]
  proof: {verify_chain: true}
  receipts:
    - receipt_id: rcpt_failed_native_step
      subject_uri: runx:run:run_failed#verify
      outcome: failed
      verification_status: verified
  receipt_details:
    - id: rcpt_failed_native_step
      subject_kind: step
      subject_uri: runx:run:run_failed#verify
      issuer_type: local
      outcome: failed
      verification: {status: verified}
      seal_reason: workflow_step_failed
      seal_criteria:
        - criterion_id: output_contract_verified
          status: failed
          evidence_uris: [runx:artifact:output-check]
          verification_uris: [runx:verification:output-contract]
      authority: {}
      acts: []
      decisions: []
      artifact_uris: []
      lineage_uris: []
expect:
  status: sealed
  steps: [prepare, finalize-replay]
  step_outputs:
    finalize-replay:
      subset:
        ledger_answer_packet:
          matched_receipts:
            - receipt_id: rcpt_failed_native_step
              subject_uri: runx:run:run_failed#verify
          receipt_details:
            - id: rcpt_failed_native_step
              issuer_type: local
              seal_criteria:
                - criterion_id: output_contract_verified
                  status: failed
                  evidence_uris: [runx:artifact:output-check]
                  verification_uris: [runx:verification:output-contract]
          chain_verification: {checked: true, intact: null, breaks: []}
  receipt: {schema: runx.receipt.v1}
