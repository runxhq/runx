skill: vuln-triage
version: "0.3.5"

catalog:
  kind: skill
  audience: public
  visibility: public
  role: canonical
  execution: read
  completion: runtime_receipt
  approval: none
  category: security

runners:
  scan:
    default: true
    inputs:
      target:
        type: string
        required: true
        description: Repository, package set, or ecosystem slice being assessed.
      cve_evidence:
        type: json
        required: true
        description: Exact cve-audit result, verification, and sealed receipt reference.
      objective:
        type: string
        required: false
        description: Decision the operator needs from the verified findings.
      scan_context:
        type: json
        required: false
        description: Bounded deployment or exposure context.
    result_from: [finalize, finalize-clean, stop]
    steps:
      - id: digest-evidence
        tool: data.digest
        inputs:
          value: $input.cve_evidence

      - id: admit
        inputs:
          target: $input.target
          cve_evidence: $input.cve_evidence
          scan_context: $input.scan_context
          evidence_digest: $steps.digest-evidence.digest_result.digest
        tool: { module: vuln-triage.mjs, export: admitScan }
        outputs:
          triage_context: object
        artifacts:
          named_emits:
            triage_context: triage_context

      - id: assess
        when:
          value: $steps.admit.triage_context.path
          equals: assess
        agent: { role: reviewer, task: vuln-triage-assess }
        outputs:
          risk_assessment_draft: object
        inputs:
          objective: $input.objective
          triage_context: $steps.admit.triage_context
          target: $input.target
          cve_evidence: $input.cve_evidence
          scan_context: $input.scan_context
        artifacts:
          named_emits:
            risk_assessment_draft: risk_assessment_draft

      - id: finalize
        when:
          value: $steps.admit.triage_context.path
          equals: assess
        inputs:
          triage_context: $steps.admit.triage_context
          risk_assessment_draft: $steps.assess.risk_assessment_draft
        tool: { module: vuln-triage.mjs, export: finalizeScan }
        outputs:
          vulnerability_scan_packet: object
        artifacts:
          named_emits:
            vulnerability_scan_packet: vulnerability_scan_packet
          packets:
            vulnerability_scan_packet: runx.security.vulnerability_scan.v1

      - id: finalize-clean
        when:
          value: $steps.admit.triage_context.path
          equals: complete
        inputs:
          triage_context: $steps.admit.triage_context
        tool: { module: vuln-triage.mjs, export: finalizeScan }
        outputs:
          vulnerability_scan_packet: object
        artifacts:
          named_emits:
            vulnerability_scan_packet: vulnerability_scan_packet
          packets:
            vulnerability_scan_packet: runx.security.vulnerability_scan.v1

      - id: stop
        when:
          value: $steps.admit.triage_context.path
          equals: stop
        inputs:
          triage_context: $steps.admit.triage_context
        tool: { module: vuln-triage.mjs, export: finalizeScan }
        outputs:
          vulnerability_scan_packet: object
        artifacts:
          named_emits:
            vulnerability_scan_packet: vulnerability_scan_packet
          packets:
            vulnerability_scan_packet: runx.security.vulnerability_scan.v1

  advisory:
    inputs:
      triage_packet:
        type: json
        required: true
        packet: runx.security.vulnerability_scan.v1
        description: Validated runx.security.vulnerability_scan.v1 packet.
      audience:
        type: string
        required: false
        default: affected_users
        description: Intended advisory audience.
    result_from: [finalize, stop]
    steps:
      - id: admit
        inputs:
          triage_packet: $input.triage_packet
          audience: $input.audience
        tool: { module: vuln-triage.mjs, export: admitAdvisory }
        outputs:
          advisory_context: object
        artifacts:
          named_emits:
            advisory_context: advisory_context

      - id: draft
        when:
          value: $steps.admit.advisory_context.path
          equals: draft
        agent: { role: builder, task: vuln-triage-advisory }
        outputs:
          advisory_draft: object
        inputs:
          advisory_context: $steps.admit.advisory_context
          triage_packet: $input.triage_packet
          audience: $input.audience
        artifacts:
          named_emits:
            advisory_draft: advisory_draft

      - id: finalize
        when:
          value: $steps.admit.advisory_context.path
          equals: draft
        inputs:
          advisory_context: $steps.admit.advisory_context
          advisory_draft: $steps.draft.advisory_draft
        tool: { module: vuln-triage.mjs, export: finalizeAdvisory }
        outputs:
          vulnerability_advisory_packet: object
        artifacts:
          named_emits:
            vulnerability_advisory_packet: vulnerability_advisory_packet
          packets:
            vulnerability_advisory_packet: runx.security.vulnerability_advisory.v1

      - id: stop
        when:
          value: $steps.admit.advisory_context.path
          equals: stop
        inputs:
          advisory_context: $steps.admit.advisory_context
        tool: { module: vuln-triage.mjs, export: finalizeAdvisory }
        outputs:
          vulnerability_advisory_packet: object
        artifacts:
          named_emits:
            vulnerability_advisory_packet: vulnerability_advisory_packet
          packets:
            vulnerability_advisory_packet: runx.security.vulnerability_advisory.v1

harness:
  files: [fixtures/support/composed.graph]
  cases: []
