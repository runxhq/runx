version: "0.3.11"
minimum_runx: 0.12.0
default_method: scan
catalog:
  visibility: public
  category: security
methods:
  scan:
    description: Assess exact-coordinate vulnerability findings for exposure, priority and practical remediation.
    inputs:
      target:
        type: string
        description: Repository, deployment or package set being reviewed.
      evidence:
        description: A cve-audit.audit.v1 packet or actual findings with source and coverage; no sealed parent receipt is required.
      objective:
        type: string
        description: Decision the operator needs.
        default: Prioritize and propose practical remediation.
        optional: true
      scan_context:
        description: Optional deployment evidence. Each evidence record has id, source and excerpt.
        default: {}
        optional: true
    result_from:
      - finalize
      - finalize-empty
      - stop
    examples:
      - target: acme/storefront
        evidence:
          findings:
            - ecosystem: npm
              dependency: left-pad
              exact_version: 1.2.3
              advisory_id: GHSA-xxxx-yyyy-zzzz
              summary: Denial of service on crafted input.
              dependency_paths:
                - node_modules/left-pad
              affected:
                - package:
                    ecosystem: npm
                    name: left-pad
                  ranges:
                    - events:
                        - introduced: '0'
                        - fixed: 1.2.4
    steps:
      - id: digest-evidence
        tool: data.digest
        inputs:
          value: $input.evidence
      - id: admit
        inputs:
          target: $input.target
          evidence: $input.evidence
          scan_context: $input.scan_context
          evidence_digest: $steps.digest-evidence.digest_result.digest
        tool:
          module: vuln-triage.mjs
          export: admitScan
        outputs:
          triage_context: {type: object}
      - id: assess
        when:
          value: $steps.admit.triage_context.path
          equals: assess
        agent: vuln-triage-assess
        outputs:
          risk_assessment_draft:
            type: object
            properties:
              decision:
                type: string
              advisory_assessments:
                type: array
                items:
                  type: object
                  properties:
                    finding_key:
                      type: string
                    priority:
                      type: string
                    exposure:
                      type: string
                    confidence:
                      type: string
                    exposure_evidence:
                      type: array
                    rationale:
                      type: string
                    recommendation:
                      type: string
                    fixed_version:
                      type: string
              operator_summary:
                type: object
                properties:
                  summary:
                    type: string
            required:
              - decision
        inputs:
          objective: $input.objective
          triage_context: $steps.admit.triage_context
      - id: finalize
        when:
          value: $steps.admit.triage_context.path
          equals: assess
        inputs:
          triage_context: $steps.admit.triage_context
          risk_assessment_draft: $steps.assess.risk_assessment_draft
        tool:
          module: vuln-triage.mjs
          export: finalizeScan
        outputs:
          vulnerability_review: {type: object, packet: runx/vuln-triage.scan.v1}
      - id: finalize-empty
        when:
          value: $steps.admit.triage_context.path
          equals: empty
        inputs:
          triage_context: $steps.admit.triage_context
        tool:
          module: vuln-triage.mjs
          export: finalizeScan
        outputs:
          vulnerability_review: {type: object, packet: runx/vuln-triage.scan.v1}
      - id: stop
        when:
          value: $steps.admit.triage_context.path
          equals: stop
        inputs:
          triage_context: $steps.admit.triage_context
        tool:
          module: vuln-triage.mjs
          export: finalizeScan
        outputs:
          vulnerability_review: {type: object, packet: runx/vuln-triage.scan.v1}
  advisory:
    description: Prepare advisory wording for a validated triage packet. Publishes nothing.
    inputs:
      triage_packet:
        packet: runx/vuln-triage.scan.v1
        description: Validated source-bound vulnerability review.
      audience:
        type: string
        default: affected_users
        description: Intended advisory audience.
        optional: true
    result_from:
      - finalize
      - stop
    steps:
      - id: admit
        inputs:
          triage_packet: $input.triage_packet
          audience: $input.audience
        tool:
          module: vuln-triage.mjs
          export: admitAdvisory
        outputs:
          advisory_context: {type: object}
      - id: draft
        when:
          value: $steps.admit.advisory_context.path
          equals: draft
        agent: vuln-triage-advisory
        outputs:
          advisory_draft:
            type: object
            properties:
              title:
                type: string
              summary:
                type: string
              body:
                type: string
              affected_advisory_ids:
                type: array
                items:
                  type: string
              disclosure_checklist:
                type: array
                items:
                  type: string
            required:
              - title
              - summary
              - body
              - affected_advisory_ids
              - disclosure_checklist
        inputs:
          advisory_context: $steps.admit.advisory_context
          triage_packet: $input.triage_packet
          audience: $input.audience
      - id: finalize
        when:
          value: $steps.admit.advisory_context.path
          equals: draft
        inputs:
          advisory_context: $steps.admit.advisory_context
          advisory_draft: $steps.draft.advisory_draft
        tool:
          module: vuln-triage.mjs
          export: finalizeAdvisory
        outputs:
          vulnerability_advisory_packet: {type: object, packet: runx/vuln-triage.advisory.v1}
      - id: stop
        when:
          value: $steps.admit.advisory_context.path
          equals: stop
        inputs:
          advisory_context: $steps.admit.advisory_context
        tool:
          module: vuln-triage.mjs
          export: finalizeAdvisory
        outputs:
          vulnerability_advisory_packet: {type: object, packet: runx/vuln-triage.advisory.v1}
