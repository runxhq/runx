name: advisory-from-triage
kind: skill
target: ..
runner: advisory
operator_journeys:
  - mode: standalone
    confusors: [cve-audit, vuln-disclosure]
    request: Turn this verified exact-version vulnerability finding into a remediation and advisory packet.
    expected_outcome: Return bounded affected-version, remediation, and advisory evidence without claiming publication.
  - mode: composed
    request: Continue from this verified vulnerability scan into an affected-user advisory.
    expected_outcome: Reuse the exact scan and triage evidence without rescanning dependencies or re-evaluating unsupported exposure.
    prior_evidence:
      - The verified triage packet, exact dependency inventory, and affected audience supplied in the fixture.
    must_not_repeat:
      - Do not rescan the dependency tree.
      - Do not re-fetch or reclassify findings already verified in the triage packet.
inputs:
  audience: affected_users
  triage_packet:
    schema: runx.security.vulnerability_scan.v1
    decision: remediate
    target: example/service
    dependency_inventory:
      - name: example-lib
        version: 1.2.3
        path: node_modules/example-lib
        direct: true
        development: false
    advisories:
      - dependency: example-lib
        exact_version: 1.2.3
        advisory_id: GHSA-example-1234
        advisory_url: https://osv.dev/vulnerability/GHSA-example-1234
        assessment:
          priority: high
          exposure: confirmed
          confidence: high
          evidence_status: verified_exact_cve
          rationale: verified direct dependency
    escalation_criteria:
      - advisory_id: GHSA-example-1234
        trigger: priority_high_or_urgent
        action: human_remediation_review
    remediation_plan:
      immediate:
        - upgrade example-lib
    operator_summary:
      verdict: remediate
      summary: Prioritize the verified direct dependency finding.
    evidence_binding:
      receipt_ref: runx:receipt:sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      evidence_digest: sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
    validation:
      status: pass
      findings: []
    publication_status: not_published
caller:
  answers:
    draft:
      advisory_draft:
        title: Example dependency advisory
        summary: A verified dependency finding requires an upgrade.
        body: example/service includes example-lib 1.2.3, which is affected by GHSA-example-1234. Upgrade after compatibility testing.
        affected_advisory_ids:
          - GHSA-example-1234
        disclosure_checklist:
          - confirm the fixed version
          - confirm deployment timing
expect:
  status: sealed
  receipt:
    schema: runx.receipt.v1
metadata:
  public_skill: vuln-triage
  source_case: advisory-from-triage
  source: skills-fixture
