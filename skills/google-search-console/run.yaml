version: "0.1.18"
minimum_runx: 0.12.0
default_method: performance
catalog:
  visibility: public
  category: growth
shared_inputs:
  property:
    type: string
    description: Exact Search Console HTTP(S) URL-prefix or sc-domain property.
    pattern: ^(?:https?://|sc-domain:).+
  dimensions:
    type: array
    default:
      - page
    description: Ordered Search Console dimensions; an empty list requests a total without grouping.
    minItems: 0
    maxItems: 7
    uniqueItems: true
    items:
      type: string
      enum:
        - query
        - page
        - country
        - device
        - date
        - hour
        - searchAppearance
    optional: true
  search_type:
    type: string
    default: web
    description: Search result surface queried from Search Console.
    enum:
      - web
      - image
      - video
      - news
      - googleNews
      - discover
    optional: true
  data_state:
    type: string
    default: final
    description: Data finality requested from Search Console; hourly_all requires the hour dimension.
    enum:
      - final
      - all
      - hourly_all
    optional: true
  sitemap_plan:
    type: object
    description: Exact digest-bound sitemap plan emitted by plan-sitemap.
    required:
      - schema
      - decision
      - provider
      - operation
      - property
      - sitemap_url
      - provider_status
      - external_status
      - validation
      - plan_digest
    additionalProperties: false
    properties:
      schema:
        const: runx/google-search-console.sitemap_plan.v1
      decision:
        const: ready_for_execution
      provider:
        const: google-search-console
      operation:
        const: sitemaps.submit
      property:
        type: string
        pattern: ^(?:https?://|sc-domain:).+
      sitemap_url:
        type: string
        format: uri
        pattern: ^https?://
      provider_status:
        const: not_called
      external_status:
        const: not_submitted
      validation:
        type: object
        required:
          - status
          - findings
        additionalProperties: false
        properties:
          status:
            const: pass
          findings:
            type: array
            maxItems: 0
      plan_digest:
        type: string
        pattern: ^sha256:[0-9a-f]{64}$
methods:
  performance:
    description: Read live search performance for a property (clicks, impressions, CTR and position), by page or the dimensions you name.
    inputs:
      property: {}
      start_date:
        type: string
        description: Calendar date in YYYY-MM-DD form.
        pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
      end_date:
        type: string
        description: Calendar date in YYYY-MM-DD form.
        pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
      dimensions: {}
      search_type: {}
      data_state: {}
      row_limit:
        type: integer
        default: 1000
        description: Bounded result row limit, at most 25000.
        minimum: 1
        maximum: 25000
        optional: true
      start_row:
        type: integer
        default: 0
        description: Zero-based pagination offset.
        minimum: 0
        optional: true
    examples:
      - property: sc-domain:example.com
        start_date: 2026-07-01
        end_date: 2026-07-31
        dimensions:
          - query
          - page
        search_type: web
        data_state: final
    result_from:
      - finalize
    steps:
      - id: read
        operation: google/search-console/search.analytics.query
        result:
          required:
            - property
            - start_date
            - end_date
            - dimensions
            - search_type
            - data_state
            - rows
            - row_count
            - aggregation_type
            - metadata
            - pagination
            - fetched_at
        inputs:
          property: $input.property
          start_date: $input.start_date
          end_date: $input.end_date
          dimensions: $input.dimensions
          search_type: $input.search_type
          data_state: $input.data_state
          row_limit: $input.row_limit
          start_row: $input.start_row
      - id: normalize
        inputs:
          source_status: provider_readback
          request:
            property: $input.property
            start_date: $input.start_date
            end_date: $input.end_date
            dimensions: $input.dimensions
            search_type: $input.search_type
            data_state: $input.data_state
            row_limit: $input.row_limit
            start_row: $input.start_row
          provider_result: $steps.read.provider_operation.result
        tool:
          module: gsc/performance.mjs
          export: normalizePerformance
        outputs:
          performance_draft: {type: object}
      - id: digest
        tool: data.digest
        inputs:
          value: $steps.normalize.performance_draft
      - id: finalize
        inputs:
          performance_draft: $steps.normalize.performance_draft
          digest_result: $steps.digest.digest_result
        tool:
          module: gsc/performance.mjs
          export: finalizePerformance
        outputs:
          performance_evidence: {type: object}
  normalize-performance:
    description: Normalize Search Console results a trusted import already supplied, without calling Google.
    inputs:
      provider_result:
        type: object
        description: Search Console result with request identity, bounded rows, pagination, and freshness metadata.
        required:
          - rows
        properties:
          property:
            type: string
            pattern: ^(?:https?://|sc-domain:).+
          start_date:
            type: string
            pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
          end_date:
            type: string
            pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
          dimensions:
            type: array
            minItems: 0
            maxItems: 7
            uniqueItems: true
            items:
              type: string
          search_type:
            type: string
          data_state:
            type: string
          rows:
            type: array
            maxItems: 25000
            items:
              type: object
              additionalProperties: true
          row_count:
            type: integer
            minimum: 0
          aggregation_type:
            type: string
          pagination:
            type: object
            additionalProperties: true
            properties:
              start_row:
                type: integer
                minimum: 0
              row_limit:
                type: integer
                minimum: 1
                maximum: 25000
              returned_rows:
                type: integer
                minimum: 0
              complete:
                type: boolean
              next_start_row:
                type:
                  - integer
                  - "null"
                minimum: 0
          metadata:
            type: object
            additionalProperties: true
          fetched_at:
            type: string
            format: date-time
      request:
        type: object
        description: Expected request identity used to bind a supplied Search Console result.
        required:
          - property
          - start_date
          - end_date
        additionalProperties: false
        properties:
          property:
            type: string
            pattern: ^(?:https?://|sc-domain:).+
          start_date:
            type: string
            pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
          end_date:
            type: string
            pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
          dimensions:
            type: array
            minItems: 0
            maxItems: 7
            uniqueItems: true
            items:
              type: string
              enum:
                - query
                - page
                - country
                - device
                - date
                - hour
                - searchAppearance
          search_type:
            type: string
            enum:
              - web
              - image
              - video
              - news
              - googleNews
              - discover
          data_state:
            type: string
            enum:
              - final
              - all
              - hourly_all
          row_limit:
            type: integer
            minimum: 1
            maximum: 25000
          start_row:
            type: integer
            minimum: 0
        optional: true
    examples:
      - request:
          property: https://example.com/
          start_date: 2026-06-01
          end_date: 2026-06-30
          dimensions:
            - page
          search_type: web
          data_state: final
        provider_result:
          property: https://example.com/
          start_date: 2026-06-01
          end_date: 2026-06-30
          dimensions:
            - page
          search_type: web
          data_state: final
          rows:
            - keys:
                - https://example.com/guides/runx
              clicks: 42
              impressions: 600
              ctr: 0.07
              position: 4.2
    result_from:
      - finalize
    steps:
      - id: normalize
        inputs:
          provider_result: $input.provider_result
          request: $input.request
          source_status: supplied_result
        tool:
          module: gsc/performance.mjs
          export: normalizePerformance
        outputs:
          performance_draft: {type: object}
      - id: digest
        tool: data.digest
        inputs:
          value: $steps.normalize.performance_draft
      - id: finalize
        inputs:
          performance_draft: $steps.normalize.performance_draft
          digest_result: $steps.digest.digest_result
        tool:
          module: gsc/performance.mjs
          export: finalizePerformance
        outputs:
          performance_evidence: {type: object}
  sites:
    description: List the Search Console properties the grant can read, before assuming one exists.
    inputs: {}
    result_from:
      - read
    steps:
      - id: read
        operation: google/search-console/sites.list
        result:
          required:
            - sites
        inputs: {}
  inspect-url:
    description: Inspect the current indexed state of one canonical URL.
    inputs:
      property: {}
      inspection_url:
        type: string
        description: Canonical URL within the property.
      language_code:
        type: string
        default: en-US
        description: Requested issue-message language.
        optional: true
    examples:
      - property: sc-domain:example.com
        inspection_url: https://www.example.com/guides/runx
        language_code: en-US
    result_from:
      - finalize
    steps:
      - id: read
        operation: google/search-console/url.inspect
        result:
          required:
            - property
            - inspection_url
            - verdict
            - coverage_state
            - robots_txt_state
            - indexing_state
            - page_fetch_state
            - crawled_as
            - last_crawl_time
            - referring_urls
            - sitemap
            - amp
            - mobile_usability
            - rich_results
            - inspection_link
            - fetched_at
        inputs:
          property: $input.property
          inspection_url: $input.inspection_url
          language_code: $input.language_code
      - id: normalize
        inputs:
          request:
            property: $input.property
            inspection_url: $input.inspection_url
            language_code: $input.language_code
          provider_result: $steps.read.provider_operation.result
        tool:
          module: gsc/inspection.mjs
          export: normalizeInspection
        outputs:
          inspection_draft: {type: object}
      - id: digest
        tool: data.digest
        inputs:
          value: $steps.normalize.inspection_draft
      - id: finalize
        inputs:
          inspection_draft: $steps.normalize.inspection_draft
          digest_result: $steps.digest.digest_result
        tool:
          module: gsc/inspection.mjs
          export: finalizeInspection
        outputs:
          inspection_evidence: {type: object}
  sitemaps:
    description: List the sitemaps submitted for a property.
    inputs:
      property: {}
    examples:
      - property: sc-domain:example.com
    result_from:
      - read
    steps:
      - id: read
        operation: google/search-console/sitemaps.list
        result:
          required:
            - property
            - sitemaps
        inputs:
          property: $input.property
  plan-sitemap:
    description: Plan one sitemap submission bound to its property, without calling Google. Submit it with submit-sitemap.
    inputs:
      property: {}
      sitemap_url:
        type: string
        description: Absolute HTTP(S) sitemap URL covered by the property.
    examples:
      - property: sc-domain:example.com
        sitemap_url: https://www.example.com/sitemap.xml
    result_from:
      - bind
    steps:
      - id: prepare
        inputs:
          property: $input.property
          sitemap_url: $input.sitemap_url
        tool:
          module: gsc/sitemap.mjs
          export: prepareSitemapPlan
        outputs:
          sitemap_plan_draft: {type: object}
          digest_subject: {type: object}
      - id: digest
        tool: data.digest
        inputs:
          value: $steps.prepare.digest_subject
      - id: bind
        inputs:
          sitemap_plan_draft: $steps.prepare.sitemap_plan_draft
          digest_result: $steps.digest.digest_result
        tool:
          module: gsc/sitemap.mjs
          export: bindSitemapPlan
        outputs:
          sitemap_plan: {type: object}
  submit-sitemap:
    description: Submit a planned sitemap under a scoped grant and read it back.
    inputs:
      sitemap_plan: {}
      idempotency_key:
        type: string
        description: Stable UUID for this unchanged sitemap submission.
    examples:
      - sitemap_plan:
          schema: runx/google-search-console.sitemap_plan.v1
          decision: ready_for_execution
          provider: google-search-console
          operation: sitemaps.submit
          property: sc-domain:example.com
          sitemap_url: https://www.example.com/sitemap.xml
          provider_status: not_called
          external_status: not_submitted
          validation:
            status: pass
            findings: []
          plan_digest: sha256:b4fd8d22720f9a14c8143c467909f424bbe26fab7ace4594eeabf554382226fc
        idempotency_key: 00000000-0000-4000-8000-000000000001
    result_from:
      - refuse
      - finalize
    steps:
      - id: digest
        tool: data.digest
        inputs:
          value:
            provider: $input.sitemap_plan.provider
            operation: $input.sitemap_plan.operation
            property: $input.sitemap_plan.property
            sitemap_url: $input.sitemap_plan.sitemap_url
      - id: admit
        inputs:
          sitemap_plan: $input.sitemap_plan
          digest_result: $steps.digest.digest_result
        tool:
          module: gsc/sitemap.mjs
          export: admitSitemapSubmission
        outputs:
          submission_admission: {type: object}
      - id: submit
        when:
          value: $steps.admit.submission_admission.decision
          equals: ready
        operation: google/search-console/sitemaps.submit
        idempotency_key: $input.idempotency_key
        result:
          required:
            - property
            - sitemap_url
            - accepted_at
            - idempotency_key
          equals:
            property: $input.sitemap_plan.property
            sitemap_url: $input.sitemap_plan.sitemap_url
        inputs:
          property: $input.sitemap_plan.property
          sitemap_url: $input.sitemap_plan.sitemap_url
      - id: refuse
        when:
          value: $steps.admit.submission_admission.decision
          equals: blocked
        inputs:
          idempotency_key: $input.idempotency_key
          submission_admission: $steps.admit.submission_admission
        tool:
          module: gsc/sitemap.mjs
          export: refuseSitemapSubmission
        outputs:
          sitemap_submission: {type: object}
      - id: readback
        when:
          value: $steps.admit.submission_admission.decision
          equals: ready
        operation: google/search-console/sitemaps.get
        result:
          required:
            - property
            - sitemap_url
            - status
            - last_submitted
            - last_downloaded
            - error_count
            - warning_count
          equals: $steps.submit.provider_operation.result
        inputs:
          property: $input.sitemap_plan.property
          sitemap_url: $input.sitemap_plan.sitemap_url
      - id: finalize
        when:
          value: $steps.admit.submission_admission.decision
          equals: ready
        inputs:
          idempotency_key: $input.idempotency_key
          sitemap_plan: $input.sitemap_plan
          mutation_result: $steps.submit.provider_operation.result
          readback_result: $steps.readback.provider_operation.result
        tool:
          module: gsc/sitemap.mjs
          export: finalizeSitemapSubmission
        outputs:
          sitemap_submission: {type: object}
  plan-indexing:
    description: Check whether a request belongs in Google's restricted Indexing API lane. Ordinary page indexing is refused.
    inputs:
      url:
        type: string
        description: Exact URL proposed for Google's restricted Indexing API.
      resource_type:
        type: string
        description: Domain resource type, for example article, job_posting, or broadcast_event.
      reason:
        type: string
        description: Operator rationale for the request.
        optional: true
    examples:
      - url: https://example.com/blog/new-post
        resource_type: article
        reason: Check whether this resource is eligible before attempting any provider action.
    result_from:
      - classify
    steps:
      - id: classify
        inputs:
          url: $input.url
          resource_type: $input.resource_type
          reason: $input.reason
        tool:
          module: gsc/indexing.mjs
          export: classifyIndexingRequest
        outputs:
          indexing_admission: {type: object}
