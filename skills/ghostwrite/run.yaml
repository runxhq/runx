skill: ghostwrite
version: "0.4.8"
catalog:
  kind: skill
  audience: public
  visibility: public
  role: context
  execution: read
  completion: runtime_receipt
  approval: none
  category: content
input_definitions:
  objective:
    type: string
    required: true
    description: What the content must accomplish.
  audience:
    type: string
    required: true
    description: Intended reader.
  channel:
    type: string
    required: true
    description: Intended content channel.
  evidence_pack:
    type: json
    required: false
    packet: runx/research.packet.v1
    description: Validated runx/research.packet.v1 evidence.
  facts:
    type: array
    required: false
    description: Factual statements supplied for this writing task, instead of a research packet. They remain
      operator-supplied and not independently verified; never supply both source forms.
    schema:
      minItems: 1
      maxItems: 100
      items:
        type: string
        minLength: 1
        maxLength: 4000
  brand_context:
    type: json
    required: false
    packet: runx/brand-voice.context.v1
    description: Validated runx/brand-voice.context.v1 packet.
  taste_context:
    type: json
    required: false
    packet: runx/taste-profile.context.v1
    description: Validated runx/taste-profile.context.v1 packet.
runners:
  draft:
    description: Write one evidence-bound draft from a ready research or evidence packet, admitting the evidence,
      writing, then verifying every claim against its source.
    default: true
    inputs:
      objective:
        definition: objective
      audience:
        definition: audience
      channel:
        definition: channel
      evidence_pack:
        definition: evidence_pack
      facts:
        definition: facts
      voice_guide:
        type: string
        required: false
        description: Additional project-specific voice constraints.
      brand_context:
        definition: brand_context
      taste_context:
        definition: taste_context
    result_from:
      - reject
      - finalize
    examples:
      - objective: Announce that exports now run in the background.
        audience: existing customers
        channel: changelog
        facts:
        - Exports of any size now run in the background and email a link when finished.
    steps:
      - id: admit
        label: admit validated evidence
        skill: .
        runner: admit
        inputs:
          objective: $input.objective
          audience: $input.audience
          channel: $input.channel
          evidence_pack: $input.evidence_pack
          facts: $input.facts
          brand_context: $input.brand_context
          taste_context: $input.taste_context
      - id: reject
        label: withhold unsupported draft
        when:
          value: $steps.admit.evidence_context.decision
          equals: needs_more_evidence
        skill: .
        runner: verify
        inputs:
          evidence_context: $steps.admit.evidence_context
      - id: author
        label: author from bounded evidence
        when:
          value: $steps.admit.evidence_context.decision
          equals: ready
        agent:
          role: writer
          task: ghostwrite-draft
        outputs:
          content_draft:
            type: object
            schema:
              properties:
                decision:
                  type: string
                content_brief:
                  type: object
                  properties:
                    objective:
                      type: string
                    audience:
                      type: string
                    channel:
                      type: string
                  required:
                  - objective
                  - audience
                  - channel
                draft:
                  type: object
                  properties:
                    title:
                      type: string
                    body:
                      type: string
                    claims:
                      type: array
                      items:
                        type: object
                        properties:
                          claim:
                            type: string
                          source_digests:
                            type: array
                            items:
                              type: string
                        required:
                        - claim
                        - source_digests
                  required:
                  - title
                  - body
                  - claims
                context_binding:
                  type: object
                  properties:
                    applied:
                      type: array
                      items:
                        type: object
                        properties:
                          packet_digest:
                            type: string
                          applied_rules:
                            type: array
                            items:
                              type: string
                          scope_review:
                            type: object
                            properties:
                              decision:
                                type: string
                              reason:
                                type: string
                            required:
                            - decision
                            - reason
                        required:
                        - packet_digest
                        - applied_rules
                        - scope_review
                  required:
                  - applied
                review_checklist:
                  type: array
                  items:
                    type: string
                distribution_notes:
                  type: object
                  properties:
                    primary_channel:
                      type: string
              required:
              - decision
              if:
                properties:
                  decision:
                    pattern: ^ready
              then:
                required:
                - content_brief
                - draft
                - context_binding
                - review_checklist
                - distribution_notes
        inputs:
          objective: $input.objective
          audience: $input.audience
          channel: $input.channel
          voice_guide: $input.voice_guide
          evidence_context: $steps.admit.evidence_context
          evidence_pack: $input.evidence_pack
          brand_context: $input.brand_context
          taste_context: $input.taste_context
        artifacts:
          named_emits:
            content_draft: content_draft
      - id: finalize
        label: verify draft evidence and context bindings
        when:
          value: $steps.admit.evidence_context.decision
          equals: ready
        skill: .
        runner: verify
        inputs:
          evidence_context: $steps.admit.evidence_context
          content_draft: $steps.author.content_draft
  admit:
    description: Admit the evidence packet, and any voice or taste context, that a draft may use, by digest. For a
      skill that composes its own writing turn.
    inputs:
      objective:
        definition: objective
      audience:
        definition: audience
      channel:
        definition: channel
      evidence_pack:
        definition: evidence_pack
      facts:
        definition: facts
      brand_context:
        definition: brand_context
      taste_context:
        definition: taste_context
    result_from:
      - prepare
    steps:
      - id: select-source
        inputs:
          evidence_pack: $input.evidence_pack
          facts: $input.facts
        tool:
          module: ghostwrite.mjs
          export: selectEvidence
        outputs:
          selected_source: object
      - id: digest-evidence
        tool: data.digest
        inputs:
          value: $steps.select-source.selected_source.evidence
      - id: digest-brand-context
        tool: data.digest
        inputs:
          value:
            type: brand_voice
            packet: $input.brand_context
      - id: digest-taste-context
        tool: data.digest
        inputs:
          value:
            type: taste_profile
            packet: $input.taste_context
      - id: prepare
        label: admit validated evidence
        inputs:
          objective: $input.objective
          audience: $input.audience
          channel: $input.channel
          evidence_pack: $steps.select-source.selected_source.evidence
          evidence_kind: $steps.select-source.selected_source.kind
          brand_context: $input.brand_context
          taste_context: $input.taste_context
          evidence_packet_digest: $steps.digest-evidence.digest_result.digest
          brand_context_digest: $steps.digest-brand-context.digest_result.digest
          taste_context_digest: $steps.digest-taste-context.digest_result.digest
        tool:
          module: ghostwrite.mjs
          export: prepareEvidence
        outputs:
          evidence_context: object
        artifacts:
          named_emits:
            evidence_context: evidence_context
  verify:
    description: Check every material claim and context binding of a draft against what was admitted, withholding
      what it cannot bind.
    inputs:
      evidence_context:
        type: json
        required: true
        description: Evidence context returned by `admit`, the authority for source digests and context rules.
      content_draft:
        type: json
        required: false
        description: Candidate draft written from that evidence context; absent when admission withheld the draft.
    result_from:
      - reject
      - finalize
    steps:
      - id: reject
        label: withhold unsupported draft
        when:
          value: $input.evidence_context.decision
          equals: needs_more_evidence
        tool: evidence.verify_artifact
        scopes:
          - runx:evidence:read
        inputs:
          artifact_name: content_draft_packet
          candidate:
            decision: ready
          require_claim_bindings: true
          fallback_artifact:
            decision: needs_more_evidence
            content_brief:
              objective: ""
              audience: ""
              channel: ""
            draft:
              title: ""
              body: ""
              claims: []
            review_checklist: []
            distribution_notes: {}
            evidence_binding:
              evidence_packet_digest: ""
              source_digests: []
            context_binding:
              required: []
              applied: []
          fallback_bindings:
            - target_path: content_brief.objective
              source_path: objective
            - target_path: content_brief.audience
              source_path: audience
            - target_path: content_brief.channel
              source_path: channel
            - target_path: evidence_binding.evidence_packet_digest
              source_path: evidence_packet_digest
            - target_path: evidence_binding.source_digests
              source_path: source_digests
            - target_path: context_binding.required
              source_path: context_requirements
            - target_path: review_checklist
              source_path: blockers
          source_digests: $input.evidence_context.source_digests
          context_requirements: $input.evidence_context.context_requirements
          fallback_source: $input.evidence_context
        artifacts:
          named_emits:
            content_draft_packet: content_draft_packet
          packets:
            content_draft_packet: runx/ghostwrite.draft.v1
      - id: review-context
        label: check recorded editorial applicability
        when:
          value: $input.evidence_context.decision
          equals: ready
        tool:
          module: ghostwrite.mjs
          export: reviewContextUse
        inputs:
          evidence_context: $input.evidence_context
          content_draft: $input.content_draft
        outputs:
          reviewed_draft: object
          review_context: object
      - id: finalize
        label: verify draft evidence and context bindings
        when:
          value: $input.evidence_context.decision
          equals: ready
        tool: evidence.verify_artifact
        scopes:
          - runx:evidence:read
        inputs:
          artifact_name: content_draft_packet
          required_paths:
            - content_brief.objective
            - content_brief.audience
            - content_brief.channel
            - draft.title
            - draft.body
            - draft.claims
          required_value_bindings:
            - candidate_path: content_brief.objective
              source_path: objective
            - candidate_path: content_brief.audience
              source_path: audience
            - candidate_path: content_brief.channel
              source_path: channel
          authoritative_bindings:
            - target_path: distribution_notes.source_assurance
              source_path: evidence_assurance
            - target_path: evidence_binding.evidence_packet_digest
              source_path: evidence_packet_digest
            - target_path: evidence_binding.source_digests
              source_path: source_digests
            - target_path: context_binding.required
              source_path: context_requirements
          fallback_artifact:
            decision: needs_more_evidence
            content_brief:
              objective: ""
              audience: ""
              channel: ""
            draft:
              title: ""
              body: ""
              claims: []
            review_checklist: []
            distribution_notes: {}
            evidence_binding:
              evidence_packet_digest: ""
              source_digests: []
            context_binding:
              required: []
              applied: []
          fallback_bindings:
            - target_path: content_brief.objective
              source_path: objective
            - target_path: content_brief.audience
              source_path: audience
            - target_path: content_brief.channel
              source_path: channel
            - target_path: evidence_binding.evidence_packet_digest
              source_path: evidence_packet_digest
            - target_path: evidence_binding.source_digests
              source_path: source_digests
            - target_path: context_binding.required
              source_path: context_requirements
            - target_path: review_checklist
              source_path: blockers
          candidate: $steps.review-context.reviewed_draft
          identity_source: $input.evidence_context
          authoritative_source: $input.evidence_context
          fallback_source: $steps.review-context.review_context
          source_digests: $input.evidence_context.source_digests
          claim_bindings: $steps.review-context.reviewed_draft.draft.claims
          context_requirements: $input.evidence_context.context_requirements
          context_bindings: $steps.review-context.reviewed_draft.context_binding.applied
        artifacts:
          named_emits:
            content_draft_packet: content_draft_packet
          packets:
            content_draft_packet: runx/ghostwrite.draft.v1
  package:
    description: Turn a verified draft into a channel payload bound to its digest, not yet sent.
    inputs:
      channel:
        type: string
        required: true
        description: Target delivery channel.
      draft:
        type: json
        required: true
        packet: runx/ghostwrite.draft.v1
        description: Validated, evidence-bound runx/ghostwrite.draft.v1 packet.
    result_from:
      - bind
    steps:
      - id: prepare
        inputs:
          channel: $input.channel
          draft: $input.draft
        tool:
          module: ghostwrite.mjs
          export: prepareContent
        outputs:
          publish_draft: object
          digest_input: string
      - id: digest
        tool: data.digest
        inputs:
          encoding: utf8_text
          value: $steps.prepare.digest_input
      - id: bind
        inputs:
          publish_draft: $steps.prepare.publish_draft
          digest_result: $steps.digest.digest_result
        tool:
          module: ghostwrite.mjs
          export: bindContent
        outputs:
          content_publish_packet:
            type: object
        artifacts:
          named_emits:
            content_publish_packet: content_publish_packet
          packets:
            content_publish_packet: runx/ghostwrite.publish.v1
  handoff:
    description: Bind a packaged payload to its exact target, and say who delivers it next and whether that needs
      approval. Sends nothing.
    inputs:
      channel:
        type: string
        required: true
        description: Target outward channel.
      boundary_kind:
        type: string
        required: true
        schema:
          enum:
            - internal
            - external
        description: Whether delivery crosses outside the team; an external delivery needs the delivering lane's own
          approval.
      packet:
        type: json
        required: true
        packet: runx/ghostwrite.publish.v1
        description: Content publication packet from `package`, bound to its payload digest.
      target:
        type: json
        required: true
        description: Exact downstream target locator.
    steps:
      - id: handoff
        tool:
          module: ghostwrite.mjs
          export: prepareHandoff
        inputs:
          channel: $input.channel
          boundary_kind: $input.boundary_kind
          packet: $input.packet
          target: $input.target
        outputs:
          handoff_packet:
            type: object
          boundary_state:
            type: object
        artifacts:
          wrap_as: content_handoff_packet
          packet: runx/ghostwrite.handoff.v1
harness:
  files:
    - fixtures/support/composed.graph
  cases: []
