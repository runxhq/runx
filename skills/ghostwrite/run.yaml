skill: ghostwrite
version: "0.4.4"

catalog:
  kind: skill
  audience: public
  visibility: public
  role: context
  execution: read
  completion: runtime_receipt
  approval: none
  category: content

input_definitions:
  objective:
    type: string
    required: true
    description: What the content must accomplish.
  audience:
    type: string
    required: true
    description: Intended reader.
  channel:
    type: string
    required: true
    description: Intended content channel.
  evidence_pack:
    type: json
    required: true
    packet: runx.research.packet.v1
    description: Validated runx.research.packet.v1 evidence.
  brand_context:
    type: json
    required: false
    packet: runx.context.brand_voice.v1
    description: Validated runx.context.brand_voice.v1 packet.
  taste_context:
    type: json
    required: false
    packet: runx.context.taste_profile.v1
    description: Validated runx.context.taste_profile.v1 packet.

runners:
  draft:
    default: true
    inputs:
      objective: { definition: objective }
      audience: { definition: audience }
      channel: { definition: channel }
      evidence_pack: { definition: evidence_pack }
      voice_guide:
        type: string
        required: false
        description: Additional project-specific voice constraints.
      brand_context: { definition: brand_context }
      taste_context: { definition: taste_context }
    result_from: [reject, finalize]
    steps:
      - id: admit
        label: admit validated evidence
        skill: .
        runner: admit
        inputs:
          objective: $input.objective
          audience: $input.audience
          channel: $input.channel
          evidence_pack: $input.evidence_pack
          brand_context: $input.brand_context
          taste_context: $input.taste_context

      - id: reject
        label: withhold unsupported draft
        when:
          value: $steps.admit.evidence_context.decision
          equals: needs_more_evidence
        skill: .
        runner: verify
        inputs:
          evidence_context: $steps.admit.evidence_context

      - id: author
        label: author from bounded evidence
        when:
          value: $steps.admit.evidence_context.decision
          equals: ready
        agent: { role: writer, task: ghostwrite-draft }
        outputs:
          content_draft: object
        inputs:
          objective: $input.objective
          audience: $input.audience
          channel: $input.channel
          voice_guide: $input.voice_guide
          evidence_context: $steps.admit.evidence_context
          evidence_pack: $input.evidence_pack
          brand_context: $input.brand_context
          taste_context: $input.taste_context
        artifacts:
          named_emits:
            content_draft: content_draft

      - id: finalize
        label: verify draft evidence and context bindings
        when:
          value: $steps.admit.evidence_context.decision
          equals: ready
        skill: .
        runner: verify
        inputs:
          evidence_context: $steps.admit.evidence_context
          content_draft: $steps.author.content_draft

  admit:
    inputs:
      objective: { definition: objective }
      audience: { definition: audience }
      channel: { definition: channel }
      evidence_pack: { definition: evidence_pack }
      brand_context: { definition: brand_context }
      taste_context: { definition: taste_context }
    result_from: [prepare]
    steps:
      - id: digest-evidence
        tool: data.digest
        inputs:
          value: $input.evidence_pack

      - id: digest-brand-context
        tool: data.digest
        inputs:
          value:
            type: brand_voice
            packet: $input.brand_context

      - id: digest-taste-context
        tool: data.digest
        inputs:
          value:
            type: taste_profile
            packet: $input.taste_context

      - id: prepare
        label: admit validated evidence
        inputs:
          objective: $input.objective
          audience: $input.audience
          channel: $input.channel
          evidence_pack: $input.evidence_pack
          brand_context: $input.brand_context
          taste_context: $input.taste_context
          evidence_packet_digest: $steps.digest-evidence.digest_result.digest
          brand_context_digest: $steps.digest-brand-context.digest_result.digest
          taste_context_digest: $steps.digest-taste-context.digest_result.digest
        tool: { module: ghostwrite.mjs, export: prepareEvidence }
        outputs:
          evidence_context: object
        artifacts:
          named_emits:
            evidence_context: evidence_context

  verify:
    inputs:
      evidence_context:
        type: json
        required: true
        description: Evidence context returned by `admit`, the authority for source digests and context rules.
      content_draft:
        type: json
        required: false
        description: Candidate draft written from that evidence context; absent when admission withheld the draft.
    result_from: [reject, finalize]
    steps:
      - id: reject
        label: withhold unsupported draft
        when:
          value: $input.evidence_context.decision
          equals: needs_more_evidence
        tool: evidence.verify_artifact
        scopes:
          - runx:evidence:read
        inputs:
          artifact_name: content_draft_packet
          candidate:
            decision: ready
          require_claim_bindings: true
          fallback_artifact:
            decision: needs_more_evidence
            content_brief:
              objective: ""
              audience: ""
              channel: ""
            draft:
              title: ""
              body: ""
              claim_refs: []
            review_checklist: []
            distribution_notes: {}
            evidence_binding:
              evidence_packet_digest: ""
              source_digests: []
            context_binding:
              required: []
              applied: []
          fallback_bindings:
            - target_path: content_brief.objective
              source_path: objective
            - target_path: content_brief.audience
              source_path: audience
            - target_path: content_brief.channel
              source_path: channel
            - target_path: evidence_binding.evidence_packet_digest
              source_path: evidence_packet_digest
            - target_path: evidence_binding.source_digests
              source_path: source_digests
            - target_path: context_binding.required
              source_path: context_requirements
          source_digests: $input.evidence_context.source_digests
          context_requirements: $input.evidence_context.context_requirements
          fallback_source: $input.evidence_context
        artifacts:
          named_emits:
            content_draft_packet: content_draft_packet
          packets:
            content_draft_packet: runx.content.draft.v1

      - id: finalize
        label: verify draft evidence and context bindings
        when:
          value: $input.evidence_context.decision
          equals: ready
        tool: evidence.verify_artifact
        scopes:
          - runx:evidence:read
        inputs:
          artifact_name: content_draft_packet
          required_paths:
            - content_brief.objective
            - content_brief.audience
            - content_brief.channel
            - draft.title
            - draft.body
            - draft.claim_refs
          required_value_bindings:
            - candidate_path: content_brief.objective
              source_path: objective
            - candidate_path: content_brief.audience
              source_path: audience
            - candidate_path: content_brief.channel
              source_path: channel
          authoritative_bindings:
            - target_path: evidence_binding.evidence_packet_digest
              source_path: evidence_packet_digest
            - target_path: evidence_binding.source_digests
              source_path: source_digests
            - target_path: context_binding.required
              source_path: context_requirements
          fallback_artifact:
            decision: needs_more_evidence
            content_brief:
              objective: ""
              audience: ""
              channel: ""
            draft:
              title: ""
              body: ""
              claim_refs: []
            review_checklist: []
            distribution_notes: {}
            evidence_binding:
              evidence_packet_digest: ""
              source_digests: []
            context_binding:
              required: []
              applied: []
          fallback_bindings:
            - target_path: content_brief.objective
              source_path: objective
            - target_path: content_brief.audience
              source_path: audience
            - target_path: content_brief.channel
              source_path: channel
            - target_path: evidence_binding.evidence_packet_digest
              source_path: evidence_packet_digest
            - target_path: evidence_binding.source_digests
              source_path: source_digests
            - target_path: context_binding.required
              source_path: context_requirements
          candidate: $input.content_draft
          identity_source: $input.evidence_context
          authoritative_source: $input.evidence_context
          fallback_source: $input.evidence_context
          source_digests: $input.evidence_context.source_digests
          claim_bindings: $input.content_draft.draft.claim_refs
          context_requirements: $input.evidence_context.context_requirements
          context_bindings: $input.content_draft.context_binding.applied
        artifacts:
          named_emits:
            content_draft_packet: content_draft_packet
          packets:
            content_draft_packet: runx.content.draft.v1

  package:
    inputs:
      channel:
        type: string
        required: true
        description: Target delivery channel.
      draft:
        type: json
        required: true
        packet: runx.content.draft.v1
        description: Validated, evidence-bound runx.content.draft.v1 packet.
    result_from: [bind]
    steps:
      - id: prepare
        inputs:
          channel: $input.channel
          draft: $input.draft
        tool: { module: ghostwrite.mjs, export: prepareContent }
        outputs:
          publish_draft: object
          digest_input: string
      - id: digest
        tool: data.digest
        inputs:
          encoding: utf8_text
          value: $steps.prepare.digest_input
      - id: bind
        inputs:
          publish_draft: $steps.prepare.publish_draft
          digest_result: $steps.digest.digest_result
        tool: { module: ghostwrite.mjs, export: bindContent }
        outputs:
          content_publish_packet:
            type: object
            schema:
              additionalProperties: false
              required: [decision, channel, headline, body, evidence_binding, delivery_status, blockers, payload_digest]
              properties:
                decision: { enum: [ready_for_handoff, needs_input] }
                channel: { type: string }
                headline: { type: string }
                body: { type: string }
                evidence_binding:
                  type: object
                  additionalProperties: false
                  properties:
                    evidence_packet_digest: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
                    source_digests:
                      type: array
                      minItems: 1
                      items: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
                delivery_status: { const: not_sent }
                blockers: { type: array, items: { type: string, minLength: 1 } }
                payload_digest: { type: string }
              # A packet ready for handoff carries its evidence binding and its
              # payload's digest.
              if: { properties: { decision: { const: ready_for_handoff } } }
              then:
                properties:
                  headline: { minLength: 1 }
                  body: { minLength: 1 }
                  evidence_binding: { required: [evidence_packet_digest, source_digests] }
                  payload_digest: { pattern: '^sha256:[0-9a-f]{64}$' }
                  blockers: { maxItems: 0 }
        artifacts:
          named_emits:
            content_publish_packet: content_publish_packet
          packets:
            content_publish_packet: runx.content.publish.v1

  handoff:
    inputs:
      channel:
        type: string
        required: true
        description: Target outward channel.
      boundary_kind:
        type: string
        required: true
        schema: { enum: [internal, external] }
        description: Whether delivery crosses outside the team; an external delivery needs the delivering lane's own approval.
      packet:
        type: json
        required: true
        packet: runx.content.publish.v1
        description: Content publication packet from `package`, bound to its payload digest.
      target:
        type: json
        required: true
        description: Exact downstream target locator.
    steps:
      - id: handoff
        tool: { module: ghostwrite.mjs, export: prepareHandoff }
        inputs:
          channel: $input.channel
          boundary_kind: $input.boundary_kind
          packet: $input.packet
          target: $input.target
        outputs:
          handoff_packet:
            type: object
            schema:
              additionalProperties: false
              required: [decision, channel, payload_digest, packet, target, delivery_status, blockers]
              properties:
                decision: { enum: [handoff_ready, needs_input] }
                channel: { type: string }
                payload_digest: { type: string }
                # The publication packet as `package` produced it.
                packet: { type: object, additionalProperties: true }
                # The target locator the delivering lane reads.
                target: { type: object, additionalProperties: true }
                delivery_status: { const: not_sent }
                blockers: { type: array, items: { type: string, minLength: 1 } }
          boundary_state:
            type: object
            schema:
              additionalProperties: false
              required: [boundary_kind, completion_state, next_actor, approval_required_for_delivery, ack_expected]
              properties:
                boundary_kind: { enum: [internal, external] }
                completion_state: { enum: [handoff_ready, needs_input] }
                next_actor: { enum: [governed_provider_adapter, operator] }
                approval_required_for_delivery: { type: boolean }
                ack_expected: { type: boolean }
        artifacts:
          wrap_as: content_handoff_packet
          packet: runx.content.handoff.v1

harness:
  files: [fixtures/support/composed.graph]
  cases: []
