name: webhook-handoff-n8n-needs-its-webhook-host
kind: skill
target: ..
operator_journeys:
  - mode: refusal
    confusors: [message-send, content-package]
    request: Hand this payload to my n8n workflow.
    expected_outcome: Refuse before approval, because an n8n handoff names the workspace host its webhook lives on.
setup: { credentials: [n8n] }
env: { N8N_WEBHOOK_URL: 'https://acme.app.n8n.cloud/webhook/runx-governed-effect' }
inputs:
  platform: n8n
  event_id: evt_n8n_demo_001
  execution_context: { caller: runx-cli, workflow: n8n-cloud-demo }
  payload: { hello: workflow }
expect:
  status: failure
  steps: [terms, build-handoff-context, address]
metadata: { public_skill: webhook-handoff, source_case: direct-default-missing-host, source: skills-fixture }
