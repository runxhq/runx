version: "0.1.10"
minimum_runx: 0.12.0
catalog:
  visibility: public
  category: content
methods:
  draft:
    inputs:
      template:
        type: object
        description: Versioned contract template with stable clause baselines and required term keys.
        additionalProperties: false
        required:
          - id
          - version
          - title
          - required_terms
          - clauses
        properties:
          id:
            type: string
            minLength: 1
            maxLength: 500
            pattern: \S
          version:
            type: string
            minLength: 1
            maxLength: 100
            pattern: \S
          title:
            type: string
            minLength: 1
            maxLength: 500
            pattern: \S
          required_terms:
            type: array
            maxItems: 200
            uniqueItems: true
            items:
              type: string
              minLength: 1
              maxLength: 200
              pattern: \S
          clauses:
            type: array
            minItems: 1
            maxItems: 200
            items:
              type: object
              additionalProperties: false
              required:
                - id
                - heading
                - baseline
              properties:
                id:
                  type: string
                  minLength: 1
                  maxLength: 200
                  pattern: \S
                heading:
                  type: string
                  minLength: 1
                  maxLength: 500
                  pattern: \S
                baseline:
                  type: string
                  minLength: 1
                  maxLength: 20000
                  pattern: \S
      parties:
        type: object
        description: Explicit party records referenced by template placeholders; no party may be inferred.
        minProperties: 1
        propertyNames:
          not:
            const: terms
        additionalProperties:
          type: object
          minProperties: 1
          additionalProperties: true
      terms:
        type: object
        description: Explicit deal terms; every template required term must be supplied.
        additionalProperties: true
    examples:
      - template:
          id: msa-basic-v1
          version: "1.0"
          title: Services Agreement
          required_terms:
            - fee_usd
          clauses:
            - id: fees
              heading: Fees and Payment
              baseline: Customer will pay USD {{terms.fee_usd}}.
        parties:
          customer:
            legal_name: Globex LLC
        terms:
          fee_usd: 4000
    result_from:
      - stop
      - finalize
    steps:
      - id: admit
        inputs:
          template: $input.template
          parties: $input.parties
          terms: $input.terms
        tool:
          module: contract-draft.mjs
          export: admitRequest
        outputs:
          draft_context: {type: object}
      - id: stop
        when:
          value: $steps.admit.draft_context.path
          equals: stop
        inputs:
          draft_context: $steps.admit.draft_context
          template: $input.template
          parties: $input.parties
          terms: $input.terms
        tool:
          module: contract-draft.mjs
          export: finalizeDraft
        outputs:
          contract_draft: {type: object, packet: runx/contract-draft.draft.v1}
      - id: digest-template
        when:
          value: $steps.admit.draft_context.path
          equals: draft
        tool: data.digest
        inputs:
          value: $input.template
      - id: digest-parties
        when:
          value: $steps.admit.draft_context.path
          equals: draft
        tool: data.digest
        inputs:
          value: $input.parties
      - id: digest-terms
        when:
          value: $steps.admit.draft_context.path
          equals: draft
        tool: data.digest
        inputs:
          value: $input.terms
      - id: assemble
        when:
          value: $steps.admit.draft_context.path
          equals: draft
        agent: contract-draft-assemble
        outputs:
          draft_doc:
            type: object
            additionalProperties: false
            required:
              - title
              - clauses
              - deviations
            properties:
              title:
                type: string
                minLength: 1
                maxLength: 500
                pattern: \S
              clauses:
                type: array
                minItems: 1
                maxItems: 200
                items:
                  type: object
                  additionalProperties: false
                  required:
                    - id
                    - heading
                    - text
                  properties:
                    id:
                      type: string
                      minLength: 1
                      maxLength: 200
                      pattern: \S
                    heading:
                      type: string
                      minLength: 1
                      maxLength: 500
                      pattern: \S
                    text:
                      type: string
                      minLength: 1
                      maxLength: 20000
                      pattern: \S
              deviations:
                type: array
                description: Differences from the baseline after rendering supplied values. Placeholder substitution is not a deviation; use an empty array when rendered clauses match.
                maxItems: 200
                items:
                  type: object
                  additionalProperties: false
                  required:
                    - clause_id
                    - reason
                  properties:
                    clause_id:
                      type: string
                      minLength: 1
                      maxLength: 200
                      pattern: \S
                    reason:
                      type: string
                      minLength: 1
                      maxLength: 2000
                      pattern: \S
        inputs:
          template: $input.template
          parties: $input.parties
          terms: $input.terms
      - id: finalize
        when:
          value: $steps.admit.draft_context.path
          equals: draft
        inputs:
          template: $input.template
          parties: $input.parties
          terms: $input.terms
          draft_context: $steps.admit.draft_context
          draft_doc: $steps.assemble.draft_doc
          template_digest: $steps.digest-template.digest_result.digest
          parties_digest: $steps.digest-parties.digest_result.digest
          terms_digest: $steps.digest-terms.digest_result.digest
        tool:
          module: contract-draft.mjs
          export: finalizeDraft
        outputs:
          contract_draft:
            type: object
            packet: runx/contract-draft.draft.v1
