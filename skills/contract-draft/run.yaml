skill: contract-draft
version: "0.1.9"

catalog:
  kind: graph
  audience: operator
  visibility: public
  category: content
  role: canonical
  execution: plan
  completion: runtime_receipt
  approval: none

harness:
  files: [fixtures/support/composed.graph]
  cases:
    - name: contract-draft-complete-draft-seals
      operator_journeys:
        - mode: standalone
          confusors: [ghostwrite, message-send]
          request: Draft this services agreement from the approved template with every required term bound.
          expected_outcome: Return a sealed draft where every clause reconciles with the rendered template and delivery stays behind a human gate.
        - mode: composed
          request: Continue from this sealed contract draft into the governed delivery step.
          expected_outcome: Reuse the sealed draft and its send proposal without re-drafting any clause.
          prior_evidence:
            - The template, parties, terms, and sealed draft supplied by the prior step.
          must_not_repeat:
            - Do not re-render or re-negotiate clauses already sealed.
      inputs:
        template:
          id: msa-basic-v1
          version: "1.0"
          title: Services Agreement
          required_terms: [services, fee_usd]
          clauses:
            - id: parties
              heading: Parties
              baseline: "This Services Agreement is between {{provider.legal_name}} and {{customer.legal_name}}."
            - id: fees
              heading: Fees and Payment
              baseline: "Customer will pay USD {{terms.fee_usd}} for {{terms.services}}."
        parties:
          provider: { legal_name: Acme Pty Ltd }
          customer: { legal_name: Globex LLC }
        terms:
          services: monthly platform maintenance
          fee_usd: 4000
      caller:
        answers:
          assemble:
            draft_doc:
              title: Services Agreement
              clauses:
                - id: parties
                  heading: Parties
                  text: This Services Agreement is between Acme Pty Ltd and Globex LLC.
                - id: fees
                  heading: Fees and Payment
                  text: Customer will pay USD 4000 for monthly platform maintenance.
              deviations: []
      expect:
        status: sealed
        steps: [admit, digest-template, digest-parties, digest-terms, assemble, finalize]
        step_outputs:
          finalize:
            subset:
              contract_draft:
                data:
                  schema: runx/contract-draft.draft.v1
                  decision: drafted
                  deviations: []
                  send_proposal:
                    gate: human-approver
                    delivery_skill: message-send
                    sent: false
                  delivery_performed: false
                  validation: { status: pass, findings: [] }
        receipt: { schema: runx.receipt.v1 }

    - name: contract-draft-declared-deviation-seals
      inputs:
        template:
          id: msa-basic-v1
          version: "1.0"
          title: Services Agreement
          required_terms: [fee_usd]
          clauses:
            - id: fees
              heading: Fees and Payment
              baseline: "Customer will pay USD {{terms.fee_usd}} within 30 days after invoice."
        parties:
          customer: { legal_name: Globex LLC }
        terms:
          fee_usd: 4000
      caller:
        answers:
          assemble:
            draft_doc:
              title: Services Agreement
              clauses:
                - id: fees
                  heading: Fees and Payment
                  text: Customer will pay USD 4000 within 45 days after invoice.
              deviations:
                - clause_id: fees
                  reason: Customer requested 45-day payment terms and the operator approved the extension.
      expect:
        status: sealed
        steps: [admit, digest-template, digest-parties, digest-terms, assemble, finalize]
        step_outputs:
          finalize:
            subset:
              contract_draft:
                data:
                  decision: drafted
                  validation: { status: pass, findings: [] }
        receipt: { schema: runx.receipt.v1 }

    - name: contract-draft-undeclared-deviation-refuses
      inputs:
        template:
          id: msa-basic-v1
          version: "1.0"
          title: Services Agreement
          required_terms: [fee_usd]
          clauses:
            - id: fees
              heading: Fees and Payment
              baseline: "Customer will pay USD {{terms.fee_usd}} within 30 days after invoice."
        parties:
          customer: { legal_name: Globex LLC }
        terms:
          fee_usd: 4000
      caller:
        answers:
          assemble:
            draft_doc:
              title: Services Agreement
              clauses:
                - id: fees
                  heading: Fees and Payment
                  text: Customer will pay USD 9000 within 90 days after invoice.
              deviations: []
      expect:
        status: sealed
        steps: [admit, digest-template, digest-parties, digest-terms, assemble, finalize]
        step_outputs:
          finalize:
            subset:
              contract_draft:
                data:
                  decision: refused
                  document: null
                  send_proposal: null
                  validation: { status: fail }
        receipt: { schema: runx.receipt.v1 }

    - name: contract-draft-missing-term-stops
      inputs:
        template:
          id: msa-basic-v1
          version: "1.0"
          title: Services Agreement
          required_terms: [fee_usd, services]
          clauses:
            - id: fees
              heading: Fees and Payment
              baseline: "Customer will pay USD {{terms.fee_usd}} for {{terms.services}}."
        parties:
          customer: { legal_name: Globex LLC }
        terms:
          fee_usd: 4000
      expect:
        status: sealed
        steps: [admit, stop]
        step_outputs:
          stop:
            subset:
              contract_draft:
                data:
                  decision: refused
                  document: null
                  send_proposal: null
                  validation: { status: fail }
        receipt: { schema: runx.receipt.v1 }

runners:
  draft:
    default: true
    inputs:
      template:
        type: object
        required: true
        description: Versioned contract template with stable clause baselines and required term keys.
      parties:
        type: object
        required: true
        description: Explicit party records referenced by template placeholders; no party may be inferred.
      terms:
        type: object
        required: true
        description: Explicit deal terms; every template required term must be supplied.
    examples:
      - template:
          id: msa-basic-v1
          version: "1.0"
          title: Services Agreement
          required_terms: [fee_usd]
          clauses:
            - id: fees
              heading: Fees and Payment
              baseline: "Customer will pay USD {{terms.fee_usd}}."
        parties:
          customer: { legal_name: Globex LLC }
        terms:
          fee_usd: 4000
    result_from: [stop, finalize]
    steps:
      - id: admit
        label: admit only complete template, party, and term evidence
        inputs:
          template: $input.template
          parties: $input.parties
          terms: $input.terms
        tool: { module: contract-draft.mjs, export: admitRequest }
        outputs:
          draft_context: object

      - id: stop
        when:
          value: $steps.admit.draft_context.path
          equals: stop
        inputs:
          draft_context: $steps.admit.draft_context
          template: $input.template
          parties: $input.parties
          terms: $input.terms
        tool: { module: contract-draft.mjs, export: finalizeDraft }
        outputs:
          contract_draft: object
        artifacts:
          named_emits:
            contract_draft: contract_draft
          packets:
            contract_draft: runx/contract-draft.draft.v1

      - id: digest-template
        when:
          value: $steps.admit.draft_context.path
          equals: draft
        tool: data.digest
        inputs:
          value: $input.template

      - id: digest-parties
        when:
          value: $steps.admit.draft_context.path
          equals: draft
        tool: data.digest
        inputs:
          value: $input.parties

      - id: digest-terms
        when:
          value: $steps.admit.draft_context.path
          equals: draft
        tool: data.digest
        inputs:
          value: $input.terms

      - id: assemble
        label: draft clauses from the template under declared-deviation rules
        when:
          value: $steps.admit.draft_context.path
          equals: draft
        agent: { role: reviewer, task: contract-draft-assemble }
        outputs:
          draft_doc: object
        inputs:
          template: $input.template
          parties: $input.parties
          terms: $input.terms
        artifacts:
          named_emits:
            draft_doc: draft_doc

      - id: finalize
        label: reconcile the draft against the rendered template deterministically
        when:
          value: $steps.admit.draft_context.path
          equals: draft
        inputs:
          template: $input.template
          parties: $input.parties
          terms: $input.terms
          draft_context: $steps.admit.draft_context
          draft_doc: $steps.assemble.draft_doc
          template_digest: $steps.digest-template.digest_result.digest
          parties_digest: $steps.digest-parties.digest_result.digest
          terms_digest: $steps.digest-terms.digest_result.digest
        tool: { module: contract-draft.mjs, export: finalizeDraft }
        outputs:
          contract_draft:
            type: object
        artifacts:
          named_emits:
            contract_draft: contract_draft
          packets:
            contract_draft: runx/contract-draft.draft.v1
