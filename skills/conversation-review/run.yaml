version: "0.1.11"
minimum_runx: 0.12.0
default_method: review
catalog:
  visibility: public
  category: ops

methods:
  review:
    description: Review one conversation thread you supply, preparing an unsent reply or follow-up and flagging a genuine coding request for engineering intake.
    inputs:
      source_locator:
        type: string
        description: Exact observed message locator.
        "minLength": 1
        "maxLength": 1000
        "pattern": "\\S"
      source_digest:
        type: string
        description: Digest of the admitted observation.
        pattern: '^sha256:[0-9a-f]{64}$'
      thread_locator:
        type: string
        description: Exact provider thread locator.
        "minLength": 1
        "maxLength": 1000
        "pattern": "\\S"
      title:
        type: string
        description: Bounded provider-backed thread title.
        "minLength": 1
        "maxLength": 200
        "pattern": "\\S"
      body:
        type: string
        description: Bounded text of the selected message.
        "minLength": 1
        "maxLength": 4000
        "pattern": "\\S"
      thread:
        type: "object"
        description: Bounded provider-neutral messages and coverage metadata.
        required: [source_locator, source_digest, thread_locator, coverage_incomplete, messages]
        additionalProperties: false
        properties:
          source_locator: {"type": "string", "minLength": 1, "maxLength": 1000, "pattern": "\\S"}
          source_digest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
          thread_locator: {"type": "string", "minLength": 1, "maxLength": 1000, "pattern": "\\S"}
          coverage_incomplete: {type: boolean}
          omitted_before_count: {type: [integer, "null"], minimum: 0}
          messages:
            type: array
            maxItems: 30
            items:
              type: object
              required: [text]
              additionalProperties: false
              properties:
                message_locator: {type: string, maxLength: 1000}
                author_id: {type: string, maxLength: 1000}
                direction: {type: string, maxLength: 50}
                is_self: {type: boolean}
                occurred_at: {type: string, maxLength: 100}
                text: {type: string, maxLength: 4000}
      source_complete:
        type: boolean
        description: Whether the source reader proved the supplied context complete.
    result_from: [finalize]
    examples:
      - title: Export job keeps timing out
        body: Is there a way to run the export overnight? It keeps timing out for us.
        source_locator: slack://acme/C0123/1730000000.000200
        source_digest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        source_complete: true
        thread_locator: slack://acme/C0123/1730000000.000100
        thread:
          source_locator: slack://acme/C0123/1730000000.000200
          source_digest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          thread_locator: slack://acme/C0123/1730000000.000100
          coverage_incomplete: false
          messages:
            - message_locator: slack://acme/C0123/1730000000.000200
              author_id: customer
              is_self: false
              text: Is there a way to run the export overnight? It keeps timing out for us.
    steps:
      - id: judge
        agent: conversation-review
        outputs:
          draft:
            type: object
            additionalProperties: false
            required:
              - kind
              - summary
              - reason
              - draft_message
              - request_quote
            properties:
              kind:
                enum:
                  - reply
                  - follow_up
                  - coding
                  - no_action
                  - needs_context
              summary:
                type: string
                minLength: 1
                maxLength: 1000
                pattern: \S
              reason:
                type: string
                minLength: 1
                maxLength: 1000
                pattern: \S
              draft_message:
                type:
                  - string
                  - "null"
                maxLength: 4000
              request_quote:
                type:
                  - string
                  - "null"
                maxLength: 1000
              follow_up_task:
                type:
                  - string
                  - "null"
                maxLength: 1000
        inputs:
          title: $input.title
          body: $input.body
          thread: $input.thread
          source_complete: $input.source_complete
          source_locator: $input.source_locator
          source_digest: $input.source_digest
          thread_locator: $input.thread_locator
      - id: finalize
        inputs:
          source_locator: $input.source_locator
          source_digest: $input.source_digest
          thread_locator: $input.thread_locator
          title: $input.title
          body: $input.body
          thread: $input.thread
          source_complete: $input.source_complete
          draft: $steps.judge.draft
        tool: {module: conversation-review.mjs, export: finalizeConversation}
        outputs:
          conversation_packet:
            type: object
            packet: runx/conversation-review.review.v1
  operate:
    description: Review a conversation from a source packet and propose its reply, coding intake or follow-up on the handoff routes the operator configured, as a work outcome.
    inputs:
      source_context:
        packet: runx.source_packet.v1
        description: Exact adapter-normalized source evidence.
      handoff_routes:
        type: object
        description: Operator-configured reply, coding and ordinary follow-up routes.
        additionalProperties: false
        properties:
          reply: {type: string, minLength: 1, maxLength: 64}
          coding: {type: string, minLength: 1, maxLength: 64}
          follow_up: {type: string, minLength: 1, maxLength: 64}
        optional: true
    result_from: [finish]
    steps:
      - id: prepare
        inputs:
          source_context: $input.source_context
        tool: {module: conversation-review.mjs, export: prepareWork}
        outputs: {review_inputs: {type: object}}
      - id: review
        skill: .#review
        inputs:
          source_locator: $steps.prepare.review_inputs.source_locator
          source_digest: $steps.prepare.review_inputs.source_digest
          thread_locator: $steps.prepare.review_inputs.thread_locator
          title: $steps.prepare.review_inputs.title
          body: $steps.prepare.review_inputs.body
          thread: $steps.prepare.review_inputs.thread
          source_complete: $steps.prepare.review_inputs.source_complete
      - id: finish
        inputs:
          handoff_routes: $input.handoff_routes
          conversation_packet: $steps.review.conversation_packet
        tool: {module: conversation-review.mjs, export: finishWork}
        outputs: {work_result: {type: object, packet: runx.work_outcome.v1}}
  batch:
    description: Review each conversation of a batch on its own, collecting every conversation's review packet, or its failure with the reason. Sends nothing.
    inputs:
      conversations:
        type: array
        description: The conversations, each exactly as review takes it. One conversation's failure is that conversation's outcome. At most three for now, the most that fit the script worker's 4 MiB input bound at the review schema's largest; once the worker takes a script's inputs by reference, the limit rises to what max_calls and the receipt budget allow.
        minItems: 1
        maxItems: 3
        items:
          type: object
          description: One conversation's review inputs, which review validates. Its source_locator names its outcome.
          required: [source_locator]
          additionalProperties: true
          properties:
            source_locator: {type: string, minLength: 1, maxLength: 1000, pattern: \S}
    result_from: [batch]
    examples:
      - conversations:
          - source_locator: slack://acme/C0123/1730000000.000200
            source_digest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
            thread_locator: slack://acme/C0123/1730000000.000100
            title: Export job keeps timing out
            body: Is there a way to run the export overnight? It keeps timing out for us.
            thread:
              source_locator: slack://acme/C0123/1730000000.000200
              source_digest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
              thread_locator: slack://acme/C0123/1730000000.000100
              coverage_incomplete: false
              messages:
                - text: Is there a way to run the export overnight? It keeps timing out for us.
            source_complete: true
          - source_locator: nitrosend://acme/42/7
            source_digest: sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
            thread_locator: nitrosend://acme/42
            title: A quick call
            body: Could we find time to talk next week?
            thread:
              source_locator: nitrosend://acme/42/7
              source_digest: sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
              thread_locator: nitrosend://acme/42
              coverage_incomplete: false
              messages:
                - text: Could we find time to talk next week?
            source_complete: true
    steps:
      - id: batch
        script: {module: batch.mjs}
        inputs:
          conversations: $input.conversations
        calls:
          skills: [.#review]
        max_calls: 3
        concurrency: 3
        effects: none
        outputs:
          outcomes:
            type: array
            items:
              type: object
              additionalProperties: false
              required: [source_locator, status]
              properties:
                source_locator: {type: string, minLength: 1, maxLength: 1000}
                status: {enum: [fulfilled, rejected]}
                conversation_packet: {type: object, additionalProperties: true}
                rejection:
                  type: object
                  additionalProperties: false
                  required: [reason, code, message]
                  properties:
                    reason: {type: string}
                    code: {type: string}
                    message: {type: string}
