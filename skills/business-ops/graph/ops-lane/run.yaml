skill: ops-lane
version: "0.1.1"

catalog:
  kind: skill
  audience: public
  visibility: internal
  role: graph-stage
  part_of:
    - runx/business-ops

runners:
  default:
    default: true
    inputs:
      lane:
        type: string
        required: true
        description: Lane name to project.
      signal:
        type: string
        required: true
        description: Business signal being routed.
      operator_context:
        type: string
        required: false
        description: Optional product policy, topology, audience constraints, or provider state. Context only, not authority.
    steps:
      - id: default
        tool: { module: ops-lane.mjs }
        inputs:
          lane: $input.lane
          signal: $input.signal
          operator_context: $input.operator_context
        artifacts:
          named_emits:
            lane_packet: lane_packet
          packets:
            lane_packet: runx.business.lane.v1
