name: business-ops-direct-default-routes-one-lane
kind: skill
target: ..
operator_journeys:
  - mode: standalone
    confusors: [ops-desk, agency]
    request: Route this API v2 launch-readiness signal through the right business operations lane.
    expected_outcome: Return one explicit governed lane and preserved signal context without forcing unrelated work.
  - mode: composed
    request: Continue operations from this classified launch-readiness signal.
    expected_outcome: Reuse the supplied signal and constraints without reclassification or mandatory secondary workflows.
    prior_evidence:
      - The launch-readiness signal and operator boundary supplied in the fixture.
    must_not_repeat:
      - Do not reclassify the same signal.
      - Do not execute sends or spend outside their owning lanes.
inputs:
  signal: Launch readiness for API v2 with docs, release, customer comms, and spend checks.
  operator_context: Live sends and spend require their owning governed lanes.
expect:
  status: sealed
  receipt:
    schema: runx.receipt.v1
    state: sealed
    disposition: closed
    reason_code: graph_closed
    child_receipt_count: 1
  steps:
    - route
  output:
    subset:
      lane_packet:
        data:
          schema: runx.business_ops_lane.v1
          lane: classify
          status: ready
          decision: route
          consequence: read_only
          handoff:
            lane_ref: business-ops
metadata:
  public_skill: business-ops
  source_case: direct-default-routes-one-lane
  source: operator-journey
  graph_shape: standalone_route
