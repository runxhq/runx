name: safe-how-to-reply-draft
kind: skill
target: ..
runner: triage
operator_journeys:
  - mode: standalone
    confusors: [issue-triage, send-as]
    request: Triage this domain-verification support request and draft the safest helpful reply.
    expected_outcome: Return a classified request and customer-ready draft only when the supplied policy permits it.
  - mode: composed
    request: Prepare the support reply from this existing customer request and support policy.
    expected_outcome: Reuse the supplied request and policy without re-reading the mailbox or sending the response.
    prior_evidence:
      - The bounded support request and product support policy supplied in the fixture.
    must_not_repeat:
      - Do not fetch the mailbox thread again.
      - Do not send the draft or repeat request classification downstream.
inputs:
  support_request:
    customer_name: Mira
    customer_email: mira@example.test
    subject: How do I verify my sending domain?
    body: I added the DNS records for my domain. What should I check next so emails can send safely?
    source: fixture:safe-how-to
  policy:
    product_name: ExampleDesk
    support_signature: ExampleDesk Support
expect:
  status: sealed
  output:
    subset:
      classification: how_to
      severity: low
      recommended_path: reply_draft
      draft_email:
        proposed: true
        recipient_hint: customer_email_present
        subject: "Re: How do I verify my sending domain?"
      send_gate:
        action: send_customer_email
        status: requires_human_approval
      evidence:
        private_data_required: false
        send_side_effects: none
  receipt:
    schema: runx.receipt.v1
    state: sealed
    disposition: closed
metadata:
  public_skill: helpdesk
  source_case: safe-how-to-reply-draft
  source: skills-fixture
