skill: sbom-maker
version: "0.1.2"

catalog:
  kind: graph
  audience: public
  visibility: public
  role: canonical
  execution: read
  completion: runtime_receipt
  requires_adapter: false
  approval: none

harness:
  cases:
    - name: sbom-maker-package-lock-generates
      operator_journeys:
        - mode: standalone
          confusors: [cve-audit, extract]
          request: Produce a software bill of materials from this lockfile before the release review.
          expected_outcome: Return a CycloneDX inventory digest-bound to the exact lockfile, with license risks surfaced and nothing fetched.
        - mode: composed
          request: Continue from this generated SBOM into the dependency vulnerability audit.
          expected_outcome: Hand the sealed inventory to cve-audit without re-parsing the lockfile.
          prior_evidence:
            - The lockfile and sealed SBOM supplied by the prior step.
          must_not_repeat:
            - Do not re-derive the component inventory already sealed.
      inputs:
        lockfile:
          name: demo-app
          version: "1.2.0"
          lockfileVersion: 3
          packages:
            "":
              name: demo-app
              version: "1.2.0"
            node_modules/left-pad:
              version: 1.3.0
              license: WTFPL
            node_modules/strong-copyleft-lib:
              version: 2.0.0
              license: AGPL-3.0-only
            node_modules/mystery-lib:
              version: 0.9.1
        lockfile_type: package-lock
      expect:
        status: sealed
        steps: [digest-lockfile, make]
        step_outputs:
          make:
            subset:
              sbom_result:
                data:
                  schema: runx.sbom.v1
                  decision: generated
                  lockfile_type: package-lock
                  component_count: 3
                  license_summary:
                    total_components: 3
                    license_counts:
                      AGPL-3.0-only: 1
                      UNKNOWN: 1
                      WTFPL: 1
                  validation: { status: pass, findings: [] }
        receipt: { schema: runx.receipt.v1 }

    - name: sbom-maker-classic-dependencies-generate
      inputs:
        lockfile:
          name: legacy-app
          version: "0.4.0"
          dependencies:
            express:
              version: 4.18.2
              license: MIT
              dependencies:
                accepts:
                  version: 1.3.8
        lockfile_type: npm-shrinkwrap
      expect:
        status: sealed
        steps: [digest-lockfile, make]
        step_outputs:
          make:
            subset:
              sbom_result:
                data:
                  decision: generated
                  component_count: 2
                  validation: { status: pass, findings: [] }
        receipt: { schema: runx.receipt.v1 }

    - name: sbom-maker-unpinned-lockfile-refuses
      inputs:
        lockfile:
          name: empty-app
          version: "1.0.0"
        lockfile_type: package-lock
      expect:
        status: sealed
        steps: [digest-lockfile, make]
        step_outputs:
          make:
            subset:
              sbom_result:
                data:
                  decision: refused
                  sbom: null
                  component_count: 0
                  validation: { status: fail }
        receipt: { schema: runx.receipt.v1 }

    - name: sbom-maker-needs-lockfile
      inputs:
        lockfile_type: package-lock
      expect:
        status: failure

runners:
  make:
    default: true
    inputs:
      lockfile:
        type: json
        required: true
        description: Parsed lockfile object; the caller supplies bytes, composition with web-fetch supplies remote reads.
      lockfile_type:
        type: string
        required: false
        default: package-lock
        description: Declared lockfile family recorded in the SBOM metadata.
        schema: { enum: [package-lock, npm-shrinkwrap] }
    examples:
      - lockfile:
          name: demo-app
          version: "1.0.0"
          packages:
            "":
              name: demo-app
              version: "1.0.0"
            node_modules/left-pad:
              version: 1.3.0
              license: WTFPL
        lockfile_type: package-lock
    result_from: [make]
    steps:
      - id: digest-lockfile
        tool: data.digest
        inputs:
          value: $input.lockfile

      - id: make
        label: derive the CycloneDX inventory deterministically
        inputs:
          lockfile: $input.lockfile
          lockfile_type: $input.lockfile_type
          lockfile_digest: $steps.digest-lockfile.digest_result.digest
        tool: { module: sbom-maker.mjs, export: makeSbom }
        outputs:
          sbom_result:
            type: object
            schema:
              required: [schema, decision, lockfile_type, lockfile_digest, sbom, component_count, license_summary, license_risks, validation]
              additionalProperties: false
              properties:
                schema: { const: runx.sbom.v1 }
                decision: { type: string, enum: [generated, refused] }
                lockfile_type: { type: string, enum: [package-lock, npm-shrinkwrap] }
                lockfile_digest: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
                sbom:
                  type: [object, "null"]
                  required: [bomFormat, specVersion, serialNumber, version, metadata, components]
                  additionalProperties: false
                  properties:
                    bomFormat: { const: CycloneDX }
                    specVersion: { const: "1.5" }
                    serialNumber: { type: string, pattern: "^urn:uuid:[0-9a-f-]{36}$" }
                    version: { const: 1 }
                    metadata: { type: object, additionalProperties: true }
                    components:
                      type: array
                      maxItems: 10000
                      items:
                        type: object
                        required: [type, name, version, license, properties]
                        additionalProperties: false
                        properties:
                          type: { const: library }
                          name: { type: string, minLength: 1, maxLength: 500 }
                          version: { type: string, minLength: 1, maxLength: 200 }
                          license: { type: string, minLength: 1, maxLength: 500 }
                          properties:
                            type: array
                            maxItems: 10
                            items:
                              type: object
                              required: [name, value]
                              additionalProperties: false
                              properties:
                                name: { type: string, minLength: 1, maxLength: 200 }
                                value: { type: string, minLength: 1, maxLength: 2000 }
                component_count: { type: integer, minimum: 0 }
                license_summary:
                  type: [object, "null"]
                  required: [total_components, license_counts]
                  additionalProperties: false
                  properties:
                    total_components: { type: integer, minimum: 1 }
                    license_counts: { type: object, additionalProperties: { type: integer, minimum: 1 } }
                license_risks:
                  type: array
                  maxItems: 10000
                  items:
                    type: object
                    required: [component, version, license, risk, reason, evidence_location]
                    additionalProperties: false
                    properties:
                      component: { type: string, minLength: 1, maxLength: 500 }
                      version: { type: string, minLength: 1, maxLength: 200 }
                      license: { type: string, minLength: 1, maxLength: 500 }
                      risk: { type: string, enum: [high, medium, review] }
                      reason: { type: string, minLength: 1, maxLength: 2000 }
                      evidence_location: { type: string, minLength: 1, maxLength: 2000 }
                validation:
                  type: object
                  required: [status, findings]
                  additionalProperties: false
                  properties:
                    status: { type: string, enum: [pass, fail] }
                    findings:
                      type: array
                      maxItems: 50
                      items:
                        type: object
                        required: [code, message]
                        additionalProperties: false
                        properties:
                          code: { type: string, minLength: 1, maxLength: 200 }
                          message: { type: string, minLength: 1, maxLength: 2000 }
        artifacts:
          named_emits:
            sbom_result: sbom_result
