name: issue-to-pr-standalone-host-flow
kind: skill
target: ..
operator_journeys:
  - mode: standalone
    confusors: [issue-triage, github-sync]
    request: Fix issue 442 in this checkout, run the tests, finalize once, and stop before an unauthorized PR.
    expected_outcome: Resolve the repository, inspect the issue locally, preserve host edit and test results, finalize once, and return a compact blocked-before-publish result.
setup:
  sessions: [github]
env:
  PATH: fixtures/bin:/usr/bin:/bin
  RUNX_CWD: ../..
inputs:
  repository: runxhq/runx
  issue_number: "442"
  objective: Make the issue-to-PR lane operator-first.
caller:
  http_responses:
    "https://api.github.com/user":
      status: 200
      headers: { content-type: application/json }
      body: '{"id": 7, "login": "operator"}'
    "https://api.github.com/repos/runxhq/runx/issues/442":
      status: 200
      headers: { content-type: application/json }
      body: '{"number": 442, "title": "Make issue-to-PR operator-first", "state": "open", "body": "Use normal host editing and test tools, then govern only publication.", "html_url": "https://github.com/runxhq/runx/issues/442", "labels": [{"name": "operator-experience"}], "assignees": []}'
  answers:
    agent_task.issue-to-pr-host-work.output:
      host_result:
        schema: runx.issue_to_pr.host_result.v1
        status: completed
        repository: runxhq/runx
        issue_number: "442"
        repo_root: .
        branch: fix/442-operator-first
        commit: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        files: [oss/skills/issue-to-pr/X.yaml]
        tests:
          - command: cargo test -p runx-cli --test integration issue_to_pr_journey
            status: passed
            evidence: receipt:test:issue-to-pr-standalone
        finalization:
          receipt_path: skills/issue-to-pr/fixtures/scafld-pass.json
          contract_digest: sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
        publication:
          decision: hold
          title: ""
          body: ""
          head: ""
          base: ""
          draft: false
          idempotency_key: ""
        errors: []
expect:
  status: sealed
  receipt: { schema: runx.receipt.v1 }
  output:
    subset:
      issue_to_pr_result:
        data:
          schema: runx.issue_to_pr.result.v1
          status: completed
          outcome: finalized_local
          repository: runxhq/runx
          issue_number: "442"
          tested: true
          commit: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          finalization:
            status: verified
            target: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          publication: { status: not_requested }
metadata:
  public_skill: issue-to-pr
  source_case: standalone-host-flow
  source: operator-journey
