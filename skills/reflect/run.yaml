# runx/reflect (reflection.md). Built a method at a time, each green on the
# bar before the next: survey first. Fixed order in YAML, fan-out in a script
# step, judgement in agent methods; survey uses no model, so with the same
# record it repeats exactly. Its mark is a position in its own `marks`
# stream, one key per reader, which only `keep` moves.
version: "0.1.0"
minimum_runx: 0.12.0
catalog:
  visibility: internal
  category: ops
  tags: [reflection, memory, verdict]
default_method: reflect
methods:
  reflect:
    description: Read the record since this reader's mark, judge it against the checks survey lays out first, and decide the window by the one rule. Diagnosis and the purpose-only question are each a fresh turn; everything else is code.
    inputs:
      reader: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._@-]*$", maxLength: 128, description: "Who reflects, such as a schedule. Marks are per reader." }
      until: { type: string, format: date-time, description: The window's end. }
    result_from: [judge, propose, promote, observe, decide, decision, keep]
    steps:
      - id: survey
        skill: .#survey
        inputs: { reader: $input.reader, until: $input.until }
      - id: judge
        # One diagnosis per resistance and one purpose-only question per
        # sampled success, each its own child run in a fresh context. A
        # finding is kept only when what it cites is in the run's record.
        script: { module: reflect.mjs, export: judge }
        inputs: { survey: $steps.survey }
        calls:
          skills: [.#diagnose, .#challenge]
          tools: [run.read]
        max_calls: 200
        effects: none
        outputs:
          findings: { type: array, items: { type: object }, description: "Each check's finding with its evidence, or why it was dropped." }
      - id: propose
        # A fix with its case for each kept diagnosis, through
        # skill-lab#draft, proven to fail on the old revision and pass on
        # the fix before the person is asked for the exact files.
        script: { module: reflect.mjs, export: propose }
        inputs: { survey: $steps.survey, findings: $steps.judge.findings }
        calls:
          skills: [runx/skill-lab#draft]
          tools: [data.digest, fs.list, fs.read_bundle, runx.skill.validate, runx.skill.apply]
          operations: [store/key.inspect, store/events.append]
        max_calls: 200
        effects: ask
        outputs:
          proposals: { type: array, items: { type: object }, description: "Each fix with its case and the cases it changes or removes, its proof that the new case fails on the old revision and passes on the fix, and whether it was applied, declined with the person's reason, or dropped and why." }
      - id: promote
        # Each standing rule the repository doesn't hold, its exact words into
        # AGENTS.md under its Rules heading with its date and handle, the
        # person approving the exact file. Reflection never commits.
        script: { module: reflect.mjs, export: promote }
        inputs: { survey: $steps.survey }
        calls:
          tools: [fs.read, fs.write]
        max_calls: 4
        effects: ask
        outputs:
          promotion: { type: object, description: "promoted, each rule written into AGENTS.md word for word with its date and handle; or refused, why none was, when the file would pass the bound a turn reads whole; or declined, the person's reason." }
      - id: observe
        # An observation for each kept diagnosis, with its sources, on the
        # workspace's observed stream.
        script: { module: reflect.mjs, export: observe }
        inputs: { survey: $steps.survey, findings: $steps.judge.findings }
        calls:
          skills: [runx/memory#observe]
        max_calls: 64
        outputs:
          observed: { type: array, items: { type: object }, description: "Each diagnosis's observation by its handle." }
      - id: decide
        tool: { module: reflect.mjs, export: assessments }
        inputs: { survey: $steps.survey, findings: $steps.judge.findings, proposals: $steps.propose.proposals, promoted: $steps.promote.promotion.promoted, observed: $steps.observe.observed }
        outputs:
          verdict: { packet: runx.verdict.v1, description: "One assessment per check survey laid out, its subject survey's window. The runtime sets its evaluator." }
      - id: decision
        tool: verdict.decide
        inputs: { verdict: $steps.decide.verdict, subject: $steps.survey.subject, criteria_ref: runx/reflect, criteria: $steps.survey.criteria }
      - id: keep
        # Each rule the repository holds closed through memory's disable,
        # whose own gate asks the person, and the mark, moved past the window
        # the verdict covers.
        script: { module: reflect.mjs, export: keep }
        inputs: { reader: $input.reader, survey: $steps.survey }
        calls:
          skills: [runx/memory#disable]
          tools: [data.digest]
          operations: [store/key.inspect, store/events.append]
        max_calls: 200
        outputs:
          kept: { type: object, description: "closed, each rule AGENTS.md holds, closed at memory's gate with its reason naming the commit that holds it, or declined with the person's reason; and the mark." }
  survey:
    description: Read the mark, the record since it, the workspace's standing memory and its revision, and lay out the checks before anything is judged. No model.
    inputs:
      reader: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._@-]*$", maxLength: 128, description: "Who reflects, such as a schedule. Marks are per reader." }
      until: { type: string, format: date-time, description: The window's end. }
    steps:
      - id: survey
        script: { module: reflect.mjs, export: survey }
        inputs: { reader: $input.reader, until: $input.until }
        calls:
          operations: [store/key.inspect]
          tools: [run.list, run.read, verdict.criteria, data.digest, git.log, git.show]
          skills: [runx/memory#index]
        max_calls: 400
        effects: none
        outputs:
          criteria: { type: object, packet: runx.criteria.v1, description: "One check per item, and survey's own, that every run was read to its end. The same record gives the same set, by digest." }
          subject: { type: object, description: "The window judged, { ref, revision }: its revision the digest of the window's runs and the workspace's HEAD." }
          head: { type: string, description: The workspace's HEAD commit the checks are bound to. }
          resistance: { type: array, items: { type: object }, description: "Every refused, declined and failed call, failed step, declined ask with its reason, unmet verdict, and run that sealed other than completed, each with its evidence." }
          sampled: { type: array, items: { type: object }, description: "The latest success of each skill whose manual the repository holds at HEAD, with its purpose, the manual's description, for the purpose-only reader." }
          unheld: { type: array, items: { type: object }, description: "Each standing said:workspace entry whose handle AGENTS.md doesn't hold at HEAD." }
          held: { type: array, items: { type: object }, description: "Each standing said:workspace entry whose handle AGENTS.md holds at HEAD, which keep closes." }
          mark: { type: object, description: "Where the mark moves once a verdict covers the window, and the runs still open there." }
          read_to_end: { type: boolean, description: "Every run in the window was read to its last event. False when the calls ran out first." }
  diagnose:
    description: Say why one recorded resistance happened, from its evidence alone. Read the run's record with run.read, and cite each sealed receipt or event address the diagnosis rests on, exactly as the record gives it; a diagnosis citing anything else is dropped.
    inputs:
      resistance: { type: object, description: "One item survey found: its kind, run, step, reason and evidence." }
    steps:
      - id: diagnose
        agent: diagnose
        requires: [fresh_context]
        calls:
          tools: [run.read]
        inputs: $input
        outputs:
          finding:
            type: object
            required: [summary, cause, evidence]
            properties:
              summary: { type: string, description: "What went wrong, in one sentence." }
              cause: { type: string, description: "Why, from the evidence." }
              evidence: { type: array, items: { type: string }, description: "The receipts and event addresses it rests on." }
  challenge:
    description: Given only a skill's purpose and one of its successful runs, say whether the run did what the purpose asks. Judge from the purpose and the run alone; cite the receipts or event addresses that show it.
    inputs:
      purpose: { type: string, description: The skill's purpose, its manual's description. }
      run: { type: object, description: "The run as its record holds it: its skill, method and events." }
    steps:
      - id: challenge
        agent: challenge
        requires: [fresh_context]
        inputs: $input
        outputs:
          finding:
            type: object
            required: [met, summary, evidence]
            properties:
              met: { type: boolean, description: Whether the run did what the purpose asks. }
              summary: { type: string, description: "What it did, against what the purpose asks." }
              evidence: { type: array, items: { type: string }, description: "The receipts and event addresses that show it." }
