version: "0.9.23"
minimum_runx: 0.12.0
default_method: build
catalog:
  visibility: public
  category: authoring
methods:
  design:
    description: Write a candidate skill package and check it as the package it makes, writing nothing to the workspace.
    inputs:
      objective:
        type: string
        description: Capability to design or place in the current catalog.
      package_name:
        type: string
        description: The name a new package takes, its SKILL.md name.
        optional: true
      target_dir:
        type: string
        description: Repo-relative package directory the design creates or changes; nothing is written there.
      project_context:
        type: string
        description: Product, repository, and operator constraints.
        optional: true
    examples:
      - objective: Decide whether the existing research skill should support bounded local files.
        target_dir: skills/research
        project_context: Preserve remote evidence support and reuse native file admission.
    result_from: [author, check]
    steps:
      - id: inspect
        tool: runx.skill.inspect
        inputs:
          target_dir: $input.target_dir
        # The record bind binds the change to, and the brief its author reads.
        outputs:
          authoring_context: {packet: runx.skill_lab.authoring_context.v1}
          authoring_brief: {type: object}
      - id: author
        agent: skill-lab-author
        calls:
          tools: [fs.read_bundle, git.status, artifact.open, artifact.read]
        outputs:
          change_draft: {type: object, packet: runx.skill.change_draft.v1}
        inputs:
          objective: $input.objective
          package_name: $input.package_name
          project_context: $input.project_context
          authoring_mode: design
          authoring_brief: $steps.inspect.authoring_brief
          target_dir: $input.target_dir
      - id: bind
        tool: runx.skill.bind
        inputs:
          authoring_context: $steps.inspect.authoring_context
          mode: design
          change_draft: $steps.author.change_draft
      - id: check
        tool: runx.skill.apply
        inputs:
          target_dir: $input.target_dir
          mode: design
          change_bundle: $steps.bind.change_bundle
        outputs:
          apply_result: {type: object, packet: runx.skill.apply_result.v1}
  build:
    description: Create a skill package where none stands, writing it only once its exact staged package passes parsing, inspection and safe replay of its tests.
    inputs:
      objective:
        type: string
        description: Skill capability to create.
      package_name:
        type: string
        description: The name the new package takes, its SKILL.md name.
        optional: true
      target_dir:
        type: string
        description: Repo-relative package directory to create, where no package stands.
      project_context:
        type: string
        description: Product, repository, and operator constraints.
        optional: true
    examples:
      - objective: Create a skill that drafts a customer update from the week's merged work.
        target_dir: skills/customer-update
        project_context: Reuse the native git and file reads; the person approves the draft before anything is sent.
    result_from: [author, apply]
    steps:
      - id: inspect
        tool: runx.skill.inspect
        inputs:
          target_dir: $input.target_dir
        # The record bind binds the change to, and the brief its author reads.
        outputs:
          authoring_context: {packet: runx.skill_lab.authoring_context.v1}
          authoring_brief: {type: object}
      - id: author
        agent: skill-lab-author
        calls:
          tools: [fs.read_bundle, git.status, artifact.open, artifact.read]
        outputs:
          change_draft: {type: object, packet: runx.skill.change_draft.v1}
        inputs:
          objective: $input.objective
          package_name: $input.package_name
          project_context: $input.project_context
          authoring_mode: build
          authoring_brief: $steps.inspect.authoring_brief
          target_dir: $input.target_dir
      - id: bind
        tool: runx.skill.bind
        inputs:
          authoring_context: $steps.inspect.authoring_context
          mode: build
          change_draft: $steps.author.change_draft
      - id: apply
        tool: runx.skill.apply
        inputs:
          target_dir: $input.target_dir
          mode: build
          change_bundle: $steps.bind.change_bundle
        outputs:
          apply_result: {type: object, packet: runx.skill.apply_result.v1}

  save:
    description: Keep a turn's script call that worked as a skill package of its own, its script the package's module byte for byte, under the contracts, test, manual and evals its author writes, written once its exact staged package passes and the person approves its files.
    inputs:
      run_id:
        type: string
        description: The run the script call was made in.
      call:
        type: string
        description: The script call's address in that run, <step>/<index>, as run.read's events name it.
      package_name:
        type: string
        description: The name the new package takes, its SKILL.md name.
        optional: true
      target_dir:
        type: string
        description: Repo-relative package directory to create, where no package stands.
      project_context:
        type: string
        description: Product, repository, and operator constraints.
        optional: true
    examples:
      - run_id: run-weekly-digest
        call: answer/3
        package_name: weekly-digest
        target_dir: skills/weekly-digest
    result_from: [author, apply]
    steps:
      - id: inspect
        tool: runx.skill.inspect
        inputs:
          target_dir: $input.target_dir
        # The record bind binds the change to, and the brief its author reads.
        outputs:
          authoring_context: {packet: runx.skill_lab.authoring_context.v1}
          authoring_brief: {type: object}
      - id: read
        tool: call.read
        inputs:
          run_id: $input.run_id
          call: $input.call
      - id: author
        agent: skill-lab-author
        calls:
          tools: [fs.read_bundle, git.status, artifact.open, artifact.read, call.read]
        outputs:
          change_draft: {type: object, packet: runx.skill.change_draft.v1}
        inputs:
          script_call: $steps.read.call
          package_name: $input.package_name
          project_context: $input.project_context
          authoring_mode: save
          authoring_brief: $steps.inspect.authoring_brief
          target_dir: $input.target_dir
      - id: bind
        tool: runx.skill.bind
        inputs:
          authoring_context: $steps.inspect.authoring_context
          mode: build
          change_draft: $steps.author.change_draft
          script_call: $steps.read.call
      - id: apply
        tool: runx.skill.apply
        effects: ask
        inputs:
          target_dir: $input.target_dir
          mode: build
          change_bundle: $steps.bind.change_bundle
        outputs:
          apply_result: {type: object, packet: runx.skill.apply_result.v1}

  improve:
    description: Turn one receipt or test failure into a bounded update of a package, validated before it is written.
    inputs:
      objective:
        type: string
        description: Bounded improvement objective.
      target_dir:
        type: string
        description: Repo-relative package directory to improve.
      project_context:
        type: string
        description: Product, repository, and operator constraints.
        optional: true
      receipt_id:
        type: string
        description: Receipt reference for the failed or suspicious run.
        optional: true
      receipt_summary:
        type: string
        description: Sanitized receipt or failure summary.
        optional: true
      test_output:
        type: string
        description: Sanitized test output or assertion failure.
        optional: true
      failure_packet:
        description: Stable runx/diagnose-skill-run.diagnosis.v1 failure packet from diagnose-skill-run.
        optional: true
    examples:
      - objective: Make every public method callable from inspection without source-diving.
        target_dir: skills/github
        project_context: Preserve the existing contract version and provider boundary.
        test_output: The agent could not construct the nested resources selector from inspection.
    result_from:
      - draft
      - apply
    steps:
      - id: draft
        skill: .#draft
        inputs:
          objective: $input.objective
          target_dir: $input.target_dir
          project_context: $input.project_context
          receipt_id: $input.receipt_id
          receipt_summary: $input.receipt_summary
          test_output: $input.test_output
          failure_packet: $input.failure_packet
      - id: apply
        tool: runx.skill.apply
        inputs:
          target_dir: $input.target_dir
          mode: improve
          change_bundle: $steps.draft.change_bundle
        outputs:
          apply_result: {type: object, packet: runx.skill.apply_result.v1}

  draft:
    description: Turn one receipt or test failure into a bounded change to a package, bound to the package it was authored against, and stop before anything is written. A caller such as reflection proves the change first and applies it itself.
    inputs:
      objective:
        type: string
        description: Bounded improvement objective.
      target_dir:
        type: string
        description: Repo-relative package directory to improve.
      project_context:
        type: string
        description: Product, repository, and operator constraints.
        optional: true
      receipt_id:
        type: string
        description: Receipt reference for the failed or suspicious run.
        optional: true
      receipt_summary:
        type: string
        description: Sanitized receipt or failure summary.
        optional: true
      test_output:
        type: string
        description: Sanitized test output or assertion failure.
        optional: true
      failure_packet:
        description: Stable runx/diagnose-skill-run.diagnosis.v1 failure packet from diagnose-skill-run.
        optional: true
    examples:
      - objective: Make every public method callable from inspection without source-diving.
        target_dir: skills/github
        project_context: Preserve the existing contract version and provider boundary.
        test_output: The agent could not construct the nested resources selector from inspection.
    result_from: [author, bind]
    steps:
      - id: inspect
        tool: runx.skill.inspect
        inputs:
          target_dir: $input.target_dir
        # The record bind binds the change to, and the brief its author reads.
        outputs:
          authoring_context: {packet: runx.skill_lab.authoring_context.v1}
          authoring_brief: {type: object}
      - id: author
        agent: skill-lab-author
        calls:
          # It proves its case as it drafts: the case alone fails on the
          # package, and passes with the fix.
          tools: [fs.read_bundle, git.status, artifact.open, artifact.read, runx.skill.validate]
        # Its caller proves a draft by the case it adds, so one that writes
        # adds a case.
        outputs:
          change_draft:
            type: object
            packet: runx.skill.change_draft.v1
            if: {properties: {decision: {const: write}}, required: [decision]}
            then:
              properties:
                writes:
                  description: "A draft that writes adds the case its caller proves it by: a tests/<name>.yaml that fails on the package as it stands and passes on the change."
                  contains:
                    type: object
                    properties: {path: {type: string, pattern: "/tests/[^/]+\\.ya?ml$"}}
                    required: [path]
        inputs:
          objective: $input.objective
          project_context: $input.project_context
          receipt_id: $input.receipt_id
          receipt_summary: $input.receipt_summary
          test_output: $input.test_output
          failure_packet: $input.failure_packet
          authoring_mode: improve
          authoring_brief: $steps.inspect.authoring_brief
          target_dir: $input.target_dir
      - id: bind
        tool: runx.skill.bind
        inputs:
          authoring_context: $steps.inspect.authoring_context
          mode: improve
          change_draft: $steps.author.change_draft

  test:
    description: Add tests and the fixtures they read to a package that stands, and replay them against the candidate before writing.
    inputs:
      objective:
        type: string
        description: Behavior or regression boundary the fixtures must prove.
      target_dir:
        type: string
        description: Repo-relative package directory receiving fixtures.
      project_context:
        type: string
        description: Product, repository, and operator constraints.
        optional: true
      test_output:
        type: string
        description: Existing test evidence to reproduce or strengthen.
        optional: true
    examples:
      - objective: Prove that local evidence preserves exact UTF-8 content and rejects missing files.
        target_dir: skills/research
        project_context: Exercise the real native file and evidence capabilities.
    result_from: [author, apply]
    steps:
      - id: inspect
        tool: runx.skill.inspect
        inputs:
          target_dir: $input.target_dir
        # The record bind binds the change to, and the brief its author reads.
        outputs:
          authoring_context: {packet: runx.skill_lab.authoring_context.v1}
          authoring_brief: {type: object}
      - id: author
        agent: skill-lab-author
        calls:
          tools: [fs.read_bundle, git.status, artifact.open, artifact.read, runx.skill.validate]
        outputs:
          change_draft: {type: object, packet: runx.skill.change_draft.v1}
        inputs:
          objective: $input.objective
          project_context: $input.project_context
          test_output: $input.test_output
          authoring_mode: test
          authoring_brief: $steps.inspect.authoring_brief
          target_dir: $input.target_dir
      - id: bind
        tool: runx.skill.bind
        inputs:
          authoring_context: $steps.inspect.authoring_context
          mode: test
          change_draft: $steps.author.change_draft
      - id: apply
        tool: runx.skill.apply
        inputs:
          target_dir: $input.target_dir
          mode: test
          change_bundle: $steps.bind.change_bundle
        outputs:
          apply_result: {type: object, packet: runx.skill.apply_result.v1}
