version: "0.1.10"
minimum_runx: 0.12.0
catalog:
  visibility: public
  category: growth
methods:
  reconcile:
    inputs:
      transcript:
        type: string
        description: Call transcript that is the only evidence for proposed updates.
        minLength: 1
        maxLength: 1000000
        pattern: \S
      crm_records:
        type: array
        description: Current selected CRM record snapshots; id is stable and other properties are provider/domain field values. Retain the source and fetch time upstream.
        maxItems: 1000
        items:
          type: object
          required:
            - id
          additionalProperties: true
          properties:
            id:
              type: string
              minLength: 1
              maxLength: 500
              pattern: \S
      crm_schema:
        type: object
        description: Proposal field allowlist; this is not CRM write authority.
        additionalProperties: false
        properties:
          allowed_fields:
            type: array
            minItems: 1
            maxItems: 100
            items:
              type: string
              minLength: 1
              maxLength: 200
              pattern: \S
            uniqueItems: true
        required:
          - allowed_fields
    examples:
      - transcript: Dana said the rollout stalled.
        crm_records:
          - id: acct-globex
            account_status: healthy
        crm_schema:
          allowed_fields:
            - account_status
    result_from:
      - finalize
    steps:
      - id: digest-transcript
        tool: data.digest
        inputs:
          value: $input.transcript
          encoding: utf8_text
      - id: digest-records
        tool: data.digest
        inputs:
          value: $input.crm_records
      - id: reconcile
        agent: crm-update-plan-reconcile
        outputs:
          update_draft:
            type: object
            required:
              - updates
            additionalProperties: false
            properties:
              updates:
                type: array
                maxItems: 200
                items:
                  type: object
                  required:
                    - record_id
                    - field
                    - to
                    - evidence_quote
                  additionalProperties: false
                  properties:
                    record_id:
                      type: string
                      minLength: 1
                      maxLength: 500
                      pattern: \S
                    field:
                      type: string
                      minLength: 1
                      maxLength: 200
                      pattern: \S
                    to:
                      description: Exact intended provider/domain field value; null or an empty string may deliberately clear a field when supported by the transcript.
                    evidence_quote:
                      type: string
                      minLength: 1
                      maxLength: 4000
                      pattern: \S
        inputs:
          transcript: $input.transcript
          crm_records: $input.crm_records
          crm_schema: $input.crm_schema
      - id: finalize
        inputs:
          transcript: $input.transcript
          crm_records: $input.crm_records
          crm_schema: $input.crm_schema
          update_draft: $steps.reconcile.update_draft
          transcript_digest: $steps.digest-transcript.digest_result.digest
          records_digest: $steps.digest-records.digest_result.digest
        tool:
          module: crm-update-plan.mjs
          export: finalizeUpdates
        outputs:
          crm_update_proposal:
            type: object
            packet: runx/crm-update-plan.proposal.v1
    description: Propose exact supported CRM field changes from a transcript and supplied current records, including deliberate clearing, without writing.
