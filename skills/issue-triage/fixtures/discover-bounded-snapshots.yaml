name: issue-triage-discovers-from-bounded-snapshots
kind: skill
target: ..
runner: discover
inputs:
  query: Find unanswered issues where a maintainer response would unblock progress.
  issue_snapshots:
    - repository: runxhq/runx
      number: "241"
      title: Sourcey output path is unclear
      state: open
      body: The docs name two different output directories.
    - repository: runxhq/runx
      number: "242"
      title: Typo in example
      state: open
      body: One example contains a spelling mistake.
caller:
  answers:
    agent.issue-triage-discover.output:
      issue_candidates:
        - id: runxhq/runx#241
          reason: A factual clarification can unblock the reporter.
      selection_rationale:
        chosen_issue: runxhq/runx#241
        rationale: Higher unblock value than the cosmetic typo.
expect:
  status: sealed
  steps: [digest-snapshots, index, select, finalize]
  receipt: { schema: runx.receipt.v1 }
metadata: { public_skill: issue-triage, source_case: bounded-discovery, source: skills-fixture }
