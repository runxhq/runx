name: carries-privacy-thresholding-as-caveat
method: normalize-report
inputs:
  request:
    property: properties/123456
    report_type: standard
    date_ranges:
      - start_date: 2026-07-01
        end_date: 2026-07-19
    dimensions:
      - city
    metrics:
      - activeUsers
  provider_result:
    property: properties/123456
    dimension_headers:
      - name: city
    metric_headers:
      - name: activeUsers
        type: TYPE_INTEGER
    rows:
      - dimension_values:
          - Sydney
        metric_values:
          - "18"
    row_count: 1
    pagination:
      complete: true
      returned_rows: 1
    metadata:
      subject_to_thresholding: true
      data_loss_from_other_row: false
      time_zone: Australia/Sydney
expect:
  status: sealed
  steps:
    - normalize
    - compare-query
    - bind-query
    - digest
    - finalize
  step_outputs:
    finalize:
      subset:
        report_evidence:
          data:
            decision: usable_with_caveats
            privacy:
              subject_to_thresholding: true
            validation:
              status: pass
  receipt:
    schema: runx.receipt.v1
