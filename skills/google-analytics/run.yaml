version: "0.1.14"
minimum_runx: 0.12.0
default_method: report
catalog:
  visibility: public
  category: data
shared_inputs:
  property:
    type: string
    description: Exact GA4 property resource, such as properties/123456.
    pattern: ^properties/[1-9][0-9]*$
  date_ranges:
    type: array
    description: One to four inclusive GA4 date ranges using YYYY-MM-DD or GA relative dates.
    minItems: 1
    maxItems: 4
    items:
      type: object
      required:
        - start_date
        - end_date
      additionalProperties: false
      properties:
        start_date:
          type: string
          pattern: ^(?:[0-9]{4}-[0-9]{2}-[0-9]{2}|today|yesterday|[0-9]+daysAgo)$
        end_date:
          type: string
          pattern: ^(?:[0-9]{4}-[0-9]{2}-[0-9]{2}|today|yesterday|[0-9]+daysAgo)$
        name:
          type: string
          maxLength: 64
  dimensions:
    type: array
    description: Zero to nine ordered GA4 dimension names; an empty list supports metric-only reports.
    maxItems: 9
    items:
      type: string
      minLength: 1
      maxLength: 256
  metrics:
    type: array
    description: One to ten ordered GA4 metric names.
    minItems: 1
    maxItems: 10
    items:
      type: string
      minLength: 1
      maxLength: 256
  filter:
    type: object
    description: GA4 FilterExpression passed intact to the configured provider connector.
    additionalProperties: true
    optional: true
  order_bys:
    type: array
    description: Ordered GA4 OrderBy records passed intact to the provider connector.
    maxItems: 10
    items:
      type: object
      additionalProperties: true
    optional: true
  minute_ranges:
    type: array
    description: One or more bounded GA4 realtime minute ranges.
    maxItems: 4
    items:
      type: object
      required:
        - start_minutes_ago
        - end_minutes_ago
      additionalProperties: false
      properties:
        start_minutes_ago:
          type: integer
          minimum: 0
          maximum: 59
        end_minutes_ago:
          type: integer
          minimum: 0
          maximum: 59
        name:
          type: string
          maxLength: 64
    optional: true
  report_request:
    type: object
    description: Expected GA4 report identity and ordered headers for supplied-result normalization.
    required:
      - property
      - report_type
      - dimensions
      - metrics
    additionalProperties: false
    properties:
      property:
        type: string
        pattern: ^properties/[1-9][0-9]*$
      report_type:
        type: string
        enum:
          - standard
          - realtime
      date_ranges:
        type: array
        maxItems: 4
        items:
          type: object
          additionalProperties: true
      dimensions:
        type: array
        maxItems: 9
        items:
          type: string
          minLength: 1
          maxLength: 256
      metrics:
        type: array
        minItems: 1
        maxItems: 10
        items:
          type: string
          minLength: 1
          maxLength: 256
      dimension_filter:
        type: object
        additionalProperties: true
      metric_filter:
        type: object
        additionalProperties: true
      order_bys:
        type: array
        maxItems: 10
        items:
          type: object
          additionalProperties: true
      minute_ranges:
        type: array
        maxItems: 4
        items:
          type: object
          additionalProperties: true
      currency_code:
        type: string
        pattern: ^[A-Z]{3}$
      limit:
        type: integer
        minimum: 1
        maximum: 100000
      offset:
        type: integer
        minimum: 0
  provider_result:
    type: object
    description: GA4 report readback with ordered headers and bounded rows; provider metadata is preserved.
    required:
      - dimension_headers
      - metric_headers
      - rows
    properties:
      property:
        type: string
        pattern: ^properties/[1-9][0-9]*$
      dimension_headers:
        type: array
        maxItems: 9
        items:
          type:
            - string
            - object
          additionalProperties: true
      metric_headers:
        type: array
        maxItems: 10
        items:
          type:
            - string
            - object
          additionalProperties: true
      rows:
        type: array
        maxItems: 100000
        items:
          type: object
          additionalProperties: true
      row_count:
        type: integer
        minimum: 0
      pagination:
        type: object
        additionalProperties: true
      metadata:
        type: object
        additionalProperties: true
      property_quota:
        type: object
        additionalProperties: true
      fetched_at:
        type: string
        format: date-time
methods:
  report:
    description: Run one date-bounded GA4 report on a property, with its measurement caveats. Check unfamiliar fields with metadata first.
    inputs:
      property: {}
      date_ranges: {}
      dimensions: {}
      metrics: {}
      dimension_filter:
        type: object
        description: GA4 FilterExpression passed intact to the configured provider connector.
        additionalProperties: true
        optional: true
      metric_filter:
        type: object
        description: GA4 FilterExpression passed intact to the configured provider connector.
        additionalProperties: true
        optional: true
      order_bys: {}
      currency_code:
        type: string
        description: ISO currency override when needed.
        optional: true
      limit:
        type: integer
        default: 1000
        description: Bounded row limit, at most 100000.
        minimum: 1
        maximum: 100000
        optional: true
      offset:
        type: integer
        default: 0
        description: Zero-based row offset.
        minimum: 0
        optional: true
    examples:
      - property: properties/123456
        date_ranges:
          - start_date: 30daysAgo
            end_date: yesterday
        dimensions:
          - landingPagePlusQueryString
        metrics:
          - sessions
          - keyEvents
    result_from:
      - finalize
    steps:
      - id: read
        operation: google/analytics/reports.run
        result:
          required:
            - property
            - request
            - dimension_headers
            - metric_headers
            - rows
            - row_count
            - pagination
            - metadata
            - property_quota
            - fetched_at
        inputs:
          property: $input.property
          date_ranges: $input.date_ranges
          dimensions: $input.dimensions
          metrics: $input.metrics
          dimension_filter: $input.dimension_filter
          metric_filter: $input.metric_filter
          order_bys: $input.order_bys
          currency_code: $input.currency_code
          limit: $input.limit
          offset: $input.offset
      - id: normalize
        inputs:
          source_status: provider_readback
          request:
            property: $input.property
            report_type: standard
            date_ranges: $input.date_ranges
            dimensions: $input.dimensions
            metrics: $input.metrics
            dimension_filter: $input.dimension_filter
            metric_filter: $input.metric_filter
            order_bys: $input.order_bys
            currency_code: $input.currency_code
            limit: $input.limit
            offset: $input.offset
          provider_result: $steps.read.provider_operation.result
        tool:
          module: google-analytics.mjs
          export: normalizeReport
        outputs:
          report_draft: {type: object}
          expected_query: {type: object}
          source_query: {type: object}
      - id: compare-query
        tool: data.compare
        inputs:
          expected: $steps.normalize.expected_query
          actual: $steps.normalize.source_query
      - id: bind-query
        tool:
          module: google-analytics.mjs
          export: bindQuery
        inputs:
          report_draft: $steps.normalize.report_draft
          comparison: $steps.compare-query.comparison
        outputs:
          report_draft: {type: object}
      - id: digest
        tool: data.digest
        inputs:
          value: $steps.bind-query.report_draft
      - id: finalize
        inputs:
          report_draft: $steps.bind-query.report_draft
          digest_result: $steps.digest.digest_result
        tool:
          module: google-analytics.mjs
          export: finalizeReport
        outputs:
          report_evidence: {type: object}
  normalize-report:
    description: Check and normalize a GA4-shaped result a trusted import already supplied, without calling Google, so never proof that runx reached Google.
    inputs:
      provider_result: {}
      request:
        type: object
        description: Expected GA4 report identity and ordered headers for supplied-result normalization.
        required:
          - property
          - report_type
          - dimensions
          - metrics
        additionalProperties: false
        properties:
          property:
            type: string
            pattern: ^properties/[1-9][0-9]*$
          report_type:
            type: string
            enum:
              - standard
              - realtime
          date_ranges:
            type: array
            maxItems: 4
            items:
              type: object
              additionalProperties: true
          dimensions:
            type: array
            maxItems: 9
            items:
              type: string
              minLength: 1
              maxLength: 256
          metrics:
            type: array
            minItems: 1
            maxItems: 10
            items:
              type: string
              minLength: 1
              maxLength: 256
          dimension_filter:
            type: object
            additionalProperties: true
          metric_filter:
            type: object
            additionalProperties: true
          order_bys:
            type: array
            maxItems: 10
            items:
              type: object
              additionalProperties: true
          minute_ranges:
            type: array
            maxItems: 4
            items:
              type: object
              additionalProperties: true
          currency_code:
            type: string
            pattern: ^[A-Z]{3}$
          limit:
            type: integer
            minimum: 1
            maximum: 100000
          offset:
            type: integer
            minimum: 0
    examples:
      - request:
          property: properties/123456
          report_type: standard
          date_ranges:
            - start_date: 2026-06-01
              end_date: 2026-06-30
          dimensions:
            - landingPagePlusQueryString
          metrics:
            - sessions
        provider_result:
          property: properties/123456
          dimension_headers:
            - name: landingPagePlusQueryString
          metric_headers:
            - name: sessions
              type: TYPE_INTEGER
          rows:
            - dimension_values:
                - /guides/runx
              metric_values:
                - "120"
          row_count: 1
    result_from:
      - finalize
    steps:
      - id: normalize
        inputs:
          provider_result: $input.provider_result
          request: $input.request
          source_status: supplied_result
        tool:
          module: google-analytics.mjs
          export: normalizeReport
        outputs:
          report_draft: {type: object}
          expected_query: {type: object}
          source_query: {type: object}
      - id: compare-query
        tool: data.compare
        inputs:
          expected: $steps.normalize.expected_query
          actual: $steps.normalize.source_query
      - id: bind-query
        tool:
          module: google-analytics.mjs
          export: bindQuery
        inputs:
          report_draft: $steps.normalize.report_draft
          comparison: $steps.compare-query.comparison
        outputs:
          report_draft: {type: object}
      - id: digest
        tool: data.digest
        inputs:
          value: $steps.bind-query.report_draft
      - id: finalize
        inputs:
          report_draft: $steps.bind-query.report_draft
          digest_result: $steps.digest.digest_result
        tool:
          module: google-analytics.mjs
          export: finalizeReport
        outputs:
          report_evidence: {type: object}
  realtime:
    description: Read a short GA4 realtime window, a current pulse after a deployment or campaign, provisional rather than settled reporting.
    inputs:
      property: {}
      dimensions: {}
      metrics: {}
      dimension_filter:
        type: object
        description: GA4 FilterExpression passed intact to the configured provider connector.
        additionalProperties: true
        optional: true
      metric_filter:
        type: object
        description: GA4 FilterExpression passed intact to the configured provider connector.
        additionalProperties: true
        optional: true
      minute_ranges: {}
      limit:
        type: integer
        default: 1000
        description: Bounded realtime row limit.
        minimum: 1
        maximum: 100000
        optional: true
    examples:
      - property: properties/123456
        dimensions:
          - unifiedScreenName
        metrics:
          - activeUsers
    result_from:
      - finalize
    steps:
      - id: read
        operation: google/analytics/reports.run_realtime
        result:
          required:
            - property
            - request
            - dimension_headers
            - metric_headers
            - rows
            - row_count
            - pagination
            - metadata
            - property_quota
            - fetched_at
        inputs:
          property: $input.property
          dimensions: $input.dimensions
          metrics: $input.metrics
          dimension_filter: $input.dimension_filter
          metric_filter: $input.metric_filter
          minute_ranges: $input.minute_ranges
          limit: $input.limit
      - id: normalize
        inputs:
          source_status: provider_readback
          request:
            property: $input.property
            report_type: realtime
            dimensions: $input.dimensions
            metrics: $input.metrics
            dimension_filter: $input.dimension_filter
            metric_filter: $input.metric_filter
            minute_ranges: $input.minute_ranges
            limit: $input.limit
          provider_result: $steps.read.provider_operation.result
        tool:
          module: google-analytics.mjs
          export: normalizeReport
        outputs:
          report_draft: {type: object}
          expected_query: {type: object}
          source_query: {type: object}
      - id: compare-query
        tool: data.compare
        inputs:
          expected: $steps.normalize.expected_query
          actual: $steps.normalize.source_query
      - id: bind-query
        tool:
          module: google-analytics.mjs
          export: bindQuery
        inputs:
          report_draft: $steps.normalize.report_draft
          comparison: $steps.compare-query.comparison
        outputs:
          report_draft: {type: object}
      - id: digest
        tool: data.digest
        inputs:
          value: $steps.bind-query.report_draft
      - id: finalize
        inputs:
          report_draft: $steps.bind-query.report_draft
          digest_result: $steps.digest.digest_result
        tool:
          module: google-analytics.mjs
          export: finalizeReport
        outputs:
          report_evidence: {type: object}
  properties:
    description: List the GA4 properties the grant can read, when the property is unknown.
    inputs: {}
    result_from:
      - read
    steps:
      - id: read
        operation: google/analytics/properties.list
        result:
          required:
            - properties
        inputs: {}
  metadata:
    description: Read a property's dimension and metric catalog, before composing an unfamiliar report.
    inputs:
      property:
        type: string
        description: Exact GA4 property resource.
    examples:
      - property: properties/123456
    result_from:
      - read
    steps:
      - id: read
        operation: google/analytics/metadata.get
        result:
          required:
            - property
            - dimensions
            - metrics
            - fetched_at
        inputs:
          property: $input.property
