skill: google-analytics
version: "0.1.7"

catalog:
  kind: graph
  audience: public
  visibility: public
  role: branded
  canonical_skill: runx/organic-growth
  provider: google/analytics
  execution: read
  completion: provider_readback
  approval: none

input_definitions:
  property:
    type: string
    required: true
    description: Exact GA4 property resource, such as properties/123456.
    schema: { pattern: '^properties/[1-9][0-9]*$' }
  date_ranges:
    type: array
    required: true
    description: One to four inclusive GA4 date ranges using YYYY-MM-DD or GA relative dates.
    schema:
      minItems: 1
      maxItems: 4
      items:
        type: object
        required: [start_date, end_date]
        additionalProperties: false
        properties:
          start_date: { type: string, pattern: '^(?:[0-9]{4}-[0-9]{2}-[0-9]{2}|today|yesterday|[0-9]+daysAgo)$' }
          end_date: { type: string, pattern: '^(?:[0-9]{4}-[0-9]{2}-[0-9]{2}|today|yesterday|[0-9]+daysAgo)$' }
          name: { type: string, maxLength: 64 }
  dimensions:
    type: array
    required: true
    description: Zero to nine ordered GA4 dimension names; an empty list supports metric-only reports.
    schema:
      maxItems: 9
      items: { type: string, minLength: 1, maxLength: 256 }
  metrics:
    type: array
    required: true
    description: One to ten ordered GA4 metric names.
    schema:
      minItems: 1
      maxItems: 10
      items: { type: string, minLength: 1, maxLength: 256 }
  filter:
    type: object
    required: false
    description: GA4 FilterExpression passed intact to the configured provider connector.
    schema:
      additionalProperties: true
  order_bys:
    type: array
    required: false
    description: Ordered GA4 OrderBy records passed intact to the provider connector.
    schema:
      maxItems: 10
      items: { type: object, additionalProperties: true }
  minute_ranges:
    type: array
    required: false
    description: One or more bounded GA4 realtime minute ranges.
    schema:
      maxItems: 4
      items:
        type: object
        required: [start_minutes_ago, end_minutes_ago]
        additionalProperties: false
        properties:
          start_minutes_ago: { type: integer, minimum: 0, maximum: 59 }
          end_minutes_ago: { type: integer, minimum: 0, maximum: 59 }
          name: { type: string, maxLength: 64 }
  report_request:
    type: object
    required: true
    description: Expected GA4 report identity and ordered headers for supplied-result normalization.
    schema:
      required: [property, report_type, dimensions, metrics]
      additionalProperties: false
      properties:
        property: { type: string, pattern: '^properties/[1-9][0-9]*$' }
        report_type: { type: string, enum: [standard, realtime] }
        date_ranges: { type: array, maxItems: 4, items: { type: object, additionalProperties: true } }
        dimensions: { type: array, maxItems: 9, items: { type: string, minLength: 1, maxLength: 256 } }
        metrics: { type: array, minItems: 1, maxItems: 10, items: { type: string, minLength: 1, maxLength: 256 } }
        dimension_filter: { type: object, additionalProperties: true }
        metric_filter: { type: object, additionalProperties: true }
        order_bys: { type: array, maxItems: 10, items: { type: object, additionalProperties: true } }
        minute_ranges: { type: array, maxItems: 4, items: { type: object, additionalProperties: true } }
        currency_code: { type: string, pattern: '^[A-Z]{3}$' }
        limit: { type: integer, minimum: 1, maximum: 100000 }
        offset: { type: integer, minimum: 0 }
  provider_result:
    type: object
    required: true
    description: GA4 report readback with ordered headers and bounded rows; provider metadata is preserved.
    schema:
      required: [dimension_headers, metric_headers, rows]
      properties:
        property: { type: string, pattern: '^properties/[1-9][0-9]*$' }
        dimension_headers: { type: array, maxItems: 9, items: { type: [string, object], additionalProperties: true } }
        metric_headers: { type: array, maxItems: 10, items: { type: [string, object], additionalProperties: true } }
        rows: { type: array, maxItems: 100000, items: { type: object, additionalProperties: true } }
        row_count: { type: integer, minimum: 0 }
        pagination: { type: object, additionalProperties: true }
        metadata: { type: object, additionalProperties: true }
        property_quota: { type: object, additionalProperties: true }
        fetched_at: { type: string, format: date-time }

harness:
  files: [fixtures/support/composed.graph]
  cases:
    - name: normalizes-organic-landing-page-outcomes
      operator_journeys:
        - mode: standalone
          request: Show which organic landing pages produced engaged sessions and conversions in this GA4 property.
          expected_outcome: Return a normalized bounded GA4 report with property identity, dimensions, metrics, dates, and measurement caveats intact.
        - mode: composed
          request: Normalize this connector-returned GA4 report for the growth analysis chain.
          expected_outcome: Reuse provider evidence without querying GA4 again or hiding thresholding and attribution caveats.
          prior_evidence:
            - The compatible connector response, property binding, report request, and measurement metadata supplied in the fixture.
          must_not_repeat:
            - Do not call the analytics provider again.
            - Do not recompute or discard provider measurement caveats.
      runner: normalize-report
      inputs:
        request:
          property: properties/123456
          report_type: standard
          date_ranges:
            - { start_date: "2026-06-01", end_date: "2026-06-30", name: june }
          dimensions: [landingPagePlusQueryString, sessionDefaultChannelGroup]
          metrics: [sessions, keyEvents, totalRevenue]
        provider_result:
          property: properties/123456
          dimension_headers:
            - { name: landingPagePlusQueryString }
            - { name: sessionDefaultChannelGroup }
          metric_headers:
            - { name: sessions, type: TYPE_INTEGER }
            - { name: keyEvents, type: TYPE_FLOAT }
            - { name: totalRevenue, type: TYPE_CURRENCY }
          rows:
            - dimension_values: [/guides/runx, Organic Search]
              metric_values: ["120", "9", "450.25"]
          row_count: 1
          pagination: { complete: true, returned_rows: 1 }
          metadata:
            time_zone: Australia/Sydney
            currency_code: AUD
            subject_to_thresholding: false
            data_loss_from_other_row: false
          fetched_at: "2026-07-01T03:00:00Z"
      expect:
        status: sealed
        steps: [normalize, digest, finalize]
        step_outputs:
          finalize:
            subset:
              report_evidence:
                data:
                  schema: runx.analytics.report.evidence.v1
                  decision: ready
                  provider: google-analytics
                  provider_status: not_called
                  source_status: supplied_result
                  property: properties/123456
                  report_type: standard
                  rows:
                    - dimensions:
                        landingPagePlusQueryString: /guides/runx
                        sessionDefaultChannelGroup: Organic Search
                      metrics:
                        sessions: 120
                        keyEvents: 9
                        totalRevenue: 450.25
                  row_count: 1
                  pagination: { complete: true, returned_rows: 1 }
                  measurement: { time_zone: Australia/Sydney, currency_code: AUD }
                  validation: { status: pass }
        receipt: { schema: runx.receipt.v1 }

    - name: carries-privacy-thresholding-as-caveat
      runner: normalize-report
      inputs:
        request:
          property: properties/123456
          report_type: standard
          date_ranges:
            - { start_date: "2026-07-01", end_date: "2026-07-19" }
          dimensions: [city]
          metrics: [activeUsers]
        provider_result:
          property: properties/123456
          dimension_headers: [{ name: city }]
          metric_headers: [{ name: activeUsers, type: TYPE_INTEGER }]
          rows:
            - dimension_values: [Sydney]
              metric_values: ["18"]
          row_count: 1
          pagination: { complete: true, returned_rows: 1 }
          metadata:
            subject_to_thresholding: true
            data_loss_from_other_row: false
            time_zone: Australia/Sydney
      expect:
        status: sealed
        steps: [normalize, digest, finalize]
        step_outputs:
          finalize:
            subset:
              report_evidence:
                data:
                  decision: usable_with_caveats
                  privacy: { subject_to_thresholding: true }
                  validation: { status: pass }
        receipt: { schema: runx.receipt.v1 }

    - name: blocks-returned-header-drift
      runner: normalize-report
      inputs:
        request:
          property: properties/123456
          report_type: standard
          date_ranges:
            - { start_date: "2026-06-01", end_date: "2026-06-30" }
          dimensions: [landingPage]
          metrics: [sessions]
        provider_result:
          property: properties/123456
          dimension_headers: [{ name: landingPage }]
          metric_headers: [{ name: totalUsers, type: TYPE_INTEGER }]
          rows:
            - dimension_values: [/]
              metric_values: ["100"]
          row_count: 1
          pagination: { complete: true, returned_rows: 1 }
      expect:
        status: sealed
        steps: [normalize, digest, finalize]
        step_outputs:
          finalize:
            subset:
              report_evidence:
                data:
                  decision: blocked
                  validation: { status: fail }
        receipt: { schema: runx.receipt.v1 }

connectors:
  google/analytics:
    operations: [reports.run, reports.run_realtime, properties.list, metadata.get]
runners:
  report:
    default: true
    inputs:
      property:
        definition: property
      date_ranges:
        definition: date_ranges
      dimensions:
        definition: dimensions
      metrics:
        definition: metrics
      dimension_filter:
        definition: filter
      metric_filter:
        definition: filter
      order_bys:
        definition: order_bys
      currency_code:
        type: string
        required: false
        description: ISO currency override when needed.
      limit:
        type: integer
        required: false
        default: 1000
        description: Bounded row limit, at most 100000.
        schema: { minimum: 1, maximum: 100000 }
      offset:
        type: integer
        required: false
        default: 0
        description: Zero-based row offset.
        schema: { minimum: 0 }
    examples:
      - property: properties/123456
        date_ranges: [{ start_date: 30daysAgo, end_date: yesterday }]
        dimensions: [landingPagePlusQueryString]
        metrics: [sessions, keyEvents]
    result_from: [finalize]
    steps:
      - id: read
        operation: google/analytics/reports.run
        result_fields: [property, request, dimension_headers, metric_headers, rows, row_count, pagination, metadata, property_quota, fetched_at]
        input:
          property: $input.property
          date_ranges: $input.date_ranges
          dimensions: $input.dimensions
          metrics: $input.metrics
          dimension_filter: $input.dimension_filter
          metric_filter: $input.metric_filter
          order_bys: $input.order_bys
          currency_code: $input.currency_code
          limit: $input.limit
          offset: $input.offset
      - id: normalize
        inputs:
          source_status: provider_readback
          request:
            property: $input.property
            report_type: standard
            date_ranges: $input.date_ranges
            dimensions: $input.dimensions
            metrics: $input.metrics
            dimension_filter: $input.dimension_filter
            metric_filter: $input.metric_filter
            order_bys: $input.order_bys
            currency_code: $input.currency_code
            limit: $input.limit
            offset: $input.offset
          provider_result: $steps.read.provider_operation.result
        tool: { module: google-analytics.mjs, export: normalizeReport }
        outputs:
          report_draft: object
      - id: digest
        tool: data.digest
        inputs:
          value: $steps.normalize.report_draft
      - id: finalize
        inputs:
          report_draft: $steps.normalize.report_draft
          digest_result: $steps.digest.digest_result
        tool: { module: google-analytics.mjs, export: finalizeReport }
        outputs:
          report_evidence: object
        artifacts:
          named_emits: { report_evidence: report_evidence }

  normalize-report:
    inputs:
      provider_result:
        definition: provider_result
      request:
        definition: report_request
    examples:
      - request:
          property: properties/123456
          report_type: standard
          date_ranges: [{ start_date: "2026-06-01", end_date: "2026-06-30" }]
          dimensions: [landingPagePlusQueryString]
          metrics: [sessions]
        provider_result:
          property: properties/123456
          dimension_headers: [{ name: landingPagePlusQueryString }]
          metric_headers: [{ name: sessions, type: TYPE_INTEGER }]
          rows:
            - dimension_values: [/guides/runx]
              metric_values: ["120"]
          row_count: 1
    result_from: [finalize]
    steps:
      - id: normalize
        inputs:
          provider_result: $input.provider_result
          request: $input.request
          source_status: supplied_result
        tool: { module: google-analytics.mjs, export: normalizeReport }
        outputs:
          report_draft: object
      - id: digest
        tool: data.digest
        inputs:
          value: $steps.normalize.report_draft
      - id: finalize
        inputs:
          report_draft: $steps.normalize.report_draft
          digest_result: $steps.digest.digest_result
        tool: { module: google-analytics.mjs, export: finalizeReport }
        outputs:
          report_evidence: object
        artifacts:
          named_emits: { report_evidence: report_evidence }

  realtime:
    inputs:
      property:
        definition: property
      dimensions:
        definition: dimensions
      metrics:
        definition: metrics
      dimension_filter:
        definition: filter
      metric_filter:
        definition: filter
      minute_ranges:
        definition: minute_ranges
      limit:
        type: integer
        required: false
        default: 1000
        description: Bounded realtime row limit.
        schema: { minimum: 1, maximum: 100000 }
    examples:
      - property: properties/123456
        dimensions: [unifiedScreenName]
        metrics: [activeUsers]
    result_from: [finalize]
    steps:
      - id: read
        operation: google/analytics/reports.run_realtime
        result_fields: [property, request, dimension_headers, metric_headers, rows, row_count, pagination, metadata, property_quota, fetched_at]
        input:
          property: $input.property
          dimensions: $input.dimensions
          metrics: $input.metrics
          dimension_filter: $input.dimension_filter
          metric_filter: $input.metric_filter
          minute_ranges: $input.minute_ranges
          limit: $input.limit
      - id: normalize
        inputs:
          source_status: provider_readback
          request:
            property: $input.property
            report_type: realtime
            dimensions: $input.dimensions
            metrics: $input.metrics
            dimension_filter: $input.dimension_filter
            metric_filter: $input.metric_filter
            minute_ranges: $input.minute_ranges
            limit: $input.limit
          provider_result: $steps.read.provider_operation.result
        tool: { module: google-analytics.mjs, export: normalizeReport }
        outputs:
          report_draft: object
      - id: digest
        tool: data.digest
        inputs:
          value: $steps.normalize.report_draft
      - id: finalize
        inputs:
          report_draft: $steps.normalize.report_draft
          digest_result: $steps.digest.digest_result
        tool: { module: google-analytics.mjs, export: finalizeReport }
        outputs:
          report_evidence: object
        artifacts:
          named_emits: { report_evidence: report_evidence }

  properties:
    inputs: {}
    result_from: [read]
    steps:
      - id: read
        operation: google/analytics/properties.list
        result_fields: [properties]
        input: {}

  metadata:
    inputs:
      property:
        type: string
        required: true
        description: Exact GA4 property resource.
    examples:
      - property: properties/123456
    result_from: [read]
    steps:
      - id: read
        operation: google/analytics/metadata.get
        result_fields: [property, dimensions, metrics, fetched_at]
        input: { property: $input.property }
