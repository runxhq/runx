skill: research-analyze
version: "0.1.1"

catalog:
  kind: graph
  audience: system
  visibility: internal
  role: graph-stage
  part_of: [runx/research]
  execution: read
  completion: runtime_receipt
  approval: none
  category: research

runners:
  analyze:
    default: true
    inputs:
      objective: { type: string, required: true }
      source_index: { type: object, required: true }
      domain: { type: string, required: false }
      deliverable: { type: string, required: false }
      operator_context: { type: string, required: false }
      target_entities: { type: json, required: false }
    result_from: [reject, finalize]
    steps:
      - id: ready
        tool: data.compare
        inputs:
          actual: $input.source_index.decision
          expected: ready

      - id: reject
        label: seal a sanitized evidence stop
        when: { value: $steps.ready.comparison.equal, equals: false }
        tool: evidence.verify_artifact
        scopes: [runx:evidence:read]
        inputs:
          artifact_name: research_packet
          candidate: { decision: ready }
          require_claim_bindings: true
          fallback_artifact:
            decision: needs_more_evidence
            research_brief: { objective: '', scope: '', summary: '', open_questions: [] }
            evidence_log: []
            decision_support: []
            risks: []
            source_evidence: []
            index_digest: ''
          fallback_bindings:
            - { target_path: research_brief.objective, source_path: objective }
            - { target_path: research_brief.open_questions, source_path: blockers }
            - { target_path: source_evidence, source_path: source_evidence }
            - { target_path: index_digest, source_path: index_digest }
          fallback_source: $input.source_index
          source_records: $input.source_index.sources
        artifacts:
          named_emits: { research_packet: verified_artifact }
          packets: { research_packet: runx/research.packet.v1 }

      - id: synthesize
        label: synthesize indexed evidence
        when: { value: $steps.ready.comparison.equal, equals: true }
        agent: { role: researcher, task: research-synthesize }
        # The research packet without what finalize binds from the source index
        # (source_evidence, index_digest) and its validation.
        outputs:
          research_candidate:
            type: object
            schema:
              required: [decision, research_brief, evidence_log, decision_support, risks]
              additionalProperties: false
              properties:
                decision: { enum: [ready, needs_more_evidence, not_worth_publishing] }
                research_brief:
                  type: object
                  required: [objective, scope, summary, open_questions]
                  additionalProperties: false
                  properties:
                    objective: { type: string }
                    scope: { type: string }
                    summary: { type: string }
                    open_questions: { type: array, items: { type: string } }
                evidence_log:
                  type: array
                  items:
                    type: object
                    required: [claim, source_digest, content_digest, confidence, relevance]
                    additionalProperties: false
                    properties:
                      claim: { type: string }
                      source_digest: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
                      content_digest: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
                      confidence: { enum: [verified, inference] }
                      relevance: { type: string }
                decision_support:
                  type: array
                  items:
                    type: object
                    required: [option, rationale, source_digests]
                    additionalProperties: false
                    properties:
                      option: { type: string }
                      rationale: { type: string }
                      source_digests:
                        type: array
                        items: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
                risks: { type: array }
        inputs:
          objective: $input.objective
          domain: $input.domain
          deliverable: $input.deliverable
          operator_context: $input.operator_context
          target_entities: $input.target_entities
          source_index: $input.source_index
        artifacts:
          named_emits: { research_candidate: research_candidate }

      - id: finalize
        label: verify evidence bindings and finalize the artifact
        when: { value: $steps.ready.comparison.equal, equals: true }
        tool: evidence.verify_artifact
        scopes: [runx:evidence:read]
        inputs:
          artifact_name: research_packet
          required_paths: [research_brief.summary, decision_support]
          required_value_bindings:
            - { candidate_path: research_brief.objective, source_path: objective }
          authoritative_bindings:
            - { target_path: source_evidence, source_path: source_evidence }
            - { target_path: index_digest, source_path: index_digest }
          fallback_artifact:
            decision: needs_more_evidence
            research_brief:
              objective: ''
              scope: ''
              summary: ''
              open_questions: [Evidence bindings did not validate.]
            evidence_log: []
            decision_support: []
            risks: []
            source_evidence: []
            index_digest: ''
          fallback_bindings:
            - { target_path: research_brief.objective, source_path: objective }
            - { target_path: source_evidence, source_path: source_evidence }
            - { target_path: index_digest, source_path: index_digest }
          source_digests: $input.source_index.source_digests
          source_records: $input.source_index.sources
          identity_source: $input.source_index
          authoritative_source: $input.source_index
          fallback_source: $input.source_index
          candidate: $steps.synthesize.research_candidate
          claim_bindings: $steps.synthesize.research_candidate.evidence_log
          reference_bindings: $steps.synthesize.research_candidate.decision_support
        artifacts:
          named_emits: { research_packet: verified_artifact }
          packets: { research_packet: runx/research.packet.v1 }
