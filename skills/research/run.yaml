version: "0.3.14"
minimum_runx: 0.12.0
default_method: investigate
catalog:
  visibility: public
  category: research

shared_inputs:
  objective:
    type: string
    description: Bounded question the research pass must answer.
    minLength: 1
    maxLength: 4000
  domain:
    type: string
    description: Domain or market context for the question.
    optional: true
  deliverable:
    type: string
    description: Target artifact or decision the research must support.
    optional: true
  operator_context:
    type: string
    description: Local constraints that shape interpretation but do not count as evidence.
    optional: true
  target_entities:
    description: Bounded entity names or caller-owned structured selectors to include or compare.
    oneOf:
      - {type: array, maxItems: 100}
      - {type: object, maxProperties: 100}
    optional: true

methods:
  investigate:
    description: Answer a bounded question by reusing supplied evidence or acquiring missing local/web sources, then using the existing verified research analysis.
    inputs:
      objective: {}
      domain: {}
      deliverable: {}
      operator_context: {}
      target_entities: {}
      source_packets:
        type: array
        default: []
        description: Existing governed readbacks; when supplied, acquisition is skipped.
        maxItems: 20
        items: {type: object, additionalProperties: true}
        optional: true
      urls:
        type: array
        default: []
        description: Explicit public source URLs to read directly, without discovery.
        maxItems: 20
        uniqueItems: true
        items: {type: string, format: uri, pattern: "^https?://"}
        optional: true
      paths:
        type: array
        default: []
        description: Explicit contained local UTF-8 source paths to read directly.
        maxItems: 16
        uniqueItems: true
        items: {type: string, minLength: 1}
        optional: true
    result_from: [reuse, analyze-acquired]
    examples:
      - objective: Which hosted Postgres providers offer point-in-time recovery under $50 a month?
    steps:
      - id: select
        tool: data.compare
        inputs: {actual: $input.source_packets, expected: []}
      - id: reuse
        when: {value: $steps.select.comparison.equal, equals: false}
        skill: .#research
        inputs:
          objective: $input.objective
          domain: $input.domain
          deliverable: $input.deliverable
          operator_context: $input.operator_context
          target_entities: $input.target_entities
          source_packets: $input.source_packets
        outputs:
          research_packet: {packet: runx/research.packet.v1, optional: true}
      - id: acquire
        when: {value: $steps.select.comparison.equal, equals: true}
        agent: research-acquire
        calls:
          tools: [fs.read_bundle]
          skills: [../web-fetch, ../web-search]
          ask: true
        inputs:
          objective: $input.objective
          domain: $input.domain
          deliverable: $input.deliverable
          operator_context: $input.operator_context
          target_entities: $input.target_entities
          urls: $input.urls
          paths: $input.paths
        outputs:
          source_packets:
            type: array
            maxItems: 20
            items: {type: object, additionalProperties: true}
      - id: analyze-acquired
        when: {value: $steps.select.comparison.equal, equals: true}
        skill: .#research
        inputs:
          objective: $input.objective
          domain: $input.domain
          deliverable: $input.deliverable
          operator_context: $input.operator_context
          target_entities: $input.target_entities
          source_packets: $steps.acquire.source_packets
        outputs:
          research_packet: {packet: runx/research.packet.v1, optional: true}
  research:
    description: Answer one question from governed source packets you supply, separating evidence from inference and citing every claim.
    inputs:
      objective: {}
      source_packets:
        type: array
        description: Bounded governed provider or fetch evidence packets.
        maxItems: 20
      domain: {}
      deliverable: {}
      operator_context: {}
      target_entities: {}
    examples:
      - objective: Decide whether the supplied API evidence supports a native integration.
        source_packets:
          - final_url: https://example.com/api
            status: 200
            content_digest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
            extracted: The API exposes a stable bounded operation contract.
            provenance: {fetched_at: '2026-07-18T00:00:00Z', bytes: 52, redirects: []}
    result_from: [analyze]
    steps:
      - id: index
        tool: evidence.index_sources
        inputs:
          objective: $input.objective
          source_packets: $input.source_packets
        outputs:
          source_index: {optional: true}

      - id: analyze
        skill: workflow/analyze#analyze
        inputs:
          objective: $input.objective
          domain: $input.domain
          deliverable: $input.deliverable
          operator_context: $input.operator_context
          target_entities: $input.target_entities
          source_index: $steps.index.source_index
        outputs:
          research_packet: {packet: runx/research.packet.v1, optional: true}

  local-files:
    description: Answer one question from bounded local files, read through runx's filesystem.
    inputs:
      objective: {}
      paths:
        type: array
        description: One to sixteen UTF-8 file paths below the selected root.
        minItems: 1
        maxItems: 16
        uniqueItems: true
        items: {type: string, minLength: 1, maxLength: 4096}
      repo_root:
        type: string
        default: .
        description: Workspace-relative or explicit absolute root containing the files.
        optional: true
      path_scope:
        type: string
        default: workspace
        description: Root ownership boundary used by the native filesystem reader.
        enum: [workspace, skill]
        optional: true
      max_bytes:
        type: integer
        default: 500000
        description: Maximum UTF-8 bytes read from each source file.
        minimum: 1
        maximum: 8388608
        optional: true
      domain: {}
      deliverable: {}
      operator_context: {}
      target_entities: {}
    examples:
      - objective: Identify the strongest architecture decision in the local design notes.
        paths: [docs/architecture.md, docs/constraints.md]
        repo_root: .
        path_scope: workspace
    result_from: [analyze]
    steps:
      - id: read-local
        tool: fs.read_bundle
        inputs:
          repo_root: $input.repo_root
          path_scope: $input.path_scope
          paths: $input.paths
          max_bytes: $input.max_bytes
          on_missing: error

      - id: index
        tool: evidence.index_sources
        inputs:
          objective: $input.objective
          source_packets: $steps.read-local.file_read_bundle.files
        outputs:
          source_index: {optional: true}

      - id: analyze
        skill: workflow/analyze#analyze
        inputs:
          objective: $input.objective
          domain: $input.domain
          deliverable: $input.deliverable
          operator_context: $input.operator_context
          target_entities: $input.target_entities
          source_index: $steps.index.source_index
        outputs:
          research_packet: {packet: runx/research.packet.v1, optional: true}
