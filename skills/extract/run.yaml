version: "0.1.14"
minimum_runx: 0.12.0
default_method: extract
catalog:
  visibility: public
  category: data
  tags:
  - extraction
  - schema-validation
  - provenance
methods:
  extract:
    description: Extract the fields your JSON schema names from text you supply, each value bound to a quotation from it.
    inputs:
      content:
        type: string
        description: Exact already-admitted HTML, markdown or plain text.
        minLength: 1
        maxLength: 1000000
      source_id:
        type: string
        description: Stable document, artifact or URL reference supplied with these bytes.
        minLength: 1
        maxLength: 2000
      schema:
        description: Self-contained JSON Schema 2020-12 for the extracted value; no external schema retrieval.
      objective:
        type: string
        description: What to extract and how to represent missing or ambiguous fields.
        minLength: 1
        maxLength: 5000
    result_from:
    - finalize
    examples:
    - source_id: invoice-1042.txt
      content: 'Invoice 1042, issued to Northwind Pty Ltd. Total due: AUD 1,250.00 by 30 November 2026.'
      objective: Extract the invoice number, buyer and total due. Leave a field null if the document does not state it.
      schema:
        type: object
        additionalProperties: false
        required:
        - invoice_number
        - buyer
        - total_due
        properties:
          invoice_number:
            type:
            - string
            - 'null'
          buyer:
            type:
            - string
            - 'null'
          total_due:
            type:
            - string
            - 'null'
    steps:
    - id: schema
      tool: data.validate
      inputs:
        schema: $input.schema
        values: []
    - id: source
      tool: data.digest
      inputs:
        value: $input.content
        encoding: utf8_text
    - id: extract
      agent: extract-to-schema
      inputs:
        content: $input.content
        source_id: $input.source_id
        schema: $input.schema
        objective: $input.objective
      outputs:
        value: {}
        citations:
          type: array
          maxItems: 500
          items:
            type: object
            required:
            - pointer
            - quote
            additionalProperties: false
            properties:
              pointer:
                type: string
                maxLength: 2000
              quote:
                type: string
                minLength: 1
                maxLength: 4000
        missing_fields:
          type: array
          maxItems: 100
          items:
            type: string
            maxLength: 2000
    - id: validate
      tool: data.validate
      inputs:
        schema: $input.schema
        values:
        - $steps.extract.value
    - id: output-digest
      tool: data.digest
      inputs:
        value: $steps.extract.value
    - id: finalize
      tool:
        module: extract.mjs
        export: finalize
      inputs:
        content: $input.content
        source_id: $input.source_id
        source_digest: $steps.source.digest_result.digest
        value: $steps.extract.value
        citations: $steps.extract.citations
        missing_fields: $steps.extract.missing_fields
        validation: $steps.validate.validation
        output_digest: $steps.output-digest.digest_result.digest
      outputs:
        structured_extraction_result:
          type: object
          packet: runx/extract.result.v1
  from-file:
    description: Extract the fields your JSON schema names from one bounded file in the workspace, each value bound to a quotation from it.
    inputs:
      source_id:
        type: string
        description: Stable document, artifact or URL reference supplied with these bytes.
        minLength: 1
        maxLength: 2000
      schema:
        description: Self-contained JSON Schema 2020-12 for the extracted value; no external schema retrieval.
      objective:
        type: string
        description: What to extract and how to represent missing or ambiguous fields.
        minLength: 1
        maxLength: 5000
      repo_root:
        type: string
        default: .
        description: Authorized workspace root.
        optional: true
      path:
        type: string
        description: Workspace-relative text document to admit through native artifact storage.
      path_scope:
        type: string
        default: workspace
        description: 'Trusted input root: workspace or the owning skill package.'
        enum:
        - workspace
        - skill
        optional: true
      max_bytes:
        type: number
        default: 1000000
        description: Complete-document read budget. A partial page fails before extraction.
        minimum: 1
        maximum: 1000000
        optional: true
    result_from:
    - extract
    steps:
    - id: admit
      tool: artifact.admit
      inputs:
        repo_root: $input.repo_root
        path: $input.path
        media_type: text/plain
        path_scope: $input.path_scope
    - id: read
      tool: artifact.read
      inputs:
        artifact_uri: $steps.admit.local_artifact.artifact_uri
        encoding: utf8
        max_bytes: $input.max_bytes
    - id: complete
      tool:
        module: extract.mjs
        export: fileContent
      inputs:
        page: $steps.read.artifact_page
      outputs:
        content: {type: string}
    - id: extract
      skill: .#extract
      inputs:
        source_id: $input.source_id
        schema: $input.schema
        objective: $input.objective
        content: $steps.complete.content
