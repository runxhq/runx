skill: extract
version: "0.1.12"
catalog:
  kind: skill
  audience: public
  visibility: public
  category: data
  role: canonical
  execution: read
  completion: runtime_receipt
  approval: none
  tags:
  - extraction
  - schema-validation
  - provenance
harness:
  files:
  - fixtures/support/composed.graph
  - fixtures/invoice.txt
  cases:
  - name: extracts-caller-document-to-caller-schema
    inputs:
      content: Invoice INV-104. Total USD 125. Customer Northstar.
      source_ref: document:invoice-104
      objective: Extract invoice id, total and customer. Do not infer missing fields.
      schema:
        type: object
        required:
        - invoice_id
        - total_usd
        - customer
        additionalProperties: false
        properties:
          invoice_id:
            type: string
            minLength: 3
          total_usd:
            type: number
            minimum: 0
          customer:
            type: string
    caller:
      answers:
        extract:
          value:
            invoice_id: INV-104
            total_usd: 125
            customer: Northstar
          citations:
          - pointer: /invoice_id
            quote: INV-104
          - pointer: /total_usd
            quote: '125'
          - pointer: /customer
            quote: Northstar
          missing_fields: []
    expect:
      status: sealed
      step_outputs:
        finalize:
          subset:
            structured_extraction_result:
              data:
                decision: ready
    operator_journeys:
    - mode: standalone
      confusors:
      - web-fetch
      - schema-check
      request: Extract the invoice id, customer and total from this captured document to the supplied
        JSON schema.
      expected_outcome: Return the schema-valid invoice fields with exact quotations and input/schema/output
        digests, without fetching or paying.
    - mode: composed
      request: Extract the invoice id, customer and total from this captured document to the supplied
        JSON schema.
      expected_outcome: Return the schema-valid invoice fields with exact quotations and input/schema/output
        digests, without fetching or paying.
      prior_evidence:
      - The exact invoice text and schema already supplied by the upstream capture.
      must_not_repeat:
      - Do not fetch the document, redefine its schema or pay the invoice.
  - name: withholds-invented-source-quote
    inputs:
      content: Invoice INV-104. Total USD 125. Customer Northstar.
      source_ref: document:invoice-104
      objective: Extract invoice id, total and customer. Do not infer missing fields.
      schema:
        type: object
        required:
        - invoice_id
        - total_usd
        - customer
        additionalProperties: false
        properties:
          invoice_id:
            type: string
            minLength: 3
          total_usd:
            type: number
            minimum: 0
          customer:
            type: string
    caller:
      answers:
        extract:
          value:
            invoice_id: INV-104
            total_usd: 125
            customer: Northstar
          citations:
          - pointer: /invoice_id
            quote: INV-999
          missing_fields: []
    expect:
      status: sealed
      step_outputs:
        finalize:
          subset:
            structured_extraction_result:
              data:
                decision: held
  - name: withholds-schema-invalid-output
    inputs:
      content: Invoice INV-104. Total USD 125. Customer Northstar.
      source_ref: document:invoice-104
      objective: Extract invoice id, total and customer. Do not infer missing fields.
      schema:
        type: object
        required:
        - invoice_id
        - total_usd
        - customer
        additionalProperties: false
        properties:
          invoice_id:
            type: string
            minLength: 3
          total_usd:
            type: number
            minimum: 0
          customer:
            type: string
    caller:
      answers:
        extract:
          value:
            invoice_id: INV-104
            total_usd: -1
            customer: Northstar
          citations:
          - pointer: /invoice_id
            quote: INV-104
          - pointer: /total_usd
            quote: '125'
          - pointer: /customer
            quote: Northstar
          missing_fields: []
    expect:
      status: sealed
      step_outputs:
        finalize:
          subset:
            structured_extraction_result:
              data:
                decision: held
  - name: extracts-complete-native-file-artifact
    runner: from-file
    inputs:
      source_ref: document:invoice-104
      objective: Extract invoice id, total and customer. Do not infer missing fields.
      schema:
        type: object
        required:
        - invoice_id
        - total_usd
        - customer
        additionalProperties: false
        properties:
          invoice_id:
            type: string
            minLength: 3
          total_usd:
            type: number
            minimum: 0
          customer:
            type: string
      path: fixtures/invoice.txt
      path_scope: skill
    caller:
      answers:
        extract#extract:
          value:
            invoice_id: INV-104
            total_usd: 125
            customer: Northstar
          citations:
          - pointer: /invoice_id
            quote: INV-104
          - pointer: /total_usd
            quote: '125'
          - pointer: /customer
            quote: Northstar
          missing_fields: []
    expect:
      status: sealed
      steps:
      - admit
      - read
      - complete
      - extract
  - name: refuses-partial-file-before-agent
    runner: from-file
    inputs:
      source_ref: document:invoice-104
      objective: Extract invoice id, total and customer. Do not infer missing fields.
      schema:
        type: object
        required:
        - invoice_id
        - total_usd
        - customer
        additionalProperties: false
        properties:
          invoice_id:
            type: string
            minLength: 3
          total_usd:
            type: number
            minimum: 0
          customer:
            type: string
      path: fixtures/invoice.txt
      path_scope: skill
      max_bytes: 5
    expect:
      status: failure
runners:
  extract:
    description: Extract the fields your JSON schema names from text you supply, each value bound to a quotation from it.
    default: true
    inputs:
      content:
        type: string
        required: true
        description: Exact already-admitted HTML, markdown or plain text.
        schema:
          minLength: 1
          maxLength: 1000000
      source_ref:
        type: string
        required: true
        description: Stable document, artifact or URL reference supplied with these bytes.
        schema:
          minLength: 1
          maxLength: 2000
      schema:
        type: json
        required: true
        description: Self-contained JSON Schema 2020-12 for the extracted value; no external schema retrieval.
      objective:
        type: string
        required: true
        description: What to extract and how to represent missing or ambiguous fields.
        schema:
          minLength: 1
          maxLength: 5000
    result_from:
    - finalize
    steps:
    - id: schema
      tool: data.validate
      inputs:
        schema: $input.schema
        values: []
    - id: source
      tool: data.digest
      inputs:
        value: $input.content
        encoding: utf8_text
    - id: extract
      agent:
        role: analyst
        task: extract-to-schema
      inputs:
        content: $input.content
        source_ref: $input.source_ref
        schema: $input.schema
        objective: $input.objective
      outputs:
        value:
          schema: {}
        citations:
          type: array
          schema:
            maxItems: 500
            items:
              type: object
              required:
              - pointer
              - quote
              additionalProperties: false
              properties:
                pointer:
                  type: string
                  maxLength: 2000
                quote:
                  type: string
                  minLength: 1
                  maxLength: 4000
            type: array
        missing_fields:
          type: array
          schema:
            maxItems: 100
            items:
              type: string
              maxLength: 2000
            type: array
    - id: validate
      tool: data.validate
      inputs:
        schema: $input.schema
        values:
        - $steps.extract.value
    - id: output-digest
      tool: data.digest
      inputs:
        value: $steps.extract.value
    - id: finalize
      tool:
        module: extract.mjs
        export: finalize
      inputs:
        content: $input.content
        source_ref: $input.source_ref
        source_digest: $steps.source.digest_result.digest
        value: $steps.extract.value
        citations: $steps.extract.citations
        missing_fields: $steps.extract.missing_fields
        validation: $steps.validate.validation
        output_digest: $steps.output-digest.digest_result.digest
      outputs:
        structured_extraction_result:
          type: object
          schema:
            additionalProperties: false
            required:
            - schema
            - decision
            - source_ref
            - source_digest
            - schema_digest
            - output_digest
            - value
            - citations
            - missing_fields
            - validation
            properties:
              schema:
                const: runx.structured_extraction.result.v1
              decision:
                enum:
                - ready
                - held
              source_ref:
                type: string
              source_digest:
                type: string
                pattern: ^sha256:[0-9a-f]{64}$
              schema_digest:
                type: string
                pattern: ^sha256:[0-9a-f]{64}$
              output_digest:
                type: string
                pattern: ^sha256:[0-9a-f]{64}$
              value:
                description: Caller-schema JSON value when ready, null when held.
              citations:
                maxItems: 500
                items:
                  type: object
                  required:
                  - pointer
                  - quote
                  additionalProperties: false
                  properties:
                    pointer:
                      type: string
                      maxLength: 2000
                    quote:
                      type: string
                      minLength: 1
                      maxLength: 4000
                type: array
              missing_fields:
                maxItems: 100
                items:
                  type: string
                  maxLength: 2000
                type: array
              validation:
                type: object
                additionalProperties: false
                required:
                - valid
                - schema_digest
                - values_digest
                - results
                - findings
                properties:
                  valid:
                    type: boolean
                  schema_digest:
                    type: string
                    pattern: ^sha256:[0-9a-f]{64}$
                  values_digest:
                    type: string
                    pattern: ^sha256:[0-9a-f]{64}$
                  results:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required:
                      - index
                      - valid
                      - errors
                      - truncated
                      properties:
                        index:
                          type: integer
                          minimum: 0
                        valid:
                          type: boolean
                        errors:
                          type: array
                          items:
                            type: object
                            additionalProperties: false
                            required:
                            - instance_path
                            - schema_path
                            properties:
                              instance_path:
                                type: string
                              schema_path:
                                type: string
                        truncated:
                          type: boolean
                  findings:
                    type: array
                    items:
                      type: string
      artifacts:
        named_emits:
          structured_extraction_result: structured_extraction_result
        packets:
          structured_extraction_result: runx.structured_extraction.result.v1
  from-file:
    description: Extract the fields your JSON schema names from one bounded file in the workspace, each value bound to a quotation from it.
    inputs:
      source_ref:
        type: string
        required: true
        description: Stable document, artifact or URL reference supplied with these bytes.
        schema:
          minLength: 1
          maxLength: 2000
      schema:
        type: json
        required: true
        description: Self-contained JSON Schema 2020-12 for the extracted value; no external schema retrieval.
      objective:
        type: string
        required: true
        description: What to extract and how to represent missing or ambiguous fields.
        schema:
          minLength: 1
          maxLength: 5000
      repo_root:
        type: string
        required: false
        default: .
        description: Authorized workspace root.
      path:
        type: string
        required: true
        description: Workspace-relative text document to admit through native artifact storage.
      path_scope:
        type: string
        required: false
        default: workspace
        description: 'Trusted input root: workspace or the owning skill package.'
        schema:
          enum:
          - workspace
          - skill
      max_bytes:
        type: number
        required: false
        default: 1000000
        description: Complete-document read budget. A partial page fails before extraction.
        schema:
          minimum: 1
          maximum: 1000000
    result_from:
    - extract
    steps:
    - id: admit
      tool: artifact.admit
      scopes:
      - fs.read
      inputs:
        repo_root: $input.repo_root
        path: $input.path
        media_type: text/plain
        path_scope: $input.path_scope
    - id: read
      tool: artifact.read
      scopes:
      - fs.read
      inputs:
        artifact_ref: $steps.admit.local_artifact.artifact_ref
        encoding: utf8
        max_bytes: $input.max_bytes
    - id: complete
      tool:
        module: extract.mjs
        export: fileContent
      inputs:
        page: $steps.read.artifact_page
      outputs:
        content: string
    - id: extract
      skill: .
      runner: extract
      inputs:
        source_ref: $input.source_ref
        schema: $input.schema
        objective: $input.objective
        content: $steps.complete.content
