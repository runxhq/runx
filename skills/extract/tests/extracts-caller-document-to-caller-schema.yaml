name: extracts-caller-document-to-caller-schema
inputs:
  content: Invoice INV-104. Total USD 125. Customer Northstar.
  source_id: document:invoice-104
  objective: Extract invoice id, total and customer. Do not infer missing fields.
  schema:
    type: object
    required:
    - invoice_id
    - total_usd
    - customer
    additionalProperties: false
    properties:
      invoice_id:
        type: string
        minLength: 3
      total_usd:
        type: number
        minimum: 0
      customer:
        type: string
host:
  answers:
    extract:
      value:
        invoice_id: INV-104
        total_usd: 125
        customer: Northstar
      citations:
      - pointer: /invoice_id
        quote: INV-104
      - pointer: /total_usd
        quote: '125'
      - pointer: /customer
        quote: Northstar
      missing_fields: []
expect:
  status: sealed
  step_outputs:
    finalize:
      subset:
        structured_extraction_result:
          data:
            decision: ready
