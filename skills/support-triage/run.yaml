version: "0.1.11"
minimum_runx: 0.12.0
catalog:
  visibility: public
  category: ops
methods:
  triage:
    inputs:
      support_request:
        type: object
        description: One already-collected customer request; source identifies the supplied thread.
        required:
        - source
        - body
        additionalProperties: false
        properties:
          source:
            type: string
            minLength: 1
            maxLength: 1000
          subject:
            type: string
            maxLength: 2000
          body:
            type: string
            minLength: 1
            maxLength: 50000
          customer_name:
            type: string
            maxLength: 500
          customer_email:
            type: string
            maxLength: 500
      product_evidence:
        type: array
        default: []
        description: Bounded current product documentation or admitted account evidence; no provider re-fetch.
        maxItems: 30
        items:
          type: object
          required:
          - source_id
          - text
          additionalProperties: false
          properties:
            source_id:
              type: string
              minLength: 1
              maxLength: 1000
            text:
              type: string
              minLength: 1
              maxLength: 50000
        optional: true
      policy:
        description: Support tone, escalation routes and constraints. Context, never proof of approval.
        optional: true
    result_from:
    - finalize
    examples:
    - support_request:
        source: helpdesk:ticket-5512
        subject: Export keeps timing out
        body: Our nightly export has timed out three times this week. Can you help?
      product_evidence:
      - source_id: docs:exports
        text: Exports over 1 GB run in the background and email a link when finished.
    steps:
    - id: request-digest
      tool: data.digest
      inputs:
        value: $input.support_request
    - id: context-digest
      tool: data.digest
      inputs:
        value: $input.product_evidence
    - id: judge
      agent: support-triage
      inputs:
        support_request: $input.support_request
        product_evidence: $input.product_evidence
        policy: $input.policy
      outputs:
        draft:
          type: object
          required:
          - classification
          - severity
          - recommended_path
          - rationale
          - evidence
          - missing_context
          - operator_notes
          - draft_email
          additionalProperties: false
          properties:
            classification:
              enum:
              - how_to
              - billing
              - account_access
              - bug
              - abuse
              - unknown
            severity:
              enum:
              - low
              - medium
              - high
              - critical
            recommended_path:
              enum:
              - reply_draft
              - request_info
              - engineering_intake
              - billing_review
              - account_review
              - abuse_review
              - manual_review
            rationale:
              type: string
              minLength: 1
              maxLength: 5000
            evidence:
              type: array
              maxItems: 50
              items:
                type: object
                required:
                - source_id
                - quote
                additionalProperties: false
                properties:
                  source_id:
                    type: string
                    minLength: 1
                    maxLength: 1000
                  quote:
                    type: string
                    minLength: 1
                    maxLength: 4000
            missing_context:
              type: array
              maxItems: 30
              items:
                type: string
                minLength: 1
                maxLength: 2000
            operator_notes:
              type: array
              maxItems: 30
              items:
                type: string
                minLength: 1
                maxLength: 2000
            draft_email:
              type:
              - object
              - 'null'
              required:
              - subject
              - body
              additionalProperties: false
              properties:
                subject:
                  type: string
                  minLength: 1
                  maxLength: 2000
                body:
                  type: string
                  minLength: 1
                  maxLength: 20000
    - id: finalize
      tool:
        module: support-triage.mjs
      inputs:
        support_request: $input.support_request
        product_evidence: $input.product_evidence
        policy: $input.policy
        draft: $steps.judge.draft
        request_digest: $steps.request-digest.digest_result.digest
        context_digest: $steps.context-digest.digest_result.digest
      outputs:
        support_triage_packet:
          type: object
          packet: runx/support-triage.reply.v1
