name: weather-forecast-packet
kind: skill
target: ..
runner: normalize
operator_journeys:
  - mode: standalone
    confusors: [nws-weather-forecast, open-meteo-weather-forecast]
    request: Give me a decision-ready forecast for tomorrow's outdoor demo at the Washington Monument.
    expected_outcome: Return a provider-neutral forecast packet with uncertainty, source provenance, and planning stop conditions.
  - mode: composed
    request: Normalize this NWS forecast evidence for the outdoor-demo planning chain.
    expected_outcome: Reuse the supplied provider evidence without fetching weather again or discarding uncertainty.
    prior_evidence:
      - The NWS forecast evidence, source references, horizon, location, and purpose supplied in the fixture.
    must_not_repeat:
      - Do not call a weather provider again.
      - Do not reinterpret provider timestamps or periods already preserved in evidence.
