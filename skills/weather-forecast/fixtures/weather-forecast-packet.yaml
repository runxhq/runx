    generated_at: 2026-06-09T00:00:00Z
    source_refs:
      - gridpoints/LWX/97,71/forecast
    receipt_refs: []
    periods:
      - name: Tomorrow
        shortForecast: Chance Showers
        windSpeed: 8 mph
caller:
