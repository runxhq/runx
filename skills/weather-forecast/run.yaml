skill: weather-forecast
version: "0.2.3"
catalog:
  kind: graph
  audience: public
  visibility: public
  role: canonical
  execution: read
  completion: runtime_receipt
  requires_adapter: false
  approval: none
runners:
  normalize:
    default: true
    inputs:
      location:
        type: string
        required: true
        description: Place, coordinates, gridpoint, or provider location label.
      forecast_evidence:
        type: json
        required: true
        description: Provider evidence with provenance, generated time, and forecast periods.
      horizon:
        type: string
        required: false
        description: Time range to interpret.
      purpose:
        type: string
        required: false
        description: Planning context for the forecast packet.
      freshness_requirement:
        type: string
        required: false
        description: Maximum acceptable age or timestamp policy for analyst assessment.
    result_from: [validate]
    steps:
      - id: interpret
        label: interpret bounded provider evidence
        agent: { role: analyst, task: weather-forecast-interpret }
        outputs:
          forecast_draft: object
        inputs:
          location: $input.location
          forecast_evidence: $input.forecast_evidence
          horizon: $input.horizon
          purpose: $input.purpose
          freshness_requirement: $input.freshness_requirement
        artifacts:
          named_emits:
            forecast_draft: forecast_draft
      - id: validate
        label: validate evidence fidelity
        inputs:
          location: $input.location
          forecast_evidence: $input.forecast_evidence
          horizon: $input.horizon
          purpose: $input.purpose
          forecast_draft: $steps.interpret.forecast_draft
        tool: { module: weather-forecast.mjs }
        outputs:
          decision: string
          location: string
          horizon: string
          forecast_packet:
            type: object
            schema:
              required: [summary, periods, hazards, confidence, generated_at]
              additionalProperties: false
              properties:
                summary: { type: string }
                periods:
                  type: array
                  items:
                    type: object
                    properties:
                      name: { type: string }
                      label: { type: string }
                      forecast: { type: string }
                      wind: { type: string }
                    additionalProperties: true
                hazards: { type: array, items: { type: string } }
                confidence: { type: string }
                generated_at: { type: string }
          provider_evidence:
            type: object
            schema:
              required: [provider, source_refs, receipt_refs]
              additionalProperties: false
              properties:
                provider: { type: string }
                source_refs: { type: array, items: { type: string }, uniqueItems: true }
                receipt_refs: { type: array, items: { type: string }, uniqueItems: true }
          safety_notes: array
          stop_conditions: array
          receipt_notes:
            type: object
            schema:
              required: [authority, mutation]
              additionalProperties: false
              properties:
                authority: { const: context-only }
                mutation: { const: false }
        artifacts:
          wrap_as: weather_forecast_packet
          packet: runx.context.weather_forecast.v1
