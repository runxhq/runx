name: nitrosend-send-test-message-approved
kind: skill
target: ..
runner: send-test-message
operator_journeys:
- mode: standalone
  request: Approve and send this exact reviewed flow revision to the named test recipient.
  expected_outcome: Review, approve, dispatch once with stable idempotency, and return provider send evidence without activating the flow.
setup:
  credentials:
  - nitrosend
env:
  NITROSEND_API_KEY: harness-nitrosend-token
inputs:
  target_type: flow
  target_id: 42
  revision_id: 3
  action_id: 7
  channel: email
  to:
  - operator@example.com
  data: {}
  dry_run: false
  idempotency_key: mailschema-flow-42-revision-3-test-1
  brand_sid: br_sourcey
caller:
  approvals:
    "operation:sha256:01426f61457c962fd97aada8c9cebd7d9ff32f664889f7a312db9a84c7a6e68e": true
  mcp_calls:
  - tool: nitro_review_delivery
    arguments:
      target_type: flow
      target_id: 42
      revision_id: 3
    headers:
      x-brand-sid: br_sourcey
    result:
      content:
      - type: text
        text: '{"meta":{"tool":"nitro_review_delivery"},"result":{"target_type":"flow","target_id":42,"revision_id":3,"decision":"ready","review_steps":[{"action_id":7,"channel":"email"}]}}'
  - tool: nitro_send_test_message
    arguments:
      target_type: flow
      target_id: 42
      revision_id: 3
      action_id: 7
      channel: email
      to:
      - operator@example.com
      data: {}
      dry_run: false
      idempotency_key: "runx:sha256:01426f61457c962fd97aada8c9cebd7d9ff32f664889f7a312db9a84c7a6e68e"
    headers:
      x-brand-sid: br_sourcey
    result:
      content:
      - type: text
        text: '{"meta":{"tool":"nitro_send_test_message"},"result":{"channel":"email","target":{"type":"flow","id":42,"source":"target"},"revision_id":3,"revision_digest":"sha256:revision","recipients":[{"to":"operator@example.com","source":"explicit"}],"recipient_count":1,"test_send":{"sent":1,"failed":0,"outcome":"sent"}}}'
expect:
  status: sealed
  steps:
  - review
  - send
  step_outputs:
    send:
      subset:
        provider_evidence:
          data:
            decision: ok
            provider: nitrosend
            operation: send_test_message
            tool: nitro_send_test_message
            provider_ref: nitrosend:send_test_message:flow:42:revision:3
  receipt:
    schema: runx.receipt.v1
    state: sealed
    disposition: closed
metadata:
  public_skill: nitrosend
  source_case: send-test-message-approved
  source: operator-journey
