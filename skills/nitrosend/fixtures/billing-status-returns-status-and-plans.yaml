name: nitrosend-billing-status-returns-status-and-plans
kind: skill
target: ..
runner: billing-status
operator_journeys:
- mode: standalone
  confusors:
  - plan-checkout
  - purchase-approval
  request: Show the current Nitrosend subscription and the eligible plans without changing billing.
  expected_outcome: Return current subscription evidence and the eligible plan catalog from two bounded reads without creating a checkout.
setup:
  credentials:
  - nitrosend
env:
  NITROSEND_API_KEY: harness-nitrosend-token
inputs: {}
caller:
  mcp_calls:
  - tool: nitro_manage_billing
    arguments:
      operation: status
    result:
      content:
      - type: text
        text: '{"meta":{"tool":"nitro_manage_billing"},"result":{"operation":"status","commercial_tier":"pro","has_subscription":true,"subscription":{"id":101,"plan_name":"Pro","status":"active","activated":true},"funding":{"state":"ready","available_cents":490,"currency":"USD","add_funds":{"state":"available","available":true,"minimum_cents":500,"maximum_cents":100000,"preset_cents":[2000,5000,10000],"currency":"USD"}}}}'
  - tool: nitro_manage_billing
    arguments:
      operation: plans
    result:
      content:
      - type: text
        text: '{"meta":{"tool":"nitro_manage_billing"},"result":{"operation":"plans","plans":[{"id":202,"name":"Scale","eligible":true}],"can_upgrade":true}}'
expect:
  status: sealed
  steps:
  - status
  - plans
  - present
  step_outputs:
    present:
      subset:
        status_evidence:
          data:
            decision: ok
            operation: billing_status
            result:
              funding:
                available_cents: 490
                add_funds:
                  available: true
        plans_evidence:
          data:
            decision: ok
            operation: billing_plans
  receipt:
    schema: runx.receipt.v1
metadata:
  public_skill: nitrosend
  source_case: billing-status-returns-status-and-plans
  source: skills-fixture
