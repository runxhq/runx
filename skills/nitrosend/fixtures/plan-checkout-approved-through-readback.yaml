name: nitrosend-plan-checkout-approved-through-readback
kind: skill
target: ..
runner: plan-checkout
operator_journeys:
- mode: standalone
  confusors:
  - purchase-approval
  - spend
  - charge
  request: Approve this exact Nitrosend plan and apply the idempotent provider action.
  expected_outcome: Re-read billing and plans, approve once, accept a no-op current-plan result without requiring a purchase ID, and return billing readback without claiming a charge.
setup:
  credentials:
  - nitrosend
env:
  NITROSEND_API_KEY: harness-nitrosend-token
inputs:
  plan_id: 202
  idempotency_key: account-1-plan-202-v1
caller:
  approvals:
    "operation:sha256:b3a983d6a385292f7f51a384ff7b5f5aecdbce736698804461e7381dde9a7505": true
  mcp_calls:
  - tool: nitro_manage_billing
    arguments:
      operation: status
    result:
      content:
      - type: text
        text: '{"meta":{"tool":"nitro_manage_billing"},"result":{"operation":"status","has_subscription":true,"subscription":{"plan_name":"Pro","status":"active"},"next_action":"Subscription active."}}'
  - tool: nitro_manage_billing
    arguments:
      operation: plans
    result:
      content:
      - type: text
        text: '{"meta":{"tool":"nitro_manage_billing"},"result":{"operation":"plans","plans":[{"id":202,"name":"Scale","price_cents":9900}],"next_action":"Choose a plan."}}'
  - tool: nitro_manage_billing
    arguments:
      operation: checkout
      params:
        plan_id: 202
        confirm: true
      idempotency_key: "runx:sha256:b3a983d6a385292f7f51a384ff7b5f5aecdbce736698804461e7381dde9a7505"
    result:
      content:
      - type: text
        text: '{"meta":{"tool":"nitro_manage_billing"},"result":{"operation":"checkout","action":"current","reused":true,"plan_id":202,"status":"active","activated":true,"next_action":"The requested plan
          is already current."}}'
expect:
  status: sealed
  steps:
  - status
  - plans
  - checkout
  - readback
  - present
  step_outputs:
    checkout:
      subset:
        provider_evidence:
          data:
            decision: ok
            operation: plan_checkout
    present:
      subset:
        checkout_evidence:
          data:
            decision: ok
            operation: plan_checkout
        status_evidence:
          data:
            decision: ok
            operation: billing_status
  receipt:
    schema: runx.receipt.v1
    state: sealed
    disposition: closed
metadata:
  public_skill: nitrosend
  source_case: plan-checkout-approved-through-readback
  source: skills-fixture
