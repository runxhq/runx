name: nitrosend-default-requires-account-binding
kind: skill
target: ..
operator_journeys:
- mode: standalone
  confusors:
  - send-as
  - content-pipeline
  request: Inspect the current readiness of this Nitrosend account.
  expected_outcome: Use the account-status runner by default and return normalized provider evidence through an explicitly supplied tenant credential binding.
setup:
  credentials:
  - nitrosend
env:
  NITROSEND_API_KEY: harness-nitrosend-token
inputs:
  brand_sid: brnd_demo123
caller:
  mcp_calls:
  - tool: nitro_get_status
    arguments: {}
    headers:
      x-brand-sid: brnd_demo123
    result:
      content:
      - type: text
        text: '{"meta":{"tool":"nitro_get_status"},"result":{"status":"ready","brand_sid":"brnd_demo123"}}'
expect:
  status: sealed
metadata:
  public_skill: nitrosend
  source_case: direct-default-preflight
  source: skills-fixture
