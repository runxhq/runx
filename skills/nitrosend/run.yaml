  send-transactional:
    act:
      purpose: Send or dry-run one idempotent transactional message to one recipient.
    inputs:
      channel:
        type: string
        required: true
        description: email or sms.
        schema: { enum: [email, sms] }
      to:
        type: string
        required: true
        description: One recipient email address or E.164 phone number.
      subject:
        type: string
        required: false
        description: Required for email.
      body:
        type: string
        required: false
        description: Plain-text body.
      template_id:
        type: number
        required: false
        description: Existing Nitrosend email template ID.
      data:
        type: object
        required: false
        description: Transactional merge variables.
        schema:
          additionalProperties: true
      dry_run:
        type: boolean
        required: false
        default: true
        description: Validate without sending when true.
      idempotency_key:
        type: string
        required: true
        description: Stable retry key; mandatory even for dry-run-to-live continuity.
      brand_sid:
        type: string
        required: false
        description: Optional public Nitrosend brand SID.
    examples:
      - channel: email
        to: buyer@example.com
        subject: Your order is confirmed
        body: Thanks—your order 1001 is confirmed.
        data: { order_number: '1001' }
        dry_run: true
        idempotency_key: order-confirmation-1001
        brand_sid: brnd_demo123
    result_from: [send]
    steps:
      - id: send
        skill: graph/provider-operation
        runner: act
        inputs:
          operation: send_transactional
          arguments:
            channel: "$input.channel"
            to: "$input.to"
            subject: "$input.subject"
            body: "$input.body"
            template_id: "$input.template_id"
            data: "$input.data"
            dry_run: "$input.dry_run"
            idempotency_key: "$input.idempotency_key"
          brand_sid: "$input.brand_sid"
          idempotency_key: $input.idempotency_key
