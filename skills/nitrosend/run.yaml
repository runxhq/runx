            entity_id: "$input.entity_id"
            period: "$input.period"
          brand_sid: "$input.brand_sid"
  plan-import:
    inputs:
      objective:
        type: string
        required: true
        description: One bounded contact-import objective.
      source_brief:
        type: string
        required: false
        description: Where the contacts come from and the consent basis.
      records:
        type: string
        required: false
        description: Inline records as a JSON string, under 100.
      account_status_json:
        type: string
        required: false
        description: JSON string from nitro_get_status.
      operator_context:
        type: string
        required: false
        description: Extra operator guardrails.
    examples:
      - objective: Import the supplied event attendees into the webinar list.
        source_brief: Attendees explicitly opted in during webinar registration.
        records: '[{"email":"person@example.com","first_name":"Pat"}]'
        account_status_json: '{"decision":"ready"}'
        operator_context: Prepare a dry-run import plan first.
    steps:
      - id: plan-import
        agent: { role: builder, task: import-contacts-plan }
        inputs:
          objective: $input.objective
          source_brief: $input.source_brief
          records: $input.records
          account_status_json: $input.account_status_json
          operator_context: $input.operator_context
        outputs:
          import_plan:
            type: object
            schema:
              required: [decision]
              additionalProperties: false
              properties:
                decision: { type: string, enum: [ready, needs_input, reject] }
                source: { type: string }
                record_count: { type: integer, minimum: 0 }
                channels: { type: array, items: { type: string }, uniqueItems: true }
                compliance_checks: { type: array, items: { type: string } }
                ordered_tool_calls:
                  type: array
                  items:
                    type: object
                    required: [tool, purpose, requires_confirmation]
                    additionalProperties: false
                    properties:
                      tool: { type: string, minLength: 1 }
                      purpose: { type: string, minLength: 1 }
                      requires_confirmation: { type: boolean }
                human_actions: { type: array, items: { type: string } }
                blockers: { type: array, items: { type: string } }
                needs_input: { type: array, items: { type: string } }
                unsupported_requirements: { type: array, items: { type: string } }
                rejection_reason: { type: string }
                success_checkpoint:
                  type: object
                  required: [milestone, description]
                  additionalProperties: false
                  properties:
                    milestone: { type: string, minLength: 1 }
                    description: { type: string, minLength: 1 }
        artifacts:
          wrap_as: import_packet
          packet: nitrosend.import.v1
  import-contacts:
    act:
      purpose: Import one consented inline contact batch after explicit approval.
    inputs:
      records:
        type: array
        required: true
        description: Up to 100 contact objects.
        schema:
          minItems: 1
          maxItems: 100
          items: { type: object, minProperties: 1 }
      source_id:
        type: string
        required: true
        description: Stable source identifier retained for audit.
      consent_basis:
        type: string
        required: true
        description: How these contacts consented; purchased or scraped lists are forbidden.
      list_ids:
        type: array
        required: false
        description: Optional Nitrosend list IDs.
        schema:
          uniqueItems: true
          items: { type: integer, minimum: 1 }
      dry_run:
        type: boolean
        required: false
        default: true
        description: Preview without persisting when true.
      idempotency_key:
        type: string
        required: true
        description: Stable retry key for the import.
      brand_sid:
        type: string
        required: false
        description: Optional public Nitrosend brand SID.
    examples:
      - records: [{ email: person@example.com, first_name: Pat }]
        source_id: webinar-2026-08
        consent_basis: Explicit webinar registration opt-in.
        list_ids: [42]
        dry_run: true
        idempotency_key: webinar-2026-08-inline-1
        brand_sid: brnd_demo123
    result_from: [import]
    steps:
      - id: import
        skill: graph/provider-operation
        runner: act
        inputs:
          approval:
            reason: Import this consented contact batch into Nitrosend.
            type: nitrosend_import_contacts
          operation: import_contacts
          arguments:
            records: "$input.records"
            source_id: "$input.source_id"
            consent_basis: "$input.consent_basis"
            options:
              list_ids: "$input.list_ids"
            dry_run: "$input.dry_run"
            idempotency_key: "$input.idempotency_key"
          brand_sid: "$input.brand_sid"
          idempotency_key: $input.idempotency_key
  import-contacts-csv:
    act:
      purpose: Upload and start one consented CSV contact import without putting file bytes or signed URLs in the agent packet.
    inputs:
      csv_path:
        type: string
        required: true
        description: Absolute local path to the CSV file.
      source_id:
        type: string
        required: true
        description: Stable source identifier retained for audit.
      consent_basis:
        type: string
        required: true
        description: How these contacts consented; purchased or scraped lists are forbidden.
      columns:
        type: object
        required: false
        description: Optional CSV column mapping.
        schema:
          maxProperties: 64
          additionalProperties: { type: string, minLength: 1, maxLength: 128 }
      list_ids:
        type: array
        required: false
        description: Optional Nitrosend list IDs.
        schema:
          uniqueItems: true
          items: { type: integer, minimum: 1 }
      dry_run:
        type: boolean
        required: false
        default: true
        description: Validate file metadata without uploading when true.
      idempotency_key:
        type: string
        required: true
        description: Stable retry key for upload finalization.
      brand_sid:
        type: string
        required: false
        description: Optional public Nitrosend brand SID.
    examples:
      - csv_path: /absolute/path/to/webinar-attendees.csv
        source_id: webinar-2026-08
        consent_basis: Explicit webinar registration opt-in.
        columns: { email: email, first_name: first_name }
        list_ids: [42]
        dry_run: true
        idempotency_key: webinar-2026-08-csv-1
        brand_sid: brnd_demo123
    result_from: [present-preview, present-import]
    steps:
      - id: plan
        inputs:
          csv_path: "$input.csv_path"
          source_id: "$input.source_id"
          consent_basis: "$input.consent_basis"
          columns: "$input.columns"
          list_ids: "$input.list_ids"
          dry_run: "$input.dry_run"
          brand_sid: "$input.brand_sid"
        tool: { module: csv-import.mjs, export: planCsvImport }
        outputs:
          csv_import: object
      - id: preview
        when:
          value: $steps.plan.csv_import.mode
          equals: preview
        operation: nitrosend/contacts.import.preview
        input: $steps.plan.csv_import.input
      - id: import
        when:
          value: $steps.plan.csv_import.mode
          equals: import
        operation: nitrosend/contacts.import
        idempotency_key: "$input.idempotency_key"
        approval:
          reason: Upload and import this consented local CSV.
          type: nitrosend_import_contacts_csv
        input: $steps.plan.csv_import.input
      - id: present-preview
        when:
          value: $steps.plan.csv_import.mode
          equals: preview
        inputs:
          provider_operation: $steps.preview.provider_operation.data
        tool: { module: csv-import.mjs, export: presentCsvImport }
        outputs:
          provider_evidence: object
        artifacts:
          named_emits: { provider_evidence: provider_evidence }
          packets: { provider_evidence: nitrosend.provider_evidence.v1 }
      - id: present-import
        when:
          value: $steps.plan.csv_import.mode
          equals: import
        inputs:
          provider_operation: $steps.import.provider_operation.data
        tool: { module: csv-import.mjs, export: presentCsvImport }
        outputs:
          provider_evidence: object
        artifacts:
          named_emits: { provider_evidence: provider_evidence }
          packets: { provider_evidence: nitrosend.provider_evidence.v1 }
  segment-from-prose:
    inputs:
      segment_brief:
        type: string
        required: true
        description: Free-text segment brief.
      segment_name:
        type: string
        required: false
        description: Preferred segment name, when the caller has one.
      preview_only:
        type: string
        required: false
        description: String boolean. Defaults to true.
      filter_catalog_json:
        type: string
        required: true
        description: JSON filters object from the current nitro://schema resource.
