    inputs:
      target_type:
        type: string
        required: true
        description: Nitrosend creative surface to compose or validate.
        schema: { enum: [campaign, flow, template] }
      composition_mode:
        type: string
        required: true
        description: intent returns a frozen authoring contract; validate checks a host-authored candidate without persistence.
        schema: { enum: [intent, validate] }
      arguments:
        type: object
        required: true
        description: Exact surface-specific intent or validation fields. The runner owns composition_mode and strips persistence-only retry fields from this read.
        schema:
          additionalProperties: true
      brand_sid:
        type: string
        required: false
        description: Optional public Nitrosend brand SID.
    examples:
      - target_type: campaign
        composition_mode: intent
        arguments:
          goal: Announce the August product update to engaged customers.
          name: August product update
          design_mode_override: premium_minimal
          user_instruction: Keep the email concise and use the current brand voice.
        brand_sid: brnd_demo123
      - target_type: flow
        composition_mode: validate
        arguments:
          contract_id: ecc_welcome_fixture
          name: Trial welcome series
          trigger: { event: contact_add }
          steps:
            - type: email
              action_name: flow-step-0
              subject: Welcome
              design:
                sections:
                  - { type: header, props: {} }
                  - { type: footer, props: {} }
        brand_sid: brnd_demo123
      - target_type: template
        composition_mode: validate
        arguments:
          contract_id: ecc_template_fixture
          name: Product update
          subject: A useful update
          sections:
            - { type: header, props: {} }
            - { type: footer, props: {} }
        brand_sid: brnd_demo123
    result_from: [compose]
    steps:
      - id: compose
        skill: graph/provider-operation
        runner: read
        inputs:
          operation: compose_email
          arguments:
            target_type: "$input.target_type"
            composition_mode: "$input.composition_mode"
            arguments: "$input.arguments"
          brand_sid: "$input.brand_sid"
  analytics:
