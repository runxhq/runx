      - segment_brief: Contacts who opened any campaign in the last 30 days.
        segment_name: Engaged 30d
        preview_only: 'true'
        filter_catalog_json: '{"filters":{"opened_within_days":{"type":"integer"}}}'
    steps:
      - id: segment-from-prose
        agent: { role: builder, task: segment-from-prose-plan }
        inputs:
          segment_brief: $input.segment_brief
          segment_name: $input.segment_name
          preview_only: $input.preview_only
          filter_catalog_json: $input.filter_catalog_json
        outputs:
          segment_plan:
            type: object
            schema:
              required: [decision, rationale, unsupported_requirements]
              additionalProperties: false
              properties:
                decision: { type: string, enum: [ready, needs_input, reject] }
                rationale: { type: string }
                unsupported_requirements: { type: array, items: { type: string } }
                rejection_reason: { type: string }
                segment_request:
                  type: object
                  required: [name, preview_only, filters]
                  additionalProperties: false
                  properties:
                    name: { type: string, minLength: 1 }
                    preview_only: { type: boolean }
                    filters:
                      type: array
                      items:
                        type: object
                        required: [name, predicate, value]
                        additionalProperties: false
                        properties:
                          name: { type: string, minLength: 1 }
                          predicate: { type: string, minLength: 1 }
                          value: { type: [string, number, boolean] }
        artifacts:
          wrap_as: segment_from_prose_packet
          packet: nitrosend.segment_from_prose.v1
