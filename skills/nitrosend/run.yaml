skill: nitrosend
version: "0.4.11"
catalog:
  kind: skill
  audience: public
  visibility: public
  role: branded
  canonical_skill: runx/send-as
  provider: nitrosend
  runtime_path: mcp
  execution: execute
  completion: provider_readback
  requires_adapter: true
  approval: conditional
  category: growth
connectors:
  nitrosend:
    operations: [content.review, contacts.import.preview, contacts.import]
runners:
  billing-status:
    inputs: {}
    examples:
      - {}
    result_from: [present]
    steps:
      - id: status
        skill: graph/provider-operation
        runner: read
        inputs:
          operation: billing_status
          arguments: {}
      - id: plans
        skill: graph/provider-operation
        runner: read
        inputs:
          operation: billing_plans
          arguments: {}
      - id: present
        inputs:
          status_evidence: $steps.status.provider_evidence.data
          plans_evidence: $steps.plans.provider_evidence.data
        tool: { module: graph/provider-operation/nitrosend-operation.mjs, export: presentEvidence }
        outputs:
          status_evidence: object
          plans_evidence: object
        artifacts:
          named_emits:
            status_evidence: status_evidence
            plans_evidence: plans_evidence
          packets:
            status_evidence: nitrosend.provider_evidence.v1
            plans_evidence: nitrosend.provider_evidence.v1
  plan-checkout:
    act:
      purpose: Create one operator-approved Nitrosend hosted plan checkout or confirmed in-place plan change.
    inputs:
      plan_id:
        type: integer
        required: true
        description: Positive plan ID returned by the current billing-status catalog.
        schema: { minimum: 1 }
      idempotency_key:
        type: string
        required: true
        description: Stable retry identity for this exact account and selected plan.
        schema: { minLength: 1, maxLength: 128 }
    examples:
      - plan_id: 202
        idempotency_key: account-1-plan-202-v1
    result_from: [present]
    steps:
      - id: status
        skill: graph/provider-operation
        runner: read
        inputs:
          operation: billing_status
          arguments: {}
      - id: plans
        skill: graph/provider-operation
        runner: read
        inputs:
          operation: billing_plans
          arguments: {}
      - id: checkout
        skill: graph/provider-operation
        runner: act
        inputs:
          approval:
            reason: Create the Nitrosend hosted checkout or confirmed plan change for this exact selected plan.
            type: nitrosend_plan_checkout
          operation: plan_checkout
          arguments:
            plan_id: "$input.plan_id"
            confirm: true
            idempotency_key: "$input.idempotency_key"
          idempotency_key: "$input.idempotency_key"
      - id: readback
        skill: graph/provider-operation
        runner: read
        inputs:
          operation: billing_status
          arguments: {}
      - id: present
        inputs:
          checkout_evidence: $steps.checkout.provider_evidence.data
          status_evidence: $steps.readback.provider_evidence.data
          plan_id: $input.plan_id
          idempotency_key: $input.idempotency_key
        tool: { module: graph/provider-operation/nitrosend-operation.mjs, export: presentEvidence }
        outputs:
          checkout_evidence: object
          status_evidence: object
        artifacts:
          named_emits:
            checkout_evidence: checkout_evidence
            status_evidence: status_evidence
          packets:
            checkout_evidence: nitrosend.provider_evidence.v1
            status_evidence: nitrosend.provider_evidence.v1
    policy:
      guards:
        - step: checkout
          value: $steps.status.provider_evidence.data.decision
          equals: ok
        - step: checkout
          value: $steps.plans.provider_evidence.data.decision
          equals: ok
        - step: readback
          value: $steps.checkout.provider_evidence.data.decision
          equals: ok
  plan-checkout-status:
    inputs:
      purchase_id:
        type: integer
        required: true
        description: Positive local plan-purchase ID returned by plan-checkout.
        schema: { minimum: 1 }
    examples:
      - purchase_id: 701
    result_from: [present]
    steps:
      - id: status
        skill: graph/provider-operation
        runner: read
        inputs:
          operation: plan_checkout_status
          purchase_id: "$input.purchase_id"
      - id: present
        inputs:
          purchase_evidence: $steps.status.provider_evidence.data
          purchase_id: $input.purchase_id
        tool: { module: graph/provider-operation/nitrosend-operation.mjs, export: presentEvidence }
        outputs:
          purchase_evidence: object
        artifacts:
          named_emits:
            purchase_evidence: purchase_evidence
          packets:
            purchase_evidence: nitrosend.provider_evidence.v1
  status:
    default: true
    inputs:
      brand_sid:
        type: string
        required: false
        description: Optional public Nitrosend brand SID.
    examples:
      - brand_sid: brnd_demo123
    result_from: [status]
    steps:
      - id: status
        skill: graph/provider-operation
        runner: read
        inputs:
          operation: status
          arguments: {}
          brand_sid: "$input.brand_sid"
  query:
    inputs:
      entity:
        type: string
        required: true
        description: Exact Nitrosend entity collection to read.
        schema:
          enum: [flows, campaigns, templates, segments, contacts, lists, events, imports, messages, suppressions, history, products]
      filters:
        type: object
        required: false
        description: Entity-specific allowlisted filters; unsupported fields are refused before transport.
        schema:
          maxProperties: 10
          additionalProperties: true
      page:
        type: integer
        required: false
        default: 1
        description: Positive result page.
        schema: { minimum: 1 }
      per:
        type: integer
        required: false
        default: 25
        description: Results per page, from 1 to 50.
        schema: { minimum: 1, maximum: 50 }
      brand_sid:
        type: string
        required: true
        description: Public Nitrosend brand SID; account-default selection is forbidden.
    examples:
      - entity: flows
        filters: { status: draft }
        page: 1
        per: 25
        brand_sid: brnd_demo123
    result_from: [query]
    steps:
      - id: query
        skill: graph/provider-operation
        runner: read
        inputs:
          operation: query
          arguments:
            entity: "$input.entity"
            filters: "$input.filters"
            page: "$input.page"
            per: "$input.per"
          brand_sid: "$input.brand_sid"
  inbox:
    inputs:
      command:
        type: string
        required: true
        description: Read-only mailbox operation.
        schema: { enum: [list_mailbox, get_thread, get_thread_page, get_message_body] }
      arguments:
        type: object
        required: false
        description: Command-specific bounded identifiers, filters, pagination, or body offset.
        schema:
          maxProperties: 8
          additionalProperties: true
      brand_sid:
        type: string
        required: true
        description: Public Nitrosend brand SID; account-default selection is forbidden.
    examples:
      - command: list_mailbox
        arguments: { query: 'MailSchema Content Review', view: full, page: 1, per: 25 }
        brand_sid: brnd_demo123
    result_from: [inbox]
    steps:
      - id: inbox
        skill: graph/provider-operation
        runner: read
        inputs:
          operation: inbox
          arguments:
            command: "$input.command"
            arguments: "$input.arguments"
          brand_sid: "$input.brand_sid"
  assistant_scan:
    inputs:
      config: { type: object, required: true, description: Bounded mail source configuration. }
      cursor: { type: string, required: false, description: Opaque source cursor. }
      page_limit: { type: integer, required: true, description: Maximum mailbox rows, schema: { minimum: 1, maximum: 20 } }
    result_from: [finish]
    steps:
      - id: prepare
        inputs:
          config: "$input.config"
          cursor: "$input.cursor"
          page_limit: "$input.page_limit"
        tool: { module: assistant-source.mjs, export: prepareAssistantScan }
        outputs: { scan_request: object }
      - id: scan
        skill: graph/provider-operation
        runner: read
        inputs:
          operation: inbox
          arguments: $steps.prepare.scan_request.arguments
          brand_sid: $steps.prepare.scan_request.brand_sid
      - id: finish
        inputs:
          page_limit: $input.page_limit
          cursor: $input.cursor
          provider_evidence: $steps.scan.provider_evidence.data
        tool: { module: assistant-source.mjs, export: finishAssistantScan }
        outputs: { assistant_page: object }
        artifacts:
          named_emits: { assistant_page: assistant_page }
          packets: { assistant_page: runx.conversation_page.v1 }
  assistant_observe:
    inputs:
      config: { type: object, required: true, description: Bound mail source configuration. }
      item: { type: object, required: true, description: One mailbox row from assistant_scan. }
    result_from: [finish]
    steps:
      - id: prepare
        inputs: { config: "$input.config", item: "$input.item" }
        tool: { module: assistant-source.mjs, export: prepareAssistantObserve }
        outputs: { observe_request: object }
      - id: thread
        skill: graph/provider-operation
        runner: read
        inputs:
          operation: inbox
          arguments: $steps.prepare.observe_request.arguments
          brand_sid: $steps.prepare.observe_request.brand_sid
      - id: finish
        inputs:
          config: $input.config
          item: $input.item
          provider_evidence: $steps.thread.provider_evidence.data
        tool: { module: assistant-source.mjs, export: finishAssistantObserve }
        outputs: { assistant_observation: object }
        artifacts:
          named_emits: { assistant_observation: assistant_observation }
          packets: { assistant_observation: runx.conversation_observation.v1 }
  assistant_hydrate:
    inputs:
      config: { type: object, required: true, description: Bound mail source configuration. }
      source_ref: { type: string, required: true, description: Admitted message locator. }
      source_digest: { type: string, required: true, description: Admitted occurrence digest. }
      thread_locator: { type: string, required: true, description: Admitted conversation locator. }
      action: { type: object, required: true, description: Canonical open operator action. }
      cursor: { type: string, required: false, description: Continuation cursor; mail hydration has one bounded page. }
    result_from: [finish]
    steps:
      - id: prepare
        inputs:
          config: "$input.config"
          source_ref: "$input.source_ref"
          thread_locator: "$input.thread_locator"
          cursor: "$input.cursor"
        tool: { module: assistant-source.mjs, export: prepareAssistantHydrate }
        outputs: { hydrate_request: object }
      - id: thread
        skill: graph/provider-operation
        runner: read
        inputs:
          operation: inbox
          arguments: $steps.prepare.hydrate_request.arguments
          brand_sid: $steps.prepare.hydrate_request.brand_sid
      - id: finish
        inputs:
          config: "$input.config"
          source_ref: "$input.source_ref"
          source_digest: "$input.source_digest"
          thread_locator: "$input.thread_locator"
          action: "$input.action"
          provider_evidence: $steps.thread.provider_evidence.data
        tool: { module: assistant-source.mjs, export: finishAssistantHydrate }
        outputs: { assistant_context: object }
        artifacts:
          named_emits: { assistant_context: assistant_context }
          packets: { assistant_context: runx.source_packet.v1 }
  configure-sender:
    act:
      purpose: Replace one explicitly selected Nitrosend brand's exact sender defaults.
    inputs:
      brand_sid:
        type: string
        required: true
        description: Public Nitrosend brand SID; account-default selection is forbidden.
      from_name:
        type: string
        required: true
        description: Exact sender display name.
      from_email:
        type: string
        required: true
        description: Exact sender address on a verified domain.
      reply_to:
        type: string
        required: true
        description: Exact reply-to address.
      test_email_recipients:
        type: array
        required: true
        description: Exact saved test-recipient array, empty to clear, maximum five.
        schema:
          maxItems: 5
          uniqueItems: true
          items: { type: string, format: email }
      idempotency_key:
        type: string
        required: true
        description: Stable retry identity for this exact brand and sender configuration.
    examples:
      - brand_sid: brnd_demo123
        from_name: Example Team
        from_email: hello@example.com
        reply_to: support@example.com
        test_email_recipients: [owner@example.com]
        idempotency_key: sender-brnd_demo123-20260803
    result_from: [readback, verify]
    steps:
      - id: current
        skill: graph/provider-operation
        runner: read
        inputs:
          operation: sender_settings
          arguments: {}
          brand_sid: "$input.brand_sid"
      - id: verify-current-brand
        tool: data.compare
        inputs:
          expected: "$input.brand_sid"
          actual: $steps.current.provider_evidence.data.result.sender_settings.brand_sid
      - id: apply
        skill: graph/provider-operation
        runner: act
        inputs:
          approval:
            reason: Replace the selected Nitrosend brand's sender defaults with these exact values.
            type: nitrosend_configure_sender
          operation: configure_sender
          arguments:
            from_name: "$input.from_name"
            from_email: "$input.from_email"
            reply_to: "$input.reply_to"
            test_email_recipients: "$input.test_email_recipients"
          brand_sid: "$input.brand_sid"
          idempotency_key: $input.idempotency_key
      - id: readback
        skill: graph/provider-operation
        runner: read
        inputs:
          operation: sender_settings
          arguments: {}
          brand_sid: "$input.brand_sid"
      - id: verify
        tool: data.compare
        inputs:
          expected:
            brand_sid: "$input.brand_sid"
            from_name: "$input.from_name"
            from_email: "$input.from_email"
            reply_to: "$input.reply_to"
            test_email_recipients: "$input.test_email_recipients"
          actual: $steps.readback.provider_evidence.data.result.sender_settings
    policy:
      guards:
        - step: apply
          value: $steps.verify-current-brand.comparison.data.equal
          equals: true
        - step: readback
          value: $steps.apply.provider_evidence.data.decision
          equals: ok
        - step: verify
          value: $steps.readback.provider_evidence.data.decision
          equals: ok
  review-delivery:
    inputs:
      target_type:
        type: string
        required: true
        description: template, flow, or campaign.
        schema: { enum: [template, flow, campaign] }
      target_id:
        type: number
        required: true
        description: Nitrosend entity ID.
      revision_id:
        type: number
        required: false
        description: Required for flows; exact immutable flow revision to review.
      brand_sid:
        type: string
        required: false
        description: Optional public Nitrosend brand SID.
    examples:
      - target_type: campaign
        target_id: 42
        brand_sid: brnd_demo123
    result_from: [review]
    steps:
      - id: review
        skill: graph/provider-operation
        runner: read
        inputs:
          operation: review_delivery
          arguments:
            target_type: "$input.target_type"
            target_id: "$input.target_id"
            revision_id: "$input.revision_id"
          brand_sid: "$input.brand_sid"
  send-test-message:
    act:
      purpose: Send or dry-run one reviewed test message to one to five explicit recipients without approving or activating the target.
    inputs:
      target_type:
        type: string
        required: true
        description: Exact template, flow, or campaign target.
        schema: { enum: [template, flow, campaign] }
      target_id:
        type: integer
        required: true
        description: Exact Nitrosend target ID.
        schema: { minimum: 1 }
      revision_id:
        type: integer
        required: false
        description: Required for flows; exact immutable flow revision to review and test.
        schema: { minimum: 1 }
      action_id:
        type: integer
        required: false
        description: Exact flow action to test when the revision has multiple message steps.
        schema: { minimum: 1 }
      template_id:
        type: integer
        required: false
        description: Exact target-owned template to test when a target has multiple templates.
        schema: { minimum: 1 }
      channel:
        type: string
        required: false
        default: auto
        description: auto, email, or sms.
        schema: { enum: [auto, email, sms] }
      to:
        type: array
        required: true
        description: One to five exact email addresses or E.164 phone numbers; saved account defaults are never inferred.
        schema:
          minItems: 1
          maxItems: 5
          items: { type: string, minLength: 1 }
      data:
        type: object
        required: false
        description: Sample values for required data merge fields.
        schema:
          additionalProperties: true
      dry_run:
        type: boolean
        required: false
        default: true
        description: Validate the exact target and recipients without dispatch when true.
      idempotency_key:
        type: string
        required: false
        description: Stable retry identity; mandatory for a live test send.
        schema: { minLength: 1, maxLength: 128, pattern: '\S' }
      brand_sid:
        type: string
        required: true
        description: Public Nitrosend brand SID; account-default selection is forbidden.
    examples:
      - target_type: flow
        target_id: 42
        revision_id: 3
        action_id: 7
        channel: email
        to: [operator@example.com]
        data: { review_url: 'https://example.com/reviews/42' }
        dry_run: true
        brand_sid: brnd_demo123
    result_from: [send]
    steps:
      - id: review
        skill: graph/provider-operation
        runner: read
        inputs:
          operation: review_delivery
          arguments:
            target_type: "$input.target_type"
            target_id: "$input.target_id"
            revision_id: "$input.revision_id"
          brand_sid: "$input.brand_sid"
      - id: send
        skill: graph/provider-operation
        runner: act
        inputs:
          approval:
            reason: Send this exact reviewed test message to the named recipients.
            type: nitrosend_send_test_message
          operation: send_test_message
          arguments:
            target_type: "$input.target_type"
            target_id: "$input.target_id"
            revision_id: "$input.revision_id"
            action_id: "$input.action_id"
            template_id: "$input.template_id"
            channel: "$input.channel"
            to: "$input.to"
            data: "$input.data"
            dry_run: "$input.dry_run"
            idempotency_key: "$input.idempotency_key"
          brand_sid: "$input.brand_sid"
          idempotency_key: $input.idempotency_key
    policy:
      guards:
        - step: send
          value: $steps.review.provider_evidence.data.decision
          equals: ok
  review-content:
    inputs:
      subject:
        type: string
        required: true
        description: Exact email subject; empty is allowed, maximum 998 UTF-8 bytes.
        schema: { maxLength: 998 }
      html:
        type: string
        required: true
        description: Exact rendered email HTML for a self-contained read-only review.
        schema: { minLength: 1, maxLength: 262144 }
    examples:
      - subject: A useful product update
        html: "<h1>Product update</h1><p>What changed and why it matters.</p>"
    result_from: [project]
    steps:
      - id: digest-html
        tool: data.digest
        inputs:
          value: "$input.html"
          encoding: utf8_text
      - id: review
        operation: nitrosend/content.review
        result_fields: [subject, html_size_bytes, html_digest, text_preview, text_length, accessibility, spam_score, warnings]
        input:
          subject: "$input.subject"
          html: "$input.html"
      - id: project
        inputs:
          subject: "$input.subject"
          html: "$input.html"
          expected_html_digest: $steps.digest-html.digest_result.data.digest
          provider_result: $steps.review.provider_operation.data.result
        tool: { module: review-content.mjs, export: projectContentReview }
        outputs:
          subject: string
          html_size_bytes: number
          html_digest: string
          text_preview: string
          text_length: number
          accessibility: object
          spam_score: object
          warnings: array
  import-status:
    inputs:
      import_id:
        type: number
        required: true
        description: Nitrosend import ID returned by import-contacts or import-contacts-csv.
      brand_sid:
        type: string
        required: false
        description: Optional public Nitrosend brand SID.
    examples:
      - import_id: 42
        brand_sid: brnd_demo123
    result_from: [status]
    steps:
      - id: status
        skill: graph/provider-operation
        runner: read
        inputs:
          operation: import_status
          arguments:
            import_id: "$input.import_id"
          brand_sid: "$input.brand_sid"
  approve-delivery:
    act:
      purpose: Approve one reviewed Nitrosend campaign or flow without sending it.
    inputs:
      target_type:
        type: string
        required: true
        description: flow or campaign.
        schema: { enum: [flow, campaign] }
      target_id:
        type: number
        required: true
        description: Nitrosend entity ID.
      revision_id:
        type: number
        required: false
        description: Required for flows; exact current draft revision to review and approve.
      brand_sid:
        type: string
        required: false
        description: Optional public Nitrosend brand SID.
    examples:
      - target_type: flow
        target_id: 42
        revision_id: 3
        brand_sid: brnd_demo123
    result_from: [apply]
    steps:
      - id: review
        skill: graph/provider-operation
        runner: read
        inputs:
          operation: review_delivery
          arguments:
            target_type: "$input.target_type"
            target_id: "$input.target_id"
            revision_id: "$input.revision_id"
          brand_sid: "$input.brand_sid"
      - id: apply
        skill: graph/provider-operation
        runner: act
        inputs:
          approval:
            reason: Approve this reviewed delivery configuration. This does not send or activate it.
            type: nitrosend_approve_delivery
          operation: control_delivery
          arguments:
            target_type: "$input.target_type"
            target_id: "$input.target_id"
            operation: approve
            revision_id: "$input.revision_id"
          brand_sid: "$input.brand_sid"
  send-campaign:
    act:
      purpose: Deliver one already-approved Nitrosend campaign after fresh review and explicit approval.
    inputs:
      campaign_id:
        type: number
        required: true
        description: Approved Nitrosend campaign ID.
      operation:
        type: string
        required: true
        description: live or schedule.
        schema: { enum: [live, schedule] }
      scheduled_at:
        type: string
        required: false
        description: ISO 8601 time required for schedule.
      confirm_send_to_all:
        type: boolean
        required: false
        default: false
        description: Explicit confirmation for an all-contacts audience.
      idempotency_key:
        type: string
        required: true
        description: Stable retry key for this campaign delivery.
      brand_sid:
        type: string
        required: false
        description: Optional public Nitrosend brand SID.
    examples:
      - campaign_id: 42
        operation: schedule
        scheduled_at: '2026-08-04T09:00:00Z'
        confirm_send_to_all: false
        idempotency_key: campaign-campaign-001
        brand_sid: brnd_demo123
    result_from: [deliver]
    steps:
      - id: review
        skill: graph/provider-operation
        runner: read
        inputs:
          operation: review_delivery
          arguments:
            target_type: campaign
            target_id: "$input.campaign_id"
          brand_sid: "$input.brand_sid"
      - id: deliver
        skill: graph/provider-operation
        runner: act
        inputs:
          approval:
            reason: Deliver this reviewed campaign to its configured live audience.
            type: nitrosend_send_campaign
          operation: control_delivery
          arguments:
            target_type: campaign
            target_id: "$input.campaign_id"
            operation: "$input.operation"
            scheduled_at: "$input.scheduled_at"
            confirm_send_to_all: "$input.confirm_send_to_all"
            idempotency_key: "$input.idempotency_key"
          brand_sid: "$input.brand_sid"
          idempotency_key: $input.idempotency_key
    policy:
      guards:
        - step: deliver
          value: $steps.review.provider_evidence.data.decision
          equals: ok
  activate-flow:
    act:
      purpose: Activate one already-approved Nitrosend flow after fresh review and explicit approval.
    inputs:
      flow_id:
        type: number
        required: true
        description: Approved Nitrosend flow ID.
      revision_id:
        type: number
        required: true
        description: Exact approved flow draft revision to review and publish.
      brand_sid:
        type: string
        required: false
        description: Optional public Nitrosend brand SID.
    examples:
      - flow_id: 42
        revision_id: 3
        brand_sid: brnd_demo123
    result_from: [activate]
    steps:
      - id: review
        skill: graph/provider-operation
        runner: read
        inputs:
          operation: review_delivery
          arguments:
            target_type: flow
            target_id: "$input.flow_id"
            revision_id: "$input.revision_id"
          brand_sid: "$input.brand_sid"
      - id: activate
        skill: graph/provider-operation
        runner: act
        inputs:
          approval:
            reason: Activate this reviewed automation flow for live contacts.
            type: nitrosend_activate_flow
          operation: control_delivery
          arguments:
            target_type: flow
            target_id: "$input.flow_id"
            operation: live
            revision_id: "$input.revision_id"
          brand_sid: "$input.brand_sid"
    policy:
      guards:
        - step: activate
          value: $steps.review.provider_evidence.data.decision
          equals: ok
  apply-draft:
    act:
      purpose: Apply one reviewed Nitrosend campaign, flow, template, segment, or remote image ingest request.
    inputs:
      operation:
        type: string
        required: true
        description: compose_campaign, compose_flow, manage_template, define_segment, or ingest_image.
        schema: { enum: [compose_campaign, compose_flow, manage_template, define_segment, ingest_image] }
      arguments:
        type: object
        required: true
        description: Exact arguments produced by the matching planning runner and current Nitrosend schema.
        schema:
          additionalProperties: true
      brand_sid:
        type: string
        required: false
        description: Optional public Nitrosend brand SID.
    examples:
      - operation: define_segment
        arguments:
          name: Active customers
          filters: { all: [{ field: status, operator: eq, value: active }] }
        brand_sid: brnd_demo123
    result_from: [apply, blocked]
    steps:
      - id: preflight
        inputs:
          mode: act
          operation: "$input.operation"
          arguments: "$input.arguments"
          brand_sid: "$input.brand_sid"
        tool: { module: graph/provider-operation/nitrosend-operation.mjs, export: prepareOperation }
        outputs:
          operation_plan: object
      - id: blocked
        when:
          value: $steps.preflight.operation_plan.decision
          not_equals: ready
        inputs:
          operation_plan: $steps.preflight.operation_plan
        tool: { module: graph/provider-operation/nitrosend-operation.mjs, export: blockedOperation }
        outputs:
          provider_evidence: object
        artifacts:
          named_emits:
            provider_evidence: provider_evidence
          packets:
            provider_evidence: nitrosend.provider_evidence.v1
      - id: apply
        when:
          value: $steps.preflight.operation_plan.decision
          equals: ready
        skill: graph/provider-operation
        runner: act
        inputs:
          approval:
            reason: Apply this reviewed draft or image ingest to the live Nitrosend account. This does not deliver to recipients or activate a flow.
            type: nitrosend_apply_draft
          operation: "$input.operation"
          arguments: "$input.arguments"
          idempotency_key: "$input.arguments.idempotency_key"
          brand_sid: "$input.brand_sid"
  plan-campaign:
