skill: nitrosend
version: "0.4.8"
catalog:
  kind: skill
  audience: public
  visibility: public
  role: branded
  canonical_skill: runx/send-as
  provider: nitrosend
  runtime_path: mcp
  execution: execute
  completion: provider_readback
  requires_adapter: true
  approval: conditional
credentials:
  nitrosend:
    provider: nitrosend
    audience: https://api.nitrosend.com
    auth:
      api_key:
        delivery:
          env: NITROSEND_API_KEY
runners:
  billing-status:
    type: graph
    credential: nitrosend
    inputs: {}
    examples:
      - {}
    graph:
      name: nitrosend-billing-status
      result_from: [present]
      steps:
        - id: status
          skill: graph/provider-operation
          runner: read
          inputs:
            operation: billing_status
            arguments: {}
        - id: plans
          skill: graph/provider-operation
          runner: read
          inputs:
            operation: billing_plans
            arguments: {}
        - id: present
          context:
            status_evidence: status.provider_evidence.data
            plans_evidence: plans.provider_evidence.data
          run:
            type: javascript
            module: graph/provider-operation/nitrosend-operation.mjs
            export: presentEvidence
            outputs:
              status_evidence: object
              plans_evidence: object
          artifacts:
            named_emits:
              status_evidence: status_evidence
              plans_evidence: plans_evidence
            packets:
              status_evidence: nitrosend.provider_evidence.v1
              plans_evidence: nitrosend.provider_evidence.v1
  plan-checkout:
    type: graph
    credential: nitrosend
    act:
      purpose: Create one operator-approved Nitrosend hosted plan checkout or confirmed in-place plan change.
    inputs:
      plan_id:
        type: integer
        required: true
        description: Positive plan ID returned by the current billing-status catalog.
        schema: { minimum: 1 }
      idempotency_key:
        type: string
        required: true
        description: Stable retry identity for this exact account and selected plan.
        schema: { minLength: 1, maxLength: 128 }
    examples:
      - plan_id: 202
        idempotency_key: account-1-plan-202-v1
    graph:
      name: nitrosend-plan-checkout
      result_from: [present]
      steps:
        - id: status
          skill: graph/provider-operation
          runner: read
          inputs:
            operation: billing_status
            arguments: {}
        - id: plans
          skill: graph/provider-operation
          runner: read
          inputs:
            operation: billing_plans
            arguments: {}
        - id: approve
          run:
            type: approval
          inputs:
            gate_id: nitrosend.plan_checkout.approval
            reason: Create the Nitrosend hosted checkout or confirmed plan change for this exact selected plan.
          context:
            billing_status: status.provider_evidence.data
            eligible_plans: plans.provider_evidence.data
        - id: checkout
          skill: graph/provider-operation
          runner: act
          idempotency_key: "$input.idempotency_key"
          inputs:
            operation: plan_checkout
            arguments:
              plan_id: "$input.plan_id"
              confirm: true
              idempotency_key: "$input.idempotency_key"
            idempotency_key: "$input.idempotency_key"
        - id: readback
          skill: graph/provider-operation
          runner: read
          inputs:
            operation: billing_status
            arguments: {}
        - id: present
          context:
            checkout_evidence: checkout.provider_evidence.data
            status_evidence: readback.provider_evidence.data
          run:
            type: javascript
            module: graph/provider-operation/nitrosend-operation.mjs
            export: presentEvidence
            outputs:
              checkout_evidence: object
              status_evidence: object
          artifacts:
            named_emits:
              checkout_evidence: checkout_evidence
              status_evidence: status_evidence
            packets:
              checkout_evidence: nitrosend.provider_evidence.v1
              status_evidence: nitrosend.provider_evidence.v1
    policy:
      guards:
        - step: approve
          field: status.provider_evidence.data.decision
          equals: ok
        - step: approve
          field: plans.provider_evidence.data.decision
          equals: ok
        - step: checkout
          field: approve.approval_decision.data.approved
          equals: true
        - step: readback
          field: checkout.provider_evidence.data.decision
          equals: ok
  plan-checkout-status:
    type: graph
    credential: nitrosend
    inputs:
      purchase_id:
        type: integer
        required: true
        description: Positive local plan-purchase ID returned by plan-checkout.
        schema: { minimum: 1 }
    examples:
      - purchase_id: 701
    graph:
      name: nitrosend-plan-checkout-status
      result_from: [present]
      steps:
        - id: status
          skill: graph/provider-operation
          runner: read
          inputs:
            operation: plan_checkout_status
            purchase_id: "$input.purchase_id"
        - id: present
          context:
            purchase_evidence: status.provider_evidence.data
          run:
            type: javascript
            module: graph/provider-operation/nitrosend-operation.mjs
            export: presentEvidence
            outputs:
              purchase_evidence: object
          artifacts:
            named_emits:
              purchase_evidence: purchase_evidence
            packets:
              purchase_evidence: nitrosend.provider_evidence.v1
  status:
    default: true
    type: graph
    credential: nitrosend
    inputs:
      brand_sid:
        type: string
        required: false
        description: Optional public Nitrosend brand SID.
    examples:
      - brand_sid: brnd_demo123
    graph:
      name: nitrosend-status
      result_from: [status]
      steps:
        - id: status
          skill: graph/provider-operation
          runner: read
          inputs:
            operation: status
            arguments: {}
            brand_sid: "$input.brand_sid"
  query:
    type: graph
    credential: nitrosend
    inputs:
      entity:
        type: string
        required: true
        description: Exact Nitrosend entity collection to read.
        schema:
          enum: [flows, campaigns, templates, segments, contacts, lists, events, imports, messages, suppressions, history, products]
      filters:
        type: object
        required: false
        description: Entity-specific allowlisted filters; unsupported fields are refused before transport.
        schema:
          maxProperties: 10
          additionalProperties: true
      page:
        type: integer
        required: false
        default: 1
        description: Positive result page.
        schema: { minimum: 1 }
      per:
        type: integer
        required: false
        default: 25
        description: Results per page, from 1 to 50.
        schema: { minimum: 1, maximum: 50 }
      brand_sid:
        type: string
        required: true
        description: Public Nitrosend brand SID; account-default selection is forbidden.
    examples:
      - entity: flows
        filters: { status: draft }
        page: 1
        per: 25
        brand_sid: brnd_demo123
    graph:
      name: nitrosend-query
      result_from: [query]
      steps:
        - id: query
          skill: graph/provider-operation
          runner: read
          inputs:
            operation: query
            arguments:
              entity: "$input.entity"
              filters: "$input.filters"
              page: "$input.page"
              per: "$input.per"
            brand_sid: "$input.brand_sid"
  inbox:
    type: graph
    credential: nitrosend
    inputs:
      command:
        type: string
        required: true
        description: Read-only mailbox operation.
        schema: { enum: [list_mailbox, get_thread, get_thread_page, get_message_body] }
      arguments:
        type: object
        required: false
        description: Command-specific bounded identifiers, filters, pagination, or body offset.
        schema:
          maxProperties: 8
          additionalProperties: true
      brand_sid:
        type: string
        required: true
        description: Public Nitrosend brand SID; account-default selection is forbidden.
    examples:
      - command: list_mailbox
        arguments: { query: 'MailSchema Content Review', view: full, page: 1, per: 25 }
        brand_sid: brnd_demo123
    graph:
      name: nitrosend-inbox
      result_from: [inbox]
      steps:
        - id: inbox
          skill: graph/provider-operation
          runner: read
          inputs:
            operation: inbox
            arguments:
              command: "$input.command"
              arguments: "$input.arguments"
            brand_sid: "$input.brand_sid"
  configure-sender:
    type: graph
    credential: nitrosend
    act:
      purpose: Replace one explicitly selected Nitrosend brand's exact sender defaults.
    inputs:
      brand_sid:
        type: string
        required: true
        description: Public Nitrosend brand SID; account-default selection is forbidden.
      from_name:
        type: string
        required: true
        description: Exact sender display name.
      from_email:
        type: string
        required: true
        description: Exact sender address on a verified domain.
      reply_to:
        type: string
        required: true
        description: Exact reply-to address.
      test_email_recipients:
        type: array
        required: true
        description: Exact saved test-recipient array, empty to clear, maximum five.
        schema:
          maxItems: 5
          uniqueItems: true
          items: { type: string, format: email }
      idempotency_key:
        type: string
        required: true
        description: Stable retry identity for this exact brand and sender configuration.
    examples:
      - brand_sid: brnd_demo123
        from_name: Example Team
        from_email: hello@example.com
        reply_to: support@example.com
        test_email_recipients: [owner@example.com]
        idempotency_key: sender-brnd_demo123-20260803
    graph:
      name: nitrosend-configure-sender
      result_from: [readback, verify]
      steps:
        - id: current
          skill: graph/provider-operation
          runner: read
          inputs:
            operation: sender_settings
            arguments: {}
            brand_sid: "$input.brand_sid"
        - id: verify-current-brand
          tool: data.compare
          inputs:
            expected: "$input.brand_sid"
          context:
            actual: current.provider_evidence.data.result.sender_settings.brand_sid
        - id: approve
          when:
            field: verify-current-brand.comparison.data.equal
            equals: true
          run:
            type: approval
          inputs:
            gate_id: nitrosend.configure_sender.approval
            reason: Replace the selected Nitrosend brand's sender defaults with these exact values.
          context:
            current: current.provider_evidence.data
        - id: apply
          skill: graph/provider-operation
          runner: act
          idempotency_key: $input.idempotency_key
          inputs:
            operation: configure_sender
            arguments:
              from_name: "$input.from_name"
              from_email: "$input.from_email"
              reply_to: "$input.reply_to"
              test_email_recipients: "$input.test_email_recipients"
            brand_sid: "$input.brand_sid"
        - id: readback
          skill: graph/provider-operation
          runner: read
          inputs:
            operation: sender_settings
            arguments: {}
            brand_sid: "$input.brand_sid"
        - id: verify
          tool: data.compare
          inputs:
            expected:
              brand_sid: "$input.brand_sid"
              from_name: "$input.from_name"
              from_email: "$input.from_email"
              reply_to: "$input.reply_to"
              test_email_recipients: "$input.test_email_recipients"
          context:
            actual: readback.provider_evidence.data.result.sender_settings
    policy:
      guards:
        - step: apply
          field: approve.approval_decision.data.approved
          equals: true
        - step: apply
          field: verify-current-brand.comparison.data.equal
          equals: true
        - step: readback
          field: apply.provider_evidence.data.decision
          equals: ok
        - step: verify
          field: readback.provider_evidence.data.decision
          equals: ok
  review-delivery:
    type: graph
    credential: nitrosend
    inputs:
      target_type:
        type: string
        required: true
        description: template, flow, or campaign.
        schema: { enum: [template, flow, campaign] }
      target_id:
        type: number
        required: true
        description: Nitrosend entity ID.
      revision_id:
        type: number
        required: false
        description: Required for flows; exact immutable flow revision to review.
      brand_sid:
        type: string
        required: false
        description: Optional public Nitrosend brand SID.
    examples:
      - target_type: campaign
        target_id: 42
        brand_sid: brnd_demo123
    graph:
      name: nitrosend-review-delivery
      result_from: [review]
      steps:
        - id: review
          skill: graph/provider-operation
          runner: read
          inputs:
            operation: review_delivery
            arguments:
              target_type: "$input.target_type"
              target_id: "$input.target_id"
              revision_id: "$input.revision_id"
            brand_sid: "$input.brand_sid"
  send-test-message:
    type: graph
    credential: nitrosend
    act:
      purpose: Send or dry-run one reviewed test message to one to five explicit recipients without approving or activating the target.
    inputs:
      target_type:
        type: string
        required: true
        description: Exact template, flow, or campaign target.
        schema: { enum: [template, flow, campaign] }
      target_id:
        type: integer
        required: true
        description: Exact Nitrosend target ID.
        schema: { minimum: 1 }
      revision_id:
        type: integer
        required: false
        description: Required for flows; exact immutable flow revision to review and test.
        schema: { minimum: 1 }
      action_id:
        type: integer
        required: false
        description: Exact flow action to test when the revision has multiple message steps.
        schema: { minimum: 1 }
      template_id:
        type: integer
        required: false
        description: Exact target-owned template to test when a target has multiple templates.
        schema: { minimum: 1 }
      channel:
        type: string
        required: false
        default: auto
        description: auto, email, or sms.
        schema: { enum: [auto, email, sms] }
      to:
        type: array
        required: true
        description: One to five exact email addresses or E.164 phone numbers; saved account defaults are never inferred.
        schema:
          minItems: 1
          maxItems: 5
          items: { type: string, minLength: 1 }
      data:
        type: object
        required: false
        description: Sample values for required data merge fields.
        schema:
          additionalProperties: true
      dry_run:
        type: boolean
        required: false
        default: true
        description: Validate the exact target and recipients without dispatch when true.
      idempotency_key:
        type: string
        required: false
        description: Stable retry identity; mandatory for a live test send.
        schema: { minLength: 1, maxLength: 128, pattern: '\S' }
      brand_sid:
        type: string
        required: true
        description: Public Nitrosend brand SID; account-default selection is forbidden.
    examples:
      - target_type: flow
        target_id: 42
        revision_id: 3
        action_id: 7
        channel: email
        to: [operator@example.com]
        data: { review_url: 'https://example.com/reviews/42' }
        dry_run: true
        brand_sid: brnd_demo123
    graph:
      name: nitrosend-send-test-message
      result_from: [send]
      steps:
        - id: review
          skill: graph/provider-operation
          runner: read
          inputs:
            operation: review_delivery
            arguments:
              target_type: "$input.target_type"
              target_id: "$input.target_id"
              revision_id: "$input.revision_id"
            brand_sid: "$input.brand_sid"
        - id: approve
          run:
            type: approval
          inputs:
            gate_id: nitrosend.send_test_message.approval
            reason: Run this exact reviewed test message for the named recipients. A dry run validates without dispatch.
          context:
            review: review.provider_evidence.data
        - id: send
          skill: graph/provider-operation
          runner: act
          idempotency_key: "$input.idempotency_key"
          inputs:
            operation: send_test_message
            arguments:
              target_type: "$input.target_type"
              target_id: "$input.target_id"
              revision_id: "$input.revision_id"
              action_id: "$input.action_id"
              template_id: "$input.template_id"
              channel: "$input.channel"
              to: "$input.to"
              data: "$input.data"
              dry_run: "$input.dry_run"
              idempotency_key: "$input.idempotency_key"
            brand_sid: "$input.brand_sid"
    policy:
      guards:
        - step: approve
          field: review.provider_evidence.data.decision
          equals: ok
        - step: send
          field: approve.approval_decision.data.approved
          equals: true
  review-content:
    type: graph
    inputs:
      subject:
        type: string
        required: true
        description: Exact email subject; empty is allowed, maximum 998 UTF-8 bytes.
        schema: { maxLength: 998 }
      html:
        type: string
        required: true
        description: Exact rendered email HTML for a self-contained read-only review.
        schema: { minLength: 1, maxLength: 262144 }
    examples:
      - subject: A useful product update
        html: "<h1>Product update</h1><p>What changed and why it matters.</p>"
    graph:
      name: nitrosend-review-content
      result_from: [project]
      steps:
        - id: digest-html
          tool: data.digest
          inputs:
            value: "$input.html"
            encoding: utf8_text
        - id: review
          tool: provider.read
          scopes: [content.review]
          policy:
            provider_permission: { verb: read }
          inputs:
            expected_provider: nitrosend
            operation: content.review
            target: nitrosend://content-review
            result_fields: [subject, html_size_bytes, html_digest, text_preview, text_length, accessibility, spam_score, warnings]
            input:
              subject: "$input.subject"
              html: "$input.html"
        - id: project
          inputs:
            subject: "$input.subject"
            html: "$input.html"
          context:
            expected_html_digest: digest-html.digest_result.data.digest
            provider_result: review.provider_operation.data.result
          run:
            type: javascript
            module: review-content.mjs
            export: projectContentReview
            outputs:
              subject: string
              html_size_bytes: number
              html_digest: string
              text_preview: string
              text_length: number
              accessibility: object
              spam_score: object
              warnings: array
  import-status:
    type: graph
    credential: nitrosend
    inputs:
      import_id:
        type: number
        required: true
        description: Nitrosend import ID returned by import-contacts or import-contacts-csv.
      brand_sid:
        type: string
        required: false
        description: Optional public Nitrosend brand SID.
    examples:
      - import_id: 42
        brand_sid: brnd_demo123
    graph:
      name: nitrosend-import-status
      result_from: [status]
      steps:
        - id: status
          skill: graph/provider-operation
          runner: read
          inputs:
            operation: import_status
            arguments:
              import_id: "$input.import_id"
            brand_sid: "$input.brand_sid"
  approve-delivery:
    type: graph
    credential: nitrosend
    act:
      purpose: Approve one reviewed Nitrosend campaign or flow without sending it.
    inputs:
      target_type:
        type: string
        required: true
        description: flow or campaign.
        schema: { enum: [flow, campaign] }
      target_id:
        type: number
        required: true
        description: Nitrosend entity ID.
      revision_id:
        type: number
        required: false
        description: Required for flows; exact current draft revision to review and approve.
      brand_sid:
        type: string
        required: false
        description: Optional public Nitrosend brand SID.
    examples:
      - target_type: flow
        target_id: 42
        revision_id: 3
        brand_sid: brnd_demo123
    graph:
      name: nitrosend-approve-delivery
      result_from: [apply]
      steps:
        - id: review
          skill: graph/provider-operation
          runner: read
          inputs:
            operation: review_delivery
            arguments:
              target_type: "$input.target_type"
              target_id: "$input.target_id"
              revision_id: "$input.revision_id"
            brand_sid: "$input.brand_sid"
        - id: approve
          run:
            type: approval
          inputs:
            gate_id: nitrosend.approve_delivery.approval
            reason: Approve this reviewed delivery configuration. This does not send or activate it.
          context:
            review: review.provider_evidence.data
        - id: apply
          skill: graph/provider-operation
          runner: act
          idempotency_key: nitrosend-approve-delivery
          inputs:
            operation: control_delivery
            arguments:
              target_type: "$input.target_type"
              target_id: "$input.target_id"
              operation: approve
              revision_id: "$input.revision_id"
            brand_sid: "$input.brand_sid"
    policy:
      guards:
        - step: apply
          field: approve.approval_decision.data.approved
          equals: true
  send-campaign:
    type: graph
    credential: nitrosend
    act:
      purpose: Deliver one already-approved Nitrosend campaign after fresh review and explicit approval.
    inputs:
      campaign_id:
        type: number
        required: true
        description: Approved Nitrosend campaign ID.
      operation:
        type: string
        required: true
        description: live or schedule.
        schema: { enum: [live, schedule] }
      scheduled_at:
        type: string
        required: false
        description: ISO 8601 time required for schedule.
      confirm_send_to_all:
        type: boolean
        required: false
        default: false
        description: Explicit confirmation for an all-contacts audience.
      idempotency_key:
        type: string
        required: true
        description: Stable retry key for this campaign delivery.
      brand_sid:
        type: string
        required: false
        description: Optional public Nitrosend brand SID.
    examples:
      - campaign_id: 42
        operation: schedule
        scheduled_at: '2026-08-04T09:00:00Z'
        confirm_send_to_all: false
        idempotency_key: campaign-campaign-001
        brand_sid: brnd_demo123
    graph:
      name: nitrosend-send-campaign
      result_from: [deliver]
      steps:
        - id: review
          skill: graph/provider-operation
          runner: read
          inputs:
            operation: review_delivery
            arguments:
              target_type: campaign
              target_id: "$input.campaign_id"
            brand_sid: "$input.brand_sid"
        - id: approve-send
          run:
            type: approval
          inputs:
            gate_id: nitrosend.send_campaign.approval
            reason: Deliver this reviewed campaign to its configured live audience.
          context:
            review: review.provider_evidence.data
        - id: deliver
          skill: graph/provider-operation
          runner: act
          idempotency_key: nitrosend-send-campaign
          inputs:
            operation: control_delivery
            arguments:
              target_type: campaign
              target_id: "$input.campaign_id"
              operation: "$input.operation"
              scheduled_at: "$input.scheduled_at"
              confirm_send_to_all: "$input.confirm_send_to_all"
              idempotency_key: "$input.idempotency_key"
            brand_sid: "$input.brand_sid"
    policy:
      guards:
        - step: approve-send
          field: review.provider_evidence.data.decision
          equals: ok
        - step: deliver
          field: approve-send.approval_decision.data.approved
          equals: true
  activate-flow:
    type: graph
    credential: nitrosend
    act:
      purpose: Activate one already-approved Nitrosend flow after fresh review and explicit approval.
    inputs:
      flow_id:
        type: number
        required: true
        description: Approved Nitrosend flow ID.
      revision_id:
        type: number
        required: true
        description: Exact approved flow draft revision to review and publish.
      brand_sid:
        type: string
        required: false
        description: Optional public Nitrosend brand SID.
    examples:
      - flow_id: 42
        revision_id: 3
        brand_sid: brnd_demo123
    graph:
      name: nitrosend-activate-flow
      result_from: [activate]
      steps:
        - id: review
          skill: graph/provider-operation
          runner: read
          inputs:
            operation: review_delivery
            arguments:
              target_type: flow
              target_id: "$input.flow_id"
              revision_id: "$input.revision_id"
            brand_sid: "$input.brand_sid"
        - id: approve-live
          run:
            type: approval
          inputs:
            gate_id: nitrosend.activate_flow.approval
            reason: Activate this reviewed automation flow for live contacts.
          context:
            review: review.provider_evidence.data
        - id: activate
          skill: graph/provider-operation
          runner: act
          idempotency_key: nitrosend-activate-flow
          inputs:
            operation: control_delivery
            arguments:
              target_type: flow
              target_id: "$input.flow_id"
              operation: live
              revision_id: "$input.revision_id"
            brand_sid: "$input.brand_sid"
    policy:
      guards:
        - step: approve-live
          field: review.provider_evidence.data.decision
          equals: ok
        - step: activate
          field: approve-live.approval_decision.data.approved
          equals: true
  apply-draft:
    type: graph
    credential: nitrosend
    act:
      purpose: Apply one reviewed Nitrosend campaign, flow, template, segment, or remote image ingest request.
    inputs:
      operation:
        type: string
        required: true
        description: compose_campaign, compose_flow, manage_template, define_segment, or ingest_image.
        schema: { enum: [compose_campaign, compose_flow, manage_template, define_segment, ingest_image] }
      arguments:
        type: object
        required: true
        description: Exact arguments produced by the matching planning runner and current Nitrosend schema.
        schema:
          additionalProperties: true
      brand_sid:
        type: string
        required: false
        description: Optional public Nitrosend brand SID.
    examples:
      - operation: define_segment
        arguments:
          name: Active customers
          filters: { all: [{ field: status, operator: eq, value: active }] }
        brand_sid: brnd_demo123
    graph:
      name: nitrosend-apply-draft
      result_from: [apply, blocked]
      steps:
        - id: preflight
          inputs:
            mode: act
            operation: "$input.operation"
            arguments: "$input.arguments"
            brand_sid: "$input.brand_sid"
          run:
            type: javascript
            module: graph/provider-operation/nitrosend-operation.mjs
            export: prepareOperation
            outputs:
              operation_plan: object
        - id: blocked
          when:
            field: preflight.operation_plan.decision
            not_equals: ready
          context:
            operation_plan: preflight.operation_plan
          run:
            type: javascript
            module: graph/provider-operation/nitrosend-operation.mjs
            export: blockedOperation
            outputs:
              provider_evidence: object
          artifacts:
            named_emits:
              provider_evidence: provider_evidence
            packets:
              provider_evidence: nitrosend.provider_evidence.v1
        - id: approve-draft
          when:
            field: preflight.operation_plan.decision
            equals: ready
          run:
            type: approval
          inputs:
            gate_id: nitrosend.apply_draft.approval
            reason: Apply this reviewed draft or image ingest to the live Nitrosend account. This does not deliver to recipients or activate a flow.
        - id: apply
          when:
            field: preflight.operation_plan.decision
            equals: ready
          skill: graph/provider-operation
          runner: act
          idempotency_key: "$input.arguments.idempotency_key"
          inputs:
            operation: "$input.operation"
            arguments: "$input.arguments"
            idempotency_key: "$input.arguments.idempotency_key"
            brand_sid: "$input.brand_sid"
    policy:
      guards:
        - step: apply
          field: approve-draft.approval_decision.data.approved
          equals: true
