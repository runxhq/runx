name: nitrosend-inbox-read
kind: skill
target: ..
runner: read
setup:
  credentials: [nitrosend]
env:
  NITROSEND_API_KEY: harness-nitrosend-token
inputs:
  operation: inbox
  brand_sid: brnd_demo123
  arguments:
    command: list_mailbox
    arguments: { status: open, view: full, page: 1, per: 10 }
caller:
  mcp_calls:
    - tool: nitro_inbox
      arguments: { command: list_mailbox, status: open, view: full, page: 1, per: 10 }
      headers: { x-brand-sid: brnd_demo123 }
      result:
        structuredContent:
          meta: { tool: nitro_inbox }
          result:
            items: []
            pagination: { page: 1, total_pages: 1 }
expect:
  status: sealed
  steps: [prepare, request, normalize]
  step_outputs:
    normalize:
      subset:
        provider_evidence:
          data:
            decision: ok
            provider: nitrosend
            mode: read
            operation: inbox
            result:
              items: []
  receipt: { schema: runx.receipt.v1, state: sealed, disposition: closed }
