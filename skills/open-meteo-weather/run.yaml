skill: open-meteo-weather
version: "0.1.9"
catalog:
  kind: graph
  audience: public
  visibility: public
  role: canonical
  provider: open-meteo
  execution: read
  completion: provider_readback
  approval: none
  category: data
connectors:
  open-meteo:
    operations:
    - geocode.search
    - forecast.read
    - air_quality.read
runners:
  air_quality:
    inputs:
      latitude:
        type: string
        required: true
        description: Decimal latitude selected from the location evidence.
      longitude:
        type: string
        required: true
        description: Decimal longitude selected from the location evidence.
    result_from:
    - air_quality
    steps:
    - id: air_quality
      operation: open-meteo/air_quality.read
      input:
        latitude: $input.latitude
        longitude: $input.longitude
  forecast:
    default: true
    inputs:
      latitude:
        type: string
        required: true
        description: Decimal latitude selected from the location evidence.
      longitude:
        type: string
        required: true
        description: Decimal longitude selected from the location evidence.
      forecast_days:
        type: string
        required: false
        default: '3'
        description: Number of forecast days to request.
    result_from:
    - forecast
    steps:
    - id: forecast
      operation: open-meteo/forecast.read
      input:
        latitude: $input.latitude
        longitude: $input.longitude
        forecast_days: $input.forecast_days
  locate:
    inputs:
      name:
        type: string
        required: true
        description: Place name to resolve before selecting the intended coordinates.
    steps:
    - id: locate
      operation: open-meteo/geocode.search
      input:
        name: $input.name
harness:
  files:
  - fixtures/support/composed.graph
  cases: []
