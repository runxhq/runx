name: tokenize-stable-placeholders
method: redact-pii
inputs:
  content: Primary a@example.com backup b@example.com.
  classes:
    - email
  mode: tokenize
host:
  answers:
    detect:
      redaction_draft:
        decision: ready
        detected:
          - class: email
            selector:
              quote: a@example.com
            confidence: 0.99
          - class: email
            selector:
              quote: b@example.com
            confidence: 0.99
        residual_risk:
          level: low
          reason_code: none
expect:
  status: sealed
  steps:
    - block-policy
    - detect
    - apply
  step_outputs:
    apply:
      subset:
        redaction_report:
          decision: ready
          redacted_digest: sha256:e4217444a2851030189158f5941bec6f4913274e309bb2cf27f392f2ba3e7093
          scanner:
            status: pass
            findings: []
          policy:
            classes:
              - email
            mode: tokenize
        redacted_content: Primary [TOKEN:EMAIL:1] backup [TOKEN:EMAIL:2].
  receipt:
    schema: runx.receipt.v1
