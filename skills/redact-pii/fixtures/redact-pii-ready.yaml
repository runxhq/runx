name: redact-pii-ready
kind: skill
target: ..
runner: redact-pii
operator_journeys:
  - mode: standalone
    confusors: [extract, privacy-request-review]
    request: Remove names, emails, and phone numbers from this support text before it crosses a trust boundary.
    expected_outcome: Return usable scrubbed content only after deterministic residual scanning passes.
  - mode: composed
    request: Redact this outbound support artifact before delivery.
    expected_outcome: Reuse the supplied content and classification policy without re-fetching the source, then return a boundary-safe artifact.
    prior_evidence:
      - The exact support content, PII classes, locale, and redaction mode supplied in the fixture.
    must_not_repeat:
      - Do not fetch the original support request again.
      - Do not forward unredacted content to a downstream sender.
inputs:
  content: "Customer Dana Whitfield wrote in from dana.w@example.com about order #44120; callback number on file is 415-555-0188."
  classes:
    - name
    - email
    - phone
  mode: redact
  locale: en-US
caller:
  answers:
    detect:
      redaction_draft:
        decision: ready
        detected:
          - class: name
            span: [9, 23]
            confidence: 0.97
          - class: email
            span: [38, 56]
            confidence: 0.99
          - class: phone
            span: [104, 116]
            confidence: 0.96
        residual_risk:
          level: low
          reason_code: none
expect:
  status: sealed
  steps:
    - digest-source
    - detect
    - scrub
    - digest-redacted
    - finalize
  step_outputs:
    finalize:
      subset:
        redaction_report:
          data:
            decision: ready
            redacted_digest: sha256:03b11b6388500f1edfc6daab6492eed600a775443462ae9539d6cc2a51abe695
            residual_risk:
              level: low
              reason_code: none
            scanner:
              status: pass
              findings: []
            policy:
              classes:
                - email
                - name
                - phone
              mode: redact
              locale: en-US
        redacted_content: "Customer [REDACTED:NAME] wrote in from [REDACTED:EMAIL] about order #44120; callback number on file is [REDACTED:PHONE]."
  receipt:
    schema: runx.receipt.v1
metadata:
  public_skill: redact-pii
  source_case: redact-pii-ready
  source: skills-fixture
