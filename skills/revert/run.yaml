version: "0.1.1"
minimum_runx: 0.12.0

catalog:
  visibility: internal
  category: code

methods:
  revert:
    inputs:
      run_id:
        type: string
        description: The run whose edits to undo.
      call_ids:
        description: The call ids of the edit calls to undo together.
    result_from: [apply]
    steps:
      - id: inverse
        tool: fs.inverse
        inputs:
          run_id: $input.run_id
          call_ids: $input.call_ids
      - id: apply
        tool: fs.apply_bundle
        inputs:
          repo_root: $steps.inverse.inverse_bundle.repo_root
          writes: $steps.inverse.inverse_bundle.writes
          deletes: $steps.inverse.inverse_bundle.deletes
