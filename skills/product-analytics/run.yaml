version: "0.1.6"
minimum_runx: 0.12.0
default_method: review
catalog:
  visibility: public
  category: data
methods:
  analyze:
    description: "Calculate and interpret supplied product reports without provider calls or reconstructed measurement definitions."
    inputs:
      objective:
        type: string
        description: Bounded product decision to support.
        minLength: 1
        maxLength: 2000
      reports: {}
      collection_notes:
        type: array
        default: []
        description: Actual source acquisition gaps, selection limits, sampling and cache caveats, preserved with useful measurements.
        items:
          type: string
        optional: true
    result_from:
      - calculate
      - finalize
    steps:
      - id: calculate
        tool:
          module: product-analytics.mjs
          export: calculateMetrics
        inputs:
          objective: $input.objective
          reports: $input.reports
          collection_notes: $input.collection_notes
        outputs:
          metric_context:
            type: object
            additionalProperties: false
            required:
              - decision
              - objective
              - reports
              - comparison
              - source_digests
              - blockers
              - comparison_blockers
              - collection_notes
            properties:
              decision:
                enum:
                  - ready
                  - needs_more_evidence
              objective:
                type: string
                minLength: 1
                maxLength: 2000
              reports:
                type: array
                maxItems: 2
                items:
                  type: object
                  additionalProperties: false
                  required:
                    - name
                    - window
                    - definition
                    - observed_at
                    - source_digest
                    - complete
                    - funnel
                    - retention
                    - estimated
                    - comparison_eligible
                  properties:
                    name:
                      enum:
                        - current
                        - baseline
                    window:
                      type: object
                      additionalProperties: false
                      required:
                        - start_at
                        - end_at
                      properties:
                        start_at:
                          type: string
                          format: date-time
                        end_at:
                          type: string
                          format: date-time
                    definition:
                      type: object
                      additionalProperties: false
                      required:
                        - product
                        - identity
                        - time_zone
                        - cohort
                        - filters
                        - funnel_rule
                        - retention_rule
                      properties:
                        product:
                          type: string
                          minLength: 1
                          maxLength: 200
                        identity:
                          type: string
                          minLength: 1
                          maxLength: 200
                        time_zone:
                          type: string
                          minLength: 1
                          maxLength: 100
                        cohort:
                          type: string
                          minLength: 1
                          maxLength: 2000
                        filters:
                          type: string
                          minLength: 1
                          maxLength: 2000
                        funnel_rule:
                          type: string
                          minLength: 1
                          maxLength: 2000
                        retention_rule:
                          type: string
                          minLength: 1
                          maxLength: 2000
                    observed_at:
                      type: string
                      format: date-time
                    source_digest:
                      type: string
                      pattern: ^sha256:[0-9a-f]{64}$
                    complete:
                      type: boolean
                    funnel:
                      type: array
                      items:
                        type: object
                        additionalProperties: false
                        required:
                          - event
                          - count
                          - conversion_from_entry
                          - conversion_from_previous
                          - lost_from_previous
                        properties:
                          event:
                            type: string
                            minLength: 1
                            maxLength: 300
                          count:
                            type: number
                            minimum: 0
                            maximum: 9007199254740991
                          conversion_from_entry:
                            type:
                              - number
                              - "null"
                            minimum: 0
                            maximum: 1
                          conversion_from_previous:
                            type:
                              - number
                              - "null"
                            minimum: 0
                            maximum: 1
                          lost_from_previous:
                            type:
                              - number
                              - "null"
                            minimum: 0
                            maximum: 9007199254740991
                    retention:
                      type:
                        - object
                        - "null"
                      additionalProperties: false
                      required:
                        - period
                        - eligible
                        - returned
                        - rate
                      properties:
                        period:
                          type: string
                          minLength: 1
                          maxLength: 200
                        eligible:
                          type: number
                          minimum: 0
                          maximum: 9007199254740991
                        returned:
                          type: number
                          minimum: 0
                          maximum: 9007199254740991
                        rate:
                          type:
                            - number
                            - "null"
                          minimum: 0
                          maximum: 1
                    estimated:
                      type: boolean
                    comparison_eligible:
                      type: boolean
                    measurement_context:
                      type: object
                      required:
                        - provider
                        - title
                        - description
                        - query
                        - source_artifact
                      properties:
                        provider:
                          type: string
                          minLength: 1
                        title:
                          type: string
                        description:
                          type: string
                        query:
                          type: object
                          additionalProperties: true
                        source_artifact:
                          additionalProperties: false
                          properties:
                            created_at:
                              type: string
                            digest:
                              pattern: "^sha256:[0-9a-f]{64}$"
                              type: string
                            labels:
                              additionalProperties: false
                              properties:
                                sharing:
                                  enum:
                                    - local_only
                                    - configured_model
                                  type: string
                              required:
                                - sharing
                              type: object
                            media_type:
                              minLength: 1
                              type: string
                            path:
                              minLength: 1
                              type: string
                            produced_by:
                              additionalProperties: true
                              type: object
                            ref:
                              description: "Where it is: an opaque reference a native artifact tool resolves."
                              minLength: 1
                              type: string
                            schema:
                              enum:
                                - runx.artifact.v1
                              type: string
                            size_bytes:
                              minimum: 0
                              type: integer
                            sources:
                              items:
                                additionalProperties: true
                                type: object
                              type: array
                            summary:
                              minLength: 1
                              type: string
                          required:
                            - schema
                            - ref
                            - digest
                            - size_bytes
                            - media_type
                            - labels
                          title: Artifact
                          type: object
                          x-runx-packet: true
                          x-runx-schema: runx.artifact.v1
                      additionalProperties: false
              comparison:
                type:
                  - object
                  - "null"
                additionalProperties: false
                required:
                  - funnel
                  - retention_change_percentage_points
                properties:
                  funnel:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required:
                        - event
                        - conversion_change_percentage_points
                      properties:
                        event:
                          type: string
                          minLength: 1
                          maxLength: 300
                        conversion_change_percentage_points:
                          type:
                            - number
                            - "null"
                          minimum: -100
                          maximum: 100
                  retention_change_percentage_points:
                    type:
                      - number
                      - "null"
                    minimum: -100
                    maximum: 100
              source_digests:
                type: array
                minItems: 0
                maxItems: 2
                uniqueItems: true
                items:
                  type: string
                  pattern: ^sha256:[0-9a-f]{64}$
              blockers:
                type: array
                maxItems: 40
                items:
                  type: string
                  minLength: 1
                  maxLength: 1000
              comparison_blockers:
                type: array
                items:
                  type: string
                  minLength: 1
              collection_notes:
                type: array
                items:
                  type: string
      - id: digest
        when:
          value: $steps.calculate.metric_context.decision
          equals: ready
        tool: data.digest
        inputs:
          value: $steps.calculate.metric_context
      - id: analyze
        when:
          value: $steps.calculate.metric_context.decision
          equals: ready
        agent: product-analytics-analyze
        inputs:
          metric_context: $steps.calculate.metric_context
        outputs:
          analytics_candidate:
            type: object
            additionalProperties: false
            required:
              - decision
              - objective
              - summary
              - findings
              - limitations
            properties:
              decision:
                enum:
                  - ready
                  - needs_more_evidence
              objective:
                type: string
                minLength: 1
                maxLength: 2000
              summary:
                type: string
                maxLength: 4000
              findings:
                type: array
                maxItems: 30
                items:
                  type: object
                  additionalProperties: false
                  required:
                    - claim
                    - kind
                    - source_digests
                  properties:
                    claim:
                      type: string
                      minLength: 1
                      maxLength: 2000
                    kind:
                      enum:
                        - observed
                        - hypothesis
                        - action
                    source_digests:
                      type: array
                      minItems: 1
                      maxItems: 2
                      uniqueItems: true
                      items:
                        type: string
                        pattern: ^sha256:[0-9a-f]{64}$
                    measurement:
                      type: string
                      minLength: 1
                      maxLength: 2000
                    owner_role:
                      type: string
                      minLength: 1
                      maxLength: 200
                    stop_condition:
                      type: string
                      minLength: 1
                      maxLength: 2000
                  if:
                    properties:
                      kind:
                        const: action
                  then:
                    required:
                      - measurement
                      - owner_role
                      - stop_condition
              limitations:
                type: array
                maxItems: 40
                items:
                  type: string
                  minLength: 1
                  maxLength: 2000
      - id: finalize
        when:
          value: $steps.calculate.metric_context.decision
          equals: ready
        tool: evidence.verify_artifact
        inputs:
          artifact_name: product_analytics_review
          candidate: $steps.analyze.analytics_candidate
          claim_bindings: $steps.analyze.analytics_candidate.findings
          source_digests: $steps.calculate.metric_context.source_digests
          required_paths:
            - summary
          required_value_bindings:
            - candidate_path: objective
              source_path: objective
          identity_source: $steps.calculate.metric_context
          authoritative_fields:
            external_status: not_executed
            measurement_digest: $steps.digest.digest_result.digest
          fallback_artifact:
            decision: needs_more_evidence
            objective: ""
            summary: Interpretation withheld because its evidence bindings did not validate.
            findings: []
            limitations: []
            external_status: not_executed
            measurement_digest: $steps.digest.digest_result.digest
          fallback_bindings:
            - target_path: objective
              source_path: objective
            - target_path: limitations
              source_path: blockers
            - target_path: source_notes
              source_path: collection_notes
          fallback_source: $steps.calculate.metric_context
          authoritative_source: $steps.calculate.metric_context
          authoritative_bindings:
            - target_path: source_notes
              source_path: collection_notes
        outputs:
          product_analytics_review:
            type: object
            additionalProperties: false
            required:
              - decision
              - objective
              - summary
              - findings
              - limitations
              - external_status
              - validation
              - measurement_digest
              - source_notes
            properties:
              decision:
                enum:
                  - ready
                  - needs_more_evidence
              objective:
                type: string
                minLength: 1
                maxLength: 2000
              summary:
                type: string
                maxLength: 4000
              findings:
                type: array
                maxItems: 30
                items:
                  type: object
                  additionalProperties: false
                  required:
                    - claim
                    - kind
                    - source_digests
                  properties:
                    claim:
                      type: string
                      minLength: 1
                      maxLength: 2000
                    kind:
                      enum:
                        - observed
                        - hypothesis
                        - action
                    source_digests:
                      type: array
                      minItems: 1
                      maxItems: 2
                      uniqueItems: true
                      items:
                        type: string
                        pattern: ^sha256:[0-9a-f]{64}$
                    measurement:
                      type: string
                      minLength: 1
                      maxLength: 2000
                    owner_role:
                      type: string
                      minLength: 1
                      maxLength: 200
                    stop_condition:
                      type: string
                      minLength: 1
                      maxLength: 2000
                  if:
                    properties:
                      kind:
                        const: action
                  then:
                    required:
                      - measurement
                      - owner_role
                      - stop_condition
              limitations:
                type: array
                maxItems: 40
                items:
                  type: string
                  minLength: 1
                  maxLength: 2000
              external_status:
                const: not_executed
              validation:
                type: object
                additionalProperties: true
                required:
                  - status
                  - findings
                properties:
                  status:
                    enum:
                      - pass
                      - fail
                  findings:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
              measurement_digest:
                type: string
                pattern: ^sha256:[0-9a-f]{64}$
              source_notes:
                type: array
                items:
                  type: string
    examples:
      - objective: Find activation gaps
        reports:
          - name: current
            complete: true
            source_digest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
            observed_at: 2026-10-09T00:00:00Z
            window:
              start_at: 2026-09-01T00:00:00Z
              end_at: 2026-09-08T00:00:00Z
            definition:
              product: Example
              identity: account
              time_zone: UTC
              cohort: new accounts
              filters: exclude test accounts
              funnel_rule: same accounts, ordered within seven days
              retention_rule: active on day seven
            funnel:
              steps:
                - event: signup
                  count: 100
                - event: activated
                  count: 75
            retention:
              period: day 7
              eligible: 80
              returned: 40
  normalize-posthog:
    description: Reuse one retained PostHog insight.read packet artifact. Validate cached definitions and normalize actual funnel or mature retention counts without provider calls.
    inputs:
      artifact:
        packet: runx.artifact.v1
        description: Exact native artifact of the completed PostHog insight.read packet.
      name:
        type: string
        description: Measurement role in the analysis.
        enum:
          - current
          - baseline
      return_interval: {}
    result_from:
      - bind
    steps:
      - id: provider-open
        tool: artifact.open
        inputs:
          artifact: $input.artifact
      - id: provider-read
        tool: artifact.read
        inputs:
          ref: $steps.provider-open.artifact.ref
          encoding: utf8
          offset: 0
          max_bytes: 2097152
      - id: prepare
        tool:
          module: posthog.mjs
          export: preparePosthog
          requires:
            - parseData
        inputs:
          page: $steps.provider-read.artifact_page
          name: $input.name
          return_interval: $input.return_interval
          artifact: $input.artifact
        outputs:
          source_admission: {type: object}
          query_semantics:
            type: object
            additionalProperties: true
      - id: semantic-digest
        tool: data.digest
        inputs:
          value: $steps.prepare.query_semantics
      - id: bind
        tool:
          module: posthog.mjs
          export: bindPosthog
        inputs:
          source_admission: $steps.prepare.source_admission
          semantic_digest: $steps.semantic-digest.digest_result.digest
        outputs:
          source_admission:
            type: object
            required:
              - name
              - report
              - blockers
              - notes
              - source
            properties:
              name:
                enum:
                  - current
                  - baseline
              report:
                anyOf:
                  - type: object
                    additionalProperties: false
                    required:
                      - name
                      - window
                      - definition
                      - source_digest
                      - observed_at
                      - complete
                    properties:
                      name:
                        enum:
                          - current
                          - baseline
                      window:
                        type: object
                        additionalProperties: false
                        required:
                          - start_at
                          - end_at
                        properties:
                          start_at:
                            type: string
                            format: date-time
                          end_at:
                            type: string
                            format: date-time
                      definition:
                        type: object
                        additionalProperties: false
                        required:
                          - product
                          - identity
                          - time_zone
                          - cohort
                          - filters
                          - funnel_rule
                          - retention_rule
                        properties:
                          product:
                            type: string
                            minLength: 1
                            maxLength: 200
                          identity:
                            type: string
                            minLength: 1
                            maxLength: 200
                          time_zone:
                            type: string
                            minLength: 1
                            maxLength: 100
                          cohort:
                            type: string
                            minLength: 1
                            maxLength: 2000
                          filters:
                            type: string
                            minLength: 1
                            maxLength: 2000
                          funnel_rule:
                            type: string
                            minLength: 1
                            maxLength: 2000
                          retention_rule:
                            type: string
                            minLength: 1
                            maxLength: 2000
                      source_digest:
                        type: string
                        pattern: ^sha256:[0-9a-f]{64}$
                      observed_at:
                        type: string
                        format: date-time
                      complete:
                        type: boolean
                      funnel:
                        type: object
                        additionalProperties: false
                        required:
                          - steps
                        properties:
                          steps:
                            type: array
                            minItems: 2
                            items:
                              type: object
                              additionalProperties: false
                              required:
                                - event
                                - count
                              properties:
                                event:
                                  type: string
                                  minLength: 1
                                  maxLength: 300
                                count:
                                  type: number
                                  minimum: 0
                                  maximum: 9007199254740991
                      retention:
                        type: object
                        additionalProperties: false
                        required:
                          - period
                          - eligible
                          - returned
                        properties:
                          period:
                            type: string
                            minLength: 1
                            maxLength: 200
                          eligible:
                            type: number
                            minimum: 0
                            maximum: 9007199254740991
                          returned:
                            type: number
                            minimum: 0
                            maximum: 9007199254740991
                      estimated:
                        type: boolean
                      comparison_eligible:
                        type: boolean
                      measurement_context:
                        type: object
                        required:
                          - provider
                          - title
                          - description
                          - query
                          - source_artifact
                        properties:
                          provider:
                            type: string
                            minLength: 1
                          title:
                            type: string
                          description:
                            type: string
                          query:
                            type: object
                            additionalProperties: true
                          source_artifact:
                            additionalProperties: false
                            properties:
                              created_at:
                                type: string
                              digest:
                                pattern: "^sha256:[0-9a-f]{64}$"
                                type: string
                              labels:
                                additionalProperties: false
                                properties:
                                  sharing:
                                    enum:
                                      - local_only
                                      - configured_model
                                    type: string
                                required:
                                  - sharing
                                type: object
                              media_type:
                                minLength: 1
                                type: string
                              path:
                                minLength: 1
                                type: string
                              produced_by:
                                additionalProperties: true
                                type: object
                              ref:
                                description: "Where it is: an opaque reference a native artifact tool resolves."
                                minLength: 1
                                type: string
                              schema:
                                enum:
                                  - runx.artifact.v1
                                type: string
                              size_bytes:
                                minimum: 0
                                type: integer
                              sources:
                                items:
                                  additionalProperties: true
                                  type: object
                                type: array
                              summary:
                                minLength: 1
                                type: string
                            required:
                              - schema
                              - ref
                              - digest
                              - size_bytes
                              - media_type
                              - labels
                            title: Artifact
                            type: object
                            x-runx-packet: true
                            x-runx-schema: runx.artifact.v1
                        additionalProperties: false
                    anyOf:
                      - required:
                          - funnel
                      - required:
                          - retention
                  - type: "null"
              blockers:
                type: array
                items:
                  type: string
              notes:
                type: array
                items:
                  type: string
              source:
                type: object
                required:
                  - artifact_digest
                  - provider
                  - target
                  - observed_at
                  - readback_uri
                  - artifact
                properties:
                  artifact_digest:
                    type: string
                  provider:
                    type:
                      - string
                      - "null"
                  target:
                    type:
                      - string
                      - "null"
                  observed_at:
                    type:
                      - string
                      - "null"
                  readback_uri:
                    type:
                      - string
                      - "null"
                  artifact:
                    additionalProperties: false
                    properties:
                      created_at:
                        type: string
                      digest:
                        pattern: "^sha256:[0-9a-f]{64}$"
                        type: string
                      labels:
                        additionalProperties: false
                        properties:
                          sharing:
                            enum:
                              - local_only
                              - configured_model
                            type: string
                        required:
                          - sharing
                        type: object
                      media_type:
                        minLength: 1
                        type: string
                      path:
                        minLength: 1
                        type: string
                      produced_by:
                        additionalProperties: true
                        type: object
                      ref:
                        description: "Where it is: an opaque reference a native artifact tool resolves."
                        minLength: 1
                        type: string
                      schema:
                        enum:
                          - runx.artifact.v1
                        type: string
                      size_bytes:
                        minimum: 0
                        type: integer
                      sources:
                        items:
                          additionalProperties: true
                          type: object
                        type: array
                      summary:
                        minLength: 1
                        type: string
                    required:
                      - schema
                      - ref
                      - digest
                      - size_bytes
                      - media_type
                      - labels
                    title: Artifact
                    type: object
                    x-runx-packet: true
                    x-runx-schema: runx.artifact.v1
                additionalProperties: false
            additionalProperties: false
    examples:
      - artifact:
          schema: runx.artifact.v1
          ref: runx:project-artifact:sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          digest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          size_bytes: 1234
          media_type: application/json
          path: /workspace/.runx/artifacts/insight.json
          labels: {sharing: configured_model}
        name: current
        return_interval: 1
  read-posthog:
    description: Read one exact saved PostHog insight through the selected account, retain the packet, and normalize its cached measurement. Does not refresh the query.
    inputs:
      insight_id:
        type: string
        description: Provider numeric id or short_id, as returned by saved-insight discovery or extracted from the supplied URL.
        pattern: ^[A-Za-z0-9_-]+$
      name:
        type: string
        default: current
        description: Current or baseline measurement.
        enum:
          - current
          - baseline
        optional: true
      return_interval: {}
    result_from:
      - save
      - normalize
    steps:
      - id: read
        operation: posthog/insight.read
        inputs:
          insight_id: $input.insight_id
      - id: save
        tool: artifact.store
        inputs:
          value: $steps.read.provider_operation
      - id: normalize
        skill: .#normalize-posthog
        inputs:
          artifact: $steps.save.artifact
          name: $input.name
          return_interval: $input.return_interval
    examples:
      - insight_id: launch01
        name: current
        return_interval: 1
  from-posthog:
    description: Normalize retained current and optional baseline provider artifacts, then interpret usable measurements without repeating provider reads.
    inputs:
      objective:
        type: string
        description: Bounded product decision to support.
        minLength: 1
        maxLength: 2000
      selection: {}
      return_interval: {}
    result_from:
      - merge-current
      - analyze-current
      - merge-both
      - analyze-both
      - merge-none
      - analyze-none
    steps:
      - id: select-sources
        tool:
          module: posthog.mjs
          export: selectPosthog
        inputs:
          selection: $input.selection
        outputs:
          has_current: {type: boolean}
          mode:
            type: string
            enum:
              - none
              - current
              - both
      - id: current
        when:
          value: $steps.select-sources.has_current
          equals: true
        skill: .#normalize-posthog
        inputs:
          artifact: $input.selection.current
          name: current
          return_interval: $input.return_interval
      - id: baseline
        when:
          value: $steps.select-sources.mode
          equals: both
        skill: .#normalize-posthog
        inputs:
          artifact: $input.selection.baseline
          name: baseline
          return_interval: $input.return_interval
      - id: merge-current
        when:
          value: $steps.select-sources.mode
          equals: current
        tool:
          module: posthog.mjs
          export: mergePosthog
        inputs:
          current: $steps.current.source_admission
          baseline: null
          collection_notes: $input.selection.notes
        outputs:
          reports:
            type: array
          collection_notes:
            type: array
          source_admissions:
            type: array
      - id: analyze-current
        skill: .#analyze
        inputs:
          objective: $input.objective
          reports: $steps.merge-current.reports
          collection_notes: $steps.merge-current.collection_notes
        when:
          value: $steps.select-sources.mode
          equals: current
      - id: merge-both
        when:
          value: $steps.select-sources.mode
          equals: both
        tool:
          module: posthog.mjs
          export: mergePosthog
        inputs:
          current: $steps.current.source_admission
          baseline: $steps.baseline.source_admission
          collection_notes: $input.selection.notes
        outputs:
          reports:
            type: array
          collection_notes:
            type: array
          source_admissions:
            type: array
      - id: analyze-both
        skill: .#analyze
        inputs:
          objective: $input.objective
          reports: $steps.merge-both.reports
          collection_notes: $steps.merge-both.collection_notes
        when:
          value: $steps.select-sources.mode
          equals: both
      - id: merge-none
        when:
          value: $steps.select-sources.mode
          equals: none
        tool:
          module: posthog.mjs
          export: mergePosthog
        inputs:
          current: null
          baseline: null
          collection_notes: $input.selection.notes
        outputs:
          reports:
            type: array
          collection_notes:
            type: array
          source_admissions:
            type: array
      - id: analyze-none
        skill: .#analyze
        inputs:
          objective: $input.objective
          reports: $steps.merge-none.reports
          collection_notes: $steps.merge-none.collection_notes
        when:
          value: $steps.select-sources.mode
          equals: none
    examples:
      - objective: Review activation using this retained provider read.
        selection:
          current:
            schema: runx.artifact.v1
            ref: runx:project-artifact:sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
            digest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
            size_bytes: 1234
            media_type: application/json
            path: /workspace/.runx/artifacts/insight.json
            labels: {sharing: configured_model}
          baseline: null
          notes: []
        return_interval: 1
  review:
    description: Review a product funnel or retention objective. Reuse supplied aggregates, or collect the selected PostHog saved insights and preserve every acquisition gap.
    inputs:
      objective:
        type: string
        description: Bounded product decision to support.
        minLength: 1
        maxLength: 2000
      reports: {}
      source_context:
        type: object
        default: {}
        description: Known saved-insight ids, titles or search terms for the selected project. Empty context permits bounded discovery but never guessed events or counts.
        additionalProperties: false
        properties:
          current_insight_id:
            type: string
            pattern: ^[A-Za-z0-9_-]+$
          baseline_insight_id:
            type: string
            pattern: ^[A-Za-z0-9_-]+$
          search:
            type: string
            minLength: 1
        optional: true
      return_interval: {}
      collection_notes:
        type: array
        default: []
        description: Actual source acquisition gaps, selection limits, sampling and cache caveats, preserved with useful measurements.
        items:
          type: string
        optional: true
    result_from:
      - reuse
      - collected
    steps:
      - id: select
        tool: data.compare
        inputs:
          actual: $input.reports
          expected: []
      - id: reuse
        skill: .#analyze
        inputs:
          objective: $input.objective
          reports: $input.reports
          collection_notes: $input.collection_notes
        when:
          value: $steps.select.comparison.equal
          equals: false
      - id: collect
        when:
          value: $steps.select.comparison.equal
          equals: true
        agent: product-analytics-collect
        calls:
          operations: [posthog/insights.list, posthog/insight.read]
        inputs:
          objective: $input.objective
          source_context: $input.source_context
          collection_notes: $input.collection_notes
        outputs:
          selection:
            type: object
            required:
              - current
              - baseline
              - notes
            properties:
              current:
                anyOf:
                  - additionalProperties: false
                    properties:
                      created_at:
                        type: string
                      digest:
                        pattern: "^sha256:[0-9a-f]{64}$"
                        type: string
                      labels:
                        additionalProperties: false
                        properties:
                          sharing:
                            enum:
                              - local_only
                              - configured_model
                            type: string
                        required:
                          - sharing
                        type: object
                      media_type:
                        minLength: 1
                        type: string
                      path:
                        minLength: 1
                        type: string
                      produced_by:
                        additionalProperties: true
                        type: object
                      ref:
                        description: "Where it is: an opaque reference a native artifact tool resolves."
                        minLength: 1
                        type: string
                      schema:
                        enum:
                          - runx.artifact.v1
                        type: string
                      size_bytes:
                        minimum: 0
                        type: integer
                      sources:
                        items:
                          additionalProperties: true
                          type: object
                        type: array
                      summary:
                        minLength: 1
                        type: string
                    required:
                      - schema
                      - ref
                      - digest
                      - size_bytes
                      - media_type
                      - labels
                    title: Artifact
                    type: object
                    x-runx-packet: true
                    x-runx-schema: runx.artifact.v1
                  - type: "null"
              baseline:
                anyOf:
                  - additionalProperties: false
                    properties:
                      created_at:
                        type: string
                      digest:
                        pattern: "^sha256:[0-9a-f]{64}$"
                        type: string
                      labels:
                        additionalProperties: false
                        properties:
                          sharing:
                            enum:
                              - local_only
                              - configured_model
                            type: string
                        required:
                          - sharing
                        type: object
                      media_type:
                        minLength: 1
                        type: string
                      path:
                        minLength: 1
                        type: string
                      produced_by:
                        additionalProperties: true
                        type: object
                      ref:
                        description: "Where it is: an opaque reference a native artifact tool resolves."
                        minLength: 1
                        type: string
                      schema:
                        enum:
                          - runx.artifact.v1
                        type: string
                      size_bytes:
                        minimum: 0
                        type: integer
                      sources:
                        items:
                          additionalProperties: true
                          type: object
                        type: array
                      summary:
                        minLength: 1
                        type: string
                    required:
                      - schema
                      - ref
                      - digest
                      - size_bytes
                      - media_type
                      - labels
                    title: Artifact
                    type: object
                    x-runx-packet: true
                    x-runx-schema: runx.artifact.v1
                  - type: "null"
              notes:
                type: array
                items:
                  type: string
            additionalProperties: false
      - id: collected
        skill: .#from-posthog
        inputs:
          objective: $input.objective
          selection: $steps.collect.selection
          return_interval: $input.return_interval
        when:
          value: $steps.select.comparison.equal
          equals: true
    examples:
      - objective: Find the largest activation drop-off in this saved product funnel.
        source_context:
          current_insight_id: launch01
shared_inputs:
  reports:
    type: array
    description: Current and optional baseline aggregate evidence; preserve native source digest, the measurement definition that source was computed under and actual cache observation time.
    default: []
    minItems: 0
    maxItems: 2
    items:
      type: object
      additionalProperties: false
      required:
        - name
        - window
        - definition
        - source_digest
        - observed_at
        - complete
      properties:
        name:
          enum:
            - current
            - baseline
        window:
          type: object
          additionalProperties: false
          required:
            - start_at
            - end_at
          properties:
            start_at:
              type: string
              format: date-time
            end_at:
              type: string
              format: date-time
        definition:
          type: object
          additionalProperties: false
          required:
            - product
            - identity
            - time_zone
            - cohort
            - filters
            - funnel_rule
            - retention_rule
          properties:
            product:
              type: string
              minLength: 1
              maxLength: 200
            identity:
              type: string
              minLength: 1
              maxLength: 200
            time_zone:
              type: string
              minLength: 1
              maxLength: 100
            cohort:
              type: string
              minLength: 1
              maxLength: 2000
            filters:
              type: string
              minLength: 1
              maxLength: 2000
            funnel_rule:
              type: string
              minLength: 1
              maxLength: 2000
            retention_rule:
              type: string
              minLength: 1
              maxLength: 2000
        source_digest:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
        observed_at:
          type: string
          format: date-time
        complete:
          type: boolean
        funnel:
          type: object
          additionalProperties: false
          required:
            - steps
          properties:
            steps:
              type: array
              minItems: 2
              items:
                type: object
                additionalProperties: false
                required:
                  - event
                  - count
                properties:
                  event:
                    type: string
                    minLength: 1
                    maxLength: 300
                  count:
                    type: number
                    minimum: 0
                    maximum: 9007199254740991
        retention:
          type: object
          additionalProperties: false
          required:
            - period
            - eligible
            - returned
          properties:
            period:
              type: string
              minLength: 1
              maxLength: 200
            eligible:
              type: number
              minimum: 0
              maximum: 9007199254740991
            returned:
              type: number
              minimum: 0
              maximum: 9007199254740991
        estimated:
          type: boolean
        comparison_eligible:
          type: boolean
        measurement_context:
          type: object
          required:
            - provider
            - title
            - description
            - query
            - source_artifact
          properties:
            provider:
              type: string
              minLength: 1
            title:
              type: string
            description:
              type: string
            query:
              type: object
              additionalProperties: true
            source_artifact:
              additionalProperties: false
              properties:
                created_at:
                  type: string
                digest:
                  pattern: "^sha256:[0-9a-f]{64}$"
                  type: string
                labels:
                  additionalProperties: false
                  properties:
                    sharing:
                      enum:
                        - local_only
                        - configured_model
                      type: string
                  required:
                    - sharing
                  type: object
                media_type:
                  minLength: 1
                  type: string
                path:
                  minLength: 1
                  type: string
                produced_by:
                  additionalProperties: true
                  type: object
                ref:
                  description: "Where it is: an opaque reference a native artifact tool resolves."
                  minLength: 1
                  type: string
                schema:
                  enum:
                    - runx.artifact.v1
                  type: string
                size_bytes:
                  minimum: 0
                  type: integer
                sources:
                  items:
                    additionalProperties: true
                    type: object
                  type: array
                summary:
                  minLength: 1
                  type: string
              required:
                - schema
                - ref
                - digest
                - size_bytes
                - media_type
                - labels
              title: Artifact
              type: object
              x-runx-packet: true
              x-runx-schema: runx.artifact.v1
          additionalProperties: false
      anyOf:
        - required:
            - funnel
        - required:
            - retention
    optional: true
  selection:
    type: object
    description: Native provider packet artifacts returned by the source read. Null means unavailable; never fabricate descriptors, cached counts, or source receipts.
    required:
      - current
      - baseline
      - notes
    properties:
      current:
        anyOf:
          - additionalProperties: false
            properties:
              created_at:
                type: string
              digest:
                pattern: "^sha256:[0-9a-f]{64}$"
                type: string
              labels:
                additionalProperties: false
                properties:
                  sharing:
                    enum:
                      - local_only
                      - configured_model
                    type: string
                required:
                  - sharing
                type: object
              media_type:
                minLength: 1
                type: string
              path:
                minLength: 1
                type: string
              produced_by:
                additionalProperties: true
                type: object
              ref:
                description: "Where it is: an opaque reference a native artifact tool resolves."
                minLength: 1
                type: string
              schema:
                enum:
                  - runx.artifact.v1
                type: string
              size_bytes:
                minimum: 0
                type: integer
              sources:
                items:
                  additionalProperties: true
                  type: object
                type: array
              summary:
                minLength: 1
                type: string
            required:
              - schema
              - ref
              - digest
              - size_bytes
              - media_type
              - labels
            title: Artifact
            type: object
            x-runx-packet: true
            x-runx-schema: runx.artifact.v1
          - type: "null"
      baseline:
        anyOf:
          - additionalProperties: false
            properties:
              created_at:
                type: string
              digest:
                pattern: "^sha256:[0-9a-f]{64}$"
                type: string
              labels:
                additionalProperties: false
                properties:
                  sharing:
                    enum:
                      - local_only
                      - configured_model
                    type: string
                required:
                  - sharing
                type: object
              media_type:
                minLength: 1
                type: string
              path:
                minLength: 1
                type: string
              produced_by:
                additionalProperties: true
                type: object
              ref:
                description: "Where it is: an opaque reference a native artifact tool resolves."
                minLength: 1
                type: string
              schema:
                enum:
                  - runx.artifact.v1
                type: string
              size_bytes:
                minimum: 0
                type: integer
              sources:
                items:
                  additionalProperties: true
                  type: object
                type: array
              summary:
                minLength: 1
                type: string
            required:
              - schema
              - ref
              - digest
              - size_bytes
              - media_type
              - labels
            title: Artifact
            type: object
            x-runx-packet: true
            x-runx-schema: runx.artifact.v1
          - type: "null"
      notes:
        type: array
        items:
          type: string
    additionalProperties: false
  return_interval:
    type: integer
    default: 1
    description: "Return interval index for retention: 1 means the first interval after cohort entry. Preserves the saved query period/brackets."
    minimum: 1
    optional: true
