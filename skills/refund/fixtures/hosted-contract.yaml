name: refund-hosted-contract
kind: skill
target: ..
runner: refund
operator_journeys:
  - mode: standalone
    confusors:
      - charge
      - pay
    request: Refund this settled charge.
    expected_outcome: Use the original merchant account and payment, approve the exact refund and
      independently confirm settlement.
  - mode: composed
    request: Continue this admitted refund.
    expected_outcome: Reuse the supplied payment reference and refund idempotency evidence.
    prior_evidence:
      - The settled payment reference supplied by the caller.
    must_not_repeat:
      - Do not refund a second time under a new identity.
inputs:
  connector: coinbase/cdp
  request:
    resource: https://seller.example/v1/reports/launch
    payment_id: x402pay_test_001
    amount_minor: 125
    currency: USD
    reason: The report was not delivered.
  idempotency_seed: refund-test-0000001
caller:
  approvals:
    refund: true
  provider_responses:
    principal_id: refund-fixture
    grant:
      grant_id: refund-fixture
      provider: coinbase/cdp
      scopes:
        - payment.x402.merchant.read
        - payment.x402.merchant.write
    operations:
      - operation: payment.x402.merchant.refund
        target: https://seller.example/v1/reports/launch
        access: mutate
        result:
          refund_id: x402refund_test_001
          payment_id: x402pay_test_001
          resource: https://seller.example/v1/reports/launch
          amount_minor: 125
          currency: USD
          status: settled
          refund_settlement_id: "0xcccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc"
          payer: "0x0000000000000000000000000000000000000002"
          pay_to: "0x0000000000000000000000000000000000000001"
          network: eip155:8453
          settled_at: 2026-10-15T01:00:00.000Z
      - operation: payment.x402.merchant.refund.read
        target: https://seller.example/v1/reports/launch
        access: read
        result:
          refund_id: x402refund_test_001
          payment_id: x402pay_test_001
          resource: https://seller.example/v1/reports/launch
          amount_minor: 125
          currency: USD
          status: settled
          refund_settlement_id: "0xcccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc"
          payer: "0x0000000000000000000000000000000000000002"
          pay_to: "0x0000000000000000000000000000000000000001"
          network: eip155:8453
          settled_at: 2026-10-15T01:00:00.000Z
expect:
  status: sealed
  receipt:
    schema: runx.receipt.v1
