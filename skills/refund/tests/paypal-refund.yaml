name: refund-paypal-exact-original-payment
method: refund
setup:
  credentials:
    - paypal
inputs:
  connector: paypal
  request:
    api_host: api-m.sandbox.paypal.com
    account_id: YXZY75W2GKDQE
    payment_id: CAPTURE42
    amount_decimal: "1.00"
    currency: USD
    precision: 2
    original_status: COMPLETED
  idempotency_seed: northstar-refund-42
env:
  PAYPAL_CLIENT_CREDENTIALS: '{"client_id":"fixture-app","client_secret":"fixture-secret"}'
host:
  approvals:
    paypal: true
providers:
  http:
    - request:
        method: POST
        url: https://api-m.sandbox.paypal.com/v1/oauth2/token
        body:
          text: grant_type=client_credentials
      response:
        status: 200
        headers:
          content-type: application/json
        body: '{"access_token":"fixture-private-token","token_type":"Bearer","expires_in":60}'
    - request:
        method: GET
        url: https://api-m.sandbox.paypal.com/v2/payments/captures/CAPTURE42
        body: none
      response:
        status: 200
        headers:
          content-type: application/json
        body: '{"id":"CAPTURE42","status":"COMPLETED","supplementary_data":{"related_ids":{"order_id":"ORDER42"}},"payee":{"merchant_id":"YXZY75W2GKDQE"},"amount":{"value":"1.50","currency_code":"USD"}}'
    - request:
        method: POST
        url: https://api-m.sandbox.paypal.com/v2/payments/captures/CAPTURE42/refund
        body:
          json:
            amount:
              currency_code: USD
              value: "1.00"
            custom_id: 2e69d3d1-42f6-4b3c-83e1-d7f22ddb67fb
      response:
        status: 200
        headers:
          content-type: application/json
        body: '{"id":"REFUND42"}'
    - request:
        method: GET
        url: https://api-m.sandbox.paypal.com/v2/payments/refunds/REFUND42
        body: none
      response:
        status: 200
        headers:
          content-type: application/json
        body: '{"id":"REFUND42","status":"COMPLETED","amount":{"value":"1.00","currency_code":"USD"},"links":[{"rel":"self","method":"GET","href":"https://api-m.sandbox.paypal.com/v2/payments/refunds/REFUND42"},{"rel":"up","method":"GET","href":"https://api-m.sandbox.paypal.com/v2/payments/captures/CAPTURE42"}]}'
expect:
  status: sealed
