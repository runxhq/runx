skill: refund
version: "0.7.0"
catalog: { kind: graph, audience: operator, visibility: public, role: canonical, execution: execute, completion: provider_readback, approval: required, category: payments }
connectors:
  coinbase/cdp:
    operations: [payment.x402.merchant.refund, payment.x402.merchant.refund.read]
runners:
  refund:
    default: true
    inputs:
      resource: { type: string, required: true, description: The HTTPS resource the original payment bought., schema: { format: uri, pattern: '^https://', maxLength: 2000 } }
      payment_ref: { type: string, required: true, description: The settled payment's reference from its charge., schema: { minLength: 1, maxLength: 80 } }
      amount_minor: { type: integer, required: true, description: "Refund amount in minor units, at most what was paid.", schema: { minimum: 1, maximum: 9007199254740991 } }
      currency: { type: string, required: true, description: ISO 4217 code of the original payment., schema: { pattern: '^[A-Z]{3}$' } }
      reason: { type: string, required: true, description: Why the payment is refunded., schema: { minLength: 1, maxLength: 500 } }
      idempotency_seed: { type: string, required: true, description: Stable refund idempotency material., schema: { minLength: 16, maxLength: 200 } }
    result_from: [readback]
    steps:
      - id: refund
        operation: coinbase/cdp/payment.x402.merchant.refund
        idempotency_key: $input.idempotency_seed
        approval:
          reason: Approve this exact refund against the original payment.
          type: payment_refund
        amount: { units: $input.amount_minor, unit: $input.currency }
        result_fields: [refund_ref, payment_ref, resource, amount_minor, currency, status, refund_settlement_ref, payer, pay_to, network, settled_at]
        input: { resource: $input.resource, payment_ref: $input.payment_ref, amount_minor: $input.amount_minor, currency: $input.currency, reason: $input.reason }
      - id: readback
        operation: coinbase/cdp/payment.x402.merchant.refund.read
        result_fields: [refund_ref, payment_ref, resource, amount_minor, currency, status, refund_settlement_ref, payer, pay_to, network, settled_at]
        input: { resource: $input.resource, refund_ref: $steps.refund.provider_operation.result.refund_ref }
        expected_result:
          refund_ref: $steps.refund.provider_operation.result.refund_ref
          payment_ref: $input.payment_ref
          resource: $input.resource
          amount_minor: $input.amount_minor
          currency: $input.currency
          status: settled

harness:
  files: [fixtures/support/composed.graph]
  cases: []
