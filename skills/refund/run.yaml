skill: refund
version: "0.6.6"
catalog: { kind: graph, audience: operator, visibility: public, role: canonical, execution: execute, completion: provider_readback, approval: required, category: payments }
connectors:
  payment:
    operations: [payment.refund, payment.refund.read]
    connector_from: $input.settlement_family
    allowed_connectors: [mpp]
runners:
  refund:
    default: true
    inputs:
      original_receipt_ref: { type: string, required: true, description: Opaque sealed charge receipt reference. }
      refund_request: { type: json, required: true, description: Bounded refund amount and reason. }
      parent_payment_authority: { type: json, required: true, description: Full parent refund authority term. }
      settlement_family: { type: string, required: true, description: Settlement family recorded by the charge receipt. }
      idempotency_key: { type: string, required: true, description: Stable refund idempotency key. }
    result_from: [readback]
    steps:
      - id: refund
        operation: payment/payment.refund
        idempotency_key: $input.idempotency_key
        approval:
          reason: Approve this exact refund against the original payment.
          type: payment_refund
        amount: { units: $input.refund_request.amount_minor, unit: $input.refund_request.currency }
        result_fields: [refund_ref, original_receipt_ref, amount_minor, currency, status]
        input: { original_receipt_ref: $input.original_receipt_ref, refund_request: $input.refund_request, parent_payment_authority: $input.parent_payment_authority }
      - id: readback
        operation: payment/payment.refund.read
        result_fields: [refund_ref, original_receipt_ref, amount_minor, currency, status]
        input: $steps.refund.provider_operation.result
        expected_result: $steps.refund.provider_operation.result

harness:
  files: [fixtures/support/composed.graph]
  cases: []
