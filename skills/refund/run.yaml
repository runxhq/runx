version: "0.7.3"
minimum_runx: 0.12.0
catalog:
  visibility: public
  category: payments
methods:
  refund:
    description: Refund one original confirmed payment through its original merchant connector and independently confirm the exact refund.
    inputs:
      connector:
        type: string
        description: Original payment connector; never choose another rail when reconciliation is uncertain.
        enum:
          - stripe
          - paypal
          - coinbase/cdp
      request:
        description: Exact public arguments from the original connector refund operation input_schema. Inspect that connector; preserve original account, payment, amount and currency. No credentials.
      idempotency_seed:
        type: string
        description: Stable refund idempotency material.
        minLength: 16
        maxLength: 200
    examples:
      - connector: stripe
        request:
          account_id: acct_northstar
          payment_id: pi_northstar
          amount_minor: 100
          currency: usd
        idempotency_seed: northstar-refund-42
      - connector: paypal
        request:
          api_host: api-m.sandbox.paypal.com
          account_id: YXZY75W2GKDQE
          payment_id: CAPTURE42
          amount_decimal: "1.00"
          currency: USD
          precision: 2
          original_status: COMPLETED
        idempotency_seed: northstar-refund-42
      - connector: coinbase/cdp
        request:
          resource: https://seller.example/v1/reports/launch
          payment_id: x402pay_test_001
          amount_minor: 125
          currency: USD
          reason: The report was not delivered.
        idempotency_seed: northstar-refund-42
    result_from:
      - stripe
      - paypal
      - readback
    steps:
      - id: stripe
        when:
          value: $input.connector
          equals: stripe
        operation: stripe/payment.stripe.refund
        inputs: $input.request
        idempotency_key: $input.idempotency_seed
        approval:
          type: payment_refund
          reason: Approve this exact refund against the original merchant payment.
        result:
          required:
            - refund_id
            - payment_id
            - amount_minor
            - currency
            - status
          equals:
            status: succeeded
      - id: paypal
        when:
          value: $input.connector
          equals: paypal
        operation: paypal/payment.paypal.refund
        inputs: $input.request
        idempotency_key: $input.idempotency_seed
        approval:
          type: payment_refund
          reason: Approve this exact refund against the original merchant capture.
        result:
          required:
            - refund_id
            - amount_decimal
            - currency
            - status
            - relationships
          equals:
            status: COMPLETED
      - id: refund
        operation: coinbase/cdp/payment.x402.merchant.refund
        idempotency_key: $input.idempotency_seed
        approval:
          reason: Approve this exact refund against the original payment.
          type: payment_refund
        result:
          required:
            - refund_id
            - payment_id
            - resource
            - amount_minor
            - currency
            - status
            - refund_settlement_id
            - payer
            - pay_to
            - network
            - settled_at
        inputs: $input.request
        when:
          value: $input.connector
          equals: coinbase/cdp
      - id: readback
        operation: coinbase/cdp/payment.x402.merchant.refund.read
        result:
          required:
            - refund_id
            - payment_id
            - resource
            - amount_minor
            - currency
            - status
            - refund_settlement_id
            - payer
            - pay_to
            - network
            - settled_at
          equals:
            refund_id: $steps.refund.provider_operation.result.refund_id
            payment_id: $input.request.payment_id
            resource: $input.request.resource
            amount_minor: $input.request.amount_minor
            currency: $input.request.currency
            status: settled
        inputs:
          resource: $input.request.resource
          refund_id: $steps.refund.provider_operation.result.refund_id
        when:
          value: $input.connector
          equals: coinbase/cdp
