skill: meeting-followup
version: "0.2.2"

catalog:
  kind: graph
  audience: public
  visibility: public
  role: context
  execution: plan
  completion: runtime_receipt
  requires_adapter: false
  approval: none
  owner: zhtwangk

harness:
  cases:
    - name: meeting-followup-grounds-actionable-work
      operator_journeys:
        - mode: standalone
          confusors: [chief-of-staff, work-plan]
          request: Extract grounded follow-up actions from this meeting transcript.
          expected_outcome: Return source-linked owners, actions, due-state caveats, and non-actions without sending reminders.
        - mode: composed
          request: Continue operations from this recorded meeting transcript and attendee evidence.
          expected_outcome: Reuse the supplied transcript and provenance without rereading the meeting source or inventing owners.
          prior_evidence:
            - The bounded transcript, attendee evidence, and source bindings supplied in the fixture.
          must_not_repeat:
            - Do not fetch or transcribe the meeting again.
            - Do not resolve owners or dates beyond the supplied evidence.
      inputs:
        transcript: |
          Alice: We decided to launch the beta after QA signs off.
          Ben: I will prepare the QA checklist by 2026-07-10.
          Chen: I will send the pilot customer list by 2026-07-09.
        attendees: [Alice, Ben, Chen]
      caller:
        answers:
          agent.meeting-followup-synthesize.output:
            followup_draft:
              decision: ready
              decisions:
                - text: Launch the beta after QA signs off.
                  evidence:
                    line_number: 1
                    quote: We decided to launch the beta after QA signs off.
              action_items:
                - task: Prepare the QA checklist.
                  owner: Ben
                  due: "2026-07-10"
                  evidence:
                    line_number: 2
                    quote: I will prepare the QA checklist by 2026-07-10.
                - task: Send the pilot customer list.
                  owner: Chen
                  due: "2026-07-09"
                  evidence:
                    line_number: 3
                    quote: I will send the pilot customer list by 2026-07-09.
              issues: []
      expect:
        status: sealed
        steps: [admit, digest, synthesize, finalize]
        step_outputs:
          finalize:
            subset:
              meeting_followup:
                data:
                  decision: ready
                  validation: { status: pass, findings: [] }
                  task_proposals:
                    - { proposal_id: task_proposal_02_01, owner: Ben, due: "2026-07-10", effect_status: not_created }
                    - { proposal_id: task_proposal_03_02, owner: Chen, due: "2026-07-09", effect_status: not_created }
                  followup_message:
                    delivery_status: not_sent
                    subject: Meeting follow-up
                    recipient_names: [Alice, Ben, Chen]
        receipt: { schema: runx.receipt.v1 }

    - name: meeting-followup-keeps-discussion-non-actionable
      inputs:
        transcript: |
          Alice: We discussed several roadmap options.
          Ben: We should revisit this when research is complete.
        attendees: [Alice, Ben]
      caller:
        answers:
          agent.meeting-followup-synthesize.output:
            followup_draft:
              decision: no_followup
              decisions: []
              action_items: []
              issues: []
      expect:
        status: sealed
        steps: [admit, digest, synthesize, finalize]
        step_outputs:
          finalize:
            subset:
              meeting_followup:
                data:
                  decision: no_followup
                  task_proposals: []
                  validation: { status: pass, findings: [] }
        receipt: { schema: runx.receipt.v1 }

    - name: meeting-followup-contains-invented-owner
      inputs:
        transcript: "Alice: Morgan will file the report by 2026-07-12."
        attendees: [Alice]
      caller:
        answers:
          agent.meeting-followup-synthesize.output:
            followup_draft:
              decision: ready
              decisions: []
              action_items:
                - task: File the report.
                  owner: Morgan
                  due: "2026-07-12"
                  evidence:
                    line_number: 1
                    quote: Morgan will file the report by 2026-07-12.
              issues: []
      expect:
        status: sealed
        step_outputs:
          finalize:
            subset:
              meeting_followup:
                data:
                  decision: needs_clarification
                  task_proposals: []
                  action_items:
                    - { task: File the report., owner: null, owner_text: Morgan, due: "2026-07-12", due_text: "2026-07-12", missing: [owner] }
        receipt: { schema: runx.receipt.v1 }

    - name: meeting-followup-rejects-unevidenced-attendee-owner
      inputs:
        transcript: "Alice: I will file the report by 2026-07-12."
        attendees: [Alice, Ben]
      caller:
        answers:
          agent.meeting-followup-synthesize.output:
            followup_draft:
              decision: ready
              decisions: []
              action_items:
                - task: File the report.
                  owner: Ben
                  due: "2026-07-12"
                  evidence:
                    line_number: 1
                    quote: I will file the report by 2026-07-12.
              issues: []
      expect:
        status: sealed
        step_outputs:
          finalize:
            subset:
              meeting_followup:
                data:
                  decision: needs_clarification
                  task_proposals: []
                  action_items:
                    - { task: File the report., owner: null, owner_text: Ben, due: "2026-07-12", due_text: "2026-07-12", missing: [owner] }
        receipt: { schema: runx.receipt.v1 }

    - name: meeting-followup-does-not-resolve-relative-date
      inputs:
        transcript: "Ben: I will ship the draft tomorrow."
        attendees: [Ben]
      caller:
        answers:
          agent.meeting-followup-synthesize.output:
            followup_draft:
              decision: ready
              decisions: []
              action_items:
                - task: Ship the draft.
                  owner: Ben
                  due: tomorrow
                  evidence:
                    line_number: 1
                    quote: I will ship the draft tomorrow.
              issues: []
      expect:
        status: sealed
        step_outputs:
          finalize:
            subset:
              meeting_followup:
                data:
                  decision: needs_clarification
                  task_proposals: []
                  action_items:
                    - { task: Ship the draft., owner: Ben, owner_text: Ben, due: null, due_text: tomorrow, missing: [due] }
        receipt: { schema: runx.receipt.v1 }

    - name: meeting-followup-rejects-invented-evidence
      inputs:
        transcript: "Ben: I will prepare the checklist by 2026-07-10."
        attendees: [Ben]
      caller:
        answers:
          agent.meeting-followup-synthesize.output:
            followup_draft:
              decision: ready
              decisions: []
              action_items:
                - task: Prepare the checklist.
                  owner: Ben
                  due: "2026-07-10"
                  evidence:
                    line_number: 1
                    quote: Ben will prepare the checklist by 2026-07-10.
              issues: []
      expect:
        status: sealed
        step_outputs:
          finalize:
            subset:
              meeting_followup:
                data:
                  decision: needs_clarification
                  task_proposals: []
                  validation: { status: fail }
        receipt: { schema: runx.receipt.v1 }

    - name: meeting-followup-rejects-partial-source-quote
      inputs:
        transcript: "Ben: I will prepare the checklist by 2026-07-10."
        attendees: [Ben]
      caller:
        answers:
          agent.meeting-followup-synthesize.output:
            followup_draft:
              decision: ready
              decisions: []
              action_items:
                - task: Prepare the checklist.
                  owner: Ben
                  due: "2026-07-10"
                  evidence:
                    line_number: 1
                    quote: prepare the checklist
              issues: []
      expect:
        status: sealed
        step_outputs:
          finalize:
            subset:
              meeting_followup:
                data:
                  decision: needs_clarification
                  task_proposals: []
                  validation: { status: fail }
        receipt: { schema: runx.receipt.v1 }

    - name: meeting-followup-does-not-promote-ambiguous-draft
      inputs:
        transcript: "Ben: I may prepare the checklist by 2026-07-10, but we did not decide."
        attendees: [Ben]
      caller:
        answers:
          agent.meeting-followup-synthesize.output:
            followup_draft:
              decision: needs_clarification
              decisions: []
              action_items:
                - task: Prepare the checklist.
                  owner: Ben
                  due: "2026-07-10"
                  evidence:
                    line_number: 1
                    quote: I may prepare the checklist by 2026-07-10, but we did not decide.
              issues:
                - The speaker described a possibility, not a commitment.
      expect:
        status: sealed
        step_outputs:
          finalize:
            subset:
              meeting_followup:
                data:
                  decision: needs_clarification
                  task_proposals: []
                  validation: { status: pass, findings: [] }
        receipt: { schema: runx.receipt.v1 }

    - name: meeting-followup-needs-transcript
      inputs:
        attendees: [Alice]
      expect:
        status: failure

runners:
  prepare:
    default: true
    inputs:
      transcript:
        type: string
        required: true
        description: Small bounded transcript or meeting notes.
      attendees:
        type: json
        required: true
        description: Non-empty array of attendee names or objects with name fields.
    result_from: [stop, finalize]
    steps:
      - id: admit
        inputs:
          transcript: $input.transcript
          attendees: $input.attendees
        tool: { module: meeting-followup.mjs, export: admitMeeting }
        outputs:
          meeting_evidence: object
        artifacts:
          named_emits: { meeting_evidence: meeting_evidence }

      - id: digest
        tool: data.digest
        context:
          value: admit.meeting_evidence.data

      - id: stop
        when:
          field: admit.meeting_evidence.data.path
          equals: stop
        context:
          meeting_evidence: admit.meeting_evidence.data
          evidence_digest: digest.digest_result.data.digest
        tool: { module: meeting-followup.mjs, export: finalizeMeeting }
        outputs:
          meeting_followup: object
        artifacts:
          named_emits: { meeting_followup: meeting_followup }

      - id: synthesize
        when:
          field: admit.meeting_evidence.data.path
          equals: synthesize
        context:
          meeting_evidence: admit.meeting_evidence.data
          evidence_digest: digest.digest_result.data.digest
        agent: { role: operator, task: meeting-followup-synthesize }
        outputs:
          followup_draft: object
        artifacts:
          named_emits: { followup_draft: followup_draft }

      - id: finalize
        when:
          field: admit.meeting_evidence.data.path
          equals: synthesize
        context:
          meeting_evidence: admit.meeting_evidence.data
          evidence_digest: digest.digest_result.data.digest
          followup_draft: synthesize.followup_draft.data
        tool: { module: meeting-followup.mjs, export: finalizeMeeting }
        outputs:
          meeting_followup: object
        artifacts:
          named_emits: { meeting_followup: meeting_followup }
