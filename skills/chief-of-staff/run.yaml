skill: chief-of-staff
version: "0.3.4"

catalog:
  kind: graph
  audience: operator
  visibility: public
  role: context
  execution: read
  completion: runtime_receipt
  requires_adapter: false
  approval: none
  category: ops

harness:
  cases:
    - name: chief-of-staff-binds-actions-to-sources
      operator_journeys:
        - mode: standalone
          confusors: [meeting-followup, ops-desk]
          request: Turn this bounded mailbox and calendar evidence into an executive action packet.
          expected_outcome: Return source-bound actions, decisions, timing, and review requirements without sending or scheduling.
        - mode: composed
          request: Prepare the executive action packet from these existing mailbox and calendar observations.
          expected_outcome: Reuse supplied messages, events, and provenance without rereading accounts or inventing owners.
          prior_evidence:
            - The bounded mailbox and calendar evidence supplied in the fixture.
          must_not_repeat:
            - Do not query mailbox or calendar providers again.
            - Do not re-resolve source bindings already carried by the observations.
      inputs:
        objective: Prepare the next launch actions.
        as_of: "2026-06-04T12:00:00Z"
        max_age_days: 30
        mail_context:
          threads:
            - { id: thread_1, source_digest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa, observed_at: "2026-06-04T10:00:00Z", summary: Design partner asked for a launch-readiness call., sensitivity: routine }
            - { id: thread_2, source_digest: sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb, observed_at: "2026-06-04T09:00:00Z", summary: Vendor shared a routine status update., sensitivity: routine }
        calendar_context:
          availability: ["2026-06-05T15:00:00Z", "2026-06-05T17:00:00Z"]
          availability_evidence: { source_ref: calendar_availability, source_digest: sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc, observed_at: "2026-06-04T11:00:00Z" }
          events: []
        constraints: { final_send_requires_human: true }
      caller:
        answers:
          agent.chief-of-staff-synthesize.output:
            action_draft:
              decision: ready_for_human_review
              priority_queue:
                - { source_ref: thread_1, priority: high, reason: Active launch request. }
                - { source_ref: thread_2, priority: low, reason: Informational only. }
              draft_replies:
                - { source_ref: thread_1, subject: "Re: launch readiness", body_summary: Acknowledge the request and offer a call. }
              scheduling_proposals:
                - { source_ref: thread_1, proposed_times: ["2026-06-05T15:00:00Z"] }
              risks: [Final reply requires review.]
      expect:
        status: sealed
        steps: [index, synthesize, finalize]
        step_outputs:
          finalize:
            subset:
              action_packet:
                data:
                  decision: ready_for_human_review
                  delivery_status: not_sent
                  calendar_mutated: false
                  source_evidence:
                    - source_ref: thread_1
                      source_digest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
                      provenance: caller_supplied_source_digest
                  validation: { status: pass }
        receipt: { schema: runx.receipt.v1 }

    - name: chief-of-staff-rejects-invented-thread
      inputs:
        objective: Prepare the next action.
        as_of: "2026-06-04T12:00:00Z"
        mail_context:
          threads:
            - { id: thread_1, source_digest: sha256:dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd, observed_at: "2026-06-04T10:00:00Z", summary: A bounded request., sensitivity: routine }
      caller:
        answers:
          agent.chief-of-staff-synthesize.output:
            action_draft:
              decision: ready_for_human_review
              priority_queue:
                - { source_ref: thread_missing, priority: high, reason: Invented. }
              draft_replies: []
              scheduling_proposals: []
              risks: []
      expect:
        status: sealed
        steps: [index, synthesize, finalize]
        step_outputs:
          finalize:
            subset:
              action_packet:
                data:
                  decision: needs_context
                  validation: { status: fail }
        receipt: { schema: runx.receipt.v1 }

    - name: chief-of-staff-forces-sensitive-review
      inputs:
        objective: Prepare the next action.
        as_of: "2026-06-04T12:00:00Z"
        mail_context:
          threads:
            - { id: thread_legal, source_digest: sha256:eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee, observed_at: "2026-06-04T10:00:00Z", summary: Counsel requested contract changes., sensitivity: legal }
      caller:
        answers:
          agent.chief-of-staff-synthesize.output:
            action_draft:
              decision: ready_for_human_review
              priority_queue:
                - { source_ref: thread_legal, priority: high, reason: Contract response is due. }
              draft_replies: []
              scheduling_proposals: []
              risks: []
      expect:
        status: sealed
        steps: [index, synthesize, finalize]
        step_outputs:
          finalize:
            subset:
              action_packet:
                data:
                  decision: manual_review
                  mandatory_review_refs: [thread_legal]
                  delivery_status: not_sent
        receipt: { schema: runx.receipt.v1 }

    - name: chief-of-staff-rejects-unprovenanced-source
      inputs:
        objective: Prepare the next action.
        as_of: "2026-06-04T12:00:00Z"
        mail_context:
          threads:
            - { id: thread_1, observed_at: "2026-06-04T10:00:00Z", summary: A request without upstream provenance., sensitivity: routine }
      expect:
        status: sealed
        steps: [index, reject]
        step_outputs:
          reject:
            subset:
              action_packet:
                data:
                  decision: needs_context
                  delivery_status: not_sent
                  validation: { status: fail }
        receipt: { schema: runx.receipt.v1 }

    - name: chief-of-staff-rejects-stale-source
      inputs:
        objective: Prepare the next action.
        as_of: "2026-06-04T12:00:00Z"
        max_age_days: 30
        mail_context:
          threads:
            - { id: thread_1, source_digest: sha256:ffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffff, observed_at: "2026-04-01T10:00:00Z", summary: A stale request., sensitivity: routine }
      expect:
        status: sealed
        steps: [index, reject]
        step_outputs:
          reject:
            subset:
              action_packet:
                data:
                  decision: needs_context
                  validation: { status: fail }
        receipt: { schema: runx.receipt.v1 }

    - name: chief-of-staff-rejects-unavailable-time
      inputs:
        objective: Prepare the next launch action.
        as_of: "2026-06-04T12:00:00Z"
        mail_context:
          threads:
            - { id: thread_1, source_digest: sha256:1111111111111111111111111111111111111111111111111111111111111111, observed_at: "2026-06-04T10:00:00Z", summary: Design partner requested a call., sensitivity: routine }
        calendar_context:
          availability: ["2026-06-05T15:00:00Z"]
          availability_evidence: { source_ref: calendar_availability, source_digest: sha256:2222222222222222222222222222222222222222222222222222222222222222, observed_at: "2026-06-04T11:00:00Z" }
      caller:
        answers:
          agent.chief-of-staff-synthesize.output:
            action_draft:
              decision: ready_for_human_review
              priority_queue:
                - { source_ref: thread_1, priority: high, reason: Active launch request. }
              draft_replies: []
              scheduling_proposals:
                - { source_ref: thread_1, proposed_times: ["2026-06-05T16:00:00Z"] }
              risks: []
      expect:
        status: sealed
        steps: [index, synthesize, finalize]
        step_outputs:
          finalize:
            subset:
              action_packet:
                data:
                  decision: needs_context
                  validation: { status: fail }
        receipt: { schema: runx.receipt.v1 }

runners:
  exec:
    default: true
    inputs:
      objective:
        type: string
        required: true
        description: Operator goal for this pass.
      as_of:
        type: string
        required: true
        description: Explicit ISO-8601 evaluation time for deterministic freshness checks.
      max_age_days:
        type: number
        required: false
        default: 30
        description: Maximum accepted source age in days.
      mail_context:
        type: json
        required: true
        description: Redacted thread evidence.
      calendar_context:
        type: json
        required: false
        description: Redacted events and availability.
      constraints:
        type: json
        required: false
        description: Tone, ownership, send, and scheduling constraints.
    result_from: [reject, finalize]
    steps:
      - id: index
        inputs:
          objective: $input.objective
          as_of: $input.as_of
          max_age_days: $input.max_age_days
          mail_context: $input.mail_context
          calendar_context: $input.calendar_context
        tool: { module: chief-of-staff.mjs, export: indexContext }
        outputs:
          context_index: object
        artifacts:
          named_emits:
            context_index: context_index

      - id: reject
        when:
          value: $steps.index.context_index.decision
          equals: needs_context
        inputs:
          context_index: $steps.index.context_index
        tool: { module: chief-of-staff.mjs, export: finalizeActions }
        outputs:
          action_packet:
            type: object
            schema:
              required: [decision, priority_queue, draft_replies, scheduling_proposals, risks, source_evidence, mandatory_review_refs, delivery_status, calendar_mutated, validation]
              additionalProperties: false
              properties:
                decision: { type: string, enum: [ready_for_human_review, manual_review, needs_context] }
                priority_queue:
                  type: array
                  maxItems: 200
                  items:
                    type: object
                    required: [source_ref, priority, reason]
                    additionalProperties: false
                    properties:
                      source_ref: { type: string, minLength: 1, maxLength: 1000 }
                      priority: { type: string, enum: [high, medium, low] }
                      reason: { type: string, minLength: 1, maxLength: 4000 }
                draft_replies:
                  type: array
                  maxItems: 200
                  items:
                    type: object
                    required: [source_ref, subject, body_summary]
                    additionalProperties: false
                    properties:
                      source_ref: { type: string, minLength: 1, maxLength: 1000 }
                      subject: { type: string, minLength: 1, maxLength: 1000 }
                      body_summary: { type: string, minLength: 1, maxLength: 10000 }
                scheduling_proposals:
                  type: array
                  maxItems: 200
                  items:
                    type: object
                    required: [source_ref, proposed_times]
                    additionalProperties: false
                    properties:
                      source_ref: { type: string, minLength: 1, maxLength: 1000 }
                      proposed_times: { type: array, minItems: 1, maxItems: 50, uniqueItems: true, items: { type: string, minLength: 1, maxLength: 200 } }
                risks: { type: array, maxItems: 200, items: { type: string, minLength: 1, maxLength: 4000 } }
                source_evidence:
                  type: array
                  maxItems: 201
                  items:
                    type: object
                    required: [source_ref, source_digest, kind, sensitivity, observed_at, provenance]
                    additionalProperties: false
                    properties:
                      source_ref: { type: string, minLength: 1, maxLength: 1000 }
                      source_digest: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
                      kind: { type: string, enum: [thread, event, availability] }
                      sensitivity: { type: string, minLength: 1, maxLength: 100 }
                      observed_at: { type: string, format: date-time }
                      provenance: { const: caller_supplied_source_digest }
                mandatory_review_refs: { type: array, maxItems: 200, uniqueItems: true, items: { type: string, minLength: 1, maxLength: 1000 } }
                delivery_status: { const: not_sent }
                calendar_mutated: { const: false }
                validation:
                  type: object
                  required: [status, findings]
                  additionalProperties: false
                  properties:
                    status: { type: string, enum: [pass, fail] }
                    findings:
                      type: array
                      maxItems: 250
                      items:
                        type: object
                        required: [code, message]
                        additionalProperties: false
                        properties:
                          code: { type: string, minLength: 1, maxLength: 200 }
                          message: { type: string, minLength: 1, maxLength: 4000 }
        artifacts:
          named_emits:
            action_packet: action_packet
          packets:
            action_packet: runx.ops.inbox_calendar_action_packet.v1

      - id: synthesize
        when:
          value: $steps.index.context_index.decision
          equals: ready
        agent: { role: operator, task: chief-of-staff-synthesize }
        outputs:
          action_draft: object
        inputs:
          objective: $input.objective
          constraints: $input.constraints
          context_index: $steps.index.context_index
          as_of: $input.as_of
          max_age_days: $input.max_age_days
          mail_context: $input.mail_context
          calendar_context: $input.calendar_context
        artifacts:
          named_emits:
            action_draft: action_draft

      - id: finalize
        when:
          value: $steps.index.context_index.decision
          equals: ready
        inputs:
          context_index: $steps.index.context_index
          action_draft: $steps.synthesize.action_draft
        tool: { module: chief-of-staff.mjs, export: finalizeActions }
        outputs:
          action_packet: object
        artifacts:
          named_emits:
            action_packet: action_packet
          packets:
            action_packet: runx.ops.inbox_calendar_action_packet.v1
