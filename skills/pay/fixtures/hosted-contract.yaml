name: pay-hosted-contract
kind: skill
target: ..
runner: pay
operator_journeys:
  - { mode: standalone, confusors: [charge, invoice-pay], request: Pay this exact x402 resource., expected_outcome: Require hosted wallet authority and return provider plus resource readback. }
  - mode: composed
    request: Continue this admitted payment.
    expected_outcome: Reuse supplied resource terms, authority, and retry identity.
    prior_evidence: [The admitted x402 resource terms supplied by the caller.]
    must_not_repeat: [Do not mint a second x402 payment identity.]
inputs:
  payment_signal:
    resource:
      url: https://vendor.example/v1/invocations
      method: POST
      body: { offer_id: document-ocr, input: { artifact_ref: "runx:artifact:document-1" } }
      max_response_bytes: 26214400
    amount_minor: 25
    pay_to: "0x0000000000000000000000000000000000000002"
  parent_payment_authority:
    term_id: authority-test-1
    currency: USD
    max_amount_minor: 25
    counterparty: https://vendor.example/v1/invocations
  idempotency_seed: pay-test-payment-001
caller:
  approvals: { "settle#pay": true }
  provider_responses:
    principal_id: pay-fixture
    grant: { grant_id: pay-fixture, provider: wallet/evm, scopes: [payment.x402, payment.x402.read] }
    operations:
      - operation: payment.x402
        target: https://vendor.example/v1/invocations
        access: mutate
        result: { payment_ref: payment_x402_001, challenge_id: ch_test_001, amount_minor: 25, currency: USD, status: settled, transaction: "0xaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa", network: "eip155:8453", payer: "0x0000000000000000000000000000000000000001", pay_to: "0x0000000000000000000000000000000000000002", invocation_id: ausca-invocation-1, payment_required_digest: "sha256:1111111111111111111111111111111111111111111111111111111111111111", payment_response_digest: "sha256:2222222222222222222222222222222222222222222222222222222222222222", resource_status: 202 }
      - operation: payment.x402.read
        target: https://vendor.example/v1/invocations
        access: read
        result: { payment_ref: payment_x402_001, challenge_id: ch_test_001, amount_minor: 25, currency: USD, status: settled, transaction: "0xaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa", network: "eip155:8453", payer: "0x0000000000000000000000000000000000000001", pay_to: "0x0000000000000000000000000000000000000002", invocation_id: ausca-invocation-1, payment_required_digest: "sha256:1111111111111111111111111111111111111111111111111111111111111111", payment_response_digest: "sha256:2222222222222222222222222222222222222222222222222222222222222222", resource_status: 200, resource_result: { invocation: { state: succeeded, receipt_ref: { type: receipt, uri: "runx:receipt:inner-1" } } }, readback_status: complete, finality: confirmed, block_number: "123" }
expect: { status: sealed, receipt: { schema: runx.receipt.v1 } }
