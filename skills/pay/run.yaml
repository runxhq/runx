skill: pay
version: "0.1.1"
catalog: { kind: graph, audience: operator, visibility: public, role: canonical, execution: execute, completion: provider_readback, approval: required, category: payments }
input_definitions:
  payment_signal:
    type: object
    required: true
    description: Exact x402 V2 resource request and expected settlement terms.
    schema:
      additionalProperties: false
      required: [resource, amount_minor]
      properties:
        resource:
          type: object
          additionalProperties: false
          required: [url, method, body]
          properties:
            url: { type: string, format: uri, maxLength: 2048 }
            method: { type: string, const: POST }
            body: {}
            headers:
              type: object
              additionalProperties: { type: string, maxLength: 4096 }
            timeout_ms: { type: integer, minimum: 1, maximum: 120000 }
            max_response_bytes: { type: integer, minimum: 1, maximum: 26214400 }
        amount_minor: { type: integer, minimum: 0, maximum: 9007199254740991 }
        pay_to: { type: string, pattern: '^0x[0-9a-fA-F]{40}$' }
  payment_authority:
    type: object
    required: true
    description: Exact USD maximum and counterparty authorized by the parent.
    schema:
      additionalProperties: false
      required: [term_id, currency, max_amount_minor, counterparty]
      properties:
        term_id: { type: string, minLength: 1, maxLength: 256 }
        currency: { type: string, const: USD }
        max_amount_minor: { type: integer, minimum: 0, maximum: 9007199254740991 }
        counterparty: { type: string, format: uri, maxLength: 2048 }
connectors:
  wallet/evm:
    operations: [payment.x402, payment.x402.read]
runners:
  pay:
    default: true
    inputs:
      payment_signal: { definition: payment_signal }
      parent_payment_authority: { definition: payment_authority }
      idempotency_seed: { type: string, required: true, description: Stable payment idempotency material, schema: { minLength: 16, maxLength: 500 } }
    result_from: [readback]
    steps:
      - id: settle
        skill: .
        runner: settle
        inputs:
          payment_signal: $input.payment_signal
          parent_payment_authority: $input.parent_payment_authority
          idempotency_seed: $input.idempotency_seed
      - id: readback
        skill: .
        runner: readback
        inputs:
          resource_url: $input.payment_signal.resource.url
          payment_ref: $steps.settle.provider_operation.result.payment_ref
      - id: verify
        inputs:
          readback: $steps.readback.provider_operation.result
        tool: { module: readback.mjs, export: requireCompleteReadback, timeout_seconds: 5 }
        outputs: { verified: object }

  settle:
    inputs:
      payment_signal: { definition: payment_signal }
      parent_payment_authority: { definition: payment_authority }
      idempotency_seed: { type: string, required: true, description: Stable payment idempotency material, schema: { minLength: 16, maxLength: 500 } }
    examples:
      - payment_signal:
          resource:
            url: https://vendor.example/v1/invocations
            method: POST
            body: { offer_id: document-ocr, input: { artifact_ref: "runx:artifact:document-1" } }
            max_response_bytes: 26214400
          amount_minor: 25
          pay_to: "0x0000000000000000000000000000000000000002"
        parent_payment_authority:
          term_id: document-ocr-purchase-1
          currency: USD
          max_amount_minor: 25
          counterparty: https://vendor.example/v1/invocations
        idempotency_seed: document-ocr-purchase-0001
    result_from: [pay]
    steps:
      - id: pay
        operation: wallet/evm/payment.x402
        idempotency_key: $input.idempotency_seed
        approval:
          reason: Approve paying this exact x402 challenge.
          type: x402_payment
        amount: { units: $input.payment_signal.amount_minor, unit: $input.parent_payment_authority.currency }
        result_fields: [payment_ref, challenge_id, amount_minor, currency, status, transaction, network, payer, pay_to, invocation_id, payment_required_digest, payment_response_digest]
        input: { payment_signal: $input.payment_signal, parent_payment_authority: $input.parent_payment_authority }
  readback:
    inputs:
      resource_url:
        type: string
        required: true
        description: Exact HTTPS resource URL used for settlement.
        schema: { format: uri, maxLength: 2048 }
      payment_ref:
        type: string
        required: true
        description: Durable payment reference returned by the settle runner.
        schema: { minLength: 1, maxLength: 300 }
    result_from: [readback]
    steps:
      - id: prepare
        inputs: { payment_ref: $input.payment_ref, resource_url: $input.resource_url }
        tool: { module: readback.mjs, export: prepareReadback, timeout_seconds: 5 }
        outputs: { readback_request: object, expected_result: object }
      - id: readback
        operation: wallet/evm/payment.x402.read
        result_fields: [payment_ref, challenge_id, amount_minor, currency, status, transaction, network, payer, pay_to, invocation_id, payment_required_digest, payment_response_digest, resource_status, resource_result, readback_status]
        optional_result_fields: [resource_state, finality, block_number]
        ephemeral_result_paths: [/resource_result/resource_access]
        input: $steps.prepare.readback_request
        expected_result: $steps.prepare.expected_result

harness:
  files: [fixtures/support/composed.graph]
  cases: []
