skill: answer-from-docs
version: "0.2.2"

catalog:
  kind: graph
  audience: public
  visibility: public
  role: context
  execution: read
  completion: runtime_receipt
  requires_adapter: false
  approval: none
  owner: zhtwangk

harness:
  cases:
    - name: answer-from-docs-grounds-supported-answer
      operator_journeys:
        - mode: standalone
          confusors: [research, knowledge-router]
          request: Answer this question from the supplied documentation and cite the supporting source.
          expected_outcome: Return a supported answer with exact source binding and no invented quotation.
        - mode: composed
          request: Answer from this already selected documentation evidence.
          expected_outcome: Reuse the supplied source packet without searching or fetching the documentation again.
          prior_evidence:
            - The bounded documentation source and question supplied in the fixture.
          must_not_repeat:
            - Do not search for or fetch replacement sources.
            - Do not reconstruct citations already bound to the source packet.
      inputs:
        question: How long are audit logs retained and who can export them?
        corpus:
          - id: audit-logs
            title: Audit Log Policy
            text: Audit logs are retained for 180 days. Workspace admins can export audit logs from the compliance page.
          - id: billing
            title: Billing Notes
            text: Billing invoices are generated monthly.
      caller:
        answers:
          agent.answer-from-docs-synthesize.output:
            answer_draft:
              decision: answered
              answer:
                text: Audit logs are retained for 180 days, and workspace admins can export them from the compliance page.
                citations:
                  - source_id: audit-logs
                    quote: Audit logs are retained for 180 days.
                  - source_id: audit-logs
                    quote: Workspace admins can export audit logs from the compliance page.
              kb_gaps: []
              conflicts: []
      expect:
        status: sealed
        steps: [digest, synthesize, finalize]
        step_outputs:
          finalize:
            subset:
              grounded_answer:
                data:
                  decision: answered
                  grounded: true
                  validation: { status: pass, findings: [] }
        receipt: { schema: runx.receipt.v1 }

    - name: answer-from-docs-refuses-unsupported-question
      inputs:
        question: Does the product support SCIM provisioning?
        corpus:
          - id: audit-logs
            title: Audit Log Policy
            text: Audit logs are retained for 180 days.
      caller:
        answers:
          agent.answer-from-docs-synthesize.output:
            answer_draft:
              decision: unsupported
              answer: { text: "", citations: [] }
              kb_gaps:
                - Documentation describing identity provisioning support.
              conflicts: []
      expect:
        status: sealed
        steps: [digest, synthesize, finalize]
        step_outputs:
          finalize:
            subset:
              grounded_answer:
                data:
                  decision: unsupported
                  grounded: false
                  validation: { status: pass, findings: [] }
        receipt: { schema: runx.receipt.v1 }

    - name: answer-from-docs-rejects-invented-quotation
      inputs:
        question: How long are audit logs retained?
        corpus:
          - id: audit-logs
            title: Audit Log Policy
            text: Audit logs are retained for 180 days.
      caller:
        answers:
          agent.answer-from-docs-synthesize.output:
            answer_draft:
              decision: answered
              answer:
                text: Audit logs are retained forever.
                citations:
                  - source_id: audit-logs
                    quote: Audit logs are retained forever.
              kb_gaps: []
              conflicts: []
      expect:
        status: sealed
        steps: [digest, synthesize, finalize]
        step_outputs:
          finalize:
            subset:
              grounded_answer:
                data:
                  decision: unsupported
                  grounded: false
                  validation: { status: fail }
        receipt: { schema: runx.receipt.v1 }

    - name: answer-from-docs-needs-question
      inputs:
        corpus:
          - id: docs
            title: Docs
            text: The API returns JSON.
      expect:
        status: failure

runners:
  answer:
    default: true
    inputs:
      question:
        type: string
        required: true
        description: One concrete question to answer from the supplied corpus.
      corpus:
        type: json
        required: true
        description: Small bounded array of source objects with stable id, title, and text fields.
    result_from: [finalize]
    steps:
      - id: digest
        tool: data.digest
        inputs:
          value: $input.corpus

      - id: synthesize
        label: draft an evidence-bound answer or refusal
        inputs:
          question: $input.question
          corpus: $input.corpus
        context:
          corpus_digest: digest.digest_result.data.digest
        agent: { role: researcher, task: answer-from-docs-synthesize }
        outputs:
          answer_draft: object
        artifacts:
          named_emits:
            answer_draft: answer_draft

      - id: finalize
        label: validate citations and package the grounded answer
        inputs:
          question: $input.question
          corpus: $input.corpus
        context:
          corpus_digest: digest.digest_result.data.digest
          answer_draft: synthesize.answer_draft.data
        tool: { module: answer-from-docs.mjs, export: finalizeGroundedAnswer }
        outputs:
          grounded_answer: object
        artifacts:
          named_emits:
            grounded_answer: grounded_answer
