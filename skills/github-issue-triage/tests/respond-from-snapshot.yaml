name: github-issue-triage-drafts-from-one-snapshot
method: respond
inputs:
  issue_snapshot:
    repository: runxhq/runx
    number: "241"
    title: Sourcey output path is unclear
    state: open
    body: The docs mention two different output directories.
    source_locator: github:runxhq/runx/issues/241
  objective: Draft the next helpful maintainer response.
host:
  answers:
    draft:
      issue_profile:
        repository: runxhq/runx
        number: "241"
        title: Sourcey output path is unclear
        state: open
        summary: The documentation conflicts about the output directory.
      response_strategy:
        stance: acknowledge and clarify
      response_draft:
        channel: github_issue_comment
        body: Thanks for flagging this. The canonical path is being verified before we update the conflicting documentation.
      follow_up_actions:
        - Verify the canonical path.
        - Correct the conflicting documentation.
expect:
  status: sealed
  steps: [digest-snapshot, admit, draft, finalize]
  step_outputs:
    finalize:
      subset:
        issue_triage_packet:
          data:
            decision: draft_ready
            delivery_status: not_sent
            provider_status: supplied_snapshot
  receipt: {schema: runx.receipt.v1}
