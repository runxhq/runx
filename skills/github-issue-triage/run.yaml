version: "0.4.13"
minimum_runx: 0.12.0
default_method: provider-respond
catalog:
  visibility: public
  category: ops
shared_inputs:
  repository:
    type: string
    description: GitHub repository as owner/name.
    pattern: ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$
    examples:
      - runxhq/runx
  issue_number:
    type: string
    description: Positive GitHub issue number.
    pattern: ^[1-9][0-9]*$
    examples:
      - "241"
  issue_snapshot:
    type: object
    description: One bounded GitHub issue snapshot from a declared provider or supplied source.
    required:
      - repository
      - number
      - title
      - state
      - body
    additionalProperties: false
    properties:
      repository:
        type: string
        pattern: ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$
      number:
        type: string
        pattern: ^[1-9][0-9]*$
      title:
        type: string
        minLength: 1
        maxLength: 256
        pattern: ^[^\u0000]+$
      state:
        type: string
        enum:
          - open
          - closed
      body:
        type: string
        maxLength: 65536
        pattern: ^[^\u0000]*$
      source_locator:
        type: string
        minLength: 1
        maxLength: 1024
  issue_snapshots:
    type: array
    description: One to 100 bounded GitHub issue snapshots from declared providers or supplied sources.
    minItems: 1
    maxItems: 100
    items:
      type: object
      required:
        - repository
        - number
        - title
        - state
        - body
      additionalProperties: false
      properties:
        repository:
          type: string
          pattern: ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$
        number:
          type: string
          pattern: ^[1-9][0-9]*$
        title:
          type: string
          minLength: 1
          maxLength: 256
          pattern: ^[^\u0000]+$
        state:
          type: string
          enum:
            - open
            - closed
        body:
          type: string
          maxLength: 65536
          pattern: ^[^\u0000]*$
        source_locator:
          type: string
          minLength: 1
          maxLength: 1024
methods:
  provider-respond:
    description: Read one issue from GitHub and draft the maintainer's next action, its profile, posture, reply and follow-up. Posts nothing.
    inputs:
      repository: {}
      issue_number: {}
      objective:
        type: string
        description: Desired outcome for the draft response.
        optional: true
      maintainer_context:
        type: string
        description: Repository norms, tone, and release posture.
        optional: true
    examples:
      - repository: runxhq/runx
        issue_number: "241"
        objective: Draft the next helpful maintainer response.
    result_from:
      - finalize
    steps:
      - id: read-issue
        operation: github/issue.read
        inputs:
          repository: $input.repository
          number: $input.issue_number
      - id: digest-snapshot
        tool: data.digest
        inputs:
          value: $steps.read-issue.provider_operation.result.issue
      - id: admit
        inputs:
          repository: $input.repository
          issue_snapshot: $steps.read-issue.provider_operation.result.issue
          provider_operation: $steps.read-issue.provider_operation
          snapshot_digest: $steps.digest-snapshot.digest_result.digest
        tool:
          module: github-issue-triage.mjs
          export: admitIssue
        outputs:
          issue_evidence: {type: object}
      - id: draft
        agent: github-issue-triage-respond
        outputs:
          issue_profile:
            type: object
            properties:
              repository:
                type: string
              number:
                type: string
              title:
                type: string
              state:
                type: string
              summary:
                type: string
            required:
              - repository
              - number
              - title
              - state
          response_strategy:
            type: object
            properties:
              stance:
                type: string
            required:
              - stance
          response_draft:
            type: object
            properties:
              channel:
                type: string
              body:
                type: string
            required:
              - channel
              - body
          follow_up_actions: {type: array}
        inputs:
          objective: $input.objective
          maintainer_context: $input.maintainer_context
          issue_evidence: $steps.admit.issue_evidence
          repository: $input.repository
          issue_number: $input.issue_number
      - id: finalize
        inputs:
          issue_evidence: $steps.admit.issue_evidence
          issue_profile: $steps.draft.issue_profile
          response_strategy: $steps.draft.response_strategy
          response_draft: $steps.draft.response_draft
          follow_up_actions: $steps.draft.follow_up_actions
        tool:
          module: github-issue-triage.mjs
          export: finalizeResponse
        outputs:
          issue_triage_packet: {type: object, packet: runx/github-issue-triage.triage.v1}
  discover:
    description: Pick the issue that most deserves attention from a queue of issue snapshots you supply.
    inputs:
      issue_snapshots: {}
      query:
        type: string
        description: Selection objective for this bounded issue set.
        minLength: 1
        maxLength: 2000
      maintainer_context:
        type: string
        description: Repository norms and response constraints.
        optional: true
    examples:
      - query: Find unanswered issues where a maintainer response would unblock progress.
        issue_snapshots:
          - repository: runxhq/runx
            number: "241"
            title: Sourcey output path is unclear
            state: open
            body: The docs name two different output directories.
    result_from:
      - finalize
    steps:
      - id: digest-snapshots
        tool: data.digest
        inputs:
          value: $input.issue_snapshots
      - id: index
        inputs:
          issue_snapshots: $input.issue_snapshots
          query: $input.query
          snapshot_digest: $steps.digest-snapshots.digest_result.digest
        tool:
          module: github-issue-triage.mjs
          export: indexIssues
        outputs:
          issue_index: {type: object}
      - id: select
        agent: github-issue-triage-discover
        outputs:
          issue_candidates: {type: array}
          selection_rationale:
            type: object
            properties:
              chosen_issue:
                type: string
              rationale:
                type: string
            required:
              - chosen_issue
              - rationale
        inputs:
          maintainer_context: $input.maintainer_context
          issue_index: $steps.index.issue_index
          issue_snapshots: $input.issue_snapshots
          query: $input.query
      - id: finalize
        inputs:
          issue_index: $steps.index.issue_index
          issue_candidates: $steps.select.issue_candidates
          selection_rationale: $steps.select.selection_rationale
        tool:
          module: github-issue-triage.mjs
          export: finalizeDiscovery
        outputs:
          issue_triage_queue: {type: object, packet: runx/github-issue-triage.queue.v1}
  respond:
    description: Draft the next action for one issue snapshot you already hold, or replay one. Posts nothing.
    inputs:
      issue_snapshot: {}
      objective:
        type: string
        description: Desired outcome for the draft response.
        optional: true
      maintainer_context:
        type: string
        description: Repository norms, tone, and release posture.
        optional: true
    examples:
      - issue_snapshot:
          repository: runxhq/runx
          number: "241"
          title: Sourcey output path is unclear
          state: open
          body: The docs name two different output directories.
        objective: Draft the next helpful maintainer response.
    result_from:
      - finalize
    steps:
      - id: digest-snapshot
        tool: data.digest
        inputs:
          value: $input.issue_snapshot
      - id: admit
        inputs:
          issue_snapshot: $input.issue_snapshot
          snapshot_digest: $steps.digest-snapshot.digest_result.digest
        tool:
          module: github-issue-triage.mjs
          export: admitIssue
        outputs:
          issue_evidence: {type: object}
      - id: draft
        agent: github-issue-triage-respond
        outputs:
          issue_profile:
            type: object
            properties:
              repository:
                type: string
              number:
                type: string
              title:
                type: string
              state:
                type: string
              summary:
                type: string
            required:
              - repository
              - number
              - title
              - state
          response_strategy:
            type: object
            properties:
              stance:
                type: string
            required:
              - stance
          response_draft:
            type: object
            properties:
              channel:
                type: string
              body:
                type: string
            required:
              - channel
              - body
          follow_up_actions: {type: array}
        inputs:
          objective: $input.objective
          maintainer_context: $input.maintainer_context
          issue_evidence: $steps.admit.issue_evidence
          issue_snapshot: $input.issue_snapshot
      - id: finalize
        inputs:
          issue_evidence: $steps.admit.issue_evidence
          issue_profile: $steps.draft.issue_profile
          response_strategy: $steps.draft.response_strategy
          response_draft: $steps.draft.response_draft
          follow_up_actions: $steps.draft.follow_up_actions
        tool:
          module: github-issue-triage.mjs
          export: finalizeResponse
        outputs:
          issue_triage_packet: {type: object, packet: runx/github-issue-triage.triage.v1}
  post:
    description: Post the exact accepted reply of a triage packet as an issue comment, read back.
    inputs:
      issue_triage_packet:
        packet: runx/github-issue-triage.triage.v1
        description: Exact draft-ready packet emitted by provider-respond or respond.
      idempotency_key:
        type: string
        description: Stable retry key for this exact issue comment.
    result_from:
      - post-comment
    steps:
      - id: validate
        tool: data.compare
        inputs:
          actual:
            decision: $input.issue_triage_packet.decision
            validation: $input.issue_triage_packet.validation.status
            delivery_status: $input.issue_triage_packet.delivery_status
            channel: $input.issue_triage_packet.response_draft.channel
          expected:
            decision: draft_ready
            validation: pass
            delivery_status: not_sent
            channel: github_issue_comment
      - id: post-comment
        when:
          value: $steps.validate.comparison.equal
          equals: true
        operation: github/comments.create
        idempotency_key: $input.idempotency_key
        inputs:
          repository: $input.issue_triage_packet.issue_profile.repository
          comments:
            - number: $input.issue_triage_packet.issue_profile.number
              body: $input.issue_triage_packet.response_draft.body
