skill: ecosystem-brief
version: "0.2.5"

catalog:
  kind: graph
  audience: public
  visibility: public
  role: context
  execution: read
  completion: runtime_receipt
  requires_adapter: false
  approval: none

harness:
  cases:
    - name: ecosystem-brief-produces-fresh-bound-brief
      operator_journeys:
        - mode: standalone
          confusors: [deep-research, research]
          request: Produce a fresh decision-ready ecosystem brief from these bounded sources.
          expected_outcome: Return a concise evidence-bound ecosystem briefing with source freshness and uncertainty explicit.
        - mode: composed
          request: Brief the operator from this already collected ecosystem evidence.
          expected_outcome: Reuse fresh research packets and source bindings without repeating market discovery.
          prior_evidence:
            - The bounded fresh ecosystem sources and research evidence supplied in the fixture.
          must_not_repeat:
            - Do not rediscover the ecosystem source set.
            - Do not refetch evidence already bound into the research packet.
      inputs:
        objective: Identify the strongest architectural signal in the supplied Runx evidence.
        audience: operators
        channel: brief
        domain: agent infrastructure
        as_of: "2026-07-17T12:00:00Z"
        max_age_hours: 24
        source_packets:
          - decision: ready
            final_url: https://example.com/receipts
            status: 200
            content_digest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
            extracted: Runx receipts bind operator actions to explicit authority and verification evidence.
            provenance:
              fetched_at: "2026-07-17T00:00:00Z"
              bytes: 82
              truncated: false
              redirects: []
          - decision: ready
            final_url: https://example.com/skills
            status: 200
            content_digest: sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
            extracted: Portable skill packages separate model judgment from deterministic provider operations.
            provenance:
              fetched_at: "2026-07-17T00:01:00Z"
              bytes: 85
              truncated: false
              redirects: []
      caller:
        answers:
          agent_task.research-synthesize.output:
            research_candidate:
              decision: ready
              research_brief:
                objective: Identify the strongest architectural signal in the supplied Runx evidence.
                scope: agent infrastructure
                summary: The strongest signal is evidence-bound execution packaged behind portable skills.
                open_questions: []
              evidence_log:
                - claim: Receipts bind actions to authority and verification evidence.
                  source_digest: sha256:9056e1b5caa4e78583d0bc47bb731468b31155929a3aa3a35fcadf6136534a36
                  content_digest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
                  confidence: verified
                  relevance: Establishes the governance half of the architecture.
                - claim: Portable skills separate judgment from deterministic operations.
                  source_digest: sha256:c951e0e102215f739709aa280773536f95d4560e1299999af9c2362db6a118dc
                  content_digest: sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
                  confidence: verified
                  relevance: Establishes the packaging and execution half.
              decision_support:
                - option: Lead with evidence-bound portable execution.
                  rationale: Both supplied sources support the combined architecture.
                  source_digests:
                    - sha256:9056e1b5caa4e78583d0bc47bb731468b31155929a3aa3a35fcadf6136534a36
                    - sha256:c951e0e102215f739709aa280773536f95d4560e1299999af9c2362db6a118dc
              risks: []
          agent_task.ghostwrite-draft.output:
            content_draft:
              decision: ready
              content_brief:
                objective: Identify the strongest architectural signal in the supplied Runx evidence.
                audience: operators
                channel: brief
              draft:
                title: Evidence-bound execution is the architecture
                body: Runx binds operator actions to authority evidence and packages deterministic operations behind portable skills.
                claim_refs:
                  - claim: Receipts bind operator actions to authority evidence.
                    source_digests:
                      - sha256:9056e1b5caa4e78583d0bc47bb731468b31155929a3aa3a35fcadf6136534a36
                  - claim: Portable skills separate judgment from deterministic operations.
                    source_digests:
                      - sha256:c951e0e102215f739709aa280773536f95d4560e1299999af9c2362db6a118dc
              review_checklist:
                - Confirm both source bindings remain present.
              distribution_notes:
                primary_channel: brief
              context_binding: { applied: [] }
      expect:
        status: sealed
        steps:
          - freshness
          - research-topic
          - draft-brief
        step_outputs:
          freshness:
            subset:
              freshness_report:
                data:
                  decision: ready
                  accepted_count: 2
          research-topic:
            subset:
              research_packet:
                data:
                  decision: ready
                  validation:
                    status: pass
          draft-brief:
            subset:
              content_draft_packet:
                data:
                  decision: ready
                  validation:
                    status: pass
        receipt:
          schema: runx.receipt.v1

    - name: ecosystem-brief-stops-before-drafting-without-sources
      inputs:
        objective: Decide whether the supplied claim is ready.
        audience: operators
        channel: brief
        source_packets: []
        as_of: "2026-07-17T12:00:00Z"
        max_age_hours: 24
      expect:
        status: sealed
        steps:
          - freshness
          - research-topic
        step_outputs:
          freshness:
            subset:
              freshness_report:
                data:
                  decision: needs_more_evidence
                  accepted_count: 0
          research-topic:
            subset:
              research_packet:
                data:
                  decision: needs_more_evidence
                  validation:
                    status: fail
        receipt:
          schema: runx.receipt.v1

    - name: ecosystem-brief-rejects-stale-source-before-research
      inputs:
        objective: Identify the current ecosystem signal.
        audience: operators
        channel: brief
        as_of: "2026-07-17T12:00:00Z"
        max_age_hours: 24
        source_packets:
          - decision: ready
            final_url: https://example.com/stale
            status: 200
            content_digest: sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
            extracted: This evidence is too old for a current ecosystem brief.
            provenance:
              fetched_at: "2026-07-10T12:00:00Z"
              bytes: 57
              truncated: false
              redirects: []
      expect:
        status: sealed
        steps:
          - freshness
          - research-topic
        step_outputs:
          freshness:
            subset:
              freshness_report:
                data:
                  decision: needs_more_evidence
                  accepted_count: 0
          research-topic:
            subset:
              research_packet:
                data:
                  decision: needs_more_evidence
                  validation:
                    status: fail
        receipt:
          schema: runx.receipt.v1

runners:
  ecosystem-brief:
    default: true
    type: graph
    inputs:
      objective:
        type: string
        required: true
        description: What the content must accomplish.
      source_packets:
        type: json
        required: true
        description: Bounded governed source packets, normally web-fetch provider operation evidence.
      audience:
        type: string
        required: false
        default: operators
        description: Intended reader for the draft.
      channel:
        type: string
        required: false
        default: brief
        description: Intended content channel; this runner does not deliver it.
      domain:
        type: string
        required: false
        description: Domain context for interpretation.
      as_of:
        type: string
        required: true
        description: Explicit ISO-8601 evaluation time used for reproducible freshness checks.
      max_age_hours:
        type: number
        required: false
        default: 168
        description: Maximum accepted source age in hours.
      operator_context:
        type: string
        required: false
        description: Local constraints that do not count as evidence.
      target_entities:
        type: json
        required: false
        description: Entities to include or compare.
    graph:
      name: ecosystem-brief
      result_from: [freshness, research-topic, draft-brief]
      steps:
        - id: freshness
          label: admit fresh ecosystem sources
          inputs:
            as_of: $input.as_of
            max_age_hours: $input.max_age_hours
            source_packets: $input.source_packets
          run:
            type: javascript
            module: ecosystem-brief.mjs
            outputs:
              freshness_report: object
          artifacts:
            named_emits:
              freshness_report: freshness_report

        - id: research-topic
          skill: ../research
          scopes:
            - runx:research:read
          inputs:
            objective: $input.objective
            domain: $input.domain
            deliverable: ecosystem brief
            operator_context: $input.operator_context
            target_entities: $input.target_entities
          context:
            source_packets: freshness.freshness_report.data.source_packets

        - id: draft-brief
          when:
            field: research-topic.research_packet.data.decision
            equals: ready
          skill: ../ghostwrite
          scopes:
            - runx:content:draft
          inputs:
            objective: $input.objective
            audience: $input.audience
            channel: $input.channel
            voice_guide: Lead with what changed and its operational implication; distinguish verified change, inference, uncertainty, and recommended posture.
          context:
            evidence_pack: research-topic.research_packet.data
