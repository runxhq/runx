name: postmortem-maker-unknowns-block-publish
kind: skill
target: ..
operator_journeys:
  - mode: standalone
    confusors: [incident-commander, postmortem-maker-publishable-executes-publish]
    request: Write up this unresolved failure without guessing at the cause.
    expected_outcome: Return a grounded postmortem that keeps the unresolved facts in unknowns and publishes nothing.
inputs:
  incident_source: https://fixture.runx.invalid/incidents/inc-batch-2026-10-04
  postmortem_policy:
    principal: agent:hermes-jobs
    audience: { type: thread, ref: "incident-thread:batch-2026-10-04" }
    connector: { provider: provider-postmortem-demo, target: "thread:postmortem-notice" }
    consent_basis: The operator commissioned this postmortem publication as the deliverable of a paid bounty.
    gate_note: Publish only a postmortem that is complete and fully cited.
caller:
  http_responses:
    "https://fixture.runx.invalid/incidents/inc-batch-2026-10-04":
      status: 200
      headers: { content-type: text/plain }
      body: |
        2026-10-04 22:10 UTC nightly batch failed at step export with exit 1.
        2026-10-04 22:11 UTC retry of the export step failed again with exit 1.
  answers:
    agent_task.postmortem-maker-draft.output:
      postmortem_draft:
        summary: The nightly batch failed twice at the export step; the cause is not established by the record.
        impact: One nightly export did not complete; downstream reports were delayed by a day.
        timeline:
          - entry: The nightly batch failed at the export step.
            fragment_id: frag-1
            quote: "nightly batch failed at step export with exit 1"
          - entry: The retry failed the same way.
            fragment_id: frag-2
            quote: "retry of the export step failed again with exit 1"
        root_cause:
          status: unknown
        unknowns:
          - Which upstream input changed before the export step failed.
        action_items:
          - action: Capture export step inputs on failure.
            owner: data-oncall
expect:
  status: sealed
  steps: [read-source, fragmentize, digest-fragments, draft, finalize, stamp-held]
  step_outputs:
    stamp-held:
      subset:
        postmortem:
          data:
            decision: needs_more_evidence
            status: needs_more_evidence
            publish_proposal: null
            publish_performed: false
            publish_result: null
            validation: { status: pass, findings: [] }
  receipt: { schema: runx.receipt.v1 }
metadata: { public_skill: postmortem-maker, source_case: unknowns-block-publish, source: skills-fixture }
