skill: postmortem-maker
version: "0.3.0"

catalog:
  kind: graph
  audience: operator
  visibility: public
  role: canonical
  execution: plan
  completion: runtime_receipt
  requires_adapter: false
  approval: none

policy:
  side_effects: workspace_write
  sends_messages: denied
  mints_authority: denied
  persists_state: denied
  secrets_required: false

harness:
  cases:
    - name: postmortem-maker-publishable-delivers
      operator_journeys:
        - mode: standalone
          confusors: [incident-commander, answer-from-docs]
          request: Produce the postmortem for this resolved incident record and publish it.
          expected_outcome: Read the incident source, return a source-cited postmortem, and execute the sealed outbox delivery bound to it.
        - mode: composed
          request: Continue from this sealed postmortem into the governed comms send.
          expected_outcome: Reuse the sealed postmortem and its executed delivery without re-deriving the timeline.
          prior_evidence:
            - The incident source read and sealed postmortem supplied by the prior step.
          must_not_repeat:
            - Do not re-derive timeline entries or the root cause already sealed.
      inputs:
        incident_ref: inc-payments-failover-2026-09-02
        incident_source:
          kind: inline
          fragments:
            - id: ev-failover-1
              source: status-page
              text: "14:05 UTC elevated payment authorization latency detected across the primary region."
            - id: ev-failover-2
              source: deploy-log
              text: "13:58 UTC migration 2026.09.02.7 changed the payments database failover timeout from 800ms to 150ms."
            - id: ev-failover-3
              source: oncall-note
              text: "14:41 UTC migration 2026.09.02.7 reverted; authorization latency returned to normal."
        postmortem_policy:
          allow_publish: true
          outbox_dir: outbox/postmortems
      caller:
        answers:
          agent_task.postmortem-maker-read.output:
            source_read:
              read_kind: inline
              fetched_ref: inline:inc-payments-failover-2026-09-02
              fragments:
                - id: ev-failover-1
                  source: status-page
                  text: "14:05 UTC elevated payment authorization latency detected across the primary region."
                - id: ev-failover-2
                  source: deploy-log
                  text: "13:58 UTC migration 2026.09.02.7 changed the payments database failover timeout from 800ms to 150ms."
                - id: ev-failover-3
                  source: oncall-note
                  text: "14:41 UTC migration 2026.09.02.7 reverted; authorization latency returned to normal."
          agent_task.postmortem-maker-draft.output:
            postmortem_draft:
              summary: An aggressive failover timeout in migration 2026.09.02.7 caused repeated database failover attempts until the migration was reverted.
              impact:
                statement: Payment authorizations were delayed above normal latency for about 36 minutes.
                scope: payments-primary-region
              timeline:
                - entry: Migration 2026.09.02.7 cut the failover timeout to 150ms.
                  fragment_id: ev-failover-2
                  quote: "changed the payments database failover timeout from 800ms to 150ms"
                - entry: Elevated authorization latency was detected.
                  fragment_id: ev-failover-1
                  quote: "elevated payment authorization latency detected"
                - entry: Reverting the migration restored normal latency.
                  fragment_id: ev-failover-3
                  quote: "authorization latency returned to normal"
              root_cause:
                status: known
                statement: The 150ms failover timeout forced premature failover retries against the primary database.
                fragment_id: ev-failover-2
                quote: "failover timeout from 800ms to 150ms"
              unknowns: []
              action_items:
                - action: Require staged rollout for failover-timeout changes on the payments database.
                  owner: payments-infra
      expect:
        status: sealed
        steps: [read-source, digest-source, draft, finalize, prepare-delivery, deliver, record-delivery]
        step_outputs:
          finalize:
            subset:
              postmortem:
                data:
                  schema: runx.postmortem.v2
                  decision: publishable
                  send_plan:
                    status: ready
                  validation: { status: pass, findings: [] }
          record-delivery:
            subset:
              publish_result:
                data:
                  executed: true
                  transport: sealed-outbox
                  send_plan_status: executed
        receipt: { schema: runx.receipt.v1 }

    - name: postmortem-maker-conflicting-evidence-withholds
      inputs:
        incident_ref: inc-ci-flake-2026-09-04
        incident_source:
          kind: inline
          fragments:
            - id: ev-ci-1
              source: ci-log
              text: "21:12 UTC job lint-and-test failed after 41 minutes with no failing test reported."
            - id: ev-ci-2
              source: runner-metrics
              text: "Runner pool cpu_saturation stayed below 40 percent during the window."
            - id: ev-ci-3
              source: runner-metrics
              text: "Runner pool cpu_saturation exceeded 95 percent during the window."
        postmortem_policy:
          allow_publish: true
          outbox_dir: outbox/postmortems
      caller:
        answers:
          agent_task.postmortem-maker-read.output:
            source_read:
              read_kind: inline
              fetched_ref: inline:inc-ci-flake-2026-09-04
              fragments:
                - id: ev-ci-1
                  source: ci-log
                  text: "21:12 UTC job lint-and-test failed after 41 minutes with no failing test reported."
                - id: ev-ci-2
                  source: runner-metrics
                  text: "Runner pool cpu_saturation stayed below 40 percent during the window."
                - id: ev-ci-3
                  source: runner-metrics
                  text: "Runner pool cpu_saturation exceeded 95 percent during the window."
          agent_task.postmortem-maker-draft.output:
            postmortem_draft:
              summary: The lint-and-test job timed out; runner metrics disagree about pool saturation during the window.
              impact:
                statement: CI results were unavailable for 41 minutes.
                scope: ci-pipeline
              timeline:
                - entry: The lint-and-test job failed without a failing test.
                  fragment_id: ev-ci-1
                  quote: "failed after 41 minutes with no failing test reported"
              root_cause:
                status: unknown
              unknowns:
                - Runner cpu_saturation is reported both below 40 percent and above 95 percent for the same window.
              action_items:
                - action: Reconcile the runner-metrics collectors before attributing cause.
                  owner: ci-oncall
      expect:
        status: sealed
        steps: [read-source, digest-source, draft, finalize]
        step_outputs:
          finalize:
            subset:
              postmortem:
                data:
                  decision: needs_more_evidence
                  send_plan:
                    status: withheld
                  publish_performed: ~
                  validation: { status: pass, findings: [] }
        receipt: { schema: runx.receipt.v1 }

    - name: postmortem-maker-invented-citation-refuses
      inputs:
        incident_ref: inc-cache-2026-09-01
        incident_source:
          kind: inline
          fragments:
            - id: ev-cache-1
              source: log
              text: "Cache layer restarted at 09:00 UTC."
        postmortem_policy:
          allow_publish: true
          outbox_dir: outbox/postmortems
      caller:
        answers:
          agent_task.postmortem-maker-read.output:
            source_read:
              read_kind: inline
              fetched_ref: inline:inc-cache-2026-09-01
              fragments:
                - id: ev-cache-1
                  source: log
                  text: "Cache layer restarted at 09:00 UTC."
          agent_task.postmortem-maker-draft.output:
            postmortem_draft:
              summary: A disk-full event wiped the cache directory.
              timeline:
                - entry: The cache directory was wiped.
                  fragment_id: ev-cache-1
                  quote: "disk full wiped the cache directory"
              root_cause:
                status: known
                statement: Disk exhaustion.
                fragment_id: ev-cache-1
                quote: "disk full wiped the cache directory"
              unknowns: []
              action_items: []
      expect:
        status: sealed
        steps: [read-source, digest-source, draft, finalize]
        step_outputs:
          finalize:
            subset:
              postmortem:
                data:
                  decision: refused
                  timeline: []
                  send_plan:
                    status: withheld
                  validation: { status: fail }
        receipt: { schema: runx.receipt.v1 }

    - name: postmortem-maker-missing-source-refuses
      inputs:
        incident_ref: inc-empty-2026-09-05
        postmortem_policy:
          allow_publish: false
          outbox_dir: outbox/postmortems
      expect:
        status: failure

runners:
  make:
    default: true
    type: graph
    inputs:
      incident_ref:
        type: string
        required: true
        description: Identifier of the resolved incident this postmortem covers.
      incident_source:
        type: json
        required: true
        description: "Where the incident record is read at run time: {kind: web_fetch, url, allowlist?} fetches a real incident thread over HTTPS; {kind: read_projection, data_source_ref, aggregate_id, resource} reads an incident/ticket event-stream projection; {kind: inline, fragments} replays supplied fragments for deterministic harness runs."
      postmortem_policy:
        type: json
        required: false
        description: "Publish posture: {allow_publish: boolean, outbox_dir: string}. The sealed outbox delivery runs only when the postmortem is publishable and allow_publish is true."
    examples:
      - incident_ref: inc-payments-failover-2026-09-02
        incident_source:
          kind: web_fetch
          url: https://api.github.com/repos/nltk/nltk/issues/3733
        postmortem_policy:
          allow_publish: true
          outbox_dir: outbox/postmortems
    graph:
      name: postmortem-maker-make
      result_from: [record-delivery, finalize]
      steps:
        - id: read-source
          label: read the incident record from its real source
          run:
            type: agent-task
            agent: researcher
            task: postmortem-maker-read
            outputs:
              source_read: object
          inputs:
            incident_ref: $input.incident_ref
            incident_source: $input.incident_source
          allowed_tools:
            - web.fetch
            - data.read_projection
          scopes:
            - runx:net:allowlist
            - runx:data:read
          artifacts:
            named_emits:
              source_read: source_read

        - id: digest-source
          tool: data.digest
          context:
            value: read-source.source_read.data.fragments

        - id: draft
          label: separate facts from hypotheses across the source evidence
          run:
            type: agent-task
            agent: reviewer
            task: postmortem-maker-draft
            outputs:
              postmortem_draft: object
          inputs:
            incident_ref: $input.incident_ref
            postmortem_policy: $input.postmortem_policy
          context:
            incident_fragments: read-source.source_read.data.fragments
            source_digest: digest-source.digest_result.data.digest
          allowed_tools: []
          artifacts:
            named_emits:
              postmortem_draft: postmortem_draft

        - id: finalize
          label: enforce source citations deterministically
          inputs:
            incident_ref: $input.incident_ref
            postmortem_policy: $input.postmortem_policy
          context:
            incident_fragments: read-source.source_read.data.fragments
            postmortem_draft: draft.postmortem_draft.data
            fragments_digest: digest-source.digest_result.data.digest
          run:
            type: javascript
            module: postmortem-maker.mjs
            export: finalizePostmortem
            outputs:
              postmortem:
                type: object
                schema:
                  required: [schema, decision, reason, status, incident_ref, summary, timeline, impact, root_cause, unknowns, action_items, send_plan, fragments_digest, validation]
                  additionalProperties: false
                  properties:
                    schema: { const: runx.postmortem.v2 }
                    decision: { type: string, enum: [publishable, needs_more_evidence, refused] }
                    reason: { type: string, minLength: 1, maxLength: 2000 }
                    status: { type: string, enum: [sealed, refused] }
                    incident_ref: { type: [string, "null"], maxLength: 256 }
                    summary: { type: [string, "null"], maxLength: 8000 }
                    timeline:
                      type: array
                      maxItems: 500
                      items:
                        type: object
                        required: [entry, fragment_id, quote]
                        additionalProperties: false
                        properties:
                          entry: { type: string, minLength: 1, maxLength: 4000 }
                          fragment_id: { type: string, minLength: 1, maxLength: 200 }
                          quote: { type: string, minLength: 1, maxLength: 4000 }
                    impact:
                      type: [object, "null"]
                      required: [statement, scope]
                      additionalProperties: false
                      properties:
                        statement: { type: [string, "null"], maxLength: 4000 }
                        scope: { type: [string, "null"], maxLength: 500 }
                    root_cause:
                      type: [object, "null"]
                      required: [status, statement, fragment_id]
                      additionalProperties: false
                      properties:
                        status: { type: string, enum: [known, suspected, unknown] }
                        statement: { type: [string, "null"], maxLength: 4000 }
                        fragment_id: { type: [string, "null"], maxLength: 200 }
                    unknowns:
                      type: array
                      maxItems: 100
                      items: { type: string, minLength: 1, maxLength: 2000 }
                    action_items:
                      type: array
                      maxItems: 100
                      items:
                        type: object
                        required: [action, owner]
                        additionalProperties: false
                        properties:
                          action: { type: string, minLength: 1, maxLength: 2000 }
                          owner: { type: string, minLength: 1, maxLength: 500 }
                    send_plan:
                      type: object
                      required: [schema, status, transport]
                      additionalProperties: false
                      properties:
                        schema: { const: runx.send_plan.v1 }
                        status: { type: string, enum: [ready, withheld] }
                        transport: { const: sealed-outbox }
                        gate: { type: string, maxLength: 200 }
                        bound_to: { type: string, maxLength: 200 }
                    fragments_digest: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
                    validation:
                      type: object
                      required: [status, findings]
                      additionalProperties: false
                      properties:
                        status: { type: string, enum: [pass, fail] }
                        findings:
                          type: array
                          maxItems: 100
                          items:
                            type: object
                            required: [code, message]
                            additionalProperties: false
                            properties:
                              code: { type: string, minLength: 1, maxLength: 200 }
                              message: { type: string, minLength: 1, maxLength: 2000 }
          artifacts:
            named_emits:
              postmortem: postmortem

        - id: prepare-delivery
          label: bind the postmortem to its outbox delivery payload
          when:
            field: finalize.postmortem.data.send_plan.status
            equals: ready
          inputs:
            postmortem_policy: $input.postmortem_policy
          context:
            postmortem: finalize.postmortem.data
          run:
            type: javascript
            module: postmortem-maker.mjs
            export: prepareDelivery
            outputs:
              delivery_draft: object
          artifacts:
            named_emits:
              delivery_draft: delivery_draft

        - id: deliver
          label: execute the sealed outbox transport
          when:
            field: finalize.postmortem.data.send_plan.status
            equals: ready
          tool: fs.write
          scopes: [fs.write]
          context:
            path: prepare-delivery.delivery_draft.data.path
            contents: prepare-delivery.delivery_draft.data.contents

        - id: record-delivery
          label: seal the executed send plan into the publish result
          when:
            field: finalize.postmortem.data.send_plan.status
            equals: ready
          context:
            postmortem: finalize.postmortem.data
            delivery_draft: prepare-delivery.delivery_draft.data
            write_result: deliver.file_write.data
          run:
            type: javascript
            module: postmortem-maker.mjs
            export: recordDelivery
            outputs:
              publish_result: object
          artifacts:
            named_emits:
              publish_result: publish_result
