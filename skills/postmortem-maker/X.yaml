skill: postmortem-maker
version: "0.2.0"

catalog:
  kind: graph
  audience: operator
  visibility: public
  role: canonical
  execution: plan
  completion: runtime_receipt
  requires_adapter: false
  approval: none

policy:
  side_effects: workspace_write
  sends_messages: denied
  mints_authority: denied
  persists_state: denied
  secrets_required: false

runners:
  make:
    default: true
    type: graph
    inputs:
      incident_ref:
        type: string
        required: true
        description: Identifier of the resolved incident this postmortem covers.
      incident_source:
        type: json
        required: true
        description: "Where to read the incident record at run time: {kind: web_fetch, url, allowlist?} fetches a real incident thread over HTTPS, {kind: read_projection, data_source_ref, aggregate_id, resource} reads an incident/ticket event-stream projection, or {kind: inline, fragments} replays supplied fragments for deterministic harness runs."
      postmortem_policy:
        type: json
        required: false
        description: "Publish posture: {allow_publish: boolean, outbox_dir: string}. The sealed outbox delivery only runs when the postmortem is publishable and allow_publish is true."
    examples:
      - incident_ref: inc-checkout-2026-08-09
        incident_source:
          kind: web_fetch
          url: https://api.github.com/repos/nltk/nltk/issues/3733
        postmortem_policy:
          allow_publish: true
          outbox_dir: outbox/postmortems
    graph:
      name: postmortem-maker-make
      result_from: [record-delivery, finalize]
      steps:
        - id: read-source
          label: read the incident record from its real source
          run:
            type: agent-task
            agent: researcher
            task: postmortem-maker-read
            outputs:
              source_read: object
          inputs:
            incident_ref: $input.incident_ref
            incident_source: $input.incident_source
          allowed_tools:
            - web.fetch
            - data.read_projection
          scopes:
            - runx:net:allowlist
            - runx:data:read
          artifacts:
            named_emits:
              source_read: source_read

        - id: digest-source
          tool: data.digest
          context:
            value: read-source.source_read.data.fragments

        - id: draft
          label: separate facts from hypotheses across the source evidence
          run:
            type: agent-task
            agent: reviewer
            task: postmortem-maker-draft
            outputs:
              postmortem_draft: object
          inputs:
            incident_ref: $input.incident_ref
            postmortem_policy: $input.postmortem_policy
          context:
            incident_fragments: read-source.source_read.data.fragments
            source_digest: digest-source.digest_result.data.digest
          allowed_tools: []
          artifacts:
            named_emits:
              postmortem_draft: postmortem_draft

        - id: finalize
          label: enforce source citations deterministically
          inputs:
            incident_ref: $input.incident_ref
            postmortem_policy: $input.postmortem_policy
          context:
            incident_fragments: read-source.source_read.data.fragments
            postmortem_draft: draft.postmortem_draft.data
            fragments_digest: digest-source.digest_result.data.digest
          run:
            type: javascript
            module: postmortem-maker.mjs
            export: finalizePostmortem
            outputs:
              postmortem:
                type: object
                schema:
                  required: [schema, decision, reason, status, incident_ref, summary, timeline, impact, root_cause, unknowns, action_items, send_plan, fragments_digest, validation]
                  additionalProperties: false
                  properties:
                    schema: { const: runx.postmortem.v2 }
                    decision: { type: string, enum: [publishable, needs_more_evidence, refused] }
                    reason: { type: string, minLength: 1, maxLength: 2000 }
                    status: { type: string, enum: [sealed, refused] }
                    incident_ref: { type: [string, "null"], maxLength: 256 }
                    summary: { type: [string, "null"], maxLength: 8000 }
                    timeline:
                      type: array
                      maxItems: 500
                      items:
                        type: object
                        required: [entry, fragment_id, quote]
                        additionalProperties: false
                        properties:
                          entry: { type: string, minLength: 1, maxLength: 4000 }
                          fragment_id: { type: string, minLength: 1, maxLength: 200 }
                          quote: { type: string, minLength: 1, maxLength: 4000 }
                    impact:
                      type: [object, "null"]
                      required: [statement, scope]
                      additionalProperties: false
                      properties:
                        statement: { type: [string, "null"], maxLength: 4000 }
                        scope: { type: [string, "null"], maxLength: 500 }
                    root_cause:
                      type: [object, "null"]
                      required: [status, statement, fragment_id]
                      additionalProperties: false
                      properties:
                        status: { type: string, enum: [known, suspected, unknown] }
                        statement: { type: [string, "null"], maxLength: 4000 }
                        fragment_id: { type: [string, "null"], maxLength: 200 }
                    unknowns:
                      type: array
                      maxItems: 100
                      items: { type: string, minLength: 1, maxLength: 2000 }
                    action_items:
                      type: array
                      maxItems: 100
                      items:
                        type: object
                        required: [action, owner]
                        additionalProperties: false
                        properties:
                          action: { type: string, minLength: 1, maxLength: 2000 }
                          owner: { type: string, minLength: 1, maxLength: 500 }
                    send_plan:
                      type: object
                      required: [schema, status, transport]
                      additionalProperties: false
                      properties:
                        schema: { const: runx.send_plan.v1 }
                        status: { type: string, enum: [ready, withheld] }
                        transport: { const: sealed-outbox }
                        gate: { type: string, maxLength: 200 }
                        bound_to: { type: string, maxLength: 200 }
                    fragments_digest: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
                    validation:
                      type: object
                      required: [status, findings]
                      additionalProperties: false
                      properties:
                        status: { type: string, enum: [pass, fail] }
                        findings:
                          type: array
                          maxItems: 100
                          items:
                            type: object
                            required: [code, message]
                            additionalProperties: false
                            properties:
                              code: { type: string, minLength: 1, maxLength: 200 }
                              message: { type: string, minLength: 1, maxLength: 2000 }
          artifacts:
            named_emits:
              postmortem: postmortem

        - id: prepare-delivery
          label: bind the postmortem to its outbox delivery payload
          when:
            field: finalize.postmortem.data.send_plan.status
            equals: ready
          inputs:
            postmortem_policy: $input.postmortem_policy
          context:
            postmortem: finalize.postmortem.data
          run:
            type: javascript
            module: postmortem-maker.mjs
            export: prepareDelivery
            outputs:
              delivery_draft: object
          artifacts:
            named_emits:
              delivery_draft: delivery_draft

        - id: deliver
          label: execute the sealed outbox transport
          when:
            field: finalize.postmortem.data.send_plan.status
            equals: ready
          tool: fs.write
          scopes: [fs.write]
          context:
            path: prepare-delivery.delivery_draft.data.path
            contents: prepare-delivery.delivery_draft.data.contents

        - id: record-delivery
          label: seal the executed send plan into the publish result
          when:
            field: finalize.postmortem.data.send_plan.status
            equals: ready
          context:
            postmortem: finalize.postmortem.data
            delivery_draft: prepare-delivery.delivery_draft.data
            write_result: deliver.file_write.data
          run:
            type: javascript
            module: postmortem-maker.mjs
            export: recordDelivery
            outputs:
              publish_result: object
          artifacts:
            named_emits:
              publish_result: publish_result
