skill: postmortem-maker
version: "1.0.0"

catalog:
  kind: graph
  audience: operator
  visibility: public
  role: canonical
  execution: plan
  completion: runtime_receipt
  requires_adapter: false
  approval: none

harness:
  cases:
    - name: postmortem-maker-publishable-seals
      operator_journeys:
        - mode: standalone
          confusors: [incident-commander, answer-from-docs]
          request: Produce the postmortem for this resolved incident from the collected fragments.
          expected_outcome: Return a fragment-cited postmortem with a supported root cause and a gated publish proposal, publishing nothing.
        - mode: composed
          request: Continue from this sealed postmortem into the governed comms send.
          expected_outcome: Reuse the sealed postmortem and its publish proposal without re-deriving the timeline.
          prior_evidence:
            - The incident fragments and sealed postmortem supplied by the prior step.
          must_not_repeat:
            - Do not re-derive timeline entries or the root cause already sealed.
      inputs:
        incident_ref: inc-checkout-2026-08-09
        incident_source:
          kind: inline
          fragments:
            - id: frag-1
              source: pagerduty
              text: "03:12 UTC alert fired: checkout 5xx rate crossed 8 percent."
            - id: frag-2
              source: deploy-log
              text: "03:02 UTC deploy 2026.08.09.3 rolled out a connection pool change to checkout-api."
            - id: frag-3
              source: slack-incident
              text: "03:40 UTC rollback of 2026.08.09.3 completed and 5xx rate returned to baseline."
        postmortem_policy:
          allow_publish: true
          outbox_dir: outbox
      caller:
        answers:
          agent_task.postmortem-maker-read.output:
            source_read:
              read_kind: inline
              fetched_ref: inline:inc-checkout-2026-08-09
              fragments:
                - id: frag-1
                  source: pagerduty
                  text: "03:12 UTC alert fired: checkout 5xx rate crossed 8 percent."
                - id: frag-2
                  source: deploy-log
                  text: "03:02 UTC deploy 2026.08.09.3 rolled out a connection pool change to checkout-api."
                - id: frag-3
                  source: slack-incident
                  text: "03:40 UTC rollback of 2026.08.09.3 completed and 5xx rate returned to baseline."
          agent_task.postmortem-maker-draft.output:
            postmortem_draft:
              summary: A connection pool change in deploy 2026.08.09.3 degraded checkout until rollback.
              impact:
                statement: Checkout error rate remained elevated until rollback.
                scope: checkout-api
              timeline:
                - entry: Deploy 2026.08.09.3 shipped a connection pool change.
                  fragment_id: frag-2
                  quote: "deploy 2026.08.09.3 rolled out a connection pool change"
                - entry: Checkout 5xx rate crossed the alert threshold.
                  fragment_id: frag-1
                  quote: "checkout 5xx rate crossed 8 percent"
                - entry: Rollback restored baseline.
                  fragment_id: frag-3
                  quote: "rollback of 2026.08.09.3 completed and 5xx rate returned to baseline"
              root_cause:
                status: known
                statement: The connection pool change in 2026.08.09.3 exhausted checkout database connections.
                fragment_id: frag-2
                quote: "connection pool change to checkout-api"
              unknowns: []
              action_items:
                - action: Add pool saturation alerting before the next pool change ships.
                  owner: platform-oncall
      expect:
        status: sealed
        steps: [read-source, digest-source, draft, finalize, prepare-delivery, deliver, record-delivery]
        step_outputs:
          finalize:
            subset:
              postmortem:
                data:
                  schema: runx.postmortem.v2
                  decision: publishable
                  send_plan:
                    status: ready
                    transport: sealed-outbox
                  validation: { status: pass, findings: [] }
          record-delivery:
            subset:
              publish_result:
                data:
                  schema: runx.publish_result.v1
                  executed: true
        receipt: { schema: runx.receipt.v1 }

    - name: postmortem-maker-unknowns-block-publish
      inputs:
        incident_ref: inc-batch-2026-08-10
        incident_source:
          kind: inline
          fragments:
            - id: frag-1
              source: cron-log
              text: "Nightly batch failed at step export with exit 1."
        postmortem_policy:
          allow_publish: true
          outbox_dir: outbox
      caller:
        answers:
          agent_task.postmortem-maker-read.output:
            source_read:
              read_kind: inline
              fetched_ref: inline:inc-batch-2026-08-10
              fragments:
                - id: frag-1
                  source: cron-log
                  text: "Nightly batch failed at step export with exit 1."
          agent_task.postmortem-maker-draft.output:
            postmortem_draft:
              summary: The nightly batch failed at the export step; cause not yet established.
              impact:
                statement: Batch exports did not complete.
                scope: nightly-batch
              timeline:
                - entry: The nightly batch failed at the export step.
                  fragment_id: frag-1
                  quote: "Nightly batch failed at step export"
              root_cause:
                status: unknown
              unknowns:
                - Which upstream input changed before the export step failed.
              action_items:
                - action: Capture export step inputs on failure.
                  owner: data-oncall
      expect:
        status: sealed
        steps: [read-source, digest-source, draft, finalize]
        step_outputs:
          finalize:
            subset:
              postmortem:
                data:
                  decision: needs_more_evidence
                  send_plan:
                    status: withheld
                    transport: sealed-outbox
                  validation: { status: pass, findings: [] }
        receipt: { schema: runx.receipt.v1 }

    - name: postmortem-maker-invented-citation-refuses
      inputs:
        incident_ref: inc-x
        incident_source:
          kind: inline
          fragments:
            - id: frag-1
              source: log
              text: "Service restarted at 09:00."
        postmortem_policy:
          allow_publish: true
          outbox_dir: outbox
      caller:
        answers:
          agent_task.postmortem-maker-read.output:
            source_read:
              read_kind: inline
              fetched_ref: inline:inc-x
              fragments:
                - id: frag-1
                  source: log
                  text: "Service restarted at 09:00."
          agent_task.postmortem-maker-draft.output:
            postmortem_draft:
              summary: Total outage caused by database corruption.
              timeline:
                - entry: The database corrupted.
                  fragment_id: frag-1
                  quote: "database corruption detected"
              root_cause:
                status: known
                statement: Database corruption.
                fragment_id: frag-1
                quote: "database corruption detected"
              unknowns: []
              action_items: []
      expect:
        status: sealed
        steps: [read-source, digest-source, draft, finalize]
        step_outputs:
          finalize:
            subset:
              postmortem:
                data:
                  decision: refused
                  timeline: []
                  send_plan:
                    status: withheld
                    transport: sealed-outbox
                  validation: { status: fail }
        receipt: { schema: runx.receipt.v1 }

    - name: postmortem-maker-needs-fragments
      inputs:
        incident_ref: inc-y
        incident_source:
          kind: inline
          fragments: []
        postmortem_policy:
          allow_publish: false
          outbox_dir: outbox
      caller:
        answers:
          agent_task.postmortem-maker-read.output:
            source_read:
              read_kind: inline
              fetched_ref: inline:inc-y
              fragments: []
          agent_task.postmortem-maker-draft.output:
            postmortem_draft:
              summary: No incident fragments were available.
              impact:
                statement: None.
                scope: unknown
              timeline: []
              root_cause:
                status: unknown
              unknowns:
                - No incident fragments were supplied.
              action_items: []
      expect:
        status: sealed
        steps: [read-source, digest-source, draft, finalize]
        step_outputs:
          finalize:
            subset:
              postmortem:
                data:
                  decision: refused
                  send_plan:
                    status: withheld
                    transport: sealed-outbox
                  validation: { status: fail }

runners:
  make:
    default: true
    type: graph
    inputs:
      incident_ref:
        type: string
        required: true
        description: Identifier of the resolved incident this postmortem covers.
      incident_source:
        type: object
        required: true
        description: Where the incident record is read at run time. {kind:"web_fetch",url,allowlist?} fetches a live thread, {kind:"read_projection",data_source_ref,aggregate_id,resource} reads a ticket or incident projection, or {kind:"inline",fragments} replays supplied fragments.
        schema:
          required: [kind]
          additionalProperties: true
          properties:
            kind: { type: string, enum: [web_fetch, read_projection, inline] }
      postmortem_policy:
        type: object
        required: false
        description: Governance for executing delivery. allow_publish gates whether a publishable postmortem may run its sealed outbox send; outbox_dir is the local directory for the sealed write.
        schema:
          properties:
            allow_publish: { type: boolean, default: true }
            outbox_dir:
              type: string
              default: /tmp/pm-outbox
              minLength: 1
              maxLength: 1024
    examples:
      - incident_ref: inc-checkout-2026-08-09
        incident_source:
          kind: inline
          fragments:
            - id: frag-1
              source: pagerduty
              text: "03:12 UTC alert fired."
    graph:
      name: postmortem-maker-make
      result_from: [finalize]
      steps:
        - id: read-source
          label: read the incident record from its real source at run time
          run:
            type: agent-task
            agent: researcher
            task: postmortem-maker-read
            outputs:
              source_read: object
          inputs:
            incident_ref: $input.incident_ref
            incident_source: $input.incident_source
          allowed_tools:
            - web.fetch
            - data.read_projection
          scopes:
            - runx:net:allowlist
            - runx:data:read
          artifacts:
            named_emits:
              source_read: source_read

        - id: digest-source
          label: bind the source read to a deterministic digest
          tool: data.digest
          context:
            value: read-source.source_read.data.fragments

        - id: draft
          label: separate facts from hypotheses across the source evidence
          run:
            type: agent-task
            agent: reviewer
            task: postmortem-maker-draft
            outputs:
              postmortem_draft: object
          inputs:
            incident_ref: $input.incident_ref
            postmortem_policy: $input.postmortem_policy
          context:
            incident_fragments: read-source.source_read.data.fragments
            source_digest: digest-source.digest_result.data.digest
          allowed_tools: []
          artifacts:
            named_emits:
              postmortem_draft: postmortem_draft

        - id: finalize
          label: enforce fragment citations deterministically
          context:
            incident_fragments: read-source.source_read.data.fragments
            postmortem_draft: draft.postmortem_draft.data
            fragments_digest: digest-source.digest_result.data.digest
          run:
            type: javascript
            module: postmortem-maker.mjs
            export: finalizePostmortem
            outputs:
              postmortem:
                type: object
                schema:
                  required: [schema, decision, reason, status, incident_ref, summary, timeline, impact, root_cause, unknowns, action_items, send_plan, fragments_digest, validation]
                  additionalProperties: false
                  properties:
                    schema: { const: runx.postmortem.v2 }
                    decision: { type: string, enum: [publishable, needs_more_evidence, refused] }
                    reason: { type: string, minLength: 1, maxLength: 2000 }
                    status: { type: string, enum: [sealed, refused] }
                    incident_ref: { type: [string, "null"], maxLength: 256 }
                    summary: { type: [string, "null"], maxLength: 8000 }
                    timeline:
                      type: array
                      maxItems: 500
                      items:
                        type: object
                        required: [entry, fragment_id, quote]
                        additionalProperties: false
                        properties:
                          entry: { type: string, minLength: 1, maxLength: 4000 }
                          fragment_id: { type: string, minLength: 1, maxLength: 200 }
                          quote: { type: string, minLength: 1, maxLength: 4000 }
                    impact:
                      type: [object, "null"]
                      required: [statement, scope]
                      additionalProperties: false
                      properties:
                        statement: { type: [string, "null"], maxLength: 4000 }
                        scope: { type: [string, "null"], maxLength: 500 }
                    root_cause:
                      type: [object, "null"]
                      required: [status, statement, fragment_id]
                      additionalProperties: false
                      properties:
                        status: { type: string, enum: [known, suspected, unknown] }
                        statement: { type: [string, "null"], maxLength: 4000 }
                        fragment_id: { type: [string, "null"], maxLength: 200 }
                    unknowns:
                      type: array
                      maxItems: 100
                      items: { type: string, minLength: 1, maxLength: 2000 }
                    action_items:
                      type: array
                      maxItems: 100
                      items:
                        type: object
                        required: [action, owner]
                        additionalProperties: false
                        properties:
                          action: { type: string, minLength: 1, maxLength: 2000 }
                          owner: { type: string, minLength: 1, maxLength: 500 }
                    send_plan:
                      type: object
                      required: [schema, status, transport]
                      additionalProperties: false
                      properties:
                        schema: { const: runx.send_plan.v1 }
                        status: { type: string, enum: [ready, withheld] }
                        transport: { const: sealed-outbox }
                        gate: { type: [string, "null"], maxLength: 200 }
                        bound_to: { type: [string, "null"], maxLength: 200 }
                    fragments_digest: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
                    validation:
                      type: object
                      required: [status, findings]
                      additionalProperties: false
                      properties:
                        status: { type: string, enum: [pass, fail] }
                        findings: { type: array, maxItems: 100 }
          artifacts:
            named_emits:
              postmortem: postmortem

        - id: prepare-delivery
          label: bind the postmortem to its sealed outbox delivery
          when:
            field: finalize.postmortem.data.send_plan.status
            equals: ready
          run:
            type: javascript
            module: postmortem-maker.mjs
            export: prepareDelivery
            outputs:
              delivery_draft: object
          inputs:
            incident_ref: $input.incident_ref
            postmortem_policy: $input.postmortem_policy
          context:
            postmortem: finalize.postmortem.data
          artifacts:
            named_emits:
              delivery_draft: delivery_draft

        - id: deliver
          label: execute the sealed outbox write bound to the postmortem
          when:
            field: finalize.postmortem.data.send_plan.status
            equals: ready
          tool: fs.write
          scopes: [fs.write]
          context:
            path: prepare-delivery.delivery_draft.data.path
            contents: prepare-delivery.delivery_draft.data.contents

        - id: record-delivery
          label: seal the executed send plan into the publish result
          when:
            field: finalize.postmortem.data.send_plan.status
            equals: ready
          run:
            type: javascript
            module: postmortem-maker.mjs
            export: recordDelivery
            outputs:
              publish_result: object
          context:
            postmortem: finalize.postmortem.data
            delivery_draft: prepare-delivery.delivery_draft.data
            write_result: deliver.file_write.data
          artifacts:
            named_emits:
              publish_result: publish_result
