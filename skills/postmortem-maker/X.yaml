skill: postmortem-maker
version: "1.0.0"

catalog:
  kind: graph
  audience: operator
  visibility: public
  role: canonical
  execution: execute
  completion: runtime_receipt
  requires_adapter: true
  approval: required

harness:
  files:
    - fixtures/harness-evidence.json
  cases: []

input_definitions:
  postmortem_policy:
    type: object
    required: true
    description: "Publish policy for the sealed postmortem — who it goes out as, the bounded audience, the connector that delivers it, the consent basis, and the operator gate note."
    schema:
      required: [principal, audience, connector, consent_basis]
      additionalProperties: false
      properties:
        principal: { type: string, minLength: 1, maxLength: 200 }
        audience:
          type: object
          required: [type, ref]
          additionalProperties: false
          properties:
            type: { type: string, enum: [recipient, list, segment, thread, channel] }
            ref: { type: string, minLength: 1, maxLength: 500 }
        connector:
          type: object
          required: [provider, target]
          additionalProperties: false
          properties:
            provider: { type: string, minLength: 1, maxLength: 100 }
            target: { type: string, minLength: 1, maxLength: 2048 }
        consent_basis: { type: string, minLength: 1, maxLength: 1000 }
        gate_note: { type: string, maxLength: 2000 }

runners:
  make:
    default: true
    type: graph
    inputs:
      incident_source:
        type: string
        required: true
        description: "Source handle for the incident record — a public incident or ticket thread URL that is fetched at run time before anything is drafted."
        schema:
          format: uri
          pattern: '^https?://'
      postmortem_policy:
        definition: postmortem_policy
    examples:
      - incident_source: https://status.example.com/incidents/inc-checkout-2026-10-05
        postmortem_policy:
          principal: agent:postmortem-publisher
          audience: { type: thread, ref: incident-thread }
          connector: { provider: provider-postmortem-demo, target: thread:postmortem-notice }
          consent_basis: The operator commissioned this postmortem publication.
    graph:
      name: postmortem-maker-make
      result_from: [stamp-published, stamp-held]
      steps:
        - id: read-source
          label: read the incident record from the real source
          skill: ../web-fetch
          runner: web-fetch
          inputs:
            url: $input.incident_source
            extract: text

        - id: fragmentize
          label: turn the fetched record into digest-bound fragments
          context:
            fetch_result: read-source.fetch_result.data
          inputs:
            incident_source: $input.incident_source
          run:
            type: javascript
            module: postmortem-maker.mjs
            export: buildFragments
            outputs:
              fragment_set:
                type: object

        - id: digest-fragments
          tool: data.digest
          context:
            value: fragmentize.fragment_set.incident_fragments

        - id: draft
          label: separate facts from hypotheses across the fragments
          run:
            type: agent-task
            agent: reviewer
            task: postmortem-maker-draft
            outputs:
              postmortem_draft: object
          context:
            incident_ref: fragmentize.fragment_set.incident_ref
            incident_fragments: fragmentize.fragment_set.incident_fragments
          allowed_tools: []
          artifacts:
            named_emits:
              postmortem_draft: postmortem_draft

        - id: finalize
          label: enforce fragment citations deterministically
          context:
            incident_fragments: fragmentize.fragment_set.incident_fragments
            postmortem_draft: draft.postmortem_draft.data
            fragments_digest: digest-fragments.digest_result.data.digest
          run:
            type: javascript
            module: postmortem-maker.mjs
            export: finalizePostmortem
            outputs:
              postmortem:
                type: object
                schema:
                  required: [schema, decision, status, reason, summary, timeline, impact, root_cause, unknowns, action_items, publish_proposal, publish_performed, publish_result, fragments_digest, validation]
                  additionalProperties: false
                  properties:
                    schema: { const: runx.postmortem.v1 }
                    decision: { type: string, enum: [publishable, needs_more_evidence, refused] }
                    status: { type: string, enum: [publishable, needs_more_evidence, refused] }
                    reason: { type: string, minLength: 1, maxLength: 2000 }
                    summary: { type: [string, "null"], maxLength: 8000 }
                    timeline:
                      type: array
                      maxItems: 500
                      items:
                        type: object
                        required: [entry, fragment_id, quote]
                        additionalProperties: false
                        properties:
                          entry: { type: string, minLength: 1, maxLength: 4000 }
                          fragment_id: { type: string, minLength: 1, maxLength: 200 }
                          quote: { type: string, minLength: 1, maxLength: 4000 }
                    impact: { type: [string, "null"], maxLength: 4000 }
                    root_cause:
                      type: [object, "null"]
                      required: [status, statement, fragment_id]
                      additionalProperties: false
                      properties:
                        status: { type: string, enum: [known, suspected, unknown] }
                        statement: { type: [string, "null"], maxLength: 4000 }
                        fragment_id: { type: [string, "null"], maxLength: 200 }
                    unknowns:
                      type: array
                      maxItems: 100
                      items: { type: string, minLength: 1, maxLength: 2000 }
                    action_items:
                      type: array
                      maxItems: 100
                      items:
                        type: object
                        required: [action, owner]
                        additionalProperties: false
                        properties:
                          action: { type: string, minLength: 1, maxLength: 2000 }
                          owner: { type: string, minLength: 1, maxLength: 500 }
                    publish_proposal:
                      type: [object, "null"]
                      required: [gate, delivery_skill, sent]
                      additionalProperties: false
                      properties:
                        gate: { const: human-approver }
                        delivery_skill: { const: send-as }
                        sent: { type: boolean }
                    publish_performed: { type: boolean }
                    publish_result: { type: [object, "null"] }
                    fragments_digest: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
                    validation:
                      type: object
                      required: [status, findings]
                      additionalProperties: false
                      properties:
                        status: { type: string, enum: [pass, fail] }
                        findings:
                          type: array
                          maxItems: 100
                          items:
                            type: object
                            required: [code, message]
                            additionalProperties: false
                            properties:
                              code: { type: string, minLength: 1, maxLength: 200 }
                              message: { type: string, minLength: 1, maxLength: 2000 }
              publish_path:
                type: object
          artifacts:
            named_emits:
              postmortem: postmortem

        - id: seal-postmortem
          when:
            field: finalize.publish_path.path
            equals: publish
          label: digest the sealed postmortem before it is published
          tool: data.digest
          context:
            value: finalize.postmortem.data

        - id: compose-content
          when:
            field: finalize.publish_path.path
            equals: publish
          label: bind the send content to the sealed postmortem digest
          context:
            postmortem: finalize.postmortem.data
            postmortem_digest: seal-postmortem.digest_result.data.digest
          run:
            type: javascript
            module: postmortem-maker.mjs
            export: composeContent
            outputs:
              content_ref:
                type: object

        - id: publish
          when:
            field: finalize.publish_path.path
            equals: publish
          label: publish the sealed postmortem through send-as under the operator policy
          skill: ../send-as
          runner: send
          inputs:
            objective: Publish this sealed postmortem as the named principal and close only on provider readback.
            principal: $input.postmortem_policy.principal
            audience: $input.postmortem_policy.audience
            consent_basis: $input.postmortem_policy.consent_basis
            operator_context: $input.postmortem_policy.gate_note
            connector: $input.postmortem_policy.connector
          context:
            content_ref: compose-content.content_ref

        - id: stamp-published
          when:
            field: finalize.publish_path.path
            equals: publish
          label: bind the executed send result to the sealed postmortem
          context:
            postmortem: finalize.postmortem.data
            send_result: publish.send_result.data
          run:
            type: javascript
            module: postmortem-maker.mjs
            export: stampPublished
            outputs:
              postmortem:
                type: object
          artifacts:
            named_emits:
              postmortem: postmortem

        - id: stamp-held
          when:
            field: finalize.publish_path.path
            equals: hold
          label: seal the held postmortem with nothing published
          context:
            postmortem: finalize.postmortem.data
          run:
            type: javascript
            module: postmortem-maker.mjs
            export: stampHeld
            outputs:
              postmortem:
                type: object
          artifacts:
            named_emits:
              postmortem: postmortem
