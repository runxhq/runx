skill: work-plan
version: "0.2.9"
catalog:
  kind: graph
  audience: builder
  visibility: public
  role: context
  execution: plan
  completion: plan
  approval: none
harness:
  files:
    - fixtures/workspace/skills/issue-to-pr/SKILL.md
    - fixtures/workspace/skills/issue-to-pr/run.yaml
    - fixtures/support/composed.graph
  cases:
    - name: work-plan-ready-from-issue-intake
      operator_journeys:
        - mode: standalone
          confusors: [issue-intake, prior-art]
          request: Turn this bounded issue intake into a dependency-safe Runx work plan.
          expected_outcome: Return a validated execution plan with evidence preservation, mutation boundaries, and explicit owners.
        - mode: composed
          request: Continue planning from this completed issue-intake artifact.
          expected_outcome: Reuse the intake change set and evidence without re-triaging the issue or rediscovering its target.
          prior_evidence:
            - The typed issue-intake artifact and bounded change set supplied in the fixture.
          must_not_repeat:
            - Do not repeat issue intake or triage.
            - Do not reacquire target evidence already carried by the intake packet.
      inputs:
        objective: Roll out abandoned cart recovery across api and app.
        project_context: Example product workspace
        repo_root: fixtures/workspace
        change_set:
          change_set_id: change_set_abandoned_cart_982
          thread_locator: support://request/982
          summary: Add abandoned cart recovery across api and app.
          category: feature_request
          severity: medium
          recommended_lane: work-plan
          commence_decision: approve
          action_decision: proceed_to_plan
          target_surfaces:
            - surface: api
              kind: repo
              mutating: true
              rationale: Backend event handling changes first.
            - surface: app
              kind: repo
              mutating: true
              rationale: The app consumes the frozen backend contract.
          shared_invariants:
            - Preserve current checkout event semantics.
          success_criteria:
            - Api and app agree on the abandoned-cart contract.
      caller:
        answers:
          draft:
            work_plan_draft:
              decision: ready
              plan_kind: workspace_change
              change_set:
                change_set_id: change_set_abandoned_cart_982
                thread_locator: support://request/982
                summary: Add abandoned cart recovery across api and app.
                category: feature_request
                severity: medium
                recommended_lane: work-plan
                commence_decision: approve
                action_decision: proceed_to_plan
                target_surfaces:
                  - surface: api
                    kind: repo
                    mutating: true
                    rationale: Backend event handling changes first.
                  - surface: app
                    kind: repo
                    mutating: true
                    rationale: The app consumes the frozen backend contract.
                shared_invariants:
                  - Preserve current checkout event semantics.
                success_criteria:
                  - Api and app agree on the abandoned-cart contract.
              objective_summary: Roll out abandoned cart recovery across api and app.
              workspace_change_plan:
                plan_id: plan_abandoned_cart_982
                change_set_id: change_set_abandoned_cart_982
                objective_summary: Roll out abandoned cart recovery across api and app.
                shared_invariants:
                  - Preserve current checkout event semantics.
                success_criteria:
                  - Api and app agree on the abandoned-cart contract.
                phases:
                  - id: freeze-api-contract
                    name: Freeze api contract
                    depends_on: []
                    parallelizable: false
                    repo_change_requests:
                      - id: implement-api
                        repo: api
                        task_id: abandoned-cart-api
                        objective: Implement and publish the backend contract.
                        depends_on: []
                        shared_context_refs:
                          - change_set.shared_invariants
                        validation_commands:
                          - bundle exec rspec spec/services/abandoned_cart_spec.rb
                        mutating: true
                  - id: update-consumer
                    name: Update app consumer
                    depends_on:
                      - freeze-api-contract
                    parallelizable: false
                    repo_change_requests:
                      - id: implement-app
                        repo: app
                        task_id: abandoned-cart-app
                        objective: Update the app against the frozen contract.
                        depends_on:
                          - implement-api
                        shared_context_refs:
                          - freeze-api-contract
                        validation_commands:
                          - npm test
                        mutating: true
                integration_checks:
                  - Api and app contract fixtures agree.
                open_questions: []
              orchestration_steps:
                - id: implement-api
                  skill: ../issue-to-pr
                  scopes:
                    - git.write
                  mutating: true
                  inputs:
                    target_repo: api
                  context_from:
                    - change_set
                  description: Implement and verify the backend contract.
                - id: implement-app
                  skill: ../issue-to-pr
                  scopes:
                    - git.write
                  mutating: true
                  inputs:
                    target_repo: app
                  context_from:
                    - implement-api.pull_request
                  description: Update the app after the backend contract is frozen.
              required_skills:
                - name: issue-to-pr
                  exists: true
              open_questions: []
      expect:
        status: sealed
        steps:
          - inspect
          - draft
          - validate
        step_outputs:
          validate:
            subset:
              decision: ready
              plan_kind: workspace_change
              change_set:
                change_set_id: change_set_abandoned_cart_982
              validation:
                status: pass
                findings: []
              evidence:
                source_change_set_preserved: true
                catalog_skills:
                  - issue-to-pr
        receipt:
          schema: runx.receipt.v1
    - name: work-plan-invalid-phase-holds
      inputs:
        objective: Plan a bounded docs update.
      caller:
        answers:
          draft:
            work_plan_draft:
              decision: ready
              plan_kind: workspace_change
              change_set:
                change_set_id: change_set_docs
                thread_locator: objective://docs
                summary: Plan a bounded docs update.
                category: docs
                severity: low
                recommended_lane: work-plan
                commence_decision: approve
                action_decision: proceed_to_plan
                target_surfaces: []
                shared_invariants: []
                success_criteria:
                  - Documentation is updated.
              objective_summary: Plan a bounded docs update.
              workspace_change_plan:
                plan_id: plan_docs
                change_set_id: change_set_docs
                objective_summary: Plan a bounded docs update.
                shared_invariants: []
                success_criteria:
                  - Documentation is updated.
                phases:
                  - id: update-docs
                    name: Update docs
                    depends_on:
                      - missing-phase
                    parallelizable: false
                    repo_change_requests: []
                integration_checks:
                  - Documentation build passes.
                open_questions: []
              orchestration_steps: []
              required_skills: []
              open_questions: []
      expect:
        status: sealed
        step_outputs:
          validate:
            subset:
              decision: blocked
              workspace_change_plan: {}
              orchestration_steps: []
              validation:
                status: hold
                findings:
                  - code: phase.unknown_dependency
                    path: workspace_change_plan.phases[0].depends_on[0]
    - name: work-plan-skill-package-requires-skill-build
      inputs:
        objective: Add a new Runx operator skill.
        repo_root: fixtures/workspace
      caller:
        answers:
          draft:
            work_plan_draft:
              decision: ready
              plan_kind: skill_package
              change_set:
                change_set_id: change_set_new_skill
                thread_locator: objective://new-skill
                summary: Add a new Runx operator skill.
                category: feature_request
                severity: medium
                recommended_lane: work-plan
                commence_decision: approve
                action_decision: proceed_to_plan
                target_surfaces:
                  - surface: skills/new-skill
                    kind: package
                    mutating: true
                    rationale: A skill package must be authored.
                shared_invariants:
                  - Use the canonical Runx authoring lane.
                success_criteria:
                  - The skill has focused harness proof.
              objective_summary: Add a new Runx operator skill.
              workspace_change_plan:
                plan_id: plan_new_skill
                change_set_id: change_set_new_skill
                objective_summary: Add a new Runx operator skill.
                shared_invariants:
                  - Use the canonical Runx authoring lane.
                success_criteria:
                  - The skill has focused harness proof.
                phases:
                  - id: author-skill
                    name: Author skill
                    depends_on: []
                    parallelizable: false
                    repo_change_requests: []
                integration_checks:
                  - Focused harness passes.
                open_questions: []
              orchestration_steps:
                - id: generic-repo-change
                  skill: ../issue-to-pr
                  scopes:
                    - git.write
                  mutating: true
                  inputs: {}
                  context_from:
                    - change_set
                  description: Use a generic repo lane to author the skill.
              required_skills:
                - name: issue-to-pr
                  exists: true
              open_questions: []
      expect:
        status: sealed
        step_outputs:
          validate:
            subset:
              decision: blocked
              validation:
                status: hold
                findings:
                  - code: skill_package.skill_build_required
                    path: orchestration_steps
runners:
  work-plan-agent:
    default: true
    inputs:
      objective:
        type: string
        required: true
        description: Build or automation objective to decompose.
      project_context:
        type: string
        required: false
        description: Repository, product, and operator constraints.
      thread_locator:
        type: string
        required: false
        description: Canonical locator for the bounded source thread.
      thread:
        type: object
        required: false
        description: Portable source thread when the objective came from an existing conversation.
        schema:
          additionalProperties: true
      change_set:
        type: object
        required: false
        description: Parent change artifact from issue-intake or a workspace supervisor.
        schema:
          required: [change_set_id, shared_invariants, success_criteria]
          properties:
            change_set_id: { type: string, minLength: 1, maxLength: 256 }
            action_decision: { type: string, enum: [proceed_to_plan, needs_clarification, hold] }
            commence_decision: { type: string, enum: [approve, hold] }
            thread_locator: { type: string, minLength: 1, maxLength: 2048 }
            shared_invariants:
              type: array
              maxItems: 100
              items: { type: string, minLength: 1, maxLength: 4000 }
            success_criteria:
              type: array
              maxItems: 100
              items: { type: string, minLength: 1, maxLength: 4000 }
          additionalProperties: true
      harness_context:
        type: object
        required: false
        description: Optional captured control context to pass through unchanged.
        schema:
          additionalProperties: true
      repo_root:
        type: string
        required: false
        default: .
        description: Workspace root used for native skill-catalog inspection.
    result_from: [validate]
    steps:
      - id: inspect
        label: inspect the local skill catalog
        tool: runx.skill.inspect
        scopes:
          - fs.read
        inputs:
          repo_root: $input.repo_root
      - id: draft
        label: decompose objective at governance boundaries
        agent: { role: builder, task: work-plan-draft }
        outputs:
          work_plan_draft: object
        inputs:
          objective: $input.objective
          project_context: $input.project_context
          thread_locator: $input.thread_locator
          thread: $input.thread
          change_set: $input.change_set
          catalog_skills: $steps.inspect.authoring_context.catalog_skills
          harness_context: $input.harness_context
          repo_root: $input.repo_root
        artifacts:
          named_emits:
            work_plan_draft: work_plan_draft
      - id: validate
        label: validate plan graph and evidence bindings
        inputs:
          objective: $input.objective
          thread_locator: $input.thread_locator
          thread: $input.thread
          project_context: $input.project_context
          change_set: $input.change_set
          harness_context: $input.harness_context
          work_plan_draft: $steps.draft.work_plan_draft
          catalog_skills: $steps.inspect.authoring_context.catalog_skills
        tool: { module: work-plan.mjs }
        outputs:
          decision: string
          plan_kind: string
          change_set: object
          harness_context: object
          objective_summary: string
          workspace_change_plan: object
          orchestration_steps: array
          required_skills: array
          open_questions: array
          evidence: object
          validation: object
        artifacts:
          wrap_as: work_plan
          packet: runx.builder.work_plan.v1
