skill: settle-invoice
version: "0.5.4"
catalog: { kind: graph, audience: operator, visibility: public, role: canonical, execution: execute, completion: provider_readback, approval: required, category: payments }
connectors:
  payment:
    operations: [payment.invoice.settle, payment.invoice.read]
    connector_from: $input.rail
    allowed_connectors: [mpp]
runners:
  settle-invoice:
    default: true
    inputs:
      invoice_ref: { type: string, required: true }
      amount_minor: { type: integer, required: true }
      currency: { type: string, required: true }
      payee: { type: object, required: true }
      rail: { type: string, required: true }
      rail_profile_ref: { type: string, required: true }
      parent_payment_authority: { type: json, required: true }
      idempotency_seed: { type: string, required: true }
      realm: { type: string, required: false }
    result_from: [readback]
    steps:
      - id: settle
        operation: payment/payment.invoice.settle
        idempotency_key: $input.idempotency_seed
        approval:
          reason: Approve settling this exact invoice through the selected rail.
          type: invoice_settlement
        amount: { units: $input.amount_minor, unit: $input.currency }
        result_fields: [payment_ref, invoice_ref, amount_minor, currency, status]
        input: { invoice_ref: $input.invoice_ref, amount_minor: $input.amount_minor, currency: $input.currency, payee: $input.payee, rail_profile_ref: $input.rail_profile_ref, parent_payment_authority: $input.parent_payment_authority, realm: $input.realm }
      - id: readback
        operation: payment/payment.invoice.read
        result_fields: [payment_ref, invoice_ref, amount_minor, currency, status]
        input: $steps.settle.provider_operation.result
        expected_result: $steps.settle.provider_operation.result
