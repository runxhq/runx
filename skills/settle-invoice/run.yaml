skill: settle-invoice
version: "1.0.0"
catalog: { kind: graph, audience: operator, visibility: public, role: canonical, execution: execute, completion: provider_readback, approval: required, category: payments }
runners:
  settle-invoice:
    default: true
    inputs:
      invoice_ref: { type: string, required: true, description: The invoice's own reference., schema: { minLength: 1, maxLength: 256 } }
      amount_minor: { type: integer, required: true, description: The amount due in minor units. }
      currency: { type: string, required: true, description: ISO 4217 code of the amount due. }
      payee: { type: object, required: true, description: "The payee's HTTPS payment endpoint (payment_url) and EVM address (pay_to)." }
      parent_payment_authority: { type: json, required: true, description: The parent's USD authority to pay this payee. }
      idempotency_seed: { type: string, required: true, description: Stable settlement idempotency material., schema: { minLength: 16, maxLength: 500 } }
    result_from: [settle]
    steps:
      - id: admit
        inputs: { invoice_ref: $input.invoice_ref, amount_minor: $input.amount_minor, currency: $input.currency, payee: $input.payee, parent_payment_authority: $input.parent_payment_authority }
        tool: { module: invoice.mjs, export: admitInvoice, timeout_seconds: 5 }
        outputs: { payment_signal: object }
      - id: settle
        skill: ../pay
        runner: pay
        inputs:
          payment_signal: $steps.admit.payment_signal
          parent_payment_authority: $input.parent_payment_authority
          idempotency_seed: $input.idempotency_seed

harness:
  files: [fixtures/support/composed.graph]
  cases: []
