version: "0.1.11"
minimum_runx: 0.12.0
default_method: review
catalog:
  visibility: public
  category: growth

methods:
  review:
    description: Collect missing site or selected measurement evidence, then prioritize organic-growth work through the existing analysis phase.
    inputs:
      collection_notes:
        type: array
        default: []
        description: Prior source-read failures and measurement caveats to preserve when existing evidence is reused.
        items: {type: string}
        optional: true
      objective:
        type: string
        description: Bounded organic-discovery outcome or decision.
      site_url:
        type: string
        description: Canonical HTTPS site root.
      search_evidence:
        type: object
        default: {}
        description: Sealed search-performance evidence packet.
        optional: true
      analytics_evidence:
        type: object
        default: {}
        description: Sealed analytics report evidence packet.
        optional: true
      site_evidence:
        type: array
        default: []
        description: Bounded site or market evidence records with SHA-256 digests.
        optional: true
      business_context:
        description: Business outcomes, audiences, offers, and known constraints; context is not source evidence.
        optional: true
      constraints:
        description: Time, risk, brand, legal, technical, and resource constraints.
        optional: true
      source_context:
        type: object
        default: {}
        description: Known property/date/measurement selectors and relevant page URLs; never credentials or hosted backend ids.
        optional: true
    result_from: [reuse, analyze-collected]
    examples:
      - site_url: https://acme.example/
        objective: Find which pages to improve to earn more organic signups this quarter.
    steps:
      - id: select-evidence
        tool: data.compare
        inputs:
          actual: {search: $input.search_evidence, analytics: $input.analytics_evidence, site: $input.site_evidence}
          expected: {search: {}, analytics: {}, site: []}
      - id: reuse
        when: {value: $steps.select-evidence.comparison.equal, equals: false}
        skill: .#analyze
        inputs:
          objective: $input.objective
          site_url: $input.site_url
          business_context: $input.business_context
          constraints: $input.constraints
          collection_notes: $input.collection_notes
          search_evidence: $input.search_evidence
          analytics_evidence: $input.analytics_evidence
          site_evidence: $input.site_evidence
      - id: collect
        when: {value: $steps.select-evidence.comparison.equal, equals: true}
        agent: organic-growth-collect
        calls:
          skills: [../web-fetch, ../google-search-console, ../google-analytics]
          ask: true
        inputs:
          objective: $input.objective
          site_url: $input.site_url
          business_context: $input.business_context
          constraints: $input.constraints
          source_context: $input.source_context
        outputs:
          search_evidence: {type: object}
          analytics_evidence: {type: object}
          site_evidence: {type: array}
          collection_notes: {type: array, items: {type: string}}
      - id: analyze-collected
        when: {value: $steps.select-evidence.comparison.equal, equals: true}
        skill: .#analyze
        inputs:
          objective: $input.objective
          site_url: $input.site_url
          business_context: $input.business_context
          constraints: $input.constraints
          search_evidence: $steps.collect.search_evidence
          analytics_evidence: $steps.collect.analytics_evidence
          site_evidence: $steps.collect.site_evidence
          collection_notes: $steps.collect.collection_notes

  analyze:
    description: "Interpret supplied search, analytics and site evidence without collecting the same sources again."
    inputs:
      collection_notes:
        type: array
        description: Actual source-read gaps and caveats from a preceding acquisition; these are context, not invented metrics.
        items: {type: string}
        optional: true
      objective:
        type: string
        description: Bounded organic-discovery outcome or decision.
      site_url:
        type: string
        description: Canonical HTTPS site root.
      search_evidence:
        description: Sealed search-performance evidence packet.
        optional: true
      analytics_evidence:
        description: Sealed analytics report evidence packet.
        optional: true
      site_evidence:
        description: Bounded site or market evidence records with SHA-256 digests.
        optional: true
      business_context:
        description: Business outcomes, audiences, offers, and known constraints; context is not source evidence.
        optional: true
      constraints:
        description: Time, risk, brand, legal, technical, and resource constraints.
        optional: true
    result_from: [reject, finalize]
    steps:
      - id: admit
        inputs:
          collection_notes: $input.collection_notes
          objective: $input.objective
          site_url: $input.site_url
          search_evidence: $input.search_evidence
          analytics_evidence: $input.analytics_evidence
          site_evidence: $input.site_evidence
          business_context: $input.business_context
          constraints: $input.constraints
        tool: {module: organic-growth.mjs, export: admitGrowthEvidence}
        outputs:
          growth_context: {type: object}

      - id: reject
        when:
          value: $steps.admit.growth_context.decision
          equals: needs_more_evidence
        tool: evidence.verify_artifact
        inputs:
          artifact_name: organic_growth_packet
          candidate: {decision: ready}
          require_claim_bindings: true
          fallback_artifact:
            decision: needs_more_evidence
            objective: ""
            site_url: ""
            executive_summary: ""
            observations: []
            hypotheses: []
            opportunities: []
            recommended_actions: []
            geo_review: {}
            measurement_plan: {}
            claims: []
            risks: []
            missing_evidence: []
            source_evidence: []
            analysis_scope: {}
            input_caveats: []
            external_status: not_executed
          fallback_bindings:
            - {target_path: objective, source_path: objective}
            - {target_path: site_url, source_path: site_url}
            - {target_path: missing_evidence, source_path: blockers}
            - {target_path: source_evidence, source_path: sources}
            - {target_path: analysis_scope, source_path: analysis_scope}
            - {target_path: input_caveats, source_path: caveats}
          source_digests: $steps.admit.growth_context.source_digests
          source_records: $steps.admit.growth_context.source_records
          fallback_source: $steps.admit.growth_context
        outputs:
          organic_growth_packet: {optional: true}

      - id: analyze
        when:
          value: $steps.admit.growth_context.decision
          equals: ready
        agent: organic-growth-analyze
        outputs:
          growth_candidate:
            type: object
            properties:
              decision:
                type: string
              objective:
                type: string
              site_url:
                type: string
              executive_summary:
                type: string
              observations:
                type: array
                items:
                  type: object
                  properties:
                    statement:
                      type: string
                    epistemic_status:
                      type: string
                    source_digests:
                      type: array
                      items:
                        type: string
              hypotheses:
                type: array
                items:
                  type: object
                  properties:
                    statement:
                      type: string
                    epistemic_status:
                      type: string
                    source_digests:
                      type: array
                      items:
                        type: string
              opportunities:
                type: array
                items:
                  type: object
                  properties:
                    title:
                      type: string
                    rationale:
                      type: string
                    source_digests:
                      type: array
                      items:
                        type: string
              recommended_actions:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    title:
                      type: string
                    rationale:
                      type: string
                    priority:
                      type: string
                    confidence:
                      type: string
                    effort:
                      type: string
                    owner_type:
                      type: string
                    expected_signal:
                      type: string
                    verification:
                      type: string
                    stop_condition:
                      type: string
                    source_digests:
                      type: array
                      items:
                        type: string
              geo_review:
                type: object
                properties:
                  assessment:
                    type: string
                  source_digests:
                    type: array
                    items:
                      type: string
              measurement_plan:
                type: object
                properties:
                  baseline:
                    type: string
                  leading_signals:
                    type: string
                  business_outcomes:
                    type: string
                  comparison_window:
                    type: string
                  reconsideration_trigger:
                    type: string
              claims:
                type: array
                items:
                  type: object
                  properties:
                    claim:
                      type: string
                    source_digests:
                      type: array
                      items:
                        type: string
              risks:
                type: array
                items:
                  type: string
              missing_evidence:
                type: array
                items:
                  type: string
              external_status:
                type: string
            required:
              - decision
            if:
              properties:
                decision:
                  pattern: ^ready
            then:
              required:
                - objective
                - site_url
                - executive_summary
                - observations
                - hypotheses
                - opportunities
                - recommended_actions
                - geo_review
                - measurement_plan
                - claims
                - risks
                - missing_evidence
                - external_status
        inputs:
          growth_context: $steps.admit.growth_context
          objective: $input.objective
          site_url: $input.site_url
          search_evidence: $input.search_evidence
          analytics_evidence: $input.analytics_evidence
          site_evidence: $input.site_evidence
          business_context: $input.business_context
          constraints: $input.constraints

      - id: finalize
        when:
          value: $steps.admit.growth_context.decision
          equals: ready
        tool: evidence.verify_artifact
        inputs:
          artifact_name: organic_growth_packet
          required_paths:
            - executive_summary
            - recommended_actions
            - measurement_plan
            - claims
          required_value_bindings:
            - {candidate_path: objective, source_path: objective}
            - {candidate_path: site_url, source_path: site_url}
          authoritative_bindings:
            - {target_path: source_evidence, source_path: sources}
            - {target_path: analysis_scope, source_path: analysis_scope}
            - {target_path: input_caveats, source_path: caveats}
          fallback_artifact:
            decision: needs_more_evidence
            objective: ""
            site_url: ""
            executive_summary: ""
            observations: []
            hypotheses: []
            opportunities: []
            recommended_actions: []
            geo_review: {}
            measurement_plan: {}
            claims: []
            risks: []
            missing_evidence:
              - Evidence bindings or required analysis fields did not validate.
            source_evidence: []
            analysis_scope: {}
            input_caveats: []
            external_status: not_executed
          fallback_bindings:
            - {target_path: objective, source_path: objective}
            - {target_path: site_url, source_path: site_url}
            - {target_path: source_evidence, source_path: sources}
            - {target_path: analysis_scope, source_path: analysis_scope}
            - {target_path: input_caveats, source_path: caveats}
          candidate: $steps.analyze.growth_candidate
          claim_bindings: $steps.analyze.growth_candidate.claims
          reference_bindings: $steps.analyze.growth_candidate.recommended_actions
          source_digests: $steps.admit.growth_context.source_digests
          source_records: $steps.admit.growth_context.source_records
          identity_source: $steps.admit.growth_context
          authoritative_source: $steps.admit.growth_context
          fallback_source: $steps.admit.growth_context
        outputs:
          organic_growth_packet: {optional: true}
