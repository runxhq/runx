skill: purchase-approval
version: "0.1.4"

catalog:
  kind: graph
  audience: operator
  visibility: public
  role: canonical
  execution: read
  completion: runtime_receipt
  approval: none

harness:
  files: [fixtures/support/composed.graph]
  cases:
    - name: purchase-approval-approves-in-policy
      operator_journeys:
        - mode: standalone
          confusors: [spend, settle-invoice]
          request: Decide whether this purchase is allowed under the procurement policy before any money moves.
          expected_outcome: Return an approval decision bound to the exact request and policy digests, with no spend executed.
        - mode: composed
          request: Continue from this already decided purchase approval into the spend flow.
          expected_outcome: Reuse the sealed approval decision without re-deciding policy.
          prior_evidence:
            - The purchase request, procurement policy, and sealed decision supplied by the prior step.
          must_not_repeat:
            - Do not re-derive the policy decision already sealed.
      inputs:
        purchase_request:
          vendor: sourcey
          amount: 125
          currency: USD
          purpose: generate public llms.txt docs for a maintained OSS project
        procurement_policy:
          currency: USD
          remaining_budget: 300
          single_purchase_cap: 200
          approved_vendors: [sourcey, runx]
          approval_threshold: 200
      expect:
        status: sealed
        steps: [digest-request, digest-policy, decide]
        step_outputs:
          decide:
            subset:
              purchase_approval:
                data:
                  schema: runx.purchase_approval.v1
                  decision: approved
                  vendor: sourcey
                  ceiling_amount: 200
                  human_lane: null
                  refused_reason: null
                  spend_executed: false
                  validation: { status: pass, findings: [] }
        receipt: { schema: runx.receipt.v1 }

    - name: purchase-approval-refuses-unapproved-vendor
      inputs:
        purchase_request:
          vendor: unknown-ai-tool
          amount: 450
          currency: USD
          purpose: buy unreviewed credits
        procurement_policy:
          currency: USD
          remaining_budget: 300
          single_purchase_cap: 200
          approved_vendors: [sourcey, runx]
          approval_threshold: 200
      expect:
        status: sealed
        steps: [digest-request, digest-policy, decide]
        step_outputs:
          decide:
            subset:
              purchase_approval:
                data:
                  decision: refused
                  refused_reason: unapproved_vendor
                  spend_executed: false
        receipt: { schema: runx.receipt.v1 }

    - name: purchase-approval-routes-threshold-to-human
      inputs:
        purchase_request:
          vendor: runx
          amount: 200
          currency: USD
          purpose: annual plan renewal
        procurement_policy:
          currency: USD
          remaining_budget: 500
          single_purchase_cap: 400
          approved_vendors: [sourcey, runx]
          approval_threshold: 200
          human_lane: finance-review
      expect:
        status: sealed
        steps: [digest-request, digest-policy, decide]
        step_outputs:
          decide:
            subset:
              purchase_approval:
                data:
                  decision: needs_human
                  human_lane: finance-review
                  spend_executed: false
        receipt: { schema: runx.receipt.v1 }

    - name: purchase-approval-refuses-missing-policy
      inputs:
        purchase_request:
          vendor: sourcey
          amount: 125
          currency: USD
        procurement_policy:
          currency: USD
      expect:
        status: sealed
        steps: [digest-request, digest-policy, decide]
        step_outputs:
          decide:
            subset:
              purchase_approval:
                data:
                  decision: refused
                  refused_reason: missing_policy_authority
                  validation: { status: fail }
        receipt: { schema: runx.receipt.v1 }

runners:
  decide:
    default: true
    inputs:
      purchase_request:
        type: object
        required: true
        description: One proposed purchase with vendor, amount, currency, and purpose.
        schema:
          additionalProperties: false
          properties:
            vendor: { type: string, minLength: 1, maxLength: 500 }
            amount: { type: number, exclusiveMinimum: 0 }
            currency: { type: string, minLength: 1, maxLength: 10 }
            purpose: { type: string, maxLength: 2000 }
      procurement_policy:
        type: object
        required: true
        description: Explicit procurement authority; missing fields refuse instead of guessing.
        schema:
          additionalProperties: false
          properties:
            currency: { type: string, minLength: 1, maxLength: 10 }
            remaining_budget: { type: number, exclusiveMinimum: 0 }
            single_purchase_cap: { type: number, exclusiveMinimum: 0 }
            approved_vendors:
              type: array
              maxItems: 500
              items: { type: string, minLength: 1, maxLength: 500 }
            approval_threshold: { type: number, exclusiveMinimum: 0 }
            human_lane: { type: string, minLength: 1, maxLength: 200 }
    examples:
      - purchase_request:
          vendor: sourcey
          amount: 125
          currency: USD
          purpose: generate public llms.txt docs
        procurement_policy:
          currency: USD
          remaining_budget: 300
          single_purchase_cap: 200
          approved_vendors: [sourcey, runx]
          approval_threshold: 200
    result_from: [decide]
    steps:
      - id: digest-request
        tool: data.digest
        inputs:
          value: $input.purchase_request

      - id: digest-policy
        tool: data.digest
        inputs:
          value: $input.procurement_policy

      - id: decide
        label: apply the procurement policy deterministically
        inputs:
          purchase_request: $input.purchase_request
          procurement_policy: $input.procurement_policy
          request_digest: $steps.digest-request.digest_result.digest
          policy_digest: $steps.digest-policy.digest_result.digest
        tool: { module: purchase-approval.mjs, export: decidePurchase }
        outputs:
          purchase_approval:
            type: object
            schema:
              required: [schema, decision, reason, vendor, amount, currency, ceiling_amount, human_lane, refused_reason, policy_refs, validation, spend_executed, request_digest, policy_digest]
              additionalProperties: false
              properties:
                schema: { const: runx.purchase_approval.v1 }
                decision: { type: string, enum: [approved, refused, needs_human] }
                reason: { type: string, minLength: 1, maxLength: 2000 }
                vendor: { type: string, maxLength: 500 }
                amount: { type: number, minimum: 0 }
                currency: { type: string, maxLength: 10 }
                ceiling_amount: { type: number, minimum: 0 }
                human_lane: { type: [string, "null"], maxLength: 200 }
                refused_reason: { type: [string, "null"], maxLength: 200 }
                policy_refs:
                  type: array
                  maxItems: 20
                  items: { type: string, minLength: 1, maxLength: 200 }
                validation:
                  type: object
                  required: [status, findings]
                  additionalProperties: false
                  properties:
                    status: { type: string, enum: [pass, fail] }
                    findings:
                      type: array
                      maxItems: 50
                      items:
                        type: object
                        required: [code, message]
                        additionalProperties: false
                        properties:
                          code: { type: string, minLength: 1, maxLength: 200 }
                          message: { type: string, minLength: 1, maxLength: 2000 }
                spend_executed: { const: false }
                request_digest: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
                policy_digest: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
        artifacts:
          named_emits:
            purchase_approval: purchase_approval
