            matching_signal: retention policy
            reason: An invented source the validator refuses.
        owner_recommendation: null
        next_skill: null
    route/1#propose:
      route_proposal:
        verdict: routed
        route:
          domain: policy
          rationale: Use the retention FAQ.
          source_ids:
            - retention-faq
        source_matches:
          - source_id: retention-faq
            matching_signal: retention policy
            reason: An invented source the validator refuses.
        owner_recommendation: null
        next_skill: null
expect:
