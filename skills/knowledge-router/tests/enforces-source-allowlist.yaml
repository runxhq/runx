name: enforces-source-allowlist
inputs:
  question: Which existing source and owner should I inspect before changing artifact lifetime across CLI process exits?
  available_sources:
    sources:
      - id: artifact-store
        kind: code
        summary: Native local artifact admission, immutable snapshots and run-scoped reads.
        locator: crates/runx-runtime/src/services/workspace_files/artifacts.rs
      - id: author-contract
        kind: docs
        summary: Declared artifact URI lifetime and page-consumption contract.
        locator: docs/skill-author-runtime-contract.md
      - id: registry-pages
        kind: docs
        summary: Catalog product presentation and review status.
        locator: docs/core-skill-review.md
    owners:
      - id: native-runtime
        domains:
          - artifact-lifetime
          - local-execution
      - id: skill-authoring
        domains:
          - skill-authoring
    skills:
      - id: prior-art
        purpose: Inspect bounded local sources and return an evidence-bound reuse or amendment recommendation.
      - id: research
        purpose: Research admitted external sources.
  constraints:
    allowed_sources:
      - artifact-store
      - author-contract
    allowed_owners:
      - native-runtime
    allowed_skills:
      - prior-art
host:
  answers:
    propose:
      route_proposal:
        verdict: routed
        route:
          domain: artifact-lifetime
          rationale: Inspect the artifact owner and its execution contract before changing lifecycle behavior.
          source_ids:
            - registry-pages
        source_matches:
          - source_id: registry-pages
            matching_signal: catalog
            reason: Selected despite the source restriction.
        owner_recommendation:
          owner_id: native-runtime
          rationale: This catalog assigns artifact-lifetime to the native runtime owner.
          escalation_required: false
        next_skill:
          skill: prior-art
          rationale: Inspect the two exact local sources without rediscovery or a provider.
expect:
  status: sealed
  step_outputs:
    route:
      subset:
        knowledge_route:
          verdict: refused
          validation:
            valid: false
