version: "0.2.13"
minimum_runx: 0.12.0
catalog:
  visibility: public
  category: ops
methods:
  route:
    inputs:
      question:
        type: string
        description: Question, source event, or thread summary to route.
        minLength: 1
      available_sources:
        type: object
        description: The maintained bounded index selected by this host. Exact source, owner/domain and follow-up skill records; selected source locators are resolved against this same catalog.
        additionalProperties: false
        required:
          - sources
          - owners
          - skills
        properties:
          sources:
            type: array
            items:
              type: object
              required:
                - id
                - kind
                - summary
              properties:
                id:
                  type: string
                  minLength: 1
                  maxLength: 1000
                  pattern: \S
                kind:
                  type: string
                  minLength: 1
                  maxLength: 500
                  pattern: \S
                summary:
                  type: string
                  minLength: 1
                  maxLength: 10000
                  pattern: \S
                locator:
                  type: string
                  minLength: 1
                  maxLength: 4000
                  pattern: \S
              additionalProperties: true
          owners:
            type: array
            items:
              type: object
              required:
                - id
                - domains
              properties:
                id:
                  type: string
                  minLength: 1
                  maxLength: 1000
                  pattern: \S
                domains:
                  type: array
                  uniqueItems: true
                  items:
                    type: string
                    minLength: 1
                    maxLength: 500
                    pattern: \S
              additionalProperties: true
          skills:
            type: array
            items:
              type: object
              required:
                - id
                - purpose
              properties:
                id:
                  type: string
                  minLength: 1
                  maxLength: 1000
                  pattern: \S
                purpose:
                  type: string
                  minLength: 1
                  maxLength: 10000
                  pattern: \S
              additionalProperties: true
      constraints:
        type: object
        description: Selection limits, not authority. An absent allowlist imposes no additional limit; an empty one allows no selections of that kind. notes is advisory context.
        additionalProperties: false
        properties:
          allowed_sources:
            type: array
            uniqueItems: true
            items:
              type: string
              minLength: 1
              maxLength: 1000
          excluded_sources:
            type: array
            uniqueItems: true
            items:
              type: string
              minLength: 1
              maxLength: 1000
          allowed_owners:
            type: array
            uniqueItems: true
            items:
              type: string
              minLength: 1
              maxLength: 1000
          allowed_skills:
            type: array
            uniqueItems: true
            items:
              type: string
              minLength: 1
              maxLength: 1000
          notes:
            type: string
            maxLength: 10000
        optional: true
    result_from:
      - validate
    steps:
      - id: digest
        tool: data.digest
        inputs:
          value: $input.available_sources
      - id: propose
        agent: knowledge-router-propose
        inputs: $input
        outputs:
          route_proposal:
            type: object
            additionalProperties: false
            required:
              - verdict
              - route
              - source_matches
              - owner_recommendation
              - next_skill
            properties:
              verdict:
                enum:
                  - routed
                  - needs_more_context
                  - manual_review
                type: string
                minLength: 1
                pattern: \S
              route:
                additionalProperties: false
                properties:
                  domain:
                    maxLength: 500
                    type:
                      - string
                      - "null"
                    minLength: 1
                    pattern: \S
                  rationale:
                    maxLength: 4000
                    minLength: 1
                    type: string
                    pattern: \S
                  source_ids:
                    items:
                      maxLength: 1000
                      minLength: 1
                      type: string
                      pattern: \S
                    maxItems: 500
                    type: array
                    uniqueItems: true
                required:
                  - domain
                  - rationale
                  - source_ids
                type: object
              source_matches:
                items:
                  additionalProperties: false
                  properties:
                    matching_signal:
                      maxLength: 4000
                      type: string
                      minLength: 1
                      pattern: \S
                    reason:
                      maxLength: 4000
                      type: string
                      minLength: 1
                      pattern: \S
                    source_id:
                      maxLength: 1000
                      minLength: 1
                      type: string
                      pattern: \S
                  required:
                    - source_id
                    - matching_signal
                    - reason
                  type: object
                maxItems: 500
                type: array
              owner_recommendation:
                additionalProperties: false
                properties:
                  escalation_required:
                    type: boolean
                  owner_id:
                    maxLength: 1000
                    minLength: 1
                    type: string
                    pattern: \S
                  rationale:
                    maxLength: 4000
                    type: string
                    minLength: 1
                    pattern: \S
                required:
                  - owner_id
                  - rationale
                  - escalation_required
                type:
                  - object
                  - "null"
              next_skill:
                additionalProperties: false
                properties:
                  rationale:
                    maxLength: 4000
                    type: string
                    minLength: 1
                    pattern: \S
                  skill:
                    maxLength: 1000
                    minLength: 1
                    type: string
                    pattern: \S
                required:
                  - skill
                  - rationale
                type:
                  - object
                  - "null"
      - id: validate
        inputs:
          available_sources: $input.available_sources
          constraints: $input.constraints
          route_proposal: $steps.propose.route_proposal
          catalog_digest: $steps.digest.digest_result.digest
        tool:
          module: knowledge-router.mjs
        outputs:
          knowledge_route:
            type: object
            packet: runx/knowledge-router.route.v1
    examples:
      - question: Can API keys be scoped to read-only campaign analytics?
        available_sources:
          sources:
            - id: auth-docs
              kind: docs
              summary: Authentication and API key scopes.
            - id: campaigns-docs
              kind: docs
              summary: Campaign analytics fields and export limits.
          owners:
            - id: security-team
              domains:
                - authentication
            - id: growth-team
              domains:
                - campaigns
          skills:
            - id: research
              purpose: Resolve a bounded source-backed question.
