skill: agency
version: "0.1.9"

catalog:
  kind: graph
  audience: operator
  visibility: public
  role: canonical
  execution: execute
  completion: runtime_receipt
  requires_adapter: true
  approval: conditional
  category: ops

emits:
  - name: agency_turn
    packet: runx.agency.turn.v1

runners:
  advance:
    default: true
    inputs:
      data_source_ref:
        type: string
        required: true
        description: Logical data source holding the case stream.
      case_id:
        type: string
        required: true
        description: The case aggregate id.
      driver_id:
        type: string
        required: true
        description: The driver advancing the case; part of the per-turn contention lease.
      member_result:
        type: json
        required: false
        description: The outcome of the dispatch this driver previously issued, fed back so the turn records it.
    result_from: [append]
    steps:
      - id: read
        skill: ../data-store
        runner: read_events
        inputs:
          data_source_ref: "$input.data_source_ref"
          resource: agency_cases
          aggregate_id: "$input.case_id"
          limit: 500
      - id: reduce
        skill: ./graph/reduce
        inputs:
          case_id: "$input.case_id"
          member_result: "$input.member_result"
          events: $steps.read.data_operation_result.events
      - id: decide
        skill: ../ops-desk
        runner: advance
        inputs:
          scope_ref: "$input.case_id"
          mandate: $steps.reduce.reduction.mandate
          case_state: $steps.reduce.reduction.case_state
          candidate_roster: $steps.reduce.reduction.roster
      - id: plan
        skill: ./graph/plan
        inputs:
          driver_id: "$input.driver_id"
          case_id: "$input.case_id"
          member_result: "$input.member_result"
          decision: $steps.decide.dispatch_decision
          reduction: $steps.reduce.reduction
        artifacts:
          wrap_as: turn_plan
          packet: runx.agency.turn.v1
      - id: append
        skill: ../data-store
        runner: append_event
        inputs:
          data_source_ref: "$input.data_source_ref"
          resource: agency_cases
          aggregate_id: "$input.case_id"
          event: $steps.plan.turn_plan.turn_event
          expected_version: $steps.plan.turn_plan.expected_version
          idempotency_key: $steps.plan.turn_plan.idempotency_key

  open:
    inputs:
      data_source_ref:
        type: string
        required: true
        description: Logical data source that will hold the case stream.
      case_id:
        type: string
        required: true
        description: The case aggregate id to open.
      agency_ref:
        type: string
        required: true
        description: The operator-bound agency definition this case runs under.
      mandate:
        type: string
        required: true
        description: The standing objective the case advances toward.
      roster:
        type: json
        required: true
        description: The fixed members the case may dispatch, as [{ role, skill, scope }].
      limits:
        type: json
        required: true
        description: Cumulative caps (max_turns, spend) the measurable gate enforces.
      signal:
        type: string
        required: false
        default: ""
        description: The originating signal that opened the case.
    result_from: [open]
    steps:
      - id: open
        skill: ../data-store
        runner: append_event
        inputs:
          data_source_ref: "$input.data_source_ref"
          resource: agency_cases
          aggregate_id: "$input.case_id"
          expected_version: 0
          idempotency_key: "$input.case_id"
          event:
            type: opened
            payload:
              agency_ref: "$input.agency_ref"
              mandate: "$input.mandate"
              roster: "$input.roster"
              limits: "$input.limits"
              signal: "$input.signal"

  status:
    inputs:
      data_source_ref:
        type: string
        required: true
        description: Logical data source holding the case stream.
      case_id:
        type: string
        required: true
        description: The case aggregate id to read.
    result_from: [reduce]
    steps:
      - id: read
        skill: ../data-store
        runner: read_events
        inputs:
          data_source_ref: "$input.data_source_ref"
          resource: agency_cases
          aggregate_id: "$input.case_id"
          limit: 500
      - id: reduce
        skill: ./graph/reduce
        inputs:
          case_id: "$input.case_id"
          events: $steps.read.data_operation_result.events

harness:
  files: [fixtures/support/open-advance-status.graph]
  cases: []
