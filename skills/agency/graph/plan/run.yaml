skill: agency-plan
version: "0.1.0"

catalog:
  kind: skill
  audience: public
  visibility: internal
  role: graph-stage
  part_of:
    - runx/agency

runners:
  default:
    default: true
    inputs:
      decision:
        type: json
        required: false
        description: The ops-desk dispatch_decision for this turn.
      reduction:
        type: json
        required: true
        description: The folded case projection from agency-reduce.
      member_result:
        type: json
        required: false
        description: The dispatch outcome to persist on this turn event.
      driver_id:
        type: string
        required: true
        description: The driver advancing the case; part of the per-turn contention key.
      case_id:
        type: string
        required: true
        description: The case aggregate id.
    steps:
      - id: default
        tool: { module: plan.mjs }
        inputs:
          decision: $input.decision
          reduction: $input.reduction
          member_result: $input.member_result
          driver_id: $input.driver_id
          case_id: $input.case_id
        outputs:
          turn_event:
            type: object
            schema:
              required: [type, payload]
              additionalProperties: false
              properties:
                type: { const: turn }
                payload:
                  type: object
                  required: [driver_id, turn, decision, predicates]
                  additionalProperties: false
                  properties:
                    driver_id: { type: string, minLength: 1 }
                    turn: { type: integer, minimum: 1 }
                    decision: { type: string, enum: [dispatch, escalate, done, failed] }
                    predicates:
                      type: object
                      additionalProperties: { type: boolean }
                    member_result: { type: [object, "null"], additionalProperties: true }
                    dispatch: { type: [object, "null"], additionalProperties: true }
                    escalation:
                      type: [object, "null"]
                      properties:
                        to: { type: string }
                        trigger: { type: string }
                        ask: { type: string }
                        approval_prompt: { type: [string, "null"] }
                      additionalProperties: false
                    resolution: { type: [object, "null"], additionalProperties: true }
          expected_version: integer
          idempotency_key: string
          agency_turn:
            type: object
            schema:
              required: [schema, status, case_id, turn, dispatch, approval_prompt, resolution, predicates, reason, next]
              additionalProperties: false
              properties:
                schema: { const: runx.agency.turn.v1 }
                status: { type: string, enum: [advanced, awaiting_approval, resolved, failed] }
                case_id: { type: string, minLength: 1 }
                turn: { type: integer, minimum: 1 }
                dispatch: { type: [object, "null"], additionalProperties: true }
                approval_prompt: { type: [string, "null"] }
                resolution: { type: [object, "null"], additionalProperties: true }
                predicates:
                  type: object
                  additionalProperties: { type: boolean }
                reason: { type: [string, "null"] }
                next: { type: string, minLength: 1 }
        artifacts:
          wrap_as: turn_plan
          packet: runx.agency.turn.v1
