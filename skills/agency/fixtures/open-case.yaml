name: agency-open-case
kind: skill
target: ..
runner: open
operator_journeys:
  - mode: standalone
    confusors: [ops-desk, chief-of-staff]
    request: Open a governed agency case to keep the API documentation accurate.
    expected_outcome: Persist one bounded case with its mandate, roster, signal, and limits ready for controlled turns.
  - mode: composed
    request: Open the agency case from this docs-drift signal and approved roster.
    expected_outcome: Reuse the supplied signal, mandate, roster, and limits without rediscovery and persist one resumable case.
    prior_evidence:
      - The docs-drift signal, agency mandate, approved roster, and operating limits supplied in the fixture.
    must_not_repeat:
      - Do not rediscover the drift signal.
      - Do not rebuild or broaden the approved roster and limits.
inputs:
  data_source_ref: tenant://agency/sqlite-cases
  case_id: case-open-1
  agency_ref: docs-agency
  mandate: keep the published docs current and accurate
  roster:
    - { role: writer, skill: ghostwrite, scope: [docs.write] }
    - { role: reviewer, skill: review-skill, scope: [docs.read] }
  limits:
    max_turns: 50
    spend:
      max_per_run:
        amount: 50
        currency: USD
  signal: docs drift detected on the API reference
expect:
  status: sealed
  receipt:
    schema: runx.receipt.v1
    child_receipt_count: 1
  steps:
    - open
  step_outputs:
    open:
      subset:
        data_operation_result:
          data:
            operation: events.append
            aggregate_id: case-open-1
            after_version: 1
            provider_evidence:
              backend: sqlite
