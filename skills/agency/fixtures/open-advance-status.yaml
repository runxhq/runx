name: agency-open-advance-status-journey
kind: graph
target: support/open-advance-status.graph
operator_journeys:
  - mode: standalone
    exercises_runner: advance
    confusors: [ops-desk, attention-review]
    request: Advance this open governed agency case by one bounded turn.
    expected_outcome: Read the existing case once, dispatch the next scoped action, append one turn, and return the new durable case state.
caller:
  answers:
    agent.ops-desk-advance.output:
      decision: dispatch
      reason: The case is open; the smallest useful next move is to draft the doc update within scope.
      dispatch:
        member: writer
        skill: ghostwrite
        task: Draft the doc update for the drifted API reference.
        needed_scope:
          - docs.write
        consequence: draft
        verification:
          expected_receipt: runx.receipt.v1
          readback: ghostwrite effect for the docs update on case-journey-1
expect:
  status: sealed
  receipt:
    schema: runx.receipt.v1
    state: sealed
    disposition: closed
    child_receipt_count: 3
  steps:
    - open
    - advance
    - status
  step_outputs:
    open:
      subset:
        data_operation_result:
          data:
            operation: events.append
            aggregate_id: case-journey-1
            after_version: 1
            provider_evidence:
              backend: sqlite
    advance:
      subset:
        data_operation_result:
          data:
            operation: events.append
            aggregate_id: case-journey-1
            after_version: 2
    status:
      subset:
        reduction:
          data:
            case_state:
              case_id: case-journey-1
              agency_ref: docs-agency
              status: working
              turn: 1
              last_action: Draft the doc update for the drifted API reference.
            expected_version: 2
metadata:
  public_skill: agency
  source_case: agency-open-advance-status-journey
  source: skills-fixture
  graph_shape: durable_open_advance_status
