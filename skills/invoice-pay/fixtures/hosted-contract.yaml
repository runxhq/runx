    operations:
      - operation: payment.x402
        target: https://payee.example/v1/invoices/pay
        access: mutate
        result: { payment_ref: payment_x402_inv_001, challenge_id: ch_inv_001, amount_minor: 4200, currency: USD, status: settled, transaction: "0xdddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd", network: "eip155:8453", payer: "0x0000000000000000000000000000000000000001", pay_to: "0x00000000000000000000000000000000000000a1", invocation_id: invoice-inv-2026-0042, payment_required_digest: "sha256:5555555555555555555555555555555555555555555555555555555555555555", payment_response_digest: "sha256:6666666666666666666666666666666666666666666666666666666666666666", resource_status: 202 }
