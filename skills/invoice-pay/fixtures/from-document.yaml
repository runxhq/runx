name: invoice-pay-from-document
kind: skill
target: ..
runner: from-document
operator_journeys:
  - mode: standalone
    confusors:
      - extract
      - pay
    request: Pay this invoice file.
    expected_outcome: Read the invoice's own terms, convert the amount in the method's unit, and pay it through pay with resource readback.
env:
  RUNX_CWD: .
inputs:
  path: fixtures/support/invoice.txt
  parent_payment_authority:
    term_id: invoice-authority-1
    currency: USD
    max_amount_minor: 5000
    resource_url: https://payee.example/v1/invoices/pay
  idempotency_seed: invoice-pay-test-0042
  connector: wallet/evm
  request:
    resource:
      method: POST
      body:
        invoice_id: INV-2026-0042
    pay_to: "0x00000000000000000000000000000000000000a1"
expect:
  status: sealed
  steps:
    - read
    - terms
    - amount
    - request
    - settle
  step_outputs:
    amount:
      subset:
        units: 4200
caller:
  answers:
    read/extract#extract:
      value:
        invoice_id: INV-2026-0042
        amount_decimal: "42.00"
        currency: USD
        payment_url: https://payee.example/v1/invoices/pay
      citations:
        - pointer: /invoice_id
          quote: INV-2026-0042
        - pointer: /amount_decimal
          quote: USD 42.00
        - pointer: /currency
          quote: USD 42.00
        - pointer: /payment_url
          quote: https://payee.example/v1/invoices/pay
      missing_fields: []
  approvals:
    settle/settle/settle#pay: true
  provider_responses:
    principal_id: invoice-pay-fixture
    grant:
      grant_id: invoice-pay-fixture
      provider: wallet/evm
      scopes:
        - payment.x402
        - payment.x402.read
    operations:
      - operation: payment.x402
        target: https://payee.example/v1/invoices/pay
        access: mutate
        result:
          payment_id: payment_x402_inv_001
          challenge_id: ch_inv_001
          amount_minor: 4200
          currency: USD
          status: settled
          transaction: "0xdddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd"
          network: eip155:8453
          payer: "0x0000000000000000000000000000000000000001"
          pay_to: "0x00000000000000000000000000000000000000a1"
          purchase_id: invoice-inv-2026-0042
          payment_required_digest: sha256:5555555555555555555555555555555555555555555555555555555555555555
          payment_response_digest: sha256:6666666666666666666666666666666666666666666666666666666666666666
          resource_status: 202
      - operation: payment.x402.read
        target: https://payee.example/v1/invoices/pay
        access: read
        result:
          payment_id: payment_x402_inv_001
          challenge_id: ch_inv_001
          amount_minor: 4200
          currency: USD
          status: settled
          transaction: "0xdddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd"
          network: eip155:8453
          payer: "0x0000000000000000000000000000000000000001"
          pay_to: "0x00000000000000000000000000000000000000a1"
          purchase_id: invoice-inv-2026-0042
          payment_required_digest: sha256:5555555555555555555555555555555555555555555555555555555555555555
          payment_response_digest: sha256:6666666666666666666666666666666666666666666666666666666666666666
          resource_status: 200
          resource_result:
            invoice_id: INV-2026-0042
            state: paid
          readback_status: complete
          finality: confirmed
          block_number: "456"
