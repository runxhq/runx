version: "0.6.4"
minimum_runx: 0.12.0
default_method: invoice-pay
catalog:
  visibility: public
  category: payments
shared_inputs:
  parent_payment_authority:
    description: Original parent payment mandate passed unchanged to pay; it grants no native authority.
  idempotency_seed:
    type: string
    description: Stable settlement idempotency material.
    minLength: 16
    maxLength: 500
  connector:
    type: string
    description: The held buyer connector that settles this invoice.
    enum:
      - wallet/evm
      - link
methods:
  invoice-pay:
    description: Pay one invoice whose reference, amount, currency and payee are already known.
    inputs:
      invoice_id:
        type: string
        description: The invoice's own reference.
        minLength: 1
        maxLength: 256
        pattern: ^\S(?:.*\S)?$
      amount_minor:
        type: integer
        description: The amount due in minor units.
        minimum: 1
        maximum: 9007199254740991
      currency:
        type: string
        description: ISO 4217 code of the amount due.
        pattern: ^[A-Z]{3}$
      payee:
        type: object
        description: The invoice payee exact HTTPS payment endpoint. Provider-specific payment addresses belong to the request.
        required:
          - payment_url
        additionalProperties: false
        properties:
          payment_url:
            type: string
            format: uri
            pattern: ^https://
            maxLength: 2048
      parent_payment_authority: {}
      idempotency_seed: {}
      connector: {}
      request:
        description: Exact pay request of the selected buyer method, carrying this invoice amount/currency and payment endpoint. Inspect that connector; no reusable credentials.
    result_from:
      - settle
    steps:
      - id: admit
        inputs:
          invoice_id: $input.invoice_id
          amount_minor: $input.amount_minor
          currency: $input.currency
          payee: $input.payee
          connector: $input.connector
          request: $input.request
        tool:
          module: invoice.mjs
          export: admitInvoice
          timeout_seconds: 5
        outputs:
          payment_request: {type: object}
      - id: settle
        skill: ../pay#pay
        inputs:
          connector: $input.connector
          request: $steps.admit.payment_request
          parent_payment_authority: $input.parent_payment_authority
          idempotency_seed: $input.idempotency_seed
    examples:
      - invoice_id: INV-2026-0042
        amount_minor: 4200
        currency: USD
        payee:
          payment_url: https://payee.example/v1/invoices/pay
        parent_payment_authority:
          term_id: invoice-authority-1
          currency: USD
          max_amount_minor: 5000
          resource_url: https://payee.example/v1/invoices/pay
        idempotency_seed: invoice-pay-test-0042
        connector: wallet/evm
        request:
          resource:
            url: https://payee.example/v1/invoices/pay
            method: POST
            body:
              invoice_id: INV-2026-0042
          amount_minor: 4200
          pay_to: "0x00000000000000000000000000000000000000a1"
  from-document:
    description: Read one text invoice, bind its stated terms to the selected method's currency unit, then pay it through invoice-pay.
    inputs:
      path:
        type: string
        description: Workspace-relative UTF-8 text of the invoice. Convert a PDF or image to text first.
      repo_root:
        type: string
        default: .
        description: Authorized workspace root.
        optional: true
      parent_payment_authority: {}
      idempotency_seed: {}
      connector: {}
      request:
        description: The selected method's request without the terms the document supplies. For wallet/evm omit amount_minor and resource.url; for link omit resource_url, amount_minor and currency. No reusable credentials.
    result_from:
      - terms
      - settle
    steps:
      - id: read
        skill: ../extract#from-file
        inputs:
          source_id: $input.path
          path: $input.path
          repo_root: $input.repo_root
          objective: Extract the amount due now, its currency, the invoice's own reference and its HTTPS payment URL. Write the amount as digits and one dot with no symbols or separators, with two fractional digits for USD, so that $1,234.5 is 1234.50. Take the balance due, never a subtotal or a prior total. If the document states two different amounts due or payment URLs, or omits a field, list that field as missing instead of choosing one.
          schema:
            type: object
            additionalProperties: false
            required:
              - invoice_id
              - amount_decimal
              - currency
              - payment_url
            properties:
              invoice_id:
                type: string
                minLength: 1
                maxLength: 256
                pattern: ^\S(?:.*\S)?$
              amount_decimal:
                type: string
                maxLength: 64
                pattern: ^(0|[1-9][0-9]*)(\.[0-9]+)?$
              currency:
                type: string
                pattern: ^[A-Z]{3}$
              payment_url:
                type: string
                maxLength: 2048
                pattern: ^https://
      - id: terms
        inputs:
          extraction: $steps.read.structured_extraction_result
          connector: $input.connector
        tool:
          module: invoice.mjs
          export: invoiceTerms
          timeout_seconds: 5
        outputs:
          invoice_id: {type: string}
          amount_decimal: {type: string}
          currency: {type: string}
          payment_url: {type: string}
          scale: {type: number}
          source_digest: {type: string}
          citations: {type: array}
      - id: amount
        tool: data.minor_units
        inputs:
          decimal: $steps.terms.amount_decimal
          scale: $steps.terms.scale
        outputs:
          units: {type: number}
      - id: request
        inputs:
          connector: $input.connector
          request: $input.request
          terms: $steps.terms
          amount_minor: $steps.amount.units
        tool:
          module: invoice.mjs
          export: documentRequest
          timeout_seconds: 5
        outputs:
          request: {type: object}
      - id: settle
        skill: .#invoice-pay
        inputs:
          invoice_id: $steps.terms.invoice_id
          amount_minor: $steps.amount.units
          currency: $steps.terms.currency
          payee:
            payment_url: $steps.terms.payment_url
          connector: $input.connector
          request: $steps.request.request
          parent_payment_authority: $input.parent_payment_authority
          idempotency_seed: $input.idempotency_seed
