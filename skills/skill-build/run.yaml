skill: skill-build
version: "0.9.17"

catalog:
  owner: runx
  kind: graph
  audience: builder
  visibility: public
  category: authoring
  role: canonical
  execution: execute
  completion: runtime_receipt
  approval: none

harness:
  files: [fixtures/support/composed.graph]
  cases:
    - name: skill-build-designs-bounded-package
      runner: design
      inputs:
        objective: Add a governed release-notes skill
        repo_root: .
        project_context: Runx OSS first-party catalog
      caller:
        answers:
          architect:
            architecture_decision:
              schema: runx.skill.architecture_decision.v1
              disposition: extend_existing
              identity:
                current_name: release
                proposed_name: release
                action: keep
                visibility: public
                rationale: Release is the canonical operation and already owns release-note preparation.
              direct_use:
                trigger_requests:
                  - Prepare reviewable release notes from this bounded change set.
                non_trigger_requests:
                  - Publish this release now.
                default_outcome: Produce reviewable release notes without claiming publication.
                routine_host_work:
                  - Inspect the supplied release change set.
                runx_boundary: Bind the source evidence and release-note result for reuse by the release lane.
                terminal_result: A reviewable release-note artifact.
                blocker_behavior: Stop once and name the missing release evidence.
                native_escape: Return the bounded change evidence so the host can continue drafting directly.
              chain_use:
                accepted_inputs:
                  - A bounded release change set or prior change-evidence packet.
                result: A reusable release-note artifact for the canonical release lane.
                reused_evidence:
                  - The supplied release change set.
                reused_effects: []
                must_not_repeat:
                  - Do not rediscover or reclassify the supplied release changes.
              objective: Add governed release-note preparation to the canonical release skill.
              operator_value: Keep release preparation in one discoverable operator lane.
              knowledge_contract:
                purpose: Teach an operator how release notes are prepared without implying publication.
                evidence_required:
                  - The bounded release change set.
                decision_logic:
                  - Extend the existing release owner instead of adding a parallel public skill.
                stop_conditions:
                  - Stop when the release change set is unavailable.
                recovery:
                  - Resume after supplying the missing change evidence.
              required_behaviors:
                - id: prepare-release-notes
                  outcome: Produce a reviewable release-note artifact separate from publication.
                  lane: graph
              native_reuse:
                inspected_capabilities:
                  - runx.skill.inspect
                  - runx.skill.plan
                  - runx.skill.bind
                  - runx.skill.apply
                selected_capabilities: []
                missing_capabilities: []
              effects:
                - effect: draft
                  authority_scopes: []
                  approval: none
                  provider_boundary: false
              skill_chain:
                context_skills:
                  - release
                routes:
                  - Hand the bounded release-note artifact and source change set to the canonical release skill; it owns release authority and execution, no connector is selected here, and publication remains unattempted until that lane completes its own approval and readback.
              resource_budget:
                max_files: 20
                max_executable_lines: 0
                max_process_spawns: 0
                network_allowed: false
              preservation_obligations:
                - Preserve the release skill's distinction between preparation and execution.
              deletions: []
              proof_plan:
                - name: release-notes-selection
                  kind: selection_trial
                  expected: Release-note preparation selects release while a publication-only request does not select this runner.
                - name: release-notes-standalone
                  kind: standalone_operator_journey
                  expected: A direct change set produces reviewable notes without claiming publication.
                - name: release-notes-composed
                  kind: composed_operator_journey
                  expected: Prior change evidence is reused by the release lane without rediscovery.
      expect:
        status: sealed
        receipt:
          schema: runx.receipt.v1
        steps:
          - inspect
          - architect
          - plan

    - name: skill-build-needs-objective
      runner: design
      inputs: {}
      expect:
        status: failure

tools:
  - fs.read_bundle
  - git.status
  - runx.skill.plan

runners:
  design:
    inputs:
      objective:
        type: string
        required: true
        description: Capability to design or place in the current catalog.
      repo_root:
        type: string
        required: false
        default: .
        description: Workspace root to inspect.
      target_dir:
        type: string
        required: false
        description: Existing or proposed repo-relative package directory.
      project_context:
        type: string
        required: false
        description: Product, repository, and operator constraints.
    examples:
      - objective: Decide whether the existing research skill should support bounded local files.
        repo_root: .
        target_dir: skills/research
        project_context: Preserve remote evidence support and reuse native file admission.
    result_from: [plan]
    steps:
      - id: inspect
        label: inspect target and catalog
        tool: runx.skill.inspect
        scopes:
          - fs.read
        inputs:
          repo_root: $input.repo_root
          target_dir: $input.target_dir
      - id: architect
        label: decide ownership and architecture
        agent: { role: builder, task: skill-build-architecture }
        outputs:
          architecture_decision: object
        inputs:
          objective: $input.objective
          project_context: $input.project_context
          authoring_mode: design
          authoring_context: $steps.inspect.authoring_context
          repo_root: $input.repo_root
          target_dir: $input.target_dir
        artifacts:
          named_emits:
            architecture_decision: architecture_decision
          packets:
            architecture_decision: runx.skill.architecture_decision.v1
      - id: plan
        label: validate and bind the architecture decision
        tool: runx.skill.plan
        inputs:
          base_digest: $steps.inspect.authoring_context.base_digest
          architecture: $steps.architect.architecture_decision

  build:
    default: true
    inputs:
      objective:
        type: string
        required: true
        description: Skill capability to create or update.
      package_name:
        type: string
        required: false
        description: Explicit package identity when the caller is creating a new skill.
      repo_root:
        type: string
        required: false
        default: .
        description: Workspace root that owns target_dir.
      target_dir:
        type: string
        required: true
        description: Repo-relative package directory to create or update.
      project_context:
        type: string
        required: false
        description: Product, repository, and operator constraints.
    examples:
      - objective: Add bounded local-file evidence to the existing research skill.
        repo_root: .
        target_dir: skills/research
        project_context: Preserve remote evidence support and avoid package-local file readers.
    result_from: [apply]
    steps:
      - id: inspect
        label: inspect target and catalog
        tool: runx.skill.inspect
        scopes:
          - fs.read
        inputs:
          repo_root: $input.repo_root
          target_dir: $input.target_dir
      - id: architect
        label: decide ownership and architecture
        agent: { role: builder, task: skill-build-architecture }
        outputs:
          architecture_decision: object
        inputs:
          objective: $input.objective
          package_name: $input.package_name
          project_context: $input.project_context
          authoring_mode: build
          authoring_context: $steps.inspect.authoring_context
          repo_root: $input.repo_root
          target_dir: $input.target_dir
        artifacts:
          named_emits:
            architecture_decision: architecture_decision
          packets:
            architecture_decision: runx.skill.architecture_decision.v1
      - id: plan
        label: validate and bind the architecture decision
        tool: runx.skill.plan
        inputs:
          base_digest: $steps.inspect.authoring_context.base_digest
          architecture: $steps.architect.architecture_decision
      - id: author
        label: author only the planned package bytes
        agent: { role: builder, task: skill-build-author }
        outputs:
          change_draft: object
        inputs:
          objective: $input.objective
          package_name: $input.package_name
          project_context: $input.project_context
          authoring_mode: build
          authoring_context: $steps.inspect.authoring_context
          architecture_plan: $steps.plan.architecture_plan
          repo_root: $input.repo_root
          target_dir: $input.target_dir
        artifacts:
          named_emits:
            change_draft: change_draft
          packets:
            change_draft: runx.skill.change_draft.v1
      - id: bind
        label: bind the draft to the inspected package state
        tool: runx.skill.bind
        inputs:
          architecture_plan: $steps.plan.architecture_plan
          change_draft: $steps.author.change_draft
      - id: apply
        label: validate and apply one package transaction
        tool: runx.skill.apply
        scopes:
          - fs.write
          - fs.delete
        inputs:
          target_dir: $input.target_dir
          repo_root: $input.repo_root
          mode: build
          change_bundle: $steps.bind.change_bundle

  improve:
    inputs:
      objective:
        type: string
        required: true
        description: Bounded improvement objective.
      repo_root:
        type: string
        required: false
        default: .
        description: Workspace root that owns target_dir.
      target_dir:
        type: string
        required: true
        description: Repo-relative package directory to improve.
      project_context:
        type: string
        required: false
        description: Product, repository, and operator constraints.
      receipt_id:
        type: string
        required: false
        description: Receipt reference for the failed or suspicious run.
      receipt_summary:
        type: string
        required: false
        description: Sanitized receipt or failure summary.
      harness_output:
        type: string
        required: false
        description: Sanitized harness output or assertion failure.
      failure_packet:
        type: json
        required: false
        description: Stable runx.review.receipt.v1 failure packet from diagnose-skill-run.
    examples:
      - objective: Make every public runner callable from inspection without source-diving.
        repo_root: .
        target_dir: skills/github
        project_context: Preserve the existing contract version and provider boundary.
        harness_output: The agent could not construct the nested resources selector from inspection.
    result_from: [apply]
    steps:
      - id: inspect
        label: inspect target and evidence posture
        tool: runx.skill.inspect
        scopes:
          - fs.read
        inputs:
          repo_root: $input.repo_root
          target_dir: $input.target_dir
      - id: architect
        label: decide the bounded correction architecture
        agent: { role: builder, task: skill-build-architecture }
        outputs:
          architecture_decision: object
        inputs:
          objective: $input.objective
          project_context: $input.project_context
          receipt_id: $input.receipt_id
          receipt_summary: $input.receipt_summary
          harness_output: $input.harness_output
          failure_packet: $input.failure_packet
          authoring_mode: improve
          authoring_context: $steps.inspect.authoring_context
          repo_root: $input.repo_root
          target_dir: $input.target_dir
        artifacts:
          named_emits:
            architecture_decision: architecture_decision
          packets:
            architecture_decision: runx.skill.architecture_decision.v1
      - id: plan
        label: validate and bind the correction architecture
        tool: runx.skill.plan
        inputs:
          base_digest: $steps.inspect.authoring_context.base_digest
          architecture: $steps.architect.architecture_decision
      - id: author
        label: author the evidence-bound correction
        agent: { role: builder, task: skill-build-author }
        outputs:
          change_draft: object
        inputs:
          objective: $input.objective
          project_context: $input.project_context
          receipt_id: $input.receipt_id
          receipt_summary: $input.receipt_summary
          harness_output: $input.harness_output
          failure_packet: $input.failure_packet
          authoring_mode: improve
          authoring_context: $steps.inspect.authoring_context
          architecture_plan: $steps.plan.architecture_plan
          repo_root: $input.repo_root
          target_dir: $input.target_dir
        artifacts:
          named_emits:
            change_draft: change_draft
          packets:
            change_draft: runx.skill.change_draft.v1
      - id: bind
        label: bind the correction to the inspected package state
        tool: runx.skill.bind
        inputs:
          architecture_plan: $steps.plan.architecture_plan
          change_draft: $steps.author.change_draft
      - id: apply
        label: validate and apply one package transaction
        tool: runx.skill.apply
        scopes:
          - fs.write
          - fs.delete
        inputs:
          target_dir: $input.target_dir
          repo_root: $input.repo_root
          mode: improve
          change_bundle: $steps.bind.change_bundle

  harness:
    inputs:
      objective:
        type: string
        required: true
        description: Behavior or regression boundary the fixtures must prove.
      repo_root:
        type: string
        required: false
        default: .
        description: Workspace root that owns target_dir.
      target_dir:
        type: string
        required: true
        description: Repo-relative package directory receiving fixtures.
      project_context:
        type: string
        required: false
        description: Product, repository, and operator constraints.
      harness_output:
        type: string
        required: false
        description: Existing harness evidence to reproduce or strengthen.
    examples:
      - objective: Prove that local evidence preserves exact UTF-8 content and rejects missing files.
        repo_root: .
        target_dir: skills/research
        project_context: Exercise the real native file and evidence capabilities.
    result_from: [apply]
    steps:
      - id: inspect
        label: inspect target package
        tool: runx.skill.inspect
        scopes:
          - fs.read
        inputs:
          repo_root: $input.repo_root
          target_dir: $input.target_dir
      - id: architect
        label: decide the fixture architecture
        agent: { role: builder, task: skill-build-architecture }
        outputs:
          architecture_decision: object
        inputs:
          objective: $input.objective
          project_context: $input.project_context
          harness_output: $input.harness_output
          authoring_mode: harness
          authoring_context: $steps.inspect.authoring_context
          repo_root: $input.repo_root
          target_dir: $input.target_dir
        artifacts:
          named_emits:
            architecture_decision: architecture_decision
          packets:
            architecture_decision: runx.skill.architecture_decision.v1
      - id: plan
        label: validate and bind the fixture architecture
        tool: runx.skill.plan
        inputs:
          base_digest: $steps.inspect.authoring_context.base_digest
          architecture: $steps.architect.architecture_decision
      - id: author
        label: author only the planned fixtures
        agent: { role: builder, task: skill-build-author }
        outputs:
          change_draft: object
        inputs:
          objective: $input.objective
          project_context: $input.project_context
          harness_output: $input.harness_output
          authoring_mode: harness
          authoring_context: $steps.inspect.authoring_context
          architecture_plan: $steps.plan.architecture_plan
          repo_root: $input.repo_root
          target_dir: $input.target_dir
        artifacts:
          named_emits:
            change_draft: change_draft
          packets:
            change_draft: runx.skill.change_draft.v1
      - id: bind
        label: bind the fixtures to the inspected package state
        tool: runx.skill.bind
        inputs:
          architecture_plan: $steps.plan.architecture_plan
          change_draft: $steps.author.change_draft
      - id: apply
        label: validate and apply one fixture transaction
        tool: runx.skill.apply
        scopes:
          - fs.write
          - fs.delete
        inputs:
          target_dir: $input.target_dir
          repo_root: $input.repo_root
          mode: harness
          change_bundle: $steps.bind.change_bundle
