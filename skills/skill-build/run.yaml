version: "0.9.21"
minimum_runx: 0.12.0
default_method: build
catalog:
  visibility: public
  category: authoring
methods:
  design:
    description: Plan a skill's catalog fit and architecture without writing any package bytes.
    inputs:
      objective:
        type: string
        description: Capability to design or place in the current catalog.
      repo_root:
        type: string
        default: .
        description: Workspace root to inspect.
        optional: true
      target_dir:
        type: string
        description: Existing or proposed repo-relative package directory.
        optional: true
      project_context:
        type: string
        description: Product, repository, and operator constraints.
        optional: true
    examples:
      - objective: Decide whether the existing research skill should support bounded local files.
        repo_root: .
        target_dir: skills/research
        project_context: Preserve remote evidence support and reuse native file admission.
    result_from:
      - plan
    steps:
      - id: inspect
        tool: runx.skill.inspect
        inputs:
          repo_root: $input.repo_root
          target_dir: $input.target_dir
      - id: architect
        agent: skill-build-architecture
        calls:
          tools: [fs.read_bundle, git.status, artifact.open, artifact.read]
        outputs:
          architecture_decision: {type: object, packet: runx.skill.architecture_decision.v1}
        inputs:
          objective: $input.objective
          project_context: $input.project_context
          authoring_mode: design
          authoring_context: $steps.inspect.authoring_context
          repo_root: $input.repo_root
          target_dir: $input.target_dir
      - id: plan
        tool: runx.skill.plan
        outputs:
          architecture_plan: {type: object, packet: runx.skill.architecture_plan.v1}
          authoring_required: {type: boolean}
        inputs:
          mode: design
          base_digest: $steps.inspect.authoring_context.base_digest
          architecture: $steps.architect.architecture_decision
  build:
    description: Create or update a skill package, writing it only once its exact staged bundle passes parsing, inspection and safe replay of its tests.
    inputs:
      objective:
        type: string
        description: Skill capability to create or update.
      package_name:
        type: string
        description: Explicit package identity when the caller is creating a new skill.
        optional: true
      repo_root:
        type: string
        default: .
        description: Workspace root that owns target_dir.
        optional: true
      target_dir:
        type: string
        description: Repo-relative package directory to create or update.
      project_context:
        type: string
        description: Product, repository, and operator constraints.
        optional: true
    examples:
      - objective: Add bounded local-file evidence to the existing research skill.
        repo_root: .
        target_dir: skills/research
        project_context: Preserve remote evidence support and avoid package-local file readers.
    result_from:
      - apply
      - apply-terminal
    steps:
      - id: inspect
        tool: runx.skill.inspect
        inputs:
          repo_root: $input.repo_root
          target_dir: $input.target_dir
      - id: architect
        agent: skill-build-architecture
        calls:
          tools: [fs.read_bundle, git.status, artifact.open, artifact.read]
        outputs:
          architecture_decision: {type: object, packet: runx.skill.architecture_decision.v1}
        inputs:
          objective: $input.objective
          package_name: $input.package_name
          project_context: $input.project_context
          authoring_mode: build
          authoring_context: $steps.inspect.authoring_context
          repo_root: $input.repo_root
          target_dir: $input.target_dir
      - id: plan
        tool: runx.skill.plan
        outputs:
          architecture_plan: {type: object, packet: runx.skill.architecture_plan.v1}
          authoring_required: {type: boolean}
        inputs:
          mode: build
          base_digest: $steps.inspect.authoring_context.base_digest
          architecture: $steps.architect.architecture_decision
      - id: author
        when: {value: $steps.plan.authoring_required, equals: true}
        agent: skill-build-author
        calls:
          tools: [fs.read_bundle, git.status, artifact.open, artifact.read]
        outputs:
          change_draft: {type: object, packet: runx.skill.change_draft.v1}
        inputs:
          objective: $input.objective
          package_name: $input.package_name
          project_context: $input.project_context
          authoring_mode: build
          authoring_context: $steps.inspect.authoring_context
          architecture_plan: $steps.plan.architecture_plan
          repo_root: $input.repo_root
          target_dir: $input.target_dir
      - id: bind
        when: {value: $steps.plan.authoring_required, equals: true}
        tool: runx.skill.bind
        inputs:
          architecture_plan: $steps.plan.architecture_plan
          change_draft: $steps.author.change_draft
      - id: apply
        when: {value: $steps.plan.authoring_required, equals: true}
        tool: runx.skill.apply
        inputs:
          target_dir: $input.target_dir
          repo_root: $input.repo_root
          mode: build
          change_bundle: $steps.bind.change_bundle
        outputs:
          apply_result: {type: object, packet: runx.skill.apply_result.v1}
      - id: bind-terminal
        when: {value: $steps.plan.authoring_required, equals: false}
        tool: runx.skill.bind
        inputs:
          architecture_plan: $steps.plan.architecture_plan
      - id: apply-terminal
        when: {value: $steps.plan.authoring_required, equals: false}
        tool: runx.skill.apply
        inputs:
          target_dir: $input.target_dir
          repo_root: $input.repo_root
          mode: build
          change_bundle: $steps.bind-terminal.change_bundle
        outputs:
          apply_result: {type: object, packet: runx.skill.apply_result.v1}

  improve:
    description: Turn one receipt or test failure into a bounded update of a package, validated before it is written.
    inputs:
      objective:
        type: string
        description: Bounded improvement objective.
      repo_root:
        type: string
        default: .
        description: Workspace root that owns target_dir.
        optional: true
      target_dir:
        type: string
        description: Repo-relative package directory to improve.
      project_context:
        type: string
        description: Product, repository, and operator constraints.
        optional: true
      receipt_id:
        type: string
        description: Receipt reference for the failed or suspicious run.
        optional: true
      receipt_summary:
        type: string
        description: Sanitized receipt or failure summary.
        optional: true
      test_output:
        type: string
        description: Sanitized test output or assertion failure.
        optional: true
      failure_packet:
        description: Stable runx/diagnose-skill-run.diagnosis.v1 failure packet from diagnose-skill-run.
        optional: true
    examples:
      - objective: Make every public method callable from inspection without source-diving.
        repo_root: .
        target_dir: skills/github
        project_context: Preserve the existing contract version and provider boundary.
        test_output: The agent could not construct the nested resources selector from inspection.
    result_from:
      - apply
      - apply-terminal
    steps:
      - id: inspect
        tool: runx.skill.inspect
        inputs:
          repo_root: $input.repo_root
          target_dir: $input.target_dir
      - id: architect
        agent: skill-build-architecture
        calls:
          tools: [fs.read_bundle, git.status, artifact.open, artifact.read]
        outputs:
          architecture_decision: {type: object, packet: runx.skill.architecture_decision.v1}
        inputs:
          objective: $input.objective
          project_context: $input.project_context
          receipt_id: $input.receipt_id
          receipt_summary: $input.receipt_summary
          test_output: $input.test_output
          failure_packet: $input.failure_packet
          authoring_mode: improve
          authoring_context: $steps.inspect.authoring_context
          repo_root: $input.repo_root
          target_dir: $input.target_dir
      - id: plan
        tool: runx.skill.plan
        outputs:
          architecture_plan: {type: object, packet: runx.skill.architecture_plan.v1}
          authoring_required: {type: boolean}
        inputs:
          mode: improve
          base_digest: $steps.inspect.authoring_context.base_digest
          architecture: $steps.architect.architecture_decision
      - id: author
        when: {value: $steps.plan.authoring_required, equals: true}
        agent: skill-build-author
        calls:
          tools: [fs.read_bundle, git.status, artifact.open, artifact.read]
        outputs:
          change_draft: {type: object, packet: runx.skill.change_draft.v1}
        inputs:
          objective: $input.objective
          project_context: $input.project_context
          receipt_id: $input.receipt_id
          receipt_summary: $input.receipt_summary
          test_output: $input.test_output
          failure_packet: $input.failure_packet
          authoring_mode: improve
          authoring_context: $steps.inspect.authoring_context
          architecture_plan: $steps.plan.architecture_plan
          repo_root: $input.repo_root
          target_dir: $input.target_dir
      - id: bind
        when: {value: $steps.plan.authoring_required, equals: true}
        tool: runx.skill.bind
        inputs:
          architecture_plan: $steps.plan.architecture_plan
          change_draft: $steps.author.change_draft
      - id: apply
        when: {value: $steps.plan.authoring_required, equals: true}
        tool: runx.skill.apply
        inputs:
          target_dir: $input.target_dir
          repo_root: $input.repo_root
          mode: improve
          change_bundle: $steps.bind.change_bundle
      - id: bind-terminal
        when: {value: $steps.plan.authoring_required, equals: false}
        tool: runx.skill.bind
        inputs:
          architecture_plan: $steps.plan.architecture_plan
      - id: apply-terminal
        when: {value: $steps.plan.authoring_required, equals: false}
        tool: runx.skill.apply
        inputs:
          target_dir: $input.target_dir
          repo_root: $input.repo_root
          mode: improve
          change_bundle: $steps.bind-terminal.change_bundle
        outputs:
          apply_result: {type: object, packet: runx.skill.apply_result.v1}

  test:
    description: Add tests to an existing package and replay them against the candidate before writing.
    inputs:
      objective:
        type: string
        description: Behavior or regression boundary the fixtures must prove.
      repo_root:
        type: string
        default: .
        description: Workspace root that owns target_dir.
        optional: true
      target_dir:
        type: string
        description: Repo-relative package directory receiving fixtures.
      project_context:
        type: string
        description: Product, repository, and operator constraints.
        optional: true
      test_output:
        type: string
        description: Existing test evidence to reproduce or strengthen.
        optional: true
    examples:
      - objective: Prove that local evidence preserves exact UTF-8 content and rejects missing files.
        repo_root: .
        target_dir: skills/research
        project_context: Exercise the real native file and evidence capabilities.
    result_from:
      - apply
      - apply-terminal
    steps:
      - id: inspect
        tool: runx.skill.inspect
        inputs:
          repo_root: $input.repo_root
          target_dir: $input.target_dir
      - id: architect
        agent: skill-build-architecture
        calls:
          tools: [fs.read_bundle, git.status, artifact.open, artifact.read]
        outputs:
          architecture_decision: {type: object, packet: runx.skill.architecture_decision.v1}
        inputs:
          objective: $input.objective
          project_context: $input.project_context
          test_output: $input.test_output
          authoring_mode: test
          authoring_context: $steps.inspect.authoring_context
          repo_root: $input.repo_root
          target_dir: $input.target_dir
      - id: plan
        tool: runx.skill.plan
        outputs:
          architecture_plan: {type: object, packet: runx.skill.architecture_plan.v1}
          authoring_required: {type: boolean}
        inputs:
          mode: test
          base_digest: $steps.inspect.authoring_context.base_digest
          architecture: $steps.architect.architecture_decision
      - id: author
        when: {value: $steps.plan.authoring_required, equals: true}
        agent: skill-build-author
        calls:
          tools: [fs.read_bundle, git.status, artifact.open, artifact.read]
        outputs:
          change_draft: {type: object, packet: runx.skill.change_draft.v1}
        inputs:
          objective: $input.objective
          project_context: $input.project_context
          test_output: $input.test_output
          authoring_mode: test
          authoring_context: $steps.inspect.authoring_context
          architecture_plan: $steps.plan.architecture_plan
          repo_root: $input.repo_root
          target_dir: $input.target_dir
      - id: bind
        when: {value: $steps.plan.authoring_required, equals: true}
        tool: runx.skill.bind
        inputs:
          architecture_plan: $steps.plan.architecture_plan
          change_draft: $steps.author.change_draft
      - id: apply
        when: {value: $steps.plan.authoring_required, equals: true}
        tool: runx.skill.apply
        inputs:
          target_dir: $input.target_dir
          repo_root: $input.repo_root
          mode: test
          change_bundle: $steps.bind.change_bundle
      - id: bind-terminal
        when: {value: $steps.plan.authoring_required, equals: false}
        tool: runx.skill.bind
        inputs:
          architecture_plan: $steps.plan.architecture_plan
      - id: apply-terminal
        when: {value: $steps.plan.authoring_required, equals: false}
        tool: runx.skill.apply
        inputs:
          target_dir: $input.target_dir
          repo_root: $input.repo_root
          mode: test
          change_bundle: $steps.bind-terminal.change_bundle
        outputs:
          apply_result: {type: object, packet: runx.skill.apply_result.v1}
