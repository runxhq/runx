name: skill-build-composes-in-workflow
package: fixtures/composed
host:
  answers:
    author:
      change_draft:
        decision: write
        summary: A release-notes skill that drafts reviewable notes from a supplied change set, reads the person's standing words first, and claims no publication.
        writes:
          - path: skills/release-notes/SKILL.md
            contents: |
              ---
              name: release-notes
              description: Draft reviewable release notes from a supplied change set without publishing them.
              ---

              # Release Notes

              Use this skill when an operator has a change set and needs release
              notes to review. It drafts the notes, says which changes it left
              out and why, and stops before anything is published.

              ## Agent task: release-notes-draft

              Return `notes` drafted from the supplied changes only, with each
              omission named. Do not claim the notes were published.
          - path: skills/release-notes/run.yaml
            contents: |
              version: "0.1.0"
              minimum_runx: 0.12.0
              catalog:
                visibility: internal
              methods:
                draft:
                  inputs:
                    changes:
                      type: string
                      description: The change set to draft notes from.
                  steps:
                    - id: recall
                      skill: runx/memory#index
                      inputs:
                        levels: [{level: personal}, {level: workspace}]
                    - id: notes
                      agent: release-notes-draft
                      context:
                        entries: [$steps.recall.entries]
                      inputs:
                        changes: $input.changes
                      outputs:
                        notes: {type: string}
        deletes: []
expect:
  status: sealed
  steps: [skill-build, digest]
  receipt: {schema: runx.receipt.v1}
