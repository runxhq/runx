name: skill-build-no-change-skips-write
method: improve
inputs:
  objective: Decide whether weak evidence warrants a package change
  repo_root: .
  target_dir: skills/not-present
  failure_packet:
    verdict: blocked
    failure_summary: The report has no receipt or reproducible test output.
    improvement_proposals: []
    next_test_checks:
      - Reproduce the report with a sealed receipt before changing the package.
host:
  answers:
    author:
      change_draft:
        schema: runx.skill.change_draft.v1
        decision: no_change
        summary: The report has no receipt or reproducible test output, so the evidence justifies no change; reproduce it with a sealed receipt first.
        writes: []
        deletes: []
expect:
  status: sealed
  receipt:
    schema: runx.receipt.v1
  steps:
    - draft
    - apply
  step_outputs:
    apply:
      subset:
        apply_result:
          decision: no_change
          verdict: unchanged
