name: skill-build-build-no-skill-skips-write
method: build
inputs:
  objective: Add a second general-purpose release skill
  repo_root: .
  target_dir: skills/release-copy
host:
  answers:
    author:
      change_draft:
        schema: runx.skill.change_draft.v1
        decision: no_skill
        summary: A second general-purpose release skill would split one release operation across duplicate public owners; the existing release skill owns it.
        writes: []
        deletes: []
expect:
  status: sealed
  receipt:
    schema: runx.receipt.v1
  steps:
    - inspect
    - author
    - bind
    - apply
  step_outputs:
    apply:
      subset:
        apply_result:
          decision: no_skill
          verdict: unchanged
