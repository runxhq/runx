name: skill-build-stops-for-earned-core-gap
method: build
inputs:
  objective: Add a digest-bound compare-and-swap bundle primitive required by two existing skills
  repo_root: .
  target_dir: skills/fixture-core-gap
host:
  answers:
    author:
      change_draft:
        schema: runx.skill.change_draft.v1
        decision: needs_core
        summary: runx lacks fs.compare_and_swap_bundle, a digest-bound compare-and-swap bundle primitive two existing skills need; package code would duplicate a runtime security boundary.
        writes: []
        deletes: []
expect:
  status: sealed
  receipt:
    schema: runx.receipt.v1
  steps:
    - inspect
    - author
    - bind
    - apply
  step_outputs:
    apply:
      subset:
        apply_result:
          decision: needs_core
          verdict: needs_core
          changed_paths: []
          deleted_paths: []
