name: skill-build-test-no-change-skips-write
method: test
inputs:
  objective: Decide whether a vague report justifies a new regression fixture
  repo_root: .
  target_dir: skills/example
host:
  answers:
    architect:
      architecture_decision:
        schema: runx.skill.architecture_decision.v1
        choice: extend_existing
        identity:
          current_name: example
          proposed_name: example
          action: keep
          visibility: public
          rationale: Preserve the existing example capability while testing only its test evidence.
        direct_use:
          trigger_requests:
            - Add a reproducible regression fixture for this example skill.
          non_trigger_requests:
            - Change production behavior without a reproducible failure.
          default_outcome: Add only a fixture that proves a named public behavior boundary.
          routine_host_work:
            - Inspect the supplied report and existing fixture coverage.
          runx_boundary: Bind any fixture write to reproducible evidence and the inspected package digest.
          terminal_result: A validated fixture change or an honest unchanged result.
          blocker_behavior: Stop once and name the missing replay inputs or expected outcome.
          native_escape: Return the report and inspection so the host can reproduce it directly.
        chain_use:
          accepted_inputs:
            - A reproducible failure packet or test result.
          result: A validated fixture delta or unchanged result.
          reused_evidence:
            - The supplied failure and existing test inspection.
          reused_effects: []
          must_not_repeat:
            - Do not rerun or invent a failure already absent from the supplied evidence.
        objective: Decide whether a vague report justifies a new regression fixture.
        operator_value: Keep the test evidence-bound and free of invented failures.
        knowledge_contract:
          purpose: Add only fixtures that reproduce a named public behavior boundary.
          evidence_required:
            - Reproducible inputs and an expected public outcome.
          decision_logic:
            - Leave fixtures unchanged when the report cannot define a replay.
          stop_conditions:
            - Stop when no reproducible behavior was supplied.
          recovery:
            - Resume with focused inputs and an expected result.
        required_behaviors:
          - id: fixture-evidence-gate
            outcome: Refuse speculative fixture changes.
            lane: manual
        native_reuse:
          inspected_capabilities:
            - runx.skill.inspect
            - runx.skill.plan
            - runx.skill.bind
            - runx.skill.apply
          selected_capabilities: []
          missing_capabilities: []
        effects:
          - effect: none
            authority_scopes: []
            approval: none
            provider_boundary: false
        skill_chain:
          context_skills: []
          routes: []
        resource_budget:
          max_files: 0
          max_executable_lines: 0
          max_process_spawns: 0
          network_allowed: false
        preservation_obligations:
          - Preserve every existing fixture and production file.
        deletions: []
        proof_plan:
          - name: test-selection
            kind: trigger_eval
            expected: A reproducible test request selects this lane and a speculative production change does not.
          - name: vague-report-no-change
            kind: direct_use_eval
            expected: The direct vague report returns unchanged without filesystem mutation.
          - name: test-evidence-reuse
            kind: chain_use_eval
            expected: Supplied failure evidence is reused without inventing or replaying unrelated work.
    author:
      change_draft:
        schema: runx.skill.change_draft.v1
        decision: no_change
        summary: No reproducible behavior or test output was supplied.
        non_goals:
          - Do not invent a regression case.
        writes: []
        deletes: []
        expected_outputs: []
expect:
  status: sealed
  receipt:
    schema: runx.receipt.v1
  steps:
    - inspect
    - architect
    - plan
    - author
    - bind
    - apply
  step_outputs:
    apply:
      subset:
        apply_result:
          decision: no_change
          verdict: unchanged
