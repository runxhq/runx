name: skill-build-test-no-change-skips-write
method: test
inputs:
  objective: Decide whether a vague report justifies a new regression fixture
  repo_root: .
  target_dir: skills/example
host:
  answers:
    author:
      change_draft:
        decision: no_change
        summary: No reproducible behavior or test output was supplied.
        writes: []
        deletes: []
expect:
  status: sealed
  receipt:
    schema: runx.receipt.v1
  steps:
    - inspect
    - author
    - bind
    - apply
  step_outputs:
    apply:
      subset:
        apply_result:
          decision: no_change
          verdict: unchanged
