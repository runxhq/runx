name: skill-build-builds-thin-skill
method: build
inputs:
  objective: Create a bounded decision-note skill without package-local runtime code
  repo_root: .
  target_dir: .runx-tmp/skill-build-fixtures/fixture-decision-note
  project_context: Keep the package declarative and prove its native test.
host:
  answers:
    author:
      change_draft:
        decision: write
        summary: Create one thin agent skill with a supplied-answer test.
        writes:
          - path: .runx-tmp/skill-build-fixtures/fixture-decision-note/SKILL.md
            contents: |
              ---
              name: fixture-decision-note
              description: Turn one bounded objective into a reviewable decision note.
              ---

              # Fixture Decision Note

              Use this skill when an operator needs one bounded recommendation
              from a supplied objective. It preserves the objective, explains
              one next action, and stops without mutating any external system.

              Supply a concrete objective. If it is missing or too vague to
              support a recommendation, stop and request the missing boundary.
              A sealed result is a decision note, not evidence that an external
              action happened.

              ## Agent task: fixture-decision-note

              Return `decision_note` with the objective preserved exactly and
              one concise recommendation and an explicit caveats array. Do not claim external effects.
          - path: .runx-tmp/skill-build-fixtures/fixture-decision-note/run.yaml
            contents: |
              version: "0.1.0"
              minimum_runx: 0.12.0
              catalog:
                visibility: internal
              methods:
                note:
                  inputs:
                    objective:
                      type: string
                      description: Bounded decision objective.
                  steps:
                    - id: recall
                      skill: runx/memory#index
                      inputs:
                        levels: [{level: personal}, {level: workspace}]
                    - id: note
                      agent: fixture-decision-note
                      context:
                        entries: [$steps.recall.entries]
                      inputs:
                        objective: $input.objective
                      outputs:
                        decision_note:
                          type: object
                          additionalProperties: false
                          required:
                            - objective
                            - recommendation
                            - caveats
                          properties:
                            objective:
                              type: string
                              minLength: 1
                            recommendation:
                              type: string
                              minLength: 1
                            caveats:
                              type: array
                              items:
                                type: string
                                minLength: 1
          - path: .runx-tmp/skill-build-fixtures/fixture-decision-note/tests/fixture-decision-note-ready.yaml
            contents: |
              name: fixture-decision-note-ready
              method: note
              inputs:
                objective: Choose the bounded next action.
              host:
                answers:
                  note:
                    decision_note:
                      objective: Choose the bounded next action.
                      recommendation: Inspect the supplied evidence first.
                      caveats:
                        - No external action is performed.
              expect:
                status: sealed
                receipt:
                  schema: runx.receipt.v1
        deletes: []
expect:
  status: sealed
  receipt:
    schema: runx.receipt.v1
  steps:
    - inspect
    - author
    - bind
    - apply
  step_outputs:
    apply:
      subset:
        apply_result:
          schema: runx.skill.apply_result.v1
          verdict: validated_and_applied
