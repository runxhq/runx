  repo_root: .
  target_dir: skills/not-present
  failure_packet:
    verdict: blocked
    failure_summary: The report has no receipt or reproducible harness output.
    improvement_proposals: []
    next_harness_checks:
      - Reproduce the report with a sealed receipt before changing the package.
operator_journeys:
