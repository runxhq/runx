    expected_outcome: Weak prior evidence is reused and returns unchanged without speculative package mutation.
    prior_evidence:
      - The supplied failure_packet from the prior diagnosis.
    must_not_repeat:
      - Do not replay the failed external operation.
      - Do not rediscover the already inspected package state.
caller:
  answers:
    agent.skill-build-architecture.output:
      architecture_decision:
        schema: runx.skill.architecture_decision.v1
        disposition: extend_existing
        identity:
          current_name: not-present
          proposed_name: not-present
          action: keep
          visibility: public
          rationale: The fixture preserves the requested identity while proving evidence-bound no-change behavior.
        direct_use:
          trigger_requests:
            - Improve this skill from the supplied failed-run evidence.
          non_trigger_requests:
            - Change this skill based only on an unverified report.
          default_outcome: Apply a bounded evidence-backed correction or return unchanged.
          routine_host_work:
            - Inspect the supplied report and current package state.
          runx_boundary: Bind any correction to the inspected package and reproducible failure evidence.
          terminal_result: A validated apply result or an honest unchanged result.
          blocker_behavior: Stop once and request a sealed receipt or focused failing fixture.
          native_escape: Return the report and inspection for direct host reproduction.
        chain_use:
          accepted_inputs:
            - A diagnose-skill-run failure packet, receipt summary, or harness output.
          result: A digest-bound correction or unchanged result.
          reused_evidence:
            - The supplied failure packet and package inspection.
          reused_effects: []
          must_not_repeat:
            - Do not rerun unrelated provider work or rediscover the inspected package.
        objective: Decide whether weak evidence warrants a package change.
        operator_value: Protect a package from speculative corrections.
        knowledge_contract:
          purpose: Require reproducible evidence before changing existing behavior.
          evidence_required:
            - A sealed receipt or reproducible harness failure.
          decision_logic:
            - Preserve current behavior when the supplied report cannot be reproduced.
          stop_conditions:
            - Stop authoring when material failure evidence is absent.
          recovery:
            - Resume with a sealed receipt or focused failing fixture.
        required_behaviors:
          - id: evidence-gate
            outcome: Return no change when failure evidence is insufficient.
            lane: manual
        native_reuse:
          inspected_capabilities:
            - runx.skill.inspect
            - runx.skill.plan
            - runx.skill.bind
            - runx.skill.apply
