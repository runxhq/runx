name: skill-build-builds-thin-skill
kind: skill
target: ..
runner: build
inputs:
  objective: Create a bounded decision-note skill without package-local runtime code
  repo_root: .
  target_dir: .runx-tmp/skill-build-fixtures/fixture-decision-note
  project_context: Keep the package declarative and prove its native harness.
operator_journeys:
  - mode: standalone
    confusors: [skill-adopt, skill-review]
    request: Create a bounded decision-note skill without package-local runtime code.
    expected_outcome: A validated declarative skill package is applied with a useful manual and semantic harness.
caller:
  answers:
    agent.skill-build-architecture.output:
      architecture_decision:
        schema: runx.skill.architecture_decision.v1
        disposition: build
        identity:
          proposed_name: fixture-decision-note
          action: create
          visibility: public
          rationale: Decision note is the exact bounded artifact the fixture promises.
        direct_use:
          trigger_requests:
            - Make a bounded decision note from this objective.
          non_trigger_requests:
            - Execute the recommendation in this note.
          default_outcome: Return one reviewable decision note.
          routine_host_work:
            - Read the supplied objective.
          runx_boundary: Bind the objective and decision note in a reusable receipt.
          terminal_result: A bounded decision-note packet.
          blocker_behavior: Stop once and request the missing objective.
          native_escape: Return the unchanged objective for direct host reasoning.
        chain_use:
          accepted_inputs:
            - A bounded objective or prior objective artifact.
          result: A reusable decision-note packet.
          reused_evidence:
            - The supplied objective artifact.
          reused_effects: []
          must_not_repeat:
            - Do not reacquire or rewrite the supplied objective.
        objective: Create a bounded decision-note skill without package-local runtime code.
        operator_value: Give an operator one reviewable decision from a bounded objective.
        knowledge_contract:
          purpose: Explain and perform one evidence-bounded decision.
          evidence_required:
            - A bounded decision objective.
          decision_logic:
            - Preserve the objective and return one concise recommendation.
          stop_conditions:
            - Stop when the objective is absent.
          recovery:
            - Resume with a bounded objective.
        required_behaviors:
          - id: operating-guide
            outcome: Teach a cold operator what the decision lane does and where it stops.
            lane: manual
          - id: decide
            outcome: Return one bounded decision note.
            lane: agent
        native_reuse:
          inspected_capabilities:
            - runx.skill.inspect
            - runx.skill.plan
            - runx.skill.bind
            - runx.skill.apply
          selected_capabilities: []
          missing_capabilities: []
        effects:
          - effect: none
            authority_scopes: []
            approval: none
            provider_boundary: false
        skill_chain:
          context_skills: []
          routes: []
        resource_budget:
          max_files: 4
          max_executable_lines: 0
          max_process_spawns: 0
          network_allowed: false
        preservation_obligations:
          - Keep the package manual useful to a cold operator.
        deletions: []
        proof_plan:
          - name: decision-note-selection
            kind: selection_trial
            expected: A decision-note request selects the skill and an execution request does not.
          - name: decision-note-standalone
            kind: standalone_operator_journey
            expected: The direct objective produces a useful decision note.
          - name: decision-note-composed
            kind: composed_operator_journey
            expected: A prior objective artifact is reused without reacquisition.
    agent.skill-build-author.output:
      change_draft:
        schema: runx.skill.change_draft.v1
        decision: write
        summary: Create one thin agent skill with a supplied-answer harness.
        non_goals:
          - Do not add package-local JavaScript or a provider boundary.
        writes:
          - path: SKILL.md
            contents: |
              ---
              name: fixture-decision-note
              description: Turn one bounded objective into a reviewable decision note.
              ---

              # Fixture Decision Note

              Use this skill when an operator needs one bounded recommendation
              from a supplied objective. It preserves the objective, explains
              one next action, and stops without mutating any external system.

              Supply a concrete objective. If it is missing or too vague to
              support a recommendation, stop and request the missing boundary.
              A sealed result is a decision note, not evidence that an external
              action happened.

              ## Agent task contracts

              ### `fixture-decision-note`

              Return `decision_note` with the objective preserved exactly and
              one concise recommendation. Do not claim external effects.
          - path: run.yaml
            contents: |
              skill: fixture-decision-note
              version: "0.1.0"

              catalog:
                kind: skill
                audience: builder
                visibility: internal
                role: context
                execution: read
                completion: runtime_receipt
                requires_adapter: false
                approval: none

              harness:
                cases:
                  - name: fixture-decision-note-ready
                    runner: note
                    inputs:
                      objective: Choose the bounded next action.
                    caller:
                      answers:
                        agent.fixture-decision-note.output:
                          decision_note:
                            objective: Choose the bounded next action.
                            recommendation: Inspect the supplied evidence first.
                    expect:
                      status: sealed
                      receipt:
                        schema: runx.receipt.v1

              runners:
                note:
                  default: true
                  inputs:
                    objective:
                      type: string
                      required: true
                      description: Bounded decision objective.
                  steps:
                    - id: note
                      agent: { role: analyst, task: fixture-decision-note }
                      inputs:
                        objective: $input.objective
                      outputs:
                        decision_note: object
        deletes: []
        expected_outputs:
          - name: decision_note
            value_type: object
expect:
  status: sealed
  receipt:
    schema: runx.receipt.v1
  steps:
    - inspect
    - architect
    - plan
    - author
    - bind
    - apply
  step_outputs:
    apply:
      subset:
        apply_result:
          data:
            schema: runx.skill.apply_result.v1
            verdict: validated_and_applied
metadata:
  public_skill: skill-build
  source_case: build-thin-skill
  source: skills-fixture
