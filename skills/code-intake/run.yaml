version: "0.1.11"
minimum_runx: 0.12.0
catalog:
  visibility: public
  category: ops
methods:
  intake:
    description: Bound an ordinary engineering request and recommend a next lane without granting authority.
    inputs:
      request:
        type: string
        description: Actual request or report text, as supplied by the operator or source adapter.
        minLength: 1
        pattern: \S
      project_context:
        type: string
        default: ""
        description: Actual product, repository and constraints.
        optional: true
      operator_context:
        type: string
        default: ""
        description: Scoped preferences or escalation guidance.
        optional: true
      source_context:
        type: object
        default: {}
        description: Original source evidence and locators, copied unchanged. Optional issue_locator selects an actual GitHub issue; never invent one.
        additionalProperties: true
        properties:
          thread_locator:
            type: string
            minLength: 1
          issue_locator:
            type: string
            minLength: 1
        optional: true
    result_from:
      - finalize
    examples:
      - request: Checkout returns a 500 when the cart has a discount code applied. It started after Tuesday's deploy.
    steps:
      - id: digest
        tool: data.digest
        inputs:
          value:
            request: $input.request
            project_context: $input.project_context
            operator_context: $input.operator_context
            source_context: $input.source_context
      - id: intake
        agent: code-intake
        inputs:
          request: $input.request
          project_context: $input.project_context
          operator_context: $input.operator_context
          source_context: $input.source_context
        outputs:
          intake_draft:
            type: object
            additionalProperties: false
            required:
              - category
              - severity
              - summary
              - suggested_reply
              - recommended_lane
              - rationale
              - target_surfaces
              - shared_invariants
              - success_criteria
              - operator_notes
              - open_questions
            properties:
              category:
                enum:
                  - bug
                  - feature_request
                  - docs
                  - billing
                  - account
                  - question
                  - other
              severity:
                enum:
                  - low
                  - medium
                  - high
                  - critical
              summary:
                type: string
                minLength: 1
                pattern: \S
              suggested_reply:
                type: string
                minLength: 1
                pattern: \S
              recommended_lane:
                enum:
                  - host
                  - code-plan
                  - github-issue-to-pr
                  - reply-only
                  - manual-review
              rationale:
                type: string
                minLength: 1
                pattern: \S
              operator_notes:
                type: array
                items:
                  type: string
              open_questions:
                type: array
                items:
                  type: string
              target_surfaces:
                type: array
                items:
                  type: object
                  required:
                    - surface
                    - kind
                    - mutating
                    - rationale
                  properties:
                    surface:
                      type: string
                      minLength: 1
                      pattern: \S
                    kind:
                      enum:
                        - repo
                        - package
                        - docs
                        - support
                        - other
                    mutating:
                      type: boolean
                    rationale:
                      type: string
                      minLength: 1
                      pattern: \S
                  additionalProperties: false
              shared_invariants:
                type: array
                items:
                  type: string
              success_criteria:
                type: array
                items:
                  type: string
      - id: finalize
        tool:
          module: code-intake.mjs
        inputs:
          request: $input.request
          project_context: $input.project_context
          operator_context: $input.operator_context
          source_context: $input.source_context
          input_digest: $steps.digest.digest_result.digest
          intake_draft: $steps.intake.intake_draft
        outputs:
          request_packet: {type: object, packet: runx/code-intake.intake.v1}
