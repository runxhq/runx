name: code-intake-composes-in-graph
kind: graph
target: support/composed.graph
caller:
  answers:
    intake:
      intake_draft:
        category: docs
        severity: low
        summary: Correct the README example to use the current documented install command.
        suggested_reply: The README example is stale. Update it to match the current CLI help and verify the example locally.
        recommended_lane: host
        rationale: A bounded documentation correction can be handled by the existing host without a separate governed
          implementation lane.
        target_surfaces:
          - surface: oss-docs
            kind: docs
            mutating: true
            rationale: Only the README example changes.
        shared_invariants:
          - Use the current CLI help as the command source.
        success_criteria:
          - The README install example agrees with current CLI help.
        operator_notes: []
        open_questions: []
expect:
  status: sealed
  steps:
    - code-intake
    - digest
  receipt:
    schema: runx.receipt.v1
