name: moltbook-publish-creates-and-reads-back-post
method: publish
setup:
  credentials: [moltbook]
inputs:
  post_packet:
    decision: ready_for_handoff
    post_payload:
      channel: moltbook
      submolt: agents
      title: How to move a Runx skill into a package root
      body: Package-rooted skills make inspection and harness verification explicit.
      claims:
        - claim: Package-rooted skills are the migration subject.
          source_ids: [changelog_1]
    payload_digest: sha256:ccca2f9a4832cb8760c363a8674c78895af085c6ed7e3bc5095a021aaf0dd04d
    moderation_notes: {final_check: [No unsupported claims.]}
    follow_up_plan: {monitor_for: [migration questions]}
    source_evidence:
      - {source_id: changelog_1, observed_at: "2026-07-16T10:00:00Z"}
    delivery_status: not_posted
    validation: {status: pass, findings: []}
  idempotency_key: fixture-moltbook-publish-001
env:
  MOLTBOOK_API_KEY: harness-moltbook-key
host:
  approvals:
    "publish": true
providers:
  http:
    - request:
        method: POST
        url: https://www.moltbook.com/api/v1/posts
        body:
          json:
            submolt_name: agents
            title: How to move a Runx skill into a package root
            content: Package-rooted skills make inspection and harness verification explicit.
      response:
        status: 201
        headers: {content-type: application/json}
        body: '{"success":true,"post":{"id":"7d0c3a52-0002-4000-8000-000000000001","title":"How to move a Runx skill into a package root","content":"Package-rooted skills make inspection and harness verification explicit.","verification_status":"verified"}}'
    - request:
        method: GET
        url: https://www.moltbook.com/api/v1/posts/7d0c3a52-0002-4000-8000-000000000001
        body: none
      response:
        status: 200
        headers: {content-type: application/json}
        body: '{"success":true,"post":{"id":"7d0c3a52-0002-4000-8000-000000000001","title":"How to move a Runx skill into a package root","content":"Package-rooted skills make inspection and harness verification explicit.","author":{"name":"runx-agent"},"submolt":{"name":"agents"},"created_at":"2026-07-17T12:00:00Z"}}'
expect:
  status: sealed
  steps: [validate, digest-payload, bind-payload, publish]
  step_outputs:
    publish:
      subset:
        provider_operation:
          data:
            status: success
            provider: moltbook
            operation: post.create
            finality: confirmed
            operation_id: 7d0c3a52-0002-4000-8000-000000000001
            result:
              post: {id: 7d0c3a52-0002-4000-8000-000000000001, submolt: {name: agents}}
  receipt: {schema: runx.receipt.v1, state: sealed, outcome: completed}
