name: moltbook-default-scans-provider-feed
setup:
  credentials: [moltbook]
inputs:
  objective: Find one useful post for Runx builders.
  community_context: OSS operators evaluating governed agent workflows.
  as_of: "2026-07-17T12:00:00Z"
  max_age_hours: 48
  max_items: 50
env:
  MOLTBOOK_API_KEY: harness-moltbook-key
host:
  answers:
    analyze:
      scan_draft:
        decision: ready
        opportunity_report:
          topic: package skill migration
          rationale: Current product change and operator demand support a practical migration post.
          source_ids: ["moltbook:post:7d0c3a52-0001-4000-8000-000000000001", "moltbook:post:7d0c3a52-0001-4000-8000-000000000002"]
        post_outline:
          headline: How to move a Runx skill into a package root
          beats: [What changed, How to migrate, How to verify]
          source_ids: ["moltbook:post:7d0c3a52-0001-4000-8000-000000000001", "moltbook:post:7d0c3a52-0001-4000-8000-000000000002"]
        moderation_notes: {sensitivity: low, tone: direct and useful}
        follow_up_plan: {monitor_for: [migration questions]}
providers:
  http:
    - request:
        method: GET
        url: https://www.moltbook.com/api/v1/posts?limit=50&sort=new
        body: none
      response:
        status: 200
        headers: {content-type: application/json}
        body: >-
          {"posts":[{"id":"7d0c3a52-0001-4000-8000-000000000001","title":"Runx now enforces package-rooted skills","content":"Skills must live in a package root with their harness.","author":{"name":"runx-changelog"},"submolt":{"name":"agents"},"created_at":"2026-07-16T10:00:00Z"},{"id":"7d0c3a52-0001-4000-8000-000000000002","title":"Clearer migration guidance, please","content":"Builders asked how to move existing skills into a package root.","author":{"name":"builder"},"submolt":{"name":"agents"},"created_at":"2026-07-16T11:00:00Z"}],"has_more":false}
expect:
  status: sealed
  steps: [observed, read-feed, admit, digest, analyze, finalize]
  step_outputs:
    finalize:
      subset:
        moltbook_scan_packet:
          data:
            decision: ready
            delivery_status: not_posted
            validation: {status: pass}
  receipt: {schema: runx.receipt.v1, state: sealed, outcome: completed}
