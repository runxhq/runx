skill: moltbook
version: "0.4.6"

catalog:
  kind: skill
  audience: public
  visibility: public
  role: context
  provider: moltbook
  runtime_path: moltbook
  execution: execute
  completion: provider_readback
  requires_adapter: true
  approval: conditional
  category: content

input_definitions:
  feed_snapshot:
    type: array
    required: true
    description: One to 100 unique, timestamped Moltbook evidence items admitted for local analysis.
    schema:
      minItems: 1
      maxItems: 100
      items:
        type: object
        required: [source_ref, topic, summary, observed_at]
        additionalProperties: false
        properties:
          source_ref: { type: string, minLength: 1, maxLength: 512 }
          topic: { type: string, minLength: 1, maxLength: 500 }
          summary: { type: string, minLength: 1, maxLength: 10000 }
          observed_at: { type: string, format: date-time }
  outline:
    type: object
    required: true
    description: Exact headline and beats selected from the admitted scan packet.
    schema:
      required: [headline, beats]
      additionalProperties: false
      properties:
        headline: { type: string, minLength: 1, maxLength: 500 }
        beats:
          type: array
          minItems: 1
          maxItems: 20
          items: { type: string, minLength: 1, maxLength: 1000 }
        source_refs:
          type: array
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 512 }

harness:
  cases:
    - name: moltbook-scan-binds-fresh-opportunity
      operator_journeys:
        - mode: standalone
          request: Scan Moltbook for credible opportunities relevant to this operator objective.
          expected_outcome: Return fresh evidence-bound opportunities with credibility and source caveats explicit.
      runner: scan
      inputs:
        objective: Find one useful post for Runx builders.
        community_context: OSS operators evaluating governed agent workflows.
        as_of: "2026-07-17T12:00:00Z"
        max_age_hours: 48
        feed_snapshot:
          - { source_ref: changelog_1, topic: package skills, summary: Runx now enforces package-rooted skills., observed_at: "2026-07-16T10:00:00Z" }
          - { source_ref: feedback_1, topic: migration, summary: Builders requested clearer migration guidance., observed_at: "2026-07-16T11:00:00Z" }
      caller:
        answers:
          agent.moltbook-scan.output:
            scan_draft:
              decision: ready
              opportunity_report:
                topic: package skill migration
                rationale: Current product change and operator demand support a practical migration post.
                source_refs: [changelog_1, feedback_1]
              post_outline:
                headline: How to move a Runx skill into a package root
                beats: [What changed, How to migrate, How to verify]
                source_refs: [changelog_1, feedback_1]
              moderation_notes: { sensitivity: low, tone: direct and useful }
              follow_up_plan: { monitor_for: [migration questions] }
      expect:
        status: sealed
        steps: [admit, digest, analyze, finalize]
        step_outputs:
          finalize:
            subset:
              moltbook_scan_packet:
                data:
                  decision: ready
                  delivery_status: not_posted
                  validation: { status: pass }
        receipt: { schema: runx.receipt.v1 }

    - name: moltbook-scan-rejects-stale-feed
      runner: scan
      inputs:
        objective: Find a current post.
        as_of: "2026-07-17T12:00:00Z"
        max_age_hours: 24
        feed_snapshot:
          - { source_ref: old_1, topic: old, summary: Old product update., observed_at: "2026-07-10T10:00:00Z" }
      expect:
        status: sealed
        steps: [admit, digest, reject]
        step_outputs:
          reject:
            subset:
              moltbook_scan_packet:
                data:
                  decision: needs_more_evidence
                  delivery_status: not_posted
        receipt: { schema: runx.receipt.v1 }

    - name: moltbook-post-preserves-scan-evidence-without-posting
      operator_journeys:
        - mode: composed
          request: Prepare the exact Moltbook post from this completed opportunity scan.
          expected_outcome: Reuse scan evidence and selected opportunity without rescanning or claiming publication.
          prior_evidence:
            - The completed Moltbook scan packet and selected opportunity supplied in the fixture.
          must_not_repeat:
            - Do not scan the Moltbook feed again.
            - Do not publish without exact approval and provider readback.
      runner: post
      inputs:
        scan_packet:
          decision: ready
          opportunity_report:
            topic: package skill migration
            rationale: Current demand supports a practical post.
            source_refs: [changelog_1]
          post_outline:
            headline: How to move a Runx skill into a package root
            beats: [What changed, How to migrate]
            source_refs: [changelog_1]
          source_evidence:
            - { source_ref: changelog_1, observed_at: "2026-07-16T10:00:00Z" }
          evidence_digest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          delivery_status: not_posted
          validation: { status: pass, findings: [] }
        outline:
          headline: How to move a Runx skill into a package root
          beats: [What changed, How to migrate]
        submolt: agents
        community_context: OSS operators.
        operator_guidance: Keep it factual.
      caller:
        answers:
          agent.moltbook-post.output:
            post_draft:
              decision: ready_for_handoff
              post_payload:
                channel: moltbook
                submolt: agents
                title: How to move a Runx skill into a package root
                body: Package-rooted skills make inspection and harness verification explicit.
                claim_refs:
                  - { claim: Package-rooted skills are the migration subject., source_refs: [changelog_1] }
              moderation_notes: { final_check: [No unsupported claims.] }
              follow_up_plan: { monitor_for: [migration questions] }
      expect:
        status: sealed
        steps: [admit-scan, author, digest-post, finalize-post]
        step_outputs:
          finalize-post:
            subset:
              moltbook_post_packet:
                data:
                  decision: ready_for_handoff
                  delivery_status: not_posted
                  validation: { status: pass }
        receipt: { schema: runx.receipt.v1 }

    - name: moltbook-post-refuses-an-unready-scan
      runner: post
      inputs:
        scan_packet:
          decision: needs_more_evidence
          delivery_status: not_posted
          validation: { status: fail, findings: [] }
        outline:
          headline: How to move a Runx skill into a package root
          beats: [What changed]
        submolt: agents
      expect:
        status: sealed
        steps: [admit-scan, reject-post]
        step_outputs:
          reject-post:
            subset:
              moltbook_post_packet:
                data:
                  decision: needs_more_evidence
                  delivery_status: not_posted
                  validation: { status: fail }
        receipt: { schema: runx.receipt.v1 }

connectors:
  moltbook:
    operations: [feed.scan, post.create]
runners:
  scan-provider:
    default: true
    inputs:
      objective:
        type: string
        required: true
        description: Posting objective.
      community_context:
        type: string
        required: false
        description: Intended community and discussion context.
      as_of:
        type: string
        required: true
        description: Explicit ISO-8601 evaluation time.
      max_age_hours:
        type: number
        required: false
        default: 168
        description: Maximum feed signal age.
      max_items:
        type: number
        required: false
        default: 50
        description: Newest posts to read, at most 100.
      submolt:
        type: string
        required: false
        description: Read only this submolt's posts.
    examples:
      - objective: Find one useful post for Runx builders.
        community_context: OSS operators evaluating governed agent workflows.
        as_of: "2026-07-17T12:00:00Z"
        max_age_hours: 48
        max_items: 50
    result_from: [reject, finalize]
    steps:
      - id: read-feed
        operation: moltbook/feed.scan
        result_fields: [posts]
        input:
          limit: $input.max_items
          submolt: $input.submolt

      - id: admit
        inputs:
          objective: $input.objective
          as_of: $input.as_of
          max_age_hours: $input.max_age_hours
          posts: $steps.read-feed.provider_operation.result.posts
        tool: { module: moltbook.mjs, export: admitFeed }
        outputs:
          feed_index: object
        artifacts:
          named_emits:
            feed_index: feed_index

      - id: digest
        tool: data.digest
        inputs:
          value: $steps.admit.feed_index.sources

      - id: reject
        when:
          value: $steps.admit.feed_index.decision
          equals: needs_more_evidence
        inputs:
          feed_index: $steps.admit.feed_index
          evidence_digest: $steps.digest.digest_result.digest
        tool: { module: moltbook.mjs, export: finalizeScan }
        outputs:
          moltbook_scan_packet: object
        artifacts:
          named_emits:
            moltbook_scan_packet: moltbook_scan_packet
          packets:
            moltbook_scan_packet: runx.moltbook.scan.v1

      - id: analyze
        when:
          value: $steps.admit.feed_index.decision
          equals: ready
        agent: { role: researcher, task: moltbook-scan }
        outputs:
          scan_draft: object
        inputs:
          objective: $input.objective
          community_context: $input.community_context
          feed_index: $steps.admit.feed_index
          evidence_digest: $steps.digest.digest_result.digest
          as_of: $input.as_of
          max_age_hours: $input.max_age_hours
          max_items: $input.max_items
          submolt: $input.submolt
        artifacts:
          named_emits:
            scan_draft: scan_draft

      - id: finalize
        when:
          value: $steps.admit.feed_index.decision
          equals: ready
        inputs:
          feed_index: $steps.admit.feed_index
          evidence_digest: $steps.digest.digest_result.digest
          scan_draft: $steps.analyze.scan_draft
        tool: { module: moltbook.mjs, export: finalizeScan }
        outputs:
          moltbook_scan_packet: object
        artifacts:
          named_emits:
            moltbook_scan_packet: moltbook_scan_packet
          packets:
            moltbook_scan_packet: runx.moltbook.scan.v1

  scan:
    inputs:
      objective:
        type: string
        required: true
        description: Posting objective.
      community_context:
        type: string
        required: false
        description: Intended community and discussion context.
      feed_snapshot:
        definition: feed_snapshot
      as_of:
        type: string
        required: true
        description: Explicit ISO-8601 evaluation time.
      max_age_hours:
        type: number
        required: false
        default: 168
        description: Maximum feed signal age.
    examples:
      - objective: Find one useful post for Runx builders.
        community_context: OSS operators evaluating governed agent workflows.
        as_of: "2026-07-17T12:00:00Z"
        max_age_hours: 48
        feed_snapshot:
          - source_ref: changelog_1
            topic: package skills
            summary: Runx now enforces package-rooted skills.
            observed_at: "2026-07-16T10:00:00Z"
    result_from: [reject, finalize]
    steps:
      - id: admit
        inputs:
          objective: $input.objective
          feed_snapshot: $input.feed_snapshot
          as_of: $input.as_of
          max_age_hours: $input.max_age_hours
        tool: { module: moltbook.mjs, export: admitFeed }
        outputs:
          feed_index: object
        artifacts:
          named_emits:
            feed_index: feed_index

      - id: digest
        tool: data.digest
        inputs:
          value: $steps.admit.feed_index.sources

      - id: reject
        when:
          value: $steps.admit.feed_index.decision
          equals: needs_more_evidence
        inputs:
          feed_index: $steps.admit.feed_index
          evidence_digest: $steps.digest.digest_result.digest
        tool: { module: moltbook.mjs, export: finalizeScan }
        outputs:
          moltbook_scan_packet: object
        artifacts:
          named_emits:
            moltbook_scan_packet: moltbook_scan_packet
          packets:
            moltbook_scan_packet: runx.moltbook.scan.v1

      - id: analyze
        when:
          value: $steps.admit.feed_index.decision
          equals: ready
        agent: { role: researcher, task: moltbook-scan }
        outputs:
          scan_draft: object
        inputs:
          objective: $input.objective
          community_context: $input.community_context
          feed_index: $steps.admit.feed_index
          evidence_digest: $steps.digest.digest_result.digest
          feed_snapshot: $input.feed_snapshot
          as_of: $input.as_of
          max_age_hours: $input.max_age_hours
        artifacts:
          named_emits:
            scan_draft: scan_draft

      - id: finalize
        when:
          value: $steps.admit.feed_index.decision
          equals: ready
        inputs:
          feed_index: $steps.admit.feed_index
          evidence_digest: $steps.digest.digest_result.digest
          scan_draft: $steps.analyze.scan_draft
        tool: { module: moltbook.mjs, export: finalizeScan }
        outputs:
          moltbook_scan_packet: object
        artifacts:
          named_emits:
            moltbook_scan_packet: moltbook_scan_packet
          packets:
            moltbook_scan_packet: runx.moltbook.scan.v1

  post:
    inputs:
      scan_packet:
        type: json
        packet: runx.moltbook.scan.v1
        required: true
        description: Validated ready Moltbook scan packet.
      outline:
        definition: outline
      submolt:
        type: string
        required: true
        description: The submolt the post is written for.
        schema: { pattern: '^[A-Za-z0-9_-]{1,64}$' }
      community_context:
        type: string
        required: false
        description: Intended community context.
      operator_guidance:
        type: string
        required: false
        description: Local content guidance, not publication approval.
    examples:
      - scan_packet:
          decision: ready
          opportunity_report:
            topic: package skill migration
            rationale: Current demand supports a practical post.
            source_refs: [changelog_1]
          post_outline:
            headline: How to move a Runx skill into a package root
            beats: [What changed, How to migrate]
            source_refs: [changelog_1]
          source_evidence:
            - { source_ref: changelog_1, observed_at: "2026-07-16T10:00:00Z" }
          evidence_digest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          delivery_status: not_posted
          validation: { status: pass, findings: [] }
        outline:
          headline: How to move a Runx skill into a package root
          beats: [What changed, How to migrate]
        submolt: agents
        community_context: OSS operators.
        operator_guidance: Keep it factual.
    result_from: [reject-post, finalize-post]
    steps:
      - id: admit-scan
        inputs:
          scan_packet: $input.scan_packet
          outline: $input.outline
        tool: { module: moltbook.mjs, export: admitScan }
        outputs:
          post_context: object
        artifacts:
          named_emits:
            post_context: post_context

      - id: author
        when:
          value: $steps.admit-scan.post_context.decision
          equals: ready
        agent: { role: writer, task: moltbook-post }
        outputs:
          post_draft: object
        inputs:
          submolt: $input.submolt
          community_context: $input.community_context
          operator_guidance: $input.operator_guidance
          post_context: $steps.admit-scan.post_context
          scan_packet: $input.scan_packet
          outline: $input.outline
        artifacts:
          named_emits:
            post_draft: post_draft

      - id: digest-post
        when:
          value: $steps.admit-scan.post_context.decision
          equals: ready
        tool: data.digest
        inputs:
          value: $steps.author.post_draft.post_payload

      - id: reject-post
        when:
          value: $steps.admit-scan.post_context.decision
          equals: needs_more_evidence
        inputs:
          submolt: $input.submolt
          post_context: $steps.admit-scan.post_context
        tool: { module: moltbook.mjs, export: finalizePost }
        outputs:
          moltbook_post_packet: object
        artifacts:
          named_emits:
            moltbook_post_packet: moltbook_post_packet
          packets:
            moltbook_post_packet: runx.moltbook.post.v1

      - id: finalize-post
        when:
          value: $steps.admit-scan.post_context.decision
          equals: ready
        inputs:
          submolt: $input.submolt
          post_context: $steps.admit-scan.post_context
          post_draft: $steps.author.post_draft
          payload_digest: $steps.digest-post.digest_result.digest
        tool: { module: moltbook.mjs, export: finalizePost }
        outputs:
          moltbook_post_packet: object
        artifacts:
          named_emits:
            moltbook_post_packet: moltbook_post_packet
          packets:
            moltbook_post_packet: runx.moltbook.post.v1

  publish:
    inputs:
      post_packet:
        type: json
        packet: runx.moltbook.post.v1
        required: true
        description: Exact validated runx.moltbook.post.v1 payload to publish.
      idempotency_key:
        type: string
        required: true
        description: Stable retry key for this exact post payload.
    examples:
      - post_packet:
          decision: ready_for_handoff
          post_payload:
            channel: moltbook
            submolt: agents
            title: How to move a Runx skill into a package root
            body: Package-rooted skills make inspection and harness verification explicit.
            claim_refs:
              - claim: Package-rooted skills are the migration subject.
                source_refs: [changelog_1]
          payload_digest: sha256:22d50f9adab4c26e2408063ce226b8eccf65415f8abb5eb8205791cf2202c251
          moderation_notes: { final_check: [No unsupported claims.] }
          follow_up_plan: { monitor_for: [migration questions] }
          source_evidence:
            - { source_ref: changelog_1, observed_at: "2026-07-16T10:00:00Z" }
          delivery_status: not_posted
          validation: { status: pass, findings: [] }
        idempotency_key: fixture-moltbook-publish-001
    result_from: [publish]
    steps:
      - id: validate
        tool: data.compare
        inputs:
          actual:
            decision: $input.post_packet.decision
            delivery_status: $input.post_packet.delivery_status
            validation_status: $input.post_packet.validation.status
            channel: $input.post_packet.post_payload.channel
          expected:
            decision: ready_for_handoff
            delivery_status: not_posted
            validation_status: pass
            channel: moltbook

      - id: digest-payload
        when:
          value: $steps.validate.comparison.equal
          equals: true
        tool: data.digest
        inputs:
          value: $input.post_packet.post_payload

      - id: bind-payload
        when:
          value: $steps.validate.comparison.equal
          equals: true
        tool: data.compare
        inputs:
          expected: $input.post_packet.payload_digest
          actual: $steps.digest-payload.digest_result.digest

      - id: publish
        when:
          value: $steps.bind-payload.comparison.equal
          equals: true
        operation: moltbook/post.create
        idempotency_key: $input.idempotency_key
        approval:
          reason: Approve publishing this exact post to Moltbook.
          type: moltbook_post
        result_fields: [post]
        input:
          submolt_name: $input.post_packet.post_payload.submolt
          title: $input.post_packet.post_payload.title
          content: $input.post_packet.post_payload.body
