version: "0.4.13"
minimum_runx: 0.12.0
default_method: scan-provider
catalog:
  visibility: public
  category: content

shared_inputs:
  feed_snapshot:
    type: array
    description: One to 100 unique, timestamped Moltbook evidence items admitted for local analysis.
    minItems: 1
    maxItems: 100
    items:
      type: object
      required: [source_id, topic, summary, observed_at]
      additionalProperties: false
      properties:
        source_id: {type: string, minLength: 1, maxLength: 512}
        topic: {type: string, minLength: 1, maxLength: 500}
        summary: {type: string, minLength: 1, maxLength: 10000}
        observed_at: {type: string, format: date-time}
  outline:
    type: object
    description: Exact headline and beats selected from the admitted scan packet.
    required: [headline, beats]
    additionalProperties: false
    properties:
      headline: {type: string, minLength: 1, maxLength: 500}
      beats:
        type: array
        minItems: 1
        maxItems: 20
        items: {type: string, minLength: 1, maxLength: 1000}
      source_ids:
        type: array
        uniqueItems: true
        items: {type: string, minLength: 1, maxLength: 512}
methods:
  scan-provider:
    description: Read Moltbook's newest posts, in one submolt if named, and find at most one opportunity, cited to the posts behind it.
    inputs:
      objective:
        type: string
        description: Posting objective.
      community_context:
        type: string
        description: Intended community and discussion context.
        optional: true
      as_of:
        type: string
        description: ISO-8601 evaluation time for a replay. A live read is judged at its own observation time.
        optional: true
      max_age_hours:
        type: number
        default: 168
        description: Maximum feed signal age.
        optional: true
      max_items:
        type: number
        default: 50
        description: Newest posts to read, at most 100.
        optional: true
      submolt:
        type: string
        description: Read only this submolt's posts.
        optional: true
    examples:
      - objective: Find one useful post for Runx builders.
        community_context: OSS operators evaluating governed agent workflows.
        max_age_hours: 48
        max_items: 50
    result_from: [reject, finalize]
    steps:
      - id: observed
        tool: control.observed_at
        outputs:
          observed_at: {type: string}

      - id: read-feed
        operation: moltbook/feed.scan
        result:
          required: [posts]
        inputs:
          limit: $input.max_items
          submolt: $input.submolt

      - id: admit
        inputs:
          objective: $input.objective
          as_of: $input.as_of
          observed_at: $steps.observed.observed_at
          max_age_hours: $input.max_age_hours
          posts: $steps.read-feed.provider_operation.result.posts
        tool: {module: moltbook.mjs, export: admitFeed}
        outputs:
          feed_index: {type: object}
          as_of: {type: string}

      - id: digest
        tool: data.digest
        inputs:
          value: $steps.admit.feed_index.sources

      - id: reject
        when:
          value: $steps.admit.feed_index.decision
          equals: needs_more_evidence
        inputs:
          feed_index: $steps.admit.feed_index
          evidence_digest: $steps.digest.digest_result.digest
        tool: {module: moltbook.mjs, export: finalizeScan}
        outputs:
          moltbook_scan_packet: {type: object, packet: runx/moltbook.scan.v1}

      - id: analyze
        when:
          value: $steps.admit.feed_index.decision
          equals: ready
        agent: moltbook-scan
        outputs:
          scan_draft:
            type: object
            properties:
              decision:
                type: string
              opportunity_report:
                type: object
                properties:
                  topic:
                    type: string
                  rationale:
                    type: string
                  source_ids:
                    type: array
                    items:
                      type: string
              post_outline:
                type: object
                properties:
                  headline:
                    type: string
                  beats:
                    type: array
                    items:
                      type: string
                  source_ids:
                    type: array
                    items:
                      type: string
              moderation_notes:
                type: object
                properties:
                  sensitivity:
                    type: string
                  tone:
                    type: string
              follow_up_plan:
                type: object
                properties:
                  monitor_for:
                    type: array
                    items:
                      type: string
            required:
              - decision
            if:
              properties:
                decision:
                  pattern: ^ready
            then:
              required:
                - opportunity_report
                - post_outline
                - moderation_notes
                - follow_up_plan
        inputs:
          objective: $input.objective
          community_context: $input.community_context
          feed_index: $steps.admit.feed_index
          evidence_digest: $steps.digest.digest_result.digest
          as_of: $steps.admit.as_of
          max_age_hours: $input.max_age_hours
          max_items: $input.max_items
          submolt: $input.submolt

      - id: finalize
        when:
          value: $steps.admit.feed_index.decision
          equals: ready
        inputs:
          feed_index: $steps.admit.feed_index
          evidence_digest: $steps.digest.digest_result.digest
          scan_draft: $steps.analyze.scan_draft
        tool: {module: moltbook.mjs, export: finalizeScan}
        outputs:
          moltbook_scan_packet: {type: object, packet: runx/moltbook.scan.v1}

  scan:
    description: Find at most one opportunity in a feed snapshot you already captured, for replay or offline work.
    inputs:
      objective:
        type: string
        description: Posting objective.
      community_context:
        type: string
        description: Intended community and discussion context.
        optional: true
      feed_snapshot: {}
      as_of:
        type: string
        description: Explicit ISO-8601 evaluation time.
      max_age_hours:
        type: number
        default: 168
        description: Maximum feed signal age.
        optional: true
    examples:
      - objective: Find one useful post for Runx builders.
        community_context: OSS operators evaluating governed agent workflows.
        as_of: "2026-07-17T12:00:00Z"
        max_age_hours: 48
        feed_snapshot:
          - source_id: changelog_1
            topic: package skills
            summary: Runx now enforces package-rooted skills.
            observed_at: "2026-07-16T10:00:00Z"
    result_from: [reject, finalize]
    steps:
      - id: admit
        inputs:
          objective: $input.objective
          feed_snapshot: $input.feed_snapshot
          as_of: $input.as_of
          max_age_hours: $input.max_age_hours
        tool: {module: moltbook.mjs, export: admitFeed}
        outputs:
          feed_index: {type: object}
          as_of: {type: string}

      - id: digest
        tool: data.digest
        inputs:
          value: $steps.admit.feed_index.sources

      - id: reject
        when:
          value: $steps.admit.feed_index.decision
          equals: needs_more_evidence
        inputs:
          feed_index: $steps.admit.feed_index
          evidence_digest: $steps.digest.digest_result.digest
        tool: {module: moltbook.mjs, export: finalizeScan}
        outputs:
          moltbook_scan_packet: {type: object, packet: runx/moltbook.scan.v1}

      - id: analyze
        when:
          value: $steps.admit.feed_index.decision
          equals: ready
        agent: moltbook-scan
        outputs:
          scan_draft:
            type: object
            properties:
              decision:
                type: string
              opportunity_report:
                type: object
                properties:
                  topic:
                    type: string
                  rationale:
                    type: string
                  source_ids:
                    type: array
                    items:
                      type: string
              post_outline:
                type: object
                properties:
                  headline:
                    type: string
                  beats:
                    type: array
                    items:
                      type: string
                  source_ids:
                    type: array
                    items:
                      type: string
              moderation_notes:
                type: object
                properties:
                  sensitivity:
                    type: string
                  tone:
                    type: string
              follow_up_plan:
                type: object
                properties:
                  monitor_for:
                    type: array
                    items:
                      type: string
            required:
              - decision
            if:
              properties:
                decision:
                  pattern: ^ready
            then:
              required:
                - opportunity_report
                - post_outline
                - moderation_notes
                - follow_up_plan
        inputs:
          objective: $input.objective
          community_context: $input.community_context
          feed_index: $steps.admit.feed_index
          evidence_digest: $steps.digest.digest_result.digest
          feed_snapshot: $input.feed_snapshot
          as_of: $input.as_of
          max_age_hours: $input.max_age_hours

      - id: finalize
        when:
          value: $steps.admit.feed_index.decision
          equals: ready
        inputs:
          feed_index: $steps.admit.feed_index
          evidence_digest: $steps.digest.digest_result.digest
          scan_draft: $steps.analyze.scan_draft
        tool: {module: moltbook.mjs, export: finalizeScan}
        outputs:
          moltbook_scan_packet: {type: object, packet: runx/moltbook.scan.v1}

  post:
    description: Draft a post for the opportunity a scan chose, within Moltbook's limits and the scan's evidence. Publishes nothing.
    inputs:
      scan_packet:
        packet: runx/moltbook.scan.v1
        description: Validated ready Moltbook scan packet.
      outline: {}
      submolt:
        type: string
        description: The submolt the post is written for.
        pattern: '^[A-Za-z0-9_-]{1,64}$'
      community_context:
        type: string
        description: Intended community context.
        optional: true
      operator_guidance:
        type: string
        description: Local content guidance, not publication approval.
        optional: true
    examples:
      - scan_packet:
          decision: ready
          opportunity_report:
            topic: package skill migration
            rationale: Current demand supports a practical post.
            source_ids: [changelog_1]
          post_outline:
            headline: How to move a Runx skill into a package root
            beats: [What changed, How to migrate]
            source_ids: [changelog_1]
          source_evidence:
            - {source_id: changelog_1, observed_at: "2026-07-16T10:00:00Z"}
          evidence_digest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          delivery_status: not_posted
          validation: {status: pass, findings: []}
        outline:
          headline: How to move a Runx skill into a package root
          beats: [What changed, How to migrate]
        submolt: agents
        community_context: OSS operators.
        operator_guidance: Keep it factual.
    result_from: [reject-post, finalize-post]
    steps:
      - id: admit-scan
        inputs:
          scan_packet: $input.scan_packet
          outline: $input.outline
        tool: {module: moltbook.mjs, export: admitScan}
        outputs:
          post_context: {type: object}

      - id: author
        when:
          value: $steps.admit-scan.post_context.decision
          equals: ready
        agent: moltbook-post
        outputs:
          post_draft:
            type: object
            properties:
              decision:
                type: string
              post_payload:
                type: object
                properties:
                  channel:
                    type: string
                  submolt:
                    type: string
                  title:
                    type: string
                  body:
                    type: string
                  claims:
                    type: array
                    items:
                      type: object
                      properties:
                        claim:
                          type: string
                        source_ids:
                          type: array
                          items:
                            type: string
              moderation_notes:
                type: object
                properties:
                  final_check:
                    type: array
                    items:
                      type: string
              follow_up_plan:
                type: object
                properties:
                  monitor_for:
                    type: array
                    items:
                      type: string
            required:
              - decision
            if:
              properties:
                decision:
                  pattern: ^ready
            then:
              required:
                - post_payload
                - moderation_notes
                - follow_up_plan
        inputs:
          submolt: $input.submolt
          community_context: $input.community_context
          operator_guidance: $input.operator_guidance
          post_context: $steps.admit-scan.post_context
          scan_packet: $input.scan_packet
          outline: $input.outline

      - id: digest-post
        when:
          value: $steps.admit-scan.post_context.decision
          equals: ready
        tool: data.digest
        inputs:
          value: $steps.author.post_draft.post_payload

      - id: reject-post
        when:
          value: $steps.admit-scan.post_context.decision
          equals: needs_more_evidence
        inputs:
          submolt: $input.submolt
          post_context: $steps.admit-scan.post_context
        tool: {module: moltbook.mjs, export: finalizePost}
        outputs:
          moltbook_post_packet: {type: object, packet: runx/moltbook.post.v1}

      - id: finalize-post
        when:
          value: $steps.admit-scan.post_context.decision
          equals: ready
        inputs:
          submolt: $input.submolt
          post_context: $steps.admit-scan.post_context
          post_draft: $steps.author.post_draft
          payload_digest: $steps.digest-post.digest_result.digest
        tool: {module: moltbook.mjs, export: finalizePost}
        outputs:
          moltbook_post_packet: {type: object, packet: runx/moltbook.post.v1}

  publish:
    description: Publish a drafted post to its submolt once, after exact approval, and read it back.
    inputs:
      post_packet:
        packet: runx/moltbook.post.v1
        description: Exact validated runx/moltbook.post.v1 payload to publish.
      idempotency_key:
        type: string
        description: Stable retry key for this exact post payload.
    examples:
      - post_packet:
          decision: ready_for_handoff
          post_payload:
            channel: moltbook
            submolt: agents
            title: How to move a Runx skill into a package root
            body: Package-rooted skills make inspection and test verification explicit.
            claims:
              - claim: Package-rooted skills are the migration subject.
                source_ids: [changelog_1]
          payload_digest: sha256:22d50f9adab4c26e2408063ce226b8eccf65415f8abb5eb8205791cf2202c251
          moderation_notes: {final_check: [No unsupported claims.]}
          follow_up_plan: {monitor_for: [migration questions]}
          source_evidence:
            - {source_id: changelog_1, observed_at: "2026-07-16T10:00:00Z"}
          delivery_status: not_posted
          validation: {status: pass, findings: []}
        idempotency_key: fixture-moltbook-publish-001
    result_from: [publish]
    steps:
      - id: validate
        tool: data.compare
        inputs:
          actual:
            decision: $input.post_packet.decision
            delivery_status: $input.post_packet.delivery_status
            validation_status: $input.post_packet.validation.status
            channel: $input.post_packet.post_payload.channel
          expected:
            decision: ready_for_handoff
            delivery_status: not_posted
            validation_status: pass
            channel: moltbook

      - id: digest-payload
        when:
          value: $steps.validate.comparison.equal
          equals: true
        tool: data.digest
        inputs:
          value: $input.post_packet.post_payload

      - id: bind-payload
        when:
          value: $steps.validate.comparison.equal
          equals: true
        tool: data.compare
        inputs:
          expected: $input.post_packet.payload_digest
          actual: $steps.digest-payload.digest_result.digest

      - id: publish
        when:
          value: $steps.bind-payload.comparison.equal
          equals: true
        operation: moltbook/post.create
        idempotency_key: $input.idempotency_key
        approval:
          reason: Approve publishing this exact post to Moltbook.
          type: moltbook_post
        result:
          required: [post]
        inputs:
          submolt_name: $input.post_packet.post_payload.submolt
          title: $input.post_packet.post_payload.title
          content: $input.post_packet.post_payload.body
