skill: lead-router
version: "0.3.2"

catalog:
  kind: graph
  audience: public
  visibility: public
  role: context
  execution: plan
  completion: plan
  requires_adapter: false
  approval: none
  category: growth

harness:
  files: [fixtures/support/forward-send-plan.graph]
  cases:
    - name: lead-router-prepares-evidence-bound-outreach-handoff
      operator_journeys:
        - mode: standalone
          confusors: [lead-enrichment, send-as]
          request: Route this validated lead to outreach, nurture, or hold and preserve why.
          expected_outcome: Return one evidence-bound route and downstream handoff without sending a message.
        - mode: composed
          request: Route the lead from this completed enrichment packet.
          expected_outcome: Reuse enrichment and consent evidence without repeating account research or consent classification.
          prior_evidence:
            - The validated lead-enrichment packet and consent posture supplied in the fixture.
          must_not_repeat:
            - Do not repeat lead enrichment.
            - Do not send outreach or reevaluate consent downstream.
      inputs:
        enrichment_packet:
          decision: ready_for_review
          lead_profile: { account_id: acct_42, company: ExampleCRM }
          evidence:
            - { claim: Active evaluation., source_refs: [signal_pricing], confidence: observed }
          fit_assessment: { fit: strong, confidence: medium }
          recommended_action: { type: review_outreach }
          signal_evidence:
            - { source_ref: signal_pricing, signal_digest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa, type: product, observed_at: "2026-07-16T10:00:00Z" }
          consent: { opted_in: true, do_not_contact: false, channels_allowed: [email] }
          delivery_status: not_sent
          validation: { status: pass, findings: [] }
        principal: account:growth-bot
        objective: Offer a deliverability review.
        provider_context: { name: example-email, account_ref: provider-account:growth, runtime_path: email.send }
      caller:
        answers:
          agent.lead-route.output:
            route_draft:
              route: reach_out
              rationale: Strong fit and active evaluation support a reviewed direct follow-up.
              segment: mid-market
              evidence_refs: [signal_pricing]
      expect:
        status: sealed
        steps: [digest, admit, qualify, finalize]
        step_outputs:
          finalize:
            subset:
              lead_route_packet:
                data:
                  decision: ready
                  route: reach_out
                  downstream_handoff:
                    skill: send-as
                    runner: plan
                    state: prepared_for_send_planning
                    expected_outcome: content_and_provider_preflight_required
                  delivery_status: not_sent
                  validation: { status: pass }
        receipt: { schema: runx.receipt.v1 }

    - name: lead-router-records-do-not-contact-hold
      inputs:
        enrichment_packet:
          decision: do_not_contact
          lead_profile: { account_id: acct_42 }
          evidence: []
          fit_assessment: {}
          recommended_action: { type: hold }
          signal_evidence:
            - { source_ref: signal_optout, signal_digest: sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb, type: consent, observed_at: "2026-07-16T10:00:00Z" }
          consent: { opted_in: false, do_not_contact: true, channels_allowed: [] }
          delivery_status: not_sent
          validation: { status: pass, findings: [] }
        principal: account:growth-bot
      expect:
        status: sealed
        steps: [digest, admit, hold]
        step_outputs:
          hold:
            subset:
              lead_route_packet:
                data:
                  decision: ready
                  route: hold
                  hold_record: { recorded: true, record_scope: signed_run_receipt, external_state_mutated: false, reason: consent_or_suppression }
                  delivery_status: not_sent
        receipt: { schema: runx.receipt.v1 }

    - name: lead-router-rejects-invented-route-evidence
      inputs:
        enrichment_packet:
          decision: ready_for_review
          lead_profile: { account_id: acct_42 }
          evidence: []
          fit_assessment: { fit: medium }
          recommended_action: { type: review_outreach }
          signal_evidence:
            - { source_ref: signal_pricing, signal_digest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa, type: product, observed_at: "2026-07-16T10:00:00Z" }
          consent: { opted_in: true, do_not_contact: false, channels_allowed: [email] }
          delivery_status: not_sent
          validation: { status: pass, findings: [] }
        principal: account:growth-bot
      caller:
        answers:
          agent.lead-route.output:
            route_draft:
              route: reach_out
              rationale: Invented signal.
              segment: mid-market
              evidence_refs: [signal_funding]
      expect:
        status: sealed
        steps: [digest, admit, qualify, finalize]
        step_outputs:
          finalize:
            subset:
              lead_route_packet:
                data:
                  decision: needs_more_evidence
                  validation: { status: fail }
        receipt: { schema: runx.receipt.v1 }

runners:
  lead-router:
    default: true
    inputs:
      enrichment_packet:
        type: json
        required: true
        description: Validated lead enrichment packet data.
      principal:
        type: string
        required: true
        description: Proposed sender principal for downstream planning.
      objective:
        type: string
        required: false
        description: Intended downstream outcome.
      provider_context:
        type: json
        required: false
        description: Proposed provider binding for a downstream send plan.
    result_from: [hold, finalize]
    steps:
      - id: digest
        tool: data.digest
        inputs:
          value: $input.enrichment_packet

      - id: admit
        inputs:
          enrichment_packet: $input.enrichment_packet
        tool: { module: lead-router.mjs, export: admitEnrichment }
        outputs:
          route_context: object
        artifacts:
          named_emits:
            route_context: route_context

      - id: hold
        when:
          field: admit.route_context.data.path
          equals: hold
        inputs:
          principal: $input.principal
        context:
          route_context: admit.route_context.data
          enrichment_digest: digest.digest_result.data.digest
        tool: { module: lead-router.mjs, export: finalizeRoute }
        outputs:
          lead_route_packet:
            type: object
            schema:
              required: [decision, route, rationale, segment, evidence_refs, enrichment_digest, downstream_handoff, hold_record, delivery_status, validation]
              additionalProperties: false
              properties:
                decision: { type: string, enum: [ready, needs_more_evidence] }
                route: { type: string, enum: [reach_out, nurture, hold] }
                rationale: { type: string, maxLength: 4000 }
                segment: { type: string, maxLength: 1000 }
                evidence_refs: { type: array, maxItems: 100, uniqueItems: true, items: { type: string, minLength: 1, maxLength: 1000 } }
                enrichment_digest: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
                downstream_handoff:
                  type: object
                  additionalProperties: false
                  properties:
                    skill: { const: send-as }
                    runner: { const: plan }
                    state: { const: prepared_for_send_planning }
                    expected_outcome: { const: content_and_provider_preflight_required }
                    inputs:
                      type: object
                      required: [principal, objective, provider_context, audience, consent_basis, operator_context]
                      additionalProperties: false
                      properties:
                        principal: { type: string, maxLength: 1000 }
                        objective: { type: string, maxLength: 4000 }
                        provider_context: { type: object, maxProperties: 100 }
                        audience:
                          type: object
                          required: [type, ref]
                          additionalProperties: false
                          properties:
                            type: { type: string, enum: [segment, recipient] }
                            ref: { type: string, maxLength: 1000 }
                        consent_basis: { type: string, maxLength: 2000 }
                        operator_context: { type: string, maxLength: 4000 }
                hold_record:
                  type: object
                  required: [recorded, record_scope, external_state_mutated, reason]
                  additionalProperties: false
                  properties:
                    recorded: { type: boolean }
                    record_scope: { type: string, enum: [signed_run_receipt, none] }
                    external_state_mutated: { const: false }
                    reason: { type: string, maxLength: 1000 }
                delivery_status: { const: not_sent }
                validation:
                  type: object
                  required: [status, findings]
                  additionalProperties: false
                  properties:
                    status: { type: string, enum: [pass, fail] }
                    findings:
                      type: array
                      maxItems: 250
                      items:
                        type: object
                        required: [code, message]
                        additionalProperties: false
                        properties:
                          code: { type: string, minLength: 1, maxLength: 200 }
                          message: { type: string, minLength: 1, maxLength: 4000 }
        artifacts:
          named_emits:
            lead_route_packet: lead_route_packet
          packets:
            lead_route_packet: runx.growth.lead_route.v1

      - id: qualify
        when:
          field: admit.route_context.data.path
          equals: qualify
        agent: { role: growth, task: lead-route }
        outputs:
          route_draft: object
        inputs:
          objective: $input.objective
        context:
          route_context: admit.route_context.data
        artifacts:
          named_emits:
            route_draft: route_draft

      - id: finalize
        when:
          field: admit.route_context.data.path
          equals: qualify
        inputs:
          principal: $input.principal
          objective: $input.objective
          provider_context: $input.provider_context
        context:
          route_context: admit.route_context.data
          route_draft: qualify.route_draft.data
          enrichment_digest: digest.digest_result.data.digest
        tool: { module: lead-router.mjs, export: finalizeRoute }
        outputs:
          lead_route_packet: object
        artifacts:
          named_emits:
            lead_route_packet: lead_route_packet
          packets:
            lead_route_packet: runx.growth.lead_route.v1
