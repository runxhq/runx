name: send-as-default-reaches-exact-live-send-gate
kind: skill
target: ..
operator_journeys:
  - mode: refusal
    confusors: [slack-notify, governed-outbound]
    request: Attempt to send this digest-bound release notice without approving the exact live effect.
    expected_outcome: Suspend at one exact live-send approval without claiming delivery.
inputs:
  objective: Send the digest-bound release notice.
  principal: account:release-bot
  provider_context:
    provider: slack
    account_ref: acct_release
    runtime_path: provider.send
    ready: true
  audience:
    type: channel
    ref: release-subscribers
  content_ref:
    draft_ref: message:release-notice
    digest: sha256:eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee
    subject_or_title: Release notice
  consent_basis: Subscribers opted in to release notices.
  operator_context: Require exact approval before live delivery.
  connector:
    provider: slack
    target: account:acct_release/channel:release-subscribers
caller:
  answers:
    agent.send-as.output:
      send_plan:
        decision: ready
        action_family: send-as
        principal: { type: account, ref: account:release-bot }
        provider: { name: slack, account_ref: acct_release, runtime_path: provider.send }
        send_class: status
        channel: email
        audience: { type: channel, ref: release-subscribers, requires_reconfirmation: false }
        content:
          draft_ref: message:release-notice
          digest: sha256:eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee
          subject_or_title: Release notice
        gates: { preflight_required: true, human_approval_required: true, approval_ref: send-as.live-send.approval }
        blockers: []
        provider_actions: [message.send]
        evidence_refs: [provider_context:slack]
        success_checkpoint:
          milestone: send_ready_for_approval
          description: The exact digest-bound release notice awaits live-send approval.
  provider_responses:
    principal_id: release-bot
    grant:
        grant_id: grant-send-demo
        provider: slack
        scopes: [message.send]
expect:
  status: needs_agent
metadata:
  public_skill: send-as
  source_case: direct-default-live-send-gate
  source: operator-journey
