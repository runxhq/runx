version: "0.2.17"
minimum_runx: 0.12.0
default_method: brief
catalog:
  visibility: public
  category: research

shared_inputs:
  domain:
    type: string
    description: Domain context for interpretation.
    optional: true
  operator_context:
    type: string
    description: Local constraints that do not count as evidence.
    optional: true

methods:
  research-brief:
    description: Produce a decision-ready brief from governed source packets, researching the question and then drafting the brief with every source bound.
    inputs:
      objective:
        type: string
        description: Exact decision question the brief must answer.
        minLength: 1
        maxLength: 4000
      source_packets:
        type: array
        description: Bounded governed source packets, normally web-fetch provider operation evidence.
        maxItems: 20
      audience:
        type: string
        default: operators
        description: Primary reader for the decision brief.
        optional: true
      channel:
        type: string
        default: brief
        description: Local package format; this method does not deliver it.
        optional: true
      domain: {}
      operator_context: {}
      target_entities:
        description: Bounded entity names or caller-owned structured selectors to include or compare.
        oneOf:
          - {type: array, maxItems: 100}
          - {type: object, maxProperties: 100}
        optional: true
    examples:
      - objective: Decide whether the supplied architecture evidence supports native ownership.
        audience: operators
        channel: brief
        source_packets:
          - decision: ready
            final_url: https://example.com/architecture
            status: 200
            content_digest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
            extracted: The operation is reused across multiple independently governed skills.
            provenance: {fetched_at: '2026-07-18T00:00:00Z', bytes: 68, truncated: false, redirects: []}
    result_from: [research-topic, draft-brief]
    steps:
      - id: research-topic
        skill: ../research#research
        inputs:
          objective: $input.objective
          source_packets: $input.source_packets
          domain: $input.domain
          deliverable: deep research brief
          operator_context: $input.operator_context
          target_entities: $input.target_entities
        outputs:
          research_packet: {packet: runx/research.packet.v1, optional: true}

      - id: draft-brief
        when:
          value: $steps.research-topic.research_packet.decision
          equals: ready
        skill: ../ghostwrite#draft
        inputs:
          objective: $input.objective
          audience: $input.audience
          channel: $input.channel
          voice_guide: Lead with the decision, distinguish verified evidence from inference, and preserve open questions.
          evidence_pack: $steps.research-topic.research_packet
        outputs:
          content_draft_packet: {packet: runx/ghostwrite.draft.v1, optional: true}

  local-files:
    description: Produce the brief from bounded local files, read through runx's filesystem.
    inputs:
      objective:
        type: string
        description: Exact decision question the brief must answer.
        minLength: 1
        maxLength: 4000
      paths:
        type: array
        description: One to sixteen UTF-8 evidence paths below the selected root.
        minItems: 1
        maxItems: 16
        uniqueItems: true
        items: {type: string, minLength: 1, maxLength: 4096}
      repo_root:
        type: string
        default: .
        description: Workspace-relative or explicit absolute root containing the files.
        optional: true
      path_scope:
        type: string
        default: workspace
        description: Root ownership boundary used by the native filesystem reader.
        enum: [workspace, skill]
        optional: true
      max_bytes:
        type: integer
        default: 500000
        description: Maximum UTF-8 bytes read from each source file.
        minimum: 1
        maximum: 8388608
        optional: true
      audience:
        type: string
        default: operators
        description: Primary reader for the decision brief.
        optional: true
      channel:
        type: string
        default: brief
        description: Local package format; this method does not deliver it.
        optional: true
      domain: {}
      operator_context: {}
      target_entities:
        description: Bounded entity names or caller-owned structured selectors to include or compare.
        oneOf:
          - {type: array, maxItems: 100}
          - {type: object, maxProperties: 100}
        optional: true
    examples:
      - objective: Identify the strongest architecture decision in the local design notes.
        paths: [docs/architecture.md, docs/constraints.md]
        repo_root: .
        audience: operators
        channel: brief
    result_from: [research-topic, draft-brief]
    steps:
      - id: research-topic
        skill: ../research#local-files
        inputs:
          objective: $input.objective
          paths: $input.paths
          repo_root: $input.repo_root
          path_scope: $input.path_scope
          max_bytes: $input.max_bytes
          domain: $input.domain
          deliverable: deep research brief
          operator_context: $input.operator_context
          target_entities: $input.target_entities
        outputs:
          research_packet: {packet: runx/research.packet.v1, optional: true}

      - id: draft-brief
        when: {value: $steps.research-topic.research_packet.decision, equals: ready}
        skill: ../ghostwrite#draft
        inputs:
          objective: $input.objective
          audience: $input.audience
          channel: $input.channel
          voice_guide: Lead with the decision, distinguish verified evidence from inference, and preserve open questions.
          evidence_pack: $steps.research-topic.research_packet
        outputs:
          content_draft_packet: {packet: runx/ghostwrite.draft.v1, optional: true}
  ecosystem:
    description: Produce an ecosystem brief, checking first that every source is fresh against an explicit evaluation time.
    inputs:
      objective:
        type: string
        description: What the content must accomplish.
      source_packets:
        description: Bounded governed source packets, normally web-fetch provider operation evidence.
      audience:
        type: string
        default: operators
        description: Intended reader for the draft.
        optional: true
      channel:
        type: string
        default: brief
        description: Intended content channel; this method does not deliver it.
        optional: true
      domain: {}
      as_of:
        type: string
        description: Explicit ISO-8601 evaluation time used for reproducible freshness checks.
      max_age_hours:
        type: number
        default: 168
        description: Maximum accepted source age in hours.
        optional: true
      operator_context: {}
      target_entities:
        description: Entities to include or compare.
        optional: true
    result_from: [freshness, research-topic, draft-brief]
    steps:
      - id: freshness
        inputs:
          as_of: $input.as_of
          max_age_hours: $input.max_age_hours
          source_packets: $input.source_packets
        tool: {module: ecosystem.mjs}
        outputs:
          freshness_report: {type: object}

      - id: research-topic
        skill: ../research#research
        inputs:
          objective: $input.objective
          domain: $input.domain
          deliverable: ecosystem brief
          operator_context: $input.operator_context
          target_entities: $input.target_entities
          source_packets: $steps.freshness.freshness_report.source_packets
        outputs:
          research_packet: {packet: runx/research.packet.v1, optional: true}

      - id: draft-brief
        when:
          value: $steps.research-topic.research_packet.decision
          equals: ready
        skill: ../ghostwrite#draft
        inputs:
          objective: $input.objective
          audience: $input.audience
          channel: $input.channel
          voice_guide: Lead with what changed and its operational implication; distinguish verified change, inference, uncertainty, and recommended posture.
          evidence_pack: $steps.research-topic.research_packet
        outputs:
          content_draft_packet: {packet: runx/ghostwrite.draft.v1, optional: true}

  brief:
    description: Answer a bounded decision question and produce a source-bound memo, acquiring only missing evidence.
    inputs:
      objective:
        type: string
        description: Exact decision question the brief must answer.
        minLength: 1
        maxLength: 4000
      audience:
        type: string
        default: operators
        description: Primary reader for the decision brief.
        optional: true
      channel:
        type: string
        default: brief
        description: Local package format; this method does not deliver it.
        optional: true
      domain: {}
      operator_context: {}
      target_entities:
        description: Bounded entity names or caller-owned structured selectors to include or compare.
        oneOf:
          - {type: array, maxItems: 100}
          - {type: object, maxProperties: 100}
        optional: true
      source_packets:
        type: array
        default: []
        description: Already acquired governed readbacks; nonempty sources skip acquisition.
        maxItems: 20
        items: {type: object, additionalProperties: true}
        optional: true
      paths:
        type: array
        default: []
        description: Contained local source paths read directly by the research owner.
        maxItems: 16
        uniqueItems: true
        items: {type: string, minLength: 1}
        optional: true
      urls:
        type: array
        default: []
        description: Exact public source URLs to fetch without discovery.
        maxItems: 20
        uniqueItems: true
        items: {type: string, format: uri, pattern: '^https?://'}
        optional: true
    examples:
      - {objective: 'Decide where the operator loop belongs from our architecture document.', paths: [CONVENTIONS.md]}
    result_from: [research-topic, draft-brief]
    steps:
      - id: research-topic
        skill: ../research#investigate
        inputs:
          objective: $input.objective
          domain: $input.domain
          deliverable: decision memo
          operator_context: $input.operator_context
          target_entities: $input.target_entities
          paths: $input.paths
          urls: $input.urls
          source_packets: $input.source_packets
        outputs:
          research_packet: {packet: runx/research.packet.v1, optional: true}
      - id: draft-brief
        when: {value: $steps.research-topic.research_packet.decision, equals: ready}
        skill: .#from-research
        inputs:
          objective: $input.objective
          audience: $input.audience
          channel: $input.channel
          research_packet: $steps.research-topic.research_packet
        outputs:
          content_draft_packet: {packet: runx/ghostwrite.draft.v1, optional: true}

  from-research:
    description: Write the decision memo from a completed research packet, without another acquisition or synthesis pass.
    inputs:
      objective:
        type: string
        description: Exact decision question the brief must answer.
        minLength: 1
        maxLength: 4000
      audience:
        type: string
        default: operators
        description: Primary reader for the decision brief.
        optional: true
      channel:
        type: string
        default: brief
        description: Local package format; this method does not deliver it.
        optional: true
      research_packet:
        packet: runx/research.packet.v1
        description: Existing source-bound research result, passed unchanged to writing admission.
    examples:
      - {"objective": "Should a domain operator move its skill loop and state into Runx Cloud when it uses hosted connectors? Explain the ownership and integration consequences from the supplied conventions.", "research_packet": {"decision": "ready", "decision_support": [{"option": "Keep loop state and scheduling in the owning local operator; bind hosted provider execution only where explicitly selected.", "rationale": "The conventions separately assign product residency, native execution and portable hosted provider implementations. This keeps the chosen connector from changing who owns the operator.", "source_digests": ["sha256:ca0e40760e18ba1f1187fe9d86ae0e9af7209ee58254594fb621247b3fe328db"]}], "evidence_log": [{"claim": "Products own persistence, agent loops and scheduling; the client root only invokes finite native commands.", "confidence": "verified", "content_digest": "sha256:ca0e40760e18ba1f1187fe9d86ae0e9af7209ee58254594fb621247b3fe328db", "relevance": "This assigns residency and durable state to the operator product rather than the invocation client or hosted connector.", "source_digest": "sha256:ca0e40760e18ba1f1187fe9d86ae0e9af7209ee58254594fb621247b3fe328db"}, {"claim": "Hosted adapters are optional implementations of provider-operation contracts and cannot become a prerequisite for otherwise portable skills.", "confidence": "verified", "content_digest": "sha256:ca0e40760e18ba1f1187fe9d86ae0e9af7209ee58254594fb621247b3fe328db", "relevance": "Selecting a hosted credential/transport implementation does not require moving the operator into Runx Cloud.", "source_digest": "sha256:ca0e40760e18ba1f1187fe9d86ae0e9af7209ee58254594fb621247b3fe328db"}, {"claim": "OSS packages must not import Cloud code, and the public TypeScript path runs through the client and shared contracts.", "confidence": "verified", "content_digest": "sha256:ca0e40760e18ba1f1187fe9d86ae0e9af7209ee58254594fb621247b3fe328db", "relevance": "The integration should use the existing public native invocation boundary rather than coupling the operator to private Cloud implementation.", "source_digest": "sha256:ca0e40760e18ba1f1187fe9d86ae0e9af7209ee58254594fb621247b3fe328db"}], "index_digest": "sha256:4a3cd4d6c5116ca170c5f9d365d346b7d0811434ea591c0e9447dcefb08a1160", "research_brief": {"objective": "Should a domain operator move its skill loop and state into Runx Cloud when it uses hosted connectors? Explain the ownership and integration consequences from the supplied conventions.", "open_questions": ["The supplied conventions do not specify the exact Cloud API routes or service limits; inspect those contracts before wiring a hosted binding."], "scope": "Current OSS architecture conventions, read natively from a copy of the current source document; this is a design decision, not an implementation audit.", "summary": "Keep the operator loop and durable state in its owning product. A hosted connector is an optional implementation of a provider capability and does not transfer orchestration ownership. Invoke the native runtime through the public client boundary, carrying bounded authority and receipt-backed results across each turn."}, "risks": [{"risk": "Source conventions are documentary evidence; this run has not audited an implemented product or deployed Cloud service."}], "source_evidence": [{"content_digest": "sha256:ca0e40760e18ba1f1187fe9d86ae0e9af7209ee58254594fb621247b3fe328db", "evidence_digest": "sha256:ca0e40760e18ba1f1187fe9d86ae0e9af7209ee58254594fb621247b3fe328db", "provenance": {"bytes": 13204, "observed_at": "2026-11-03T02:17:54.631Z", "path": "runx-conventions.md"}, "source_kind": "local_file", "source_uri": "file:runx-conventions.md"}], "validation": {"findings": [], "status": "pass"}}}
    result_from: [draft-brief]
    steps:
      - id: draft-brief
        skill: ../ghostwrite#draft
        inputs:
          objective: $input.objective
          audience: $input.audience
          channel: $input.channel
          voice_guide: Lead with the decision, distinguish evidence from inference, and preserve alternatives and open questions.
          evidence_pack: $input.research_packet
        outputs:
          content_draft_packet: {packet: runx/ghostwrite.draft.v1, optional: true}
