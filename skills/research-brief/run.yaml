                  decision: ready
                  accepted_count: 2
          research-topic:
            subset:
              research_packet:
                data:
                  decision: ready
                  validation:
                    status: pass
          draft-brief:
            subset:
              content_draft_packet:
                data:
                  decision: ready
                  validation:
                    status: pass
        receipt:
          schema: runx.receipt.v1

    - name: ecosystem-stops-before-drafting-without-sources
      runner: ecosystem
      inputs:
        objective: Decide whether the supplied claim is ready.
        audience: operators
