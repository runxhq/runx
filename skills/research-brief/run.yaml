skill: research-brief
version: "0.2.15"

catalog:
  kind: graph
  audience: public
  visibility: public
  role: context
  execution: read
  completion: runtime_receipt
  approval: none
  category: research

input_definitions:
  objective:
    type: string
    required: true
    description: Exact decision question the brief must answer.
    schema: { minLength: 1, maxLength: 4000 }
  audience:
    type: string
    required: false
    default: operators
    description: Primary reader for the decision brief.
  channel:
    type: string
    required: false
    default: brief
    description: Local package format; this runner does not deliver it.
  domain:
    type: string
    required: false
    description: Domain context for interpretation.
  operator_context:
    type: string
    required: false
    description: Local constraints that do not count as evidence.
  target_entities:
    type: json
    required: false
    description: Bounded entity names or caller-owned structured selectors to include or compare.
    schema:
      oneOf:
        - { type: array, maxItems: 100 }
        - { type: object, maxProperties: 100 }

harness:
  files: [fixtures/support/composed.graph]
  cases:
    - name: research-brief-packages-bound-brief-without-publishing
      operator_journeys:
        - mode: standalone
          confusors: [research, ghostwrite]
          request: Produce a decision-ready research-brief brief from these bounded sources.
          expected_outcome: Return a rigorous brief with material claims bound to source evidence and no publication claim.
        - mode: composed
          request: Continue the decision from this completed bounded research collection.
          expected_outcome: Reuse supplied research evidence and provenance without reacquiring sources or repeating collection.
          prior_evidence:
            - The bounded source collection, objective, and provenance supplied in the fixture.
          must_not_repeat:
            - Do not refetch or rediscover material sources.
            - Do not repeat evidence collection already preserved in the input packet.
      inputs:
        objective: Identify the strongest architectural signal in the supplied Runx evidence.
        audience: operators
        channel: brief
        domain: agent infrastructure
        source_packets:
          - decision: ready
            final_url: https://example.com/receipts
            status: 200
            content_digest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
            extracted: Runx receipts bind operator actions to explicit authority and verification evidence.
            provenance:
              fetched_at: "2026-07-17T00:00:00Z"
              bytes: 82
              truncated: false
              redirects: []
          - decision: ready
            final_url: https://example.com/skills
            status: 200
            content_digest: sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
            extracted: Portable skill packages separate model judgment from deterministic provider operations.
            provenance:
              fetched_at: "2026-07-17T00:01:00Z"
              bytes: 85
              truncated: false
              redirects: []
      caller:
        answers:
          synthesize:
            research_candidate:
              decision: ready
              research_brief:
                objective: Identify the strongest architectural signal in the supplied Runx evidence.
                scope: agent infrastructure
                summary: The strongest signal is evidence-bound execution packaged behind portable skills.
                open_questions: []
              evidence_log:
                - claim: Receipts bind actions to authority and verification evidence.
                  source_digest: sha256:9056e1b5caa4e78583d0bc47bb731468b31155929a3aa3a35fcadf6136534a36
                  content_digest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
                  confidence: verified
                  relevance: Establishes the governance half of the architecture.
                - claim: Portable skills separate judgment from deterministic operations.
                  source_digest: sha256:c951e0e102215f739709aa280773536f95d4560e1299999af9c2362db6a118dc
                  content_digest: sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
                  confidence: verified
                  relevance: Establishes the packaging and execution half.
              decision_support:
                - option: Lead with evidence-bound portable execution.
                  rationale: Both supplied sources support the combined architecture.
                  source_digests:
                    - sha256:9056e1b5caa4e78583d0bc47bb731468b31155929a3aa3a35fcadf6136534a36
                    - sha256:c951e0e102215f739709aa280773536f95d4560e1299999af9c2362db6a118dc
              risks: []
          author:
            content_draft:
              decision: ready
              content_brief:
                objective: Identify the strongest architectural signal in the supplied Runx evidence.
                audience: operators
                channel: brief
              draft:
                title: Evidence-bound execution is the architecture
                body: Runx binds operator actions to authority evidence and packages deterministic operations behind portable skills.
                claim_refs:
                  - claim: Receipts bind operator actions to authority evidence.
                    source_digests:
                      - sha256:9056e1b5caa4e78583d0bc47bb731468b31155929a3aa3a35fcadf6136534a36
                  - claim: Portable skills separate judgment from deterministic operations.
                    source_digests:
                      - sha256:c951e0e102215f739709aa280773536f95d4560e1299999af9c2362db6a118dc
              review_checklist:
                - Confirm both source bindings remain present.
              distribution_notes:
                primary_channel: brief
              context_binding: { applied: [] }
      expect:
        status: sealed
        steps:
          - research-topic
          - draft-brief
        step_outputs:
          research-topic:
            subset:
              research_packet:
                data:
                  decision: ready
                  validation:
                    status: pass
          draft-brief:
            subset:
              content_draft_packet:
                data:
                  decision: ready
                  validation:
                    status: pass
        receipt:
          schema: runx.receipt.v1

    - name: research-brief-stops-before-drafting-without-sources
      inputs:
        objective: Decide whether the supplied claim is ready.
        audience: operators
        channel: brief
        source_packets: []
      expect:
        status: sealed
        steps:
          - research-topic
        step_outputs:
          research-topic:
            subset:
              research_packet:
                data:
                  decision: needs_more_evidence
                  validation:
                    status: fail
        receipt:
          schema: runx.receipt.v1

    - name: research-brief-drafts-from-native-local-evidence
      runner: local-files
      inputs:
        objective: Decide where generic evidence admission belongs.
        paths: [fixtures/local-architecture-evidence.txt]
        path_scope: skill
        audience: operators
        channel: brief
      caller:
        answers:
          synthesize:
            research_candidate:
              decision: ready
              research_brief:
                objective: Decide where generic evidence admission belongs.
                scope: supplied architecture evidence
                summary: Generic evidence admission belongs in the native runtime, while skills own domain judgment.
                open_questions: []
              evidence_log:
                - claim: Generic evidence admission belongs in the native runtime.
                  source_digest: sha256:684d3c1ea722d675969c1abd8b00d3a91ff22c0088b6b71ab3c1e70382e82e45
                  content_digest: sha256:684d3c1ea722d675969c1abd8b00d3a91ff22c0088b6b71ab3c1e70382e82e45
                  confidence: verified
                  relevance: Establishes the reusable ownership boundary.
              decision_support:
                - option: Keep evidence admission native and domain interpretation in skills.
                  rationale: The admitted local evidence states that boundary directly.
                  source_digests: [sha256:684d3c1ea722d675969c1abd8b00d3a91ff22c0088b6b71ab3c1e70382e82e45]
              risks: []
          author:
            content_draft:
              decision: ready
              content_brief:
                objective: Decide where generic evidence admission belongs.
                audience: operators
                channel: brief
              draft:
                title: Keep generic evidence admission native
                body: Runx should admit and bind evidence once, while skills supply domain judgment.
                claim_refs:
                  - claim: Generic evidence admission belongs in the native runtime.
                    source_digests: [sha256:684d3c1ea722d675969c1abd8b00d3a91ff22c0088b6b71ab3c1e70382e82e45]
              review_checklist: [Preserve the native ownership boundary.]
              distribution_notes: { primary_channel: brief }
              context_binding: { applied: [] }
      expect:
        status: sealed
        steps: [research-topic, draft-brief]
        step_outputs:
          research-topic:
            subset:
              research_packet:
                data:
                  decision: ready
                  validation: { status: pass }
                  source_evidence:
                    - source_kind: local_file
          draft-brief:
            subset:
              content_draft_packet:
                data:
                  decision: ready
                  validation: { status: pass }
        receipt: { schema: runx.receipt.v1 }
    - name: ecosystem-produces-fresh-bound-brief
      runner: ecosystem
      operator_journeys:
        - mode: standalone
          confusors: [research, ghostwrite]
          request: Produce a fresh decision-ready ecosystem brief from these bounded sources.
          expected_outcome: Return a concise evidence-bound ecosystem briefing with source freshness and uncertainty explicit.
        - mode: composed
          request: Brief the operator from this already collected ecosystem evidence.
          expected_outcome: Reuse fresh research packets and source bindings without repeating market discovery.
          prior_evidence:
            - The bounded fresh ecosystem sources and research evidence supplied in the fixture.
          must_not_repeat:
            - Do not rediscover the ecosystem source set.
            - Do not refetch evidence already bound into the research packet.
      inputs:
        objective: Identify the strongest architectural signal in the supplied Runx evidence.
        audience: operators
        channel: brief
        domain: agent infrastructure
        as_of: "2026-07-17T12:00:00Z"
        max_age_hours: 24
        source_packets:
          - decision: ready
            final_url: https://example.com/receipts
            status: 200
            content_digest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
            extracted: Runx receipts bind operator actions to explicit authority and verification evidence.
            provenance:
              fetched_at: "2026-07-17T00:00:00Z"
              bytes: 82
              truncated: false
              redirects: []
          - decision: ready
            final_url: https://example.com/skills
            status: 200
            content_digest: sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
            extracted: Portable skill packages separate model judgment from deterministic provider operations.
            provenance:
              fetched_at: "2026-07-17T00:01:00Z"
              bytes: 85
              truncated: false
              redirects: []
      caller:
        answers:
          synthesize:
            research_candidate:
              decision: ready
              research_brief:
                objective: Identify the strongest architectural signal in the supplied Runx evidence.
                scope: agent infrastructure
                summary: The strongest signal is evidence-bound execution packaged behind portable skills.
                open_questions: []
              evidence_log:
                - claim: Receipts bind actions to authority and verification evidence.
                  source_digest: sha256:9056e1b5caa4e78583d0bc47bb731468b31155929a3aa3a35fcadf6136534a36
                  content_digest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
                  confidence: verified
                  relevance: Establishes the governance half of the architecture.
                - claim: Portable skills separate judgment from deterministic operations.
                  source_digest: sha256:c951e0e102215f739709aa280773536f95d4560e1299999af9c2362db6a118dc
                  content_digest: sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
                  confidence: verified
                  relevance: Establishes the packaging and execution half.
              decision_support:
                - option: Lead with evidence-bound portable execution.
                  rationale: Both supplied sources support the combined architecture.
                  source_digests:
                    - sha256:9056e1b5caa4e78583d0bc47bb731468b31155929a3aa3a35fcadf6136534a36
                    - sha256:c951e0e102215f739709aa280773536f95d4560e1299999af9c2362db6a118dc
              risks: []
          author:
            content_draft:
              decision: ready
              content_brief:
                objective: Identify the strongest architectural signal in the supplied Runx evidence.
                audience: operators
                channel: brief
              draft:
                title: Evidence-bound execution is the architecture
                body: Runx binds operator actions to authority evidence and packages deterministic operations behind portable skills.
                claim_refs:
                  - claim: Receipts bind operator actions to authority evidence.
                    source_digests:
                      - sha256:9056e1b5caa4e78583d0bc47bb731468b31155929a3aa3a35fcadf6136534a36
                  - claim: Portable skills separate judgment from deterministic operations.
                    source_digests:
                      - sha256:c951e0e102215f739709aa280773536f95d4560e1299999af9c2362db6a118dc
              review_checklist:
                - Confirm both source bindings remain present.
              distribution_notes:
                primary_channel: brief
              context_binding: { applied: [] }
      expect:
