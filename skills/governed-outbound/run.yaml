skill: governed-outbound
version: "0.3.5"
catalog:
  kind: graph
  audience: public
  visibility: public
  role: context
  execution: execute
  completion: provider_readback
  requires_adapter: true
  approval: conditional
harness:
  cases:
    - name: governed-outbound-approved-plan
      operator_journeys:
        - mode: standalone
          request: Fetch this allowlisted source, remove personal data, and prepare the exact outbound handoff.
          expected_outcome: Return a digest-bound scrubbed payload and truthful provider-neutral delivery handoff without leaking source PII.
        - mode: composed
          request: Continue outbound delivery from this already bounded source and target plan.
          expected_outcome: Reuse supplied source evidence and target intent without refetching, rescrubbing, or claiming delivery.
          prior_evidence:
            - The allowlisted source and target intent supplied in the fixture.
          must_not_repeat:
            - Do not fetch the external source again.
            - Do not repeat redaction after deterministic residual scanning has passed.
      runner: plan
      inputs:
        url: https://fixture.runx.invalid/source
        allowlist:
          - fixture.runx.invalid
        channel: "#incidents"
        principal: account:ops-bot
        operator_context: Public incident-summary planning; provider delivery remains separate.
      caller:
        http_exchanges:
          - request: { method: GET, url: "https://fixture.runx.invalid/source", body: none }
            response:
              status: 200
              headers: { content-type: text/plain }
              body: hello world
        answers:
          agent.redact-pii-detect.output:
            redaction_draft:
              decision: ready
              detected: []
              residual_risk:
                level: low
                reason_code: none
          agent.send-as.output:
            send_plan:
              decision: ready
              action_family: send-as
              principal:
                type: account
                ref: account:ops-bot
              provider:
                name: slack
                account_ref: workspace:incidents
                runtime_path: channel.post
              send_class: status
              channel: chat
              audience:
                type: channel
                ref: "#incidents"
                requires_reconfirmation: false
              content:
                draft_ref: governed-outbound:redacted-content
                digest: sha256:b94d27b9934d3e08a52e52d7da7dabfac484efe37a5380ee9088f7ace2efcde9
                subject_or_title: Example Domain update
              gates:
                preflight_required: true
                human_approval_required: true
                approval_ref: send-as.live-send.approval
              blockers: []
              provider_actions:
                - channel.post
              evidence_refs:
                - sha256:b94d27b9934d3e08a52e52d7da7dabfac484efe37a5380ee9088f7ace2efcde9
              success_checkpoint:
                milestone: provider_delivery_required
                description: Provider delivery and readback remain required after this plan.
      expect:
        status: sealed
        steps:
          - fetch-source
          - scrub-content
          - plan-notice
          - finalize
        step_outputs:
          finalize:
            subset:
              outbound_plan:
                decision: ready
                completion: plan_only
                provider_delivery: not_executed
                principal: account:ops-bot
                audience: "#incidents"
                redaction:
                  digest: sha256:b94d27b9934d3e08a52e52d7da7dabfac484efe37a5380ee9088f7ace2efcde9
                provider_actions:
                  - channel.post
        receipt:
          schema: runx.receipt.v1
    - name: governed-outbound-redaction-hold
      runner: plan
      inputs:
        url: https://fixture.runx.invalid/source
        allowlist:
          - fixture.runx.invalid
        channel: "#incidents"
        principal: account:ops-bot
      caller:
        http_exchanges:
          - request: { method: GET, url: "https://fixture.runx.invalid/source", body: none }
            response:
              status: 200
              headers: { content-type: text/plain }
              body: hello world
        answers:
          agent.redact-pii-detect.output:
            redaction_draft:
              decision: needs_review
              detected: []
              residual_risk:
                level: medium
                reason_code: ambiguous_semantics
      expect:
        status: policy_denied
        step_outputs:
          scrub-content:
            subset:
              redaction_report:
                data:
                  decision: needs_review
                  redacted_digest: null
    - name: governed-outbound-needs-target
      runner: plan
      inputs: {}
      expect:
        status: failure
runners:
  deliver:
    default: true
    inputs:
      url:
        type: string
        required: true
        description: Allowlisted source URL to fetch before outbound delivery.
      allowlist:
        type: json
        required: true
      channel:
        type: string
        required: true
        description: Exact provider-neutral audience or destination.
      principal:
        type: string
        required: true
        description: Principal the scrubbed content is sent as.
      operator_context:
        type: string
        required: false
      connector:
        type: object
        required: true
        description: Operator-selected provider and exact account, workspace, channel, campaign, or other bounded target; credentials remain runtime-owned.
        schema:
          required: [provider, target]
          additionalProperties: false
          properties:
            provider: { type: string, minLength: 1, maxLength: 100 }
            target: { type: string, minLength: 1, maxLength: 2048 }
    result_from: [send]
    steps:
      - id: fetch-source
        skill: ../web-fetch
        runner: web-fetch
        scopes: [web.read]
        inputs:
          url: $input.url
          allowlist: $input.allowlist
          extract: text
      - id: scrub-content
        skill: ../redact-pii
        runner: redact-pii
        scopes: [runx:content:read]
        inputs:
          mode: redact
        context:
          content: fetch-source.provider_operation.data.result.extracted
      - id: send
        when:
          field: scrub-content.redaction_report.data.decision
          equals: ready
        skill: ../send-as
        runner: send
        inputs:
          objective: Deliver the exact scrubbed outbound content and verify provider readback.
          principal: $input.principal
          audience: $input.channel
          operator_context: $input.operator_context
          connector: $input.connector
        context:
          content_ref: scrub-content.redaction_report.data

  plan:
    inputs:
      url:
        type: string
        required: true
        description: Source URL to gather before preparing the notification.
      allowlist:
        type: json
        required: true
        description: Hosts the fetch is permitted to reach.
      channel:
        type: string
        required: true
        description: Destination channel for the notification plan.
      principal:
        type: string
        required: true
        description: Principal the notification would be sent as.
      operator_context:
        type: string
        required: false
        description: Boundary, audience, or compliance context for the plan.
    result_from: [finalize]
    steps:
      - id: fetch-source
        label: gather the source
        skill: ../web-fetch
        runner: web-fetch
        scopes:
          - web.read
        inputs:
          url: $input.url
          allowlist: $input.allowlist
          extract: text
      - id: scrub-content
        label: scrub personal data before the boundary
        skill: ../redact-pii
        runner: redact-pii
        scopes:
          - runx:content:read
        inputs:
          mode: redact
        context:
          content: fetch-source.provider_operation.data.result.extracted
      - id: plan-notice
        label: prepare the governed notification plan
        skill: ../send-as
        runner: plan
        inputs:
          objective: Prepare the scrubbed update for a separate provider connector.
          principal: $input.principal
          audience: $input.channel
          provider_context: $input.operator_context
        context:
          content_ref: scrub-content.redaction_report.data
      - id: finalize
        label: validate and seal the plan-only handoff
        inputs:
          principal: $input.principal
          channel: $input.channel
        context:
          source: fetch-source.provider_operation.data.result
          redaction: scrub-content.redaction_report.data
          send_plan: plan-notice.send_plan.data
        tool: { module: governed-outbound.mjs }
        outputs:
          outbound_plan:
            type: object
            schema:
              required: [decision, completion, provider_delivery, principal, audience, source, redaction, provider_actions, send_plan]
              additionalProperties: false
              properties:
                decision: { const: ready }
                completion: { const: plan_only }
                provider_delivery: { const: not_executed }
                principal: { type: string, minLength: 1 }
                audience: { type: string, minLength: 1 }
                source:
                  type: object
                  required: [final_url, digest, fetched_at]
                  additionalProperties: false
                  properties:
                    final_url: { type: string, format: uri }
                    digest: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
                    fetched_at: { type: string }
                redaction:
                  type: object
                  required: [digest, source_digest]
                  additionalProperties: false
                  properties:
                    digest: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
                    source_digest: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
                provider_actions: { type: array, items: { type: string }, uniqueItems: true }
                send_plan:
                  type: object
                  required: [decision, principal, audience, content, success_checkpoint]
                  properties:
                    decision: { const: ready }
                    principal:
                      type: object
                      required: [ref]
                      properties: { ref: { type: string, minLength: 1 } }
                    audience:
                      type: object
                      required: [ref]
                      properties: { ref: { type: string, minLength: 1 } }
                    content:
                      type: object
                      required: [digest]
                      properties: { digest: { type: string, pattern: '^sha256:[0-9a-f]{64}$' } }
                    success_checkpoint:
                      type: object
                      required: [milestone]
                      properties: { milestone: { const: provider_delivery_required } }
                  additionalProperties: true
        artifacts:
          wrap_as: outbound_plan_packet
          packet: runx.governed_outbound.plan.v1
    policy:
      guards:
        - step: plan-notice
          field: scrub-content.redaction_report.data.decision
          equals: ready
        - step: finalize
          field: scrub-content.redaction_report.data.decision
          equals: ready
