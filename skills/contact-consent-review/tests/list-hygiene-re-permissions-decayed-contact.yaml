      subset:
        list_hygiene_result:
          decision:
            state: re_permission
          recorded_transition:
            recorded: true
            state: re_permission
            write_status: committed
            version: 1
          downstream_send:
            skill: null
            status: not_run
  receipt:
    schema: runx.receipt.v1
