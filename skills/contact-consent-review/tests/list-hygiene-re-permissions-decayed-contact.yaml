name: list-hygiene-re-permissions-decayed-contact
method: judge
inputs:
  data_source_uri: local://contact-consent-review/decay
  resource: contact_consent_events
  aggregate_id: contact:decay
  expected_version: 0
  idempotency_key: contact:decay:consent:v1
  engagement_evidence:
    hard_bounces: 0
    recency_days: 121
  hygiene_policy:
    hard_bounce_action: suppress
    decay_threshold_days: 90
  consent_evidence:
    state: subscribed
    active_unsubscribe_marker: false
    evidence_status: read
    evidence_version: 0
expect:
  status: sealed
  steps:
    - read-contact
    - decide
    - append-transition
    - readback
    - finalize-written
  step_outputs:
    finalize-written:
      subset:
        list_hygiene_result:
          data:
            decision:
              state: re_permission
            recorded_transition:
              recorded: true
              state: re_permission
              write_status: committed
              after_version: 1
            downstream_send:
              skill: null
              status: not_run
  receipt:
    schema: runx.receipt.v1
