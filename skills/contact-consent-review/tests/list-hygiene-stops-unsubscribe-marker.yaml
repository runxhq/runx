name: list-hygiene-stops-unsubscribe-marker
method: judge
inputs:
  data_source_uri: local://contact-consent-review/unsubscribed
  resource: contact_consent_events
  aggregate_id: contact:unsubscribed
  expected_version: 0
  idempotency_key: contact:unsubscribed:consent:v1
  engagement_evidence:
    hard_bounces: 0
    recency_days: 180
  hygiene_policy:
    hard_bounce_action: suppress
    decay_threshold_days: 90
  consent_evidence:
    state: unsubscribed
    active_unsubscribe_marker: true
    evidence_status: read
    evidence_version: 0
expect:
  status: sealed
  steps:
    - read-contact
    - decide
    - readback
    - finalize-unchanged
  step_outputs:
    finalize-unchanged:
      subset:
        list_hygiene_result:
          decision:
            state: human_review
          recorded_transition:
            recorded: false
            write_status: not_attempted
  receipt:
    schema: runx.receipt.v1
