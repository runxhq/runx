name: list-hygiene-stops-stale-evidence
method: judge
inputs:
  key: contact:stale
  expected_version: 0
  idempotency_key: contact:stale:consent:v1
  engagement_evidence:
    hard_bounces: 0
    recency_days: 180
  hygiene_policy:
    hard_bounce_action: suppress
    decay_threshold_days: 90
  consent_evidence:
    state: subscribed
    active_unsubscribe_marker: false
    evidence_status: stale
    evidence_version: 0
expect:
  status: sealed
  steps:
    - read-contact
    - decide
    - readback
    - finalize-unchanged
  step_outputs:
    finalize-unchanged:
      subset:
        list_hygiene_result:
          decision:
            state: human_review
          recorded_transition:
            recorded: false
            write_status: not_attempted
            version: 0
          escalation:
            lane: human:list-hygiene-reviewer
            status: required_before_any_write
  receipt:
    schema: runx.receipt.v1
