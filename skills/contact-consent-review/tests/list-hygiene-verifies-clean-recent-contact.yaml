name: list-hygiene-verifies-clean-recent-contact
method: judge
inputs:
  data_source_uri: local://contact-consent-review/current
  resource: contact_consent_events
  aggregate_id: contact:current
  expected_version: 0
  idempotency_key: contact:current:consent:v1
  engagement_evidence:
    hard_bounces: 0
    recency_days: 12
  hygiene_policy:
    hard_bounce_action: suppress
    decay_threshold_days: 90
  consent_evidence:
    state: subscribed
    active_unsubscribe_marker: false
    evidence_status: read
    evidence_version: 0
expect:
  status: sealed
  steps:
    - read-contact
    - decide
    - readback
    - finalize-unchanged
  step_outputs:
    finalize-unchanged:
      subset:
        list_hygiene_result:
          data:
            decision:
              state: verify
            recorded_transition:
              recorded: false
              state: null
              write_status: not_attempted
              after_version: 0
            escalation: null
  receipt:
    schema: runx.receipt.v1
