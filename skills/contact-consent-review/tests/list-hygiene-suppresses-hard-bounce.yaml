  aggregate_id: contact:hard-bounce
  expected_version: 0
  idempotency_key: contact:hard-bounce:consent:v1
  engagement_evidence:
    hard_bounces: 1
    recency_days: 12
  hygiene_policy:
    hard_bounce_action: suppress
    decay_threshold_days: 90
  consent_evidence:
    state: subscribed
    active_unsubscribe_marker: false
