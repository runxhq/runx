version: 0.1.11
minimum_runx: 0.12.0
catalog:
  visibility: public
  category: growth
shared_inputs:
  key:
    type: string
    description: Stable contact key in the skill's own consent stream.
    minLength: 1
    maxLength: 192
    pattern: ^[A-Za-z0-9][A-Za-z0-9._:@/-]*$
  expected_version:
    type: integer
    description: Consent-ledger version observed with the supplied evidence.
    minimum: 0
  idempotency_key:
    type: string
    description: Stable retry identity for this exact intended consent transition.
    minLength: 8
    maxLength: 256
    pattern: ^[A-Za-z0-9._:-]+$
  engagement_evidence:
    type: object
    description: Bounded current engagement and bounce observation.
    additionalProperties: false
    required:
      - hard_bounces
      - recency_days
    properties:
      hard_bounces:
        type: integer
        minimum: 0
        maximum: 1000000000
      recency_days:
        type: integer
        minimum: 0
        maximum: 36500
  hygiene_policy:
    type: object
    description: Exact hard-bounce action and engagement-decay threshold.
    additionalProperties: false
    required:
      - hard_bounce_action
      - decay_threshold_days
    properties:
      hard_bounce_action:
        type: string
        enum:
          - suppress
          - human_review
      decay_threshold_days:
        type: integer
        minimum: 1
        maximum: 3650
  consent_evidence:
    type: object
    description: Current bounded consent observation aligned to the ledger version.
    additionalProperties: false
    required:
      - state
      - active_unsubscribe_marker
      - evidence_status
      - evidence_version
    properties:
      state:
        type: string
        enum:
          - subscribed
          - re_permission
          - suppress
          - unsubscribed
      active_unsubscribe_marker:
        type: boolean
      evidence_status:
        type: string
        enum:
          - read
          - missing
          - unreadable
          - stale
          - ambiguous
      evidence_version:
        type: integer
        minimum: 0
methods:
  judge:
    inputs:
      key: {}
      expected_version: {}
      idempotency_key: {}
      engagement_evidence: {}
      hygiene_policy: {}
      consent_evidence: {}
    examples:
      - key: contact:example
        expected_version: 0
        idempotency_key: contact:example:consent:v1
        engagement_evidence:
          hard_bounces: 0
          recency_days: 12
        hygiene_policy:
          hard_bounce_action: suppress
          decay_threshold_days: 90
        consent_evidence:
          state: subscribed
          active_unsubscribe_marker: false
          evidence_status: read
          evidence_version: 0
    result_from:
      - finalize-written
      - finalize-unchanged
    steps:
      - id: read-contact
        operation: store/events.read
        inputs:
          stream: consent
          key: $input.key
          limit: 1
      - id: decide
        inputs:
          key: $input.key
          expected_version: $input.expected_version
          engagement_evidence: $input.engagement_evidence
          hygiene_policy: $input.hygiene_policy
          consent_evidence: $input.consent_evidence
          contact_readback: $steps.read-contact.provider_operation.result
        tool:
          module: contact-consent-review.mjs
          export: decideListHygiene
        outputs:
          decision_plan:
            type: object
            additionalProperties: false
            required:
              - key
              - expected_version
              - observed_state
              - version
              - decision
              - reason_code
              - append_allowed
              - event
              - observed_state_source
            properties:
              key:
                type: string
              expected_version:
                type: integer
                minimum: 0
              observed_state:
                type: string
                enum:
                  - subscribed
                  - re_permission
                  - suppress
                  - unsubscribed
              version:
                type: integer
                minimum: 0
              decision:
                type: object
                additionalProperties: false
                required:
                  - state
                  - reason
                properties:
                  state:
                    type: string
                    enum:
                      - verify
                      - re_permission
                      - suppress
                      - human_review
                  reason:
                    type: string
                    minLength: 1
                    maxLength: 1000
              reason_code:
                type: string
                minLength: 1
                maxLength: 100
              append_allowed:
                type: boolean
              event:
                type:
                  - object
                  - "null"
                additionalProperties: false
                required:
                  - type
                  - from_state
                  - new_state
                  - reason
                  - evidence
                  - evidence_version
                properties:
                  type:
                    const: list_hygiene.consent_transitioned
                  from_state:
                    type: string
                    enum:
                      - subscribed
                      - re_permission
                      - suppress
                      - unsubscribed
                  new_state:
                    type: string
                    enum:
                      - re_permission
                      - suppress
                  reason:
                    type: string
                    minLength: 1
                    maxLength: 1000
                  evidence:
                    type: object
                    additionalProperties: false
                    properties:
                      hard_bounces:
                        type: integer
                        minimum: 0
                      hard_bounce_action:
                        type: string
                        enum:
                          - suppress
                          - human_review
                      recency_days:
                        type: integer
                        minimum: 0
                      decay_threshold_days:
                        type: integer
                        minimum: 1
                  evidence_version:
                    type: integer
                    minimum: 0
              observed_state_source:
                enum:
                  - supplied_evidence
                  - native_record
      - id: append-transition
        when:
          value: $steps.decide.decision_plan.append_allowed
          equals: true
        operation: store/events.append
        idempotency_key: $input.idempotency_key
        approval:
          reason: Record this consent transition for the contact. It decides whether they can be sent to.
          type: consent_transition
        inputs:
          stream: consent
          key: $input.key
          expected_version: $input.expected_version
          type: list_hygiene.consent_transitioned
          data: $steps.decide.decision_plan.event
      - id: finalize-written
        when:
          value: $steps.decide.decision_plan.append_allowed
          equals: true
        inputs:
          decision_plan: $steps.decide.decision_plan
          observed_contact: $steps.read-contact.provider_operation
          record: $steps.append-transition.provider_operation
        tool:
          module: contact-consent-review.mjs
          export: finalizeListHygiene
        outputs:
          list_hygiene_result:
            type: object
            packet: runx/contact-consent-review.decision.v1
      - id: finalize-unchanged
        when:
          value: $steps.decide.decision_plan.append_allowed
          equals: false
        inputs:
          decision_plan: $steps.decide.decision_plan
          observed_contact: $steps.read-contact.provider_operation
          record: null
        tool:
          module: contact-consent-review.mjs
          export: finalizeListHygiene
        outputs:
          list_hygiene_result:
            type: object
            packet: runx/contact-consent-review.decision.v1
