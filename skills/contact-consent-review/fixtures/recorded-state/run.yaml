minimum_runx: 0.12.0
catalog:
  visibility: internal
methods:
  run:
    steps:
      - id: record-suppression
        skill: ../..#judge
        inputs:
          key: contact:recorded-state
          expected_version: 0
          idempotency_key: recorded-state-v1
          engagement_evidence:
            hard_bounces: 1
            recency_days: 12
          hygiene_policy:
            hard_bounce_action: suppress
            decay_threshold_days: 90
          consent_evidence:
            state: subscribed
            active_unsubscribe_marker: false
            evidence_status: read
            evidence_version: 0
      - id: review-again
        skill: ../..#judge
        inputs:
          key: contact:recorded-state
          expected_version: 1
          idempotency_key: recorded-state-v2
          engagement_evidence:
            hard_bounces: 0
            recency_days: 1
          hygiene_policy:
            hard_bounce_action: suppress
            decay_threshold_days: 90
          consent_evidence:
            state: subscribed
            active_unsubscribe_marker: false
            evidence_status: read
            evidence_version: 1
