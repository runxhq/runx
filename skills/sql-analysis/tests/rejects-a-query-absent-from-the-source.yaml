name: rejects-a-query-absent-from-the-source
method: plan
inputs:
  question: Which campaigns produced qualified trials since 2026-10-01?
  source: analytics:production
  max_rows: 100
  catalog:
    source: analytics:production
    dialect: postgres
    status: catalog
    executed: false
    max_rows: 50
    queries:
    - id: qualified_trials_by_campaign
      description: Rank campaigns by qualified trials since a supplied date.
      parameters_schema:
        type: object
        additionalProperties: false
        required:
        - since
        properties:
          since:
            type: string
            pattern: ^2026-10-[0-9]{2}$
      result_description: Campaign and qualified-trial count; missing campaign is unattributed, not causal attribution.
host:
  answers:
    choose:
      choice:
        decision: ready
        query_id: invented_query
        parameters:
          since: '2026-10-01'
        reason: The declared query ranks qualified trials for the requested period.
        missing_context: []
expect:
  status: sealed
  steps:
  - choose
  - bind
  - validate
  - finalize
  step_outputs:
    finalize:
      subset:
        sql_analysis_plan:
          decision: no_suitable_query
          executed: false
  receipt:
    schema: runx.receipt.v1
