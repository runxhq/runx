name: sql-analysis-default-reads-the-selected-query
setup:
  credentials:
  - sql
inputs:
  question: Which campaigns produced qualified trials since 2026-10-01?
  source: analytics:fixture
  max_rows: 2
env:
  RUNX_SQL_CONNECTION: fixture-only-source-binding
host:
  answers:
    choose:
      choice:
        decision: ready
        query_id: trials_by_campaign
        parameters:
          since: '2026-10-01'
        reason: The declared read counts qualified trials in the requested period.
        missing_context: []
    interpret:
      interpretation:
        answer: Launch has two qualified trials and Docs has one in the returned rows.
        observations:
        - The query returned campaign-associated trial counts.
        caveats:
        - The row ceiling excludes at least one additional campaign.
        - Association does not establish causal attribution.
providers:
  processes:
  - tool: sql.read
    arguments:
      action: catalog
      source: analytics:fixture
    result:
      source: analytics:fixture
      dialect: sqlite
      status: catalog
      executed: false
      max_rows: 2
      queries:
      - id: trials_by_campaign
        description: Count qualified trials by campaign since a supplied date.
        parameters_schema:
          type: object
          additionalProperties: false
          required:
          - since
          properties:
            since:
              type: string
              pattern: ^2026-10-[0-9]{2}$
        result_description: Qualified-trial counts by associated campaign; this is not causal attribution.
  - tool: sql.read
    arguments:
      action: query
      source: analytics:fixture
      query_id: trials_by_campaign
      parameters:
        since: '2026-10-01'
      max_rows: 2
    result:
      source: analytics:fixture
      dialect: sqlite
      status: executed
      executed: true
      query_id: trials_by_campaign
      columns:
      - campaign
      - qualified_trials
      rows:
      - - launch
        - 2
      - - docs
        - 1
      returned_rows: 2
      max_rows: 2
      truncated: true
      result_description: Qualified-trial counts by associated campaign; this is not causal attribution.
      observed_at: '2026-10-17T00:00:00Z'
      duration_ms: 1
expect:
  status: sealed
  steps:
  - catalog
  - plan
  - query
  - interpret
  - finish
  step_outputs:
    query:
      subset:
        provider_operation:
          data:
            result:
              status: executed
              query_id: trials_by_campaign
              columns:
              - campaign
              - qualified_trials
              rows:
              - - launch
                - 2
              - - docs
                - 1
              truncated: true
    finish:
      subset:
        analysis_result:
          decision: answered
          executed: true
  receipt:
    schema: runx.receipt.v1
