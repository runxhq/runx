version: "0.4.9"
minimum_runx: 0.12.0
default_method: analyst
catalog:
  visibility: public
  category: data
methods:
  analyst:
    description: Answer a data question by choosing a declared parameterized SQL read, running it, and interpreting the rows it returns.
    inputs:
      question:
        type: string
        description: A bounded data question with the business context and explicit dates needed to choose parameter values.
        minLength: 1
        maxLength: 8000
      source:
        type: string
        description: Exact logical source target bound to the selected local SQL connector instance.
        pattern: ^[A-Za-z0-9][A-Za-z0-9._:/-]{0,191}$
      max_rows:
        type: integer
        default: 100
        minimum: 1
        maximum: 1000
        optional: true
    result_from:
    - stopped
    - finish
    examples:
    - question: Which campaigns produced the most qualified trials since 2026-10-01?
      source: analytics
    steps:
    - id: catalog
      operation: sql/catalog.read
      inputs:
        action: catalog
        source: $input.source
    - id: plan
      skill: .#plan
      inputs:
        question: $input.question
        source: $input.source
        max_rows: $input.max_rows
        catalog: $steps.catalog.provider_operation.result
    - id: stopped
      when:
        value: $steps.plan.sql_analysis_plan.decision
        not_equals: ready
      tool:
        module: sql-analysis.mjs
        export: stopped
      inputs:
        plan: $steps.plan.sql_analysis_plan
      outputs:
        analysis_result: {type: object}
    - id: query
      when:
        value: $steps.plan.sql_analysis_plan.decision
        equals: ready
      operation: sql/query.read
      inputs:
        action: query
        source: $input.source
        query_id: $steps.plan.sql_analysis_plan.query_id
        parameters: $steps.plan.sql_analysis_plan.parameters
        max_rows: $steps.plan.sql_analysis_plan.max_rows
    - id: interpret
      when:
        value: $steps.plan.sql_analysis_plan.decision
        equals: ready
      agent: sql-interpret
      inputs:
        question: $input.question
        plan: $steps.plan.sql_analysis_plan
        provider_operation: $steps.query.provider_operation
      outputs:
        interpretation:
          type: object
          additionalProperties: false
          required:
          - answer
          - observations
          - caveats
          properties:
            answer:
              type: string
              minLength: 1
              maxLength: 12000
            observations:
              type: array
              maxItems: 32
              items:
                type: string
                maxLength: 4000
            caveats:
              type: array
              maxItems: 32
              items:
                type: string
                maxLength: 4000
    - id: finish
      when:
        value: $steps.plan.sql_analysis_plan.decision
        equals: ready
      tool:
        module: sql-analysis.mjs
        export: finish
      inputs:
        question: $input.question
        plan: $steps.plan.sql_analysis_plan
        provider_operation: $steps.query.provider_operation
        interpretation: $steps.interpret.interpretation
      outputs:
        analysis_result: {type: object}
  plan:
    description: Plan the read for a question against a query catalog you supply, without running it.
    inputs:
      question:
        type: string
        description: A bounded data question with the business context and explicit dates needed to choose parameter values.
        minLength: 1
        maxLength: 8000
      source:
        type: string
        description: Exact logical source target bound to the selected local SQL connector instance.
        pattern: ^[A-Za-z0-9][A-Za-z0-9._:/-]{0,191}$
      max_rows:
        type: integer
        default: 100
        minimum: 1
        maximum: 1000
        optional: true
      catalog:
        type: object
        description: Already supplied source query catalog. Its metadata is caller context, not proof of database access.
        additionalProperties: false
        required:
        - source
        - dialect
        - status
        - executed
        - max_rows
        - queries
        properties:
          source:
            type: string
            pattern: ^[A-Za-z0-9][A-Za-z0-9._:/-]{0,191}$
          dialect:
            type: string
            minLength: 1
            maxLength: 64
          status:
            const: catalog
          executed:
            const: false
          max_rows:
            type: integer
            minimum: 1
            maximum: 1000
          queries:
            type: array
            maxItems: 64
            items:
              type: object
              additionalProperties: false
              required:
              - id
              - description
              - parameters_schema
              - result_description
              properties:
                id:
                  type: string
                  pattern: ^[A-Za-z0-9][A-Za-z0-9._:/-]{0,191}$
                description:
                  type: string
                  maxLength: 4000
                parameters_schema:
                  type: object
                  additionalProperties: true
                result_description:
                  type: string
                  maxLength: 4000
            minItems: 1
    result_from:
    - finalize
    steps:
    - id: choose
      agent: sql-select-query
      inputs:
        question: $input.question
        source: $input.source
        catalog: $input.catalog
        max_rows: $input.max_rows
      outputs:
        choice:
          type: object
          additionalProperties: false
          required:
          - decision
          - query_id
          - parameters
          - reason
          - missing_context
          properties:
            decision:
              enum:
              - ready
              - no_suitable_query
            query_id:
              type: string
              maxLength: 192
            parameters:
              type: object
              additionalProperties: true
              maxProperties: 64
            reason:
              type: string
              minLength: 1
              maxLength: 4000
            missing_context:
              type: array
              maxItems: 16
              items:
                type: string
                maxLength: 1000
    - id: bind
      tool:
        module: sql-analysis.mjs
        export: bindChoice
      inputs:
        question: $input.question
        source: $input.source
        catalog: $input.catalog
        choice: $steps.choose.choice
        max_rows: $input.max_rows
      outputs:
        candidate: {type: object}
        parameters_schema: {type: object}
        parameters: {type: object}
    - id: validate
      tool: data.validate
      inputs:
        schema: $steps.bind.parameters_schema
        values:
        - $steps.bind.parameters
    - id: finalize
      tool:
        module: sql-analysis.mjs
        export: finalizePlan
      inputs:
        candidate: $steps.bind.candidate
        validation: $steps.validate.validation
      outputs:
        sql_analysis_plan:
          type: object
          packet: runx/sql-analysis.plan.v1
