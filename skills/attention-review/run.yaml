version: "0.4.14"
minimum_runx: 0.12.0
catalog:
  visibility: public
  category: ops

methods:
  review:
    inputs:
      objective:
        type: string
        description: Bounded operator objective for this review.
        minLength: 1
        maxLength: 500
      as_of:
        type: string
        description: Explicit evaluation time.
        format: date-time
      evidence:
        type: array
        description: Up to twenty normalized observations from already completed source skills.
        maxItems: 20
        items:
          type: object
          required: [source_id, source_digest, source_kind, observed_at, summary]
          additionalProperties: false
          properties:
            source_id: {"type": "string", "minLength": 1, "maxLength": 300, "pattern": "\\S"}
            source_digest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
            thread_locator: {type: string, minLength: 1, maxLength: 1000}
            source_kind: {type: string, enum: [mail, chat, task, other]}
            observed_at: {type: string, format: date-time}
            summary: {"type": "string", "minLength": 1, "maxLength": 1000, "pattern": "\\S"}
      current_actions:
        type: array
        description: Current states for admitted source references.
        maxItems: 20
        items:
          type: object
          required: [source_id, state]
          additionalProperties: false
          properties:
            source_id: {"type": "string", "minLength": 1, "maxLength": 300, "pattern": "\\S"}
            state: {type: string, enum: [open, waiting, followed_up, resolved, dismissed]}
      allowed_action_ids:
        type: array
        description: Exact configured roster entries available for proposal, not execution authority.
        maxItems: 10
        uniqueItems: true
        items: {"type": "string", "minLength": 1, "maxLength": 100, "pattern": "\\S"}
      work_routes:
        type: array
        description: Exact configured goal and skill/runner roster with admitted input schemas and fixed scope inputs.
        maxItems: 16
        items:
          type: object
          required: [route_id]
          properties:
            route_id:
              type: string
              minLength: 1
              maxLength: 64
              pattern: \S
            source_id:
              type: string
              minLength: 1
              maxLength: 300
              pattern: \S
            source_digest:
              type: string
              pattern: ^sha256:[0-9a-f]{64}$
            target_locator:
              type: string
              minLength: 1
              maxLength: 1000
            source_kinds:
              type: array
              items:
                type: string
                enum:
                  - mail
                  - chat
                  - task
                  - other
            fixed_inputs:
              type: object
              additionalProperties: true
            source_context_input:
              type: string
              minLength: 1
          additionalProperties: true
        optional: true
      work_results:
        type: array
        description: Receipt-backed non-mutating results projected by the local host; context, not authority.
        maxItems: 20
        items:
          type: object
          required: [source_id, source_digest, route_id, target_locator, kind, status, summary, source_complete, checked_at, receipt]
          additionalProperties: false
          properties:
            source_id: {type: string, minLength: 1, maxLength: 300}
            source_digest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
            route_id: {type: string, minLength: 1, maxLength: 64}
            target_locator: {type: string, minLength: 1, maxLength: 300}
            kind: {type: string, minLength: 1, maxLength: 64}
            status: {type: string, minLength: 1, maxLength: 64}
            summary: {type: string, minLength: 1, maxLength: 1000}
            source_complete: {type: boolean}
            checked_at: {type: string, format: date-time}
            receipt: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
        optional: true
      min_check_minutes:
        type: integer
        description: Operator's minimum next-check delay.
        minimum: 1
        maximum: 1440
      max_check_minutes:
        type: integer
        description: Operator's maximum next-check delay.
        minimum: 1
        maximum: 1440
    examples:
      - objective: Check new personal observations.
        as_of: "2026-10-02T10:00:00Z"
        evidence: [{source_id: mail-thread-1, source_digest: 'sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa', source_kind: mail, observed_at: '2026-10-02T09:55:00Z', summary: A colleague asks for a decision.}]
        current_actions: []
        allowed_action_ids: [private_update]
        min_check_minutes: 15
        max_check_minutes: 60
    result_from: [finalize]
    steps:
      - id: judge
        agent: attention-review-review
        outputs:
          draft:
            type: object
            additionalProperties: false
            required:
              - decision
              - items
              - recommended_action_ids
              - next_check_minutes
            properties:
              decision:
                enum:
                  - brief
                  - idle
              items:
                type: array
                maxItems: 5
                items:
                  type: object
                  additionalProperties: false
                  required:
                    - source_id
                    - priority
                  properties:
                    source_id:
                      type: string
                      minLength: 1
                      maxLength: 300
                      pattern: \S
                    priority:
                      type: string
                      enum:
                        - high
                        - medium
                        - low
              recommended_action_ids:
                type: array
                maxItems: 10
                items:
                  type: string
                  minLength: 1
                  maxLength: 100
                  pattern: \S
              work_proposals:
                type: array
                maxItems: 3
                items:
                  type: object
                  additionalProperties: false
                  required:
                    - source_id
                    - route_id
                    - target_locator
                    - inputs
                    - due_at_unix_seconds
                  properties:
                    source_id:
                      type: string
                      minLength: 1
                      maxLength: 300
                      pattern: \S
                    route_id:
                      type: string
                      minLength: 1
                      maxLength: 64
                      pattern: \S
                    target_locator:
                      type: string
                      minLength: 1
                      maxLength: 1000
                    inputs:
                      type: object
                      additionalProperties: true
                    due_at_unix_seconds:
                      type: integer
                      minimum: 0
                      maximum: 9007199254740991
              next_check_minutes:
                type: integer
        inputs:
          objective: $input.objective
          as_of: $input.as_of
          evidence: $input.evidence
          current_actions: $input.current_actions
          allowed_action_ids: $input.allowed_action_ids
          work_routes: $input.work_routes
          work_results: $input.work_results
          min_check_minutes: $input.min_check_minutes
          max_check_minutes: $input.max_check_minutes
      - id: finalize
        inputs:
          as_of: $input.as_of
          evidence: $input.evidence
          current_actions: $input.current_actions
          allowed_action_ids: $input.allowed_action_ids
          work_routes: $input.work_routes
          min_check_minutes: $input.min_check_minutes
          max_check_minutes: $input.max_check_minutes
          draft: $steps.judge.draft
        tool: {module: attention-review.mjs, export: finalizeAttention}
        outputs:
          attention_packet:
            type: object
            additionalProperties: false
            required:
              - decision
              - items
              - recommended_action_ids
              - work_proposals
              - brief
              - next_check_minutes
              - delivery_status
              - validation
            properties:
              decision:
                enum:
                  - held
                  - ready
                  - idle
              items:
                type: array
                maxItems: 5
                items:
                  type: object
                  additionalProperties: false
                  required:
                    - source_id
                    - source_digest
                    - source_kind
                    - priority
                    - summary
                  properties:
                    source_id:
                      type: string
                      minLength: 1
                      maxLength: 300
                      pattern: \S
                    source_digest:
                      type: string
                      pattern: ^sha256:[0-9a-f]{64}$
                    source_kind:
                      type: string
                      enum:
                        - mail
                        - chat
                        - task
                        - other
                    priority:
                      type: string
                      enum:
                        - high
                        - medium
                        - low
                    summary:
                      type: string
                      minLength: 1
                      maxLength: 1000
                      pattern: \S
              recommended_action_ids:
                type: array
                maxItems: 10
                items:
                  type: string
                  minLength: 1
                  maxLength: 100
                  pattern: \S
              work_proposals:
                type: array
                maxItems: 3
                items:
                  type: object
                  additionalProperties: false
                  required:
                    - source_id
                    - route_id
                    - target_locator
                    - inputs
                    - due_at_unix_seconds
                    - source_digest
                  properties:
                    source_id:
                      type: string
                      minLength: 1
                      maxLength: 300
                      pattern: \S
                    route_id:
                      type: string
                      minLength: 1
                      maxLength: 64
                      pattern: \S
                    target_locator:
                      type: string
                      minLength: 1
                      maxLength: 1000
                    inputs:
                      type: object
                      additionalProperties: true
                    due_at_unix_seconds:
                      type: integer
                      minimum: 0
                      maximum: 9007199254740991
                    source_digest:
                      type: string
                      pattern: ^sha256:[0-9a-f]{64}$
              brief:
                type: string
              next_check_minutes:
                type:
                  - integer
                  - "null"
                minimum: 1
                maximum: 1440
              delivery_status:
                const: not_sent
              validation:
                type: object
                additionalProperties: false
                required:
                  - status
                  - findings
                  - omitted_unconfigured_actions
                  - omitted_unconfigured_work
                properties:
                  status:
                    enum:
                      - pass
                      - fail
                  findings:
                    type: array
                    items:
                      type: string
                      minLength: 1
                  omitted_unconfigured_actions:
                    type: integer
                    minimum: 0
                    maximum: 10
                  omitted_unconfigured_work:
                    type: integer
                    minimum: 0
                    maximum: 3
