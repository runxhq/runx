skill: attention-review
version: "0.4.14"
catalog:
  kind: graph
  audience: operator
  visibility: public
  category: ops
  role: context
  execution: read
  completion: runtime_receipt
  approval: none

harness:
  files: [fixtures/support/composed.graph]
  cases:
    - name: attention-review-selects-bounded-attention
      operator_journeys:
        - mode: standalone
          confusors: [operations-review, conversation-review]
          request: Decide whether these new personal mailbox and chat observations warrant a private update.
          expected_outcome: Return source-bound attention and an undelivered private brief intent.
        - mode: composed
          request: Reassess the already collected observations and current action states.
          expected_outcome: Reuse supplied evidence without rereading providers or sending a message.
          prior_evidence:
            - The bounded mailbox and chat observations supplied in the fixture.
          must_not_repeat:
            - Do not query either provider again.
            - Do not repost an earlier notification.
      inputs:
        objective: Check new personal observations.
        as_of: "2026-10-02T10:00:00.123456Z"
        evidence:
          - source_id: mail-thread-1
            source_digest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
            source_kind: mail
            observed_at: "2026-10-02T09:55:00Z"
            summary: A colleague asks for a decision on the release note.
        current_actions: []
        allowed_action_ids: [private_update]
        min_check_minutes: 15
        max_check_minutes: 60
      caller:
        answers:
          judge:
            draft:
              decision: brief
              items: [{ source_id: mail-thread-1, priority: high }]
              recommended_action_ids: [private_update]
              next_check_minutes: 20
      expect:
        status: sealed
        steps: [judge, finalize]
        step_outputs:
          finalize:
            subset:
              attention_packet:
                data:
                  decision: ready
                  next_check_minutes: 20
                  delivery_status: not_sent
                  validation: { status: pass }
        receipt: { schema: runx.receipt.v1 }

    - name: attention-review-omits-unconfigured-action
      inputs:
        objective: Check new personal observations without an authorized delivery action.
        as_of: "2026-10-02T10:00:00Z"
        evidence:
          - source_id: mail-1
            source_digest: sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
            thread_locator: https://github.com/example/project/pull/12
            source_kind: mail
            observed_at: "2026-10-02T09:55:00Z"
            summary: A colleague asks for a decision.
        current_actions: [{ source_id: mail-1, state: open }]
        allowed_action_ids: []
        work_routes:
          - { source_id: mail-1, source_digest: 'sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc', route_id: pr_status, target_locator: 'https://github.com/example/project/pull/12' }
        min_check_minutes: 15
        max_check_minutes: 60
      caller:
        answers:
          judge:
            draft:
              decision: idle
              items: [{ source_id: mail-1, priority: high }]
              recommended_action_ids: [private_update]
              work_proposals: [{ source_id: mail-1, route_id: conversation, target_locator: mail-thread-1, inputs: {}, due_at_unix_seconds: 0 }]
              next_check_minutes: 20
      expect:
        status: sealed
        steps: [judge, finalize]
        step_outputs:
          finalize:
            subset:
              attention_packet:
                data:
                  decision: ready
                  recommended_action_ids: []
                  work_proposals: []
                  validation: { status: pass, omitted_unconfigured_actions: 1, omitted_unconfigured_work: 1 }
        receipt: { schema: runx.receipt.v1 }

    - name: attention-review-proposes-exact-work
      inputs:
        objective: Check new personal observations.
        as_of: "2026-10-02T10:00:00Z"
        evidence:
          - source_id: chat-1
            source_digest: sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
            thread_locator: https://github.com/example/project/pull/12
            source_kind: chat
            observed_at: "2026-10-02T09:55:00Z"
            summary: A colleague requests review of a pull request.
        current_actions: [{ source_id: chat-1, state: open }]
        allowed_action_ids: []
        work_routes:
          - { source_id: chat-1, source_digest: 'sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb', route_id: pr_status, target_locator: 'https://github.com/example/project/pull/12' }
        min_check_minutes: 15
        max_check_minutes: 60
      caller:
        answers:
          judge:
            draft:
              decision: brief
              items: [{ source_id: chat-1, priority: medium }]
              recommended_action_ids: []
              work_proposals: [{ source_id: chat-1, route_id: pr_status, target_locator: 'https://github.com/example/project/pull/12', inputs: {}, due_at_unix_seconds: 0 }]
              next_check_minutes: 20
      expect:
        status: sealed
        steps: [judge, finalize]
        step_outputs:
          finalize:
            subset:
              attention_packet:
                data:
                  decision: ready
                  work_proposals:
                    - { source_id: chat-1, source_digest: 'sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb', route_id: pr_status, target_locator: 'https://github.com/example/project/pull/12' }
                  validation: { status: pass }
        receipt: { schema: runx.receipt.v1 }

    - name: attention-review-uses-verified-work-result
      inputs:
        objective: Reassess the observed request using a verified pull-request status.
        as_of: "2026-10-02T10:05:00Z"
        evidence:
          - source_id: chat-1
            source_digest: sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
            thread_locator: https://github.com/example/project/pull/12
            source_kind: chat
            observed_at: "2026-10-02T09:55:00Z"
            summary: A colleague asks to review a pull request.
        current_actions: [{ source_id: chat-1, state: open }]
        allowed_action_ids: []
        work_routes: []
        work_results:
          - { source_id: chat-1, source_digest: 'sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb', route_id: pr_status, target_locator: 'https://github.com/example/project/pull/12', kind: github_pr_status, status: closed, summary: 'Pull request closed: Example change', source_complete: true, checked_at: '2026-10-02T10:04:00Z', receipt: 'sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa' }
        min_check_minutes: 15
        max_check_minutes: 60
      caller:
        answers:
          judge:
            draft:
              decision: idle
              items: []
              recommended_action_ids: []
              work_proposals: []
              next_check_minutes: 60
      expect:
        status: sealed
        steps: [judge, finalize]
        step_outputs:
          finalize:
            subset:
              attention_packet:
                data:
                  decision: idle
                  work_proposals: []
                  validation: { status: pass }
        receipt: { schema: runx.receipt.v1 }

    - name: attention-review-holds-invented-work
      inputs:
        objective: Check new personal observations.
        as_of: "2026-10-02T10:00:00Z"
        evidence:
          - source_id: chat-1
            source_digest: sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
            thread_locator: https://github.com/example/project/pull/13
            source_kind: chat
            observed_at: "2026-10-02T09:55:00Z"
            summary: A colleague requests review of a pull request.
        current_actions: [{ source_id: chat-1, state: open }]
        allowed_action_ids: []
        work_routes:
          - { source_id: chat-1, source_digest: 'sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb', route_id: pr_status, target_locator: 'https://github.com/example/project/pull/13' }
        min_check_minutes: 15
        max_check_minutes: 60
      caller:
        answers:
          judge:
            draft:
              decision: brief
              items: [{ source_id: chat-1, priority: medium }]
              recommended_action_ids: []
              work_proposals: [{ source_id: chat-1, route_id: pr_status, target_locator: 'https://github.com/example/project/pull/12', inputs: {}, due_at_unix_seconds: 0 }]
              next_check_minutes: 20
      expect:
        status: sealed
        steps: [judge, finalize]
        step_outputs:
          finalize:
            subset:
              attention_packet:
                data:
                  decision: held
                  validation: { status: fail }
        receipt: { schema: runx.receipt.v1 }

    - name: attention-review-holds-invented-source
      inputs:
        objective: Check new personal observations.
        as_of: "2026-10-02T10:00:00Z"
        evidence:
          - source_id: chat-1
            source_digest: sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
            source_kind: chat
            observed_at: "2026-10-02T09:55:00Z"
            summary: A routine status update.
        current_actions: []
        allowed_action_ids: [private_update]
        min_check_minutes: 15
        max_check_minutes: 60
      caller:
        answers:
          judge:
            draft:
              decision: brief
              items: [{ source_id: invented, priority: high }]
              recommended_action_ids: [private_update]
              next_check_minutes: 20
      expect:
        status: sealed
        steps: [judge, finalize]
        step_outputs:
          finalize:
            subset:
              attention_packet:
                data:
                  decision: held
                  delivery_status: not_sent
                  validation: { status: fail }
        receipt: { schema: runx.receipt.v1 }

    - name: attention-review-preserves-inbox-state
      inputs:
        objective: Check new personal observations.
        as_of: "2026-10-02T10:00:00Z"
        evidence:
          - source_id: mail-thread-1
            source_digest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
            source_kind: mail
            observed_at: "2026-10-02T09:55:00Z"
            summary: A colleague asks for a decision on the release note.
        current_actions: [{ source_id: mail-thread-1, state: waiting }]
        allowed_action_ids: [private_update]
        min_check_minutes: 15
        max_check_minutes: 60
      caller:
        answers:
          judge:
            draft:
              decision: brief
              items: [{ source_id: mail-thread-1, priority: high }]
              recommended_action_ids: [private_update]
              next_check_minutes: 20
      expect:
        status: sealed
        steps: [judge, finalize]
        step_outputs:
          finalize:
            subset:
              attention_packet:
                data:
                  decision: held
                  delivery_status: not_sent
                  validation: { status: fail }
        receipt: { schema: runx.receipt.v1 }

    - name: holds-work-for-a-different-bound-occurrence
      inputs:
        objective: Check new personal observations.
        as_of: 2026-10-02T10:00:00Z
        evidence:
          - source_id: chat-other
            source_digest: sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
            thread_locator: https://github.com/example/project/pull/99
            source_kind: chat
            observed_at: 2026-10-02T09:55:00Z
            summary: A colleague requests review of a pull request.
        current_actions:
          - source_id: chat-other
            state: open
        allowed_action_ids: []
        work_routes:
          - source_id: chat-1
            source_digest: sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
            route_id: pr_status
            target_locator: https://github.com/example/project/pull/12
        min_check_minutes: 15
        max_check_minutes: 60
      caller:
        answers:
          judge:
            draft:
              decision: brief
              items:
                - source_id: chat-other
                  priority: high
              recommended_action_ids: []
              work_proposals:
                - source_id: chat-other
                  route_id: pr_status
                  target_locator: https://github.com/example/project/pull/99
                  inputs: {}
                  due_at_unix_seconds: 0
              next_check_minutes: 20
      expect:
        status: sealed
        step_outputs:
          finalize:
            subset:
              attention_packet:
                data:
                  decision: held
                  work_proposals: []
                  validation:
                    status: fail

runners:
  review:
    default: true
    inputs:
      objective:
        type: string
        required: true
        description: Bounded operator objective for this review.
        schema: { minLength: 1, maxLength: 500 }
      as_of:
        type: string
        required: true
        description: Explicit evaluation time.
        schema: { format: date-time }
      evidence:
        type: array
        required: true
        description: Up to twenty normalized observations from already completed source skills.
        schema:
          maxItems: 20
          items:
            type: object
            required: [source_id, source_digest, source_kind, observed_at, summary]
            additionalProperties: false
            properties:
              source_id: {"type":"string","minLength":1,"maxLength":300,"pattern":"\\S"}
              source_digest: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
              thread_locator: { type: string, minLength: 1, maxLength: 1000 }
              source_kind: { type: string, enum: [mail, chat, task, other] }
              observed_at: { type: string, format: date-time }
              summary: {"type":"string","minLength":1,"maxLength":1000,"pattern":"\\S"}
      current_actions:
        type: array
        required: true
        description: Current states for admitted source references.
        schema:
          maxItems: 20
          items:
            type: object
            required: [source_id, state]
            additionalProperties: false
            properties:
              source_id: {"type":"string","minLength":1,"maxLength":300,"pattern":"\\S"}
              state: { type: string, enum: [open, waiting, followed_up, resolved, dismissed] }
      allowed_action_ids:
        type: array
        required: true
        description: Exact configured roster entries available for proposal, not execution authority.
        schema:
          maxItems: 10
          uniqueItems: true
          items: {"type":"string","minLength":1,"maxLength":100,"pattern":"\\S"}
      work_routes:
        type: array
        required: false
        description: Exact configured goal and skill/runner roster with admitted input schemas and fixed scope inputs.
        schema:
          maxItems: 16
          items:
            type: object
            required: [route_id]
            properties:
              route_id:
                type: string
                minLength: 1
                maxLength: 64
                pattern: \S
              source_id:
                type: string
                minLength: 1
                maxLength: 300
                pattern: \S
              source_digest:
                type: string
                pattern: ^sha256:[0-9a-f]{64}$
              target_locator:
                type: string
                minLength: 1
                maxLength: 1000
              source_kinds:
                type: array
                items:
                  type: string
                  enum:
                    - mail
                    - chat
                    - task
                    - other
              fixed_inputs:
                type: object
                additionalProperties: true
              source_context_input:
                type: string
                minLength: 1
            additionalProperties: true
      work_results:
        type: array
        required: false
        description: Receipt-backed non-mutating results projected by the local host; context, not authority.
        schema:
          maxItems: 20
          items:
            type: object
            required: [source_id, source_digest, route_id, target_locator, kind, status, summary, source_complete, checked_at, receipt]
            additionalProperties: false
            properties:
              source_id: { type: string, minLength: 1, maxLength: 300 }
              source_digest: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
              route_id: { type: string, minLength: 1, maxLength: 64 }
              target_locator: { type: string, minLength: 1, maxLength: 300 }
              kind: { type: string, minLength: 1, maxLength: 64 }
              status: { type: string, minLength: 1, maxLength: 64 }
              summary: { type: string, minLength: 1, maxLength: 1000 }
              source_complete: { type: boolean }
              checked_at: { type: string, format: date-time }
              receipt: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
      min_check_minutes:
        type: integer
        required: true
        description: Operator's minimum next-check delay.
        schema: { minimum: 1, maximum: 1440 }
      max_check_minutes:
        type: integer
        required: true
        description: Operator's maximum next-check delay.
        schema: { minimum: 1, maximum: 1440 }
    examples:
      - objective: Check new personal observations.
        as_of: "2026-10-02T10:00:00Z"
        evidence: [{ source_id: mail-thread-1, source_digest: 'sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa', source_kind: mail, observed_at: '2026-10-02T09:55:00Z', summary: A colleague asks for a decision. }]
        current_actions: []
        allowed_action_ids: [private_update]
        min_check_minutes: 15
        max_check_minutes: 60
    result_from: [finalize]
    steps:
      - id: judge
        agent: { role: operator, task: "attention-review-review" }
        outputs:
          draft:
            type: object
            schema:
              additionalProperties: false
              required:
                - decision
                - items
                - recommended_action_ids
                - next_check_minutes
              properties:
                decision:
                  enum:
                    - brief
                    - idle
                items:
                  type: array
                  maxItems: 5
                  items:
                    type: object
                    additionalProperties: false
                    required:
                      - source_id
                      - priority
                    properties:
                      source_id:
                        type: string
                        minLength: 1
                        maxLength: 300
                        pattern: \S
                      priority:
                        type: string
                        enum:
                          - high
                          - medium
                          - low
                recommended_action_ids:
                  type: array
                  maxItems: 10
                  items:
                    type: string
                    minLength: 1
                    maxLength: 100
                    pattern: \S
                work_proposals:
                  type: array
                  maxItems: 3
                  items:
                    type: object
                    additionalProperties: false
                    required:
                      - source_id
                      - route_id
                      - target_locator
                      - inputs
                      - due_at_unix_seconds
                    properties:
                      source_id:
                        type: string
                        minLength: 1
                        maxLength: 300
                        pattern: \S
                      route_id:
                        type: string
                        minLength: 1
                        maxLength: 64
                        pattern: \S
                      target_locator:
                        type: string
                        minLength: 1
                        maxLength: 1000
                      inputs:
                        type: object
                        additionalProperties: true
                      due_at_unix_seconds:
                        type: integer
                        minimum: 0
                        maximum: 9007199254740991
                next_check_minutes:
                  type: integer
        inputs:
          objective: $input.objective
          as_of: $input.as_of
          evidence: $input.evidence
          current_actions: $input.current_actions
          allowed_action_ids: $input.allowed_action_ids
          work_routes: $input.work_routes
          work_results: $input.work_results
          min_check_minutes: $input.min_check_minutes
          max_check_minutes: $input.max_check_minutes
        artifacts:
          named_emits:
            draft: draft
      - id: finalize
        inputs:
          as_of: $input.as_of
          evidence: $input.evidence
          current_actions: $input.current_actions
          allowed_action_ids: $input.allowed_action_ids
          work_routes: $input.work_routes
          min_check_minutes: $input.min_check_minutes
          max_check_minutes: $input.max_check_minutes
          draft: $steps.judge.draft
        tool: { module: attention-review.mjs, export: finalizeAttention }
        outputs:
          attention_packet:
            type: object
            schema:
              additionalProperties: false
              required:
                - decision
                - items
                - recommended_action_ids
                - work_proposals
                - brief
                - next_check_minutes
                - delivery_status
                - validation
              properties:
                decision:
                  enum:
                    - held
                    - ready
                    - idle
                items:
                  type: array
                  maxItems: 5
                  items:
                    type: object
                    additionalProperties: false
                    required:
                      - source_id
                      - source_digest
                      - source_kind
                      - priority
                      - summary
                    properties:
                      source_id:
                        type: string
                        minLength: 1
                        maxLength: 300
                        pattern: \S
                      source_digest:
                        type: string
                        pattern: ^sha256:[0-9a-f]{64}$
                      source_kind:
                        type: string
                        enum:
                          - mail
                          - chat
                          - task
                          - other
                      priority:
                        type: string
                        enum:
                          - high
                          - medium
                          - low
                      summary:
                        type: string
                        minLength: 1
                        maxLength: 1000
                        pattern: \S
                recommended_action_ids:
                  type: array
                  maxItems: 10
                  items:
                    type: string
                    minLength: 1
                    maxLength: 100
                    pattern: \S
                work_proposals:
                  type: array
                  maxItems: 3
                  items:
                    type: object
                    additionalProperties: false
                    required:
                      - source_id
                      - route_id
                      - target_locator
                      - inputs
                      - due_at_unix_seconds
                      - source_digest
                    properties:
                      source_id:
                        type: string
                        minLength: 1
                        maxLength: 300
                        pattern: \S
                      route_id:
                        type: string
                        minLength: 1
                        maxLength: 64
                        pattern: \S
                      target_locator:
                        type: string
                        minLength: 1
                        maxLength: 1000
                      inputs:
                        type: object
                        additionalProperties: true
                      due_at_unix_seconds:
                        type: integer
                        minimum: 0
                        maximum: 9007199254740991
                      source_digest:
                        type: string
                        pattern: ^sha256:[0-9a-f]{64}$
                brief:
                  type: string
                next_check_minutes:
                  type:
                    - integer
                    - "null"
                  minimum: 1
                  maximum: 1440
                delivery_status:
                  const: not_sent
                validation:
                  type: object
                  additionalProperties: false
                  required:
                    - status
                    - findings
                    - omitted_unconfigured_actions
                    - omitted_unconfigured_work
                  properties:
                    status:
                      enum:
                        - pass
                        - fail
                    findings:
                      type: array
                      items:
                        type: string
                        minLength: 1
                    omitted_unconfigured_actions:
                      type: integer
                      minimum: 0
                      maximum: 10
                    omitted_unconfigured_work:
                      type: integer
                      minimum: 0
                      maximum: 3
        artifacts:
          named_emits:
            attention_packet: attention_packet
