skill: attention-review
version: "0.4.0"

catalog:
  kind: graph
  audience: operator
  visibility: public
  role: context
  execution: read
  completion: runtime_receipt
  requires_adapter: false
  approval: none

harness:
  cases:
    - name: attention-review-selects-bounded-attention
      operator_journeys:
        - mode: standalone
          confusors: [chief-of-staff, ops-desk]
          request: Decide whether these new personal mailbox and chat observations warrant a private update.
          expected_outcome: Return source-bound attention and an undelivered private brief intent.
        - mode: composed
          request: Reassess the already collected observations and current action dispositions.
          expected_outcome: Reuse supplied evidence without rereading providers or sending a message.
          prior_evidence:
            - The bounded mailbox and chat observations supplied in the fixture.
          must_not_repeat:
            - Do not query either provider again.
            - Do not repost an earlier notification.
      inputs:
        objective: Check new personal observations.
        user_context: { charter: "Prioritize time-sensitive replies.", confirmed_memory: [] }
        as_of: "2026-10-02T10:00:00.123456Z"
        evidence:
          - source_ref: mail-thread-1
            source_digest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
            source_kind: mail
            observed_at: "2026-10-02T09:55:00Z"
            summary: A colleague asks for a decision on the release note.
        current_actions: []
        allowed_action_ids: [private_update]
        min_check_minutes: 15
        max_check_minutes: 60
      caller:
        answers:
          agent_task.runx_final_result.output:
            draft:
              decision: brief
              items: [{ source_ref: mail-thread-1, priority: high }]
              recommended_action_ids: [private_update]
              next_check_minutes: 20
      expect:
        status: sealed
        steps: [judge, finalize]
        step_outputs:
          finalize:
            subset:
              attention_packet:
                data:
                  decision: ready
                  next_check_minutes: 20
                  delivery_status: not_sent
                  validation: { status: pass }
        receipt: { schema: runx.receipt.v1 }

    - name: attention-review-omits-unconfigured-action
      inputs:
        objective: Check new personal observations without an authorized delivery action.
        as_of: "2026-10-02T10:00:00Z"
        evidence:
          - source_ref: mail-1
            source_digest: sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
            source_kind: mail
            observed_at: "2026-10-02T09:55:00Z"
            summary: A colleague asks for a decision.
        current_actions: [{ source_ref: mail-1, disposition: open }]
        allowed_action_ids: []
        work_candidates:
          - { source_ref: mail-1, source_digest: 'sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc', route_id: pr_status, target_ref: 'https://github.com/example/project/pull/12' }
        min_check_minutes: 15
        max_check_minutes: 60
      caller:
        answers:
          agent_task.runx_final_result.output:
            draft:
              decision: idle
              items: [{ source_ref: mail-1, priority: high }]
              recommended_action_ids: [private_update]
              work_proposals: [{ source_ref: mail-1, route_id: conversation, target_ref: mail-thread-1 }]
              next_check_minutes: 20
      expect:
        status: sealed
        steps: [judge, finalize]
        step_outputs:
          finalize:
            subset:
              attention_packet:
                data:
                  decision: ready
                  recommended_action_ids: []
                  work_proposals: []
                  validation: { status: pass, omitted_unconfigured_actions: 1, omitted_unconfigured_work: 1 }
        receipt: { schema: runx.receipt.v1 }

    - name: attention-review-proposes-exact-work
      inputs:
        objective: Check new personal observations.
        as_of: "2026-10-02T10:00:00Z"
        evidence:
          - source_ref: chat-1
            source_digest: sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
            source_kind: chat
            observed_at: "2026-10-02T09:55:00Z"
            summary: A colleague requests review of a pull request.
        current_actions: [{ source_ref: chat-1, disposition: open }]
        allowed_action_ids: []
        work_candidates:
          - { source_ref: chat-1, source_digest: 'sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb', route_id: pr_status, target_ref: 'https://github.com/example/project/pull/12' }
        min_check_minutes: 15
        max_check_minutes: 60
      caller:
        answers:
          agent_task.runx_final_result.output:
            draft:
              decision: brief
              items: [{ source_ref: chat-1, priority: medium }]
              recommended_action_ids: []
              work_proposals: [{ source_ref: chat-1, route_id: pr_status, target_ref: 'https://github.com/example/project/pull/12' }]
              next_check_minutes: 20
      expect:
        status: sealed
        steps: [judge, finalize]
        step_outputs:
          finalize:
            subset:
              attention_packet:
                data:
                  decision: ready
                  work_proposals:
                    - { source_ref: chat-1, source_digest: 'sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb', route_id: pr_status, target_ref: 'https://github.com/example/project/pull/12' }
                  validation: { status: pass }
        receipt: { schema: runx.receipt.v1 }

    - name: attention-review-uses-verified-work-result
      inputs:
        objective: Reassess the observed request using a verified pull-request status.
        as_of: "2026-10-02T10:05:00Z"
        evidence:
          - source_ref: chat-1
            source_digest: sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
            source_kind: chat
            observed_at: "2026-10-02T09:55:00Z"
            summary: A colleague asks to review a pull request.
        current_actions: [{ source_ref: chat-1, disposition: open }]
        allowed_action_ids: []
        work_candidates: []
        work_results:
          - { source_ref: chat-1, source_digest: 'sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb', route_id: pr_status, target_ref: 'https://github.com/example/project/pull/12', state: closed, title: Example change, checked_at: '2026-10-02T10:04:00Z', receipt: 'sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa' }
        min_check_minutes: 15
        max_check_minutes: 60
      caller:
        answers:
          agent_task.runx_final_result.output:
            draft:
              decision: idle
              items: []
              recommended_action_ids: []
              work_proposals: []
              next_check_minutes: 60
      expect:
        status: sealed
        steps: [judge, finalize]
        step_outputs:
          finalize:
            subset:
              attention_packet:
                data:
                  decision: idle
                  work_proposals: []
                  validation: { status: pass }
        receipt: { schema: runx.receipt.v1 }

    - name: attention-review-holds-invented-work
      inputs:
        objective: Check new personal observations.
        as_of: "2026-10-02T10:00:00Z"
        evidence:
          - source_ref: chat-1
            source_digest: sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
            source_kind: chat
            observed_at: "2026-10-02T09:55:00Z"
            summary: A colleague requests review of a pull request.
        current_actions: [{ source_ref: chat-1, disposition: open }]
        allowed_action_ids: []
        work_candidates:
          - { source_ref: chat-1, source_digest: 'sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb', route_id: pr_status, target_ref: 'https://github.com/example/project/pull/13' }
        min_check_minutes: 15
        max_check_minutes: 60
      caller:
        answers:
          agent_task.runx_final_result.output:
            draft:
              decision: brief
              items: [{ source_ref: chat-1, priority: medium }]
              recommended_action_ids: []
              work_proposals: [{ source_ref: chat-1, route_id: pr_status, target_ref: 'https://github.com/example/project/pull/12' }]
              next_check_minutes: 20
      expect:
        status: sealed
        steps: [judge, finalize]
        step_outputs:
          finalize:
            subset:
              attention_packet:
                data:
                  decision: held
                  validation: { status: fail }
        receipt: { schema: runx.receipt.v1 }

    - name: attention-review-holds-invented-source
      inputs:
        objective: Check new personal observations.
        user_context: { charter: "Prioritize time-sensitive replies.", confirmed_memory: [] }
        as_of: "2026-10-02T10:00:00Z"
        evidence:
          - source_ref: chat-1
            source_digest: sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
            source_kind: chat
            observed_at: "2026-10-02T09:55:00Z"
            summary: A routine status update.
        current_actions: []
        allowed_action_ids: [private_update]
        min_check_minutes: 15
        max_check_minutes: 60
      caller:
        answers:
          agent_task.runx_final_result.output:
            draft:
              decision: brief
              items: [{ source_ref: invented, priority: high }]
              recommended_action_ids: [private_update]
              next_check_minutes: 20
      expect:
        status: sealed
        steps: [judge, finalize]
        step_outputs:
          finalize:
            subset:
              attention_packet:
                data:
                  decision: held
                  delivery_status: not_sent
                  validation: { status: fail }
        receipt: { schema: runx.receipt.v1 }

    - name: attention-review-preserves-inbox-disposition
      inputs:
        objective: Check new personal observations.
        as_of: "2026-10-02T10:00:00Z"
        evidence:
          - source_ref: mail-thread-1
            source_digest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
            source_kind: mail
            observed_at: "2026-10-02T09:55:00Z"
            summary: A colleague asks for a decision on the release note.
        current_actions: [{ source_ref: mail-thread-1, disposition: waiting }]
        allowed_action_ids: [private_update]
        min_check_minutes: 15
        max_check_minutes: 60
      caller:
        answers:
          agent_task.runx_final_result.output:
            draft:
              decision: brief
              items: [{ source_ref: mail-thread-1, priority: high }]
              recommended_action_ids: [private_update]
              next_check_minutes: 20
      expect:
        status: sealed
        steps: [judge, finalize]
        step_outputs:
          finalize:
            subset:
              attention_packet:
                data:
                  decision: held
                  delivery_status: not_sent
                  validation: { status: fail }
        receipt: { schema: runx.receipt.v1 }

runners:
  review:
    default: true
    type: graph
    inputs:
      objective:
        type: string
        required: true
        description: Bounded operator objective for this review.
        schema: { minLength: 1, maxLength: 500 }
      user_context:
        type: object
        required: false
        description: Private caller-confirmed charter and memory; prioritization context only, never fresh source evidence.
        schema:
          required: [charter, confirmed_memory]
          additionalProperties: false
          properties:
            charter: { type: string, maxLength: 2000 }
            confirmed_memory:
              type: array
              maxItems: 20
              items:
                type: object
                required: [memory_id, text, confirmed_at]
                additionalProperties: false
                properties:
                  memory_id: { type: string, minLength: 1, maxLength: 64 }
                  text: { type: string, minLength: 1, maxLength: 300 }
                  confirmed_at: { type: string, format: date-time }
      as_of:
        type: string
        required: true
        description: Explicit evaluation time.
        schema: { format: date-time }
      evidence:
        type: array
        required: true
        description: Up to twenty normalized observations from already completed source skills.
        schema:
          maxItems: 20
          items:
            type: object
            required: [source_ref, source_digest, source_kind, observed_at, summary]
            additionalProperties: false
            properties:
              source_ref: { type: string, minLength: 1, maxLength: 300 }
              source_digest: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
              source_kind: { type: string, enum: [mail, chat, task, other] }
              observed_at: { type: string, format: date-time }
              summary: { type: string, minLength: 1, maxLength: 1000 }
      current_actions:
        type: array
        required: true
        description: Current dispositions for admitted source references.
        schema:
          maxItems: 20
          items:
            type: object
            required: [source_ref, disposition]
            additionalProperties: false
            properties:
              source_ref: { type: string, minLength: 1, maxLength: 300 }
              disposition: { type: string, enum: [open, waiting, followed_up, resolved, dismissed] }
      allowed_action_ids:
        type: array
        required: true
        description: Exact configured roster entries available for proposal, not execution authority.
        schema:
          maxItems: 10
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 100 }
      work_candidates:
        type: array
        required: false
        description: Exact host-derived configured non-mutating route targets; proposals only, never execution authority.
        schema:
          maxItems: 20
          uniqueItems: true
          items:
            type: object
            required: [source_ref, source_digest, route_id, target_ref]
            additionalProperties: false
            properties:
              source_ref: { type: string, minLength: 1, maxLength: 300 }
              source_digest: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
              route_id: { type: string, minLength: 1, maxLength: 64 }
              target_ref: { type: string, minLength: 1, maxLength: 300 }
      work_results:
        type: array
        required: false
        description: Receipt-backed non-mutating results projected by the local host; context, not authority.
        schema:
          maxItems: 20
          items:
            type: object
            required: [source_ref, source_digest, route_id, target_ref, state, title, checked_at, receipt]
            additionalProperties: false
            properties:
              source_ref: { type: string, minLength: 1, maxLength: 300 }
              source_digest: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
              route_id: { type: string, minLength: 1, maxLength: 64 }
              target_ref: { type: string, minLength: 1, maxLength: 300 }
              state: { type: string, enum: [open, closed] }
              title: { type: string, minLength: 1, maxLength: 300 }
              checked_at: { type: string, format: date-time }
              receipt: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
      min_check_minutes:
        type: integer
        required: true
        description: Operator's minimum next-check delay.
        schema: { minimum: 1, maximum: 1440 }
      max_check_minutes:
        type: integer
        required: true
        description: Operator's maximum next-check delay.
        schema: { minimum: 1, maximum: 1440 }
    examples:
      - objective: Check new personal observations.
        as_of: "2026-10-02T10:00:00Z"
        evidence: [{ source_ref: mail-thread-1, source_digest: 'sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa', source_kind: mail, observed_at: '2026-10-02T09:55:00Z', summary: A colleague asks for a decision. }]
        current_actions: []
        allowed_action_ids: [private_update]
        min_check_minutes: 15
        max_check_minutes: 60
    graph:
      name: attention-review-review
      result_from: [finalize]
      steps:
        - id: judge
          run:
            type: agent-task
            agent: operator
            task: runx_final_result
            outputs:
              draft: object
          inputs:
            objective: $input.objective
            user_context: $input.user_context
            as_of: $input.as_of
            evidence: $input.evidence
            current_actions: $input.current_actions
            allowed_action_ids: $input.allowed_action_ids
            work_candidates: $input.work_candidates
            work_results: $input.work_results
          artifacts:
            named_emits:
              draft: draft
        - id: finalize
          context:
            draft: judge.draft.data
          inputs:
            as_of: $input.as_of
            evidence: $input.evidence
            current_actions: $input.current_actions
            allowed_action_ids: $input.allowed_action_ids
            work_candidates: $input.work_candidates
            min_check_minutes: $input.min_check_minutes
            max_check_minutes: $input.max_check_minutes
          run:
            type: javascript
            module: attention-review.mjs
            export: finalizeAttention
            outputs:
              attention_packet: object
          artifacts:
            named_emits:
              attention_packet: attention_packet
