skill: crm-cleanup
version: "0.2.0"

catalog:
  kind: graph
  audience: public
  visibility: public
  role: canonical
  execution: execute
  completion: runtime_receipt
  requires_adapter: false
  approval: none

policy:
  side_effects: mock_transport
  sends_messages: denied
  mints_authority: denied
  persists_state: denied
  secrets_required: false

harness:
  cases:
    - name: crm-cleanup-applies-traced-updates
      operator_journeys:
        - mode: standalone
          confusors: [lead-enrichment, lead-router]
          request: Read the CRM records from the source, reconcile this call transcript against them, and execute the field updates through the CRM transport.
          expected_outcome: Return allowlisted field updates, each traced to a verbatim transcript quote, executed through the transport with a sealed before/after write result.
        - mode: composed
          request: Continue from this sealed cleanup result into pipeline reporting.
          expected_outcome: Hand the sealed result with its write_result to the reporting step without re-deriving updates.
          prior_evidence:
            - The transcript, source read, decision, and sealed write result supplied by the prior run.
          must_not_repeat:
            - Do not re-reconcile or re-execute updates already sealed.
      inputs:
        crm_source:
          kind: web_fetch
          allowlist: [fixture.runx.invalid]
          url: "https://fixture.runx.invalid/crm/globex.json"
        transcript: "Call with Globex on renewal. Dana said the rollout stalled and they want an executive review before renewing. Next step agreed: send the Q3 usage report by Friday."
        crm_schema:
          allowed_fields: [account_status, next_action, health_score]
      caller:
        http_responses:
          "https://fixture.runx.invalid/crm/globex.json":
            status: 200
            headers: { content-type: application/json }
            body: '[{"id":"acct-globex","account_status":"healthy","next_action":"none"}]'
      expect:
        status: sealed
        steps: [fetch-source, digest-transcript, digest-records, cleanup]
        step_outputs:
          cleanup:
            subset:
              takeaways:
                data:
                  - "Update acct-globex.account_status from healthy to at_risk."
                  - "Update acct-globex.next_action from none to send the Q3 usage report by Friday."
              field_updates:
                data:
                  - record_id: acct-globex
                    field: account_status
                    from: healthy
                    to: at_risk
                    evidence_quote: the rollout stalled and they want an executive review before renewing
                  - record_id: acct-globex
                    field: next_action
                    from: none
                    to: send the Q3 usage report by Friday
                    evidence_quote: send the Q3 usage report by Friday
              write_result:
                data:
                  schema: runx.crm_write_result.v1
                  executed: true
                  transport: mock-crm.v1
                  applied:
                    - record_id: acct-globex
                      field: account_status
                      from: healthy
                      to: at_risk
                    - record_id: acct-globex
                      field: next_action
                      from: none
                      to: send the Q3 usage report by Friday
                  after:
                    - id: acct-globex
                      account_status: at_risk
                      next_action: send the Q3 usage report by Friday
              crm_cleanup_result:
                data:
                  schema: runx.crm_cleanup_result.v1
                  decision: applied
                  rejected_updates: []
                  source_read:
                    kind: web_fetch
                    ref: "https://fixture.runx.invalid/crm/globex.json"
                    count: 1
                  validation: { status: pass, findings: [] }
        receipt: { schema: runx.receipt.v1 }

    - name: crm-cleanup-noop-executes-nothing
      operator_journeys:
        - mode: standalone
          confusors: [lead-enrichment, lead-router]
          request: Read the CRM records and this check-in transcript, then execute nothing if no field should change.
          expected_outcome: Seal a no_action result with write_result.executed false and an unchanged after snapshot.
        - mode: composed
          request: Hand this sealed no-op into reporting without inventing a write.
          expected_outcome: Reuse the sealed empty field_updates without executing a transport write.
          prior_evidence:
            - The transcript, source read, and sealed no-op write result.
          must_not_repeat:
            - Do not invent field updates the transcript does not support.
      inputs:
        crm_source:
          kind: web_fetch
          allowlist: [fixture.runx.invalid]
          url: "https://fixture.runx.invalid/crm/acct1-status.json"
        transcript: "Short check-in call. Everything on track, no changes discussed."
        crm_schema:
          allowed_fields: [account_status, next_action]
      caller:
        http_responses:
          "https://fixture.runx.invalid/crm/acct1-status.json":
            status: 200
            headers: { content-type: application/json }
            body: '[{"id":"acct-1","account_status":"healthy"}]'
      expect:
        status: sealed
        steps: [fetch-source, digest-transcript, digest-records, cleanup]
        step_outputs:
          cleanup:
            subset:
              field_updates: { data: [] }
              write_result:
                data:
                  executed: false
                  transport: mock-crm.v1
                  applied: []
              crm_cleanup_result:
                data:
                  schema: runx.crm_cleanup_result.v1
                  decision: no_action
                  validation: { status: pass, findings: [] }
        receipt: { schema: runx.receipt.v1 }

    - name: crm-cleanup-rejects-unlisted-field
      inputs:
        crm_source:
          kind: web_fetch
          allowlist: [fixture.runx.invalid]
          url: "https://fixture.runx.invalid/crm/acct1-owner.json"
        transcript: "Owner said move the account to Kim."
        crm_schema:
          allowed_fields: [next_action]
      caller:
        http_responses:
          "https://fixture.runx.invalid/crm/acct1-owner.json":
            status: 200
            headers: { content-type: application/json }
            body: '[{"id":"acct-1","owner":"lee"}]'
      expect:
        status: sealed
        steps: [fetch-source, digest-transcript, digest-records, cleanup]
        step_outputs:
          cleanup:
            subset:
              field_updates: { data: [] }
              write_result:
                data: { executed: false, transport: mock-crm.v1, applied: [] }
              crm_cleanup_result:
                data:
                  decision: no_action
                  rejected_updates:
                    - record_id: acct-1
                      field: owner
                      reason: field is outside the crm_schema allowlist
                  validation: { status: pass, findings: [] }
        receipt: { schema: runx.receipt.v1 }

    - name: crm-cleanup-needs-transcript
      inputs:
        crm_source:
          kind: web_fetch
          allowlist: [fixture.runx.invalid]
          url: "https://fixture.runx.invalid/crm/acct1-status.json"
        crm_schema:
          allowed_fields: [next_action]
      expect:
        status: failure

runners:
  reconcile:
    default: true
    type: graph
    inputs:
      crm_source:
        type: object
        required: true
        description: Source handle read at run time (kind read_projection, connector_export, or web_fetch plus https url and host allowlist). Records are never accepted as a pasted fixture argument.
      transcript:
        type: string
        required: true
        description: Call transcript that is the only evidence for decided updates.
      crm_schema:
        type: object
        required: true
        description: Explicit update authority; fields outside allowed_fields are rejected.
        schema:
          additionalProperties: false
          properties:
            allowed_fields:
              type: array
              minItems: 1
              maxItems: 100
              items: { type: string, minLength: 1, maxLength: 200 }
    examples:
      - crm_source:
          kind: web_fetch
          allowlist: [fixture.runx.invalid]
          url: "https://fixture.runx.invalid/crm/globex.json"
        transcript: "Dana said the rollout stalled. Next step agreed: send the Q3 usage report by Friday."
        crm_schema:
          allowed_fields: [account_status, next_action]
    graph:
      name: crm-cleanup-reconcile
      result_from: [cleanup]
      steps:
        - id: fetch-source
          label: read the current CRM records from the live source handle
          tool: web.fetch
          scopes:
            - net:allowlist
          inputs:
            url: $input.crm_source.url
            allowlist: $input.crm_source.allowlist
            extract: text
            max_bytes: 1000000

        - id: digest-transcript
          tool: data.digest
          inputs:
            value: $input.transcript
            encoding: utf8_text

        - id: digest-records
          tool: data.digest
          inputs:
            encoding: utf8_text
          context:
            value: fetch-source.fetch_result.data.extracted

        - id: cleanup
          label: decide allowlisted updates and execute them through the mock CRM transport
          inputs:
            crm_source: $input.crm_source
            transcript: $input.transcript
            crm_schema: $input.crm_schema
          context:
            source_fetch: fetch-source.fetch_result.data
            transcript_digest: digest-transcript.digest_result.data.digest
            records_digest: digest-records.digest_result.data.digest
          run:
            type: javascript
            module: crm-cleanup.mjs
            export: runCleanup
            outputs:
              takeaways: array
              field_updates: array
              write_result: object
              source_read: object
              crm_cleanup_result: object
          artifacts:
            named_emits:
              takeaways: takeaways
              field_updates: field_updates
              write_result: write_result
              crm_cleanup_result: crm_cleanup_result
