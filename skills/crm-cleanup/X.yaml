skill: crm-cleanup
version: "0.3.0"

catalog:
  kind: graph
  audience: operator
  visibility: public
  role: canonical
  execution: plan
  completion: runtime_receipt
  requires_adapter: false
  approval: none

harness:
  cases:
    - name: crm-cleanup-proposes-traced-updates
      operator_journeys:
        - mode: standalone
          confusors: [lead-enrichment, lead-router]
          request: Reconcile this call transcript against the CRM records and propose the field updates.
          expected_outcome: Return allowlisted field updates, each traced to a verbatim transcript quote, with no CRM write performed.
        - mode: composed
          request: Continue from this sealed update proposal into the CRM write step.
          expected_outcome: Hand the sealed proposal to the gated CRM operator without re-deriving updates.
          prior_evidence:
            - The transcript, records, and sealed proposal supplied by the prior step.
          must_not_repeat:
            - Do not re-reconcile updates already sealed.
      inputs:
        transcript: "Call with Globex on renewal. Dana said the rollout stalled and they want an executive review before renewing. Next step agreed: send the Q3 usage report by Friday."
        crm_records:
          - id: acct-globex
            account_status: healthy
            next_action: none
        crm_schema:
          allowed_fields: [account_status, next_action, health_score]
      caller:
        answers:
          agent_task.crm-cleanup-reconcile.output:
            update_draft:
              updates:
                - record_id: acct-globex
                  field: account_status
                  to: at_risk
                  evidence_quote: the rollout stalled and they want an executive review before renewing
                - record_id: acct-globex
                  field: next_action
                  to: send the Q3 usage report by Friday
                  evidence_quote: "send the Q3 usage report by Friday"
      expect:
        status: sealed
        steps: [digest-transcript, digest-records, reconcile, finalize]
        step_outputs:
          finalize:
            subset:
              crm_update_proposal:
                data:
                  schema: runx.crm_update_proposal.v1
                  decision: proposed
                  write_performed: false
                  gate: crm-operator-or-human-approver
                  rejected_updates: []
                  validation: { status: pass, findings: [] }
        receipt: { schema: runx.receipt.v1 }

    - name: crm-cleanup-rejects-unlisted-field
      inputs:
        transcript: "Owner said move the account to Kim."
        crm_records:
          - id: acct-1
            owner: lee
        crm_schema:
          allowed_fields: [next_action]
      caller:
        answers:
          agent_task.crm-cleanup-reconcile.output:
            update_draft:
              updates:
                - record_id: acct-1
                  field: owner
                  to: kim
                  evidence_quote: move the account to Kim
      expect:
        status: sealed
        steps: [digest-transcript, digest-records, reconcile, finalize]
        step_outputs:
          finalize:
            subset:
              crm_update_proposal:
                data:
                  decision: no_action
                  updates: []
                  rejected_updates:
                    - record_id: acct-1
                      field: owner
                      reason: field is outside the crm_schema allowlist
                  validation: { status: pass, findings: [] }
        receipt: { schema: runx.receipt.v1 }

    - name: crm-cleanup-refuses-invented-quote
      inputs:
        transcript: "Short call, no changes discussed."
        crm_records:
          - id: acct-1
            account_status: healthy
        crm_schema:
          allowed_fields: [account_status]
      caller:
        answers:
          agent_task.crm-cleanup-reconcile.output:
            update_draft:
              updates:
                - record_id: acct-1
                  field: account_status
                  to: at_risk
                  evidence_quote: customer threatened to churn immediately
      expect:
        status: sealed
        steps: [digest-transcript, digest-records, reconcile, finalize]
        step_outputs:
          finalize:
            subset:
              crm_update_proposal:
                data:
                  decision: refused
                  updates: []
                  validation: { status: fail }
        receipt: { schema: runx.receipt.v1 }

    - name: crm-cleanup-needs-transcript
      inputs:
        crm_records:
          - id: acct-1
        crm_schema:
          allowed_fields: [next_action]
      expect:
        status: failure

    - name: crm-cleanup-dedupes-identical-updates
      inputs:
        transcript: "Dana confirmed the renewal is signed and the new billing contact is Priya."
        crm_records:
          - id: acct-globex
            contract_status: pending
            billing_contact: unknown
        crm_schema:
          allowed_fields: [contract_status, billing_contact]
      caller:
        answers:
          agent_task.crm-cleanup-reconcile.output:
            update_draft:
              updates:
                - record_id: acct-globex
                  field: contract_status
                  to: signed
                  evidence_quote: the renewal is signed
                - record_id: acct-globex
                  field: contract_status
                  to: signed
                  evidence_quote: the renewal is signed
      expect:
        status: sealed
        steps: [digest-transcript, digest-records, reconcile, finalize]
        step_outputs:
          finalize:
            subset:
              crm_update_proposal:
                data:
                  schema: runx.crm_update_proposal.v1
                  decision: proposed
                  write_performed: false
                  updates:
                    - record_id: acct-globex
                      field: contract_status
                      from: pending
                      to: signed
                      evidence_quote: the renewal is signed
                  validation: { status: pass, findings: [] }
        receipt: { schema: runx.receipt.v1 }

    - name: crm-cleanup-refuses-conflicting-values
      inputs:
        transcript: "Dana said the rollout stalled but later added it might be back on track."
        crm_records:
          - id: acct-globex
            account_status: healthy
        crm_schema:
          allowed_fields: [account_status]
      caller:
        answers:
          agent_task.crm-cleanup-reconcile.output:
            update_draft:
              updates:
                - record_id: acct-globex
                  field: account_status
                  to: at_risk
                  evidence_quote: the rollout stalled
                - record_id: acct-globex
                  field: account_status
                  to: healthy
                  evidence_quote: might be back on track
      expect:
        status: sealed
        steps: [digest-transcript, digest-records, reconcile, finalize]
        step_outputs:
          finalize:
            subset:
              crm_update_proposal:
                data:
                  schema: runx.crm_update_proposal.v1
                  decision: refused
                  updates: []
                  validation:
                    status: fail
                    findings:
                      - code: update.conflicting_values
        receipt: { schema: runx.receipt.v1 }

    - name: crm-cleanup-accepts-typed-values
      inputs:
        transcript: "Ops review set the health score to 72 and flagged priority escalation for acct-1."
        crm_records:
          - id: acct-1
            health_score: 50
            priority_escalation: false
        crm_schema:
          allowed_fields: [health_score, priority_escalation]
      caller:
        answers:
          agent_task.crm-cleanup-reconcile.output:
            update_draft:
              updates:
                - record_id: acct-1
                  field: health_score
                  to: 72
                  evidence_quote: set the health score to 72
                - record_id: acct-1
                  field: priority_escalation
                  to: true
                  evidence_quote: flagged priority escalation for acct-1
      expect:
        status: sealed
        steps: [digest-transcript, digest-records, reconcile, finalize]
        step_outputs:
          finalize:
            subset:
              crm_update_proposal:
                data:
                  schema: runx.crm_update_proposal.v1
                  decision: proposed
                  write_performed: false
                  updates:
                    - record_id: acct-1
                      field: health_score
                      from: 50
                      to: 72
                      evidence_quote: set the health score to 72
                    - record_id: acct-1
                      field: priority_escalation
                      from: false
                      to: true
                      evidence_quote: flagged priority escalation for acct-1
                  validation: { status: pass, findings: [] }
        receipt: { schema: runx.receipt.v1 }

    - name: crm-cleanup-mixed-multi-record
      inputs:
        transcript: "Renewed Globex for another year. Also move the Initech account owner to Kim."
        crm_records:
          - id: acct-globex
            contract_status: expiring
          - id: acct-initech
            owner: lee
        crm_schema:
          allowed_fields: [contract_status]
      caller:
        answers:
          agent_task.crm-cleanup-reconcile.output:
            update_draft:
              updates:
                - record_id: acct-globex
                  field: contract_status
                  to: renewed
                  evidence_quote: Renewed Globex for another year
                - record_id: acct-initech
                  field: owner
                  to: kim
                  evidence_quote: move the Initech account owner to Kim
      expect:
        status: sealed
        steps: [digest-transcript, digest-records, reconcile, finalize]
        step_outputs:
          finalize:
            subset:
              crm_update_proposal:
                data:
                  schema: runx.crm_update_proposal.v1
                  decision: proposed
                  updates:
                    - record_id: acct-globex
                      field: contract_status
                      from: expiring
                      to: renewed
                      evidence_quote: Renewed Globex for another year
                  rejected_updates:
                    - record_id: acct-initech
                      field: owner
                      reason: field is outside the crm_schema allowlist
                  validation: { status: pass, findings: [] }
        receipt: { schema: runx.receipt.v1 }

    - name: crm-cleanup-apply-sealed-write
      runner: apply
      inputs:
        crm_update_proposal:
          schema: runx.crm_update_proposal.v1
          decision: proposed
          updates:
            - record_id: acct-globex
              field: account_status
              from: healthy
              to: at_risk
              evidence_quote: the rollout stalled
        crm_records:
          - id: acct-globex
            account_status: healthy
      expect:
        status: sealed
        steps: [transport]
        step_outputs:
          transport:
            subset:
              crm_write_result:
                data:
                  schema: runx.crm_write_result.v1
                  executed: true
                  write_result:
                    before:
                      - record_id: acct-globex
                        field: account_status
                        value: healthy
                    after:
                      - record_id: acct-globex
                        field: account_status
                        value: at_risk
        receipt: { schema: runx.receipt.v1 }

    - name: crm-cleanup-apply-noop-executes-nothing
      runner: apply
      inputs:
        crm_update_proposal:
          schema: runx.crm_update_proposal.v1
          decision: no_action
          updates: []
        crm_records:
          - id: acct-globex
            account_status: healthy
      expect:
        status: sealed
        steps: [transport]
        step_outputs:
          transport:
            subset:
              crm_write_result:
                data:
                  schema: runx.crm_write_result.v1
                  executed: false
                  write_result:
                    before: []
                    after: []
        receipt: { schema: runx.receipt.v1 }

runners:
  reconcile:
    default: true
    type: graph
    inputs:
      transcript:
        type: string
        required: true
        description: Call transcript that is the only evidence for proposed updates.
      crm_records:
        type: json
        required: true
        description: Current CRM records read from the caller's source of truth.
      crm_schema:
        type: object
        required: true
        description: Explicit update authority; fields outside allowed_fields are rejected.
        schema:
          additionalProperties: false
          properties:
            allowed_fields:
              type: array
              minItems: 1
              maxItems: 100
              items: { type: string, minLength: 1, maxLength: 200 }
    examples:
      - transcript: "Dana said the rollout stalled."
        crm_records:
          - id: acct-globex
            account_status: healthy
        crm_schema:
          allowed_fields: [account_status]
    graph:
      name: crm-cleanup-reconcile
      result_from: [finalize]
      steps:
        - id: digest-transcript
          tool: data.digest
          inputs:
            value: $input.transcript
            encoding: utf8_text

        - id: digest-records
          tool: data.digest
          inputs:
            value: $input.crm_records

        - id: reconcile
          label: derive candidate field updates from the transcript
          run:
            type: agent-task
            agent: reviewer
            task: crm-cleanup-reconcile
            outputs:
              update_draft: object
          inputs:
            transcript: $input.transcript
            crm_records: $input.crm_records
            crm_schema: $input.crm_schema
          allowed_tools: []
          artifacts:
            named_emits:
              update_draft: update_draft

        - id: finalize
          label: enforce allowlist and transcript traceability deterministically
          inputs:
            transcript: $input.transcript
            crm_records: $input.crm_records
            crm_schema: $input.crm_schema
          context:
            update_draft: reconcile.update_draft.data
            transcript_digest: digest-transcript.digest_result.data.digest
            records_digest: digest-records.digest_result.data.digest
          run:
            type: javascript
            module: crm-cleanup.mjs
            export: finalizeUpdates
            outputs:
              crm_update_proposal:
                type: object
                schema:
                  required: [schema, decision, reason, updates, rejected_updates, write_performed, gate, transcript_digest, records_digest, validation]
                  additionalProperties: false
                  properties:
                    schema: { const: runx.crm_update_proposal.v1 }
                    decision: { type: string, enum: [proposed, no_action, refused] }
                    reason: { type: string, minLength: 1, maxLength: 2000 }
                    updates:
                      type: array
                      maxItems: 200
                      items:
                        type: object
                        required: [record_id, field, from, to, evidence_quote]
                        additionalProperties: false
                        properties:
                          record_id: { type: string, minLength: 1, maxLength: 500 }
                          field: { type: string, minLength: 1, maxLength: 200 }
                          from: {}
                          to: {}
                          evidence_quote: { type: string, minLength: 1, maxLength: 4000 }
                    rejected_updates:
                      type: array
                      maxItems: 200
                      items:
                        type: object
                        required: [record_id, field, reason]
                        additionalProperties: false
                        properties:
                          record_id: { type: [string, "null"], maxLength: 500 }
                          field: { type: string, maxLength: 200 }
                          reason: { type: string, minLength: 1, maxLength: 500 }
                    write_performed: { const: false }
                    gate: { const: crm-operator-or-human-approver }
                    transcript_digest: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
                    records_digest: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
                    validation:
                      type: object
                      required: [status, findings]
                      additionalProperties: false
                      properties:
                        status: { type: string, enum: [pass, fail] }
                        findings:
                          type: array
                          maxItems: 100
                          items:
                            type: object
                            required: [code, message]
                            additionalProperties: false
                            properties:
                              code: { type: string, minLength: 1, maxLength: 200 }
                              message: { type: string, minLength: 1, maxLength: 2000 }
          artifacts:
            named_emits:
              crm_update_proposal: crm_update_proposal

  apply:
    type: graph
    inputs:
      crm_update_proposal:
        type: object
        required: true
        description: Sealed proposal from the reconcile runner.
      crm_records:
        type: json
        required: true
        description: Current CRM records; the mock transport applies updates in memory.
    graph:
      name: crm-cleanup-apply
      result_from: [transport]
      steps:
        - id: transport
          label: execute proposed updates through the mock CRM transport
          inputs:
            crm_update_proposal: $input.crm_update_proposal
            crm_records: $input.crm_records
          run:
            type: javascript
            module: crm-cleanup.mjs
            export: applyUpdates
            outputs:
              crm_write_result:
                type: object
                schema:
                  required: [schema, executed, reason, write_result]
                  properties:
                    schema: { const: runx.crm_write_result.v1 }
                    executed: { type: boolean }
                    reason: { type: string }
                    write_result:
                      type: object
                      required: [before, after]
                      properties:
                        before: { type: array }
                        after: { type: array }
          artifacts:
            named_emits:
              crm_write_result: crm_write_result
