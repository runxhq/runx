skill: crm-cleanup
version: "0.2.0"

catalog:
  kind: graph
  audience: operator
  visibility: public
  role: canonical
  execution: plan
  completion: runtime_receipt
  requires_adapter: false
  approval: none

policy:
  side_effects: workspace_write
  sends_messages: denied
  mints_authority: denied
  persists_state: denied
  secrets_required: false

runners:
  reconcile:
    default: true
    type: graph
    inputs:
      transcript:
        type: string
        required: true
        description: Call transcript that is the only evidence for field updates.
      crm_source:
        type: json
        required: true
        description: "Where to read current CRM records at run time: {kind: web_fetch, url} fetches a connector export over HTTPS, {kind: read_projection, data_source_ref, aggregate_id, resource} reads a CRM event-stream projection, or {kind: inline, records} replays supplied records for deterministic harness runs."
      crm_schema:
        type: object
        required: true
        description: Explicit update authority; fields outside allowed_fields are rejected.
        schema:
          additionalProperties: false
          properties:
            allowed_fields:
              type: array
              minItems: 1
              maxItems: 100
              items: { type: string, minLength: 1, maxLength: 200 }
      write_target:
        type: json
        required: true
        description: "CRM transport for the executed write: {kind: mock, path} writes the reconciled record set to an outbox file through fs.write, sealing a before/after write_result."
    examples:
      - transcript: "Dana said the rollout stalled."
        crm_source:
          kind: inline
          records:
            - id: acct-globex
              account_status: healthy
        crm_schema:
          allowed_fields: [account_status]
        write_target:
          kind: mock
          path: outbox/crm/records.json
    graph:
      name: crm-cleanup-reconcile
      result_from: [record-write, finalize]
      steps:
        - id: read-source
          label: read the current CRM records from their real source
          run:
            type: agent-task
            agent: researcher
            task: crm-cleanup-read
            outputs:
              source_read: object
          inputs:
            crm_source: $input.crm_source
          allowed_tools:
            - web.fetch
            - data.read_projection
          scopes:
            - runx:net:allowlist
            - runx:data:read
          artifacts:
            named_emits:
              source_read: source_read

        - id: digest-transcript
          tool: data.digest
          inputs:
            value: $input.transcript
            encoding: utf8_text

        - id: digest-records
          tool: data.digest
          context:
            value: read-source.source_read.data.records

        - id: reconcile
          label: derive candidate field updates from the transcript
          run:
            type: agent-task
            agent: reviewer
            task: crm-cleanup-reconcile
            outputs:
              update_draft: object
          inputs:
            transcript: $input.transcript
            crm_schema: $input.crm_schema
          context:
            crm_records: read-source.source_read.data.records
          allowed_tools: []
          artifacts:
            named_emits:
              update_draft: update_draft

        - id: finalize
          label: enforce allowlist and transcript traceability deterministically
          inputs:
            transcript: $input.transcript
            crm_schema: $input.crm_schema
            write_target: $input.write_target
          context:
            update_draft: reconcile.update_draft.data
            crm_records: read-source.source_read.data.records
            source_read: read-source.source_read.data
            transcript_digest: digest-transcript.digest_result.data.digest
            records_digest: digest-records.digest_result.data.digest
          run:
            type: javascript
            module: crm-cleanup.mjs
            export: finalizeUpdates
            outputs:
              crm_cleanup:
                type: object
                schema:
                  required: [schema, decision, reason, takeaways, field_updates, rejected_updates, write_plan, source, transcript_digest, records_digest, validation]
                  additionalProperties: false
                  properties:
                    schema: { const: runx.crm_cleanup.v2 }
                    decision: { type: string, enum: [applied, no_action, refused] }
                    reason: { type: string, minLength: 1, maxLength: 2000 }
                    takeaways:
                      type: array
                      maxItems: 100
                      items: { type: string, minLength: 1, maxLength: 2000 }
                    field_updates:
                      type: array
                      maxItems: 200
                      items:
                        type: object
                        required: [record_id, field, from, to, evidence_quote]
                        additionalProperties: false
                        properties:
                          record_id: { type: string, minLength: 1, maxLength: 500 }
                          field: { type: string, minLength: 1, maxLength: 200 }
                          from: {}
                          to: {}
                          evidence_quote: { type: string, minLength: 1, maxLength: 4000 }
                    rejected_updates:
                      type: array
                      maxItems: 200
                      items:
                        type: object
                        required: [record_id, field, reason]
                        additionalProperties: false
                        properties:
                          record_id: { type: [string, "null"], maxLength: 500 }
                          field: { type: string, maxLength: 200 }
                          reason: { type: string, minLength: 1, maxLength: 500 }
                    write_plan:
                      type: object
                      required: [schema, status, transport]
                      additionalProperties: false
                      properties:
                        schema: { const: runx.write_plan.v1 }
                        status: { type: string, enum: [ready, withheld] }
                        transport: { const: mock-crm-outbox }
                        bound_to: { type: string, maxLength: 200 }
                    source:
                      type: object
                      required: [read_kind, fetched_ref]
                      additionalProperties: false
                      properties:
                        read_kind: { type: string, minLength: 1, maxLength: 100 }
                        fetched_ref: { type: string, minLength: 1, maxLength: 2000 }
                    transcript_digest: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
                    records_digest: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
                    validation:
                      type: object
                      required: [status, findings]
                      additionalProperties: false
                      properties:
                        status: { type: string, enum: [pass, fail] }
                        findings:
                          type: array
                          maxItems: 100
                          items:
                            type: object
                            required: [code, message]
                            additionalProperties: false
                            properties:
                              code: { type: string, minLength: 1, maxLength: 200 }
                              message: { type: string, minLength: 1, maxLength: 2000 }
          artifacts:
            named_emits:
              crm_cleanup: crm_cleanup

        - id: prepare-write
          label: bind the decided updates to the mock CRM transport payload
          when:
            field: finalize.crm_cleanup.data.write_plan.status
            equals: ready
          inputs:
            write_target: $input.write_target
          context:
            crm_cleanup: finalize.crm_cleanup.data
            crm_records: read-source.source_read.data.records
          run:
            type: javascript
            module: crm-cleanup.mjs
            export: prepareWrite
            outputs:
              write_draft: object
          artifacts:
            named_emits:
              write_draft: write_draft

        - id: apply-write
          label: execute the decided field updates through the mock CRM transport
          when:
            field: finalize.crm_cleanup.data.write_plan.status
            equals: ready
          tool: fs.write
          scopes: [fs.write]
          context:
            path: prepare-write.write_draft.data.path
            contents: prepare-write.write_draft.data.contents

        - id: record-write
          label: seal the executed write_result bound to the decision
          when:
            field: finalize.crm_cleanup.data.write_plan.status
            equals: ready
          context:
            crm_cleanup: finalize.crm_cleanup.data
            write_draft: prepare-write.write_draft.data
            applied: apply-write.file_write.data
          run:
            type: javascript
            module: crm-cleanup.mjs
            export: recordWrite
            outputs:
              write_result: object
          artifacts:
            named_emits:
              write_result: write_result
