name: dispute-reuses-prior-case-and-charge
kind: graph
target: support/composed.graph
operator_journeys:
  - mode: composed
    exercises_runner: from-evidence
    request: Use the case and original charge just read to prepare and file this approved response.
    expected_outcome: Reuse both real native provider-read packets, draft once, preserve the prepared evidence
      through file, and use only the necessary current-state checks before submission.
    prior_evidence:
      - The capture child reads the exact merchant case and original charge once and returns their actual
        native source packets.
    must_not_repeat:
      - Do not acquire the case/payment again during from-evidence.
      - Do not repeat drafting or original evidence research inside file.
      - Do not accept liability or issue a refund.
setup:
  credentials:
    - stripe
env:
  STRIPE_API_KEY: fixture-stripe-key
caller:
  answers:
    prepare#draft:
      response_draft:
        posture: contest
        summary: The order access log records buyer access to the disputed report. Submit that exact fulfillment
          evidence.
        fields:
          access_activity_log: Report 42 was downloaded by the buyer at 2026-11-03T01:00:00Z.
        citations:
          - field: access_activity_log
            evidence_id: delivery-42
            quote: Report 42 was downloaded by the buyer at 2026-11-03T01:00:00Z.
        open_questions: []
  approvals:
    file#submit: true
  http_exchanges:
    - request:
        method: GET
        url: https://api.stripe.com/v1/account
        body: none
      response:
        status: 200
        headers:
          content-type: application/json
        body: '{"id":"acct_northstar"}'
    - request:
        method: GET
        url: https://api.stripe.com/v1/disputes/du_case42
        body: none
      response:
        status: 200
        headers:
          content-type: application/json
        body: '{"id":"du_case42","charge":"ch_original42","payment_intent":"pi_original42","amount":150,"currency":"usd","reason":"product_not_received","status":"needs_response","evidence_details":{"due_by":1893456000,"past_due":false,"has_evidence":false,"submission_count":0},"evidence":{},"livemode":false}'
    - request:
        method: GET
        url: https://api.stripe.com/v1/account
        body: none
      response:
        status: 200
        headers:
          content-type: application/json
        body: '{"id":"acct_northstar"}'
    - request:
        method: GET
        url: https://api.stripe.com/v1/charges/ch_original42
        body: none
      response:
        status: 200
        headers:
          content-type: application/json
        body: '{"id":"ch_original42","payment_intent":"pi_original42","amount":200,"amount_refunded":0,"currency":"usd","status":"succeeded"}'
    - request:
        method: GET
        url: https://api.stripe.com/v1/account
        body: none
      response:
        status: 200
        headers:
          content-type: application/json
        body: '{"id":"acct_northstar"}'
    - request:
        method: GET
        url: https://api.stripe.com/v1/disputes/du_case42
        body: none
      response:
        status: 200
        headers:
          content-type: application/json
        body: '{"id":"du_case42","charge":"ch_original42","payment_intent":"pi_original42","amount":150,"currency":"usd","reason":"product_not_received","status":"needs_response","evidence_details":{"due_by":1893456000,"past_due":false,"has_evidence":false,"submission_count":0},"evidence":{},"livemode":false}'
    - request:
        method: GET
        url: https://api.stripe.com/v1/charges/ch_original42
        body: none
      response:
        status: 200
        headers:
          content-type: application/json
        body: '{"id":"ch_original42","payment_intent":"pi_original42","amount":200,"amount_refunded":0,"currency":"usd","status":"succeeded"}'
    - request:
        method: POST
        url: https://api.stripe.com/v1/disputes/du_case42
        body:
          text: evidence%5Baccess_activity_log%5D=Report+42+was+downloaded+by+the+buyer+at+2026-11-03T01%3A00%3A00Z.&submit=true
      response:
        status: 200
        headers:
          content-type: application/json
        body: '{"id":"du_case42","charge":"ch_original42","payment_intent":"pi_original42","amount":150,"currency":"usd","reason":"product_not_received","status":"under_review","evidence_details":{"due_by":1893456000,"past_due":false,"has_evidence":true,"submission_count":1},"evidence":{"access_activity_log":"Report
          42 was downloaded by the buyer at 2026-11-03T01:00:00Z."},"livemode":false}'
    - request:
        method: GET
        url: https://api.stripe.com/v1/disputes/du_case42
        body: none
      response:
        status: 200
        headers:
          content-type: application/json
        body: '{"id":"du_case42","charge":"ch_original42","payment_intent":"pi_original42","amount":150,"currency":"usd","reason":"product_not_received","status":"under_review","evidence_details":{"due_by":1893456000,"past_due":false,"has_evidence":true,"submission_count":1},"evidence":{"access_activity_log":"Report
          42 was downloaded by the buyer at 2026-11-03T01:00:00Z."},"livemode":false}'
expect:
  status: sealed
  steps:
    - capture
    - prepare
    - file
  step_outputs:
    file:
      subset:
        filing_result:
          data:
            state: filed
  receipt:
    schema: runx.receipt.v1
    state: sealed
    outcome: completed
