name: stripe-dispute-submits-real-bank-evidence
setup:
  credentials:
    - stripe
inputs:
  dispute_id: du_case42
  evidence:
    - id: delivery-42
      kind: delivery
      content: Report 42 was downloaded by the buyer at 2026-11-03T01:00:00Z.
      source: merchant://orders/42/access-log
env:
  STRIPE_API_KEY: fixture-stripe-key
host:
  answers:
    prepare-auto#draft:
      response_draft:
        posture: contest
        summary: The order access log records buyer access to the disputed report. Submit that exact fulfillment evidence.
        fields:
          access_activity_log: Report 42 was downloaded by the buyer at 2026-11-03T01:00:00Z.
        citations:
          - field: access_activity_log
            evidence_id: delivery-42
            quote: Report 42 was downloaded by the buyer at 2026-11-03T01:00:00Z.
        open_questions: []
  approvals:
    file-auto#submit: true
providers:
  http:
    - request:
        method: GET
        url: https://api.stripe.com/v1/account
        body: none
      response:
        status: 200
        headers:
          content-type: application/json
        body: '{"id":"acct_northstar"}'
