name: dispute-reuses-prior-case-and-charge
package: fixtures/composed
inputs:
  account_id: acct_northstar
  dispute_id: du_case42
  evidence:
    - id: delivery-42
      kind: delivery
      content: Report 42 was downloaded by the buyer at 2026-11-03T01:00:00Z.
      source: merchant://orders/42/access-log
setup:
  credentials:
    - stripe
env:
  STRIPE_API_KEY: fixture-stripe-key
host:
  answers:
    prepare#draft:
      response_draft:
        posture: contest
        summary: The order access log records buyer access to the disputed report. Submit that exact fulfillment evidence.
        fields:
          access_activity_log: Report 42 was downloaded by the buyer at 2026-11-03T01:00:00Z.
        citations:
          - field: access_activity_log
            evidence_id: delivery-42
            quote: Report 42 was downloaded by the buyer at 2026-11-03T01:00:00Z.
        open_questions: []
  approvals:
    file#submit: true
providers:
  http:
    - request:
        method: GET
        url: https://api.stripe.com/v1/account
        body: none
      response:
        status: 200
        headers:
          content-type: application/json
        body: '{"id":"acct_northstar"}'
    - request:
        method: GET
        url: https://api.stripe.com/v1/disputes/du_case42
        body: none
      response:
        status: 200
        headers:
          content-type: application/json
        body: '{"id":"du_case42","charge":"ch_original42","payment_intent":"pi_original42","amount":150,"currency":"usd","reason":"product_not_received","status":"needs_response","evidence_details":{"due_by":1893456000,"past_due":false,"has_evidence":false,"submission_count":0},"evidence":{},"livemode":false}'
    - request:
        method: GET
        url: https://api.stripe.com/v1/account
        body: none
      response:
        status: 200
        headers:
          content-type: application/json
        body: '{"id":"acct_northstar"}'
    - request:
        method: GET
        url: https://api.stripe.com/v1/charges/ch_original42
        body: none
      response:
        status: 200
        headers:
          content-type: application/json
        body: '{"id":"ch_original42","payment_intent":"pi_original42","amount":200,"amount_refunded":0,"currency":"usd","status":"succeeded"}'
    - request:
        method: GET
        url: https://api.stripe.com/v1/account
        body: none
      response:
        status: 200
        headers:
          content-type: application/json
        body: '{"id":"acct_northstar"}'
    - request:
        method: GET
        url: https://api.stripe.com/v1/disputes/du_case42
        body: none
      response:
        status: 200
        headers:
          content-type: application/json
        body: '{"id":"du_case42","charge":"ch_original42","payment_intent":"pi_original42","amount":150,"currency":"usd","reason":"product_not_received","status":"needs_response","evidence_details":{"due_by":1893456000,"past_due":false,"has_evidence":false,"submission_count":0},"evidence":{},"livemode":false}'
    - request:
        method: GET
        url: https://api.stripe.com/v1/charges/ch_original42
        body: none
      response:
        status: 200
        headers:
          content-type: application/json
        body: '{"id":"ch_original42","payment_intent":"pi_original42","amount":200,"amount_refunded":0,"currency":"usd","status":"succeeded"}'
    - request:
        method: POST
        url: https://api.stripe.com/v1/disputes/du_case42
        body:
          text: evidence%5Baccess_activity_log%5D=Report+42+was+downloaded+by+the+buyer+at+2026-11-03T01%3A00%3A00Z.&submit=true
      response:
        status: 200
        headers:
          content-type: application/json
        body: '{"id":"du_case42","charge":"ch_original42","payment_intent":"pi_original42","amount":150,"currency":"usd","reason":"product_not_received","status":"under_review","evidence_details":{"due_by":1893456000,"past_due":false,"has_evidence":true,"submission_count":1},"evidence":{"access_activity_log":"Report 42 was downloaded by the buyer at 2026-11-03T01:00:00Z."},"livemode":false}'
    - request:
        method: GET
        url: https://api.stripe.com/v1/disputes/du_case42
        body: none
      response:
        status: 200
        headers:
          content-type: application/json
        body: '{"id":"du_case42","charge":"ch_original42","payment_intent":"pi_original42","amount":150,"currency":"usd","reason":"product_not_received","status":"under_review","evidence_details":{"due_by":1893456000,"past_due":false,"has_evidence":true,"submission_count":1},"evidence":{"access_activity_log":"Report 42 was downloaded by the buyer at 2026-11-03T01:00:00Z."},"livemode":false}'
expect:
  http_request_counts: [1, 1, 1, 1, 1, 1, 1, 1, 1]
  status: sealed
  steps:
    - capture
    - prepare
    - file
    - preserve
  step_outputs:
    prepare:
      subset:
        prepared_response:
          decision: ready
          account_id: acct_northstar
          dispute_id: du_case42
          acquisition: prior_evidence
          filing_status: not_attempted
          sources:
            - id: delivery-42
              kind: delivery
              content: Report 42 was downloaded by the buyer at 2026-11-03T01:00:00Z.
              source: merchant://orders/42/access-log
          citations:
            - field: access_activity_log
              evidence_id: delivery-42
              quote: Report 42 was downloaded by the buyer at 2026-11-03T01:00:00Z.
          case_evidence:
            operation: dispute.read
            target: stripe://acct_northstar/disputes/du_case42
            finality: confirmed
          charge_evidence:
            operation: payment.stripe.charge.read
            target: stripe://acct_northstar/charges/ch_original42
            finality: confirmed
    preserve:
      subset:
        comparison:
          equal: true
    file:
      subset:
        filing_result:
          state: filed
          account_id: acct_northstar
          dispute_id: du_case42
          findings: []
          provider_evidence:
            operation: dispute.file
            finality: confirmed
            result:
              dispute_id: du_case42
              charge_id: ch_original42
              status: under_review
              submission_count: 1
              evidence:
                access_activity_log: Report 42 was downloaded by the buyer at 2026-11-03T01:00:00Z.
  receipt:
    schema: runx.receipt.v1
    state: sealed
    outcome: completed
