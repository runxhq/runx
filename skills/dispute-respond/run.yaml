skill: dispute-respond
version: "0.5.3"

catalog:
  kind: graph
  audience: operator
  visibility: public
  role: canonical
  runtime_path: dispute-provider
  execution: execute
  completion: provider_readback
  requires_adapter: true
  approval: required
  category: payments

input_definitions:
  dispute_event:
    type: object
    required: true
    description: Normalized provider dispute event with no raw provider fields.
    schema:
      required: [dispute_id, provider, provider_charge_ref, amount_minor, currency, reason_code]
      additionalProperties: false
      properties:
        dispute_id: { type: string, minLength: 1, maxLength: 256, pattern: '^\S+$' }
        provider: { type: string, minLength: 1, maxLength: 64, pattern: '^\S+$' }
        provider_charge_ref: { type: string, minLength: 1, maxLength: 256, pattern: '^\S+$' }
        amount_minor: { type: integer, minimum: 1 }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        reason_code: { type: string, minLength: 1, maxLength: 128, pattern: '^\S+$' }
        response_due_at: { type: string, format: date-time }
  receipt_ids:
    type: array
    required: false
    description: Up to 100 unique opaque Runx receipt ids for prior refunds.
    schema:
      maxItems: 100
      uniqueItems: true
      items: { type: string, minLength: 1, maxLength: 256, pattern: '^\S+$' }
  evidence_refs:
    type: array
    required: false
    description: Up to 100 digest-bound evidence references supporting the response.
    schema:
      maxItems: 100
      items:
        type: object
        required: [ref, digest, kind, summary]
        additionalProperties: false
        properties:
          ref: { type: string, minLength: 1, maxLength: 512, pattern: '^\S+$' }
          digest: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
          kind: { type: string, enum: [delivery, consent, support, provider, contract, refund] }
          summary: { type: string, minLength: 1, maxLength: 1000 }

connectors:
  dispute:
    operations: [dispute.file, dispute.read]
    connector_from: $input.provider
    allowed_connectors: [stripe]
runners:
  file-response:
    default: true
    inputs:
      dispute_event:
        definition: dispute_event
      original_receipt_id:
        type: string
        required: true
        description: Exact Runx receipt id for the original charge.
        schema: { minLength: 1, maxLength: 256, pattern: '^\S+$' }
      prior_refund_receipt_ids:
        definition: receipt_ids
      evidence_refs:
        definition: evidence_refs
      operator_posture:
        type: string
        required: false
        schema: { enum: [accept, contest, refund_already_sent, needs_more_evidence, operator_review] }
    result_from: [respond, file]
    steps:
      - id: respond
        skill: .
        runner: respond
        inputs:
          dispute_event: $input.dispute_event
          original_receipt_id: $input.original_receipt_id
          prior_refund_receipt_ids: $input.prior_refund_receipt_ids
          evidence_refs: $input.evidence_refs
          operator_posture: $input.operator_posture
      - id: file
        when:
          field: respond.dispute_packet.data.decision
          equals: ready_for_review
        skill: .
        runner: file
        inputs:
          provider: $input.dispute_event.provider
          idempotency_key: $input.dispute_event.dispute_id
        context:
          dispute_packet: respond.dispute_packet.data

  respond:
    inputs:
      dispute_event:
        definition: dispute_event
      original_receipt_id:
        type: string
        required: true
        description: Exact Runx receipt id for the original charge.
        schema: { minLength: 1, maxLength: 256, pattern: '^\S+$' }
      prior_refund_receipt_ids:
        definition: receipt_ids
      evidence_refs:
        definition: evidence_refs
      operator_posture:
        type: string
        required: false
        description: Optional preferred posture; evidence remains authoritative.
        schema:
          enum: [accept, contest, refund_already_sent, needs_more_evidence, operator_review]
    examples:
      - dispute_event:
          dispute_id: dp_demo_001
          provider: stripe
          provider_charge_ref: ch_demo_001
          amount_minor: 1250
          currency: USD
          reason_code: product_not_received
        original_receipt_id: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        prior_refund_receipt_ids: []
        evidence_refs: []
        operator_posture: operator_review
    result_from: [finalize, stop]
    steps:
      - id: admit
        inputs:
          dispute_event: $input.dispute_event
          original_receipt_id: $input.original_receipt_id
          prior_refund_receipt_ids: $input.prior_refund_receipt_ids
          evidence_refs: $input.evidence_refs
          operator_posture: $input.operator_posture
        tool: { module: dispute-respond.mjs, export: admitDispute }
        outputs:
          dispute_context: object
        artifacts:
          named_emits:
            dispute_context: dispute_context

      - id: evidence
        when:
          field: admit.dispute_context.data.path
          equals: review
        tool: receipt.prove
        scopes:
          - receipt.read
        context:
          receipt_ids: admit.dispute_context.data.receipt_ids

      - id: draft
        when:
          field: admit.dispute_context.data.path
          equals: review
        agent: { role: operator, task: dispute-response-draft }
        outputs:
          response_draft: object
        context:
          dispute_context: admit.dispute_context.data
          receipt_proof: evidence.receipt_proof.data
        artifacts:
          named_emits:
            response_draft: response_draft

      - id: finalize
        when:
          field: admit.dispute_context.data.path
          equals: review
        context:
          dispute_context: admit.dispute_context.data
          receipt_proof: evidence.receipt_proof.data
          response_draft: draft.response_draft.data
        tool: { module: dispute-respond.mjs, export: finalizeResponse }
        outputs:
          dispute_packet:
            type: object
            schema:
              required: [schema, decision, dispute, posture, response_summary, linked_receipts, evidence, open_questions, receipt_verification, validation, filing, next_action]
              additionalProperties: false
              properties:
                schema: { const: runx.payment.dispute_response.v1 }
                decision: { type: string, enum: [ready_for_review, needs_more_evidence] }
                dispute:
                  type: object
                  required: [dispute_id, provider, provider_charge_ref, amount_minor, currency, reason_code, response_due_at]
                  additionalProperties: false
                  properties:
                    dispute_id: { type: string, maxLength: 256 }
                    provider: { type: string, maxLength: 64 }
                    provider_charge_ref: { type: string, maxLength: 256 }
                    amount_minor: { type: [integer, 'null'], minimum: 1 }
                    currency: { type: string, pattern: '^(?:[A-Z]{3})?$' }
                    reason_code: { type: string, maxLength: 128 }
                    response_due_at: { type: [string, 'null'], maxLength: 64 }
                posture: { type: string, enum: [accept, contest, refund_already_sent, needs_more_evidence, operator_review] }
                response_summary: { type: string, maxLength: 10000 }
                linked_receipts:
                  type: object
                  required: [original_charge, prior_refunds, cited]
                  additionalProperties: false
                  properties:
                    original_charge: { type: string, maxLength: 256 }
                    prior_refunds: { type: array, maxItems: 100, uniqueItems: true, items: { type: string, minLength: 1, maxLength: 256 } }
                    cited: { type: array, maxItems: 101, uniqueItems: true, items: { type: string, minLength: 1, maxLength: 256 } }
                evidence:
                  type: object
                  required: [admitted, cited_refs]
                  additionalProperties: false
                  properties:
                    admitted:
                      type: array
                      maxItems: 100
                      items:
                        type: object
                        required: [ref, digest, kind, summary]
                        additionalProperties: false
                        properties:
                          ref: { type: string, minLength: 1, maxLength: 512 }
                          digest: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
                          kind: { type: string, enum: [delivery, consent, support, provider, contract, refund] }
                          summary: { type: string, minLength: 1, maxLength: 1000 }
                    cited_refs: { type: array, maxItems: 100, uniqueItems: true, items: { type: string, minLength: 1, maxLength: 512 } }
                open_questions: { type: array, maxItems: 100, items: { type: string, minLength: 1, maxLength: 1000 } }
                receipt_verification:
                  type: object
                  required: [matched_receipt_ids, original_receipt_status, signature_mode, tree_status]
                  additionalProperties: false
                  properties:
                    matched_receipt_ids: { type: array, maxItems: 101, uniqueItems: true, items: { type: string, minLength: 1, maxLength: 256 } }
                    original_receipt_status: { type: string, minLength: 1, maxLength: 100 }
                    signature_mode: { type: string, enum: [production, local-development, unverified] }
                    tree_status: { type: string, enum: [intact, unverified] }
                validation:
                  type: object
                  required: [status, findings]
                  additionalProperties: false
                  properties:
                    status: { type: string, enum: [pass, fail] }
                    findings:
                      type: array
                      maxItems: 500
                      items:
                        type: object
                        required: [code, message]
                        additionalProperties: false
                        properties:
                          code: { type: string, minLength: 1, maxLength: 200 }
                          message: { type: string, minLength: 1, maxLength: 4000 }
                filing:
                  type: object
                  required: [provider, dispute_id, status, provider_status, approval_status]
                  additionalProperties: false
                  properties:
                    provider: { type: string, maxLength: 64 }
                    dispute_id: { type: string, maxLength: 256 }
                    status: { const: not_filed }
                    provider_status: { const: not_called }
                    approval_status: { const: not_requested }
                next_action: { type: string, minLength: 1, maxLength: 4000 }
        artifacts:
          named_emits:
            dispute_packet: dispute_packet
          packets:
            dispute_packet: runx.payment.dispute_response.v1

      - id: stop
        when:
          field: admit.dispute_context.data.path
          equals: stop
        context:
          dispute_context: admit.dispute_context.data
        tool: { module: dispute-respond.mjs, export: finalizeResponse }
        outputs:
          dispute_packet: object
        artifacts:
          named_emits:
            dispute_packet: dispute_packet
          packets:
            dispute_packet: runx.payment.dispute_response.v1

  file:
    inputs:
      dispute_packet:
        type: json
        packet: runx.payment.dispute_response.v1
        required: true
        description: Exact validated runx.payment.dispute_response.v1 packet produced by respond.
      provider:
        type: string
        required: true
        description: Expected configured payment provider name.
      idempotency_key:
        type: string
        required: true
        description: Stable retry key for this exact dispute filing.
    examples:
      - dispute_packet:
          schema: runx.payment.dispute_response.v1
          decision: ready_for_review
          dispute:
            dispute_id: dp_demo_001
            provider: stripe
            provider_charge_ref: ch_demo_001
            amount_minor: 1250
            currency: USD
            reason_code: product_not_received
            response_due_at: null
          posture: contest
          response_summary: Contest with the linked verified delivery evidence.
          linked_receipts:
            original_charge: receipt:charge:demo-001
            prior_refunds: []
            cited: [receipt:charge:demo-001]
          evidence: { admitted: [], cited_refs: [] }
          open_questions: []
          receipt_verification:
            matched_receipt_ids: [receipt:charge:demo-001]
            original_receipt_status: verified
            signature_mode: production
            tree_status: intact
          validation: { status: pass, findings: [] }
          filing:
            provider: stripe
            dispute_id: dp_demo_001
            status: not_filed
            provider_status: not_called
            approval_status: not_requested
          next_action: review, then route through an approved provider dispute adapter
        provider: stripe
        idempotency_key: dispute:dp_demo_001:file:v1
    result_from: [readback]
    steps:
      - id: validate
        tool: data.compare
        inputs:
          actual:
            schema: $input.dispute_packet.schema
            decision: $input.dispute_packet.decision
            validation_status: $input.dispute_packet.validation.status
            provider: $input.dispute_packet.filing.provider
            filing_status: $input.dispute_packet.filing.status
            provider_status: $input.dispute_packet.filing.provider_status
            approval_status: $input.dispute_packet.filing.approval_status
          expected:
            schema: runx.payment.dispute_response.v1
            decision: ready_for_review
            validation_status: pass
            provider: $input.provider
            filing_status: not_filed
            provider_status: not_called
            approval_status: not_requested

      - id: digest-request
        when:
          field: validate.comparison.data.equal
          equals: true
        tool: data.digest
        inputs:
          value: $input.dispute_packet

      - id: file-response
        when:
          field: validate.comparison.data.equal
          equals: true
        operation: dispute/dispute.file
        idempotency_key: $input.idempotency_key
        approval:
          reason: Approve filing this exact dispute response with the provider.
          type: dispute_response
        expected_result:
          dispute_id: $input.dispute_packet.dispute.dispute_id
        result_fields: [dispute_id, filing_ref, request_digest, status]
        input:
          dispute_packet: $input.dispute_packet

      - id: bind-request
        when:
          field: validate.comparison.data.equal
          equals: true
        tool: data.compare
        context:
          expected: digest-request.digest_result.data.digest
          actual: file-response.provider_operation.data.result.request_digest

      - id: readback
        when:
          field: bind-request.comparison.data.equal
          equals: true
        operation: dispute/dispute.read
        result_fields: [dispute_id, filing_ref, request_digest, status]
        context:
          expected_result: file-response.provider_operation.data.result
          input: file-response.provider_operation.data.result
