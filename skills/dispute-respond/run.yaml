version: "0.6.6"
minimum_runx: 0.12.0
default_method: file-response
catalog:
  visibility: public
  category: payments
shared_inputs:
  dispute_id:
    type: string
    description: Exact Stripe dispute ID from the merchant case or webhook.
    pattern: ^du_[A-Za-z0-9]{1,128}$
  evidence:
    type: array
    default: []
    description: "Relevant source content for this case: actual delivery/access logs, consent, policy, communications, or existing refund evidence. Selected bounded records, not an entire archive. Caller-supplied material is not independently verified."
    items:
      type: object
      additionalProperties: false
      required:
        - id
        - kind
        - content
        - source
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 256
        kind:
          enum:
            - delivery
            - consent
            - support
            - contract
            - refund
            - other
        content:
          type: string
          minLength: 1
        source:
          type: string
          minLength: 1
    optional: true
  case_evidence:
    description: Actual prior stripe/dispute.read native provider-operation packet, retained with its original receipt. No new read is claimed.
  charge_evidence:
    description: Actual prior stripe/payment.stripe.charge.read packet for the disputed original charge, retained with its receipt.
  prepared_response:
    packet: runx/dispute-respond.response.v1
    description: An unchanged ready prepared response. Its exact request is revalidated and the current provider case/payment state is checked before submission.
methods:
  file-response:
    description: Read one selected Stripe dispute and its original charge, prepare a relevant grounded response, then submit only a ready exact packet after native approval and independent readback.
    inputs:
      account_id:
        type: string
        default: ""
        description: Selected Stripe account ID. Omit to resolve the selected credential’s actual merchant account.
        pattern: ^(?:acct_[A-Za-z0-9]{1,64})?$
        optional: true
      dispute_id: {}
      evidence: {}
    examples:
      - dispute_id: du_case42
        evidence: []
    result_from:
      - prepare-known
      - prepare-auto
      - file-known
      - file-auto
    steps:
      - id: account
        when:
          value: $input.account_id
          equals: ""
        operation: stripe/account.read
        inputs: {}
      - id: prepare-known
        when:
          value: $input.account_id
          not_equals: ""
        skill: .#respond
        inputs:
          account_id: $input.account_id
          dispute_id: $input.dispute_id
          evidence: $input.evidence
        outputs:
          prepared_response: {type: object, packet: runx/dispute-respond.response.v1}
      - id: prepare-auto
        when:
          value: $input.account_id
          equals: ""
        skill: .#respond
        inputs:
          account_id: $steps.account.provider_operation.result.account_id
          dispute_id: $input.dispute_id
          evidence: $input.evidence
        outputs:
          prepared_response: {type: object, packet: runx/dispute-respond.response.v1}
      - id: file-known
        when:
          value: $steps.prepare-known.prepared_response.decision
          equals: ready
        skill: .#file
        inputs:
          prepared_response: $steps.prepare-known.prepared_response
        outputs:
          filing_result: {type: object, packet: runx/dispute-respond.filing.v1}
      - id: file-auto
        when:
          value: $steps.prepare-auto.prepared_response.decision
          equals: ready
        skill: .#file
        inputs:
          prepared_response: $steps.prepare-auto.prepared_response
        outputs:
          filing_result: {type: object, packet: runx/dispute-respond.filing.v1}
  respond:
    description: Read the merchant case and original charge and prepare an unsent response. Holds with specific missing evidence; never files, concedes or refunds.
    inputs:
      account_id:
        type: string
        description: Selected Stripe account ID. Omit to resolve the selected credential’s actual merchant account.
        pattern: ^acct_[A-Za-z0-9]{1,64}$
      dispute_id: {}
      evidence: {}
    result_from:
      - prepare
      - held
    steps:
      - id: context
        skill: .#capture
        inputs:
          account_id: $input.account_id
          dispute_id: $input.dispute_id
          evidence: $input.evidence
      - id: draft
        when:
          value: $steps.context.case_context.actionable
          equals: true
        agent: dispute-response-draft
        inputs:
          case_context: $steps.context.case_context
        outputs:
          response_draft:
            type: object
            properties:
              posture:
                type: string
              summary:
                type: string
              fields:
                type: object
                properties:
                  access_activity_log:
                    type: string
              citations:
                type: array
                items:
                  type: object
                  properties:
                    field:
                      type: string
                    evidence_id:
                      type: string
                    quote:
                      type: string
              open_questions:
                type: array
                items:
                  type: string
            required:
              - posture
              - summary
              - fields
              - citations
              - open_questions
      - id: prepare
        tool:
          module: dispute-respond.mjs
          export: prepareResponse
        inputs:
          case_context: $steps.context.case_context
          response_draft: $steps.draft.response_draft
        outputs:
          prepared_response: {type: object, packet: runx/dispute-respond.response.v1}
        when:
          value: $steps.context.case_context.actionable
          equals: true
      - id: held
        tool:
          module: dispute-respond.mjs
          export: prepareResponse
        inputs:
          case_context: $steps.context.case_context
        outputs:
          prepared_response: {type: object, packet: runx/dispute-respond.response.v1}
        when:
          value: $steps.context.case_context.actionable
          equals: false
  from-evidence:
    description: Prepare a response from exact prior merchant case and charge evidence without repeating provider acquisition or filing.
    inputs:
      dispute_id: {}
      evidence: {}
      case_evidence: {}
      charge_evidence: {}
      account_id:
        type: string
        description: Selected Stripe account ID. Omit to resolve the selected credential’s actual merchant account.
        pattern: ^acct_[A-Za-z0-9]{1,64}$
    result_from:
      - prepare
      - held
    steps:
      - id: clock
        tool: control.observed_at
        outputs:
          observed_at: {type: string}
      - id: context
        tool:
          module: dispute-respond.mjs
          export: prepareContext
        inputs:
          account_id: $input.account_id
          dispute_id: $input.dispute_id
          case_evidence: $input.case_evidence
          charge_evidence: $input.charge_evidence
          observed_at: $steps.clock.observed_at
          evidence: $input.evidence
          acquisition: prior_evidence
        outputs:
          case_context: {type: object}
      - id: draft
        when:
          value: $steps.context.case_context.actionable
          equals: true
        agent: dispute-response-draft
        inputs:
          case_context: $steps.context.case_context
        outputs:
          response_draft:
            type: object
            properties:
              posture:
                type: string
              summary:
                type: string
              fields:
                type: object
                properties:
                  access_activity_log:
                    type: string
              citations:
                type: array
                items:
                  type: object
                  properties:
                    field:
                      type: string
                    evidence_id:
                      type: string
                    quote:
                      type: string
              open_questions:
                type: array
                items:
                  type: string
            required:
              - posture
              - summary
              - fields
              - citations
              - open_questions
      - id: prepare
        tool:
          module: dispute-respond.mjs
          export: prepareResponse
        inputs:
          case_context: $steps.context.case_context
          response_draft: $steps.draft.response_draft
        outputs:
          prepared_response: {type: object, packet: runx/dispute-respond.response.v1}
        when:
          value: $steps.context.case_context.actionable
          equals: true
      - id: held
        tool:
          module: dispute-respond.mjs
          export: prepareResponse
        inputs:
          case_context: $steps.context.case_context
        outputs:
          prepared_response: {type: object, packet: runx/dispute-respond.response.v1}
        when:
          value: $steps.context.case_context.actionable
          equals: false
  file:
    description: Continue one ready prepared response. Revalidate it, use current provider case and refund-state preconditions, request one exact native approval, submit once, then verify exact evidence readback. No repeated drafting or source research.
    inputs:
      prepared_response: {}
    result_from:
      - confirm
    steps:
      - id: clock
        tool: control.observed_at
        outputs:
          observed_at: {type: string}
      - id: admit
        tool:
          module: dispute-respond.mjs
          export: admitFiling
        inputs:
          prepared_response: $input.prepared_response
          observed_at: $steps.clock.observed_at
        outputs:
          filing: {type: object}
      - id: identity
        tool: data.digest
        inputs:
          encoding: canonical_json
          value: $steps.admit.filing.request
      - id: submit
        operation: stripe/dispute.file
        inputs: $steps.admit.filing.request
        idempotency_key: $steps.identity.digest_result.digest
        approval:
          reason: Submit this exact evidence to the bank for this merchant dispute. Review the complete evidence fields; submission may be final.
          type: dispute_evidence_submission
      - id: confirm
        tool:
          module: dispute-respond.mjs
          export: confirmFiling
        inputs:
          filing: $steps.admit.filing
          provider_result: $steps.submit.provider_operation
        outputs:
          filing_result: {type: object, packet: runx/dispute-respond.filing.v1}
  capture:
    description: Read the exact selected merchant dispute and original charge once. Return case_context and actual native source packets for a workflow; no drafting or submission.
    inputs:
      account_id:
        type: string
        description: Selected Stripe account ID. Omit to resolve the selected credential’s actual merchant account.
        pattern: ^acct_[A-Za-z0-9]{1,64}$
      dispute_id: {}
      evidence: {}
    result_from:
      - context
    steps:
      - id: case
        operation: stripe/dispute.read
        inputs:
          account_id: $input.account_id
          dispute_id: $input.dispute_id
      - id: charge-target
        tool:
          module: dispute-respond.mjs
          export: chargeTarget
        inputs:
          merchant:
            account_id: $input.account_id
            dispute_id: $input.dispute_id
          case_evidence: $steps.case.provider_operation
        outputs:
          charge_target: {type: object}
      - id: charge
        operation: stripe/payment.stripe.charge.read
        inputs: $steps.charge-target.charge_target
      - id: clock
        tool: control.observed_at
        outputs:
          observed_at: {type: string}
      - id: context
        tool:
          module: dispute-respond.mjs
          export: prepareContext
        inputs:
          account_id: $input.account_id
          dispute_id: $input.dispute_id
          case_evidence: $steps.case.provider_operation
          charge_evidence: $steps.charge.provider_operation
          observed_at: $steps.clock.observed_at
          evidence: $input.evidence
          acquisition: provider_read
        outputs:
          case_context: {type: object}
