skill: dispute-respond
version: "0.6.3"

catalog:
  kind: graph
  audience: operator
  visibility: public
  role: canonical
  execution: read
  completion: runtime_receipt
  approval: none
  category: payments

input_definitions:
  dispute_event:
    type: object
    required: true
    description: Normalized provider dispute event with no raw provider fields.
    schema:
      required: [dispute_id, provider, provider_charge_ref, amount_minor, currency, reason_code]
      additionalProperties: false
      properties:
        dispute_id: { type: string, minLength: 1, maxLength: 256, pattern: '^\S+$' }
        provider: { type: string, minLength: 1, maxLength: 64, pattern: '^\S+$' }
        provider_charge_ref: { type: string, minLength: 1, maxLength: 256, pattern: '^\S+$' }
        amount_minor: { type: integer, minimum: 1 }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        reason_code: { type: string, minLength: 1, maxLength: 128, pattern: '^\S+$' }
        response_due_at: { type: string, format: date-time }
  receipt_ids:
    type: array
    required: false
    description: Up to 100 unique opaque Runx receipt ids for prior refunds.
    schema:
      maxItems: 100
      uniqueItems: true
      items: { type: string, minLength: 1, maxLength: 256, pattern: '^\S+$' }
  evidence_refs:
    type: array
    required: false
    description: Up to 100 digest-bound evidence references supporting the response.
    schema:
      maxItems: 100
      items:
        type: object
        required: [ref, digest, kind, summary]
        additionalProperties: false
        properties:
          ref: { type: string, minLength: 1, maxLength: 512, pattern: '^\S+$' }
          digest: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
          kind: { type: string, enum: [delivery, consent, support, provider, contract, refund] }
          summary: { type: string, minLength: 1, maxLength: 1000 }

runners:
  respond:
    default: true
    inputs:
      dispute_event:
        definition: dispute_event
      original_receipt_id:
        type: string
        required: true
        description: Exact Runx receipt id for the original charge.
        schema: { minLength: 1, maxLength: 256, pattern: '^\S+$' }
      prior_refund_receipt_ids:
        definition: receipt_ids
      evidence_refs:
        definition: evidence_refs
      operator_posture:
        type: string
        required: false
        description: Optional preferred posture; evidence remains authoritative.
        schema:
          enum: [accept, contest, refund_already_sent, needs_more_evidence, operator_review]
    examples:
      - dispute_event:
          dispute_id: dp_demo_001
          provider: stripe
          provider_charge_ref: ch_demo_001
          amount_minor: 1250
          currency: USD
          reason_code: product_not_received
        original_receipt_id: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        prior_refund_receipt_ids: []
        evidence_refs: []
        operator_posture: operator_review
    result_from: [finalize, stop]
    steps:
      - id: admit
        inputs:
          dispute_event: $input.dispute_event
          original_receipt_id: $input.original_receipt_id
          prior_refund_receipt_ids: $input.prior_refund_receipt_ids
          evidence_refs: $input.evidence_refs
          operator_posture: $input.operator_posture
        tool: { module: dispute-respond.mjs, export: admitDispute }
        outputs:
          dispute_context: object
        artifacts:
          named_emits:
            dispute_context: dispute_context

      - id: evidence
        when:
          value: $steps.admit.dispute_context.path
          equals: review
        tool: receipt.prove
        scopes:
          - receipt.read
        inputs:
          receipt_ids: $steps.admit.dispute_context.receipt_ids

      - id: draft
        when:
          value: $steps.admit.dispute_context.path
          equals: review
        agent: { role: operator, task: dispute-response-draft }
        outputs:
          response_draft: object
        inputs:
          dispute_context: $steps.admit.dispute_context
          receipt_proof: $steps.evidence.receipt_proof
          dispute_event: $input.dispute_event
          original_receipt_id: $input.original_receipt_id
          prior_refund_receipt_ids: $input.prior_refund_receipt_ids
          evidence_refs: $input.evidence_refs
          operator_posture: $input.operator_posture
        artifacts:
          named_emits:
            response_draft: response_draft

      - id: finalize
        when:
          value: $steps.admit.dispute_context.path
          equals: review
        inputs:
          dispute_context: $steps.admit.dispute_context
          receipt_proof: $steps.evidence.receipt_proof
          response_draft: $steps.draft.response_draft
        tool: { module: dispute-respond.mjs, export: finalizeResponse }
        outputs:
          dispute_packet:
            type: object
            schema:
              required: [schema, decision, dispute, posture, response_summary, linked_receipts, evidence, open_questions, receipt_verification, validation, filing, next_action]
              additionalProperties: false
              properties:
                schema: { const: runx.payment.dispute_response.v1 }
                decision: { type: string, enum: [ready_for_review, needs_more_evidence] }
                dispute:
                  type: object
                  required: [dispute_id, provider, provider_charge_ref, amount_minor, currency, reason_code, response_due_at]
                  additionalProperties: false
                  properties:
                    dispute_id: { type: string, maxLength: 256 }
                    provider: { type: string, maxLength: 64 }
                    provider_charge_ref: { type: string, maxLength: 256 }
                    amount_minor: { type: [integer, 'null'], minimum: 1 }
                    currency: { type: string, pattern: '^(?:[A-Z]{3})?$' }
                    reason_code: { type: string, maxLength: 128 }
                    response_due_at: { type: [string, 'null'], maxLength: 64 }
                posture: { type: string, enum: [accept, contest, refund_already_sent, needs_more_evidence, operator_review] }
                response_summary: { type: string, maxLength: 10000 }
                linked_receipts:
                  type: object
                  required: [original_charge, prior_refunds, cited]
                  additionalProperties: false
                  properties:
                    original_charge: { type: string, maxLength: 256 }
                    prior_refunds: { type: array, maxItems: 100, uniqueItems: true, items: { type: string, minLength: 1, maxLength: 256 } }
                    cited: { type: array, maxItems: 101, uniqueItems: true, items: { type: string, minLength: 1, maxLength: 256 } }
                evidence:
                  type: object
                  required: [admitted, cited_refs]
                  additionalProperties: false
                  properties:
                    admitted:
                      type: array
                      maxItems: 100
                      items:
                        type: object
                        required: [ref, digest, kind, summary]
                        additionalProperties: false
                        properties:
                          ref: { type: string, minLength: 1, maxLength: 512 }
                          digest: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
                          kind: { type: string, enum: [delivery, consent, support, provider, contract, refund] }
                          summary: { type: string, minLength: 1, maxLength: 1000 }
                    cited_refs: { type: array, maxItems: 100, uniqueItems: true, items: { type: string, minLength: 1, maxLength: 512 } }
                open_questions: { type: array, maxItems: 100, items: { type: string, minLength: 1, maxLength: 1000 } }
                receipt_verification:
                  type: object
                  required: [matched_receipt_ids, original_receipt_status, issuer_types, tree_status]
                  additionalProperties: false
                  properties:
                    matched_receipt_ids: { type: array, maxItems: 101, uniqueItems: true, items: { type: string, minLength: 1, maxLength: 256 } }
                    original_receipt_status: { type: string, minLength: 1, maxLength: 100 }
                    issuer_types: { type: array, maxItems: 101, items: { type: string, enum: [local, hosted, ci] } }
                    tree_status: { type: string, enum: [intact, unverified] }
                validation:
                  type: object
                  required: [status, findings]
                  additionalProperties: false
                  properties:
                    status: { type: string, enum: [pass, fail] }
                    findings:
                      type: array
                      maxItems: 500
                      items:
                        type: object
                        required: [code, message]
                        additionalProperties: false
                        properties:
                          code: { type: string, minLength: 1, maxLength: 200 }
                          message: { type: string, minLength: 1, maxLength: 4000 }
                filing:
                  type: object
                  required: [provider, dispute_id, status, provider_status, approval_status]
                  additionalProperties: false
                  properties:
                    provider: { type: string, maxLength: 64 }
                    dispute_id: { type: string, maxLength: 256 }
                    status: { const: not_filed }
                    provider_status: { const: not_called }
                    approval_status: { const: not_requested }
                next_action: { type: string, minLength: 1, maxLength: 4000 }
        artifacts:
          named_emits:
            dispute_packet: dispute_packet
          packets:
            dispute_packet: runx.payment.dispute_response.v1

      - id: stop
        when:
          value: $steps.admit.dispute_context.path
          equals: stop
        inputs:
          dispute_context: $steps.admit.dispute_context
        tool: { module: dispute-respond.mjs, export: finalizeResponse }
        outputs:
          dispute_packet: object
        artifacts:
          named_emits:
            dispute_packet: dispute_packet
          packets:
            dispute_packet: runx.payment.dispute_response.v1

harness:
  files: [fixtures/support/composed.graph]
  cases: []
