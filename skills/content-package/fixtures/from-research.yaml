inputs: {"objective":"Should a domain operator move its skill loop and state into Runx Cloud when it uses hosted connectors? Explain the ownership and integration consequences from the supplied conventions.","research_packet":{"decision":"ready","decision_support":[{"option":"Keep loop state and scheduling in the owning local operator; bind hosted provider execution only where explicitly selected.","rationale":"The conventions separately assign product residency, native execution and portable hosted provider implementations. This keeps the chosen connector from changing who owns the operator.","source_digests":["sha256:ca0e40760e18ba1f1187fe9d86ae0e9af7209ee58254594fb621247b3fe328db"]}],"evidence_log":[{"claim":"Products own persistence, agent loops and scheduling; the client root only invokes finite native commands.","confidence":"verified","content_digest":"sha256:ca0e40760e18ba1f1187fe9d86ae0e9af7209ee58254594fb621247b3fe328db","relevance":"This assigns residency and durable state to the operator product rather than the invocation client or hosted connector.","source_digest":"sha256:ca0e40760e18ba1f1187fe9d86ae0e9af7209ee58254594fb621247b3fe328db"},{"claim":"Hosted adapters are optional implementations of provider-operation contracts and cannot become a prerequisite for otherwise portable skills.","confidence":"verified","content_digest":"sha256:ca0e40760e18ba1f1187fe9d86ae0e9af7209ee58254594fb621247b3fe328db","relevance":"Selecting a hosted credential/transport implementation does not require moving the operator into Runx Cloud.","source_digest":"sha256:ca0e40760e18ba1f1187fe9d86ae0e9af7209ee58254594fb621247b3fe328db"},{"claim":"OSS packages must not import Cloud code, and the public TypeScript path runs through the client and shared contracts.","confidence":"verified","content_digest":"sha256:ca0e40760e18ba1f1187fe9d86ae0e9af7209ee58254594fb621247b3fe328db","relevance":"The integration should use the existing public native invocation boundary rather than coupling the operator to private Cloud implementation.","source_digest":"sha256:ca0e40760e18ba1f1187fe9d86ae0e9af7209ee58254594fb621247b3fe328db"}],"index_digest":"sha256:4a3cd4d6c5116ca170c5f9d365d346b7d0811434ea591c0e9447dcefb08a1160","research_brief":{"objective":"Should a domain operator move its skill loop and state into Runx Cloud when it uses hosted connectors? Explain the ownership and integration consequences from the supplied conventions.","open_questions":["The supplied conventions do not specify the exact Cloud API routes or service limits; inspect those contracts before wiring a hosted binding."],"scope":"Current OSS architecture conventions, read natively from a copy of the current source document; this is a design decision, not an implementation audit.","summary":"Keep the operator loop and durable state in its owning product. A hosted connector is an optional implementation of a provider capability and does not transfer orchestration ownership. Invoke the native runtime through the public client boundary, carrying bounded authority and receipt-backed results across each turn."},"risks":[{"risk":"Source conventions are documentary evidence; this run has not audited an implemented product or deployed Cloud service."}],"source_evidence":[{"content_digest":"sha256:ca0e40760e18ba1f1187fe9d86ae0e9af7209ee58254594fb621247b3fe328db","evidence_digest":"sha256:ca0e40760e18ba1f1187fe9d86ae0e9af7209ee58254594fb621247b3fe328db","provenance":{"bytes":13204,"observed_at":"2026-11-03T02:17:54.631Z","path":"runx-conventions.md"},"source_kind":"local_file","source_uri":"file:runx-conventions.md"}],"validation":{"findings":[],"status":"pass"}}}
