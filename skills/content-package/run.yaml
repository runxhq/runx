skill: content-package
version: "0.4.8"
catalog:
  kind: graph
  audience: public
  visibility: public
  role: context
  execution: read
  completion: runtime_receipt
  approval: none
  category: content

harness:
  files: [fixtures/support/composed.graph]
  cases:
    - name: content-package-produces-bound-draft
      runner: content-package
      operator_journeys:
        - mode: standalone
          confusors: [ghostwrite, research-brief]
          request: Turn this governed evidence into a citation-bound draft and channel package.
          expected_outcome: Return reader-facing copy, citations, and a provider-neutral publication handoff without claiming publication.
        - mode: composed
          request: Package this completed research evidence for publication channels.
          expected_outcome: Reuse the supplied research packet and source bindings without repeating research or publication planning.
          prior_evidence:
            - The governed research evidence and source bindings supplied in the fixture.
          must_not_repeat:
            - Do not rerun research.
            - Do not reacquire cited sources or publish the resulting handoff.
      inputs:
        objective: Identify the strongest architectural signal in the supplied Runx evidence.
        audience: operators
        channel: brief
        domain: agent infrastructure
        publication_target:
          provider: example
          destination: operator-review-queue
        boundary_kind: external
        source_packets:
          - decision: ready
            final_url: https://example.com/receipts
            status: 200
            content_digest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
            extracted: Runx receipts bind operator actions to explicit authority and verification evidence.
            provenance:
              fetched_at: "2026-07-17T00:00:00Z"
              bytes: 82
              truncated: false
              redirects: []
          - decision: ready
            final_url: https://example.com/skills
            status: 200
            content_digest: sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
            extracted: Portable skill packages separate model judgment from deterministic provider operations.
            provenance:
              fetched_at: "2026-07-17T00:01:00Z"
              bytes: 85
              truncated: false
              redirects: []
      caller:
        answers:
          synthesize:
            research_candidate:
              decision: ready
              research_brief:
                objective: Identify the strongest architectural signal in the supplied Runx evidence.
                scope: agent infrastructure
                summary: The strongest signal is evidence-bound execution packaged behind portable skills.
                open_questions: []
              evidence_log:
                - claim: Receipts bind actions to authority and verification evidence.
                  source_digest: sha256:9056e1b5caa4e78583d0bc47bb731468b31155929a3aa3a35fcadf6136534a36
                  content_digest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
                  confidence: verified
                  relevance: Establishes the governance half of the architecture.
                - claim: Portable skills separate judgment from deterministic operations.
                  source_digest: sha256:c951e0e102215f739709aa280773536f95d4560e1299999af9c2362db6a118dc
                  content_digest: sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
                  confidence: verified
                  relevance: Establishes the packaging and execution half.
              decision_support:
                - option: Lead with evidence-bound portable execution.
                  rationale: Both supplied sources support the combined architecture.
                  source_digests:
                    - sha256:9056e1b5caa4e78583d0bc47bb731468b31155929a3aa3a35fcadf6136534a36
                    - sha256:c951e0e102215f739709aa280773536f95d4560e1299999af9c2362db6a118dc
              risks: []
          author:
            content_draft:
              decision: ready
              content_brief:
                objective: Identify the strongest architectural signal in the supplied Runx evidence.
                audience: operators
                channel: brief
              draft:
                title: Evidence-bound execution is the architecture
                body: Runx binds operator actions to authority evidence and packages deterministic operations behind portable skills.
                claims:
                  - claim: Receipts bind operator actions to authority evidence.
                    source_digests:
                      - sha256:9056e1b5caa4e78583d0bc47bb731468b31155929a3aa3a35fcadf6136534a36
                  - claim: Portable skills separate judgment from deterministic operations.
                    source_digests:
                      - sha256:c951e0e102215f739709aa280773536f95d4560e1299999af9c2362db6a118dc
              review_checklist:
                - Confirm both source bindings remain present.
              distribution_notes:
                primary_channel: brief
              context_binding: { applied: [] }
      expect:
        status: sealed
        steps:
          - research-topic
          - draft-brief
          - package-content
          - prepare-handoff
        step_outputs:
          research-topic:
            subset:
              research_packet:
                data:
                  decision: ready
                  validation:
                    status: pass
          draft-brief:
            subset:
              content_draft_packet:
                data:
                  decision: ready
                  validation:
                    status: pass
          package-content:
            subset:
              content_publish_packet:
                data:
                  decision: ready_for_handoff
                  delivery_status: not_sent
          prepare-handoff:
            subset:
              content_handoff_packet:
                data:
                  handoff_packet:
                    decision: handoff_ready
                    delivery_status: not_sent
        receipt:
          schema: runx.receipt.v1

    - name: content-package-stops-before-drafting-without-sources
      runner: content-package
      inputs:
        objective: Decide whether the supplied claim is ready.
        audience: operators
        channel: brief
        source_packets: []
      expect:
        status: sealed
        steps:
          - research-topic
        step_outputs:
          research-topic:
            subset:
              research_packet:
                data:
                  decision: needs_more_evidence
                  validation:
                    status: fail
        receipt:
          schema: runx.receipt.v1

runners:
  content-package:
    description: "Compose research, drafting and channel packaging from already supplied source evidence."
    inputs:
      objective:
        type: string
        required: true
        description: What the content must accomplish.
      source_packets:
        type: json
        required: true
        description: Bounded governed source packets, normally web-fetch provider operation evidence.
      audience:
        type: string
        required: false
        default: operators
        description: Intended reader for the draft.
      channel:
        type: string
        required: false
        default: brief
        description: Intended content channel; this runner does not deliver it.
      domain:
        type: string
        required: false
        description: Domain context for interpretation.
      operator_context:
        type: string
        required: false
        description: Local constraints that do not count as evidence.
      target_entities:
        type: json
        required: false
        description: Entities to include or compare.
      publication_target:
        type: json
        required: false
        default: {}
        description: Exact target locator for the later provider delivery lane.
      boundary_kind:
        type: string
        required: false
        default: external
        schema: { enum: [internal, external] }
        description: Whether delivery crosses outside the team; an external delivery needs the delivering lane's own approval.
    result_from: [research-topic, draft-brief, package-content, prepare-handoff]
    steps:
      - id: research-topic
        skill: ../research
        runner: research
        scopes:
          - runx:research:read
        inputs:
          objective: $input.objective
          source_packets: $input.source_packets
          domain: $input.domain
          deliverable: content draft
          operator_context: $input.operator_context
          target_entities: $input.target_entities

      - id: draft-brief
        when:
          value: $steps.research-topic.research_packet.decision
          equals: ready
        skill: ../ghostwrite
        runner: draft
        scopes:
          - runx:content:draft
        inputs:
          objective: $input.objective
          audience: $input.audience
          channel: $input.channel
          voice_guide: Write for the declared audience and channel, preserve evidence bindings, and separate verified claims from inference.
          evidence_pack: $steps.research-topic.research_packet

      - id: package-content
        when:
          value: $steps.research-topic.research_packet.decision
          equals: ready
        skill: ../ghostwrite
        runner: package
        inputs:
          channel: $input.channel
          draft: $steps.draft-brief.content_draft_packet

      - id: prepare-handoff
        when:
          value: $steps.research-topic.research_packet.decision
          equals: ready
        skill: ../ghostwrite
        runner: handoff
        inputs:
          channel: $input.channel
          boundary_kind: $input.boundary_kind
          target: $input.publication_target
          packet: $steps.package-content.content_publish_packet

  prepare:
    default: true
    description: Prepare researched channel content from an objective and optional source selectors, reusing completed reads.
    inputs:
      objective: {definition: objective}
      audience: {definition: audience}
      channel: {definition: channel}
      domain: {definition: domain}
      operator_context: {definition: operator_context}
      target_entities: {definition: target_entities}
      publication_target: {definition: publication_target}
      boundary_kind: {definition: boundary_kind}
      brand_context: {definition: brand_context}
      taste_context: {definition: taste_context}
      source_packets:
        type: array
        required: false
        default: []
        description: Already acquired governed readbacks; nonempty sources skip acquisition.
        schema: {maxItems: 20, items: {type: object, additionalProperties: true}}
      paths:
        type: array
        required: false
        default: []
        description: Contained local source paths read directly by the research owner.
        schema: {maxItems: 16, uniqueItems: true, items: {type: string, minLength: 1}}
      urls:
        type: array
        required: false
        default: []
        description: Exact public source URLs to fetch without discovery.
        schema: {maxItems: 20, uniqueItems: true, items: {type: string, format: uri, pattern: '^https?://'}}
    examples:
      - {objective: 'Explain the current architecture boundary to developers.', channel: blog, paths: [CONVENTIONS.md]}
    result_from: [research-topic, prepare-content]
    steps:
      - id: research-topic
        skill: ../research
        runner: investigate
        inputs:
          objective: $input.objective
          domain: $input.domain
          deliverable: channel-ready content
          operator_context: $input.operator_context
          target_entities: $input.target_entities
          paths: $input.paths
          urls: $input.urls
          source_packets: $input.source_packets
      - id: prepare-content
        when: {value: $steps.research-topic.research_packet.decision, equals: ready}
        skill: .
        runner: from-research
        inputs:
          objective: $input.objective
          audience: $input.audience
          channel: $input.channel
          research_packet: $steps.research-topic.research_packet
          publication_target: $input.publication_target
          boundary_kind: $input.boundary_kind
          brand_context: $input.brand_context
          taste_context: $input.taste_context

  from-research:
    description: Prepare channel content from a completed research packet, with no acquisition or repeat synthesis.
    inputs:
      objective: {definition: objective}
      audience: {definition: audience}
      channel: {definition: channel}
      domain: {definition: domain}
      operator_context: {definition: operator_context}
      target_entities: {definition: target_entities}
      publication_target: {definition: publication_target}
      boundary_kind: {definition: boundary_kind}
      brand_context: {definition: brand_context}
      taste_context: {definition: taste_context}
      research_packet:
        type: json
        required: true
        packet: runx/research.packet.v1
        description: Existing source-bound research supplied unchanged to the canonical writer.
    examples:
      - {"objective":"Should a domain operator move its skill loop and state into Runx Cloud when it uses hosted connectors? Explain the ownership and integration consequences from the supplied conventions.","channel":"brief","research_packet":{"decision":"ready","decision_support":[{"option":"Keep loop state and scheduling in the owning local operator; bind hosted provider execution only where explicitly selected.","rationale":"The conventions separately assign product residency, native execution and portable hosted provider implementations. This keeps the chosen connector from changing who owns the operator.","source_digests":["sha256:ca0e40760e18ba1f1187fe9d86ae0e9af7209ee58254594fb621247b3fe328db"]}],"evidence_log":[{"claim":"Products own persistence, agent loops and scheduling; the client root only invokes finite native commands.","confidence":"verified","content_digest":"sha256:ca0e40760e18ba1f1187fe9d86ae0e9af7209ee58254594fb621247b3fe328db","relevance":"This assigns residency and durable state to the operator product rather than the invocation client or hosted connector.","source_digest":"sha256:ca0e40760e18ba1f1187fe9d86ae0e9af7209ee58254594fb621247b3fe328db"},{"claim":"Hosted adapters are optional implementations of provider-operation contracts and cannot become a prerequisite for otherwise portable skills.","confidence":"verified","content_digest":"sha256:ca0e40760e18ba1f1187fe9d86ae0e9af7209ee58254594fb621247b3fe328db","relevance":"Selecting a hosted credential/transport implementation does not require moving the operator into Runx Cloud.","source_digest":"sha256:ca0e40760e18ba1f1187fe9d86ae0e9af7209ee58254594fb621247b3fe328db"},{"claim":"OSS packages must not import Cloud code, and the public TypeScript path runs through the client and shared contracts.","confidence":"verified","content_digest":"sha256:ca0e40760e18ba1f1187fe9d86ae0e9af7209ee58254594fb621247b3fe328db","relevance":"The integration should use the existing public native invocation boundary rather than coupling the operator to private Cloud implementation.","source_digest":"sha256:ca0e40760e18ba1f1187fe9d86ae0e9af7209ee58254594fb621247b3fe328db"}],"index_digest":"sha256:4a3cd4d6c5116ca170c5f9d365d346b7d0811434ea591c0e9447dcefb08a1160","research_brief":{"objective":"Should a domain operator move its skill loop and state into Runx Cloud when it uses hosted connectors? Explain the ownership and integration consequences from the supplied conventions.","open_questions":["The supplied conventions do not specify the exact Cloud API routes or service limits; inspect those contracts before wiring a hosted binding."],"scope":"Current OSS architecture conventions, read natively from a copy of the current source document; this is a design decision, not an implementation audit.","summary":"Keep the operator loop and durable state in its owning product. A hosted connector is an optional implementation of a provider capability and does not transfer orchestration ownership. Invoke the native runtime through the public client boundary, carrying bounded authority and receipt-backed results across each turn."},"risks":[{"risk":"Source conventions are documentary evidence; this run has not audited an implemented product or deployed Cloud service."}],"source_evidence":[{"content_digest":"sha256:ca0e40760e18ba1f1187fe9d86ae0e9af7209ee58254594fb621247b3fe328db","evidence_digest":"sha256:ca0e40760e18ba1f1187fe9d86ae0e9af7209ee58254594fb621247b3fe328db","provenance":{"bytes":13204,"observed_at":"2026-11-03T02:17:54.631Z","path":"runx-conventions.md"},"source_kind":"local_file","source_uri":"file:runx-conventions.md"}],"validation":{"findings":[],"status":"pass"}}}
    result_from: [draft-brief, package-content, prepare-handoff]
    steps:
      - id: draft-brief
        skill: ../ghostwrite
        runner: draft
        inputs:
          objective: $input.objective
          audience: $input.audience
          channel: $input.channel
          evidence_pack: $input.research_packet
          brand_context: $input.brand_context
          taste_context: $input.taste_context
          voice_guide: Write for the declared reader and channel, preserve source bindings, and distinguish evidence from inference.
      - id: package-content
        skill: ../ghostwrite
        runner: package
        inputs: {channel: $input.channel, draft: $steps.draft-brief.content_draft_packet}
      - id: has-target
        tool: data.compare
        inputs: {actual: $input.publication_target, expected: {}}
      - id: prepare-handoff
        when: {value: $steps.has-target.comparison.equal, equals: false}
        skill: ../ghostwrite
        runner: handoff
        inputs:
          channel: $input.channel
          boundary_kind: $input.boundary_kind
          target: $input.publication_target
          packet: $steps.package-content.content_publish_packet

input_definitions:
  objective: {type: string, required: true, description: 'What the content must help its reader understand or do.', schema: {minLength: 1, maxLength: 4000}}
  audience: {type: string, required: false, default: operators, description: Intended reader.}
  channel: {type: string, required: false, default: brief, description: Content channel; this does not deliver it.}
  domain: {type: string, required: false, description: Domain context for research interpretation.}
  operator_context: {type: string, required: false, description: Interpretation constraints that do not count as evidence.}
  target_entities: {type: json, required: false, description: Bounded caller-owned entity selectors for research.}
  publication_target: {type: json, required: false, default: {}, description: 'Optional provider-neutral destination selector; an empty object skips handoff.'}
  boundary_kind: {type: string, required: false, default: external, schema: {enum: [internal, external]}, description: Later delivery boundary; this prepares no delivery approval.}
  brand_context: {type: json, required: false, packet: runx/brand-voice.context.v1, description: Optional scoped brand voice admitted by the canonical writer.}
  taste_context: {type: json, required: false, packet: runx/taste-profile.context.v1, description: Optional scoped taste admitted by the canonical writer.}
