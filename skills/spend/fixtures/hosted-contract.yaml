name: spend-hosted-contract
kind: skill
target: ..
runner: spend
operator_journeys:
  - { mode: standalone, confusors: [charge, settle-invoice], request: Pay this exact requirement., expected_outcome: Require hosted spend authority and return provider readback. }
  - mode: composed
    request: Continue this admitted purchase.
    expected_outcome: Reuse supplied payment and authority evidence.
    prior_evidence: [The admitted payment signal and authority supplied by the caller.]
    must_not_repeat: [Do not mint a second payment identity.]
inputs:
  payment_signal: { amount_minor: 125, currency: USD, counterparty: "merchant:demo" }
  parent_payment_authority: { term_id: "authority:test" }
  rail: mpp
  rail_profile_ref: "rail-profile:test"
  idempotency_seed: spend-test-001
caller:
  approvals: { "spend": true }
  provider_responses:
    principal_id: spend-fixture
    grant: { grant_id: spend-fixture, provider: mpp, scopes: [payment.spend, payment.spend.read] }
    operations:
      - { operation: payment.spend, target: "merchant:demo", access: mutate, result: { payment_ref: payment_test_001, rail: mpp, amount_minor: 125, currency: USD, status: settled } }
      - { operation: payment.spend.read, target: payment_test_001, access: read, result: { payment_ref: payment_test_001, rail: mpp, amount_minor: 125, currency: USD, status: settled } }
expect: { status: sealed, receipt: { schema: runx.receipt.v1 } }
