skill: cold-outreach
version: "0.1.9"
catalog:
  kind: graph
  audience: public
  visibility: public
  role: canonical
  execution: plan
  completion: runtime_receipt
  approval: none
  category: growth
runners:
  prepare:
    default: true
    inputs:
      sender:
        type: object
        required: true
        description: Exact approved writing identity; does not grant send authority.
        schema:
          additionalProperties: false
          required: [name, from_address, reply_to]
          properties:
            name: {type: string, minLength: 1, maxLength: 200}
            from_address: {type: string, format: email, maxLength: 320}
            reply_to: {type: string, format: email, maxLength: 320}
      prospect:
        type: object
        required: true
        description: Exact intended recipient; personalisation must be supported by the evidence packet.
        schema:
          additionalProperties: false
          required: [email]
          properties:
            id: {type: string, minLength: 1, maxLength: 1000}
            email: {type: string, format: email, maxLength: 320}
            name: {type: string, minLength: 1, maxLength: 200}
            company: {type: string, minLength: 1, maxLength: 200}
      audience:
        type: string
        required: true
        description: Reader segment this prospect belongs to. Supplied brand and taste context applies only when it
          declares this exact audience.
        schema: {minLength: 1, maxLength: 200}
      purpose:
        type: string
        required: true
        description: Intended useful outcome of this first contact.
        schema: {minLength: 1, maxLength: 2000}
      offer:
        type: string
        required: true
        description: Proposed value, to be substantiated from approved evidence rather than treated as a fact.
        schema: {minLength: 1, maxLength: 2000}
      required_footer:
        type: string
        required: true
        description: Exact policy-required sender identity and opt-out wording, included unchanged in the draft.
        schema: {minLength: 1, maxLength: 3000}
      contact_policy:
        type: object
        required: true
        description: Current policy status for this exact recipient, supplied by the caller; the model does
          not establish legal permission.
        schema:
          additionalProperties: false
          required: [recipient, status, suppressed, policy_id, evidence_ids]
          properties:
            recipient: {type: string, format: email, maxLength: 320}
            status: {enum: [eligible, ineligible, unknown]}
            suppressed: {type: boolean}
            policy_id: {type: string, maxLength: 1000}
            evidence_ids:
              type: array
              maxItems: 20
              uniqueItems: true
              items: {type: string, minLength: 1, maxLength: 1000}
      qualification:
        type: json
        required: false
        packet: runx/lead-qualify.qualification.v1
        description: Optional lead qualification for prospect.id; a supplied hold or mismatched subject stops drafting.
      evidence_pack:
        type: json
        required: false
        packet: runx/research.packet.v1
        description: Validated recipient research and disclosure-approved offer evidence.
      facts:
        type: array
        required: false
        description: Actual supplied prospect/offer facts instead of a research packet; never send both source forms. They remain caller assertions, not independent verification or contact eligibility.
        schema: {minItems: 1, maxItems: 100, items: {type: string, minLength: 1, maxLength: 4000}}
      brand_context: {type: json, required: false, packet: runx/brand-voice.context.v1, description: 'Scoped validated
          brand voice, selected by the caller.'}
      taste_context: {type: json, required: false, packet: runx/taste-profile.context.v1, description: 'Scoped validated
          taste, selected by the caller.'}
    result_from: [hold, review]
    examples:
      - sender:
          name: Sam at Acme
          from_address: sam@acme.example
          reply_to: sam@acme.example
        prospect:
          email: priya@northwind.example
          name: Priya
          company: Northwind
        audience: engineering leads at mid-size SaaS companies
        purpose: Offer a short review of their release process.
        offer: A free review of one release pipeline.
        required_footer: Acme Inc, 1 Main St, Hobart. Reply to opt out.
        contact_policy:
          recipient: priya@northwind.example
          status: eligible
          suppressed: false
          policy_id: acme-outreach-policy
          evidence_ids:
          - crm:northwind-opted-in
        facts:
        - Northwind publishes release notes every two weeks.
    steps:
    - id: admit-evidence
      skill: ../ghostwrite
      runner: admit
      inputs:
        objective: $input.purpose
        audience: $input.audience
        channel: email
        evidence_pack: $input.evidence_pack
        facts: $input.facts
        brand_context: $input.brand_context
        taste_context: $input.taste_context
    - id: admit
      tool: {module: cold-outreach.mjs, export: admitContact}
      inputs:
        sender: $input.sender
        prospect: $input.prospect
        purpose: $input.purpose
        offer: $input.offer
        required_footer: $input.required_footer
        contact_policy: $input.contact_policy
        qualification: $input.qualification
        evidence_context: $steps.admit-evidence.evidence_context
      outputs:
        contact_brief:
          type: object
          schema:
            additionalProperties: false
            required: [decision, sender, prospect, purpose, offer, required_footer, policy_id, policy_evidence_ids,
              blockers]
            properties:
              decision: {enum: [hold, eligible_for_draft]}
              sender:
                type: object
                additionalProperties: false
                required: [name, from_address, reply_to]
                properties:
                  name: {type: string}
                  from_address: {type: string, format: email}
                  reply_to: {type: string, format: email}
              prospect:
                type: object
                additionalProperties: false
                required: [email]
                properties:
                  email: {type: string, format: email}
                  name: {type: string}
                  company: {type: string}
                  id: {type: string, minLength: 1, maxLength: 1000}
              purpose: {type: string, minLength: 1, maxLength: 2000}
              offer: {type: string, minLength: 1, maxLength: 2000}
              required_footer: {type: string, minLength: 1, maxLength: 3000}
              policy_id: {type: string, maxLength: 1000}
              policy_evidence_ids:
                type: array
                maxItems: 20
                items: {type: string, minLength: 1, maxLength: 1000}
              blockers:
                type: array
                maxItems: 32
                items: {type: string, minLength: 1, maxLength: 1000}
    - id: hold
      when: {value: $steps.admit.contact_brief.decision, equals: hold}
      tool: {module: cold-outreach.mjs, export: finalizeReview}
      inputs: {contact_brief: $steps.admit.contact_brief}
      outputs:
        outreach_review:
          type: object
          schema:
            additionalProperties: false
            required:
            - decision
            - sender
            - recipient
            - policy_id
            - policy_evidence_ids
            - draft_status
            - delivery_status
            - blockers
            - draft
            - draft_packet_digest
            properties:
              decision: {enum: [ready_for_review, hold]}
              sender:
                type: object
                additionalProperties: false
                required: [name, from_address, reply_to]
                properties:
                  name: {type: string, minLength: 1, maxLength: 200}
                  from_address: {type: string, format: email, maxLength: 320}
                  reply_to: {type: string, format: email, maxLength: 320}
              recipient: {type: string, format: email, maxLength: 320}
              policy_id: {type: string, maxLength: 1000}
              policy_evidence_ids:
                type: array
                maxItems: 20
                uniqueItems: true
                items: {type: string, minLength: 1, maxLength: 1000}
              draft_status: {enum: [prepared, withheld]}
              delivery_status: {const: not_sent}
              blockers:
                type: array
                maxItems: 32
                items: {type: string, minLength: 1, maxLength: 1000}
              draft:
                type: [object, 'null']
                additionalProperties: false
                required: [subject, body]
                properties:
                  subject: {type: string, minLength: 1, maxLength: 500}
                  body: {type: string, minLength: 1, maxLength: 100000}
              draft_packet_digest: {type: [string, 'null'], pattern: '^sha256:[0-9a-f]{64}$'}
            allOf:
            - if:
                properties:
                  decision: {const: ready_for_review}
              then:
                properties:
                  draft: {type: object}
                  draft_packet_digest: {type: string}
              else:
                properties:
                  draft: {type: 'null'}
                  draft_packet_digest: {type: 'null'}
      artifacts:
        named_emits: {outreach_review: outreach_review}
    - id: draft
      when: {value: $steps.admit.contact_brief.decision, equals: eligible_for_draft}
      agent: {role: writer, task: cold-outreach-draft}
      outputs:
        content_draft:
          type: object
          schema:
            properties:
              decision:
                type: string
              content_brief:
                type: object
                properties:
                  objective:
                    type: string
                  audience:
                    type: string
                  channel:
                    type: string
                required:
                - objective
                - audience
                - channel
              draft:
                type: object
                properties:
                  title:
                    type: string
                  body:
                    type: string
                  claims:
                    type: array
                    items:
                      type: object
                      properties:
                        claim:
                          type: string
                        source_digests:
                          type: array
                          items:
                            type: string
                      required:
                      - claim
                      - source_digests
                required:
                - title
                - body
                - claims
              review_checklist:
                type: array
                items:
                  type: string
              distribution_notes:
                type: object
                properties:
                  primary_channel:
                    type: string
              context_binding:
                type: object
                properties:
                  applied:
                    type: array
                    items:
                      type: object
                      properties:
                        packet_digest:
                          type: string
                        applied_rules:
                          type: array
                          items:
                            type: string
                        scope_review:
                          type: object
                          properties:
                            decision:
                              type: string
                            reason:
                              type: string
                          required:
                          - decision
                          - reason
                      required:
                      - packet_digest
                      - applied_rules
                      - scope_review
                required:
                - applied
            required:
            - decision
            if:
              properties:
                decision:
                  pattern: ^ready
            then:
              required:
              - content_brief
              - draft
              - review_checklist
              - distribution_notes
              - context_binding
      inputs:
        sender: $steps.admit.contact_brief.sender
        prospect: $steps.admit.contact_brief.prospect
        purpose: $steps.admit.contact_brief.purpose
        offer: $steps.admit.contact_brief.offer
        required_footer: $steps.admit.contact_brief.required_footer
        evidence_context: $steps.admit-evidence.evidence_context
      artifacts:
        named_emits: {content_draft: content_draft}
    - id: verify
      when: {value: $steps.admit.contact_brief.decision, equals: eligible_for_draft}
      skill: ../ghostwrite
      runner: verify
      inputs:
        evidence_context: $steps.admit-evidence.evidence_context
        content_draft: $steps.draft.content_draft
    - id: digest-draft
      when: {value: $steps.admit.contact_brief.decision, equals: eligible_for_draft}
      tool: data.digest
      inputs: {value: $steps.verify.content_draft_packet}
    - id: review
      when: {value: $steps.admit.contact_brief.decision, equals: eligible_for_draft}
      tool: {module: cold-outreach.mjs, export: finalizeReview}
      inputs:
        contact_brief: $steps.admit.contact_brief
        content_draft_packet: $steps.verify.content_draft_packet
        draft_packet_digest: $steps.digest-draft.digest_result.digest
      outputs:
        outreach_review:
          type: object
          schema:
            additionalProperties: false
            required:
            - decision
            - sender
            - recipient
            - policy_id
            - policy_evidence_ids
            - draft_status
            - delivery_status
            - blockers
            - draft
            - draft_packet_digest
            properties:
              decision: {enum: [ready_for_review, hold]}
              sender:
                type: object
                additionalProperties: false
                required: [name, from_address, reply_to]
                properties:
                  name: {type: string, minLength: 1, maxLength: 200}
                  from_address: {type: string, format: email, maxLength: 320}
                  reply_to: {type: string, format: email, maxLength: 320}
              recipient: {type: string, format: email, maxLength: 320}
              policy_id: {type: string, maxLength: 1000}
              policy_evidence_ids:
                type: array
                maxItems: 20
                uniqueItems: true
                items: {type: string, minLength: 1, maxLength: 1000}
              draft_status: {enum: [prepared, withheld]}
              delivery_status: {const: not_sent}
              blockers:
                type: array
                maxItems: 32
                items: {type: string, minLength: 1, maxLength: 1000}
              draft:
                type: [object, 'null']
                additionalProperties: false
                required: [subject, body]
                properties:
                  subject: {type: string, minLength: 1, maxLength: 500}
                  body: {type: string, minLength: 1, maxLength: 100000}
              draft_packet_digest: {type: [string, 'null'], pattern: '^sha256:[0-9a-f]{64}$'}
            allOf:
            - if:
                properties:
                  decision: {const: ready_for_review}
              then:
                properties:
                  draft: {type: object}
                  draft_packet_digest: {type: string}
              else:
                properties:
                  draft: {type: 'null'}
                  draft_packet_digest: {type: 'null'}
      artifacts:
        named_emits: {outreach_review: outreach_review}

harness:
  files: [fixtures/support/composed.graph]
  cases: []
