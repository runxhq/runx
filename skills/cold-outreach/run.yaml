version: "0.1.9"
minimum_runx: 0.12.0
default_method: prepare
catalog:
  visibility: public
  category: growth
shared_inputs:
  sender:
    type: object
    description: Exact approved writing identity; does not grant send authority.
    additionalProperties: false
    required: [name, from_address, reply_to]
    properties:
      name: {type: string, minLength: 1, maxLength: 200}
      from_address: {type: string, format: email, maxLength: 320}
      reply_to: {type: string, format: email, maxLength: 320}
  audience:
    type: string
    description: Reader segment this prospect belongs to. Supplied brand and taste context applies only when it declares this exact audience.
    minLength: 1
    maxLength: 200
  purpose:
    type: string
    description: Intended useful outcome of this first contact.
    minLength: 1
    maxLength: 2000
  offer:
    type: string
    description: Proposed value, to be substantiated from approved evidence rather than treated as a fact.
    minLength: 1
    maxLength: 2000
  required_footer:
    type: string
    description: Exact policy-required sender identity and opt-out wording, included unchanged in the draft.
    minLength: 1
    maxLength: 3000
methods:
  prepare:
    description: Prepare one first-contact email for an exact prospect, holding any contact its policy, qualification or evidence doesn't support. Sends nothing.
    inputs:
      sender: {}
      prospect:
        type: object
        description: Exact intended recipient; personalisation must be supported by the evidence packet.
        additionalProperties: false
        required: [email]
        properties:
          id: {type: string, minLength: 1, maxLength: 1000}
          email: {type: string, format: email, maxLength: 320}
          name: {type: string, minLength: 1, maxLength: 200}
          company: {type: string, minLength: 1, maxLength: 200}
      audience: {}
      purpose: {}
      offer: {}
      required_footer: {}
      contact_policy:
        type: object
        description: Current policy status for this exact recipient, supplied by the caller; the model does not establish legal permission.
        additionalProperties: false
        required: [recipient, status, suppressed, policy_id, evidence_ids]
        properties:
          recipient: {type: string, format: email, maxLength: 320}
          status: {enum: [eligible, ineligible, unknown]}
          suppressed: {type: boolean}
          policy_id: {type: string, maxLength: 1000}
          evidence_ids:
            type: array
            maxItems: 20
            uniqueItems: true
            items: {type: string, minLength: 1, maxLength: 1000}
      qualification:
        packet: runx/lead-qualify.qualification.v1
        description: Optional lead qualification for prospect.id; a supplied hold or mismatched subject stops drafting.
        optional: true
      evidence_pack:
        packet: runx/research.packet.v1
        description: Validated recipient research and disclosure-approved offer evidence.
        optional: true
      facts:
        type: array
        description: Actual supplied prospect/offer facts instead of a research packet; never send both source forms. They remain caller assertions, not independent verification or contact eligibility.
        minItems: 1
        maxItems: 100
        items: {type: string, minLength: 1, maxLength: 4000}
        optional: true
      brand_context: {packet: runx/brand-voice.context.v1, description: 'Scoped validated brand voice, selected by the caller.', optional: true}
      taste_context: {packet: runx/taste-profile.context.v1, description: 'Scoped validated taste, selected by the caller.', optional: true}
    result_from: [hold, review]
    examples:
    - sender:
        name: Sam at Acme
        from_address: sam@acme.example
        reply_to: sam@acme.example
      prospect:
        email: priya@northwind.example
        name: Priya
        company: Northwind
      audience: engineering leads at mid-size SaaS companies
      purpose: Offer a short review of their release process.
      offer: A free review of one release pipeline.
      required_footer: Acme Inc, 1 Main St, Hobart. Reply to opt out.
      contact_policy:
        recipient: priya@northwind.example
        status: eligible
        suppressed: false
        policy_id: acme-outreach-policy
        evidence_ids:
        - crm:northwind-opted-in
      facts:
      - Northwind publishes release notes every two weeks.
    steps:
    - id: admit-evidence
      skill: ../ghostwrite#admit
      inputs:
        objective: $input.purpose
        audience: $input.audience
        channel: email
        evidence_pack: $input.evidence_pack
        facts: $input.facts
        brand_context: $input.brand_context
        taste_context: $input.taste_context
    - id: admit
      tool: {module: cold-outreach.mjs, export: admitContact}
      inputs:
        sender: $input.sender
        prospect: $input.prospect
        purpose: $input.purpose
        offer: $input.offer
        required_footer: $input.required_footer
        contact_policy: $input.contact_policy
        qualification: $input.qualification
        evidence_context: $steps.admit-evidence.evidence_context
      outputs:
        contact_brief:
          type: object
          additionalProperties: false
          required: [decision, sender, prospect, purpose, offer, required_footer, policy_id, policy_evidence_ids, blockers]
          properties:
            decision: {enum: [hold, eligible_for_draft]}
            sender:
              type: object
              additionalProperties: false
              required: [name, from_address, reply_to]
              properties:
                name: {type: string}
                from_address: {type: string, format: email}
                reply_to: {type: string, format: email}
            prospect:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email: {type: string, format: email}
                name: {type: string}
                company: {type: string}
                id: {type: string, minLength: 1, maxLength: 1000}
            purpose: {type: string, minLength: 1, maxLength: 2000}
            offer: {type: string, minLength: 1, maxLength: 2000}
            required_footer: {type: string, minLength: 1, maxLength: 3000}
            policy_id: {type: string, maxLength: 1000}
            policy_evidence_ids:
              type: array
              maxItems: 20
              items: {type: string, minLength: 1, maxLength: 1000}
            blockers:
              type: array
              maxItems: 32
              items: {type: string, minLength: 1, maxLength: 1000}
    - id: hold
      when: {value: $steps.admit.contact_brief.decision, equals: hold}
      tool: {module: cold-outreach.mjs, export: finalizeReview}
      inputs: {contact_brief: $steps.admit.contact_brief}
      outputs:
        outreach_review:
          type: object
          additionalProperties: false
          required:
          - decision
          - sender
          - recipient
          - policy_id
          - policy_evidence_ids
          - draft_status
          - delivery_status
          - blockers
          - draft
          - draft_packet_digest
          properties:
            decision: {enum: [ready_for_review, hold]}
            sender:
              type: object
              additionalProperties: false
              required: [name, from_address, reply_to]
              properties:
                name: {type: string, minLength: 1, maxLength: 200}
                from_address: {type: string, format: email, maxLength: 320}
                reply_to: {type: string, format: email, maxLength: 320}
            recipient: {type: string, format: email, maxLength: 320}
            policy_id: {type: string, maxLength: 1000}
            policy_evidence_ids:
              type: array
              maxItems: 20
              uniqueItems: true
              items: {type: string, minLength: 1, maxLength: 1000}
            draft_status: {enum: [prepared, withheld]}
            delivery_status: {const: not_sent}
            blockers:
              type: array
              maxItems: 32
              items: {type: string, minLength: 1, maxLength: 1000}
            draft:
              type: [object, 'null']
              additionalProperties: false
              required: [subject, body]
              properties:
                subject: {type: string, minLength: 1, maxLength: 500}
                body: {type: string, minLength: 1, maxLength: 100000}
            draft_packet_digest: {type: [string, 'null'], pattern: '^sha256:[0-9a-f]{64}$'}
          allOf:
          - if:
              properties:
                decision: {const: ready_for_review}
            then:
              properties:
                draft: {type: object}
                draft_packet_digest: {type: string}
            else:
              properties:
                draft: {type: 'null'}
                draft_packet_digest: {type: 'null'}
    - id: draft
      when: {value: $steps.admit.contact_brief.decision, equals: eligible_for_draft}
      agent: cold-outreach-draft
      outputs:
        content_draft:
          type: object
          properties:
            decision:
              type: string
            content_brief:
              type: object
              properties:
                objective:
                  type: string
                audience:
                  type: string
                channel:
                  type: string
              required:
              - objective
              - audience
              - channel
            draft:
              type: object
              properties:
                title:
                  type: string
                body:
                  type: string
                claims:
                  type: array
                  items:
                    type: object
                    properties:
                      claim:
                        type: string
                      source_digests:
                        type: array
                        items:
                          type: string
                    required:
                    - claim
                    - source_digests
              required:
              - title
              - body
              - claims
            review_checklist:
              type: array
              items:
                type: string
            distribution_notes:
              type: object
              properties:
                primary_channel:
                  type: string
            context_binding:
              type: object
              properties:
                applied:
                  type: array
                  items:
                    type: object
                    properties:
                      packet_digest:
                        type: string
                      applied_rules:
                        type: array
                        items:
                          type: string
                      scope_review:
                        type: object
                        properties:
                          decision:
                            type: string
                          reason:
                            type: string
                        required:
                        - decision
                        - reason
                    required:
                    - packet_digest
                    - applied_rules
                    - scope_review
              required:
              - applied
          required:
          - decision
          if:
            properties:
              decision:
                pattern: ^ready
          then:
            required:
            - content_brief
            - draft
            - review_checklist
            - distribution_notes
            - context_binding
      inputs:
        sender: $steps.admit.contact_brief.sender
        prospect: $steps.admit.contact_brief.prospect
        purpose: $steps.admit.contact_brief.purpose
        offer: $steps.admit.contact_brief.offer
        required_footer: $steps.admit.contact_brief.required_footer
        evidence_context: $steps.admit-evidence.evidence_context
    - id: verify
      when: {value: $steps.admit.contact_brief.decision, equals: eligible_for_draft}
      skill: ../ghostwrite#verify
      inputs:
        evidence_context: $steps.admit-evidence.evidence_context
        content_draft: $steps.draft.content_draft
    - id: digest-draft
      when: {value: $steps.admit.contact_brief.decision, equals: eligible_for_draft}
      tool: data.digest
      inputs: {value: $steps.verify.content_draft_packet}
    - id: review
      when: {value: $steps.admit.contact_brief.decision, equals: eligible_for_draft}
      tool: {module: cold-outreach.mjs, export: finalizeReview}
      inputs:
        contact_brief: $steps.admit.contact_brief
        content_draft_packet: $steps.verify.content_draft_packet
        draft_packet_digest: $steps.digest-draft.digest_result.digest
      outputs:
        outreach_review:
          type: object
          additionalProperties: false
          required:
          - decision
          - sender
          - recipient
          - policy_id
          - policy_evidence_ids
          - draft_status
          - delivery_status
          - blockers
          - draft
          - draft_packet_digest
          properties:
            decision: {enum: [ready_for_review, hold]}
            sender:
              type: object
              additionalProperties: false
              required: [name, from_address, reply_to]
              properties:
                name: {type: string, minLength: 1, maxLength: 200}
                from_address: {type: string, format: email, maxLength: 320}
                reply_to: {type: string, format: email, maxLength: 320}
            recipient: {type: string, format: email, maxLength: 320}
            policy_id: {type: string, maxLength: 1000}
            policy_evidence_ids:
              type: array
              maxItems: 20
              uniqueItems: true
              items: {type: string, minLength: 1, maxLength: 1000}
            draft_status: {enum: [prepared, withheld]}
            delivery_status: {const: not_sent}
            blockers:
              type: array
              maxItems: 32
              items: {type: string, minLength: 1, maxLength: 1000}
            draft:
              type: [object, 'null']
              additionalProperties: false
              required: [subject, body]
              properties:
                subject: {type: string, minLength: 1, maxLength: 500}
                body: {type: string, minLength: 1, maxLength: 100000}
            draft_packet_digest: {type: [string, 'null'], pattern: '^sha256:[0-9a-f]{64}$'}
          allOf:
          - if:
              properties:
                decision: {const: ready_for_review}
            then:
              properties:
                draft: {type: object}
                draft_packet_digest: {type: string}
            else:
              properties:
                draft: {type: 'null'}
                draft_packet_digest: {type: 'null'}
  batch:
    description: For each lead, enrich its supplied sources, qualify it against the criteria and prepare its first contact, collecting every lead's outcome with the key its send is made under. Sends nothing.
    inputs:
      campaign:
        type: string
        description: This batch's campaign. With each recipient it makes the key that lead's send is made under, so a revised batch never sends a lead twice.
        pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]*$
        maxLength: 200
      sender: {}
      audience: {}
      purpose: {}
      offer: {}
      required_footer: {}
      criteria:
        type: array
        description: Supplied ICP requirements, as lead-qualify#qualify takes them. Each lead is qualified against them.
        minItems: 1
        maxItems: 20
        items: {type: object, additionalProperties: true}
      requested_fields:
        type: array
        description: The professional fields each lead's enrichment keeps, as lead-enrichment#enrich takes them.
        minItems: 1
        maxItems: 30
        items: {type: string}
      as_of:
        type: string
        description: The evaluation time of every lead's enrichment. No host clock is read, so an unchanged lead is qualified from the same packet in a revised batch.
        format: date-time
      leads:
        type: array
        description: The leads, each prepared on its own. One lead's hold or failure is that lead's outcome.
        minItems: 1
        maxItems: 300
        items:
          type: object
          additionalProperties: false
          required: [id, subject, sources, prospect, contact_policy]
          properties:
            id: {type: string, minLength: 1, maxLength: 1000}
            subject:
              type: object
              description: The lead's exact person or company, as lead-enrichment#enrich takes it. The prospect is bound to its id.
              additionalProperties: true
            sources:
              type: array
              description: The lead's factual observations, as lead-enrichment#enrich takes them.
              minItems: 1
              maxItems: 100
              items: {type: object, additionalProperties: true}
            prospect:
              type: object
              description: Exact intended recipient. Its id is the subject's, so its qualification binds to it.
              additionalProperties: false
              required: [email]
              properties:
                email: {type: string, format: email, maxLength: 320}
                name: {type: string, minLength: 1, maxLength: 200}
                company: {type: string, minLength: 1, maxLength: 200}
            contact_policy:
              type: object
              description: Current policy status for this exact recipient, supplied by the caller. With its evidence it is the lead's contact eligibility for qualification.
              additionalProperties: false
              required: [recipient, status, suppressed, policy_id, evidence_ids]
              properties:
                recipient: {type: string, format: email, maxLength: 320}
                status: {enum: [eligible, ineligible, unknown]}
                suppressed: {type: boolean}
                policy_id: {type: string, maxLength: 1000}
                evidence_ids:
                  type: array
                  maxItems: 20
                  uniqueItems: true
                  items: {type: string, minLength: 1, maxLength: 1000}
            facts:
              type: array
              description: Supplied prospect and offer facts the draft may use, as prepare takes them. A lead with none holds for evidence.
              minItems: 1
              maxItems: 100
              items: {type: string, minLength: 1, maxLength: 4000}
    result_from: [batch]
    examples:
    - campaign: release-review-2026-11
      sender:
        name: Sam at Acme
        from_address: sam@acme.example
        reply_to: sam@acme.example
      audience: engineering leads at mid-size SaaS companies
      purpose: Offer a short review of their release process.
      offer: A free review of one release pipeline.
      required_footer: Acme Inc, 1 Main St, Hobart. Reply to opt out.
      criteria:
      - id: industry
        description: Sells B2B software.
        required: true
      requested_fields: [person.name, company.industry]
      as_of: '2026-11-01T00:00:00Z'
      leads:
      - id: priya
        subject: {id: 'person:priya', kind: person}
        sources:
        - source_id: crm:priya
          source_digest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          subject_id: person:priya
          observed_at: '2026-10-30T00:00:00Z'
          match_confidence: high
          facts:
          - {field: person.name, value: Priya}
          - {field: company.industry, value: B2B software}
        prospect:
          email: priya@northwind.example
          name: Priya
          company: Northwind
        contact_policy:
          recipient: priya@northwind.example
          status: eligible
          suppressed: false
          policy_id: acme-outreach-policy
          evidence_ids:
          - crm:northwind-opted-in
        facts:
        - Northwind publishes release notes every two weeks.
    steps:
    - id: batch
      script: {module: batch.mjs}
      inputs:
        campaign: $input.campaign
        sender: $input.sender
        audience: $input.audience
        purpose: $input.purpose
        offer: $input.offer
        required_footer: $input.required_footer
        criteria: $input.criteria
        requested_fields: $input.requested_fields
        as_of: $input.as_of
        leads: $input.leads
      calls:
        skills: [../lead-enrichment#enrich, ../lead-qualify#qualify, .#prepare]
      max_calls: 900
      concurrency: 4
      effects: none
      outputs:
        outcomes:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [lead, idempotency_key, status]
            properties:
              lead: {type: string, minLength: 1, maxLength: 1000}
              idempotency_key: {type: string, minLength: 1}
              status: {enum: [fulfilled, rejected]}
              outreach_review: {type: object, additionalProperties: true}
              rejection:
                type: object
                additionalProperties: false
                required: [stage, reason, code, message]
                properties:
                  stage: {enum: [enrich, qualify, prepare]}
                  reason: {type: string}
                  code: {type: string}
                  message: {type: string}
