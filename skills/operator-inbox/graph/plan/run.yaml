skill: operator-inbox-plan
version: "0.2.0"

catalog:
  kind: skill
  audience: operator
  visibility: internal
  role: graph-stage
  part_of:
    - runx/operator-inbox

runners:
  default:
    default: true
    inputs:
      operation:
        type: string
        required: true
        description: scan_page, action_observation, disposition, or import_action.
      expected_version:
        type: number
        required: true
        description: Current projection and stream version.
      current_action:
        type: json
        required: false
        description: Current action snapshot for an observation or disposition.
      observed_at:
        type: string
        required: true
        description: Host-supplied transition time.
      scan:
        type: json
        required: false
        description: Redacted scan metadata for scan_page.
      messages:
        type: json
        required: false
        description: Provider-neutral messages for scan_page.
      message:
        type: json
        required: false
        description: Provider-neutral message for action_observation.
      triage:
        type: json
        required: false
        description: Triage reason for action_observation.
      disposition:
        type: json
        required: false
        description: Human disposition for disposition.
      action:
        type: json
        required: false
        description: Existing action snapshot for import_action.
    result_from: [finalize]
    steps:
      - id: subjects
        inputs:
          operation: $input.operation
          current_action: $input.current_action
          message: $input.message
          action: $input.action
        tool: { module: plan.mjs, export: prepareSubjects }
        outputs:
          action_id_subject: string
      - id: digest-action-id
        tool: data.digest
        inputs:
          encoding: utf8_text
          value: $steps.subjects.action_id_subject
      - id: prepare
        inputs:
          operation: $input.operation
          expected_version: $input.expected_version
          observed_at: $input.observed_at
          scan: $input.scan
          messages: $input.messages
          current_action: $input.current_action
          message: $input.message
          triage: $input.triage
          disposition: $input.disposition
          action: $input.action
          action_id_digest: $steps.digest-action-id.digest_result.digest
        tool: { module: plan.mjs, export: prepare }
        outputs:
          transition_draft: object
          idempotency_binding: object
      - id: digest-idempotency
        tool: data.digest
        inputs:
          encoding: utf8_text
          value: $steps.prepare.idempotency_binding.subject
      - id: finalize
        inputs:
          transition_draft: $steps.prepare.transition_draft
          idempotency_binding: $steps.prepare.idempotency_binding
          idempotency_digest: $steps.digest-idempotency.digest_result.digest
        tool: { module: plan.mjs, export: finalize }
        outputs:
          transition: object
        artifacts:
          named_emits:
            transition: transition
          packets:
            transition: runx.effect.transition.v1
