skill: conversation-reply
version: "0.1.2"

catalog:
  kind: graph
  audience: operator
  visibility: public
  role: canonical
  execution: execute
  completion: provider_readback
  requires_adapter: true
  approval: required

harness:
  cases:
    - name: incomplete-source-holds-before-effect
      operator_journeys:
        - mode: standalone
          confusors: [send-as, conversation-review]
          request: Reply to this exact conversation after approval.
          expected_outcome: Hold when the source packet does not prove complete coverage; do not send.
        - mode: composed
          request: Continue the admitted reply using the existing source packet and turn.
          expected_outcome: Reuse the supplied source evidence and turn identity without inventing a second reply.
          prior_evidence:
            - The source adapter already supplied the exact thread and occurrence.
          must_not_repeat:
            - Do not choose another thread or account.
            - Do not send before native human approval.
      inputs:
        source_context:
          schema: runx.source_packet.v1
          packet_id: slack://T123/C123/1.000001:sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          source_ref: { type: event, uri: 'slack://T123/C123/1.000001' }
          signal_type: conversation
          title: Conversation evidence
          observed_at: '2026-10-05T00:00:00Z'
          redaction_status: unredacted
          workflow_inputs:
            source_ref: 'slack://T123/C123/1.000001'
            source_digest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
            thread_locator: 'slack://T123/C123/1.000001'
            source_complete: false
            thread: { thread_locator: 'slack://T123/C123/1.000001', coverage_incomplete: true }
        turn_id: sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
        expected_provider: slack
        thread_locator: 'slack://T123/C123/1.000001'
        draft_message: I will check this.
      expect:
        status: sealed
        steps: [digest, prepare, held]
        step_outputs:
          held:
            subset:
              work_result:
                data: { disposition: held, completion_evidence: [], followups: [] }
        receipt: { schema: runx.receipt.v1 }

connectors:
  reply:
    operations: [thread.reply, thread.reply.read]
    connector_from: $input.expected_provider
    allowed_connectors: [slack, nitrosend]
runners:
  operate:
    default: true
    inputs:
      source_context:
        type: json
        packet: runx.source_packet.v1
        required: true
      turn_id:
        type: string
        required: true
        schema: { pattern: '^sha256:[0-9a-f]{64}$' }
      expected_provider:
        type: string
        required: true
      thread_locator:
        type: string
        required: true
      draft_message:
        type: string
        required: true
        schema: { minLength: 1, maxLength: 4000 }
      delivery_route:
        type: string
        required: false
        description: Configured successor route for a provider that queues replies before sending.
    result_from: [held, finish]
    steps:
      - id: digest
        tool: data.digest
        inputs: { value: $input.draft_message, encoding: utf8_text }
      - id: prepare
        inputs:
          source_context: $input.source_context
          turn_id: $input.turn_id
          expected_provider: $input.expected_provider
          thread_locator: $input.thread_locator
          draft_message: $input.draft_message
          delivery_route: $input.delivery_route
          digest: $steps.digest.digest_result.data
        tool: { module: conversation-reply.mjs, export: prepareReply }
        outputs: { reply_plan: object }
      - id: held
        when: { value: $steps.prepare.reply_plan.ready, equals: false }
        inputs:
          reply_plan: $steps.prepare.reply_plan
        tool: { module: conversation-reply.mjs, export: holdReply }
        outputs: { work_result: object }
        artifacts:
          named_emits: { work_result: work_result }
          packets: { work_result: runx.work_outcome.v1 }
      - id: deliver
        when: { value: $steps.prepare.reply_plan.ready, equals: true }
        operation: reply/thread.reply
        approval:
          reason: Approve sending this exact reply to the bound conversation.
          type: message_delivery
        idempotency_key: $steps.prepare.reply_plan.idempotency_key
        input: $steps.prepare.reply_plan.request
      - id: prepare_readback
        when: { value: $steps.prepare.reply_plan.ready, equals: true }
        inputs:
          reply_plan: $steps.prepare.reply_plan
          mutation: $steps.deliver.provider_operation.data
        tool: { module: conversation-reply.mjs, export: prepareReadback }
        outputs: { read_request: object }
      - id: readback
        when: { value: $steps.prepare.reply_plan.ready, equals: true }
        operation: reply/thread.reply.read
        readback_of: $steps.deliver.provider_operation.data
        input: $steps.prepare_readback.read_request
      - id: finish
        when: { value: $steps.prepare.reply_plan.ready, equals: true }
        inputs:
          reply_plan: $steps.prepare.reply_plan
          mutation: $steps.deliver.provider_operation.data
          readback: $steps.readback.provider_operation.data
        tool: { module: conversation-reply.mjs, export: finishReply }
        outputs: { work_result: object }
        artifacts:
          named_emits: { work_result: work_result }
          packets: { work_result: runx.work_outcome.v1 }
  verify:
    inputs:
      expected_provider: { type: string, required: true }
      thread_locator: { type: string, required: true }
      conversation_id: { type: integer, required: true, schema: { minimum: 1 } }
      message_id: { type: integer, required: true, schema: { minimum: 1 } }
      content_digest: { type: string, required: true, schema: { pattern: '^sha256:[0-9a-f]{64}$' } }
      attempt: { type: integer, required: true, schema: { minimum: 1, maximum: 24 } }
      delivery_route: { type: string, required: true }
    result_from: [finish]
    steps:
      - id: prepare_check
        inputs:
          thread_locator: $input.thread_locator
          conversation_id: $input.conversation_id
          message_id: $input.message_id
        tool: { module: conversation-reply.mjs, export: prepareDeliveryCheck }
        outputs: { read_request: object }
      - id: readback
        operation: reply/thread.reply.read
        input: $steps.prepare_check.read_request
      - id: finish
        inputs:
          expected_provider: $input.expected_provider
          thread_locator: $input.thread_locator
          conversation_id: $input.conversation_id
          message_id: $input.message_id
          content_digest: $input.content_digest
          attempt: $input.attempt
          delivery_route: $input.delivery_route
          readback: $steps.readback.provider_operation.data
        tool: { module: conversation-reply.mjs, export: finishDeliveryCheck }
        outputs: { work_result: object }
        artifacts:
          named_emits: { work_result: work_result }
          packets: { work_result: runx.work_outcome.v1 }
