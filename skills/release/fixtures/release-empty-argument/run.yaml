minimum_runx: 0.12.0
catalog:
  visibility: internal
methods:
  run:
    steps:
      - id: setup
        inputs:
          prepare_status: ready
          exact_argument: ""
        tool:
          command: node
          args:
            - ../support/setup_release_fixture.mjs
        outputs:
          project_root: {type: string}
          profile_path: {type: string}
      - id: release
        skill: ../..#release
        inputs:
          channel: fixture
          version: 1.2.3
          last_tag: v1.2.2
          operator_context: Fixture release proves exact-command publication and separate readback.
          project_root: $steps.setup.project_root
          profile_path: $steps.setup.profile_path
