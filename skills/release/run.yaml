version: "0.4.14"
minimum_runx: 0.12.0
default_method: release
catalog:
  visibility: public
  category: code

methods:
  prepare:
    description: Run the release profile's preparation command and produce an evidence-bound release brief.
    inputs:
      project_root: {type: string, description: Existing project directory relative to the Runx workspace.}
      profile_path: {type: string, description: JSON release profile inside project_root.}
      channel: {type: string, description: Release channel declared by the profile.}
      version: {type: string, description: Exact SemVer release version.}
      last_tag: {type: string, description: Previous release anchor for notes., optional: true}
      operator_context: {type: string, description: "Bounded release context, never authority.", optional: true}
    result_from: [finalize-ready-brief, finalize-blocked-brief]
    steps:
      - id: read-profile
        tool: fs.read
        inputs:
          repo_root: $input.project_root
          path: $input.profile_path
          max_bytes: 65536
      - id: inspect-profile
        inputs:
          project_root: $input.project_root
          channel: $input.channel
          version: $input.version
          last_tag: $input.last_tag
          operator_context: $input.operator_context
          profile_file: $steps.read-profile.file_read
        tool: {module: release.mjs, export: inspectProfile}
        outputs:
          release_context:
            type: object
            packet: runx/release.context.v1
      - id: plan-prepare
        tool: command.plan
        inputs:
          output_mode: json
          repo_root: $steps.inspect-profile.release_context.project_root
          command: $steps.inspect-profile.release_context.commands.prepare.command
          args: $steps.inspect-profile.release_context.commands.prepare.args
          cwd: $steps.inspect-profile.release_context.commands.prepare.cwd
          env: $steps.inspect-profile.release_context.commands.prepare.env
          timeout_ms: $steps.inspect-profile.release_context.commands.prepare.timeout_ms
      - id: plan-publish
        tool: command.plan
        inputs:
          output_mode: json
          repo_root: $steps.inspect-profile.release_context.project_root
          command: $steps.inspect-profile.release_context.commands.publish.command
          args: $steps.inspect-profile.release_context.commands.publish.args
          cwd: $steps.inspect-profile.release_context.commands.publish.cwd
          env: $steps.inspect-profile.release_context.commands.publish.env
          timeout_ms: $steps.inspect-profile.release_context.commands.publish.timeout_ms
      - id: plan-verify
        tool: command.plan
        inputs:
          output_mode: json
          repo_root: $steps.inspect-profile.release_context.project_root
          command: $steps.inspect-profile.release_context.commands.verify.command
          args: $steps.inspect-profile.release_context.commands.verify.args
          cwd: $steps.inspect-profile.release_context.commands.verify.cwd
          env: $steps.inspect-profile.release_context.commands.verify.env
          timeout_ms: $steps.inspect-profile.release_context.commands.verify.timeout_ms
      - id: execute-prepare
        tool: command.execute
        inputs:
          output_mode: json
          repo_root: $steps.inspect-profile.release_context.project_root
          command: $steps.inspect-profile.release_context.commands.prepare.command
          args: $steps.inspect-profile.release_context.commands.prepare.args
          cwd: $steps.inspect-profile.release_context.commands.prepare.cwd
          env: $steps.inspect-profile.release_context.commands.prepare.env
          timeout_ms: $steps.inspect-profile.release_context.commands.prepare.timeout_ms
          expected_command_digest: $steps.plan-prepare.command_plan.command_digest
      - id: interpret-prepare
        inputs:
          phase: prepare
          release_context: $steps.inspect-profile.release_context
          command_execution: $steps.execute-prepare.command_execution
          command_plan: $steps.plan-prepare.command_plan
        tool: {module: release.mjs, export: interpretPhase}
        outputs:
          preparation:
            type: object
            packet: runx/release.phase_result.v1
      - id: draft-notes
        when:
          value: $steps.interpret-prepare.preparation.status
          equals: ready
        agent: release-notes
        outputs:
          release_notes:
            type: object
            properties:
              headline:
                type: string
              summary:
                type: string
              changelog:
                type: object
                properties:
                  added:
                    type: array
                  fixed:
                    type: array
                    items:
                      type: string
                  changed:
                    type: array
                  removed:
                    type: array
                  breaking:
                    type: array
              upgrade_guidance:
                type: string
              risks:
                type: array
            required:
              - headline
              - summary
              - changelog
              - upgrade_guidance
              - risks
        inputs:
          release_context: $steps.inspect-profile.release_context
          preparation: $steps.interpret-prepare.preparation
          project_root: $input.project_root
          profile_path: $input.profile_path
          channel: $input.channel
          version: $input.version
          last_tag: $input.last_tag
          operator_context: $input.operator_context
      - id: finalize-ready-brief
        when:
          value: $steps.interpret-prepare.preparation.status
          equals: ready
        inputs:
          release_context: $steps.inspect-profile.release_context
          preparation: $steps.interpret-prepare.preparation
          release_notes: $steps.draft-notes.release_notes
          prepare_plan: $steps.plan-prepare.command_plan
          publish_plan: $steps.plan-publish.command_plan
          verify_plan: $steps.plan-verify.command_plan
        tool: {module: release.mjs, export: finalizeBrief}
        outputs: {release_context: {type: object, packet: runx/release.context.v1}, release_brief: {type: object, packet: runx/release.brief.v1}}
      - id: finalize-blocked-brief
        when:
          value: $steps.interpret-prepare.preparation.status
          equals: failed
        inputs:
          release_context: $steps.inspect-profile.release_context
          preparation: $steps.interpret-prepare.preparation
          prepare_plan: $steps.plan-prepare.command_plan
          publish_plan: $steps.plan-publish.command_plan
          verify_plan: $steps.plan-verify.command_plan
        tool: {module: release.mjs, export: finalizeBrief}
        outputs: {release_context: {type: object, packet: runx/release.context.v1}, release_brief: {type: object, packet: runx/release.brief.v1}}
  release:
    description: Approve a release's exact publish plan, run it without a shell, then verify it with a separate command.
    inputs:
      project_root: {type: string, description: Existing project directory relative to the Runx workspace.}
      profile_path: {type: string, description: JSON release profile inside project_root.}
      channel: {type: string, description: Release channel declared by the profile.}
      version: {type: string, description: Exact SemVer release version.}
      last_tag: {type: string, description: Previous release anchor for notes., optional: true}
      operator_context: {type: string, description: "Bounded release context, never authority.", optional: true}
    result_from: [interpret-verify]
    examples:
      - project_root: .
        profile_path: release-profile.json
        version: 1.4.2
        channel: stable
    steps:
      - id: prepare
        skill: .#prepare
        inputs:
          project_root: $input.project_root
          profile_path: $input.profile_path
          channel: $input.channel
          version: $input.version
          last_tag: $input.last_tag
          operator_context: $input.operator_context
      - id: approve-publish
        guard:
          - {value: $steps.prepare.release_brief.decision, equals: ready_for_approval}
        ask: {gate: release.publish.approval, reason: "Approve this exact version, channel, profile digest, and native command-plan digest."}
        inputs:
          release_brief: $steps.prepare.release_brief
          project_root: $input.project_root
          profile_path: $input.profile_path
          channel: $input.channel
          version: $input.version
          last_tag: $input.last_tag
          operator_context: $input.operator_context
      - id: execute-publish
        guard:
          - {value: $steps.prepare.release_brief.decision, equals: ready_for_approval}
          - {value: $steps.approve-publish.approval_decision.approved, equals: true}
        tool: command.execute
        inputs:
          output_mode: json
          repo_root: $steps.prepare.release_context.project_root
          command: $steps.prepare.release_context.commands.publish.command
          args: $steps.prepare.release_context.commands.publish.args
          cwd: $steps.prepare.release_context.commands.publish.cwd
          env: $steps.prepare.release_context.commands.publish.env
          timeout_ms: $steps.prepare.release_context.commands.publish.timeout_ms
          expected_command_digest: $steps.prepare.release_context.commands.publish.command_digest
      - id: interpret-publish
        guard:
          - {value: $steps.approve-publish.approval_decision.approved, equals: true}
        inputs:
          phase: publish
          release_context: $steps.prepare.release_context
          command_execution: $steps.execute-publish.command_execution
        tool: {module: release.mjs, export: interpretPhase}
        outputs: {publication: {type: object, packet: runx/release.phase_result.v1}}
      - id: execute-verify
        guard:
          - {value: $steps.interpret-publish.publication.status, equals: command_completed}
          - {value: $steps.approve-publish.approval_decision.approved, equals: true}
        tool: command.execute
        inputs:
          output_mode: json
          repo_root: $steps.prepare.release_context.project_root
          command: $steps.prepare.release_context.commands.verify.command
          args: $steps.prepare.release_context.commands.verify.args
          cwd: $steps.prepare.release_context.commands.verify.cwd
          env: $steps.prepare.release_context.commands.verify.env
          timeout_ms: $steps.prepare.release_context.commands.verify.timeout_ms
          expected_command_digest: $steps.prepare.release_context.commands.verify.command_digest
      - id: interpret-verify
        guard:
          - {value: $steps.interpret-publish.publication.status, equals: command_completed}
        inputs:
          phase: verify
          release_context: $steps.prepare.release_context
          command_execution: $steps.execute-verify.command_execution
        tool: {module: release.mjs, export: interpretPhase}
        outputs: {verification: {type: object, packet: runx/release.phase_result.v1}}
