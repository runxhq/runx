skill: content-pipeline
version: "0.4.3"
catalog:
  kind: graph
  audience: public
  visibility: public
  role: context
  execution: read
  completion: runtime_receipt
  approval: none
  category: content

harness:
  files: [fixtures/support/composed.graph]
  cases:
    - name: content-pipeline-produces-bound-draft
      operator_journeys:
        - mode: standalone
          confusors: [ghostwrite, deep-research]
          request: Turn this governed evidence into a citation-bound draft and channel package.
          expected_outcome: Return reader-facing copy, citations, and a provider-neutral publication handoff without claiming publication.
        - mode: composed
          request: Package this completed research evidence for publication channels.
          expected_outcome: Reuse the supplied research packet and source bindings without repeating research or publication planning.
          prior_evidence:
            - The governed research evidence and source bindings supplied in the fixture.
          must_not_repeat:
            - Do not rerun research.
            - Do not reacquire cited sources or publish the resulting handoff.
      inputs:
        objective: Identify the strongest architectural signal in the supplied Runx evidence.
        audience: operators
        channel: brief
        domain: agent infrastructure
        publication_target:
          provider: example
          destination: operator-review-queue
        boundary_kind: external
        source_packets:
          - decision: ready
            final_url: https://example.com/receipts
            status: 200
            content_digest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
            extracted: Runx receipts bind operator actions to explicit authority and verification evidence.
            provenance:
              fetched_at: "2026-07-17T00:00:00Z"
              bytes: 82
              truncated: false
              redirects: []
          - decision: ready
            final_url: https://example.com/skills
            status: 200
            content_digest: sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
            extracted: Portable skill packages separate model judgment from deterministic provider operations.
            provenance:
              fetched_at: "2026-07-17T00:01:00Z"
              bytes: 85
              truncated: false
              redirects: []
      caller:
        answers:
          synthesize:
            research_candidate:
              decision: ready
              research_brief:
                objective: Identify the strongest architectural signal in the supplied Runx evidence.
                scope: agent infrastructure
                summary: The strongest signal is evidence-bound execution packaged behind portable skills.
                open_questions: []
              evidence_log:
                - claim: Receipts bind actions to authority and verification evidence.
                  source_digest: sha256:9056e1b5caa4e78583d0bc47bb731468b31155929a3aa3a35fcadf6136534a36
                  content_digest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
                  confidence: verified
                  relevance: Establishes the governance half of the architecture.
                - claim: Portable skills separate judgment from deterministic operations.
                  source_digest: sha256:c951e0e102215f739709aa280773536f95d4560e1299999af9c2362db6a118dc
                  content_digest: sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
                  confidence: verified
                  relevance: Establishes the packaging and execution half.
              decision_support:
                - option: Lead with evidence-bound portable execution.
                  rationale: Both supplied sources support the combined architecture.
                  source_digests:
                    - sha256:9056e1b5caa4e78583d0bc47bb731468b31155929a3aa3a35fcadf6136534a36
                    - sha256:c951e0e102215f739709aa280773536f95d4560e1299999af9c2362db6a118dc
              risks: []
          author:
            content_draft:
              decision: ready
              content_brief:
                objective: Identify the strongest architectural signal in the supplied Runx evidence.
                audience: operators
                channel: brief
              draft:
                title: Evidence-bound execution is the architecture
                body: Runx binds operator actions to authority evidence and packages deterministic operations behind portable skills.
                claim_refs:
                  - claim: Receipts bind operator actions to authority evidence.
                    source_digests:
                      - sha256:9056e1b5caa4e78583d0bc47bb731468b31155929a3aa3a35fcadf6136534a36
                  - claim: Portable skills separate judgment from deterministic operations.
                    source_digests:
                      - sha256:c951e0e102215f739709aa280773536f95d4560e1299999af9c2362db6a118dc
              review_checklist:
                - Confirm both source bindings remain present.
              distribution_notes:
                primary_channel: brief
              context_binding: { applied: [] }
      expect:
        status: sealed
        steps:
          - research-topic
          - draft-brief
          - package-content
          - prepare-handoff
        step_outputs:
          research-topic:
            subset:
              research_packet:
                data:
                  decision: ready
                  validation:
                    status: pass
          draft-brief:
            subset:
              content_draft_packet:
                data:
                  decision: ready
                  validation:
                    status: pass
          package-content:
            subset:
              content_publish_packet:
                data:
                  decision: ready_for_handoff
                  delivery_status: not_sent
          prepare-handoff:
            subset:
              content_handoff_packet:
                data:
                  handoff_packet:
                    decision: handoff_ready
                    delivery_status: not_sent
        receipt:
          schema: runx.receipt.v1

    - name: content-pipeline-stops-before-drafting-without-sources
      inputs:
        objective: Decide whether the supplied claim is ready.
        audience: operators
        channel: brief
        source_packets: []
      expect:
        status: sealed
        steps:
          - research-topic
        step_outputs:
          research-topic:
            subset:
              research_packet:
                data:
                  decision: needs_more_evidence
                  validation:
                    status: fail
        receipt:
          schema: runx.receipt.v1

runners:
  content-pipeline:
    default: true
    inputs:
      objective:
        type: string
        required: true
        description: What the content must accomplish.
      source_packets:
        type: json
        required: true
        description: Bounded governed source packets, normally web-fetch provider operation evidence.
      audience:
        type: string
        required: false
        default: operators
        description: Intended reader for the draft.
      channel:
        type: string
        required: false
        default: brief
        description: Intended content channel; this runner does not deliver it.
      domain:
        type: string
        required: false
        description: Domain context for interpretation.
      operator_context:
        type: string
        required: false
        description: Local constraints that do not count as evidence.
      target_entities:
        type: json
        required: false
        description: Entities to include or compare.
      publication_target:
        type: json
        required: false
        default: {}
        description: Exact target locator for the later provider delivery lane.
      boundary_kind:
        type: string
        required: false
        default: external
        schema: { enum: [internal, external] }
        description: Whether delivery crosses outside the team; an external delivery needs the delivering lane's own approval.
    result_from: [research-topic, draft-brief, package-content, prepare-handoff]
    steps:
      - id: research-topic
        skill: ../research
        scopes:
          - runx:research:read
        inputs:
          objective: $input.objective
          source_packets: $input.source_packets
          domain: $input.domain
          deliverable: content draft
          operator_context: $input.operator_context
          target_entities: $input.target_entities

      - id: draft-brief
        when:
          value: $steps.research-topic.research_packet.decision
          equals: ready
        skill: ../ghostwrite
        scopes:
          - runx:content:draft
        inputs:
          objective: $input.objective
          audience: $input.audience
          channel: $input.channel
          voice_guide: Write for the declared audience and channel, preserve evidence bindings, and separate verified claims from inference.
          evidence_pack: $steps.research-topic.research_packet

      - id: package-content
        when:
          value: $steps.research-topic.research_packet.decision
          equals: ready
        skill: ../ghostwrite
        runner: package
        inputs:
          channel: $input.channel
          draft: $steps.draft-brief.content_draft_packet

      - id: prepare-handoff
        when:
          value: $steps.research-topic.research_packet.decision
          equals: ready
        skill: ../ghostwrite
        runner: handoff
        inputs:
          channel: $input.channel
          boundary_kind: $input.boundary_kind
          target: $input.publication_target
          packet: $steps.package-content.content_publish_packet
