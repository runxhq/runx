name: keeps-useful-partial-patches
setup:
  credentials:
    - github
inputs:
  repository: example/project
  number: 42
env:
  GITHUB_TOKEN: test-github-token
host:
  answers:
    assess#review:
      review_draft:
        summary: Review the account-specific authentication change.
        findings:
          - path: src/client.rs
            side: RIGHT
            line: 12
            severity: high
            title: Use the selected account token
            trigger: A request is made for a non-default account.
            impact: The changed line authenticates with default_token rather than the selected account token.
            suggested_change: Preserve the selected account token at this call.
        limitations:
          - The review covers the available patch; surrounding initialization is not supplied.
providers:
  http:
    - request:
        method: GET
        url: https://api.github.com/repos/example/project/pulls/42
        body: none
      response:
        status: 200
        headers:
          content-type: application/json
        body: '{"number":42,"head":{"sha":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"},"base":{"sha":"bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb","repo":{"full_name":"example/project"}},"title":"Use account token","body":"Authenticate the request with its account token.","changed_files":3}'
    - request:
        method: GET
        url: https://api.github.com/repos/example/project/compare/bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb...aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa?page=1&per_page=1
        body: none
      response:
        status: 200
        headers:
          content-type: application/json
        body: '{"base_commit":{"sha":"bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"},"merge_base_commit":{"sha":"dddddddddddddddddddddddddddddddddddddddd"},"files":[{"filename":"src/client.rs","status":"modified","additions":1,"deletions":1,"patch":"@@ -12 +12 @@\n-request.auth(account.token);\n+request.auth(default_token);","sha":"eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee"},{"filename":"assets/logo.png","status":"modified","sha":"ffffffffffffffffffffffffffffffffffffffff","additions":0,"deletions":0},{"filename":"src/truncated.rs","status":"modified","sha":"ffffffffffffffffffffffffffffffffffffffff","additions":2,"deletions":2,"patch":"@@ -1,2 +1,2 @@\n-old\n+new"}],"url":"https://api.github.com/repos/example/project/compare/bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb...aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"}'
expect:
  status: sealed
  steps:
    - capture
    - select
    - assess
  step_outputs:
    assess:
      subset:
        pr_review:
          decision: draft_ready
          head_sha: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          publication_status: not_posted
          execution_status: not_tested
          findings:
            - path: src/client.rs
              side: RIGHT
              line: 12
  receipt:
    schema: runx.receipt.v1
