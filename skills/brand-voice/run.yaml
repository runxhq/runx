skill: brand-voice
version: "0.2.9"
catalog:
  kind: graph
  audience: public
  visibility: public
  role: context
  execution: read
  completion: runtime_receipt
  approval: none
  category: content

runners:
  voice:
    default: true
    inputs:
      brand:
        type: string
        required: false
        description: Brand, product, campaign, or surface being modeled; omission returns a bounded needs-more-evidence packet.
      source_material:
        type: array
        required: true
        description: Selected source records with exact kind, content and optional label. At least one approved
          example is needed; this run accepts up to 50 selected examples.
        schema:
          maxItems: 50
          items:
            type: object
            required:
              - kind
              - content
            additionalProperties: false
            properties:
              kind:
                enum:
                  - approved
                  - rejected
                  - draft
                  - operator_note
              content:
                type: string
                minLength: 1
                maxLength: 20000
              label:
                type: string
                maxLength: 1000
      channel:
        type: string
        required: false
        description: Downstream channel for this packet.
      audience:
        type: string
        required: false
        description: Intended downstream audience.
      constraints:
        type: json
        required: false
        description: Legal, accessibility, product, or editorial boundaries.
    result_from: [reject, finalize]
    examples:
      - brand: Acme Cloud
        channel: homepage
        audience: platform engineers
        source_material:
        - kind: approved
          label: launch post
          content: Acme Cloud deploys your service in one command and shows you exactly what changed.
        - kind: rejected
          label: old tagline
          content: The world's most revolutionary cloud platform.
    steps:
      - id: index
        inputs:
          brand: $input.brand
          source_material: $input.source_material
        tool: { module: brand-voice.mjs, export: indexSources }
        outputs:
          source_index: object
        artifacts:
          named_emits:
            source_index: source_index

      - id: digest
        tool: data.digest
        inputs:
          value: $steps.index.source_index.sources

      - id: reject
        when:
          value: $steps.index.source_index.decision
          equals: needs_more_evidence
        inputs:
          brand: $input.brand
          channel: $input.channel
          audience: $input.audience
          source_index: $steps.index.source_index
          evidence_digest: $steps.digest.digest_result.digest
        tool: { module: brand-voice.mjs, export: finalizeVoice }
        outputs:
          brand_voice_packet:
            type: object
        artifacts:
          named_emits:
            brand_voice_packet: brand_voice_packet
          packets:
            brand_voice_packet: runx/brand-voice.context.v1

      - id: synthesize
        when:
          value: $steps.index.source_index.decision
          equals: ready
        agent: { role: editor, task: brand-voice-synthesize }
        outputs:
          brand_voice_draft:
            type: object
            schema:
              properties:
                decision:
                  type: string
                brand:
                  type: string
                applicability:
                  type: object
                  properties:
                    channels:
                      type: array
                      items:
                        type: string
                    audience:
                      type: string
                    boundaries:
                      type: array
                      items:
                        type: string
                brand_voice:
                  type: object
                  properties:
                    voice_principles:
                      type: array
                      items:
                        type: string
                    vocabulary:
                      type: object
                      properties:
                        use:
                          type: array
                          items:
                            type: string
                        avoid:
                          type: array
                          items:
                            type: string
                    cadence:
                      type: array
                      items:
                        type: string
                    claim_rules:
                      type: object
                      properties:
                        safe:
                          type: array
                          items:
                            type: string
                        requires_proof:
                          type: array
                          items:
                            type: string
                        forbidden:
                          type: array
                          items:
                            type: string
                    channel_adjustments:
                      type: array
                      items:
                        type: string
                evidence_bindings:
                  type: array
                  items:
                    type: object
                    properties:
                      rule:
                        type: string
                      source_ids:
                        type: array
                        items:
                          type: string
                redactions:
                  type: array
                stop_conditions:
                  type: array
                  items:
                    type: string
              required:
              - decision
              if:
                properties:
                  decision:
                    pattern: ^ready
              then:
                required:
                - brand
                - applicability
                - brand_voice
                - evidence_bindings
                - redactions
                - stop_conditions
        inputs:
          brand: $input.brand
          channel: $input.channel
          audience: $input.audience
          constraints: $input.constraints
          source_index: $steps.index.source_index
          evidence_digest: $steps.digest.digest_result.digest
          source_material: $input.source_material
        artifacts:
          named_emits:
            brand_voice_draft: brand_voice_draft

      - id: finalize
        when:
          value: $steps.index.source_index.decision
          equals: ready
        inputs:
          brand: $input.brand
          channel: $input.channel
          audience: $input.audience
          source_index: $steps.index.source_index
          evidence_digest: $steps.digest.digest_result.digest
          brand_voice_draft: $steps.synthesize.brand_voice_draft
        tool: { module: brand-voice.mjs, export: finalizeVoice }
        outputs:
          brand_voice_packet: object
        artifacts:
          named_emits:
            brand_voice_packet: brand_voice_packet
          packets:
            brand_voice_packet: runx/brand-voice.context.v1

harness:
  files: [fixtures/support/forward-writing-context.graph]
  cases: []
