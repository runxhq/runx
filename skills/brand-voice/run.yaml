skill: brand-voice
version: "0.2.4"

catalog:
  kind: graph
  audience: public
  visibility: public
  role: context
  execution: read
  completion: runtime_receipt
  approval: none
  category: content

runners:
  voice:
    default: true
    inputs:
      brand:
        type: string
        required: false
        description: Brand, product, campaign, or surface being modeled; omission returns a bounded needs-more-evidence packet.
      source_material:
        type: json
        required: true
        description: Bounded typed source objects; at least one approved source is required.
      channel:
        type: string
        required: false
        description: Downstream channel for this packet.
      audience:
        type: string
        required: false
        description: Intended downstream audience.
      constraints:
        type: json
        required: false
        description: Legal, accessibility, product, or editorial boundaries.
    result_from: [reject, finalize]
    steps:
      - id: index
        inputs:
          brand: $input.brand
          source_material: $input.source_material
        tool: { module: brand-voice.mjs, export: indexSources }
        outputs:
          source_index: object
        artifacts:
          named_emits:
            source_index: source_index

      - id: digest
        tool: data.digest
        inputs:
          value: $steps.index.source_index.sources

      - id: reject
        when:
          value: $steps.index.source_index.decision
          equals: needs_more_evidence
        inputs:
          brand: $input.brand
          channel: $input.channel
          audience: $input.audience
          source_index: $steps.index.source_index
          evidence_digest: $steps.digest.digest_result.digest
        tool: { module: brand-voice.mjs, export: finalizeVoice }
        outputs:
          brand_voice_packet:
            type: object
            schema:
              required: [decision, brand, applicability, brand_voice, evidence, redactions, stop_conditions, receipt_notes, validation]
              additionalProperties: false
              properties:
                decision: { type: string, enum: [ready, needs_more_evidence] }
                brand: { type: string, maxLength: 1000 }
                applicability:
                  type: object
                  required: [channels, audience, boundaries]
                  additionalProperties: false
                  properties:
                    channels: { type: array, maxItems: 50, uniqueItems: true, items: { type: string, minLength: 1, maxLength: 200 } }
                    audience: { type: string, maxLength: 1000 }
                    boundaries: { type: array, maxItems: 100, items: { type: string, minLength: 1, maxLength: 2000 } }
                brand_voice:
                  type: object
                  required: [voice_principles, vocabulary, cadence, claim_rules, channel_adjustments]
                  additionalProperties: false
                  properties:
                    voice_principles: { type: array, maxItems: 100, items: { type: string, minLength: 1, maxLength: 2000 } }
                    vocabulary:
                      type: object
                      required: [use, avoid]
                      additionalProperties: false
                      properties:
                        use: { type: array, maxItems: 200, uniqueItems: true, items: { type: string, minLength: 1, maxLength: 500 } }
                        avoid: { type: array, maxItems: 200, uniqueItems: true, items: { type: string, minLength: 1, maxLength: 500 } }
                    cadence: { type: array, maxItems: 100, items: { type: string, minLength: 1, maxLength: 2000 } }
                    claim_rules:
                      type: object
                      required: [safe, requires_proof, forbidden]
                      additionalProperties: false
                      properties:
                        safe: { type: array, maxItems: 100, items: { type: string, minLength: 1, maxLength: 4000 } }
                        requires_proof: { type: array, maxItems: 100, items: { type: string, minLength: 1, maxLength: 4000 } }
                        forbidden: { type: array, maxItems: 100, items: { type: string, minLength: 1, maxLength: 4000 } }
                    channel_adjustments: { type: array, maxItems: 100, items: { type: string, minLength: 1, maxLength: 2000 } }
                evidence:
                  type: object
                  required: [evidence_digest, sources, bindings]
                  additionalProperties: false
                  properties:
                    evidence_digest: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
                    sources:
                      type: array
                      maxItems: 50
                      items:
                        type: object
                        required: [source_ref, kind, label]
                        additionalProperties: false
                        properties:
                          source_ref: { type: string, pattern: '^source:[1-9][0-9]*$' }
                          kind: { type: string, enum: [approved, rejected, draft, operator_note] }
                          label: { type: string, maxLength: 1000 }
                    bindings:
                      type: array
                      maxItems: 200
                      items:
                        type: object
                        required: [rule, source_refs]
                        additionalProperties: false
                        properties:
                          rule: { type: string, minLength: 1, maxLength: 4000 }
                          source_refs: { type: array, minItems: 1, maxItems: 50, uniqueItems: true, items: { type: string, pattern: '^source:[1-9][0-9]*$' } }
                redactions: { type: array, maxItems: 100, items: { type: string, minLength: 1, maxLength: 2000 } }
                stop_conditions: { type: array, maxItems: 100, items: { type: string, minLength: 1, maxLength: 2000 } }
                receipt_notes:
                  type: object
                  required: [authority, mutation]
                  additionalProperties: false
                  properties:
                    authority: { const: context-only }
                    mutation: { const: false }
                validation:
                  type: object
                  required: [status, findings]
                  additionalProperties: false
                  properties:
                    status: { type: string, enum: [pass, fail] }
                    findings:
                      type: array
                      maxItems: 250
                      items:
                        type: object
                        required: [code, message]
                        additionalProperties: false
                        properties:
                          code: { type: string, minLength: 1, maxLength: 200 }
                          message: { type: string, minLength: 1, maxLength: 4000 }
        artifacts:
          named_emits:
            brand_voice_packet: brand_voice_packet
          packets:
            brand_voice_packet: runx.context.brand_voice.v1

      - id: synthesize
        when:
          value: $steps.index.source_index.decision
          equals: ready
        agent: { role: editor, task: brand-voice-synthesize }
        outputs:
          brand_voice_draft: object
        inputs:
          brand: $input.brand
          channel: $input.channel
          audience: $input.audience
          constraints: $input.constraints
          source_index: $steps.index.source_index
          evidence_digest: $steps.digest.digest_result.digest
          source_material: $input.source_material
        artifacts:
          named_emits:
            brand_voice_draft: brand_voice_draft

      - id: finalize
        when:
          value: $steps.index.source_index.decision
          equals: ready
        inputs:
          brand: $input.brand
          channel: $input.channel
          audience: $input.audience
          source_index: $steps.index.source_index
          evidence_digest: $steps.digest.digest_result.digest
          brand_voice_draft: $steps.synthesize.brand_voice_draft
        tool: { module: brand-voice.mjs, export: finalizeVoice }
        outputs:
          brand_voice_packet: object
        artifacts:
          named_emits:
            brand_voice_packet: brand_voice_packet
          packets:
            brand_voice_packet: runx.context.brand_voice.v1

harness:
  files: [fixtures/support/forward-writing-context.graph]
  cases: []
