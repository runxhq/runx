skill: diagnose-skill-run
version: "0.4.4"

catalog:
  owner: runx
  kind: graph
  audience: builder
  visibility: public
  role: context
  execution: read
  completion: runtime_receipt
  requires_adapter: false
  approval: none
  category: authoring

harness:
  cases:
    - name: diagnose-skill-run-finds-context-flattening
      operator_journeys:
        - mode: standalone
          confusors: [skill-review, run-history]
          request: Diagnose why this Skill Lab run failed and propose the smallest fix.
          expected_outcome: Return an evidence-bound failure diagnosis and bounded improvement proposal without replaying the failed run.
        - mode: composed
          request: Continue from this failed receipt and harness report into a skill improvement diagnosis.
          expected_outcome: Reuse native receipt detail and supplied harness evidence in a skill-build-ready diagnosis without repeating execution.
          prior_evidence:
            - The verified failed receipt detail, harness output, and target skill path supplied in the fixture.
          must_not_repeat:
            - Do not rerun the failed skill.
            - Do not hydrate or rediscover receipt evidence already returned by the native ledger query.
      inputs:
        receipt_id: rcpt_context_flattening
        receipt_rows:
          - receipt_id: rcpt_context_flattening
            skill_ref: skills/skill-build
            status: failed
            created_at: "2026-07-16T00:00:00Z"
            verification_status: verified
        receipt_details:
          - id: rcpt_context_flattening
            receipt_ref: runx:receipt:rcpt_context_flattening
            subject_kind: skill
            subject_ref: skills/skill-build
            created_at: "2026-07-16T00:00:00Z"
            status: failed
            verification:
              status: verified
            authority:
              exercised_scopes:
                - scope: fs:read
                  source: term
            decisions: []
            acts:
              - id: author
                form: execution
                purpose: Produce the bounded skill proposal.
                legitimacy: Held fs.read.
                summary: Downstream authoring context was flattened to JSON text.
                disposition: failed
                reason_code: schema_mismatch
                source_refs: []
                target_refs: []
                artifact_refs: []
                criterion_statuses:
                  - criterion_id: runx:criterion:structured_context
                    status: failed
                    evidence_refs: []
                    verification_refs: []
                context_ref_present: true
            artifact_refs: []
            lineage_refs: []
            seal_reason_code: schema_mismatch
            seal_summary: Structured context was not preserved.
        harness_output: Context edge pointed at stdout and flattened the payload.
        skill_path: skills/skill-build
      caller:
        answers:
          agent.diagnose-skill-run.output:
            verdict: needs_update
            failure_summary: Context edges are reading stdout instead of an artifact envelope, so structured data is flattened before the next step.
            improvement_proposals:
              - target: skills/skill-build/run.yaml
                change: Emit a wrapped artifact from the upstream step and consume the named artifact data in downstream context.
                rationale: Preserves structured objects across governed graph steps.
                risk: Existing fixtures that parse stdout-shaped context will need updates.
            next_harness_checks:
              - skill-build passes structured authoring context into the bounded author step
      expect:
        status: sealed
        steps:
          - evidence
          - diagnose
        step_outputs:
          evidence:
            subset:
              ledger_answer_packet:
                data:
                  ledger_answer:
                    decision: answered
                  matched_receipts:
                    - receipt_id: rcpt_context_flattening
                      status: failed
                      verification_status: verified
                  receipt_details:
                    - id: rcpt_context_flattening
                      subject_ref: skills/skill-build
                      seal_reason_code: schema_mismatch
        receipt:
          schema: runx.receipt.v1

    - name: diagnose-skill-run-passes-on-paused-graph
      inputs:
        receipt_id: rcpt_paused
        receipt_rows:
          - receipt_id: rcpt_paused
            skill_ref: skills/research
            status: deferred
            created_at: "2026-07-16T00:00:00Z"
            verification_status: verified
        receipt_details:
          - id: rcpt_paused
            receipt_ref: runx:receipt:rcpt_paused
            subject_kind: skill
            subject_ref: skills/research
            created_at: "2026-07-16T00:00:00Z"
            status: deferred
            verification:
              status: verified
            authority:
              exercised_scopes: []
            decisions: []
            acts: []
            artifact_refs: []
            lineage_refs: []
            seal_reason_code: needs_agent
            seal_summary: Waiting for bounded caller cognitive work.
        harness_output: needs_agent
        skill_path: skills/research
      caller:
        answers:
          agent.diagnose-skill-run.output:
            verdict: pass
            failure_summary: No failure. The graph paused as designed while awaiting caller cognitive work.
            improvement_proposals: []
            next_harness_checks:
              - target skill completes when a valid agent response is supplied
      expect:
        status: sealed
        receipt:
          schema: runx.receipt.v1

tools:
  - fs.read

runners:
  review:
    default: true
    inputs:
      receipt_id:
        type: string
        required: false
        description: Exact receipt id to resolve through the native ledger.
      receipt_summary:
        type: string
        required: false
        description: Sanitized failure summary when detailed execution evidence is already available.
      receipt_details:
        type: json
        required: false
        description: Explicit native redacted receipt-detail projections for deterministic replay only.
      harness_output:
        type: string
        required: false
        description: Sanitized native harness output or assertion failure.
      skill_path:
        type: string
        required: false
        description: Skill path being reviewed.
      receipt_rows:
        type: json
        required: false
        description: Explicit native-projection rows for deterministic replay only.
    result_from: [diagnose]
    steps:
      - id: evidence
        label: resolve and verify receipt evidence
        skill: ../receipt-query
        runner: read
        inputs:
          question: Resolve the exact receipt referenced by this failure review.
          receipt_ids:
            - $input.receipt_id
          proof:
            verify_chain: true
          receipts: $input.receipt_rows
          receipt_details: $input.receipt_details
      - id: diagnose
        label: diagnose one bounded failure
        agent: { role: reviewer, task: diagnose-skill-run }
        outputs:
          verdict: string
          failure_summary: string
          improvement_proposals: array
          next_harness_checks: array
        inputs:
          receipt_evidence: $steps.evidence.ledger_answer_packet
          receipt_id: $input.receipt_id
          receipt_summary: $input.receipt_summary
          receipt_details: $input.receipt_details
          harness_output: $input.harness_output
          skill_path: $input.skill_path
          receipt_rows: $input.receipt_rows
        artifacts:
          wrap_as: failure_packet
          packet: runx.review.receipt.v1
