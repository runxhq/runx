version: "0.4.10"
minimum_runx: 0.12.0
default_method: review
catalog:
  visibility: public
  category: authoring
methods:
  review:
    inputs:
      receipt_id:
        type: string
        description: Exact receipt id to resolve through the native ledger.
        default: ""
        optional: true
      receipt_summary:
        type: string
        description: Sanitized failure summary when detailed execution evidence is already available.
        optional: true
      receipt_details:
        description: Explicit native redacted receipt-detail projections for deterministic replay only.
        optional: true
      harness_output:
        type: string
        description: Sanitized native harness output or assertion failure.
        optional: true
      skill_path:
        type: string
        description: Skill path being reviewed.
        optional: true
      receipt_rows:
        description: Explicit native-projection rows for deterministic replay only.
        optional: true
      receipt_evidence:
        type: object
        default: {}
        description: Completed ledger packet to reuse without another receipt lookup.
        optional: true
    result_from:
      - review-queried
      - review-supplied
    examples:
      - receipt_id: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    steps:
      - id: select
        tool: data.compare
        inputs:
          actual: $input.receipt_evidence
          expected: {}
      - id: evidence
        skill: ../receipt-query#read
        inputs:
          question: $input.receipt_id
          receipt_ids:
            - $input.receipt_id
          proof:
            verify_chain: true
          receipts: $input.receipt_rows
          receipt_details: $input.receipt_details
        when:
          value: $steps.select.comparison.equal
          equals: true
      - id: review-queried
        when:
          value: $steps.select.comparison.equal
          equals: true
        skill: .#from-evidence
        inputs:
          receipt_id: $input.receipt_id
          receipt_summary: $input.receipt_summary
          harness_output: $input.harness_output
          skill_path: $input.skill_path
          receipt_evidence: $steps.evidence.ledger_answer_packet
      - id: review-supplied
        when:
          value: $steps.select.comparison.equal
          equals: false
        skill: .#from-evidence
        inputs:
          receipt_id: $input.receipt_id
          receipt_summary: $input.receipt_summary
          harness_output: $input.harness_output
          skill_path: $input.skill_path
          receipt_evidence: $input.receipt_evidence
    description: Diagnose one exact receipt or supplied failure evidence, reusing a completed ledger packet when present and never scanning unrelated runs.
  from-evidence:
    description: Diagnose from completed receipt evidence and bounded supplemental failure material without resolving the ledger again; exact retained claim reads remain optional.
    inputs:
      receipt_id: {}
      receipt_summary: {}
      harness_output: {}
      skill_path: {}
      receipt_evidence:
        packet: runx/receipt-query.answer.v1
        description: Completed ledger packet or its explicit empty result for a supplemental-only diagnosis; preserve prior verification posture.
    result_from:
      - finalize
      - blocked
    steps:
      - id: prepare
        tool:
          module: diagnose-skill-run.mjs
          export: prepareDiagnosis
        inputs:
          receipt_id: $input.receipt_id
          receipt_summary: $input.receipt_summary
          harness_output: $input.harness_output
          skill_path: $input.skill_path
          receipt_evidence: $input.receipt_evidence
        outputs:
          preparation: {type: object}
      - id: diagnose
        agent: diagnose-skill-run
        calls:
          tools: [receipt.prove, receipt.read, fs.read_bundle, fs.search]
        inputs:
          receipt_id: $input.receipt_id
          receipt_summary: $input.receipt_summary
          harness_output: $input.harness_output
          skill_path: $input.skill_path
          receipt_evidence: $input.receipt_evidence
        outputs:
          diagnosis:
            type: object
            properties:
              verdict:
                type: string
              failure_summary:
                type: string
              improvement_proposals:
                type: array
                items:
                  type: object
                  properties:
                    target:
                      type: string
                    change:
                      type: string
                    rationale:
                      type: string
                    risk:
                      type: string
              next_harness_checks:
                type: array
                items:
                  type: string
            required:
              - verdict
              - failure_summary
              - improvement_proposals
              - next_harness_checks
        when:
          value: $steps.prepare.preparation.ready
          equals: true
      - id: finalize
        tool:
          module: diagnose-skill-run.mjs
        inputs:
          receipt_id: $input.receipt_id
          receipt_summary: $input.receipt_summary
          harness_output: $input.harness_output
          skill_path: $input.skill_path
          receipt_evidence: $input.receipt_evidence
          candidate: $steps.diagnose.diagnosis
        outputs:
          verdict: {type: string}
          failure_summary: {type: string}
          improvement_proposals: {type: array}
          next_harness_checks: {type: array}
          evidence: {type: array}
          failure_packet: {packet: runx/diagnose-skill-run.diagnosis.v1}
        result_as: failure_packet
        when:
          value: $steps.prepare.preparation.ready
          equals: true
      - id: blocked
        when:
          value: $steps.prepare.preparation.ready
          equals: false
        tool:
          module: diagnose-skill-run.mjs
        inputs:
          receipt_id: $input.receipt_id
          receipt_summary: $input.receipt_summary
          harness_output: $input.harness_output
          skill_path: $input.skill_path
          receipt_evidence: $input.receipt_evidence
          candidate:
            verdict: blocked
            failure_summary: Exact failure evidence is missing.
            improvement_proposals: []
            next_harness_checks:
              - Resolve the selected failed receipt or provide a bounded failure diagnostic.
        outputs:
          verdict: {type: string}
          failure_summary: {type: string}
          improvement_proposals: {type: array}
          next_harness_checks: {type: array}
          evidence: {type: array}
          failure_packet: {packet: runx/diagnose-skill-run.diagnosis.v1}
        result_as: failure_packet
shared_inputs:
  receipt_id:
    type: string
    description: Exact receipt id to resolve through the native ledger.
    default: ""
    optional: true
  receipt_summary:
    type: string
    description: Sanitized failure summary when detailed execution evidence is already available.
    optional: true
  receipt_details:
    description: Explicit native redacted receipt-detail projections for deterministic replay only.
    optional: true
  harness_output:
    type: string
    description: Sanitized native harness output or assertion failure.
    optional: true
  skill_path:
    type: string
    description: Skill path being reviewed.
    optional: true
  receipt_rows:
    description: Explicit native-projection rows for deterministic replay only.
    optional: true
