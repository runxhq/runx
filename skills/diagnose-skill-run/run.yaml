skill: diagnose-skill-run
version: "0.4.10"
catalog:
  publisher: runx
  kind: graph
  audience: builder
  visibility: public
  role: context
  execution: read
  completion: runtime_receipt
  approval: none
  category: authoring
harness:
  files:
    - fixtures/support/composed.graph
  cases:
    - name: diagnose-skill-run-finds-context-flattening
      operator_journeys:
        - mode: standalone
          confusors:
            - skill-review
            - run-history
          request: Diagnose why this Skill Lab run failed and propose the smallest fix.
          expected_outcome: Return an evidence-bound failure diagnosis and bounded improvement proposal without
            replaying the failed run.
        - mode: composed
          request: Continue from this failed receipt and harness report into a skill improvement diagnosis.
          expected_outcome: Reuse native receipt detail and supplied harness evidence in a skill-build-ready diagnosis
            without repeating execution.
          prior_evidence:
            - The verified failed receipt detail, harness output, and target skill path supplied in the
              fixture.
          must_not_repeat:
            - Do not rerun the failed skill.
            - Do not hydrate or rediscover receipt evidence already returned by the native ledger query.
      inputs:
        receipt_id: rcpt_context_flattening
        receipt_rows:
          - receipt_id: rcpt_context_flattening
            skill: skills/skill-build
            outcome: failed
            created_at: 2026-07-16T00:00:00Z
            verification_status: verified
        receipt_details:
          - id: rcpt_context_flattening
            receipt_uri: runx:receipt:rcpt_context_flattening
            subject_kind: graph
            subject_uri: skills/skill-build
            created_at: 2026-07-16T00:00:00Z
            outcome: failed
            verification:
              status: verified
            authority:
              exercised_scopes:
                - scope: fs:read
                  source: term
            decisions: []
            acts:
              - id: author
                form: execution
                purpose: Produce the bounded skill proposal.
                legitimacy: Held fs.read.
                target_uris: []
                artifact_uris: []
                criterion_statuses:
                  - criterion_id: runx:criterion:structured_context
                    status: failed
                    evidence_uris: []
                    verification_uris: []
                context_ref_present: true
            artifact_uris: []
            lineage_uris: []
            seal_reason: graph_step_failed
        harness_output: Context edge pointed at stdout and flattened the payload.
        skill_path: skills/skill-build
      caller:
        answers:
          diagnose:
            diagnosis:
              verdict: needs_update
              failure_summary: Context edges are reading stdout instead of an artifact envelope, so structured data is
                flattened before the next step.
              improvement_proposals:
                - target: skills/skill-build/run.yaml
                  change: Emit a wrapped artifact from the upstream step and consume the named artifact data in downstream
                    context.
                  rationale: Preserves structured objects across governed graph steps.
                  risk: Existing fixtures that parse stdout-shaped context will need updates.
              next_harness_checks:
                - skill-build passes structured authoring context into the bounded author step
      expect:
        status: sealed
        steps:
          - select
          - evidence
          - review-queried
        step_outputs:
          evidence:
            subset:
              ledger_answer_packet:
                data:
                  ledger_answer:
                    decision: answered
                  matched_receipts:
                    - receipt_id: rcpt_context_flattening
                      outcome: failed
                      verification_status: verified
                  receipt_details:
                    - id: rcpt_context_flattening
                      subject_uri: skills/skill-build
                      seal_reason: graph_step_failed
        receipt:
          schema: runx.receipt.v1
    - name: diagnose-skill-run-passes-on-paused-graph
      inputs:
        receipt_id: rcpt_paused
        receipt_rows:
          - receipt_id: rcpt_paused
            skill: skills/research
            outcome: deferred
            created_at: 2026-07-16T00:00:00Z
            verification_status: verified
        receipt_details:
          - id: rcpt_paused
            receipt_uri: runx:receipt:rcpt_paused
            subject_kind: graph
            subject_uri: skills/research
            created_at: 2026-07-16T00:00:00Z
            outcome: deferred
            verification:
              status: verified
            authority:
              exercised_scopes: []
            decisions: []
            acts: []
            artifact_uris: []
            lineage_uris: []
            seal_reason: resolution_pending
        harness_output: needs_agent
        skill_path: skills/research
      caller:
        answers:
          diagnose:
            diagnosis:
              verdict: pass
              failure_summary: No failure. The graph paused as designed while awaiting caller cognitive work.
              improvement_proposals: []
              next_harness_checks:
                - target skill completes when a valid agent response is supplied
      expect:
        status: sealed
        receipt:
          schema: runx.receipt.v1
tools:
  - receipt.prove
  - receipt.read
  - fs.read_bundle
  - fs.search
runners:
  review:
    default: true
    inputs:
      receipt_id:
        type: string
        required: false
        description: Exact receipt id to resolve through the native ledger.
        default: ""
      receipt_summary:
        type: string
        required: false
        description: Sanitized failure summary when detailed execution evidence is already available.
      receipt_details:
        type: json
        required: false
        description: Explicit native redacted receipt-detail projections for deterministic replay only.
      harness_output:
        type: string
        required: false
        description: Sanitized native harness output or assertion failure.
      skill_path:
        type: string
        required: false
        description: Skill path being reviewed.
      receipt_rows:
        type: json
        required: false
        description: Explicit native-projection rows for deterministic replay only.
      receipt_evidence:
        type: object
        required: false
        default: {}
        description: Completed ledger packet to reuse without another receipt lookup.
    result_from:
      - review-queried
      - review-supplied
    examples:
      - receipt_id: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    steps:
      - id: select
        tool: data.compare
        inputs:
          actual: $input.receipt_evidence
          expected: {}
      - id: evidence
        label: resolve and verify receipt evidence
        skill: ../receipt-query
        runner: read
        inputs:
          question: $input.receipt_id
          receipt_ids:
            - $input.receipt_id
          proof:
            verify_chain: true
          receipts: $input.receipt_rows
          receipt_details: $input.receipt_details
        when:
          value: $steps.select.comparison.equal
          equals: true
      - id: review-queried
        when:
          value: $steps.select.comparison.equal
          equals: true
        skill: .
        runner: from-evidence
        inputs:
          receipt_id: $input.receipt_id
          receipt_summary: $input.receipt_summary
          harness_output: $input.harness_output
          skill_path: $input.skill_path
          receipt_evidence: $steps.evidence.ledger_answer_packet
      - id: review-supplied
        when:
          value: $steps.select.comparison.equal
          equals: false
        skill: .
        runner: from-evidence
        inputs:
          receipt_id: $input.receipt_id
          receipt_summary: $input.receipt_summary
          harness_output: $input.harness_output
          skill_path: $input.skill_path
          receipt_evidence: $input.receipt_evidence
    description: Diagnose one exact receipt or supplied failure evidence, reusing a completed ledger packet when
      present and never scanning unrelated runs.
  from-evidence:
    description: Diagnose from completed receipt evidence and bounded supplemental failure material without
      resolving the ledger again; exact retained claim reads remain optional.
    operations: []
    skills: []
    asks: false
    inputs:
      receipt_id:
        definition: receipt_id
      receipt_summary:
        definition: receipt_summary
      harness_output:
        definition: harness_output
      skill_path:
        definition: skill_path
      receipt_evidence:
        type: json
        required: true
        packet: runx/receipt-query.answer.v1
        description: Completed ledger packet or its explicit empty result for a supplemental-only diagnosis; preserve
          prior verification posture.
    result_from:
      - finalize
      - blocked
    steps:
      - id: prepare
        tool:
          module: diagnose-skill-run.mjs
          export: prepareDiagnosis
        inputs:
          receipt_id: $input.receipt_id
          receipt_summary: $input.receipt_summary
          harness_output: $input.harness_output
          skill_path: $input.skill_path
          receipt_evidence: $input.receipt_evidence
        outputs:
          preparation: object
      - id: diagnose
        label: diagnose one bounded failure
        agent:
          role: reviewer
          task: diagnose-skill-run
        inputs:
          receipt_id: $input.receipt_id
          receipt_summary: $input.receipt_summary
          harness_output: $input.harness_output
          skill_path: $input.skill_path
          receipt_evidence: $input.receipt_evidence
        outputs:
          diagnosis:
            type: object
            schema:
              properties:
                verdict:
                  type: string
                failure_summary:
                  type: string
                improvement_proposals:
                  type: array
                  items:
                    type: object
                    properties:
                      target:
                        type: string
                      change:
                        type: string
                      rationale:
                        type: string
                      risk:
                        type: string
                next_harness_checks:
                  type: array
                  items:
                    type: string
              required:
              - verdict
              - failure_summary
              - improvement_proposals
              - next_harness_checks
        when:
          value: $steps.prepare.preparation.ready
          equals: true
      - id: finalize
        tool:
          module: diagnose-skill-run.mjs
        inputs:
          receipt_id: $input.receipt_id
          receipt_summary: $input.receipt_summary
          harness_output: $input.harness_output
          skill_path: $input.skill_path
          receipt_evidence: $input.receipt_evidence
          candidate: $steps.diagnose.diagnosis
        outputs:
          verdict: string
          failure_summary: string
          improvement_proposals: array
          next_harness_checks: array
          evidence: array
        artifacts:
          wrap_as: failure_packet
          packet: runx/diagnose-skill-run.diagnosis.v1
        when:
          value: $steps.prepare.preparation.ready
          equals: true
      - id: blocked
        when:
          value: $steps.prepare.preparation.ready
          equals: false
        tool:
          module: diagnose-skill-run.mjs
        inputs:
          receipt_id: $input.receipt_id
          receipt_summary: $input.receipt_summary
          harness_output: $input.harness_output
          skill_path: $input.skill_path
          receipt_evidence: $input.receipt_evidence
          candidate:
            verdict: blocked
            failure_summary: Exact failure evidence is missing.
            improvement_proposals: []
            next_harness_checks:
              - Resolve the selected failed receipt or provide a bounded failure diagnostic.
        outputs:
          verdict: string
          failure_summary: string
          improvement_proposals: array
          next_harness_checks: array
          evidence: array
        artifacts:
          wrap_as: failure_packet
          packet: runx/diagnose-skill-run.diagnosis.v1
input_definitions:
  receipt_id:
    type: string
    required: false
    description: Exact receipt id to resolve through the native ledger.
    default: ""
  receipt_summary:
    type: string
    required: false
    description: Sanitized failure summary when detailed execution evidence is already available.
  receipt_details:
    type: json
    required: false
    description: Explicit native redacted receipt-detail projections for deterministic replay only.
  harness_output:
    type: string
    required: false
    description: Sanitized native harness output or assertion failure.
  skill_path:
    type: string
    required: false
    description: Skill path being reviewed.
  receipt_rows:
    type: json
    required: false
    description: Explicit native-projection rows for deterministic replay only.
