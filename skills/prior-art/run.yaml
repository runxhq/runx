version: "0.2.14"
minimum_runx: 0.12.0
catalog:
  visibility: public
  category: authoring
default_method: prior-art-agent
shared_inputs:
  objective:
    type: string
    description: Build, content, or operator objective being researched.
    minLength: 1
    pattern: \S
  decomposition:
    description: Structured decomposition output from code-plan.
    optional: true
  workflow_purpose:
    type: string
    description: Downstream purpose such as skill proposal, docs, content, issue, or release.
    optional: true
  audience:
    type: string
    description: Reader or operator who will use the downstream artifact.
    optional: true
  artifact_contract:
    description: Expected downstream output shape.
    optional: true
  source_paths:
    type: array
    default: []
    description: Exact repo-relative files selected by the host or parent; at most sixteen files after decomposition-derived manifests are included.
    maxItems: 16
    uniqueItems: true
    items:
      type: string
      minLength: 1
    optional: true
  repo_root:
    type: string
    default: .
    description: Workspace root used for native catalog and bounded file inspection.
    optional: true
  snapshot:
    packet: runx.artifact.v1
    description: Exact native project artifact descriptor returned by capture; analysis reads only its retained catalog and complete source bundle.
methods:
  prior-art-agent:
    description: Capture the selected repository and catalog evidence once, then return a source-bound recommendation.
    inputs:
      objective: {}
      decomposition: {}
      workflow_purpose: {}
      audience: {}
      artifact_contract: {}
      source_paths: {}
      repo_root: {}
    examples:
      - objective: Check whether this repository already has a retry helper before adding one.
    result_from: [analyze]
    steps:
      - id: capture
        skill: .#capture
        inputs:
          decomposition: $input.decomposition
          source_paths: $input.source_paths
          repo_root: $input.repo_root
      - id: analyze
        skill: .#analyze
        inputs:
          objective: $input.objective
          decomposition: $input.decomposition
          workflow_purpose: $input.workflow_purpose
          audience: $input.audience
          artifact_contract: $input.artifact_contract
          snapshot: $steps.capture.artifact
  capture:
    description: Retain the exact selected source bytes and native catalog projection without model judgment.
    inputs:
      decomposition: {}
      source_paths: {}
      repo_root: {}
    result_from: [store]
    steps:
      - id: plan
        inputs:
          decomposition: $input.decomposition
          source_paths: $input.source_paths
        tool:
          module: prior-art.mjs
          export: planSources
        outputs:
          paths: {type: array}
          limits: {type: object}
      - id: catalog
        tool: runx.skill.inspect
        inputs:
          repo_root: $input.repo_root
      - id: read
        tool: fs.read_bundle
        inputs:
          repo_root: $input.repo_root
          max_bytes: 262144
          on_missing: report
          paths: $steps.plan.paths
      - id: store
        tool: artifact.store
        inputs:
          value:
            limits: $steps.plan.limits
            authoring_context: $steps.catalog.authoring_context
            file_read_bundle: $steps.read.file_read_bundle
  analyze:
    description: Analyze an existing capture without catalog inspection, source reads or repository discovery.
    inputs:
      objective: {}
      decomposition: {}
      workflow_purpose: {}
      audience: {}
      artifact_contract: {}
      snapshot: {}
    result_from: [validate]
    steps:
      - id: open
        tool: artifact.open
        inputs:
          artifact: $input.snapshot
      - id: read-capture
        tool: artifact.read
        inputs:
          ref: $steps.open.artifact.ref
          encoding: utf8
          max_bytes: 4194304
      - id: decode
        tool:
          module: prior-art.mjs
          export: readCapture
          requires: [parseData]
        inputs:
          page: $steps.read-capture.artifact_page
        outputs:
          limits: {type: object}
          authoring_context: {packet: runx.skill_lab.authoring_context.v1}
          file_read_bundle: {packet: runx.fs.file_read_bundle.v1}
          source_paths: {type: array}
      - id: index
        tool:
          module: prior-art.mjs
          export: indexSources
        outputs:
          evidence_index: {type: object}
        inputs:
          limits: $steps.decode.limits
          authoring_context: $steps.decode.authoring_context
          file_read_bundle: $steps.decode.file_read_bundle
      - id: research
        agent: prior-art-research
        outputs:
          prior_art_draft:
            type: object
            additionalProperties: false
            required:
              - decision
              - findings
              - catalog_fit
              - quality_bar
              - recommended_flow
              - sources
              - risks
            properties:
              decision:
                enum:
                  - ready
                  - needs_more_evidence
              findings:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required:
                    - claim
                    - source
                    - relevance
                    - confidence
                  properties:
                    claim:
                      type: string
                      minLength: 1
                    source:
                      type: string
                      minLength: 1
                    relevance:
                      type: string
                      minLength: 1
                    confidence:
                      enum:
                        - verified
                        - likely
                        - unverified
              catalog_fit:
                type: object
                additionalProperties: false
                required:
                  - decision
                  - adjacent_skills
                  - rationale
                properties:
                  decision:
                    enum:
                      - reuse
                      - amend
                      - new_work
                      - stop
                  adjacent_skills:
                    type: array
                    items:
                      type: string
                      minLength: 1
                  rationale:
                    type: string
                    minLength: 1
              quality_bar:
                type: object
                additionalProperties: true
                properties:
                  audience:
                    type: string
                  artifact:
                    type: string
                  evidence:
                    type: string
                  stop_conditions:
                    type: array
                    items:
                      type: string
              recommended_flow:
                type: array
                items:
                  type: object
                  additionalProperties: true
                  properties:
                    step:
                      type: string
                    rationale:
                      type: string
              sources:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required:
                    - path
                  properties:
                    path:
                      type: string
                      minLength: 1
                    kind:
                      type: string
              risks:
                type: array
                items:
                  type: object
                  additionalProperties: true
                  properties:
                    risk:
                      type: string
                    mitigation:
                      type: string
        inputs:
          objective: $input.objective
          decomposition: $input.decomposition
          workflow_purpose: $input.workflow_purpose
          audience: $input.audience
          artifact_contract: $input.artifact_contract
          evidence_index: $steps.index.evidence_index
          source_paths: $steps.decode.source_paths
          repo_root: $steps.decode.file_read_bundle.repo_root
          inspected_bundle: $steps.decode.file_read_bundle
      - id: validate
        inputs:
          evidence_index: $steps.index.evidence_index
          prior_art_draft: $steps.research.prior_art_draft
        tool:
          module: prior-art.mjs
          export: validatePriorArt
        outputs:
          decision: {type: string}
          findings: {type: array}
          catalog_fit: {type: object}
          quality_bar: {type: object}
          recommended_flow: {type: array}
          sources: {type: array}
          risks: {type: array}
          evidence: {type: object}
          validation: {type: object}
          prior_art_report: {packet: runx/prior-art.report.v1}
        result_as: prior_art_report
