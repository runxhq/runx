minimum_runx: 0.12.0
catalog:
  visibility: internal
methods:
  run:
    steps:
      - id: capture
        skill: ../..#capture
        inputs:
          repo_root: fixtures/workspace
          source_paths:
            - skills/moltbook/run.yaml
          decomposition:
            objective_summary: Add a Moltbook opportunity scan step.
            orchestration_steps:
              - id: scan
                skill: ../moltbook
                method: scan
            required_skills:
              - name: moltbook
                exists: true
      - id: prior-art
        skill: ../..#analyze
        inputs:
          objective: Add a Moltbook opportunity scan to an existing governed pipeline.
          snapshot: $steps.capture.artifact
      - id: digest
        tool: data.digest
        inputs:
          value: $steps.prior-art
