skill: sql-analyst
version: "0.4.2"

catalog:
  kind: graph
  audience: operator
  visibility: public
  role: context
  execution: read
  completion: runtime_receipt
  requires_adapter: true
  approval: none
  category: data

harness:
  files: [fixtures/support/forward-data-store-read.graph]
  cases:
    - name: sql-analyst-validates-readonly-plan
      operator_journeys:
        - mode: standalone
          request: Produce a safe read-only SQL analysis plan for this business question and schema.
          expected_outcome: Return a schema-valid read-only plan and explicit governed execution handoff without running raw SQL.
        - mode: composed
          request: Plan the analysis from this already validated schema and source contract.
          expected_outcome: Reuse supplied schema provenance and business question without rediscovering fields or executing a query.
          prior_evidence:
            - The validated schema, source contract, and business question supplied in the fixture.
          must_not_repeat:
            - Do not inspect the database schema again.
            - Do not execute SQL or invent fields absent from the supplied schema.
      runner: plan
      inputs:
        question: Which lifecycle emails drove the most qualified trials last week?
        dialect: postgres
        as_of: "2026-07-17T12:00:00Z"
        schema_summary:
          source_ref: schema:analytics:v4
          source_digest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          observed_at: "2026-07-17T10:00:00Z"
          tables:
            email_events:
              fields: [campaign_id, event_type, occurred_at, account_id]
            trials:
              fields: [account_id, qualified_at, source_campaign_id]
        sample_rows:
          source_ref: sample:analytics:v4
          source_digest: sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          observed_at: "2026-07-17T10:00:00Z"
          rows:
            - { campaign_id: welcome_1, event_type: click, account_id: acct_1 }
        constraints:
          allowed_tables: [email_events, trials]
          read_only: true
          max_rows: 100
      caller:
        answers:
          agent.sql-plan.output:
            sql_plan_draft:
              decision: ready
              query_plan:
                intent: Rank lifecycle campaigns by qualified trials in the supplied period.
                dialect: postgres
                tables: [email_events, trials]
                fields:
                  - email_events.campaign_id
                  - trials.account_id
                  - trials.qualified_at
                joins:
                  - { left: trials.source_campaign_id, right: email_events.campaign_id, type: inner }
                filters:
                  - { field: trials.qualified_at, operator: between, value_ref: requested_week }
                  - { field: email_events.event_type, operator: in, value_ref: qualified_engagement_types }
                limit: 50
              validation_checks:
                - Confirm source_campaign_id coverage before interpreting attribution.
              interpretation:
                summary: Rank qualified-trial contribution rather than raw clicks.
                caveats: [Trials without source_campaign_id are unattributed.]
              residual_risks: [Attribution is incomplete when source_campaign_id is missing.]
      expect:
        status: sealed
        steps: [prepare, plan, finalize]
        step_outputs:
          finalize:
            subset:
              sql_analysis_plan:
                data:
                  decision: ready
                  execution:
                    status: planned_only
                    executed: false
                  validation: { status: pass }
        receipt: { schema: runx.receipt.v1 }

    - name: sql-analyst-rejects-invented-field
      runner: plan
      inputs:
        question: Count qualified trials.
        dialect: postgres
        as_of: "2026-07-17T12:00:00Z"
        schema_summary:
          source_ref: schema:analytics:v4
          source_digest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          observed_at: "2026-07-17T10:00:00Z"
          tables:
            trials:
              fields: [account_id, qualified_at]
        constraints: { allowed_tables: [trials], read_only: true, max_rows: 100 }
      caller:
        answers:
          agent.sql-plan.output:
            sql_plan_draft:
              decision: ready
              query_plan:
                intent: Count trials.
                dialect: postgres
                tables: [trials]
                fields: [trials.secret_score]
                joins: []
                filters: []
                limit: 10
              validation_checks: []
              interpretation: { summary: Count trials., caveats: [] }
              residual_risks: []
      expect:
        status: sealed
        steps: [prepare, plan, finalize]
        step_outputs:
          finalize:
            subset:
              sql_analysis_plan:
                data:
                  decision: needs_schema
                  execution: { status: not_ready, executed: false }
                  validation: { status: fail }
        receipt: { schema: runx.receipt.v1 }

    - name: sql-analyst-refuses-write-request-before-agent
      runner: plan
      inputs:
        question: Delete every inactive account.
        dialect: postgres
        as_of: "2026-07-17T12:00:00Z"
        schema_summary:
          source_ref: schema:analytics:v4
          source_digest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          observed_at: "2026-07-17T10:00:00Z"
          tables:
            accounts:
              fields: [id, active]
        constraints: { allowed_tables: [accounts], read_only: true, max_rows: 100 }
      expect:
        status: sealed
        steps: [prepare, reject]
        step_outputs:
          reject:
            subset:
              sql_analysis_plan:
                data:
                  decision: unsafe_request
                  execution: { status: not_ready, executed: false }
        receipt: { schema: runx.receipt.v1 }

    - name: sql-analyst-rejects-unprovenanced-schema
      runner: plan
      inputs:
        question: Count qualified trials.
        dialect: postgres
        as_of: "2026-07-17T12:00:00Z"
        schema_summary:
          tables:
            trials:
              fields: [account_id, qualified_at]
        constraints: { allowed_tables: [trials], read_only: true, max_rows: 100 }
      expect:
        status: sealed
        steps: [prepare, reject]
        step_outputs:
          reject:
            subset:
              sql_analysis_plan:
                data:
                  decision: needs_schema
                  execution: { status: not_ready, executed: false }
                  validation: { status: fail }
        receipt: { schema: runx.receipt.v1 }

runners:
  analyst:
    default: true
    inputs:
      question:
        type: string
        required: true
        description: Bounded question to answer from one declared governed data read.
      schema_summary:
        type: json
        required: true
        description: Source-bound available tables and fields.
      dialect:
        type: string
        required: false
        default: postgres
      as_of:
        type: string
        required: true
      max_schema_age_days:
        type: number
        required: false
        default: 30
      sample_rows:
        type: json
        required: false
      constraints:
        type: json
        required: false
      execution_context:
        type: json
        required: true
        description: Exact data-store read runner and bounded resource inputs; raw SQL is never accepted.
    result_from: [interpret-projection, interpret-events, interpret-heads]
    steps:
      - id: plan
        skill: .
        runner: plan
        inputs:
          question: $input.question
          schema_summary: $input.schema_summary
          dialect: $input.dialect
          as_of: $input.as_of
          max_schema_age_days: $input.max_schema_age_days
          sample_rows: $input.sample_rows
          constraints: $input.constraints
          execution_context: $input.execution_context

      - id: read-projection
        when:
          value: $steps.plan.sql_analysis_plan.execution.handoff.runner
          equals: read_projection
        skill: ../data-store
        runner: read_projection
        inputs:
          data_source_ref: $steps.plan.sql_analysis_plan.execution.handoff.inputs.data_source_ref
          resource: $steps.plan.sql_analysis_plan.execution.handoff.inputs.resource
          aggregate_id: $steps.plan.sql_analysis_plan.execution.handoff.inputs.aggregate_id

      - id: read-events
        when:
          value: $steps.plan.sql_analysis_plan.execution.handoff.runner
          equals: read_events
        skill: ../data-store
        runner: read_events
        inputs:
          data_source_ref: $steps.plan.sql_analysis_plan.execution.handoff.inputs.data_source_ref
          resource: $steps.plan.sql_analysis_plan.execution.handoff.inputs.resource
          aggregate_id: $steps.plan.sql_analysis_plan.execution.handoff.inputs.aggregate_id
          limit: $steps.plan.sql_analysis_plan.execution.handoff.inputs.limit

      - id: read-heads
        when:
          value: $steps.plan.sql_analysis_plan.execution.handoff.runner
          equals: list_stream_heads
        skill: ../data-store
        runner: list_stream_heads
        inputs:
          data_source_ref: $steps.plan.sql_analysis_plan.execution.handoff.inputs.data_source_ref
          resource: $steps.plan.sql_analysis_plan.execution.handoff.inputs.resource
          limit: $steps.plan.sql_analysis_plan.execution.handoff.inputs.limit

      - id: interpret-projection
        when:
          value: $steps.plan.sql_analysis_plan.execution.handoff.runner
          equals: read_projection
        agent: { role: analyst, task: sql-interpret }
        outputs:
          analysis_result: object
        inputs:
          question: $input.question
          validated_plan: $steps.plan.sql_analysis_plan
          governed_data: $steps.read-projection.data_operation_result
          schema_summary: $input.schema_summary
          dialect: $input.dialect
          as_of: $input.as_of
          max_schema_age_days: $input.max_schema_age_days
          sample_rows: $input.sample_rows
          constraints: $input.constraints
          execution_context: $input.execution_context
        artifacts:
          named_emits:
            analysis_result: analysis_result

      - id: interpret-events
        when:
          value: $steps.plan.sql_analysis_plan.execution.handoff.runner
          equals: read_events
        agent: { role: analyst, task: sql-interpret }
        outputs:
          analysis_result: object
        inputs:
          question: $input.question
          validated_plan: $steps.plan.sql_analysis_plan
          governed_data: $steps.read-events.data_operation_result
          schema_summary: $input.schema_summary
          dialect: $input.dialect
          as_of: $input.as_of
          max_schema_age_days: $input.max_schema_age_days
          sample_rows: $input.sample_rows
          constraints: $input.constraints
          execution_context: $input.execution_context
        artifacts:
          named_emits:
            analysis_result: analysis_result

      - id: interpret-heads
        when:
          value: $steps.plan.sql_analysis_plan.execution.handoff.runner
          equals: list_stream_heads
        agent: { role: analyst, task: sql-interpret }
        outputs:
          analysis_result: object
        inputs:
          question: $input.question
          validated_plan: $steps.plan.sql_analysis_plan
          governed_data: $steps.read-heads.data_operation_result
          schema_summary: $input.schema_summary
          dialect: $input.dialect
          as_of: $input.as_of
          max_schema_age_days: $input.max_schema_age_days
          sample_rows: $input.sample_rows
          constraints: $input.constraints
          execution_context: $input.execution_context
        artifacts:
          named_emits:
            analysis_result: analysis_result

  plan:
    inputs:
      question:
        type: string
        required: true
        description: Bounded data question.
      schema_summary:
        type: json
        required: true
        description: Available table and field summaries.
      dialect:
        type: string
        required: false
        default: postgres
        description: SQL dialect for planning.
      as_of:
        type: string
        required: true
        description: Explicit ISO-8601 evaluation time for schema freshness.
      max_schema_age_days:
        type: number
        required: false
        default: 30
        description: Maximum accepted schema and sample snapshot age.
      sample_rows:
        type: json
        required: false
        description: Optional source-bound snapshot with at most 20 representative non-sensitive rows.
      constraints:
        type: json
        required: false
        description: Allowed tables, maximum rows, privacy, and read-only rules.
      execution_context:
        type: json
        required: false
        description: Optional exact data-store read runner and bounded resource inputs for a governed downstream read.
    result_from: [reject, finalize]
    steps:
      - id: prepare
        inputs:
          question: $input.question
          schema_summary: $input.schema_summary
          dialect: $input.dialect
          as_of: $input.as_of
          max_schema_age_days: $input.max_schema_age_days
          sample_rows: $input.sample_rows
          constraints: $input.constraints
          execution_context: $input.execution_context
        tool: { module: sql-analyst.mjs, export: prepareSchema }
        outputs:
          analysis_context: object
        artifacts:
          named_emits:
            analysis_context: analysis_context

      - id: reject
        when:
          value: $steps.prepare.analysis_context.decision
          equals: stop
        inputs:
          analysis_context: $steps.prepare.analysis_context
        tool: { module: sql-analyst.mjs, export: finalizePlan }
        outputs:
          sql_analysis_plan:
            type: object
            schema:
              required: [decision, query_plan, validation_checks, interpretation, residual_risks, schema_binding, execution, validation]
              additionalProperties: false
              properties:
                decision: { type: string, enum: [ready, needs_schema, unsafe_request] }
                query_plan:
                  type: object
                  additionalProperties: false
                  properties:
                    intent: { type: string, minLength: 1, maxLength: 4000 }
                    dialect: { type: string, enum: [postgres, sqlite, mysql] }
                    tables: { type: array, minItems: 1, maxItems: 100, uniqueItems: true, items: { type: string, minLength: 1, maxLength: 256 } }
                    fields: { type: array, minItems: 1, maxItems: 500, uniqueItems: true, items: { type: string, pattern: '^[A-Za-z_][A-Za-z0-9_$]*\.[A-Za-z_][A-Za-z0-9_$]*$' } }
                    joins:
                      type: array
                      maxItems: 100
                      items:
                        type: object
                        required: [left, right, type]
                        additionalProperties: false
                        properties:
                          left: { type: string, minLength: 3, maxLength: 513 }
                          right: { type: string, minLength: 3, maxLength: 513 }
                          type: { type: string, enum: [inner, left] }
                    filters:
                      type: array
                      maxItems: 100
                      items:
                        type: object
                        required: [field, operator]
                        additionalProperties: false
                        properties:
                          field: { type: string, minLength: 3, maxLength: 513 }
                          operator: { type: string, enum: [eq, neq, gt, gte, lt, lte, between, in, is_null, is_not_null, like] }
                          value_ref: { type: string, minLength: 1, maxLength: 1000 }
                    group_by: { type: array, maxItems: 100, uniqueItems: true, items: { type: string, minLength: 3, maxLength: 513 } }
                    order_by:
                      type: array
                      maxItems: 100
                      items:
                        type: object
                        required: [field, direction]
                        additionalProperties: false
                        properties:
                          field: { type: string, minLength: 3, maxLength: 513 }
                          direction: { type: string, enum: [asc, desc] }
                    limit: { type: integer, minimum: 1, maximum: 10000 }
                validation_checks: { type: array, maxItems: 100, items: { type: string, minLength: 1, maxLength: 2000 } }
                interpretation:
                  type: object
                  additionalProperties: false
                  properties:
                    summary: { type: string, minLength: 1, maxLength: 10000 }
                    caveats: { type: array, maxItems: 100, items: { type: string, minLength: 1, maxLength: 2000 } }
                residual_risks: { type: array, maxItems: 100, items: { type: string, minLength: 1, maxLength: 2000 } }
                schema_binding:
                  type: object
                  required: [dialect, allowed_tables, max_rows, source_evidence]
                  additionalProperties: false
                  properties:
                    dialect: { type: string, enum: [postgres, sqlite, mysql, ''] }
                    allowed_tables: { type: array, maxItems: 100, uniqueItems: true, items: { type: string, minLength: 1, maxLength: 256 } }
                    max_rows: { type: integer, minimum: 0, maximum: 10000 }
                    source_evidence:
                      type: array
                      maxItems: 2
                      items:
                        type: object
                        required: [source_ref, source_digest, observed_at, provenance]
                        additionalProperties: false
                        properties:
                          source_ref: { type: string, minLength: 1, maxLength: 2048 }
                          source_digest: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
                          observed_at: { type: string, format: date-time }
                          provenance: { const: caller_supplied_source_digest }
                execution:
                  type: object
                  required: [status, executed, provider_receipt_ref, handoff]
                  additionalProperties: false
                  properties:
                    status: { type: string, enum: [not_ready, planned_only, prepared_for_governed_read] }
                    executed: { const: false }
                    provider_receipt_ref: { const: '' }
                    handoff:
                      type: object
                      additionalProperties: false
                      properties:
                        skill: { const: data-store }
                        runner: { type: string, enum: [read_projection, read_events, list_stream_heads] }
                        inputs: { type: object, additionalProperties: true }
                validation:
                  type: object
                  required: [status, findings]
                  additionalProperties: false
                  properties:
                    status: { type: string, enum: [pass, fail] }
                    findings:
                      type: array
                      maxItems: 250
                      items:
                        type: object
                        required: [code, message]
                        additionalProperties: false
                        properties:
                          code: { type: string, minLength: 1, maxLength: 200 }
                          message: { type: string, minLength: 1, maxLength: 4000 }
              allOf:
                - if: { properties: { decision: { const: ready } }, required: [decision] }
                  then:
                    properties:
                      query_plan: { required: [intent, dialect, tables, fields, joins, filters, limit] }
                      interpretation: { required: [summary, caveats] }
                    required: [query_plan, interpretation]
        artifacts:
          named_emits:
            sql_analysis_plan: sql_analysis_plan
          packets:
            sql_analysis_plan: runx.data.sql_analysis_plan.v1

      - id: plan
        when:
          value: $steps.prepare.analysis_context.decision
          equals: ready
        agent: { role: analyst, task: sql-plan }
        outputs:
          sql_plan_draft: object
        inputs:
          analysis_context: $steps.prepare.analysis_context
          question: $input.question
          schema_summary: $input.schema_summary
          dialect: $input.dialect
          as_of: $input.as_of
          max_schema_age_days: $input.max_schema_age_days
          sample_rows: $input.sample_rows
          constraints: $input.constraints
          execution_context: $input.execution_context
        artifacts:
          named_emits:
            sql_plan_draft: sql_plan_draft

      - id: finalize
        when:
          value: $steps.prepare.analysis_context.decision
          equals: ready
        inputs:
          analysis_context: $steps.prepare.analysis_context
          sql_plan_draft: $steps.plan.sql_plan_draft
        tool: { module: sql-analyst.mjs, export: finalizePlan }
        outputs:
          sql_analysis_plan: object
        artifacts:
          named_emits:
            sql_analysis_plan: sql_analysis_plan
          packets:
            sql_analysis_plan: runx.data.sql_analysis_plan.v1
