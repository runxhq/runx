name: github-plans-bounded-pull
method: sync
setup:
  sessions:
    - github
inputs:
  repo: runxhq/runx
  direction: pull
  resources:
    kind: issues
    filters:
      state: open
      labels:
        - triage
      limit: 25
  scope: read
env:
  PATH: fixtures/bin:/usr/bin:/bin
providers:
  http:
    - request:
        method: GET
        url: https://api.github.com/user
        body: none
      response:
        status: 200
        headers:
          content-type: application/json
        body: '{"id": 7, "login": "operator"}'
    - request:
        method: GET
        url: https://api.github.com/repos/runxhq/runx/issues?labels=triage&per_page=25&state=open
        body: none
      response:
        status: 200
        headers:
          content-type: application/json
        body: '[{"number": 442, "title": "Make GitHub reads operator-first", "state": "open", "body": "Use the existing local gh session for routine reads.", "html_url": "https://github.com/runxhq/runx/issues/442", "labels": [{"name": "triage"}], "assignees": []}]'
expect:
  status: sealed
  output:
    subset:
      provider_operation:
        data:
          status: success
          provider: github
          operation: issues.list
          target: runxhq/runx
          transport: local_http
          result:
            issues:
              - number: 442
                title: Make GitHub reads operator-first
  receipt:
    schema: runx.receipt.v1
