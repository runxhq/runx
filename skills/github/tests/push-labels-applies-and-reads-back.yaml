name: github-push-labels-applies-and-reads-back
method: push
setup:
  sessions: [github]
inputs:
  repo: runxhq/runx
  resources:
    kind: issues
    mutations:
      - {path: issues/241, op: update, payload: {labels: [triage]}}
  idempotency_key: runxhq/runx:issues/241:labels:triage
env:
  PATH: fixtures/bin:/usr/bin:/bin
providers:
  http:
    - request:
        method: PATCH
        url: https://api.github.com/repos/runxhq/runx/issues/241
        body:
          json:
            labels: [triage]
      response:
        status: 200
        headers: {content-type: application/json}
        body: '{"number": 241, "title": "Sourcey output path is unclear", "state": "open", "labels": [{"name": "triage"}], "assignees": []}'
    - request: {method: GET, url: "https://api.github.com/user", body: none}
      response:
        status: 200
        headers: {content-type: application/json}
        body: '{"id": 7, "login": "operator"}'
    - request: {method: GET, url: "https://api.github.com/repos/runxhq/runx/issues/241", body: none}
      response:
        status: 200
        headers: {content-type: application/json}
        body: '{"number": 241, "title": "Sourcey output path is unclear", "state": "open", "labels": [{"name": "triage"}], "assignees": []}'
expect:
  status: sealed
  steps: [plan, apply]
  output:
    subset:
      provider_operation:
        data:
          status: success
          operation: issues.update
          finality: confirmed
          result:
            updates:
              - status: applied
                acknowledgement: {number: 241, labels: [{name: triage}]}
  receipt: {schema: runx.receipt.v1}
