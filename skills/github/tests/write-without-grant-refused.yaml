name: github-refuses-push-with-read-scope
method: plan
inputs:
  repo: runxhq/runx
  direction: push
  resources:
    kind: issues
    filters: {limit: 1}
    mutations:
      - path: issues/241
        op: update
        payload: {labels: [triage]}
  scope: read
expect:
  status: sealed
  output:
    subset:
      sync_plan:
        data:
          decision: refused
          provider_status: not_called
  receipt: {schema: runx.receipt.v1}
