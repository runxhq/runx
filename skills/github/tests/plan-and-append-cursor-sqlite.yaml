name: github-persists-cursor-through-native-data-operation
method: plan_and_append_cursor
inputs:
  key: runxhq/runx:triage-open
  expected_version: 0
  idempotency_key: runxhq/runx:triage-open:pull:v2
  repo: runxhq/runx
  direction: pull
  resources:
    kind: issues
    filters: {state: open, labels: [triage], limit: 25}
  scope: read
expect:
  status: sealed
  steps: [read-cursor, plan, append-cursor-event, readback]
  step_outputs:
    plan:
      subset:
        sync_plan:
          data:
            decision: ready
            provider_status: not_called
    append-cursor-event:
      subset:
        provider_operation:
          data:
            result:
              schema: runx.store.result.v1
              operation: events.append
              status: committed
              key: runxhq/runx:triage-open
              backend: sqlite
    readback:
      subset:
        provider_operation:
          data:
            result:
              schema: runx.store.result.v1
              operation: key.inspect
              version: 1
              backend: sqlite
  receipt: {schema: runx.receipt.v1}
