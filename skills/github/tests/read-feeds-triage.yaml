name: github-records-feed-triage-without-refetch
package: fixtures/read-triage
setup:
  sessions:
    - github
env:
  PATH: ../bin:/usr/bin:/bin
host:
  answers:
    triage#draft:
      issue_profile:
        repository: runxhq/runx
        number: "241"
        title: Sourcey output path is unclear
        state: open
        summary: The documentation conflicts about the output directory.
      response_strategy:
        stance: acknowledge and clarify
      response_draft:
        channel: github_issue_comment
        body: Thanks for flagging this. The canonical path is being verified before we update the conflicting documentation.
      follow_up_actions:
        - Verify the canonical path.
        - Correct the conflicting documentation.
providers:
  http:
    - request:
        method: GET
        url: https://api.github.com/user
        body: none
      response:
        status: 200
        headers:
          content-type: application/json
        body: '{"id": 7, "login": "operator"}'
    - request:
        method: GET
        url: https://api.github.com/repos/runxhq/runx/issues/241
        body: none
      response:
        status: 200
        headers:
          content-type: application/json
        body: '{"number":241,"title":"Sourcey output path is unclear","state":"open","body":"The docs mention two different output directories.","html_url":"https://github.com/runxhq/runx/issues/241","labels":[],"assignees":[]}'
expect:
  status: sealed
  steps:
    - read
    - triage
  step_outputs:
    triage:
      subset:
        issue_triage_packet:
          data:
            decision: draft_ready
            delivery_status: not_sent
            provider_status: supplied_snapshot
  receipt:
    schema: runx.receipt.v1
    state: sealed
    outcome: completed
