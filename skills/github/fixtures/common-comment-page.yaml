name: github-common-read-comment-page
kind: skill
target: ..
operator_journeys: []
setup:
  sessions:
    - github
env:
  PATH: fixtures/bin:/usr/bin:/bin
inputs:
  repo: runxhq/runx
  kind: comments
  number: 241
  page: 2
  limit: 100
caller:
  http_exchanges:
    - request:
        method: GET
        url: https://api.github.com/user
        body: none
      response:
        status: 200
        headers:
          content-type: application/json
        body: '{"id": 7, "login": "operator"}'
    - request:
        method: GET
        url: https://api.github.com/repos/runxhq/runx/issues/241/comments?page=2&per_page=100
        body: none
      response:
        status: 200
        headers:
          content-type: application/json
        body: '[{"id":99,"body":"The correct directory is
          ./output.","html_url":"https://github.com/runxhq/runx/issues/241#issuecomment-99"}]'
expect:
  status: sealed
  output:
    subset:
      provider_operation:
        data:
          status: success
          provider: github
          operation: comments.list
          target: runxhq/runx
          transport: local_http
          result:
            comments:
              - id: 99
                body: The correct directory is ./output.
  receipt:
    schema: runx.receipt.v1
metadata:
  public_skill: github
  source_case: bounded-pull-local-gh
  source: operator-journey
