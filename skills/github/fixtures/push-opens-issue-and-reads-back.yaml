name: github-push-opens-issue-and-reads-back
kind: skill
target: ..
runner: push
operator_journeys:
  - mode: standalone
    confusors: [github-issue-triage, code-intake]
    request: Open an issue in runxhq/runx titled "Harness cases for issue creation", labelled triage, using the GitHub account signed in on this machine.
    expected_outcome: Open the one approved issue and confirm it by reading the new issue back.
setup:
  sessions: [github]
env:
  PATH: fixtures/bin:/usr/bin:/bin
inputs:
  repo: runxhq/runx
  resources:
    kind: issues
    mutations:
      - ref: issues
        op: create
        payload: { title: Harness cases for issue creation, body: Cover the create and readback path., labels: [triage] }
  idempotency_key: runxhq/runx:issues:create:harness-cases
caller:
  http_exchanges:
    - request:
        method: POST
        url: https://api.github.com/repos/runxhq/runx/issues
        body:
          json:
            title: Harness cases for issue creation
            body: Cover the create and readback path.
            labels: [triage]
      response:
        status: 201
        headers: { content-type: application/json }
        body: '{"number": 512, "title": "Harness cases for issue creation", "body": "Cover the create and readback path.", "state": "open", "labels": [{"name": "triage"}], "assignees": [], "milestone": null}'
    - request: { method: GET, url: "https://api.github.com/user", body: none }
      response:
        status: 200
        headers: { content-type: application/json }
        body: '{"id": 7, "login": "operator"}'
    - request: { method: GET, url: "https://api.github.com/repos/runxhq/runx/issues/512", body: none }
      response:
        status: 200
        headers: { content-type: application/json }
        body: '{"number": 512, "title": "Harness cases for issue creation", "body": "Cover the create and readback path.", "state": "open", "labels": [{"name": "triage"}], "assignees": [], "milestone": null}'
expect:
  status: sealed
  steps: [plan, apply]
  output:
    subset:
      provider_operation:
        data:
          status: success
          operation: issues.create
          finality: confirmed
          result:
            issues:
              - status: applied
                acknowledgement: { number: 512, title: Harness cases for issue creation }
  receipt: { schema: runx.receipt.v1 }
metadata: { public_skill: github, source_case: bounded-push-creates, source: operator-journey }
