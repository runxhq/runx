name: github-persists-cursor-through-native-data-operation
kind: skill
target: ..
runner: plan_and_append_cursor
operator_journeys:
  - mode: composed
    request: Continue this GitHub synchronization from the supplied cursor and prior sync evidence.
    expected_outcome: Reuse the cursor, target, and prior evidence without repeating completed discovery or provider reads.
    prior_evidence:
      - The persisted synchronization cursor and prior provider evidence supplied in the fixture.
    must_not_repeat:
      - Do not repeat provider discovery already covered by the cursor.
      - Do not reapply completed synchronization mutations.
inputs:
  data_source_uri: tenant://github/sqlite-cursors
  resource: github_sync_events
  aggregate_id: runxhq/runx:triage-open
  expected_version: 0
  idempotency_key: runxhq/runx:triage-open:pull:v2
  repo: runxhq/runx
  direction: pull
  resources:
    kind: issues
    filters: { state: open, labels: [triage], limit: 25 }
  scope: read
expect:
  status: sealed
  steps: [read-cursor, plan, append-cursor-event, readback]
  step_outputs:
    plan:
      subset:
        sync_plan:
          data:
            decision: ready
            provider_status: not_called
    append-cursor-event:
      subset:
        provider_operation:
          data:
            result:
              operation: events.append
              provider_evidence:
                backend: sqlite
    readback:
      subset:
        provider_operation:
          data:
            result:
              operation: projection.read
              provider_evidence:
                backend: sqlite
  receipt: { schema: runx.receipt.v1 }
metadata: { public_skill: github, source_case: cursor-operation-proof, source: skills-fixture }
