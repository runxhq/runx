skill: github
version: "0.6.2"

catalog:
  kind: skill
  audience: public
  visibility: public
  role: canonical
  provider: github
  execution: execute
  completion: provider_readback
  approval: none
  category: ops

harness:
  files:
    - fixtures/bin/gh
    - fixtures/support/composed.graph
  cases: []

input_definitions:
  repository:
    type: string
    required: true
    description: Target GitHub repository as owner/name.
    schema:
      pattern: '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$'
      examples: [runxhq/runx]
  direction:
    type: string
    required: true
    description: Synchronization direction.
    schema:
      enum: [pull, push]
  scope:
    type: string
    required: true
    description: Requested repository access.
    schema:
      enum: [read, write]
  resources:
    type: object
    required: true
    description: Bounded issue, pull-request, or thread selector with up to eight typed mutations.
    schema:
      required: [kind]
      additionalProperties: false
      properties:
        kind:
          type: string
          enum: [issues, prs, threads, batch]
        filters: {}
        paths: {}
        mutations: {}
      allOf:
        - if:
            properties: { kind: { const: issues } }
            required: [kind]
          then:
            properties:
              filters:
                type: object
                additionalProperties: false
                properties:
                  state: { type: string, enum: [open, closed, all] }
                  labels:
                    type: array
                    maxItems: 100
                    uniqueItems: true
                    items: { type: string, minLength: 1, maxLength: 100, pattern: '^[^\u0000]+$' }
                  since: { type: string, minLength: 1, maxLength: 64 }
                  limit: { type: integer, minimum: 1, maximum: 100, default: 30 }
                  cursor: { type: string, pattern: '^[1-9][0-9]{0,4}$', description: GitHub page number a listing continues from. }
              paths:
                type: array
                maxItems: 100
                uniqueItems: true
                items: { type: string, pattern: '^issues/[1-9][0-9]*$' }
              mutations:
                type: array
                maxItems: 8
                items:
                  oneOf:
                    - type: object
                      required: [path, op, payload]
                      additionalProperties: false
                      properties:
                        path: { type: string, pattern: '^issues/[1-9][0-9]*$' }
                        op: { const: update }
                        payload:
                          type: object
                          minProperties: 1
                          additionalProperties: false
                          properties:
                            title: { type: string, minLength: 1, maxLength: 256, pattern: '^[^\u0000]+$' }
                            body: { type: string, maxLength: 65536, pattern: '^[^\u0000]*$' }
                            state: { type: string, enum: [open, closed] }
                            state_reason: { type: string, enum: [completed, not_planned, reopened] }
                            labels:
                              type: array
                              maxItems: 100
                              uniqueItems: true
                              items: { type: string, minLength: 1, maxLength: 100, pattern: '^[^\u0000]+$' }
                            assignees:
                              type: array
                              maxItems: 20
                              uniqueItems: true
                              items: { type: string, minLength: 1, maxLength: 100, pattern: '^[^\u0000]+$' }
                            milestone:
                              type: [integer, 'null']
                              minimum: 1
                    - type: object
                      required: [path, op, payload]
                      additionalProperties: false
                      properties:
                        path: { const: issues }
                        op: { const: create }
                        payload:
                          type: object
                          required: [title]
                          additionalProperties: false
                          properties:
                            title: { type: string, minLength: 1, maxLength: 256, pattern: '^[^\u0000]+$' }
                            body: { type: string, maxLength: 65536, pattern: '^[^\u0000]*$' }
                            labels:
                              type: array
                              maxItems: 100
                              uniqueItems: true
                              items: { type: string, minLength: 1, maxLength: 100, pattern: '^[^\u0000]+$' }
                            assignees:
                              type: array
                              maxItems: 10
                              uniqueItems: true
                              items: { type: string, minLength: 1, maxLength: 100, pattern: '^[^\u0000]+$' }
                            milestone: { type: integer, minimum: 1 }
        - if:
            properties: { kind: { const: prs } }
            required: [kind]
          then:
            properties:
              filters:
                type: object
                additionalProperties: false
                properties:
                  state: { type: string, enum: [open, closed, all] }
                  base: { type: string, minLength: 1, maxLength: 255, pattern: '^[A-Za-z0-9._/-]+$' }
                  head: { type: string, minLength: 1, maxLength: 255, pattern: '^[A-Za-z0-9._:/-]+$' }
                  sort: { type: string, enum: [created, updated, popularity, long-running] }
                  direction: { type: string, enum: [asc, desc] }
                  limit: { type: integer, minimum: 1, maximum: 100, default: 30 }
                  cursor: { type: string, pattern: '^[1-9][0-9]{0,4}$', description: GitHub page number a listing continues from. }
              paths:
                type: array
                maxItems: 100
                uniqueItems: true
                items: { type: string, pattern: '^pulls/[1-9][0-9]*$' }
              mutations:
                type: array
                maxItems: 8
                items:
                  type: object
                  required: [path, op, payload]
                  additionalProperties: false
                  properties:
                    path: { type: string, pattern: '^pulls/[1-9][0-9]*$' }
                    op: { const: update }
                    payload:
                      type: object
                      minProperties: 1
                      additionalProperties: false
                      properties:
                        title: { type: string, minLength: 1, maxLength: 256, pattern: '^[^\u0000]+$' }
                        body: { type: string, maxLength: 65536, pattern: '^[^\u0000]*$' }
                        state: { type: string, enum: [open, closed] }
                        base: { type: string, minLength: 1, maxLength: 255, pattern: '^[A-Za-z0-9._/-]+$' }
                        maintainer_can_modify: { type: boolean }
        - if:
            properties: { kind: { const: threads } }
            required: [kind]
          then:
            properties:
              filters:
                type: object
                additionalProperties: false
                properties:
                  thread_path: { type: string, pattern: '^(issues|pulls)/[1-9][0-9]*/comments$' }
                  limit: { type: integer, minimum: 1, maximum: 100, default: 30 }
              paths:
                type: array
                maxItems: 100
                uniqueItems: true
                items: { type: string, pattern: '^(issues|pulls)/[1-9][0-9]*/comments$' }
              mutations:
                type: array
                maxItems: 8
                items:
                  oneOf:
                    - type: object
                      required: [path, op, payload]
                      additionalProperties: false
                      properties:
                        path: { type: string, pattern: '^(issues|pulls)/[1-9][0-9]*/comments$' }
                        op: { const: comment }
                        payload:
                          type: object
                          required: [body]
                          additionalProperties: false
                          properties:
                            body: { type: string, minLength: 1, maxLength: 65536, pattern: '^[^\u0000]+$' }
        - if:
            properties: { kind: { const: batch } }
            required: [kind]
          then:
            properties:
              mutations:
                type: array
                minItems: 1
                maxItems: 8
                items:
                  oneOf:
                    - type: object
                      required: [path, op, payload]
                      additionalProperties: false
                      properties:
                        path: { type: string, pattern: '^issues/[1-9][0-9]*$' }
                        op: { const: update }
                        payload:
                          type: object
                          minProperties: 1
                          additionalProperties: false
                          properties:
                            title: { type: string, minLength: 1, maxLength: 256, pattern: '^[^\u0000]+$' }
                            body: { type: string, maxLength: 65536, pattern: '^[^\u0000]*$' }
                            state: { type: string, enum: [open, closed] }
                            state_reason: { type: string, enum: [completed, not_planned, reopened] }
                            labels:
                              type: array
                              maxItems: 100
                              uniqueItems: true
                              items: { type: string, minLength: 1, maxLength: 100, pattern: '^[^\u0000]+$' }
                            assignees:
                              type: array
                              maxItems: 20
                              uniqueItems: true
                              items: { type: string, minLength: 1, maxLength: 100, pattern: '^[^\u0000]+$' }
                            milestone:
                              type: [integer, 'null']
                              minimum: 1
                    - type: object
                      required: [path, op, payload]
                      additionalProperties: false
                      properties:
                        path: { const: issues }
                        op: { const: create }
                        payload:
                          type: object
                          required: [title]
                          additionalProperties: false
                          properties:
                            title: { type: string, minLength: 1, maxLength: 256, pattern: '^[^\u0000]+$' }
                            body: { type: string, maxLength: 65536, pattern: '^[^\u0000]*$' }
                            labels:
                              type: array
                              maxItems: 100
                              uniqueItems: true
                              items: { type: string, minLength: 1, maxLength: 100, pattern: '^[^\u0000]+$' }
                            assignees:
                              type: array
                              maxItems: 10
                              uniqueItems: true
                              items: { type: string, minLength: 1, maxLength: 100, pattern: '^[^\u0000]+$' }
                            milestone: { type: integer, minimum: 1 }
                    - type: object
                      required: [path, op, payload]
                      additionalProperties: false
                      properties:
                        path: { type: string, pattern: '^pulls/[1-9][0-9]*$' }
                        op: { const: update }
                        payload:
                          type: object
                          minProperties: 1
                          additionalProperties: false
                          properties:
                            title: { type: string, minLength: 1, maxLength: 256, pattern: '^[^\u0000]+$' }
                            body: { type: string, maxLength: 65536, pattern: '^[^\u0000]*$' }
                            state: { type: string, enum: [open, closed] }
                            base: { type: string, minLength: 1, maxLength: 255, pattern: '^[A-Za-z0-9._/-]+$' }
                            maintainer_can_modify: { type: boolean }
                    - type: object
                      required: [path, op, payload]
                      additionalProperties: false
                      properties:
                        path: { type: string, pattern: '^(issues|pulls)/[1-9][0-9]*/comments$' }
                        op: { const: comment }
                        payload:
                          type: object
                          required: [body]
                          additionalProperties: false
                          properties:
                            body: { type: string, minLength: 1, maxLength: 65536, pattern: '^[^\u0000]+$' }
                    - type: object
                      required: [path, op, payload]
                      additionalProperties: false
                      properties:
                        path: { type: string, pattern: '^issues/comments/[1-9][0-9]*$' }
                        op: { const: update }
                        payload:
                          type: object
                          required: [body]
                          additionalProperties: false
                          properties:
                            body: { type: string, minLength: 1, maxLength: 65536, pattern: '^[^\u0000]+$' }
connectors:
  store:
    operations: [events.append, projection.read]
  github:
    operations: [issues.read, issues.list, pullrequests.read, pullrequests.list, comments.list, issues.create, issues.update, pullrequests.update, comments.create, comments.update]
runners:
  github:
    description: "Pull or push one bounded GitHub sync in the direction given: a bounded read of issues, pull requests or comments, or one to eight decided changes of one kind, each read back."
    default: true
    inputs:
      repo: { definition: repository }
      direction: { definition: direction }
      resources: { definition: resources }
      scope: { definition: scope }
      idempotency_key:
        type: string
        required: false
        description: Stable retry key required for push and ignored for pull.
    examples:
      - repo: runxhq/runx
        direction: pull
        resources: { kind: issues, filters: { state: open, labels: [triage], limit: 25 } }
        scope: read
    result_from: [pull, push, plan]
    steps:
      - id: plan
        inputs:
          repo: $input.repo
          direction: $input.direction
          resources: $input.resources
          scope: $input.scope
        tool: { module: github.mjs }
        outputs:
          sync_plan: object
        artifacts:
          named_emits:
            sync_plan: sync_plan
          packets:
            sync_plan: runx/github.sync_plan.v1

      - id: pull
        when:
          value: $steps.plan.sync_plan.decision
          equals: ready
        operation: github
        operation_name: $steps.plan.sync_plan.provider_operation
        input: $steps.plan.sync_plan.provider_input

      - id: push
        when:
          value: $steps.plan.sync_plan.decision
          equals: ready_for_execution
        skill: .
        runner: push
        inputs:
          repo: $input.repo
          resources: $input.resources
          idempotency_key: $input.idempotency_key

  plan:
    description: Plan a pull or push without touching GitHub, naming the exact resources, operation and scope it would use. Use it only when the plan is what you want.
    inputs:
      repo: { definition: repository }
      direction: { definition: direction }
      resources: { definition: resources }
      scope: { definition: scope }
    examples:
      - repo: runxhq/runx
        direction: pull
        resources: { kind: issues, filters: { state: open, labels: [triage], limit: 25 } }
        scope: read
    steps:
      - id: plan
        tool: { module: github.mjs }
        inputs:
          repo: $input.repo
          direction: $input.direction
          resources: $input.resources
          scope: $input.scope
        outputs:
          sync_plan: object
        artifacts:
          named_emits:
            sync_plan: sync_plan
          packets:
            sync_plan: runx/github.sync_plan.v1

  pull:
    description: Read issues, pull requests or comments by a bounded selector, returning GitHub's records whole.
    inputs:
      repo: { definition: repository }
      resources: { definition: resources }
    examples:
      - repo: runxhq/runx
        resources: { kind: issues, filters: { state: open, limit: 25 } }
    result_from: [pull]
    steps:
      - id: plan
        inputs:
          repo: $input.repo
          direction: pull
          resources: $input.resources
          scope: read
        tool: { module: github.mjs }
        outputs:
          sync_plan: object
        artifacts:
          named_emits:
            sync_plan: sync_plan
          packets:
            sync_plan: runx/github.sync_plan.v1

      - id: pull
        when:
          value: $steps.plan.sync_plan.decision
          equals: ready
        operation: github
        operation_name: $steps.plan.sync_plan.provider_operation
        input: $steps.plan.sync_plan.provider_input

  activity:
    description: Read what changed in a repository since a time, the issues and pull requests updated since then, compact enough to summarise. Use it for a periodic summary.
    inputs:
      repo: { definition: repository }
      since:
        type: string
        required: true
        description: The time to read from; every issue and pull request updated at or after it is read.
        schema: { format: date-time, maxLength: 64 }
      page:
        type: integer
        required: false
        description: The page to read, 1 by default; a result with next_page has more.
        schema: { minimum: 1, maximum: 100000 }
    examples:
      - { repo: runxhq/runx, since: "2026-10-19T21:00:00Z" }
    result_from: [digest]
    steps:
      - id: window
        tool: { module: github.mjs, export: activityWindow }
        inputs:
          repo: $input.repo
          since: $input.since
          page: $input.page
        outputs:
          read_input: object

      - id: read
        operation: github/issues.list
        input: $steps.window.read_input

      - id: digest
        tool: { module: github.mjs, export: digestActivity }
        inputs:
          read_input: $steps.window.read_input
          provider_operation: $steps.read.provider_operation
        outputs:
          activity:
            type: object
            schema:
              additionalProperties: false
              required: [repository, since, page, items]
              properties:
                repository: { type: string }
                since: { type: string }
                page: { type: integer, minimum: 1 }
                next_page: { type: integer, minimum: 2 }
                items:
                  type: array
                  maxItems: 100
                  items:
                    type: object
                    additionalProperties: false
                    required: [number, kind, title, state, new, author, bot, created_at, updated_at, closed_at, labels, assignees, comments, url, body, body_left_out]
                    properties:
                      number: { type: integer, minimum: 1 }
                      kind: { enum: [issue, pull_request] }
                      title: { type: string }
                      state: { enum: [open, closed, merged] }
                      new: { type: boolean, description: Opened at or after since. }
                      author: { type: [string, 'null'] }
                      bot: { type: boolean }
                      created_at: { type: string }
                      updated_at: { type: string }
                      closed_at: { type: [string, 'null'] }
                      labels: { type: array, items: { type: string } }
                      assignees: { type: array, items: { type: string } }
                      comments: { type: integer, minimum: 0 }
                      url: { type: string }
                      body: { type: string, maxLength: 600, description: The body's first 600 characters. }
                      body_left_out: { type: integer, minimum: 0, description: Characters of the body not kept. }
        artifacts:
          named_emits: { activity: activity }

  push:
    description: Apply one to eight decided changes of one kind (new issues, issue or pull request updates, or comments) and read each back. Needs write scope.
    inputs:
      repo: { definition: repository }
      resources: { definition: resources }
      idempotency_key:
        type: string
        required: true
        description: Stable retry key for this exact mutation.
    examples:
      - repo: runxhq/runx
        resources:
          kind: issues
          mutations:
            - { path: issues/241, op: update, payload: { labels: [triage] } }
        idempotency_key: runxhq/runx:issues/241:labels:triage
    result_from: [apply]
    steps:
      - id: plan
        inputs:
          repo: $input.repo
          direction: push
          resources: $input.resources
          scope: write
        tool: { module: github.mjs }
        outputs:
          sync_plan: object
        artifacts:
          named_emits:
            sync_plan: sync_plan
          packets:
            sync_plan: runx/github.sync_plan.v1

      - id: apply
        when:
          value: $steps.plan.sync_plan.decision
          equals: ready_for_execution
        operation: github
        idempotency_key: $input.idempotency_key
        operation_name: $steps.plan.sync_plan.provider_operation
        input: $steps.plan.sync_plan.provider_input

  plan_and_append_cursor:
    description: Plan a sync and append it to the store's cursor log, reading the projection back. It keeps the cursor locally and touches nothing on GitHub.
    inputs:
      data_source_uri:
        type: string
        required: true
        description: Logical data source for cursor events.
      resource:
        type: string
        required: true
        description: Declared cursor event resource.
      aggregate_id:
        type: string
        required: true
        description: Cursor stream key.
      expected_version:
        type: number
        required: true
        description: Current cursor stream version.
      idempotency_key:
        type: string
        required: true
        description: Stable retry key.
      repo: { definition: repository }
      direction: { definition: direction }
      resources: { definition: resources }
      scope: { definition: scope }
    examples:
      - data_source_uri: tenant://github/sqlite-cursors
        resource: github_sync_events
        aggregate_id: runxhq/runx:triage-open
        expected_version: 0
        idempotency_key: runxhq/runx:triage-open:pull:v2
        repo: runxhq/runx
        direction: pull
        resources: { kind: issues, filters: { state: open, labels: [triage], limit: 25 } }
        scope: read
    result_from: [readback]
    steps:
      - id: read-cursor
        operation: store/projection.read
        input:
          data_source_uri: $input.data_source_uri
          resource: $input.resource
          aggregate_id: $input.aggregate_id

      - id: plan
        inputs:
          repo: $input.repo
          direction: $input.direction
          resources: $input.resources
          scope: $input.scope
        tool: { module: github.mjs }
        outputs:
          sync_plan: object
        artifacts:
          named_emits:
            sync_plan: sync_plan
          packets:
            sync_plan: runx/github.sync_plan.v1

      - id: append-cursor-event
        operation: store/events.append
        idempotency_key: $input.idempotency_key
        input:
          data_source_uri: $input.data_source_uri
          resource: $input.resource
          aggregate_id: $input.aggregate_id
          expected_version: $input.expected_version
          event: $steps.plan.sync_plan

      - id: readback
        operation: store/projection.read
        input:
          data_source_uri: $input.data_source_uri
          resource: $input.resource
          aggregate_id: $input.aggregate_id
  comment:
    description: Post one note on a pull request, its exact body approved and read back.
    inputs:
      repository:
        type: string
        required: true
        description: Exact GitHub repository slug as owner/name.
        schema: { pattern: '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$', maxLength: 201 }
      pr_number:
        type: string
        required: true
        description: Positive decimal pull-request number.
        schema: { pattern: '^[1-9][0-9]*$', maxLength: 20 }
      body:
        type: string
        required: true
        description: Exact review note body bound into approval and provider readback.
        schema: { minLength: 1, maxLength: 65536 }
      idempotency_key:
        type: string
        required: true
        description: Stable retry key for this exact repository, pull request, and body.
        schema: { minLength: 8, maxLength: 256, pattern: '^[A-Za-z0-9._:-]+$' }
    examples:
      - repository: runxhq/runx
        pr_number: "42"
        body: The reviewed path is sound; please add the missing harness case.
        idempotency_key: runxhq-runx-pr-42-connect-note-v1
    result_from: [post-comment]
    steps:
      - id: post-comment
        operation: github/comments.create
        idempotency_key: $input.idempotency_key
        input:
          repository: $input.repository
          comments:
            - number: $input.pr_number
              body: $input.body
