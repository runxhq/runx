version: "0.6.4"
minimum_runx: 0.12.0
default_method: github
catalog:
  visibility: public
  category: ops
shared_inputs:
  direction:
    type: string
    description: Synchronization direction.
    enum:
      - pull
      - push
  scope:
    type: string
    description: Requested repository access.
    enum:
      - read
      - write
  resources:
    type: object
    description: Bounded issue, pull-request, or thread selector with up to twenty typed mutations per call.
    required:
      - kind
    additionalProperties: false
    properties:
      kind:
        type: string
        enum:
          - issues
          - prs
          - threads
          - batch
      filters: {}
      paths: {}
      mutations:
        type: array
        maxItems: 20
    allOf:
      - if:
          properties:
            kind:
              const: issues
          required:
            - kind
        then:
          properties:
            filters:
              type: object
              additionalProperties: false
              properties:
                state:
                  type: string
                  enum:
                    - open
                    - closed
                    - all
                labels:
                  type: array
                  maxItems: 100
                  uniqueItems: true
                  items:
                    type: string
                    minLength: 1
                    maxLength: 100
                    pattern: ^[^\u0000]+$
                since:
                  type: string
                  minLength: 1
                  maxLength: 64
                limit:
                  type: integer
                  minimum: 1
                  maximum: 100
                  default: 30
                cursor:
                  type: string
                  pattern: ^[1-9][0-9]*$
                  maxLength: 16
                  description: Exact next GitHub page number. It must remain a positive portable integer.
                sort:
                  enum:
                    - created
                    - updated
                    - comments
                direction:
                  enum:
                    - asc
                    - desc
            paths:
              type: array
              maxItems: 100
              uniqueItems: true
              items:
                type: string
                pattern: ^issues/[1-9][0-9]*$
            mutations:
              type: array
              items:
                oneOf:
                  - type: object
                    required:
                      - path
                      - op
                      - payload
                    additionalProperties: false
                    properties:
                      path:
                        type: string
                        pattern: ^issues/[1-9][0-9]*$
                      op:
                        const: update
                      payload:
                        type: object
                        minProperties: 1
                        additionalProperties: false
                        properties:
                          title:
                            type: string
                            minLength: 1
                            maxLength: 256
                            pattern: ^[^\u0000]+$
                          body:
                            type: string
                            maxLength: 65536
                            pattern: ^[^\u0000]*$
                          state:
                            type: string
                            enum:
                              - open
                              - closed
                          state_reason:
                            type: string
                            enum:
                              - completed
                              - not_planned
                              - reopened
                          labels:
                            type: array
                            maxItems: 100
                            uniqueItems: true
                            items:
                              type: string
                              minLength: 1
                              maxLength: 100
                              pattern: ^[^\u0000]+$
                          assignees:
                            type: array
                            maxItems: 20
                            uniqueItems: true
                            items:
                              type: string
                              minLength: 1
                              maxLength: 100
                              pattern: ^[^\u0000]+$
                          milestone:
                            type:
                              - integer
                              - "null"
                            minimum: 1
                  - type: object
                    required:
                      - path
                      - op
                      - payload
                    additionalProperties: false
                    properties:
                      path:
                        const: issues
                      op:
                        const: create
                      payload:
                        type: object
                        required:
                          - title
                        additionalProperties: false
                        properties:
                          title:
                            type: string
                            minLength: 1
                            maxLength: 256
                            pattern: ^[^\u0000]+$
                          body:
                            type: string
                            maxLength: 65536
                            pattern: ^[^\u0000]*$
                          labels:
                            type: array
                            maxItems: 100
                            uniqueItems: true
                            items:
                              type: string
                              minLength: 1
                              maxLength: 100
                              pattern: ^[^\u0000]+$
                          assignees:
                            type: array
                            maxItems: 10
                            uniqueItems: true
                            items:
                              type: string
                              minLength: 1
                              maxLength: 100
                              pattern: ^[^\u0000]+$
                          milestone:
                            type: integer
                            minimum: 1
      - if:
          properties:
            kind:
              const: prs
          required:
            - kind
        then:
          properties:
            filters:
              type: object
              additionalProperties: false
              properties:
                state:
                  type: string
                  enum:
                    - open
                    - closed
                    - all
                base:
                  type: string
                  minLength: 1
                  maxLength: 255
                  pattern: ^[A-Za-z0-9._/-]+$
                head:
                  type: string
                  minLength: 1
                  maxLength: 255
                  pattern: ^[A-Za-z0-9._:/-]+$
                sort:
                  type: string
                  enum:
                    - created
                    - updated
                    - popularity
                    - long-running
                direction:
                  type: string
                  enum:
                    - asc
                    - desc
                limit:
                  type: integer
                  minimum: 1
                  maximum: 100
                  default: 30
                cursor:
                  type: string
                  pattern: ^[1-9][0-9]*$
                  maxLength: 16
                  description: Exact next GitHub page number. It must remain a positive portable integer.
            paths:
              type: array
              maxItems: 100
              uniqueItems: true
              items:
                type: string
                pattern: ^pulls/[1-9][0-9]*$
            mutations:
              type: array
              items:
                type: object
                required:
                  - path
                  - op
                  - payload
                additionalProperties: false
                properties:
                  path:
                    type: string
                    pattern: ^pulls/[1-9][0-9]*$
                  op:
                    const: update
                  payload:
                    type: object
                    minProperties: 1
                    additionalProperties: false
                    properties:
                      title:
                        type: string
                        minLength: 1
                        maxLength: 256
                        pattern: ^[^\u0000]+$
                      body:
                        type: string
                        maxLength: 65536
                        pattern: ^[^\u0000]*$
                      state:
                        type: string
                        enum:
                          - open
                          - closed
                      base:
                        type: string
                        minLength: 1
                        maxLength: 255
                        pattern: ^[A-Za-z0-9._/-]+$
                      maintainer_can_modify:
                        type: boolean
      - if:
          properties:
            kind:
              const: threads
          required:
            - kind
        then:
          properties:
            filters:
              type: object
              additionalProperties: false
              properties:
                thread_path:
                  type: string
                  pattern: ^(issues|pulls)/[1-9][0-9]*/comments$
                limit:
                  type: integer
                  minimum: 1
                  maximum: 100
                  default: 30
                cursor:
                  type: string
                  pattern: ^[1-9][0-9]*$
                  maxLength: 16
                  description: Exact next GitHub page number. It must remain a positive portable integer.
            paths:
              type: array
              maxItems: 100
              uniqueItems: true
              items:
                type: string
                pattern: ^(issues|pulls)/[1-9][0-9]*/comments$
            mutations:
              type: array
              items:
                oneOf:
                  - type: object
                    required:
                      - path
                      - op
                      - payload
                    additionalProperties: false
                    properties:
                      path:
                        type: string
                        pattern: ^(issues|pulls)/[1-9][0-9]*/comments$
                      op:
                        const: comment
                      payload:
                        type: object
                        required:
                          - body
                        additionalProperties: false
                        properties:
                          body:
                            type: string
                            minLength: 1
                            maxLength: 65536
                            pattern: ^[^\u0000]+$
      - if:
          properties:
            kind:
              const: batch
          required:
            - kind
        then:
          properties:
            mutations:
              type: array
              minItems: 1
              items:
                oneOf:
                  - type: object
                    required:
                      - path
                      - op
                      - payload
                    additionalProperties: false
                    properties:
                      path:
                        type: string
                        pattern: ^issues/[1-9][0-9]*$
                      op:
                        const: update
                      payload:
                        type: object
                        minProperties: 1
                        additionalProperties: false
                        properties:
                          title:
                            type: string
                            minLength: 1
                            maxLength: 256
                            pattern: ^[^\u0000]+$
                          body:
                            type: string
                            maxLength: 65536
                            pattern: ^[^\u0000]*$
                          state:
                            type: string
                            enum:
                              - open
                              - closed
                          state_reason:
                            type: string
                            enum:
                              - completed
                              - not_planned
                              - reopened
                          labels:
                            type: array
                            maxItems: 100
                            uniqueItems: true
                            items:
                              type: string
                              minLength: 1
                              maxLength: 100
                              pattern: ^[^\u0000]+$
                          assignees:
                            type: array
                            maxItems: 20
                            uniqueItems: true
                            items:
                              type: string
                              minLength: 1
                              maxLength: 100
                              pattern: ^[^\u0000]+$
                          milestone:
                            type:
                              - integer
                              - "null"
                            minimum: 1
                  - type: object
                    required:
                      - path
                      - op
                      - payload
                    additionalProperties: false
                    properties:
                      path:
                        const: issues
                      op:
                        const: create
                      payload:
                        type: object
                        required:
                          - title
                        additionalProperties: false
                        properties:
                          title:
                            type: string
                            minLength: 1
                            maxLength: 256
                            pattern: ^[^\u0000]+$
                          body:
                            type: string
                            maxLength: 65536
                            pattern: ^[^\u0000]*$
                          labels:
                            type: array
                            maxItems: 100
                            uniqueItems: true
                            items:
                              type: string
                              minLength: 1
                              maxLength: 100
                              pattern: ^[^\u0000]+$
                          assignees:
                            type: array
                            maxItems: 10
                            uniqueItems: true
                            items:
                              type: string
                              minLength: 1
                              maxLength: 100
                              pattern: ^[^\u0000]+$
                          milestone:
                            type: integer
                            minimum: 1
                  - type: object
                    required:
                      - path
                      - op
                      - payload
                    additionalProperties: false
                    properties:
                      path:
                        type: string
                        pattern: ^pulls/[1-9][0-9]*$
                      op:
                        const: update
                      payload:
                        type: object
                        minProperties: 1
                        additionalProperties: false
                        properties:
                          title:
                            type: string
                            minLength: 1
                            maxLength: 256
                            pattern: ^[^\u0000]+$
                          body:
                            type: string
                            maxLength: 65536
                            pattern: ^[^\u0000]*$
                          state:
                            type: string
                            enum:
                              - open
                              - closed
                          base:
                            type: string
                            minLength: 1
                            maxLength: 255
                            pattern: ^[A-Za-z0-9._/-]+$
                          maintainer_can_modify:
                            type: boolean
                  - type: object
                    required:
                      - path
                      - op
                      - payload
                    additionalProperties: false
                    properties:
                      path:
                        type: string
                        pattern: ^(issues|pulls)/[1-9][0-9]*/comments$
                      op:
                        const: comment
                      payload:
                        type: object
                        required:
                          - body
                        additionalProperties: false
                        properties:
                          body:
                            type: string
                            minLength: 1
                            maxLength: 65536
                            pattern: ^[^\u0000]+$
                  - type: object
                    required:
                      - path
                      - op
                      - payload
                    additionalProperties: false
                    properties:
                      path:
                        type: string
                        pattern: ^issues/comments/[1-9][0-9]*$
                      op:
                        const: update
                      payload:
                        type: object
                        required:
                          - body
                        additionalProperties: false
                        properties:
                          body:
                            type: string
                            minLength: 1
                            maxLength: 65536
                            pattern: ^[^\u0000]+$
methods:
  github:
    description: Read GitHub records with a repository and optional kind/number. Default is one page of the open issue feed, which GitHub also includes PRs in. No direction or authority scope input is needed for a read.
    inputs:
      repo:
        type: string
        description: Target GitHub repository as owner/name.
        pattern: ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$
        examples:
          - runxhq/runx
      kind:
        type: string
        default: issues
        description: Issue feed, pull-request records, or issue/PR comments. Comments need a number; pull-request review comments are a different API.
        enum:
          - issues
          - pull_requests
          - comments
        optional: true
      number:
        type: integer
        description: Exact issue or pull-request number; omit for a list. Required for comments.
        minimum: 1
        maximum: 9007199254740991
        optional: true
      state:
        type: string
        default: open
        description: List state filter; exact numbered reads return the actual current record.
        enum:
          - open
          - closed
          - all
        optional: true
      labels:
        type: array
        default: []
        description: Exact issue-feed label filters.
        maxItems: 100
        uniqueItems: true
        items:
          type: string
          minLength: 1
          maxLength: 100
        optional: true
      since:
        type: string
        description: Issue-feed updated-since filter. Combine with page/limit for bounded collection.
        format: date-time
        optional: true
      limit:
        type: integer
        default: 30
        description: Maximum records requested in this page; GitHub supports up to 100. Exact numbered reads fetch that record.
        minimum: 1
        maximum: 100
        optional: true
      page:
        type: integer
        default: 1
        description: Page of this unchanged list/comments query. A page is a slice, never a whole-history claim.
        minimum: 1
        maximum: 9007199254740991
        optional: true
    examples:
      - repo: runxhq/runx
      - repo: runxhq/runx
        kind: pull_requests
        number: 554
      - repo: runxhq/runx
        kind: comments
        number: 241
        page: 2
    result_from:
      - read
      - plan
    steps:
      - id: plan
        tool:
          module: github.mjs
          export: planRead
        inputs:
          repo: $input.repo
          kind: $input.kind
          number: $input.number
          state: $input.state
          labels: $input.labels
          since: $input.since
          limit: $input.limit
          page: $input.page
        outputs:
          sync_plan: {type: object, packet: runx/github.sync_plan.v1}
      - id: read
        when:
          value: $steps.plan.sync_plan.decision
          equals: ready
        operation:
          connector: github
          choose: $steps.plan.sync_plan.provider_operation
          from: [issues.read, issues.list, pullrequests.read, pullrequests.list, comments.list, issues.create, issues.update, pullrequests.update, comments.create, comments.update]
        inputs: $steps.plan.sync_plan.provider_input
  plan:
    description: Plan a pull or push without touching GitHub, naming the exact resources, operation and scope it would use. Use it only when the plan is what you want.
    inputs:
      repo:
        type: string
        description: Target GitHub repository as owner/name.
        pattern: ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$
        examples:
          - runxhq/runx
      direction: {}
      resources: {}
      scope: {}
    examples:
      - repo: runxhq/runx
        direction: pull
        resources:
          kind: issues
          filters:
            state: open
            labels:
              - triage
            limit: 25
        scope: read
    steps:
      - id: plan
        tool:
          module: github.mjs
        inputs:
          repo: $input.repo
          direction: $input.direction
          resources: $input.resources
          scope: $input.scope
        outputs:
          sync_plan: {type: object, packet: runx/github.sync_plan.v1}
  pull:
    description: Read issues, pull requests or comments by a bounded selector, returning GitHub's records whole.
    inputs:
      repo:
        type: string
        description: Target GitHub repository as owner/name.
        pattern: ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$
        examples:
          - runxhq/runx
      resources: {}
    examples:
      - repo: runxhq/runx
        resources:
          kind: issues
          filters:
            state: open
            limit: 25
    result_from:
      - pull
    steps:
      - id: plan
        inputs:
          repo: $input.repo
          direction: pull
          resources: $input.resources
          scope: read
        tool:
          module: github.mjs
        outputs:
          sync_plan: {type: object, packet: runx/github.sync_plan.v1}
      - id: pull
        when:
          value: $steps.plan.sync_plan.decision
          equals: ready
        operation:
          connector: github
          choose: $steps.plan.sync_plan.provider_operation
          from: [issues.read, issues.list, pullrequests.read, pullrequests.list, comments.list, issues.create, issues.update, pullrequests.update, comments.create, comments.update]
        inputs: $steps.plan.sync_plan.provider_input
  push:
    description: Apply one to twenty decided changes of one kind (new issues, issue or pull request updates, or comments) and read each back. Needs write scope.
    inputs:
      repo:
        type: string
        description: Target GitHub repository as owner/name.
        pattern: ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$
        examples:
          - runxhq/runx
      resources: {}
      idempotency_key:
        type: string
        description: Stable retry key for this exact mutation.
    examples:
      - repo: runxhq/runx
        resources:
          kind: issues
          mutations:
            - path: issues/241
              op: update
              payload:
                labels:
                  - triage
        idempotency_key: runxhq/runx:issues/241:labels:triage
    result_from:
      - apply
    steps:
      - id: plan
        inputs:
          repo: $input.repo
          direction: push
          resources: $input.resources
          scope: write
        tool:
          module: github.mjs
        outputs:
          sync_plan: {type: object, packet: runx/github.sync_plan.v1}
      - id: apply
        when:
          value: $steps.plan.sync_plan.decision
          equals: ready_for_execution
        operation:
          connector: github
          choose: $steps.plan.sync_plan.provider_operation
          from: [issues.read, issues.list, pullrequests.read, pullrequests.list, comments.list, issues.create, issues.update, pullrequests.update, comments.create, comments.update]
        idempotency_key: $input.idempotency_key
        inputs: $steps.plan.sync_plan.provider_input
  activity:
    description: Read what changed in each repository since its position or a time, to the end, repository by repository. Each repository's coverage and next position come back, and nothing is written.
    inputs:
      repositories:
        type: array
        minItems: 1
        maxItems: 100
        description: Each repository, read from its position, or from since when it has none, or from the beginning with neither.
        items:
          type: object
          additionalProperties: false
          required: [repository]
          properties:
            repository: {type: string, pattern: "^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$", maxLength: 140}
            since: {type: string, format: date-time, maxLength: 64}
            position: {type: object, additionalProperties: false, required: [updated_at, ids_at_mark], properties: {updated_at: {type: string, format: date-time}, ids_at_mark: {type: array, items: {type: integer, minimum: 1}}}, description: "Where a read starts. The same shape as activity's output and the stored event, with no cap on ids_at_mark, since a bulk change can give many items one timestamp."}
    examples:
      - repositories: [{repository: runxhq/runx, since: "2026-11-01T00:00:00Z"}]
    steps:
      - id: read
        script: {module: github.mjs, export: activity}
        inputs: {repositories: $input.repositories}
        calls:
          operations: [github/issues.list]
        max_calls: 400
        effects: none
        outputs:
          coverage:
            type: array
            items:
              type: object
              additionalProperties: false
              required: [repository, started, complete, items, position]
              properties:
                repository: {type: string}
                started: {type: boolean}
                complete: {type: boolean}
                error: {type: object, required: [code, message], properties: {code: {type: string}, message: {type: string}}}
                items: {type: array, items: {type: object}}
                position: {type: object, additionalProperties: false, required: [updated_at, ids_at_mark], properties: {updated_at: {type: string, format: date-time}, ids_at_mark: {type: array, items: {type: integer, minimum: 1}}}, description: "Where a read starts. The same shape as activity's output and the stored event, with no cap on ids_at_mark, since a bulk change can give many items one timestamp."}
          evidence:
            type: array
            items: {type: string}
            description: The calls this read rests on, by the digest of the intent each one's seal binds.
  follow:
    description: What a schedule runs. Read this reader's position for each repository, read from there, store what was read, then move each position only past it, and return the coverage with a verdict a schedule can trust.
    inputs:
      repositories:
        type: array
        minItems: 1
        maxItems: 100
        uniqueItems: true
        items: {type: string, pattern: "^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$", maxLength: 140}
      reader:
        type: string
        pattern: "^[A-Za-z0-9][A-Za-z0-9._@-]*$"
        maxLength: 128
        description: Who's reading, such as a schedule, given by the host. Positions are per reader, so two jobs can't take each other's results.
      until:
        type: string
        format: date-time
        description: The window's end.
    examples:
      - repositories: [runxhq/runx]
        reader: morning
        until: "2026-11-15T21:00:00Z"
    steps:
      - id: follow
        script: {module: github.mjs, export: follow}
        inputs: {repositories: $input.repositories, reader: $input.reader, until: $input.until, principal: $run.principals.github}
        calls:
          skills: [".#activity"]
          operations: [store/key.inspect, store/events.append]
          tools: [artifact.store, data.digest, verdict.criteria]
        max_calls: 512
        outputs:
          coverage:
            type: array
            description: "[{ repository, position, checked_through, complete, error, fragments }]. A position is kept under the key <first 32 hex of the digest of the reader, the account's id and the query>:<repository>, and each moves with a position.moved event at its expected version, only after its fragments are stored. A quiet repository keeps its position and moves checked_through. The loser of a concurrent move reads again."
            items: {type: object}
          budget_exhausted:
            type: boolean
            description: The run's calls ran out with repositories left, and the host runs follow again in the same occurrence.
          evidence:
            type: array
            items: {type: string}
            description: The sealed reads and appends the verdict rests on, by the digest of the intent each one's seal binds.
          subject:
            type: object
            description: The window the verdict judges, by a digest of the repositories and until.
          criteria:
            type: object
            description: The runx.criteria.v1 set the verdict answers, made with its revision.
      - id: verdict
        tool: {module: github.mjs, export: coverageVerdict}
        inputs: {coverage: $steps.follow.coverage, budget_exhausted: $steps.follow.budget_exhausted, evidence: $steps.follow.evidence, subject: $steps.follow.subject, criteria: $steps.follow.criteria, until: $input.until}
        outputs:
          coverage: {type: array, items: {type: object}}
          budget_exhausted: {type: boolean}
          verdict:
            packet: runx.verdict.v1
            description: Against the runx/github.coverage criteria, whose required criterion is every_repository_read, met only when every repository is checked through until. Its subject is the window, by a digest of the repositories and until. The runtime sets its evaluator.
  comment:
    description: Post one note on a pull request, its exact body approved and read back.
    inputs:
      repository:
        type: string
        description: Exact GitHub repository slug as owner/name.
        pattern: ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$
        maxLength: 201
      pr_number:
        type: string
        description: Positive decimal pull-request number.
        pattern: ^[1-9][0-9]*$
        maxLength: 20
      body:
        type: string
        description: Exact review note body bound into approval and provider readback.
        minLength: 1
        maxLength: 65536
      idempotency_key:
        type: string
        description: Stable retry key for this exact repository, pull request, and body.
        minLength: 8
        maxLength: 256
        pattern: ^[A-Za-z0-9._:-]+$
    examples:
      - repository: runxhq/runx
        pr_number: "42"
        body: The reviewed path is sound; please add the missing test case.
        idempotency_key: runxhq-runx-pr-42-connect-note-v1
    result_from:
      - post-comment
    steps:
      - id: post-comment
        operation: github/comments.create
        idempotency_key: $input.idempotency_key
        inputs:
          repository: $input.repository
          comments:
            - number: $input.pr_number
              body: $input.body
  sync:
    description: "Pull or push one bounded GitHub sync in the direction given: a bounded read of issues, pull requests or comments, or one to twenty decided changes of one kind, each read back."
    inputs:
      repo:
        type: string
        description: Target GitHub repository as owner/name.
        pattern: ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$
        examples:
          - runxhq/runx
      direction: {}
      resources: {}
      scope: {}
      idempotency_key:
        type: string
        description: Stable retry key required for push and ignored for pull.
        optional: true
    examples:
      - repo: runxhq/runx
        direction: pull
        resources:
          kind: issues
          filters:
            state: open
            labels:
              - triage
            limit: 25
        scope: read
    result_from:
      - pull
      - push
      - plan
    steps:
      - id: plan
        inputs:
          repo: $input.repo
          direction: $input.direction
          resources: $input.resources
          scope: $input.scope
        tool:
          module: github.mjs
        outputs:
          sync_plan: {type: object, packet: runx/github.sync_plan.v1}
      - id: pull
        when:
          value: $steps.plan.sync_plan.decision
          equals: ready
        operation:
          connector: github
          choose: $steps.plan.sync_plan.provider_operation
          from: [issues.read, issues.list, pullrequests.read, pullrequests.list, comments.list, issues.create, issues.update, pullrequests.update, comments.create, comments.update]
        inputs: $steps.plan.sync_plan.provider_input
      - id: push
        when:
          value: $steps.plan.sync_plan.decision
          equals: ready_for_execution
        skill: .#push
        inputs:
          repo: $input.repo
          resources: $input.resources
          idempotency_key: $input.idempotency_key
