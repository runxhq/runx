kind: skill
target: ..
runner: charge
setup:
  credentials:
    - paypal
env:
  PAYPAL_CLIENT_CREDENTIALS: '{"client_id":"fixture-app","client_secret":"fixture-secret"}'
inputs:
  connector: paypal
  request:
    api_host: api-m.sandbox.paypal.com
    account_id: YXZY75W2GKDQE
    order_ref: ORDER42
    amount_decimal: "1.50"
    currency: USD
    precision: 2
    reference: invoice-42
  idempotency_seed: northstar-invoice-42
operator_journeys:
  - mode: standalone
    confusors:
      - pay
      - refund
    request: Collect the buyer-approved Northstar PayPal order.
    expected_outcome: Approve the exact sandbox account and terms, capture once and independently
      confirm both original order and capture.
name: charge-paypal-sandbox-capture
caller:
  approvals:
    paypal: true
  http_exchanges:
    - request:
        method: POST
        url: https://api-m.sandbox.paypal.com/v1/oauth2/token
        body:
          text: grant_type=client_credentials
      response:
        status: 200
        headers:
          content-type: application/json
        body: '{"access_token":"fixture-private-token","token_type":"Bearer","expires_in":60}'
    - request:
        method: GET
        url: https://api-m.sandbox.paypal.com/v2/checkout/orders/ORDER42
        body: none
      response:
        status: 200
        headers:
          content-type: application/json
        body: '{"id":"ORDER42","status":"APPROVED","intent":"CAPTURE","purchase_units":[{"reference_id":"invoice-42","payee":{"merchant_id":"YXZY75W2GKDQE"},"amount":{"value":"1.50","currency_code":"USD"}}],"links":[{"rel":"payer-action","href":"https://www.sandbox.paypal.com/checkoutnow?token=ORDER42","method":"GET"}]}'
    - request:
        method: POST
        url: https://api-m.sandbox.paypal.com/v2/checkout/orders/ORDER42/capture
        body:
          json: {}
      response:
        status: 200
        headers:
          content-type: application/json
        body: '{"id":"ORDER42","purchase_units":[{"payments":{"captures":[{"id":"CAPTURE42"}]}}]}'
    - request:
        method: GET
        url: https://api-m.sandbox.paypal.com/v2/checkout/orders/ORDER42
        body: none
      response:
        status: 200
        headers:
          content-type: application/json
        body: '{"id":"ORDER42","status":"COMPLETED","intent":"CAPTURE","purchase_units":[{"reference_id":"invoice-42","payee":{"merchant_id":"YXZY75W2GKDQE"},"amount":{"value":"1.50","currency_code":"USD"},"payments":{"captures":[{"id":"CAPTURE42","status":"COMPLETED","amount":{"value":"1.50","currency_code":"USD"}}]}}],"links":[{"rel":"payer-action","href":"https://www.sandbox.paypal.com/checkoutnow?token=ORDER42","method":"GET"}]}'
    - request:
        method: GET
        url: https://api-m.sandbox.paypal.com/v2/payments/captures/CAPTURE42
        body: none
      response:
        status: 200
        headers:
          content-type: application/json
        body: '{"id":"CAPTURE42","status":"COMPLETED","payee":{"merchant_id":"YXZY75W2GKDQE"},"amount":{"value":"1.50","currency_code":"USD"},"supplementary_data":{"related_ids":{"order_id":"ORDER42"}}}'
expect:
  status: sealed
