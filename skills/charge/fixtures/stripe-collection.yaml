name: charge-stripe-exact-collection
kind: skill
target: ..
runner: charge
operator_journeys:
  - mode: standalone
    confusors:
      - pay
      - refund
    request: Collect the Northstar invoice on this Stripe merchant account.
    expected_outcome: Approve once, submit the exact form, and independently confirm the original
      account, amount, currency and reference.
setup:
  credentials:
    - stripe
env:
  STRIPE_API_KEY: fixture-stripe-key
inputs:
  connector: stripe
  request:
    account_id: acct_northstar
    amount_minor: 150
    currency: usd
    payment_method_id: pm_northstar
    reference: invoice-42
  idempotency_seed: northstar-invoice-42
caller:
  approvals:
    stripe: true
  http_exchanges:
    - request:
        method: GET
        url: https://api.stripe.com/v1/account
        body: none
      response:
        status: 200
        headers:
          content-type: application/json
        body: '{"id":"acct_northstar"}'
    - request:
        method: POST
        url: https://api.stripe.com/v1/payment_intents
        body:
          text: amount=150&automatic_payment_methods%5Ballow_redirects%5D=never&automatic_payment_methods%5Benabled%5D=true&confirm=true&currency=usd&metadata%5Brunx_effect_key%5D=runx%3Asha256%3A3bf9e9a679e77e4100bfc84badc3a3c66894e211b84cb03541d565a641ad7717&metadata%5Brunx_reference%5D=invoice-42&payment_method=pm_northstar
      response:
        status: 200
        headers:
          content-type: application/json
        body: '{"id":"pi_northstar"}'
    - request:
        method: GET
        url: https://api.stripe.com/v1/payment_intents/pi_northstar
        body: none
      response:
        status: 200
        headers:
          content-type: application/json
        body: '{"id":"pi_northstar","amount":150,"amount_received":150,"currency":"usd","status":"succeeded","latest_charge":"ch_northstar","metadata":{"runx_reference":"invoice-42"}}'
expect:
  status: sealed
  receipt:
    schema: runx.receipt.v1
  step_outputs:
    stripe:
      subset:
        provider_operation:
          data:
            result:
              payment_id: pi_northstar
              amount_minor: 150
              amount_received: 150
              currency: usd
              status: succeeded
              reference: invoice-42
