minimum_runx: 0.12.0
catalog:
  visibility: internal
methods:
  run:
    inputs:
      connector: {type: string}
      request: {type: object}
      idempotency_seed: {type: string}
    result_from: [charge]
    steps:
      - id: charge
        skill: ../..#charge
        inputs: $input
      - id: digest
        tool: data.digest
        inputs:
          value: $steps.charge
