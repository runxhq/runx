version: "0.7.4"
minimum_runx: 0.12.0
default_method: charge
catalog:
  visibility: public
  category: payments
shared_inputs:
  resource:
    type: string
    description: Exact HTTPS resource the payment buys.
    format: uri
    pattern: ^https://
    maxLength: 2000
  amount_minor:
    type: integer
    description: Price in the currency's minor units.
    minimum: 1
    maximum: 9007199254740991
  currency:
    type: string
    description: ISO 4217 code of the price.
    pattern: ^[A-Z]{3}$
methods:
  charge:
    description: Collect one exact payment on the explicitly selected merchant connector, requiring native approval and independently checked provider evidence.
    inputs:
      connector:
        type: string
        description: The merchant connector whose selected account receives the payment.
        enum:
          - stripe
          - paypal
          - coinbase/cdp
      request:
        description: Exact public arguments of the selected connector operation. Run `runx connector inspect <connector>` for its owning input_schema. Supply identifiers and terms, never provider keys, card data, SPTs or bearer credentials.
      idempotency_seed:
        type: string
        description: Stable caller-owned key for this unchanged payment or checkout.
        minLength: 16
        maxLength: 200
    examples:
      - connector: stripe
        request:
          account_id: acct_northstar
          amount_minor: 150
          currency: usd
          payment_method_id: pm_northstar
          reference: invoice-42
        idempotency_seed: northstar-invoice-42
      - connector: paypal
        request:
          api_host: api-m.sandbox.paypal.com
          account_id: YXZY75W2GKDQE
          order_id: ORDER42
          amount_decimal: "1.50"
          currency: USD
          precision: 2
          reference: invoice-42
        idempotency_seed: northstar-invoice-42
      - connector: coinbase/cdp
        request:
          resource: https://seller.example/v1/reports/launch
          amount_minor: 125
          currency: USD
          payment_payload:
            x402Version: 2
            accepted:
              scheme: exact
              network: eip155:8453
              amount: "1250000"
              payTo: "0x0000000000000000000000000000000000000002"
              asset: "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913"
              maxTimeoutSeconds: 300
            resource:
              url: https://seller.example/v1/reports/launch
            payload:
              signature: 0xsigned
              authorization:
                from: "0x0000000000000000000000000000000000000001"
                to: "0x0000000000000000000000000000000000000002"
                value: "1250000"
          payment_requirements:
            scheme: exact
            network: eip155:8453
            amount: "1250000"
            payTo: "0x0000000000000000000000000000000000000002"
            asset: "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913"
            maxTimeoutSeconds: 300
          request_binding_digest: sha256:3333333333333333333333333333333333333333333333333333333333333333
        idempotency_seed: northstar-resource-42
    result_from:
      - stripe
      - paypal
      - readback
    steps:
      - id: stripe
        when:
          value: $input.connector
          equals: stripe
        operation: stripe/payment.stripe
        inputs: $input.request
        idempotency_key: $input.idempotency_seed
        approval:
          reason: Approve collecting this exact payment on the selected merchant account.
          type: payment_charge
        result:
          required:
            - payment_id
            - amount_minor
            - amount_received
            - currency
            - status
            - charge_id
            - reference
          equals:
            status: succeeded
      - id: paypal
        when:
          value: $input.connector
          equals: paypal
        operation: paypal/payment.paypal
        inputs: $input.request
        idempotency_key: $input.idempotency_seed
        approval:
          reason: Approve capturing this exact buyer-approved order on the selected merchant account.
          type: payment_charge
        result:
          required:
            - payment_id
            - order_id
            - account_id
            - amount_decimal
            - currency
            - status
            - reference
          equals:
            status: COMPLETED
      - id: settle
        operation: coinbase/cdp/payment.x402.merchant.settle
        idempotency_key: $input.idempotency_seed
        approval:
          reason: Approve settling this exact payment before the paid resource is released.
          type: payment_charge
        result:
          required:
            - payment_id
            - idempotency_key
            - request_binding_digest
            - resource
            - amount_minor
            - currency
            - status
            - settlement_id
            - payer
            - pay_to
            - network
            - asset
            - settled_at
          equals:
            status: settled
            request_binding_digest: $input.request.request_binding_digest
            resource: $input.request.resource
            amount_minor: $input.request.amount_minor
            currency: $input.request.currency
        inputs: $input.request
        when:
          value: $input.connector
          equals: coinbase/cdp
      - id: readback
        operation: coinbase/cdp/payment.x402.merchant.read
        result:
          required:
            - payment_id
            - idempotency_key
            - request_binding_digest
            - resource
            - amount_minor
            - currency
            - status
            - settlement_id
            - payer
            - pay_to
            - network
            - asset
            - settled_at
          equals:
            payment_id: $steps.settle.provider_operation.result.payment_id
            idempotency_key: $steps.settle.provider_operation.result.idempotency_key
            request_binding_digest: $input.request.request_binding_digest
            resource: $input.request.resource
            amount_minor: $input.request.amount_minor
            currency: $input.request.currency
            status: settled
        inputs:
          resource: $input.request.resource
          payment_id: $steps.settle.provider_operation.result.payment_id
        when:
          value: $input.connector
          equals: coinbase/cdp
  quote:
    description: Quote the x402 payment a buyer must make for a resource, before any payment is taken.
    inputs:
      resource: {}
      amount_minor: {}
      currency: {}
      description:
        type: string
        description: What the buyer is paying for.
        maxLength: 499
        optional: true
      max_timeout_seconds:
        type: integer
        description: How long the buyer has to pay.
        minimum: 1
        maximum: 86400
        optional: true
    result_from:
      - quote
    steps:
      - id: quote
        operation: coinbase/cdp/payment.x402.merchant.quote
        result:
          required:
            - quote_contract
            - resource
            - amount_minor
            - currency
            - accepts
            - quote_digest
          equals:
            resource: $input.resource
            amount_minor: $input.amount_minor
            currency: $input.currency
        inputs:
          resource: $input.resource
          description: $input.description
          amount_minor: $input.amount_minor
          currency: $input.currency
          max_timeout_seconds: $input.max_timeout_seconds
    examples:
      - resource: https://seller.example/v1/reports/launch
        amount_minor: 125
        currency: USD
        description: Launch report
  checkout:
    description: Create and independently read one PayPal checkout order. The returned links ask the buyer to approve; no payment has been captured.
    inputs:
      request:
        description: Exact public arguments of paypal/payment.paypal.order.create from native connector inspection; includes merchant, decimal amount, currency, precision, reference and return/cancel URLs.
      idempotency_seed:
        type: string
        description: Stable caller-owned key for this unchanged payment or checkout.
        minLength: 16
        maxLength: 200
    examples:
      - request:
          api_host: api-m.sandbox.paypal.com
          account_id: YXZY75W2GKDQE
          amount_decimal: "1.50"
          currency: USD
          precision: 2
          reference: invoice-42
          return_url: https://northstar.example/payments/return
          cancel_url: https://northstar.example/payments/cancel
        idempotency_seed: northstar-checkout-42
    result_from:
      - checkout
    steps:
      - id: checkout
        operation: paypal/payment.paypal.order.create
        inputs: $input.request
        idempotency_key: $input.idempotency_seed
        result:
          required:
            - order_id
            - order_status
            - intent
            - account_id
            - amount_decimal
            - currency
            - reference
            - links
