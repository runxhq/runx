skill: charge
version: "0.6.2"
catalog: { kind: graph, audience: operator, visibility: public, role: canonical, runtime_path: hosted, execution: execute, completion: provider_readback, requires_adapter: true, approval: required }
connectors:
  payment:
    operations: [payment.charge, payment.charge.read]
    connector_from: $input.returned_credential.family
    allowed_connectors: [mpp]
runners:
  charge:
    default: true
    type: graph
    inputs:
      mcp_tool_call: { type: json, required: true, description: Inbound paid operation request. }
      provider_policy: { type: json, required: true, description: Hosted charge policy. }
      returned_credential: { type: json, required: true, description: Opaque hosted settlement credential reference. }
      verify_capability_ref: { type: string, required: true, description: Single-use hosted verification capability reference. }
      idempotency_seed: { type: string, required: true, description: Stable caller-owned idempotency material. }
    graph:
      name: charge-hosted
      result_from: [readback]
      steps:
        - id: settle
          operation: payment/payment.charge
          idempotency_key: $input.idempotency_seed
          inputs:
            approval:
              reason: Approve this exact provider charge before settlement.
              type: payment_charge
            amount: { units: $input.provider_policy.price_minor, unit: $input.provider_policy.currency }
            idempotency_key: $input.idempotency_seed
            result_fields: [charge_ref, settlement_family, status, credential_ref]
            input: { mcp_tool_call: $input.mcp_tool_call, provider_policy: $input.provider_policy, credential_ref: $input.returned_credential.credential_ref, verify_capability_ref: $input.verify_capability_ref }
        - id: readback
          operation: payment/payment.charge.read
          inputs: { result_fields: [charge_ref, settlement_family, status, credential_ref] }
          context: { input: settle.provider_operation.data.result, expected_result: settle.provider_operation.data.result }
