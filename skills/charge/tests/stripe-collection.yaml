# The effect-key golden comes from the native, unapproved intent for these exact terms.
# Update only with an intentional operation-contract change; keep exact wire matching.
name: charge-stripe-exact-collection
method: charge
setup:
  credentials:
    - stripe
inputs:
  connector: stripe
  request:
    account_id: acct_northstar
    amount_minor: 150
    currency: usd
    payment_method_id: pm_northstar
    reference: invoice-42
  idempotency_seed: northstar-invoice-42
env:
  STRIPE_API_KEY: fixture-stripe-key
host:
  approvals:
    stripe: true
providers:
  http:
    - request:
        method: GET
        url: https://api.stripe.com/v1/account
        body: none
      response:
        status: 200
        headers:
          content-type: application/json
        body: '{"id":"acct_northstar"}'
    - request:
        method: POST
        url: https://api.stripe.com/v1/payment_intents
        body:
          text: amount=150&automatic_payment_methods%5Ballow_redirects%5D=never&automatic_payment_methods%5Benabled%5D=true&confirm=true&currency=usd&metadata%5Brunx_effect_key%5D=runx%3Asha256%3Adaa03d9d32413fe041fefb38bc39fd120ae3b16c869541f2fd2c3821111a2a86&metadata%5Brunx_reference%5D=invoice-42&payment_method=pm_northstar
      response:
        status: 200
        headers:
          content-type: application/json
        body: '{"id":"pi_northstar"}'
    - request:
        method: GET
        url: https://api.stripe.com/v1/payment_intents/pi_northstar
        body: none
      response:
        status: 200
        headers:
          content-type: application/json
        body: '{"id":"pi_northstar","amount":150,"amount_received":150,"currency":"usd","status":"succeeded","latest_charge":"ch_northstar","metadata":{"runx_reference":"invoice-42"}}'
expect:
  status: sealed
  receipt:
    schema: runx.receipt.v1
    outcome: completed
  step_outputs:
    stripe:
      subset:
        provider_operation:
          result:
            payment_id: pi_northstar
            amount_minor: 150
            amount_received: 150
            currency: usd
            status: succeeded
            reference: invoice-42
