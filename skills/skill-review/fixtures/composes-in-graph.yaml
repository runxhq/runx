name: skill-review-composes-in-graph
kind: graph
target: support/composed.graph
caller:
  answers:
    assess:
      capability_profile:
        skill_ref: fixtures/subject
        summary: Digests one fixed value under a bounded read-only contract.
      trust_assessment:
        tier: local_harness
        caveats:
          - Provider effects are outside this skill's claim.
