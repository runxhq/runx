version: "0.3.11"
minimum_runx: 0.12.0
default_method: review
catalog:
  visibility: public
  category: authoring
methods:
  review:
    description: Inspect one local skill, read relevant implementation through native tools, and assess actual operator value, authority and direct/composed readiness.
    inputs:
      skill:
        type: string
        description: Workspace- or owning-skill-relative local package path.
      objective:
        type: string
        description: Specific decision the evaluation should support.
        optional: true
      evidence_pack:
        description: Additional receipts, docs, provider evidence, or source notes.
        optional: true
      test_constraints:
        type: string
        description: Time, environment, or safety constraints on evaluation.
        optional: true
    result_from:
      - assess
    examples:
      - skill: skills/pr-summary
    steps:
      - id: collect-evidence
        tool: runx.skill.validate
        inputs:
          skill_path: $input.skill
          allow_execute_test: false
      - id: assess
        agent: skill-review-assess
        calls:
          tools: [fs.read_bundle]
        inputs:
          skill: $input.skill
          objective: $input.objective
          evidence_pack: $input.evidence_pack
          test_constraints: $input.test_constraints
          native_validation: $steps.collect-evidence.skill_validation
        outputs:
          capability_profile:
            type: object
            additionalProperties: false
            required:
              - skill
              - summary
              - operator_job
              - default_result
              - caller_work
              - value_judgment
              - value_reason
              - composition
            properties:
              skill:
                type: string
                minLength: 1
              summary:
                type: string
                minLength: 1
              operator_job:
                type: string
                minLength: 1
              default_result:
                type: string
                minLength: 1
              caller_work:
                type: array
                items:
                  type: string
                  minLength: 1
              value_judgment:
                enum:
                  - useful
                  - thin_wrapper
                  - incomplete
                  - unknown
              value_reason:
                type: string
                minLength: 1
              composition:
                type: string
                minLength: 1
          trust_assessment:
            type: object
            additionalProperties: false
            required:
              - tier
              - caveats
              - implementation_evidence
              - product_evidence
            properties:
              tier:
                type: string
                minLength: 1
              caveats:
                type: array
                items:
                  type: string
                  minLength: 1
              implementation_evidence:
                type: array
                items:
                  type: string
                  minLength: 1
              product_evidence:
                type: array
                items:
                  type: string
                  minLength: 1
          test_matrix:
            type: array
            items:
              type: object
              additionalProperties: false
              required:
                - check
                - status
                - evidence
              properties:
                check:
                  type: string
                  minLength: 1
                status:
                  enum:
                    - passed
                    - failed
                    - skipped
                    - required
                evidence:
                  type: string
                  minLength: 1
          recommendation_report:
            type: object
            additionalProperties: false
            required:
              - recommendation
              - rationale
              - blockers
              - next_action
            properties:
              recommendation:
                enum:
                  - adopt
                  - adopt_with_caveats
                  - improve
                  - reject
                  - needs_more_evidence
              rationale:
                type: string
                minLength: 1
              blockers:
                type: array
                items:
                  type: string
                  minLength: 1
              next_action:
                type: string
                minLength: 1
          skill_evaluation_packet: {packet: runx/skill-review.evaluation.v1}
        result_as: skill_evaluation_packet
  assess:
    description: Assess already supplied implementation and real-use evidence without filesystem reads, provider operations or test replay.
    inputs:
      skill:
        type: string
        description: Skill package path, registry id, or marketplace id.
      objective:
        type: string
        description: Specific decision the evaluation should support.
        optional: true
      evidence_pack:
        description: Native inspection, test, receipts, docs, or source notes.
        optional: true
      native_validation:
        description: Native runx.skill.validate evidence collected by the default method.
        optional: true
      test_constraints:
        type: string
        description: Time, environment, or safety constraints on evaluation.
        optional: true
    steps:
      - id: assess
        agent: skill-review-assess
        inputs:
          skill: $input.skill
          objective: $input.objective
          evidence_pack: $input.evidence_pack
          native_validation: $input.native_validation
          test_constraints: $input.test_constraints
        outputs:
          capability_profile:
            type: object
            additionalProperties: false
            required:
              - skill
              - summary
              - operator_job
              - default_result
              - caller_work
              - value_judgment
              - value_reason
              - composition
            properties:
              skill:
                type: string
                minLength: 1
              summary:
                type: string
                minLength: 1
              operator_job:
                type: string
                minLength: 1
              default_result:
                type: string
                minLength: 1
              caller_work:
                type: array
                items:
                  type: string
                  minLength: 1
              value_judgment:
                enum:
                  - useful
                  - thin_wrapper
                  - incomplete
                  - unknown
              value_reason:
                type: string
                minLength: 1
              composition:
                type: string
                minLength: 1
          trust_assessment:
            type: object
            additionalProperties: false
            required:
              - tier
              - caveats
              - implementation_evidence
              - product_evidence
            properties:
              tier:
                type: string
                minLength: 1
              caveats:
                type: array
                items:
                  type: string
                  minLength: 1
              implementation_evidence:
                type: array
                items:
                  type: string
                  minLength: 1
              product_evidence:
                type: array
                items:
                  type: string
                  minLength: 1
          test_matrix:
            type: array
            items:
              type: object
              additionalProperties: false
              required:
                - check
                - status
                - evidence
              properties:
                check:
                  type: string
                  minLength: 1
                status:
                  enum:
                    - passed
                    - failed
                    - skipped
                    - required
                evidence:
                  type: string
                  minLength: 1
          recommendation_report:
            type: object
            additionalProperties: false
            required:
              - recommendation
              - rationale
              - blockers
              - next_action
            properties:
              recommendation:
                enum:
                  - adopt
                  - adopt_with_caveats
                  - improve
                  - reject
                  - needs_more_evidence
              rationale:
                type: string
                minLength: 1
              blockers:
                type: array
                items:
                  type: string
                  minLength: 1
              next_action:
                type: string
                minLength: 1
          skill_evaluation_packet: {packet: runx/skill-review.evaluation.v1}
        result_as: skill_evaluation_packet
  triggers:
    description: Measure how often a host selects one package for each of its eval queries, each query worked by fresh turns of the agent skill's read method, and each selection read from the run's record.
    inputs:
      skill:
        type: string
        pattern: ^[^/@\s]+/[^/@\s]+@[^@\s]+$
        description: Registry reference, <publisher>/<name>@<version>, of the released package whose eval queries are measured, served by the registry the run reaches.
      repeats:
        type: integer
        minimum: 1
        maximum: 10
        optional: true
        description: Fresh turns per query; 3 when absent.
    steps:
      - id: subject
        tool: runx.skill.validate
        inputs:
          skill_path: $input.skill
          allow_execute_test: false
      - id: measure
        script: {module: triggers.mjs}
        inputs:
          subject: $steps.subject.skill_validation
          repeats: $input.repeats
        calls:
          skills: [../agent#read]
          tools: [run.read]
        max_calls: 900
        outputs:
          evidence: {packet: runx.eval_evidence.v1}
  evals:
    description: Run a package's evals, each worked by a fresh turn of the agent skill's write method under the run's authority, and judge each attempt with a verdict the run decides by the one rule.
    inputs:
      skill:
        type: string
        pattern: ^[^/@\s]+/[^/@\s]+@[^@\s]+$
        description: Registry reference, <publisher>/<name>@<version>, of the released package whose evals are run, served by the registry the run reaches.
      repeats:
        type: integer
        minimum: 1
        maximum: 5
        optional: true
        description: Attempts per eval; 1 when absent.
    steps:
      - id: subject
        tool: runx.skill.validate
        inputs:
          skill_path: $input.skill
          allow_execute_test: false
      - id: run
        script: {module: evals.mjs}
        inputs:
          subject: $steps.subject.skill_validation
          repeats: $input.repeats
        calls:
          skills: [../agent#write, .#grade]
          tools: [run.read, verdict.criteria, verdict.decide]
        max_calls: 900
        outputs:
          evidence: {packet: runx.eval_evidence.v1}
  grade:
    description: Judge one eval attempt against its criteria set, from the attempt's record, and return a verdict whose evaluator the runtime names.
    inputs:
      subject:
        type: object
        description: What is judged, the package at its digest, as a ref and a revision.
      criteria_set:
        type: object
        description: The ref and revision of the criteria set the verdict answers.
      criteria:
        type: object
        description: The runx.criteria.v1 set, each check a question that must be answered yes.
      eval:
        type: object
        description: The eval's prompt and expected output.
      attempt:
        type: object
        description: The attempt as its record holds it, its outcome, summary, calls and receipt.
    steps:
      - id: grade
        agent: grade
        requires: [fresh_context]
        inputs: $input
        outputs:
          verdict: {packet: runx.verdict.v1}
