version: "0.3.11"
minimum_runx: 0.12.0
default_method: review
catalog:
  visibility: public
  category: authoring
methods:
  review:
    description: Inspect one local skill, read relevant implementation through native tools, and assess actual operator value, authority and direct/composed readiness.
    inputs:
      skill:
        type: string
        description: Workspace- or owning-skill-relative local package path.
      objective:
        type: string
        description: Specific decision the evaluation should support.
        optional: true
      evidence_pack:
        description: Additional receipts, docs, provider evidence, or source notes.
        optional: true
      test_constraints:
        type: string
        description: Time, environment, or safety constraints on evaluation.
        optional: true
    result_from:
      - assess
    examples:
      - skill: skills/pr-summary
    steps:
      - id: collect-evidence
        tool: runx.skill.validate
        inputs:
          skill_path: $input.skill
          allow_execute_test: false
      - id: assess
        agent: skill-review-assess
        calls:
          tools: [fs.read_bundle]
        inputs:
          skill: $input.skill
          objective: $input.objective
          evidence_pack: $input.evidence_pack
          test_constraints: $input.test_constraints
          native_validation: $steps.collect-evidence.skill_validation
        outputs:
          capability_profile:
            type: object
            additionalProperties: false
            required:
              - skill
              - summary
              - operator_job
              - default_result
              - caller_work
              - value_judgment
              - value_reason
              - composition
            properties:
              skill:
                type: string
                minLength: 1
              summary:
                type: string
                minLength: 1
              operator_job:
                type: string
                minLength: 1
              default_result:
                type: string
                minLength: 1
              caller_work:
                type: array
                items:
                  type: string
                  minLength: 1
              value_judgment:
                enum:
                  - useful
                  - thin_wrapper
                  - incomplete
                  - unknown
              value_reason:
                type: string
                minLength: 1
              composition:
                type: string
                minLength: 1
          trust_assessment:
            type: object
            additionalProperties: false
            required:
              - tier
              - caveats
              - implementation_evidence
              - product_evidence
            properties:
              tier:
                type: string
                minLength: 1
              caveats:
                type: array
                items:
                  type: string
                  minLength: 1
              implementation_evidence:
                type: array
                items:
                  type: string
                  minLength: 1
              product_evidence:
                type: array
                items:
                  type: string
                  minLength: 1
          test_matrix:
            type: array
            items:
              type: object
              additionalProperties: false
              required:
                - check
                - status
                - evidence
              properties:
                check:
                  type: string
                  minLength: 1
                status:
                  enum:
                    - passed
                    - failed
                    - skipped
                    - required
                evidence:
                  type: string
                  minLength: 1
          recommendation_report:
            type: object
            additionalProperties: false
            required:
              - recommendation
              - rationale
              - blockers
              - next_action
            properties:
              recommendation:
                enum:
                  - adopt
                  - adopt_with_caveats
                  - improve
                  - reject
                  - needs_more_evidence
              rationale:
                type: string
                minLength: 1
              blockers:
                type: array
                items:
                  type: string
                  minLength: 1
              next_action:
                type: string
                minLength: 1
          skill_evaluation_packet: {packet: runx/skill-review.evaluation.v1}
        result_as: skill_evaluation_packet
  assess:
    description: Assess already supplied implementation and real-use evidence without filesystem reads, provider operations or harness replay.
    inputs:
      skill:
        type: string
        description: Skill package path, registry id, or marketplace id.
      objective:
        type: string
        description: Specific decision the evaluation should support.
        optional: true
      evidence_pack:
        description: Native inspection, harness, receipts, docs, or source notes.
        optional: true
      native_validation:
        description: Native runx.skill.validate evidence collected by the default runner.
        optional: true
      test_constraints:
        type: string
        description: Time, environment, or safety constraints on evaluation.
        optional: true
    steps:
      - id: assess
        agent: skill-review-assess
        inputs:
          skill: $input.skill
          objective: $input.objective
          evidence_pack: $input.evidence_pack
          native_validation: $input.native_validation
          test_constraints: $input.test_constraints
        outputs:
          capability_profile:
            type: object
            additionalProperties: false
            required:
              - skill
              - summary
              - operator_job
              - default_result
              - caller_work
              - value_judgment
              - value_reason
              - composition
            properties:
              skill:
                type: string
                minLength: 1
              summary:
                type: string
                minLength: 1
              operator_job:
                type: string
                minLength: 1
              default_result:
                type: string
                minLength: 1
              caller_work:
                type: array
                items:
                  type: string
                  minLength: 1
              value_judgment:
                enum:
                  - useful
                  - thin_wrapper
                  - incomplete
                  - unknown
              value_reason:
                type: string
                minLength: 1
              composition:
                type: string
                minLength: 1
          trust_assessment:
            type: object
            additionalProperties: false
            required:
              - tier
              - caveats
              - implementation_evidence
              - product_evidence
            properties:
              tier:
                type: string
                minLength: 1
              caveats:
                type: array
                items:
                  type: string
                  minLength: 1
              implementation_evidence:
                type: array
                items:
                  type: string
                  minLength: 1
              product_evidence:
                type: array
                items:
                  type: string
                  minLength: 1
          test_matrix:
            type: array
            items:
              type: object
              additionalProperties: false
              required:
                - check
                - status
                - evidence
              properties:
                check:
                  type: string
                  minLength: 1
                status:
                  enum:
                    - passed
                    - failed
                    - skipped
                    - required
                evidence:
                  type: string
                  minLength: 1
          recommendation_report:
            type: object
            additionalProperties: false
            required:
              - recommendation
              - rationale
              - blockers
              - next_action
            properties:
              recommendation:
                enum:
                  - adopt
                  - adopt_with_caveats
                  - improve
                  - reject
                  - needs_more_evidence
              rationale:
                type: string
                minLength: 1
              blockers:
                type: array
                items:
                  type: string
                  minLength: 1
              next_action:
                type: string
                minLength: 1
          skill_evaluation_packet: {packet: runx/skill-review.evaluation.v1}
        result_as: skill_evaluation_packet
