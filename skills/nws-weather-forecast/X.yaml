skill: nws-weather-forecast
version: "0.1.4"
catalog:
  kind: graph
  audience: public
  visibility: public
  role: branded
  canonical_skill: runx/weather-forecast
  provider: national-weather-service
  runtime_path: http
  execution: read
  completion: provider_readback
  requires_adapter: false
  approval: none
connectors:
  national-weather-service:
    operations: [forecast.read, points.read]
runners:
  forecast:
    default: true
    type: graph
    runx:
      category: data
    inputs:
      office:
        type: string
        required: true
        description: NWS forecast office id, for example LWX.
      grid_x:
        type: string
        required: true
        description: NWS grid X coordinate.
      grid_y:
        type: string
        required: true
        description: NWS grid Y coordinate.
    graph:
      name: nws-weather-forecast
      result_from: [forecast]
      steps:
        - id: forecast
          operation: national-weather-service/forecast.read
          inputs:
            input:
              office: $input.office
              grid_x: $input.grid_x
              grid_y: $input.grid_y
  locate:
    type: graph
    inputs:
      lat:
        type: string
        required: true
        description: Latitude with no more than four decimal places.
      lon:
        type: string
        required: true
        description: Longitude with no more than four decimal places.
    graph:
      name: nws-weather-locate
      result_from: [points]
      steps:
        - id: points
          operation: national-weather-service/points.read
          inputs:
            input:
              lat: $input.lat
              lon: $input.lon
