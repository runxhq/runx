name: nws-forecast-washington-monument
kind: skill
target: ..
runner: forecast
operator_journeys:
  - mode: standalone
    confusors: [open-meteo-weather-forecast, weather-forecast]
    request: Fetch the National Weather Service forecast for gridpoint LWX 97,71.
    expected_outcome: Return bounded NWS forecast evidence with provider provenance for downstream planning.
  - mode: composed
    request: Acquire NWS evidence for the already resolved Washington Monument gridpoint.
    expected_outcome: Reuse the supplied office and grid coordinates without geocoding again, then return one provider packet.
    prior_evidence:
      - The resolved NWS office and grid coordinates supplied in the fixture.
    must_not_repeat:
      - Do not resolve the location or gridpoint again.
      - Do not fetch the same forecast downstream when the provider packet is present.
inputs:
  office: LWX
  grid_x: "97"
  grid_y: "71"
caller:
  http_exchanges:
    - request: { method: GET, url: "https://api.weather.gov/gridpoints/LWX/97,71/forecast", body: none }
      response:
        status: 200
        headers: { content-type: application/geo+json }
        body: '{"type":"Feature","geometry":null,"properties":{"units":"us","elevation":{"unitCode":"wmoUnit:m","value":12.2},"generatedAt":"2026-08-10T04:00:00Z","updateTime":"2026-08-10T03:30:00Z","periods":[]}}'
expect:
  status: sealed
  steps:
    - forecast
  step_outputs:
    forecast:
      subset:
        provider_operation:
          data:
            status: success
            provider: national-weather-service
            operation: forecast.read
            transport: local_http
            result:
              forecast:
                type: Feature
                properties:
                  units: us
                  elevation:
                    unitCode: "wmoUnit:m"
metadata:
  public_skill: nws-weather-forecast
  source_case: nws-forecast-washington-monument
  source: skills-fixture
