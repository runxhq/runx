version: "0.1.12"
minimum_runx: 0.12.0
catalog:
  visibility: public
  category: ops
methods:
  make:
    inputs:
      incident_id:
        type: string
        description: Identifier of the resolved incident this postmortem covers.
        minLength: 1
        maxLength: 256
        pattern: \S
      incident_fragments:
        type: array
        description: Already collected incident fragments; preserve their stable id, source and complete text. This runner does not acquire live evidence.
        minItems: 1
        maxItems: 500
        items:
          type: object
          required:
            - id
            - source
            - text
          additionalProperties: false
          properties:
            id:
              type: string
              minLength: 1
              maxLength: 200
              pattern: \S
            source:
              type: string
              minLength: 1
              maxLength: 2000
              pattern: \S
            text:
              type: string
              minLength: 1
              maxLength: 1000000
              pattern: \S
    examples:
      - incident_id: inc-checkout-2026-08-09
        incident_fragments:
          - id: frag-1
            source: pagerduty
            text: 03:12 UTC alert fired.
    result_from:
      - finalize
    steps:
      - id: digest-fragments
        tool: data.digest
        inputs:
          value: $input.incident_fragments
      - id: draft
        agent: postmortem-draft-draft
        outputs:
          postmortem_draft:
            type: object
            required:
              - summary
              - impact
              - timeline
              - root_cause
              - unknowns
              - action_items
            additionalProperties: false
            properties:
              summary:
                type: string
                minLength: 1
                maxLength: 8000
                pattern: \S
              impact:
                oneOf:
                  - type: object
                    required:
                      - status
                    additionalProperties: false
                    properties:
                      status:
                        const: unknown
                  - type: object
                    required:
                      - status
                      - statement
                      - scope
                      - fragment_id
                      - quote
                    additionalProperties: false
                    properties:
                      status:
                        const: known
                      statement:
                        type: string
                        minLength: 1
                        maxLength: 4000
                        pattern: \S
                      scope:
                        type: string
                        minLength: 1
                        maxLength: 500
                        pattern: \S
                      fragment_id:
                        type: string
                        minLength: 1
                        maxLength: 200
                        pattern: \S
                      quote:
                        type: string
                        minLength: 1
                        maxLength: 4000
                        pattern: \S
              timeline:
                type: array
                maxItems: 500
                items:
                  type: object
                  required:
                    - entry
                    - fragment_id
                    - quote
                  additionalProperties: false
                  properties:
                    entry:
                      type: string
                      minLength: 1
                      maxLength: 4000
                    fragment_id:
                      type: string
                      minLength: 1
                      maxLength: 200
                    quote:
                      type: string
                      minLength: 1
                      maxLength: 4000
                minItems: 1
              root_cause:
                oneOf:
                  - type: object
                    required:
                      - status
                    additionalProperties: false
                    properties:
                      status:
                        const: unknown
                  - type: object
                    required:
                      - status
                      - statement
                      - fragment_id
                      - quote
                    additionalProperties: false
                    properties:
                      status:
                        type: string
                        enum:
                          - known
                          - suspected
                      statement:
                        type: string
                        minLength: 1
                        maxLength: 4000
                        pattern: \S
                      fragment_id:
                        type: string
                        minLength: 1
                        maxLength: 200
                        pattern: \S
                      quote:
                        type: string
                        minLength: 1
                        maxLength: 4000
                        pattern: \S
              unknowns:
                type: array
                maxItems: 100
                items:
                  type: string
                  minLength: 1
                  maxLength: 2000
                uniqueItems: true
              action_items:
                type: array
                maxItems: 100
                items:
                  type: object
                  required:
                    - action
                    - owner
                  additionalProperties: false
                  properties:
                    action:
                      type: string
                      minLength: 1
                      maxLength: 2000
                    owner:
                      type: string
                      minLength: 1
                      maxLength: 500
        inputs:
          incident_id: $input.incident_id
          incident_fragments: $input.incident_fragments
      - id: finalize
        inputs:
          incident_fragments: $input.incident_fragments
          postmortem_draft: $steps.draft.postmortem_draft
          fragments_digest: $steps.digest-fragments.digest_result.digest
          incident_id: $input.incident_id
        tool:
          module: postmortem-draft.mjs
          export: finalizePostmortem
        outputs:
          postmortem:
            type: object
            packet: runx/postmortem-draft.postmortem.v1
          document:
            type: string
    description: Draft a readable source-cited incident report, keep hypotheses explicit, and propose publication only for a complete known-cause draft; no publication performed.
