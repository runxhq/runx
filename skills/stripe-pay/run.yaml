skill: stripe-pay
version: "0.4.1"
catalog: { kind: graph, audience: operator, visibility: public, role: branded, canonical_skill: runx/spend, provider: stripe-spt, execution: execute, completion: provider_readback, approval: required, category: payments }
runners:
  stripe-spt:
    default: true
    inputs:
      payment_signal: { type: json, required: true }
      parent_payment_authority: { type: json, required: true }
      rail_profile_ref: { type: string, required: true }
      payment_admission: { type: object, required: false }
      realm: { type: string, required: false }
      idempotency_seed: { type: string, required: true }
    result_from: [spend]
    steps:
      - id: spend
        skill: ../spend
        runner: spend
        inputs: { payment_signal: $input.payment_signal, parent_payment_authority: $input.parent_payment_authority, rail: stripe-spt, rail_profile_ref: $input.rail_profile_ref, payment_admission: $input.payment_admission, realm: $input.realm, idempotency_seed: $input.idempotency_seed }
