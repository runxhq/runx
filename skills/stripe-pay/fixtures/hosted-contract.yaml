name: stripe-pay-hosted-contract
kind: skill
target: ..
runner: stripe-spt
operator_journeys:
  - { mode: standalone, confusors: [spend, x402-pay], request: Pay this exact requirement with Stripe SPT., expected_outcome: Require hosted Stripe authority and return provider readback. }
  - mode: composed
    request: Continue this admitted Stripe payment.
    expected_outcome: Reuse supplied payment and authority evidence.
    prior_evidence: [The admitted Stripe payment supplied by the caller.]
    must_not_repeat: [Do not mint a second Stripe payment identity.]
inputs:
  payment_signal: { amount_minor: 125, currency: USD, counterparty: "merchant:demo" }
  parent_payment_authority: { term_id: "authority:test" }
  rail_profile_ref: "rail-profile:stripe-test"
  idempotency_seed: stripe-test-001
caller:
  approvals: { "operation:sha256:d784777dedc9000133c9492b0bf501d034d000e37e98dc8117b1c31af62ba545": true }
  provider_responses:
    principal_id: stripe-fixture
    grant: { grant_id: stripe-fixture, provider: stripe-spt, scopes: [payment.spend, payment.spend.read] }
    operations:
      - { operation: payment.spend, target: "merchant:demo", access: mutate, result: { payment_ref: payment_stripe_001, rail: stripe-spt, amount_minor: 125, currency: USD, status: settled } }
      - { operation: payment.spend.read, target: payment_stripe_001, access: read, result: { payment_ref: payment_stripe_001, rail: stripe-spt, amount_minor: 125, currency: USD, status: settled } }
expect: { status: sealed, receipt: { schema: runx.receipt.v1 } }
