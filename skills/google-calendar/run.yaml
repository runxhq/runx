version: "0.1.12"
minimum_runx: 0.12.0
default_method: events
catalog:
  visibility: public
  category: ops
shared_inputs:
  calendar_id:
    type: string
    description: Exact selected Google calendar ID; primary selects the connected account's primary calendar.
    default: primary
    pattern: ^(?:primary|[A-Za-z0-9][A-Za-z0-9._@+%-]{0,254})$
    optional: true
  time_min:
    type: string
    description: Window lower boundary with explicit UTC offset. Events must end after it; events already underway are included.
    format: date-time
  time_max:
    type: string
    description: Window upper boundary with explicit UTC offset. Events must start before it. Must follow time_min.
    format: date-time
  provider_result:
    type: object
    description: Prior Google Calendar provider result, to normalize without another read.
    additionalProperties: true
  page_token:
    type: string
    default: ""
    description: Exact next_page_token from the previous read of this calendar and unchanged window; empty starts the window.
    maxLength: 2000
    optional: true
  page_size:
    type: integer
    default: 100
    description: Maximum events requested in this provider page (1–2500); default 100. Continue next_page_token for more results.
    minimum: 1
    maximum: 2500
    optional: true
methods:
  assistant-brief:
    description: Read the upcoming window of a selected calendar for one scheduled goal occurrence and return the assistant's work result for it.
    inputs:
      calendar_id: {}
      occurrence_uri:
        type: string
        description: Exact scheduled goal occurrence admitted by the local operator.
        pattern: ^runx://assistant/goal/[a-z0-9_-]+/schedule/sha256:[0-9a-f]{64}/occurrence/[0-9]+$
      observed_at:
        type: string
        description: Actual host observation instant for this execution, with an explicit UTC offset.
        format: date-time
      window_hours:
        type: integer
        description: Bounded upcoming calendar window in hours.
        minimum: 1
        maximum: 168
    result_from:
      - finish
    steps:
      - id: window
        inputs:
          calendar_id: $input.calendar_id
          occurrence_uri: $input.occurrence_uri
          observed_at: $input.observed_at
          window_hours: $input.window_hours
        tool:
          module: google-calendar.mjs
          export: prepareAssistantWindow
        outputs:
          calendar_window: {type: object}
      - id: read
        skill: .#events
        inputs:
          calendar_id: $steps.window.calendar_window.calendar_id
          time_min: $steps.window.calendar_window.time_min
          time_max: $steps.window.calendar_window.time_max
      - id: finish
        inputs:
          calendar_id: $input.calendar_id
          occurrence_uri: $input.occurrence_uri
          window: $steps.window.calendar_window
          calendar_context: $steps.read.calendar_context
        tool:
          module: google-calendar.mjs
          export: finishAssistantBrief
        outputs:
          work_result: {type: object, packet: runx.work_outcome.v1}
  events:
    description: Read a bounded page of expanded event instances; preserve the cursor and distinguish a complete window from a resumed tail.
    inputs:
      calendar_id: {}
      time_min: {}
      time_max: {}
      page_token: {}
      page_size: {}
    examples:
      - calendar_id: primary
        time_min: 2026-10-04T00:00:00Z
        time_max: 2026-10-11T00:00:00Z
    result_from:
      - normalize
    steps:
      - id: read
        operation: google/calendar/events.list
        result:
          required:
            - calendar_id
            - time_min
            - time_max
            - events
            - page_token
            - complete
            - next_page_token
            - fetched_at
        inputs:
          calendar_id: $input.calendar_id
          time_min: $input.time_min
          time_max: $input.time_max
          page_token: $input.page_token
          page_size: $input.page_size
      - id: normalize
        inputs:
          kind: events
          source_status: provider_readback
          calendar_id: $input.calendar_id
          time_min: $input.time_min
          time_max: $input.time_max
          provider_result: $steps.read.provider_operation.result
          page_token: $input.page_token
        tool:
          module: google-calendar.mjs
          export: normalizeCalendar
        outputs:
          calendar_context: {type: object}
  freebusy:
    description: Read only a calendar's busy intervals in a window, when availability is all that matters.
    inputs:
      calendar_id: {}
      time_min: {}
      time_max: {}
    result_from:
      - normalize
    steps:
      - id: read
        operation: google/calendar/freebusy.query
        result:
          required:
            - calendar_id
            - time_min
            - time_max
            - complete
            - errors
            - busy
            - fetched_at
        inputs:
          calendar_id: $input.calendar_id
          time_min: $input.time_min
          time_max: $input.time_max
      - id: normalize
        inputs:
          kind: freebusy
          source_status: provider_readback
          calendar_id: $input.calendar_id
          time_min: $input.time_min
          time_max: $input.time_max
          provider_result: $steps.read.provider_operation.result
        tool:
          module: google-calendar.mjs
          export: normalizeCalendar
        outputs:
          calendar_context: {type: object}
  normalize-supplied:
    description: Normalize calendar results already collected elsewhere, without calling Google.
    inputs:
      kind:
        type: string
        description: Event or freebusy result type.
        enum:
          - events
          - freebusy
      calendar_id: {}
      time_min: {}
      time_max: {}
      provider_result: {}
      page_token: {}
    result_from:
      - normalize
    steps:
      - id: normalize
        inputs:
          kind: $input.kind
          source_status: supplied_result
          calendar_id: $input.calendar_id
          time_min: $input.time_min
          time_max: $input.time_max
          provider_result: $input.provider_result
          page_token: $input.page_token
        tool:
          module: google-calendar.mjs
          export: normalizeCalendar
        outputs:
          calendar_context: {type: object}
  combine-pages:
    description: Combine an ordered contiguous chain of previously normalized event pages without another provider call; hold gaps and conflicting event revisions.
    inputs:
      pages:
        type: array
        description: Ordered calendar_context values, beginning with an initial page and linked by exact cursors. Carry the source receipts separately.
        minItems: 1
        items:
          type: object
          additionalProperties: true
    result_from:
      - combine
    steps:
      - id: combine
        tool:
          module: google-calendar.mjs
          export: combineCalendarPages
        inputs:
          pages: $input.pages
        outputs:
          calendar_context: {type: object}
