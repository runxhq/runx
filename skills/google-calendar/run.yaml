skill: google-calendar
version: "0.1.8"
catalog:
  kind: graph
  audience: public
  visibility: public
  category: ops
  role: canonical
  provider: google/calendar
  execution: read
  completion: provider_readback
  approval: none

input_definitions:
  calendar_id:
    type: string
    required: true
    description: Exact selected Google calendar ID; primary selects the connected account's primary calendar.
    schema: { pattern: '^(?:primary|[A-Za-z0-9][A-Za-z0-9._@+%-]{0,254})$' }
  time_min:
    type: string
    required: true
    description: Inclusive window start with explicit UTC offset.
    schema: { format: date-time }
  time_max:
    type: string
    required: true
    description: Exclusive window end with explicit UTC offset, at most 30 days after start.
    schema: { format: date-time }
  provider_result:
    type: object
    required: true
    description: Prior Google Calendar provider result, to normalize without another read.
    schema: { additionalProperties: true }

harness:
  files: [fixtures/support/composed.graph]
  cases:
    - name: normalizes-complete-private-and-cancelled-events
      runner: normalize-supplied
      operator_journeys:
        - mode: composed
          request: Reuse already read Google Calendar evidence for the assistant without another provider call.
          expected_outcome: A bounded context packet preserves cancellation and removes private titles; it does not claim fresh provider readback.
          prior_evidence: [An existing calendar read result and its separate receipt.]
          must_not_repeat: [Do not call Google Calendar again.]
      inputs:
        kind: events
        calendar_id: primary
        time_min: "2026-10-04T00:00:00Z"
        time_max: "2026-10-05T00:00:00Z"
        provider_result:
          calendar_id: primary
          time_min: "2026-10-04T00:00:00Z"
          time_max: "2026-10-05T00:00:00Z"
          fetched_at: "2026-10-04T01:00:00Z"
          complete: true
          events:
            - { event_id: private-1, revision: v1, status: confirmed, visibility: private, summary: hidden, all_day: true, start: "2026-10-04", end: "2026-10-05" }
            - { event_id: cancelled-1, status: cancelled, recurring_event_id: series-1 }
      expect:
        status: sealed
        steps: [normalize]
        step_outputs:
          normalize:
            subset:
              calendar_context:
                data:
                  decision: ready
                  coverage: complete
                  provider_status: not_called
                  events:
                    - { event_id: private-1, all_day: true }
                    - { event_id: cancelled-1, status: cancelled }
        receipt: { schema: runx.receipt.v1 }
    - name: partial-freebusy-stays-unknown
      runner: normalize-supplied
      operator_journeys:
        - mode: standalone
          request: Check whether a selected Google Calendar is free during the next day.
          expected_outcome: Mark an incomplete provider result partial, without proposing availability.
      inputs:
        kind: freebusy
        calendar_id: primary
        time_min: "2026-10-04T00:00:00Z"
        time_max: "2026-10-05T00:00:00Z"
        provider_result:
          calendar_id: primary
          time_min: "2026-10-04T00:00:00Z"
          time_max: "2026-10-05T00:00:00Z"
          fetched_at: "2026-10-04T01:00:00Z"
          complete: false
          errors: [{ reason: notFound }]
          busy: []
      expect:
        status: sealed
        steps: [normalize]
        step_outputs:
          normalize:
            subset:
              calendar_context:
                data: { decision: partial, coverage: partial, provider_status: not_called }
        receipt: { schema: runx.receipt.v1 }

connectors:
  google/calendar:
    operations: [events.list, freebusy.query]
runners:
  assistant-brief:
    inputs:
      calendar_id: { definition: calendar_id }
      occurrence_ref:
        type: string
        required: true
        description: Exact scheduled goal occurrence admitted by the local operator.
        schema: { pattern: '^runx://assistant/goal/[a-z0-9_-]+/schedule/sha256:[0-9a-f]{64}/occurrence/[0-9]+$' }
      window_hours:
        type: integer
        required: true
        description: Bounded upcoming calendar window in hours.
        schema: { minimum: 1, maximum: 168 }
    result_from: [finish]
    steps:
      - id: window
        inputs: { calendar_id: $input.calendar_id, occurrence_ref: $input.occurrence_ref, window_hours: $input.window_hours }
        tool: { module: google-calendar.mjs, export: prepareAssistantWindow }
        outputs: { calendar_window: object }
      - id: read
        skill: .
        runner: events
        inputs:
          calendar_id: $steps.window.calendar_window.calendar_id
          time_min: $steps.window.calendar_window.time_min
          time_max: $steps.window.calendar_window.time_max
      - id: finish
        inputs:
          calendar_id: $input.calendar_id
          occurrence_ref: $input.occurrence_ref
          window: $steps.window.calendar_window
          calendar_context: $steps.read.calendar_context
        tool: { module: google-calendar.mjs, export: finishAssistantBrief }
        outputs: { work_result: object }
        artifacts:
          named_emits: { work_result: work_result }
          packets: { work_result: runx.work_outcome.v1 }
  events:
    default: true
    inputs:
      calendar_id: { definition: calendar_id }
      time_min: { definition: time_min }
      time_max: { definition: time_max }
    examples:
      - { calendar_id: primary, time_min: "2026-10-04T00:00:00Z", time_max: "2026-10-11T00:00:00Z" }
    result_from: [normalize]
    steps:
      - id: read
        operation: google/calendar/events.list
        result_fields: [calendar_id, time_min, time_max, events, complete, fetched_at]
        input:
          calendar_id: $input.calendar_id
          time_min: $input.time_min
          time_max: $input.time_max
      - id: normalize
        inputs:
          kind: events
          source_status: provider_readback
          calendar_id: $input.calendar_id
          time_min: $input.time_min
          time_max: $input.time_max
          provider_result: $steps.read.provider_operation.result
        tool: { module: google-calendar.mjs, export: normalizeCalendar }
        outputs: { calendar_context: object }
        artifacts:
          named_emits: { calendar_context: calendar_context }
  freebusy:
    inputs:
      calendar_id: { definition: calendar_id }
      time_min: { definition: time_min }
      time_max: { definition: time_max }
    result_from: [normalize]
    steps:
      - id: read
        operation: google/calendar/freebusy.query
        result_fields: [calendar_id, time_min, time_max, complete, errors, busy, fetched_at]
        input:
          calendar_id: $input.calendar_id
          time_min: $input.time_min
          time_max: $input.time_max
      - id: normalize
        inputs:
          kind: freebusy
          source_status: provider_readback
          calendar_id: $input.calendar_id
          time_min: $input.time_min
          time_max: $input.time_max
          provider_result: $steps.read.provider_operation.result
        tool: { module: google-calendar.mjs, export: normalizeCalendar }
        outputs: { calendar_context: object }
        artifacts:
          named_emits: { calendar_context: calendar_context }
  normalize-supplied:
    inputs:
      kind:
        type: string
        required: true
        description: Event or freebusy result type.
        schema: { enum: [events, freebusy] }
      calendar_id: { definition: calendar_id }
      time_min: { definition: time_min }
      time_max: { definition: time_max }
      provider_result: { definition: provider_result }
    result_from: [normalize]
    steps:
      - id: normalize
        inputs:
          kind: $input.kind
          source_status: supplied_result
          calendar_id: $input.calendar_id
          time_min: $input.time_min
          time_max: $input.time_max
          provider_result: $input.provider_result
        tool: { module: google-calendar.mjs, export: normalizeCalendar }
        outputs: { calendar_context: object }
        artifacts:
          named_emits: { calendar_context: calendar_context }
