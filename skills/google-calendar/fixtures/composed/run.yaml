minimum_runx: 0.12.0
catalog:
  visibility: internal
methods:
  run:
    steps:
      - id: first
        skill: ../..#normalize-supplied
        inputs:
          calendar_id: primary
          time_min: 2026-10-01T00:00:00Z
          time_max: 2027-01-01T00:00:00Z
          kind: events
          provider_result:
            calendar_id: primary
            time_min: 2026-10-01T00:00:00Z
            time_max: 2027-01-01T00:00:00Z
            fetched_at: 2026-11-04T00:00:00Z
            page_token: ""
            next_page_token: next
            complete: false
            events:
              - event_id: e1
                status: confirmed
                visibility: default
                revision: r1
                summary: Planning
                all_day: false
                start: 2026-11-04T01:00:00Z
                end: 2026-11-04T02:00:00Z
      - id: tail
        skill: ../..#normalize-supplied
        inputs:
          calendar_id: primary
          time_min: 2026-10-01T00:00:00Z
          time_max: 2027-01-01T00:00:00Z
          kind: events
          page_token: next
          provider_result:
            calendar_id: primary
            time_min: 2026-10-01T00:00:00Z
            time_max: 2027-01-01T00:00:00Z
            fetched_at: 2026-11-04T00:00:00Z
            page_token: next
            next_page_token: ""
            complete: true
            events:
              - event_id: e2
                status: confirmed
                visibility: default
                revision: r1
                summary: Planning
                all_day: false
                start: 2026-11-04T01:00:00Z
                end: 2026-11-04T02:00:00Z
      - id: combined
        skill: ../..#combine-pages
        inputs:
          pages:
            - $steps.first.calendar_context
            - $steps.tail.calendar_context
      - id: digest
        tool: data.digest
        inputs:
          value: $steps.combined
