version: "0.4.6"
minimum_runx: 0.12.0
catalog:
  visibility: public
  category: research

methods:
  web-fetch:
    inputs:
      url:
        type: string
        description: "Single public HTTP(S) URL to fetch."
        format: uri
        pattern: '^https?://'
      allowlist:
        type: array
        default: ["*"]
        description: "Optional host restriction. Omit for any publicly routable host; use exact hosts or leading wildcards such as *.example.com to narrow the fetch and redirects."
        minItems: 1
        maxItems: 64
        uniqueItems: true
        items:
          type: string
          minLength: 1
          maxLength: 253
        optional: true
      extract:
        type: string
        default: text
        description: "Extraction mode: text, metadata, links, or json. Defaults to text."
        optional: true
    examples:
      - url: https://example.com/
        extract: text
    result_from: [fetch]
    steps:
      - id: fetch
        operation: web/page.read
        inputs:
          url: "$input.url"
          allowlist: "$input.allowlist"
          extract: "$input.extract"
