name: fetch-metadata-within-allowlist
method: web-fetch
inputs:
  url: https://fixture.runx.invalid/rfc9110
  allowlist:
    - fixture.runx.invalid
  extract: metadata
providers:
  http:
    - request: {method: GET, url: "https://fixture.runx.invalid/rfc9110", body: none}
      response:
        status: 200
        headers: {content-type: text/html}
        body: '<html lang="en"><head><title>HTTP Semantics</title><meta name="description" content="Fixture RFC evidence"><link rel="canonical" href="https://fixture.runx.invalid/rfc9110"></head><body>HTTP Semantics</body></html>'
expect:
  status: sealed
  receipt:
    schema: runx.receipt.v1
