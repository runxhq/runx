name: empty-discovery
kind: skill
target: ..
inputs:
  query: Example API documentation
  limit: 3
expect:
  status: sealed
  steps:
  - validate
  - search
  - normalize
  step_outputs:
    normalize:
      subset:
        search_result:
          data:
            decision: no_results
            sources: []
            reported_cost_usd: null
  receipt:
    schema: runx.receipt.v1
metadata:
  public_skill: web-search
  source: skills-fixture
caller:
  http_exchanges:
  - request:
      method: POST
      url: https://api.exa.ai/search
      body:
        json:
          query: Example API documentation
          numResults: 3
          type: auto
    response:
      status: 200
      headers:
        content-type: application/json
      body: '{"requestId":"fixture-empty","results":[]}'
setup:
  credentials:
  - exa
env:
  EXA_API_KEY: harness-exa-key
