name: unusable-candidates
kind: skill
target: ..
inputs:
  query: Example API changelog
  limit: 2
expect:
  status: sealed
  steps:
  - validate
  - search
  - normalize
  step_outputs:
    normalize:
      subset:
        search_result:
          data:
            decision: unusable_results
            returned_count: 2
            unusable_count: 2
            sources: []
  receipt:
    schema: runx.receipt.v1
metadata:
  public_skill: web-search
  source: skills-fixture
caller:
  http_exchanges:
  - request:
      method: POST
      url: https://api.exa.ai/search
      body:
        json:
          query: Example API changelog
          numResults: 2
          type: auto
    response:
      status: 200
      headers:
        content-type: application/json
      body: '{"requestId":"fixture-2","results":[{"url":"https://example.com:bad/changelog","title":"Malformed port"},{"url":"https://user:secret@example.com/changelog","title":"Credential-bearing"}],"costDollars":{"total":0.005}}'
setup:
  credentials:
  - exa
env:
  EXA_API_KEY: harness-exa-key
