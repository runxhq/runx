name: empty-discovery
setup:
  credentials:
  - exa
  # A search quotes up to 14,000 micro-USD, sent only under a stated limit.
  authority:
    max_spend_micro_usd: 14000
inputs:
  query: Example API documentation
  limit: 3
env:
  EXA_API_KEY: test-exa-key
providers:
  http:
  - request:
      method: POST
      url: https://api.exa.ai/search
      body:
        json:
          query: Example API documentation
          numResults: 3
          type: auto
    response:
      status: 200
      headers:
        content-type: application/json
      body: '{"requestId":"fixture-empty","results":[]}'
expect:
  status: sealed
  steps:
  - validate
  - search
  - normalize
  step_outputs:
    normalize:
      subset:
        search_result:
          decision: no_results
          sources: []
          reported_cost_usd: null
  receipt:
    schema: runx.receipt.v1
