name: empty-discovery
setup:
  credentials:
  - exa
inputs:
  query: Example API documentation
  limit: 3
env:
  EXA_API_KEY: harness-exa-key
providers:
  http:
  - request:
      method: POST
      url: https://api.exa.ai/search
      body:
        json:
          query: Example API documentation
          numResults: 3
          type: auto
    response:
      status: 200
      headers:
        content-type: application/json
      body: '{"requestId":"fixture-empty","results":[]}'
expect:
  status: sealed
  steps:
  - validate
  - search
  - normalize
  step_outputs:
    normalize:
      subset:
        search_result:
          data:
            decision: no_results
            sources: []
            reported_cost_usd: null
  receipt:
    schema: runx.receipt.v1
