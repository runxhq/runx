name: issue-flow-policy-from-brief
method: author
inputs:
  governance_brief: Govern issue intake across acme/acme, acme/api, and acme/app. Trust GitHub issues and Sentry alerts. Kam owns platform; Chong owns product. Never auto-merge, require a human merge, and close source issues only after verification.
  objective: Stand up a fail-closed issue-flow policy for the three repos.
host:
  answers:
    draft:
      policy_proposal:
        decision: ready
        policy:
          schema: runx.operational_policy.v1
          schema_version: runx.operational_policy.v1
          policy_id: acme-issue-flow
          sources:
            - source_id: github-issues
              provider: github
              allowed_locators:
                - github://acme/acme/issues
                - github://acme/api/issues
                - github://acme/app/issues
              allowed_actions:
                - issue-intake
                - issue-to-pr
                - pr-review
              source_thread:
                required: true
                publish_mode: comment
                missing_behavior: fail_closed
              minimum_confidence: 0.72
            - source_id: sentry-alerts
              provider: sentry
              allowed_locators:
                - sentry://acme/production
              allowed_actions:
                - issue-intake
                - issue-to-pr
              source_thread:
                required: true
                publish_mode: reply
                missing_behavior: fail_closed
              minimum_confidence: 0.82
          automations:
            - automation_id: local-review
              kind: local
              state: available
              allowed_actions:
                - issue-intake
                - issue-to-pr
                - pr-review
              target_repos:
                - acme/acme
                - acme/api
                - acme/app
              scafld_required: true
          owner_routes:
            - route_id: platform-owner
              owners:
                - kam
              target_repos:
                - acme/acme
                - acme/api
            - route_id: product-owner
              owners:
                - chong
              target_repos:
                - acme/app
          targets:
            - repo: acme/acme
              automation_ids:
                - local-review
              allowed_actions:
                - issue-intake
                - issue-to-pr
                - pr-review
              default_owner_route: platform-owner
              scafld_required: true
              base_branch: main
            - repo: acme/api
              automation_ids:
                - local-review
              allowed_actions:
                - issue-intake
                - issue-to-pr
                - pr-review
              default_owner_route: platform-owner
              scafld_required: true
              base_branch: main
            - repo: acme/app
              automation_ids:
                - local-review
              allowed_actions:
                - issue-intake
                - issue-to-pr
                - pr-review
              default_owner_route: product-owner
              scafld_required: true
              base_branch: main
          dedupe:
            strategy: source_digest
            key_fields:
              - source.provider
              - source.locator
              - signal.digest
            on_duplicate: reuse
          outcomes:
            observe_provider: true
            verification_required: true
            close_source_issue: when_verified
            publish_final_source_thread_update: true
          permissions:
            auto_merge: false
            mutate_target_repo: true
            require_human_merge_gate: true
        rationale: The policy binds every source, target, automation, and owner while keeping mutation behind human review.
        blockers: []
        needs_input: []
        success_checkpoint:
          milestone: policy_drafted
          description: The draft is ready for native validation.
expect:
  status: sealed
  steps:
    - draft
    - prepare
    - compare-fixed-settings
    - lint
    - finalize-lint
  step_outputs:
    finalize-lint:
      subset:
        policy_proposal_packet:
          policy_proposal:
            decision: ready
            policy:
              schema: runx.operational_policy.v1
              policy_id: acme-issue-flow
            validation:
              status: pass
              engine: runx policy
  receipt:
    schema: runx.receipt.v1
    state: sealed
    outcome: completed
