version: "0.2.9"
minimum_runx: 0.12.0
catalog:
  visibility: public
  category: security
methods:
  author:
    inputs:
      governance_brief:
        type: string
        description: The governance intent in prose.
        minLength: 1
        maxLength: 50000
        pattern: \S
      existing_policy:
        packet: runx.operational_policy.v1
        description: The actual current native-valid policy selected by the host. This proposal lane can narrow known controls; identity/routing/opaque settings must stay unchanged.
        optional: true
      target_repos:
        type: array
        description: Explicit target repository slugs from the real project context.
        maxItems: 1000
        uniqueItems: true
        items:
          type: string
          pattern: ^[^/\s]+/[^/\s]+$
        optional: true
      objective:
        type: string
        description: Operator intent that focuses the pass.
        optional: true
    result_from:
      - finalize-lint
      - finalize-stop
    steps:
      - id: draft
        agent: policy-draft-draft
        outputs:
          policy_proposal:
            type: object
            required:
              - decision
              - policy
              - rationale
              - blockers
              - needs_input
              - success_checkpoint
            additionalProperties: false
            properties:
              decision:
                type: string
                enum:
                  - ready
                  - needs_input
                  - reject
              policy:
                type:
                  - object
                  - "null"
                required:
                  - schema
                properties:
                  schema:
                    const: runx.operational_policy.v1
                additionalProperties: true
              rationale:
                type: string
              blockers:
                type: array
                items:
                  type: string
              needs_input:
                type: array
                items:
                  type: string
              success_checkpoint:
                type: object
                properties:
                  milestone:
                    type: string
                  description:
                    type: string
                additionalProperties: true
            allOf:
              - if:
                  properties:
                    decision:
                      const: ready
                then:
                  properties:
                    policy:
                      type: object
        inputs:
          governance_brief: $input.governance_brief
          existing_policy: $input.existing_policy
          target_repos: $input.target_repos
          objective: $input.objective
      - id: prepare
        inputs:
          existing_policy: $input.existing_policy
          policy_proposal: $steps.draft.policy_proposal
        tool:
          module: policy-draft.mjs
          export: preparePolicy
        outputs:
          policy_context: {type: object}
      - id: compare-fixed-settings
        when:
          value: $steps.prepare.policy_context.path
          equals: lint
        tool: data.compare
        inputs:
          actual: $steps.prepare.policy_context.fixed_proposed
          expected: $steps.prepare.policy_context.fixed_existing
      - id: lint
        when:
          value: $steps.prepare.policy_context.path
          equals: lint
        tool: policy.lint
        inputs:
          policy: $steps.prepare.policy_context.policy
      - id: finalize-lint
        when:
          value: $steps.prepare.policy_context.path
          equals: lint
        tool:
          module: policy-draft.mjs
          export: finalizePolicy
        outputs:
          policy_proposal:
            type: object
          policy_proposal_packet: {packet: runx/policy-draft.proposal.v1}
        result_as: policy_proposal_packet
        inputs:
          policy_context: $steps.prepare.policy_context
          policy_lint: $steps.lint.policy_lint
          fixed_comparison: $steps.compare-fixed-settings.comparison
      - id: finalize-stop
        when:
          value: $steps.prepare.policy_context.path
          equals: stop
        tool:
          module: policy-draft.mjs
          export: finalizePolicy
        outputs:
          policy_proposal:
            type: object
          policy_proposal_packet: {packet: runx/policy-draft.proposal.v1}
        result_as: policy_proposal_packet
        inputs:
          policy_context: $steps.prepare.policy_context
    examples:
      - governance_brief: Govern issue intake across acme/acme, acme/api, and acme/app. Trust GitHub issues and Sentry alerts. Kam owns platform; Chong owns product. Never auto-merge, require a human merge, and close source issues only after verification.
        objective: Stand up a fail-closed issue-flow policy for the three repos.
