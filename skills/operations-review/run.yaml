version: "0.3.13"
minimum_runx: 0.12.0
default_method: operate
catalog:
  visibility: public
  category: ops
methods:
  operate:
    description: Review an operations snapshot you supply, ranking the findings, choosing the next action and its governed lane, and saying what approval and evidence it needs.
    inputs:
      objective:
        type: string
        description: The bounded operator objective.
      scope:
        type: string
        description: Project, workspace, account, product, or bounded operating surface being operated.
      dashboard_snapshot:
        description: Current projected state for the operating scope.
        optional: true
      receipt_summary:
        description: Receipt and effect evidence available to the run.
        optional: true
      provider_status:
        description: Provider health, account, webhook, credential, or deploy state.
        optional: true
      approval_context:
        description: Existing approvals, denials, or policy gates.
        optional: true
      operator_policy:
        type: string
        description: Tenant-specific guardrails and lane names.
        optional: true
      project_profile:
        type: string
        description: Project topology, existing commands/workflows, and verification expectations. Context only, not authority.
        optional: true
      requested_action:
        type: string
        description: Optional action id or lane selected by the dashboard.
        optional: true
    steps:
      - id: operate
        agent: operations-review
        inputs:
          objective: $input.objective
          scope: $input.scope
          dashboard_snapshot: $input.dashboard_snapshot
          receipt_summary: $input.receipt_summary
          provider_status: $input.provider_status
          approval_context: $input.approval_context
          operator_policy: $input.operator_policy
          project_profile: $input.project_profile
          requested_action: $input.requested_action
        outputs:
          ops_desk_packet:
            type: object
            packet: runx/operations-review.desk.v1
    examples:
      - objective: Review the remaining invoice-payment gap and choose the next bounded step.
        scope: workspace:runx-skill-completion
        dashboard_snapshot:
          invoice_pay:
            structured_settlement: available
            automatic_intake: incomplete
            reason: The rejected candidate trusted an unbound currency exponent and duplicated native exact conversion.
        project_profile: "Existing source owners: skills/invoice-pay handles invoice matching; skills/pay owns buyer mandate/approval; crates/runx-contracts/src/connector/template.rs owns exact template minor-unit conversion. prior-art#prior-art-agent inspects exact selected local sources."
        operator_policy: Return one useful read-only proposal. Do not invent execution aliases, payment authority, delivery or a missing primitive.
  review-action:
    description: Review one proposed action, its consequence, whether it needs approval, its blockers and the evidence that would prove it.
    inputs:
      action_packet:
        description: Proposed ops desk action or ops_desk_packet.proposals item.
      receipt_summary:
        description: Evidence expected to prove or reject the action.
        optional: true
      approval_context:
        description: Human gate state for the proposed action.
        optional: true
      project_profile:
        type: string
        description: Project topology and expected execution surfaces.
        optional: true
    steps:
      - id: review-action
        agent: operations-review-action-review
        inputs:
          action_packet: $input.action_packet
          receipt_summary: $input.receipt_summary
          approval_context: $input.approval_context
          project_profile: $input.project_profile
        outputs:
          action_review:
            type: object
          action_review_packet: {packet: runx/operations-review.action_review.v1}
        result_as: action_review_packet
  operate_from_projection:
    description: Review the same way, reading a product's own stream first, which the run's authority must name.
    inputs:
      package:
        type: string
        description: The package whose stream holds the operating state, such as runx/github or project:ops. Another package's stream is read only under a term naming it.
        pattern: ^([a-z0-9][a-z0-9-]*/[a-z0-9][a-z0-9-]*|project:[A-Za-z0-9][A-Za-z0-9._-]*|unowned)$
      stream:
        type: string
        description: The stream, as its package names it.
      key:
        type: string
        description: Operating scope's key in the stream, read before planning.
      objective:
        type: string
        description: The bounded operator objective.
      scope:
        type: string
        description: Project, workspace, account, product, or bounded operating surface being operated.
      receipt_summary:
        description: Receipt and effect evidence available to the run.
        optional: true
      provider_status:
        description: Provider health, account, webhook, credential, or deploy state.
        optional: true
      approval_context:
        description: Existing approvals, denials, or policy gates.
        optional: true
      operator_policy:
        type: string
        description: Tenant-specific guardrails and lane names.
        optional: true
      project_profile:
        type: string
        description: Project topology, existing commands/workflows, and verification expectations. Context only, not authority.
        optional: true
      requested_action:
        type: string
        description: Optional action id or lane selected by the dashboard.
        optional: true
    result_from:
      - operate
    steps:
      - id: read-state
        operation: store/key.inspect
        inputs:
          package: $input.package
          stream: $input.stream
          key: $input.key
      - id: operate
        skill: .#operate
        inputs:
          objective: $input.objective
          scope: $input.scope
          receipt_summary: $input.receipt_summary
          provider_status: $input.provider_status
          approval_context: $input.approval_context
          operator_policy: $input.operator_policy
          project_profile: $input.project_profile
          requested_action: $input.requested_action
          dashboard_snapshot: $steps.read-state.provider_operation.result
        outputs:
          ops_desk_packet: {packet: runx/operations-review.desk.v1, optional: true}
