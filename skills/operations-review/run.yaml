skill: operations-review
version: "0.3.12"
catalog:
  kind: skill
  audience: operator
  visibility: public
  role: canonical
  execution: read
  completion: runtime_receipt
  approval: none
  category: ops
connectors:
  store:
    operations:
    - projection.read
runners:
  operate:
    description: Review an operations snapshot you supply, ranking the findings, choosing the next action and its governed lane, and saying what approval and evidence it needs.
    inputs:
      objective:
        type: string
        required: true
        description: The bounded operator objective.
      scope:
        type: string
        required: true
        description: Project, workspace, account, product, or bounded operating surface being operated.
      dashboard_snapshot:
        type: json
        required: false
        description: Current projected state for the operating scope.
      receipt_summary:
        type: json
        required: false
        description: Receipt and effect evidence available to the run.
      provider_status:
        type: json
        required: false
        description: Provider health, account, webhook, credential, or deploy state.
      approval_context:
        type: json
        required: false
        description: Existing approvals, denials, or policy gates.
      operator_policy:
        type: string
        required: false
        description: Tenant-specific guardrails and lane names.
      project_profile:
        type: string
        required: false
        description: Project topology, existing commands/workflows, and verification expectations. Context
          only, not authority.
      requested_action:
        type: string
        required: false
        description: Optional action id or lane selected by the dashboard.
    steps:
    - id: operate
      agent:
        role: operator
        task: operations-review
      inputs:
        objective: $input.objective
        scope: $input.scope
        dashboard_snapshot: $input.dashboard_snapshot
        receipt_summary: $input.receipt_summary
        provider_status: $input.provider_status
        approval_context: $input.approval_context
        operator_policy: $input.operator_policy
        project_profile: $input.project_profile
        requested_action: $input.requested_action
      outputs:
        ops_desk_packet:
          type: object
      artifacts:
        named_emits:
          ops_desk_packet: ops_desk_packet
        packets:
          ops_desk_packet: runx/operations-review.desk.v1
    default: true
  review-action:
    description: Review one proposed action, its consequence, whether it needs approval, its blockers and the evidence that would prove it.
    inputs:
      action_packet:
        type: json
        required: true
        description: Proposed ops desk action or ops_desk_packet.proposals item.
      receipt_summary:
        type: json
        required: false
        description: Evidence expected to prove or reject the action.
      approval_context:
        type: json
        required: false
        description: Human gate state for the proposed action.
      project_profile:
        type: string
        required: false
        description: Project topology and expected execution surfaces.
    steps:
    - id: review-action
      agent:
        role: reviewer
        task: operations-review-action-review
      inputs:
        action_packet: $input.action_packet
        receipt_summary: $input.receipt_summary
        approval_context: $input.approval_context
        project_profile: $input.project_profile
      outputs:
        action_review:
          type: object
      artifacts:
        wrap_as: action_review_packet
        packet: runx/operations-review.action_review.v1
  operate_from_projection:
    description: Review the same way, reading a bounded product-owned projection first.
    inputs:
      data_source_uri:
        type: string
        required: true
        description: Logical data source that stores the operating projection.
      resource:
        type: string
        required: true
        description: Declared projection or event resource.
      aggregate_id:
        type: string
        required: true
        description: Operating scope partition to read before planning.
      objective:
        type: string
        required: true
        description: The bounded operator objective.
      scope:
        type: string
        required: true
        description: Project, workspace, account, product, or bounded operating surface being operated.
      receipt_summary:
        type: json
        required: false
        description: Receipt and effect evidence available to the run.
      provider_status:
        type: json
        required: false
        description: Provider health, account, webhook, credential, or deploy state.
      approval_context:
        type: json
        required: false
        description: Existing approvals, denials, or policy gates.
      operator_policy:
        type: string
        required: false
        description: Tenant-specific guardrails and lane names.
      project_profile:
        type: string
        required: false
        description: Project topology, existing commands/workflows, and verification expectations. Context
          only, not authority.
      requested_action:
        type: string
        required: false
        description: Optional action id or lane selected by the dashboard.
    result_from:
    - operate
    steps:
    - id: read-state
      operation: store/projection.read
      input:
        data_source_uri: $input.data_source_uri
        resource: $input.resource
        aggregate_id: $input.aggregate_id
    - id: operate
      skill: .
      runner: operate
      inputs:
        objective: $input.objective
        scope: $input.scope
        receipt_summary: $input.receipt_summary
        provider_status: $input.provider_status
        approval_context: $input.approval_context
        operator_policy: $input.operator_policy
        project_profile: $input.project_profile
        requested_action: $input.requested_action
        dashboard_snapshot: $steps.read-state.provider_operation.result.projection
      artifacts:
        named_emits:
          ops_desk_packet: ops_desk_packet
        packets:
          ops_desk_packet: runx/operations-review.desk.v1
harness:
  files:
  - fixtures/support/composed.graph
  cases: []
