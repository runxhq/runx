name: operations-review-operate-from-sqlite-projection
method: operate_from_projection
inputs:
  data_source_uri: tenant://operations-review/sqlite-state
  resource: ops_projection
  aggregate_id: workspace-example
  objective: Check the workspace and tell me the next safe action.
  scope: workspace:example
  receipt_summary:
    receipts: []
  provider_status:
    runx_api: ok
  approval_context:
    approvals: []
  operator_policy: Route live sends through message-send and money movement through spend or refund.
host:
  answers:
    operate:
      ops_desk_packet:
        decision: needs_input
        scope: workspace:example
        objective: Check the workspace and tell me the next safe action.
        mode: read_only
        dashboard:
          health: unknown
          money: unknown
          communications: unknown
          providers: ok
          receipts: unknown
        findings:
          - severity: warning
            area: receipts
            summary: The projection is empty, so there is no receipt-backed operating state yet.
            evidence_paths:
              - store/projection.read
        proposals: []
        ordered_next_steps:
          - step: Append a governed state event or provide a receipt summary before proposing live actions.
            lane: store
            requires_confirmation: false
        refused_reasons: []
        needs_input:
          - receipt-backed operating state
        success_checkpoint:
          milestone: state loaded
          description: A projection read was attempted before operator planning.
expect:
  status: sealed
  receipt:
    schema: runx.receipt.v1
  steps:
    - read-state
    - operate
  step_outputs:
    read-state:
      subset:
        provider_operation:
          data:
            result:
              schema: runx.data.operation_result.v1
              operation: projection.read
              aggregate_id: workspace-example
              projection:
                aggregate_id: workspace-example
                event_count: 0
                version: 0
              provider_evidence:
                backend: sqlite
