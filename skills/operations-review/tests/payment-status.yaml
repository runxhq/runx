name: operations-review-payment-status
method: operate
inputs:
  objective: Review the remaining invoice-payment gap and choose the next bounded step.
  scope: workspace:runx-skill-completion
  dashboard_snapshot:
    invoice_pay:
      structured_settlement: available
      automatic_intake: incomplete
      reason: The rejected candidate trusted an unbound currency exponent and duplicated native exact conversion.
  project_profile: "Existing source owners: skills/invoice-pay handles invoice matching; skills/pay owns buyer mandate/approval; crates/runx-contracts/src/connector/template.rs owns exact template minor-unit conversion. prior-art#prior-art-agent inspects exact selected local sources."
  operator_policy: Return one useful read-only proposal. Do not invent execution aliases, payment authority, delivery or a missing primitive.
host:
  answers:
    operate:
      ops_desk_packet:
        decision: ready
        scope: workspace:runx-skill-completion
        objective: Review the remaining invoice-payment gap and choose the next bounded step.
        mode: read_only
        dashboard:
          money: needs_attention
          receipts: unknown
          providers: unknown
        findings:
          - severity: warning
            area: money
            summary: Automatic invoice intake is unfinished; the existing structured settlement remains available.
            evidence_paths:
              - dashboard_snapshot.invoice_pay
        proposals:
          - action_id: inspect-invoice-amount-owners
            lane: prior-art
            reason: Resolve the exact amount/currency-unit ownership before changing invoice intake.
            inputs_summary:
              runner: prior-art-agent
              repo_root: /workspace/runx
              objective: Identify the existing exact amount conversion owner and the selected buyer method currency-unit contract before invoice intake.
              source_paths:
                - skills/invoice-pay/run.yaml
                - skills/pay/run.yaml
                - crates/runx-contracts/src/connector/template.rs
            consequence: read_only
            approval_required: false
            approval_prompt: null
            blockers: []
            verification:
              expected_receipt: runx.receipt.v1
              expected_effect: null
              readback: Source-bound prior-art report naming the existing amount owner, currency-unit binding gap and bounded next change.
            execution:
              interface: skill
              lane: prior-art
              profile: null
              command: null
              workflow: null
              approval_gate: null
              verifier: native source-capture and receipt verification
        ordered_next_steps:
          - step: Inspect the selected local amount and buyer-contract sources before designing intake.
            lane: prior-art
            requires_confirmation: false
        refused_reasons: []
        needs_input: []
        success_checkpoint:
          milestone: amount ownership established
          description: The exact conversion and method-specific unit boundary are identified without a payment attempt.
expect:
  status: sealed
  receipt:
    schema: runx.receipt.v1
