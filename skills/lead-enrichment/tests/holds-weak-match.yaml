name: holds-weak-match
setup:
  credentials:
    - apollo
inputs:
  subject:
    id: lead:fixture
    kind: person
  selector:
    id: person-1
  requested_fields:
    - person.title
env:
  APOLLO_API_KEY: test-apollo-key
host:
  approvals:
    person: true
providers:
  http:
    - request:
        method: POST
        url: https://api.apollo.io/api/v1/people/match?id=person-1&reveal_personal_emails=false&reveal_phone_number=false&run_waterfall_email=false&run_waterfall_phone=false
        body: none
      response:
        status: 200
        headers:
          content-type: application/json
        body: '{"match_confidence":"medium","person":{"id":"person-1","title":"CTO"}}'
expect:
  status: sealed
  step_outputs:
    normalize-person:
      subset:
        lookup_evidence:
          decision: ambiguous
        lead_enrichment_packet:
          data:
            decision: needs_more_evidence
            facts: []
  receipt:
    schema: runx.receipt.v1
