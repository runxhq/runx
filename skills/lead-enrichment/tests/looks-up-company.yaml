name: looks-up-company
setup:
  credentials:
    - apollo
inputs:
  subject:
    id: lead:fixture
    kind: company
  selector:
    domain: example.com
  requested_fields:
    - company.name
    - company.employee_count
env:
  APOLLO_API_KEY: test-apollo-key
host:
  approvals:
    company: true
providers:
  http:
    - request:
        method: GET
        url: https://api.apollo.io/api/v1/organizations/enrich?domain=example.com
        body: none
      response:
        status: 200
        headers:
          content-type: application/json
        body: '{"organization":{"id":"org-1","name":"Example","primary_domain":"example.com","estimated_num_employees":120}}'
expect:
  status: sealed
  step_outputs:
    normalize-company:
      subset:
        lookup_evidence:
          data:
            decision: matched
        lead_enrichment_packet:
          data:
            decision: enriched
            facts:
              - field: company.name
                value: Example
              - field: company.employee_count
                value: 120
  receipt:
    schema: runx.receipt.v1
