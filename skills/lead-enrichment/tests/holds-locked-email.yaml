name: holds-locked-email
setup:
  credentials:
    - apollo
inputs:
  subject:
    id: lead:fixture
    kind: person
  selector:
    id: person-1
  requested_fields:
    - person.title
    - person.email
env:
  APOLLO_API_KEY: harness-apollo-key
host:
  approvals:
    person: true
providers:
  http:
    - request:
        method: POST
        url: https://api.apollo.io/api/v1/people/match?id=person-1&reveal_personal_emails=false&reveal_phone_number=false&run_waterfall_email=false&run_waterfall_phone=false
        body: none
      response:
        status: 200
        headers:
          content-type: application/json
        body: '{"match_confidence":"high","person":{"id":"person-1","title":"CTO","email":"email_not_unlocked@domain.com"}}'
expect:
  status: sealed
  step_outputs:
    normalize-person:
      subset:
        lookup_evidence:
          decision: matched
        lead_enrichment_packet:
          data:
            decision: partial
            missing_fields:
              - person.email
            facts:
              - field: person.title
                value: CTO
  receipt:
    schema: runx.receipt.v1
