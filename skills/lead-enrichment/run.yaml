skill: lead-enrichment
version: "0.4.2"
catalog:
  kind: graph
  audience: operator
  visibility: public
  role: context
  execution: read
  completion: runtime_receipt
  approval: none
  category: growth
runners:
  enrich:
    default: true
    inputs:
      subject:
        type: object
        required: true
        description: One exact person or company reference; provider matches must refer to it.
        schema:
          additionalProperties: false
          required: [ref, kind]
          properties:
            ref: {type: string, minLength: 1, maxLength: 1000}
            kind: {enum: [person, company]}
      sources:
        type: array
        required: true
        description: Bounded factual observations with explicit entity matches and upstream source digests.
        schema:
          minItems: 1
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [source_ref, source_digest, subject_ref, observed_at, match_confidence, facts]
            properties:
              source_ref: {type: string, minLength: 1, maxLength: 1000}
              source_digest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
              subject_ref: {type: string, minLength: 1, maxLength: 1000}
              observed_at: {type: string, format: date-time}
              match_confidence: {enum: [high, medium, low, unknown]}
              facts:
                type: array
                minItems: 1
                maxItems: 30
                items:
                  type: object
                  additionalProperties: false
                  required: [field, value]
                  properties:
                    field:
                      enum:
                      - person.name
                      - person.email
                      - person.title
                      - person.linkedin_url
                      - company.name
                      - company.domain
                      - company.industry
                      - company.employee_count
                      - company.country
                      - company.website
                    value:
                      oneOf:
                      - {type: string, minLength: 1, maxLength: 2000}
                      - {type: integer, minimum: 0, maximum: 1000000000}
                  allOf:
                  - if:
                      properties:
                        field: {const: company.employee_count}
                      required: [field]
                    then:
                      properties:
                        value: {type: integer, minimum: 0, maximum: 1000000000}
                    else:
                      properties:
                        value: {type: string, minLength: 1, maxLength: 2000}
      requested_fields:
        type: array
        required: true
        description: Professional fields needed by this task; unrelated fields are omitted.
        schema:
          minItems: 1
          maxItems: 30
          items:
            enum:
            - person.name
            - person.email
            - person.title
            - person.linkedin_url
            - company.name
            - company.domain
            - company.industry
            - company.employee_count
            - company.country
            - company.website
          uniqueItems: true
      as_of:
        type: string
        required: true
        description: Explicit evaluation time; no host clock is read.
        schema: {format: date-time}
      max_age_days:
        type: integer
        required: false
        description: Maximum observation age in days.
        schema: {minimum: 1, maximum: 3650}
        default: 90
    result_from: [enrich]
    steps:
    - id: enrich
      inputs:
        subject: $input.subject
        sources: $input.sources
        requested_fields: $input.requested_fields
        as_of: $input.as_of
        max_age_days: $input.max_age_days
      tool: {module: lead-enrichment.mjs, export: enrichFacts}
      outputs:
        lead_enrichment_packet:
          type: object
          schema:
            additionalProperties: false
            required: [decision, subject, as_of, facts, missing_fields, conflicts, sources, blockers, acquisition]
            properties:
              decision: {enum: [enriched, partial, needs_more_evidence]}
              subject:
                type: object
                additionalProperties: false
                required: [ref, kind]
                properties:
                  ref: {type: string, minLength: 1, maxLength: 1000}
                  kind: {enum: [person, company]}
              as_of: {type: string, format: date-time}
              facts:
                type: array
                minItems: 0
                maxItems: 30
                items:
                  type: object
                  additionalProperties: false
                  required: [field, value, source_refs]
                  properties:
                    field:
                      enum:
                      - person.name
                      - person.email
                      - person.title
                      - person.linkedin_url
                      - company.name
                      - company.domain
                      - company.industry
                      - company.employee_count
                      - company.country
                      - company.website
                    value:
                      oneOf:
                      - {type: string, minLength: 1, maxLength: 2000}
                      - {type: integer, minimum: 0, maximum: 1000000000}
                    source_refs:
                      type: array
                      minItems: 1
                      maxItems: 100
                      items: {type: string, minLength: 1, maxLength: 1000}
                      uniqueItems: true
                  allOf:
                  - if:
                      properties:
                        field: {const: company.employee_count}
                      required: [field]
                    then:
                      properties:
                        value: {type: integer, minimum: 0, maximum: 1000000000}
                    else:
                      properties:
                        value: {type: string, minLength: 1, maxLength: 2000}
              missing_fields:
                type: array
                minItems: 0
                maxItems: 30
                items:
                  enum:
                  - person.name
                  - person.email
                  - person.title
                  - person.linkedin_url
                  - company.name
                  - company.domain
                  - company.industry
                  - company.employee_count
                  - company.country
                  - company.website
                uniqueItems: true
              conflicts:
                type: array
                minItems: 0
                maxItems: 30
                items:
                  type: object
                  additionalProperties: false
                  required: [field, candidates]
                  properties:
                    field:
                      enum:
                      - person.name
                      - person.email
                      - person.title
                      - person.linkedin_url
                      - company.name
                      - company.domain
                      - company.industry
                      - company.employee_count
                      - company.country
                      - company.website
                    candidates:
                      type: array
                      minItems: 2
                      maxItems: 100
                      items:
                        type: object
                        additionalProperties: false
                        required: [value, source_refs]
                        properties:
                          value:
                            oneOf:
                            - {type: string, minLength: 1, maxLength: 2000}
                            - {type: integer, minimum: 0, maximum: 1000000000}
                          source_refs:
                            type: array
                            minItems: 1
                            maxItems: 100
                            items: {type: string, minLength: 1, maxLength: 1000}
                            uniqueItems: true
              sources:
                type: array
                minItems: 0
                maxItems: 100
                items:
                  type: object
                  additionalProperties: false
                  required: [source_ref, source_digest, observed_at, match_confidence, provenance]
                  properties:
                    source_ref: {type: string, minLength: 1, maxLength: 1000}
                    source_digest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
                    observed_at: {type: string, format: date-time}
                    match_confidence: {const: high}
                    provenance: {const: caller_supplied_source_digest}
              blockers:
                type: array
                minItems: 0
                maxItems: 100
                items: {type: string, minLength: 1, maxLength: 2000}
              acquisition: {const: supplied_evidence}
      artifacts:
        named_emits: {lead_enrichment_packet: lead_enrichment_packet}
        packets: {lead_enrichment_packet: runx.growth.lead_enrichment.v1}
