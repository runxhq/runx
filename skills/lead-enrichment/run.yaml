skill: lead-enrichment
version: "0.4.7"
catalog:
  kind: graph
  audience: operator
  visibility: public
  role: context
  execution: read
  completion: runtime_receipt
  approval: none
  category: growth
runners:
  enrich:
    default: true
    inputs:
      subject:
        type: object
        required: true
        description: One exact person or company reference; provider matches must refer to it.
        schema:
          additionalProperties: false
          required: [id, kind]
          properties:
            id: {type: string, minLength: 1, maxLength: 1000}
            kind: {enum: [person, company]}
      sources:
        type: array
        required: true
        description: Bounded factual observations with explicit entity matches and upstream source digests.
        schema:
          minItems: 1
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [source_id, source_digest, subject_id, observed_at, match_confidence, facts]
            properties:
              source_id: {type: string, minLength: 1, maxLength: 1000}
              source_digest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
              subject_id: {type: string, minLength: 1, maxLength: 1000}
              observed_at: {type: string, format: date-time}
              match_confidence: {enum: [high, medium, low, unknown]}
              facts:
                type: array
                minItems: 1
                maxItems: 30
                items:
                  type: object
                  additionalProperties: false
                  required: [field, value]
                  properties:
                    field:
                      enum:
                      - person.name
                      - person.email
                      - person.title
                      - person.linkedin_url
                      - company.name
                      - company.domain
                      - company.industry
                      - company.employee_count
                      - company.country
                      - company.website
                    value:
                      oneOf:
                      - {type: string, minLength: 1, maxLength: 2000}
                      - {type: integer, minimum: 0, maximum: 1000000000}
                  allOf:
                  - if:
                      properties:
                        field: {const: company.employee_count}
                      required: [field]
                    then:
                      properties:
                        value: {type: integer, minimum: 0, maximum: 1000000000}
                    else:
                      properties:
                        value: {type: string, minLength: 1, maxLength: 2000}
      requested_fields:
        type: array
        required: true
        description: Professional fields needed by this task; unrelated fields are omitted.
        schema:
          minItems: 1
          maxItems: 30
          items:
            enum:
            - person.name
            - person.email
            - person.title
            - person.linkedin_url
            - company.name
            - company.domain
            - company.industry
            - company.employee_count
            - company.country
            - company.website
          uniqueItems: true
      as_of:
        type: string
        required: true
        description: Explicit evaluation time; no host clock is read.
        schema: {format: date-time}
      max_age_days:
        type: integer
        required: false
        description: Maximum observation age in days.
        schema: {minimum: 1, maximum: 3650}
        default: 90
    result_from: [enrich]
    steps:
    - id: enrich
      inputs:
        subject: $input.subject
        sources: $input.sources
        requested_fields: $input.requested_fields
        as_of: $input.as_of
        max_age_days: $input.max_age_days
      tool: {module: lead-enrichment.mjs, export: enrichFacts}
      outputs:
        lead_enrichment_packet:
          type: object
      artifacts:
        named_emits: {lead_enrichment_packet: lead_enrichment_packet}
        packets: {lead_enrichment_packet: runx/lead-enrichment.enrichment.v1}
