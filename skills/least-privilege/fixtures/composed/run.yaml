minimum_runx: 0.12.0
catalog:
  visibility: internal
methods:
  run:
    steps:
      - id: evidence
        skill: ../../../receipt-query#read
        inputs:
          question: Review the already selected scope evidence.
          receipt_ids:
            - rcpt_repo_read
          proof:
            verify_chain: true
          receipts:
            - receipt_id: rcpt_repo_read
              skill: code/governed-issue-to-pr
              outcome: completed
              created_at: 2026-07-01T00:00:00Z
              verification_status: verified
          receipt_details:
            - id: rcpt_repo_read
              subject_kind: skill
              subject_uri: code/governed-issue-to-pr
              created_at: 2026-07-01T00:00:00Z
              outcome: completed
              verification:
                status: verified
              authority:
                exercised_scopes:
                  - scope: repo:read
                    source: scope_ref
              acts: []
              decisions: []
      - id: least-privilege
        skill: ../..#from-evidence
        inputs:
          subject: code/governed-issue-to-pr
          granted_scopes:
            - repo:read
          receipt_ids:
            - rcpt_repo_read
          receipt_evidence: $steps.evidence.ledger_answer_packet
      - id: digest
        tool: data.digest
        inputs:
          value: $steps.least-privilege
