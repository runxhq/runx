skill: least-privilege
version: "0.3.10"
catalog:
  owner: runx
  kind: graph
  audience: operator
  visibility: public
  role: canonical
  execution: read
  completion: runtime_receipt
  approval: none
  category: security
runners:
  audit:
    default: true
    inputs:
      subject:
        type: string
        required: false
        description: Exact skill, actor, or grant reference matching the receipt detail; labels alone cannot bind evidence.
      granted_scopes:
        type: json
        required: true
        description: Current scopes granted to the subject.
      receipt_ids:
        type: json
        required: true
        description: Receipt ids whose native detail shows the exercised scopes.
      objective:
        type: string
        required: false
        description: Operator intent focusing the audit.
      receipt_rows:
        type: json
        required: false
        description: Explicit native-projection rows for deterministic replay only.
      receipt_details:
        type: json
        required: false
        description: Explicit native redacted receipt-detail projections for deterministic replay only.
    result_from: [analyze]
    steps:
      - id: evidence
        label: resolve receipt evidence
        skill: ../receipt-query
        runner: read
        inputs:
          question: Resolve the receipts supporting this least-privilege audit.
          receipt_ids: $input.receipt_ids
          proof:
            verify_chain: true
          receipts: $input.receipt_rows
          receipt_details: $input.receipt_details
      - id: analyze
        label: review grant against attributable recorded authority
        inputs:
          subject: $input.subject
          granted_scopes: $input.granted_scopes
          receipt_ids: $input.receipt_ids
          objective: $input.objective
          ledger_evidence: $steps.evidence.ledger_answer_packet
        tool: { module: least-privilege.mjs }
        outputs:
          audit_report:
            type: object
            schema:
              required: [status, subject, evidence, scope_diff, retained_grant, not_recorded_scopes, reviewer_action]
              additionalProperties: false
              properties:
                status: { type: string, enum: [needs_more_evidence, review_required] }
                subject: { type: string, minLength: 1 }
                evidence:
                  type: object
                  required: [receipt_ids, matched_receipt_ids, missing_receipt_ids, missing_detail_ids, invalid_detail_ids, chain_verification, observation_source, limitations]
                  additionalProperties: false
                  properties:
                    receipt_ids: { type: array, items: { type: string }, uniqueItems: true }
                    matched_receipt_ids: { type: array, items: { type: string }, uniqueItems: true }
                    missing_receipt_ids: { type: array, items: { type: string }, uniqueItems: true }
                    missing_detail_ids: { type: array, items: { type: string }, uniqueItems: true }
                    invalid_detail_ids: { type: array, items: { type: string }, uniqueItems: true }
                    chain_verification: { type: object, additionalProperties: true }
                    observation_source: { type: string, enum: [native_receipt_detail, none] }
                    limitations: { type: array, items: { type: string } }
                scope_diff:
                  type: array
                  items:
                    type: object
                    required: [granted_scope, classification, recorded_authority, rationale]
                    additionalProperties: false
                    properties:
                      granted_scope: { type: string }
                      classification: { type: string, enum: [recorded, not_recorded, defer] }
                      recorded_authority:
                        type: object
                        required: [receipt_count, receipt_refs, sources]
                        additionalProperties: false
                        properties:
                          receipt_count: { type: integer, minimum: 0 }
                          receipt_refs: { type: array, items: { type: string }, uniqueItems: true }
                          sources: { type: array, items: { type: string }, uniqueItems: true }
                      rationale: { type: string }
                retained_grant: { type: array, items: { type: string }, uniqueItems: true }
                not_recorded_scopes: { type: array, items: { type: string }, uniqueItems: true }
                reviewer_action: { type: string, enum: [review_policy_and_coverage, gather_verified_evidence] }
          attenuation_proposals: array
          verdict: string
        artifacts:
          wrap_as: least_privilege_packet
          packet: runx.security.least_privilege.v1

harness:
  files: [fixtures/support/composed.graph]
  cases: []
