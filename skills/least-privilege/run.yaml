skill: least-privilege
version: "0.3.3"
catalog:
  kind: graph
  audience: operator
  visibility: public
  role: canonical
  execution: read
  completion: runtime_receipt
  requires_adapter: false
  approval: none
  category: security
runners:
  audit:
    default: true
    inputs:
      subject:
        type: string
        required: false
        description: Skill, grant, or principal being audited.
      granted_scopes:
        type: json
        required: true
        description: Current scopes granted to the subject.
      receipt_ids:
        type: json
        required: true
        description: Receipt ids whose native detail shows the exercised scopes.
      objective:
        type: string
        required: false
        description: Operator intent focusing the audit.
      receipt_rows:
        type: json
        required: false
        description: Explicit native-projection rows for deterministic replay only.
      receipt_details:
        type: json
        required: false
        description: Explicit native redacted receipt-detail projections for deterministic replay only.
    result_from: [analyze]
    steps:
      - id: evidence
        label: resolve receipt evidence
        skill: ../ledger
        runner: read
        inputs:
          question: Resolve the receipts supporting this least-privilege audit.
          receipt_ids: $input.receipt_ids
          proof:
            verify_chain: true
          receipts: $input.receipt_rows
          receipt_details: $input.receipt_details
      - id: analyze
        label: compare grant with receipt-backed usage
        inputs:
          subject: $input.subject
          granted_scopes: $input.granted_scopes
          receipt_ids: $input.receipt_ids
          objective: $input.objective
          ledger_evidence: $steps.evidence.ledger_answer_packet.data
        tool: { module: least-privilege.mjs }
        outputs:
          audit_report:
            type: object
            schema:
              required: [status, subject, evidence, scope_diff, attenuated_grant, removed_scopes, narrowed_scopes, kept_scopes, deferred_scopes, residual_risk, reviewer_action, receipt_expectations]
              additionalProperties: false
              properties:
                status: { type: string, enum: [needs_more_evidence, attenuation_proposed, no_change] }
                subject: { type: string, minLength: 1 }
                evidence:
                  type: object
                  required: [receipt_ids, matched_receipt_ids, missing_receipt_ids, chain_verification, observation_source, grant_source, limitations]
                  additionalProperties: false
                  properties:
                    receipt_ids: { type: array, items: { type: string }, uniqueItems: true }
                    matched_receipt_ids: { type: array, items: { type: string }, uniqueItems: true }
                    missing_receipt_ids: { type: array, items: { type: string }, uniqueItems: true }
                    chain_verification: { type: object, additionalProperties: true }
                    observation_source: { type: string, enum: [native_receipt_detail, none] }
                    grant_source: { type: [string, "null"] }
                    limitations: { type: array, items: { type: string } }
                scope_diff:
                  type: array
                  items:
                    type: object
                    required: [granted_scope, normalized, observed_use, classification, proposal, rationale]
                    properties:
                      granted_scope: { type: string }
                      normalized:
                        type: object
                        required: [verb, resource, conditions]
                        additionalProperties: false
                        properties:
                          verb: { type: [string, "null"] }
                          resource: { type: [string, "null"] }
                          conditions:
                            type: [object, "null"]
                            additionalProperties: true
                      observed_use:
                        type: object
                        required: [count, verbs, resources, receipt_refs, scopes]
                        additionalProperties: false
                        properties:
                          count: { type: integer, minimum: 0 }
                          verbs: { type: array, items: { type: string }, uniqueItems: true }
                          resources: { type: array, items: { type: string }, uniqueItems: true }
                          receipt_refs: { type: array, items: { type: string }, uniqueItems: true }
                          scopes: { type: array, items: { type: string }, uniqueItems: true }
                      classification: { type: string, enum: [keep, narrow, remove, defer] }
                      proposal: { type: [string, "null"] }
                      rationale: { type: string }
                    additionalProperties: false
                attenuated_grant: { type: array, items: { type: string }, uniqueItems: true }
                removed_scopes: { type: array, items: { type: string }, uniqueItems: true }
                narrowed_scopes:
                  type: array
                  items:
                    type: object
                    required: [from, to]
                    properties: { from: { type: string }, to: { type: string } }
                    additionalProperties: false
                kept_scopes: { type: array, items: { type: string }, uniqueItems: true }
                deferred_scopes: { type: array, items: { type: string }, uniqueItems: true }
                residual_risk:
                  type: array
                  maxItems: 100
                  items: { type: string, minLength: 1, maxLength: 4000 }
                reviewer_action: { type: string, enum: [applyable_now, gather_more_receipts, none] }
                receipt_expectations:
                  type: object
                  required: [classification_counts, stop_status, unresolved_questions]
                  properties:
                    classification_counts: { type: object, additionalProperties: { type: integer, minimum: 0 } }
                    stop_status: { type: string }
                    unresolved_questions: { type: array, items: { type: string } }
                  additionalProperties: false
          attenuation_proposals: array
          verdict: string
        artifacts:
          wrap_as: least_privilege_packet
          packet: runx.security.least_privilege.v1
