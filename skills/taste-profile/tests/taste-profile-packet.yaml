name: taste-profile-binds-preferences
method: profile
inputs:
  subject: runx maintainer
  surface: developer-tool product UI
  audience: advanced software builders
  evidence:
    - kind: liked
      content: Dense operational surfaces with visible proof.
    - kind: disliked
      content: Decorative marketing cards that hide the workflow.
host:
  answers:
    synthesize:
      taste_profile_draft:
        decision: ready
        subject: runx maintainer
        applicability:
          surfaces: [developer-tool product UI]
          audience: advanced software builders
          expires_when: [The evidence set changes materially.]
        taste_profile:
          principles:
            - rule: "Make the workflow visible before promotional language."
              source_ids: [source:1]
              confidence: inferred
          likes:
            - rule: "Dense operational surfaces with visible proof."
              source_ids: [source:1]
              confidence: observed
          dislikes:
            - rule: "Decorative marketing cards that hide the workflow."
              source_ids: [source:2]
              confidence: observed
          decision_rules:
            - rule: "Choose operational clarity over decorative flourish."
              source_ids: [source:1, source:2]
              confidence: inferred
          examples_to_emulate: []
          examples_to_avoid: []
        redactions: []
        stop_conditions: [Do not apply this packet outside the declared surface.]
expect:
  status: sealed
  steps: [index, digest, synthesize, finalize]
  step_outputs:
    finalize:
      subset:
        taste_profile_packet:
          decision: ready
          receipt_notes: {authority: context-only, mutation: false}
          validation: {status: pass}
  receipt: {schema: runx.receipt.v1}
