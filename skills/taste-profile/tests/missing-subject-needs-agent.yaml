name: taste-profile-thin-evidence-seals-stop
method: profile
inputs:
  subject: runx maintainer
  evidence:
    - kind: instruction
      content: Keep it clean.
expect:
  status: sealed
  steps: [index, digest, reject]
  step_outputs:
