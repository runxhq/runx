name: taste-profile-thin-evidence-seals-stop
method: profile
inputs:
  subject: runx maintainer
  evidence:
    - kind: liked
      content: A clean release note with one claim.
expect:
  status: sealed
  steps: [index, digest, reject]
  step_outputs:
    reject:
      subset:
        taste_profile_packet:
          decision: needs_more_evidence
          validation: {status: fail}
  receipt: {schema: runx.receipt.v1}
