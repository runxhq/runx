version: "0.2.10"
minimum_runx: 0.12.0
catalog:
  visibility: public
  category: authoring

methods:
  profile:
    inputs:
      subject:
        type: string
        description: Person, team, product, or audience whose taste is modeled.
      evidence:
        type: array
        description: Selected preference records with exact kind, content and optional label. At least two are needed; this run accepts up to 50 selected examples.
        maxItems: 50
        items:
          type: object
          required:
            - kind
            - content
          additionalProperties: false
          properties:
            kind:
              enum:
                - liked
                - disliked
                - correction
                - instruction
            content:
              type: string
              minLength: 1
              maxLength: 20000
            label:
              type: string
              maxLength: 1000
      surface:
        type: string
        description: Surface where the packet applies.
        optional: true
      audience:
        type: string
        description: Intended downstream audience.
        optional: true
      constraints:
        description: Policy, accessibility, legal, or operational boundaries.
        optional: true
    result_from: [reject, finalize]
    examples:
      - subject: Acme product team
        evidence:
          - kind: instruction
            content: Lead with what the reader can do, and cut the adjectives.
          - kind: instruction
            content: Prefer one plain sentence to three clever ones.
    steps:
      - id: index
        inputs:
          subject: $input.subject
          evidence: $input.evidence
        tool: {module: taste-profile.mjs, export: indexEvidence}
        outputs:
          evidence_index: {type: object}

      - id: digest
        tool: data.digest
        inputs:
          value: $steps.index.evidence_index.sources

      - id: reject
        when:
          value: $steps.index.evidence_index.decision
          equals: needs_more_evidence
        inputs:
          subject: $input.subject
          surface: $input.surface
          audience: $input.audience
          evidence_index: $steps.index.evidence_index
          evidence_digest: $steps.digest.digest_result.digest
        tool: {module: taste-profile.mjs, export: finalizeProfile}
        outputs:
          taste_profile_packet:
            type: object
            packet: runx/taste-profile.context.v1

      - id: synthesize
        when:
          value: $steps.index.evidence_index.decision
          equals: ready
        agent: taste-profile-synthesize
        outputs:
          taste_profile_draft:
            type: object
            properties:
              decision:
                type: string
              subject:
                type: string
              applicability:
                type: object
                properties:
                  surfaces:
                    type: array
                    items:
                      type: string
                  audience:
                    type: string
                  expires_when:
                    type: array
                    items:
                      type: string
              taste_profile:
                type: object
                additionalProperties: false
                required: [principles, likes, dislikes, decision_rules, examples_to_emulate, examples_to_avoid]
                properties:
                  principles:
                    type: array
                    maxItems: 100
                    items:
                      type: object
                      additionalProperties: false
                      required: [rule, source_ids, confidence]
                      properties:
                        rule: {type: string, minLength: 1, maxLength: 4000}
                        source_ids:
                          type: array
                          minItems: 1
                          maxItems: 50
                          uniqueItems: true
                          items: {type: string, minLength: 1}
                        confidence: {type: string, enum: [explicit, observed, inferred]}
                  likes:
                    type: array
                    maxItems: 100
                    items:
                      type: object
                      additionalProperties: false
                      required: [rule, source_ids, confidence]
                      properties:
                        rule: {type: string, minLength: 1, maxLength: 4000}
                        source_ids:
                          type: array
                          minItems: 1
                          maxItems: 50
                          uniqueItems: true
                          items: {type: string, minLength: 1}
                        confidence: {type: string, enum: [explicit, observed, inferred]}
                  dislikes:
                    type: array
                    maxItems: 100
                    items:
                      type: object
                      additionalProperties: false
                      required: [rule, source_ids, confidence]
                      properties:
                        rule: {type: string, minLength: 1, maxLength: 4000}
                        source_ids:
                          type: array
                          minItems: 1
                          maxItems: 50
                          uniqueItems: true
                          items: {type: string, minLength: 1}
                        confidence: {type: string, enum: [explicit, observed, inferred]}
                  decision_rules:
                    type: array
                    maxItems: 100
                    items:
                      type: object
                      additionalProperties: false
                      required: [rule, source_ids, confidence]
                      properties:
                        rule: {type: string, minLength: 1, maxLength: 4000}
                        source_ids:
                          type: array
                          minItems: 1
                          maxItems: 50
                          uniqueItems: true
                          items: {type: string, minLength: 1}
                        confidence: {type: string, enum: [explicit, observed, inferred]}
                  examples_to_emulate:
                    type: array
                    maxItems: 100
                    items:
                      type: object
                      additionalProperties: false
                      required: [rule, source_ids, confidence]
                      properties:
                        rule: {type: string, minLength: 1, maxLength: 4000}
                        source_ids:
                          type: array
                          minItems: 1
                          maxItems: 50
                          uniqueItems: true
                          items: {type: string, minLength: 1}
                        confidence: {type: string, enum: [explicit, observed, inferred]}
                  examples_to_avoid:
                    type: array
                    maxItems: 100
                    items:
                      type: object
                      additionalProperties: false
                      required: [rule, source_ids, confidence]
                      properties:
                        rule: {type: string, minLength: 1, maxLength: 4000}
                        source_ids:
                          type: array
                          minItems: 1
                          maxItems: 50
                          uniqueItems: true
                          items: {type: string, minLength: 1}
                        confidence: {type: string, enum: [explicit, observed, inferred]}
              redactions:
                type: array
              stop_conditions:
                type: array
                items:
                  type: string
            required:
              - decision
            if:
              properties:
                decision:
                  pattern: ^ready
            then:
              required:
                - subject
                - applicability
                - taste_profile
                - redactions
                - stop_conditions
        inputs:
          subject: $input.subject
          surface: $input.surface
          audience: $input.audience
          constraints: $input.constraints
          evidence_index: $steps.index.evidence_index
          evidence_digest: $steps.digest.digest_result.digest
          evidence: $input.evidence

      - id: finalize
        when:
          value: $steps.index.evidence_index.decision
          equals: ready
        inputs:
          subject: $input.subject
          surface: $input.surface
          audience: $input.audience
          evidence_index: $steps.index.evidence_index
          evidence_digest: $steps.digest.digest_result.digest
          taste_profile_draft: $steps.synthesize.taste_profile_draft
        tool: {module: taste-profile.mjs, export: finalizeProfile}
        outputs:
          taste_profile_packet: {type: object, packet: runx/taste-profile.context.v1}
