skill: taste-profile
version: "0.2.3"

catalog:
  kind: graph
  audience: public
  visibility: public
  role: context
  execution: read
  completion: runtime_receipt
  approval: none
  category: authoring

runners:
  profile:
    default: true
    inputs:
      subject:
        type: string
        required: true
        description: Person, team, product, or audience whose taste is modeled.
      evidence:
        type: json
        required: true
        description: At least two bounded typed preference examples.
      surface:
        type: string
        required: false
        description: Surface where the packet applies.
      audience:
        type: string
        required: false
        description: Intended downstream audience.
      constraints:
        type: json
        required: false
        description: Policy, accessibility, legal, or operational boundaries.
    result_from: [reject, finalize]
    steps:
      - id: index
        inputs:
          subject: $input.subject
          evidence: $input.evidence
        tool: { module: taste-profile.mjs, export: indexEvidence }
        outputs:
          evidence_index: object
        artifacts:
          named_emits:
            evidence_index: evidence_index

      - id: digest
        tool: data.digest
        inputs:
          value: $steps.index.evidence_index.sources

      - id: reject
        when:
          value: $steps.index.evidence_index.decision
          equals: needs_more_evidence
        inputs:
          subject: $input.subject
          surface: $input.surface
          audience: $input.audience
          evidence_index: $steps.index.evidence_index
          evidence_digest: $steps.digest.digest_result.digest
        tool: { module: taste-profile.mjs, export: finalizeProfile }
        outputs:
          taste_profile_packet:
            type: object
            schema:
              required: [decision, subject, applicability, taste_profile, evidence, redactions, stop_conditions, receipt_notes, validation]
              additionalProperties: false
              properties:
                decision: { type: string, enum: [ready, needs_more_evidence] }
                subject: { type: string, maxLength: 1000 }
                applicability:
                  type: object
                  required: [surfaces, audience, expires_when]
                  additionalProperties: false
                  properties:
                    surfaces: { type: array, maxItems: 50, uniqueItems: true, items: { type: string, minLength: 1, maxLength: 500 } }
                    audience: { type: string, maxLength: 1000 }
                    expires_when: { type: array, maxItems: 100, items: { type: string, minLength: 1, maxLength: 2000 } }
                taste_profile:
                  type: object
                  required: [principles, likes, dislikes, decision_rules, examples_to_emulate, examples_to_avoid]
                  additionalProperties: false
                  properties:
                    principles: { type: array, maxItems: 100, items: { type: string, minLength: 1, maxLength: 2000 } }
                    likes: { type: array, maxItems: 200, items: { type: string, minLength: 1, maxLength: 2000 } }
                    dislikes: { type: array, maxItems: 200, items: { type: string, minLength: 1, maxLength: 2000 } }
                    decision_rules: { type: array, maxItems: 100, items: { type: string, minLength: 1, maxLength: 2000 } }
                    examples_to_emulate: { type: array, maxItems: 100, items: { type: string, minLength: 1, maxLength: 4000 } }
                    examples_to_avoid: { type: array, maxItems: 100, items: { type: string, minLength: 1, maxLength: 4000 } }
                evidence:
                  type: object
                  required: [evidence_digest, sources, bindings]
                  additionalProperties: false
                  properties:
                    evidence_digest: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
                    sources:
                      type: array
                      maxItems: 50
                      items:
                        type: object
                        required: [source_ref, kind, label]
                        additionalProperties: false
                        properties:
                          source_ref: { type: string, pattern: '^source:[1-9][0-9]*$' }
                          kind: { type: string, enum: [liked, disliked, correction, instruction] }
                          label: { type: string, maxLength: 1000 }
                    bindings:
                      type: array
                      maxItems: 400
                      items:
                        type: object
                        required: [rule, source_refs, confidence]
                        additionalProperties: false
                        properties:
                          rule: { type: string, minLength: 1, maxLength: 4000 }
                          source_refs: { type: array, minItems: 1, maxItems: 50, uniqueItems: true, items: { type: string, pattern: '^source:[1-9][0-9]*$' } }
                          confidence: { type: string, enum: [explicit, observed, inferred] }
                redactions: { type: array, maxItems: 100, items: { type: string, minLength: 1, maxLength: 2000 } }
                stop_conditions: { type: array, maxItems: 100, items: { type: string, minLength: 1, maxLength: 2000 } }
                receipt_notes:
                  type: object
                  required: [authority, mutation]
                  additionalProperties: false
                  properties:
                    authority: { const: context-only }
                    mutation: { const: false }
                validation:
                  type: object
                  required: [status, findings]
                  additionalProperties: false
                  properties:
                    status: { type: string, enum: [pass, fail] }
                    findings:
                      type: array
                      maxItems: 250
                      items:
                        type: object
                        required: [code, message]
                        additionalProperties: false
                        properties:
                          code: { type: string, minLength: 1, maxLength: 200 }
                          message: { type: string, minLength: 1, maxLength: 4000 }
        artifacts:
          named_emits:
            taste_profile_packet: taste_profile_packet
          packets:
            taste_profile_packet: runx.context.taste_profile.v1

      - id: synthesize
        when:
          value: $steps.index.evidence_index.decision
          equals: ready
        agent: { role: curator, task: taste-profile-synthesize }
        outputs:
          taste_profile_draft: object
        inputs:
          subject: $input.subject
          surface: $input.surface
          audience: $input.audience
          constraints: $input.constraints
          evidence_index: $steps.index.evidence_index
          evidence_digest: $steps.digest.digest_result.digest
          evidence: $input.evidence
        artifacts:
          named_emits:
            taste_profile_draft: taste_profile_draft

      - id: finalize
        when:
          value: $steps.index.evidence_index.decision
          equals: ready
        inputs:
          subject: $input.subject
          surface: $input.surface
          audience: $input.audience
          evidence_index: $steps.index.evidence_index
          evidence_digest: $steps.digest.digest_result.digest
          taste_profile_draft: $steps.synthesize.taste_profile_draft
        tool: { module: taste-profile.mjs, export: finalizeProfile }
        outputs:
          taste_profile_packet: object
        artifacts:
          named_emits:
            taste_profile_packet: taste_profile_packet
          packets:
            taste_profile_packet: runx.context.taste_profile.v1

harness:
  files: [fixtures/support/forward-writing-context.graph]
  cases: []
