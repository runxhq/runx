name: vuln-disclosure-default-publishes-and-verifies-advisory
kind: skill
target: ..
operator_journeys:
  - mode: standalone
    confusors: [vuln-triage, cve-audit]
    request: Publish this validated vulnerability advisory to the exact configured security channel.
    expected_outcome: Review the evidence-bound advisory, publish the approved payload once, and return independent provider readback.
inputs:
  advisory_packet:
    schema: runx.security.vulnerability_advisory.v1
    decision: ready_for_review
    target: example/service
    advisory_draft:
      title: Example dependency advisory
      summary: A verified dependency finding requires an upgrade.
      body: example/service includes example-lib 1.2.3, affected by GHSA-example-1234.
      affected_advisory_ids: [GHSA-example-1234]
    disclosure_checklist: [confirm fixed version]
    source_advisories:
      - { advisory_id: GHSA-example-1234, dependency: example-lib, exact_version: 1.2.3 }
    remediation_plan: { immediate: [upgrade example-lib] }
    evidence_binding:
      receipt_ref: runx:receipt:sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      evidence_digest: sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
    validation: { status: pass, findings: [] }
    publication_status: not_published
  channel: github_security_advisory
  target: { locator: runxhq/example }
  provider: github
  idempotency_key: vuln-disclosure-example-001
caller:
  answers:
    review:
      disclosure_review_draft:
        decision: ready_for_approval
        rationale: The source packet is verified, the target is exact, and a remediation is available.
        affected_advisory_ids: [GHSA-example-1234]
        checklist: [confirm provider approval, verify provider readback]
  provider_responses:
    principal_id: security-publisher-fixture
    grant:
        grant_id: vuln-disclosure-fixture
        provider: github
        scopes: [advisory.publish, advisory.read]
    operations:
      - operation: advisory.publish
        target: runxhq/example
        access: mutate
        result:
          advisory_ref: github:runxhq/example/security-advisories/GHSA-example-1234
          payload_digest: sha256:ffbfa74bacc06d2eb87da944c16d6827723a80508c52b2a8f6bdd5c077e56490
      - operation: advisory.read
        target: github:runxhq/example/security-advisories/GHSA-example-1234
        access: read
        result:
          advisory_ref: github:runxhq/example/security-advisories/GHSA-example-1234
          payload_digest: sha256:ffbfa74bacc06d2eb87da944c16d6827723a80508c52b2a8f6bdd5c077e56490
          status: published
  approvals:
    "publish#publish": true
expect:
  status: sealed
  steps: [prepare, publish]
  receipt: { schema: runx.receipt.v1, state: sealed, disposition: closed }
metadata: { public_skill: vuln-disclosure, source_case: direct-default-success, source: skills-fixture }
