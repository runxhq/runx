name: vuln-disclosure-default-requires-publication-binding
kind: skill
target: ..
operator_journeys:
  - mode: refusal
    confusors: [vuln-triage, cve-audit]
    request: Publish this advisory without configuring a compatible security-publication binding.
    expected_outcome: Refuse at the publication boundary without claiming an advisory was published.
inputs:
  advisory_packet:
    schema: runx.security.vulnerability_advisory.v1
    decision: ready_for_review
    target: example/service
    advisory_draft:
      title: Example dependency advisory
      summary: A verified dependency finding requires an upgrade.
      body: example/service includes example-lib 1.2.3, affected by GHSA-example-1234.
      affected_advisory_ids: [GHSA-example-1234]
    disclosure_checklist: [confirm fixed version]
    source_advisories:
      - { advisory_id: GHSA-example-1234, dependency: example-lib, exact_version: 1.2.3 }
    remediation_plan: { immediate: [upgrade example-lib] }
    evidence_binding:
      receipt_ref: runx:receipt:sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      evidence_digest: sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
    validation: { status: pass, findings: [] }
    publication_status: not_published
  channel: github_security_advisory
  target: { locator: runxhq/example }
  provider: github
  idempotency_key: vuln-disclosure-example-001
caller:
  answers:
    review:
      disclosure_review_draft:
        decision: ready_for_approval
        rationale: The source packet is verified, the target is exact, and a remediation is available.
        affected_advisory_ids: [GHSA-example-1234]
        checklist: [confirm provider approval, verify provider readback]
expect:
  status: policy_denied
metadata:
  public_skill: vuln-disclosure
  source_case: direct-default-preflight
  source: skills-fixture
