name: prepare-disclosure-outbox
kind: skill
target: ..
runner: vuln-disclosure
operator_journeys:
  - mode: standalone
    confusors: [vuln-triage, cve-audit]
    request: Prepare this verified vulnerability for coordinated GitHub Security Advisory publication.
    expected_outcome: Return an exact evidence-bound advisory and publication handoff without claiming publication.
  - mode: composed
    request: Continue disclosure from this completed vulnerability triage and remediation packet.
    expected_outcome: Reuse advisory identity, evidence, coordination, and remediation state without repeating triage or publishing twice.
    prior_evidence:
      - The advisory packet, target, coordination status, and remediation status supplied in the fixture.
    must_not_repeat:
      - Do not rerun vulnerability triage.
      - Do not publish or retry publication without exact approval and readback.
inputs:
  channel: github_security_advisory
  target:
    locator: github:runxhq/example:security-advisories
  disclosure_context:
    coordination_status: maintainer_notified
    remediation_status: fix_available
  advisory_packet:
    schema: runx.security.vulnerability_advisory.v1
    decision: ready_for_review
    target: example/service
    advisory_draft:
      title: Example dependency advisory
      summary: A verified dependency finding requires an upgrade.
      body: example/service includes example-lib 1.2.3, affected by GHSA-example-1234.
      affected_advisory_ids:
        - GHSA-example-1234
    disclosure_checklist:
      - confirm fixed version
    source_advisories:
      - advisory_id: GHSA-example-1234
        dependency: example-lib
        exact_version: 1.2.3
    remediation_plan:
      immediate:
        - upgrade example-lib
    evidence_binding:
      receipt_ref: runx:receipt:sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      evidence_digest: sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
    validation:
      status: pass
      findings: []
    publication_status: not_published
caller:
  answers:
    agent.vuln-disclosure-review.output:
      disclosure_review_draft:
        decision: ready_for_approval
        rationale: The source packet is verified, the target is exact, and a remediation is available.
        affected_advisory_ids:
          - GHSA-example-1234
        checklist:
          - confirm provider approval
          - verify provider readback
expect:
  status: sealed
  steps: [admit, digest-payload, review, finalize]
  step_outputs:
    finalize:
      subset:
        disclosure_packet:
          data:
            decision: ready_for_publication_approval
            validation:
              status: pass
            approval_status: not_requested
            publication_status: not_published
            provider_status: not_called
  receipt:
    schema: runx.receipt.v1
metadata:
  public_skill: vuln-disclosure
  source_case: prepare-disclosure-outbox
  source: skills-fixture
