skill: vuln-disclosure
version: "0.4.4"

catalog:
  kind: graph
  audience: public
  visibility: public
  role: canonical
  runtime_path: advisory-publication
  execution: execute
  completion: provider_readback
  requires_adapter: true
  approval: required
  category: security

connectors:
  advisory:
    operations: [advisory.publish, advisory.read]
    connector_from: $input.provider
    allowed_connectors: [github]
runners:
  disclose:
    default: true
    inputs:
      advisory_packet:
        type: json
        packet: runx.security.vulnerability_advisory.v1
        required: true
      channel:
        type: string
        required: true
      target:
        type: object
        required: true
        schema:
          required: [locator]
          properties:
            locator: { type: string, minLength: 1, maxLength: 1000 }
      disclosure_context:
        type: json
        required: false
      provider:
        type: string
        required: true
        description: Configured publication provider expected to publish and read the advisory.
      idempotency_key:
        type: string
        required: true
        description: Stable retry key for this exact publication.
    result_from: [publish]
    steps:
      - id: prepare
        skill: .
        runner: vuln-disclosure
        inputs:
          advisory_packet: $input.advisory_packet
          channel: $input.channel
          target: $input.target
          disclosure_context: $input.disclosure_context
      - id: publish
        when:
          field: prepare.disclosure_packet.data.decision
          equals: ready_for_publication_approval
        skill: .
        runner: publish
        inputs:
          provider: $input.provider
          idempotency_key: $input.idempotency_key
        context:
          disclosure_packet: prepare.disclosure_packet.data

  vuln-disclosure:
    inputs:
      advisory_packet:
        type: json
        packet: runx.security.vulnerability_advisory.v1
        required: true
        description: Validated runx.security.vulnerability_advisory.v1 packet.
      channel:
        type: string
        required: true
        description: Intended publication channel.
      target:
        type: object
        required: true
        description: Exact downstream target with a locator.
        schema:
          required: [locator]
          properties:
            locator: { type: string, minLength: 1, maxLength: 1000 }
      disclosure_context:
        type: json
        required: false
        description: Embargo, coordination, remediation, or timing constraints.
    examples:
      - channel: github_security_advisory
        target: { locator: github:runxhq/example:security-advisories }
        disclosure_context: { coordination_status: maintainer_notified, remediation_status: fix_available }
        advisory_packet:
          schema: runx.security.vulnerability_advisory.v1
          decision: ready_for_review
          target: example/service
          advisory_draft:
            title: Example dependency advisory
            summary: A verified dependency finding requires an upgrade.
            body: example/service includes example-lib 1.2.3, affected by GHSA-example-1234.
            affected_advisory_ids: [GHSA-example-1234]
          disclosure_checklist: [confirm fixed version]
          source_advisories:
            - { advisory_id: GHSA-example-1234, dependency: example-lib, exact_version: 1.2.3 }
          remediation_plan: { immediate: [upgrade example-lib] }
          evidence_binding:
            receipt_ref: runx:receipt:sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
            evidence_digest: sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          validation: { status: pass, findings: [] }
          publication_status: not_published
    result_from: [finalize, stop]
    steps:
      - id: admit
        inputs:
          advisory_packet: $input.advisory_packet
          channel: $input.channel
          target: $input.target
          disclosure_context: $input.disclosure_context
        tool: { module: vuln-disclosure.mjs, export: admitDisclosure }
        outputs:
          disclosure_context: object
        artifacts:
          named_emits:
            disclosure_context: disclosure_context

      - id: digest-payload
        tool: data.digest
        context:
          value: admit.disclosure_context.data.payload

      - id: review
        when:
          field: admit.disclosure_context.data.path
          equals: review
        agent: { role: reviewer, task: vuln-disclosure-review }
        outputs:
          disclosure_review_draft: object
        context:
          disclosure_context: admit.disclosure_context.data
        artifacts:
          named_emits:
            disclosure_review_draft: disclosure_review_draft

      - id: finalize
        when:
          field: admit.disclosure_context.data.path
          equals: review
        context:
          disclosure_context: admit.disclosure_context.data
          payload_digest: digest-payload.digest_result.data.digest
          disclosure_review_draft: review.disclosure_review_draft.data
        tool: { module: vuln-disclosure.mjs, export: finalizeDisclosure }
        outputs:
          disclosure_packet:
            type: object
            schema:
              required: [schema, decision, channel, target, payload, payload_digest, review, remediation_plan, evidence_binding, validation, approval_status, publication_status, provider_status, next_action]
              additionalProperties: false
              properties:
                schema: { const: runx.security.vulnerability_disclosure.v1 }
                decision: { type: string, enum: [ready_for_publication_approval, hold, needs_more_evidence, needs_agent, needs_verified_evidence] }
                channel: { type: string, maxLength: 100 }
                target:
                  type: object
                  required: [locator]
                  maxProperties: 20
                  properties:
                    locator: { type: string, maxLength: 1000 }
                payload:
                  type: object
                  required: [title, summary, body, affected_advisory_ids]
                  additionalProperties: false
                  properties:
                    title: { type: string, maxLength: 500 }
                    summary: { type: string, maxLength: 2000 }
                    body: { type: string, maxLength: 20000 }
                    affected_advisory_ids: { type: array, maxItems: 500, uniqueItems: true, items: { type: string, minLength: 1, maxLength: 1000 } }
                payload_digest: { type: string, pattern: '^(?:sha256:[0-9a-f]{64})?$' }
                review:
                  type: object
                  additionalProperties: false
                  properties:
                    rationale: { type: string, minLength: 1, maxLength: 4000 }
                    checklist: { type: array, maxItems: 100, items: { type: string, minLength: 1, maxLength: 1000 } }
                    affected_advisory_ids: { type: array, maxItems: 500, uniqueItems: true, items: { type: string, minLength: 1, maxLength: 1000 } }
                remediation_plan:
                  type: object
                  maxProperties: 50
                  propertyNames: { minLength: 1, maxLength: 200 }
                evidence_binding:
                  type: object
                  maxProperties: 20
                  properties:
                    receipt_ref: { type: string, minLength: 1, maxLength: 2048 }
                    evidence_digest: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
                validation:
                  type: object
                  required: [status, findings]
                  additionalProperties: false
                  properties:
                    status: { type: string, enum: [pass, fail] }
                    findings:
                      type: array
                      maxItems: 500
                      items:
                        type: object
                        required: [code, message]
                        additionalProperties: false
                        properties:
                          code: { type: string, minLength: 1, maxLength: 200 }
                          message: { type: string, minLength: 1, maxLength: 4000 }
                approval_status: { const: not_requested }
                publication_status: { const: not_published }
                provider_status: { const: not_called }
                next_action: { type: string, minLength: 1, maxLength: 4000 }
        artifacts:
          named_emits:
            disclosure_packet: disclosure_packet
          packets:
            disclosure_packet: runx.security.vulnerability_disclosure.v1

      - id: stop
        when:
          field: admit.disclosure_context.data.path
          equals: stop
        context:
          disclosure_context: admit.disclosure_context.data
          payload_digest: digest-payload.digest_result.data.digest
        tool: { module: vuln-disclosure.mjs, export: finalizeDisclosure }
        outputs:
          disclosure_packet: object
        artifacts:
          named_emits:
            disclosure_packet: disclosure_packet
          packets:
            disclosure_packet: runx.security.vulnerability_disclosure.v1

  publish:
    inputs:
      disclosure_packet:
        type: json
        packet: runx.security.vulnerability_disclosure.v1
        required: true
        description: Exact validated runx.security.vulnerability_disclosure.v1 packet.
      provider:
        type: string
        required: true
        description: Expected configured publication provider name.
      idempotency_key:
        type: string
        required: true
        description: Stable retry key for this exact advisory publication.
    examples:
      - disclosure_packet:
          schema: runx.security.vulnerability_disclosure.v1
          decision: ready_for_publication_approval
          channel: github_security_advisory
          target: { locator: github:runxhq/example:security-advisories }
          payload:
            title: Example dependency advisory
            summary: A verified dependency finding requires an upgrade.
            body: example/service includes example-lib 1.2.3, affected by GHSA-example-1234.
            affected_advisory_ids: [GHSA-example-1234]
          payload_digest: sha256:ffbfa74bacc06d2eb87da944c16d6827723a80508c52b2a8f6bdd5c077e56490
          review:
            rationale: The evidence is verified and a fix is available.
            checklist: [confirm fixed version]
            affected_advisory_ids: [GHSA-example-1234]
          remediation_plan: { immediate: [upgrade example-lib] }
          evidence_binding:
            receipt_ref: runx:receipt:sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
            evidence_digest: sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          validation: { status: pass, findings: [] }
          approval_status: not_requested
          publication_status: not_published
          provider_status: not_called
          next_action: route through an approved provider publication adapter
        provider: github
        idempotency_key: advisory-advisory-001
    result_from: [readback]
    steps:
      - id: validate
        tool: data.compare
        inputs:
          actual:
            decision: $input.disclosure_packet.decision
            validation_status: $input.disclosure_packet.validation.status
            approval_status: $input.disclosure_packet.approval_status
            publication_status: $input.disclosure_packet.publication_status
            provider_status: $input.disclosure_packet.provider_status
          expected:
            decision: ready_for_publication_approval
            validation_status: pass
            approval_status: not_requested
            publication_status: not_published
            provider_status: not_called

      - id: digest-payload
        when:
          field: validate.comparison.data.equal
          equals: true
        tool: data.digest
        inputs:
          value: $input.disclosure_packet.payload

      - id: bind-payload
        when:
          field: validate.comparison.data.equal
          equals: true
        tool: data.compare
        inputs:
          expected: $input.disclosure_packet.payload_digest
        context:
          actual: digest-payload.digest_result.data.digest

      - id: publish
        when:
          field: bind-payload.comparison.data.equal
          equals: true
        operation: advisory/advisory.publish
        idempotency_key: $input.idempotency_key
        approval:
          reason: Approve publishing this exact vulnerability advisory.
          type: vulnerability_disclosure
        expected_result:
          payload_digest: $input.disclosure_packet.payload_digest
        result_fields: [advisory_ref, payload_digest]
        input:
          channel: $input.disclosure_packet.channel
          target: $input.disclosure_packet.target
          payload: $input.disclosure_packet.payload
          payload_digest: $input.disclosure_packet.payload_digest
          evidence_binding: $input.disclosure_packet.evidence_binding

      - id: readback
        when:
          field: bind-payload.comparison.data.equal
          equals: true
        operation: advisory/advisory.read
        result_fields: [advisory_ref, payload_digest, status]
        context:
          expected_result: publish.provider_operation.data.result
          input: publish.provider_operation.data.result
