version: "0.2.14"
minimum_runx: 0.12.0
catalog:
  visibility: public
  category: ops
methods:
  code-plan-agent:
    inputs:
      objective:
        type: string
        description: Build or automation objective to decompose.
      project_context:
        type: string
        description: Repository, product, and operator constraints.
        optional: true
      thread_locator:
        type: string
        description: Canonical locator for the bounded source thread.
        optional: true
      thread:
        type: object
        description: Portable source thread when the objective came from an existing conversation.
        additionalProperties: true
        optional: true
      change_set:
        type: object
        description: Parent change artifact from code-intake or a workspace supervisor.
        required:
          - change_set_id
          - target_surfaces
          - shared_invariants
          - success_criteria
        properties:
          change_set_id:
            type: string
            minLength: 1
            maxLength: 256
          action_decision:
            type: string
            enum:
              - proceed_to_plan
              - needs_clarification
              - hold
          commence_decision:
            type: string
            enum:
              - approve
              - hold
          thread_locator:
            type: string
            minLength: 1
            maxLength: 2048
          summary: {type: string}
          category: {type: string}
          severity: {type: string}
          recommended_lane: {type: string}
          source_digest: {type: string}
          target_surfaces:
            type: array
            maxItems: 100
            items:
              type: object
              required: [surface, kind, mutating, rationale]
              properties:
                surface: {type: string, minLength: 1}
                kind: {type: string}
                mutating: {type: boolean}
                rationale: {type: string}
              additionalProperties: true
          shared_invariants:
            type: array
            maxItems: 100
            items:
              type: string
              minLength: 1
              maxLength: 4000
          success_criteria:
            type: array
            maxItems: 100
            items:
              type: string
              minLength: 1
              maxLength: 4000
        additionalProperties: true
        optional: true
      run_context:
        type: object
        description: Optional captured control context to pass through unchanged.
        additionalProperties: true
        optional: true
      repo_root:
        type: string
        default: .
        description: Workspace root used for native skill-catalog inspection.
        optional: true
    result_from:
      - validate
    examples:
      - objective: Add rate limiting to the public search endpoint without changing its response shape.
    steps:
      - id: inspect
        tool: runx.skill.inspect
        inputs:
          repo_root: $input.repo_root
      - id: draft
        agent: code-plan-draft
        outputs:
          work_plan_draft:
            type: object
            properties:
              decision:
                type: string
              plan_kind:
                type: string
              change_set:
                type: object
                properties:
                  change_set_id:
                    type: string
                  thread_locator:
                    type: string
                  summary:
                    type: string
                  category:
                    type: string
                  severity:
                    type: string
                  recommended_lane:
                    type: string
                  commence_decision:
                    type: string
                  action_decision:
                    type: string
                  target_surfaces:
                    type: array
                    items:
                      type: object
                      properties:
                        surface:
                          type: string
                        kind:
                          type: string
                        mutating:
                          type: boolean
                        rationale:
                          type: string
                  shared_invariants:
                    type: array
                    items:
                      type: string
                  success_criteria:
                    type: array
                    items:
                      type: string
              objective_summary:
                type: string
              workspace_change_plan:
                type: object
                properties:
                  plan_id:
                    type: string
                  change_set_id:
                    type: string
                  objective_summary:
                    type: string
                  shared_invariants:
                    type: array
                    items:
                      type: string
                  success_criteria:
                    type: array
                    items:
                      type: string
                  phases:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          pattern: ^[a-z0-9][a-z0-9-]*$
                        name:
                          type: string
                        depends_on:
                          type: array
                          items:
                            type: string
                        parallelizable:
                          type: boolean
                        repo_change_requests:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: string
                                pattern: ^[a-z0-9][a-z0-9-]*$
                              repo:
                                type: string
                              task_id:
                                type: string
                              objective:
                                type: string
                              depends_on:
                                type: array
                                items:
                                  type: string
                              shared_context_paths:
                                type: array
                                items:
                                  type: string
                              validation_commands:
                                type: array
                                items:
                                  type: string
                              mutating:
                                type: boolean
                  integration_checks:
                    type: array
                    items:
                      type: string
                  open_questions:
                    type: array
              orchestration_steps:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      pattern: ^[a-z0-9][a-z0-9-]*$
                    skill:
                      type: string
                    scopes:
                      type: array
                      items:
                        type: string
                    mutating:
                      type: boolean
                    inputs:
                      type: object
                      properties:
                        target_repo:
                          type: string
                    context_from:
                      type: array
                      description: Plan references rooted at input, change_set, thread or an earlier orchestration step id, optionally followed by a field path. These are plan dependencies, not turn locators.
                      items:
                        type: string
                    description:
                      type: string
              required_skills:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                    exists:
                      type: boolean
              open_questions:
                type: array
            required:
              - decision
            if:
              properties:
                decision:
                  pattern: ^ready
            then:
              required:
                - plan_kind
                - change_set
                - objective_summary
                - workspace_change_plan
                - orchestration_steps
                - required_skills
                - open_questions
        inputs:
          objective: $input.objective
          project_context: $input.project_context
          thread_locator: $input.thread_locator
          thread: $input.thread
          change_set: $input.change_set
          catalog_skills: $steps.inspect.authoring_context.catalog_skills
          run_context: $input.run_context
          repo_root: $input.repo_root
      - id: validate
        inputs:
          objective: $input.objective
          thread_locator: $input.thread_locator
          thread: $input.thread
          project_context: $input.project_context
          change_set: $input.change_set
          run_context: $input.run_context
          work_plan_draft: $steps.draft.work_plan_draft
          catalog_skills: $steps.inspect.authoring_context.catalog_skills
        tool:
          module: code-plan.mjs
        outputs:
          decision: {type: string}
          plan_kind: {type: string}
          change_set: {type: object}
          run_context: {type: object}
          objective_summary: {type: string}
          workspace_change_plan: {type: object}
          orchestration_steps: {type: array}
          required_skills: {type: array}
          open_questions: {type: array}
          evidence: {type: object}
          validation: {type: object}
          work_plan: {packet: runx/code-plan.work_plan.v1}
        result_as: work_plan
