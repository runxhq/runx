skill: data-store
version: "0.4.4"

catalog:
  kind: skill
  audience: public
  visibility: public
  role: canonical
  execution: execute
  completion: runtime_receipt
  approval: none
  category: data

connectors:
  store:
    operations: [events.append, events.read, projection.read, heads.list]

runners:
  append_event:
    inputs:
      data_source_ref:
        type: string
        required: true
        description: The logical source inside the workspace's store.
      resource:
        type: string
        required: true
        description: Declared event resource or stream family.
      aggregate_id:
        type: string
        required: true
        description: Event stream or partition key.
      expected_version:
        type: number
        required: true
        description: Current stream version required before append.
      idempotency_key:
        type: string
        required: true
        description: Stable retry key for this event.
      event:
        type: json
        required: true
        description: Domain event or transition packet to append.
      observed_at:
        type: string
        required: false
        description: Caller-observed RFC 3339 commit time; defaults to the time of the append.
    result_from: [append]
    steps:
      - id: store-append
        operation: store/events.append
        idempotency_key: $input.idempotency_key
        input:
          data_source_ref: $input.data_source_ref
          resource: $input.resource
          aggregate_id: $input.aggregate_id
          expected_version: $input.expected_version
          event: $input.event
          observed_at: $input.observed_at
      - id: append
        inputs:
          result: $steps.store-append.provider_operation.result
        tool: { module: data-store.mjs, export: dataOperationResult }
        artifacts:
          wrap_as: data_operation_result
          packet: runx.data.operation_result.v1

  read_events:
    inputs:
      data_source_ref:
        type: string
        required: true
        description: The logical source inside the workspace's store.
      resource:
        type: string
        required: true
        description: Declared event resource or stream family.
      aggregate_id:
        type: string
        required: true
        description: Event stream or partition key.
      limit:
        type: number
        required: false
        default: 50
        description: Maximum events to return.
      after_version:
        type: number
        required: false
        description: When present, return the next ascending page strictly after this stream version; omission reads the latest page.
    result_from: [read]
    steps:
      - id: store-read
        operation: store/events.read
        input:
          data_source_ref: $input.data_source_ref
          resource: $input.resource
          aggregate_id: $input.aggregate_id
          limit: $input.limit
          after_version: $input.after_version
      - id: read
        inputs:
          result: $steps.store-read.provider_operation.result
        tool: { module: data-store.mjs, export: dataOperationResult }
        artifacts:
          wrap_as: data_operation_result
          packet: runx.data.operation_result.v1

  read_projection:
    inputs:
      data_source_ref:
        type: string
        required: true
        description: The logical source inside the workspace's store.
      resource:
        type: string
        required: true
        description: Declared event resource or stream family.
      aggregate_id:
        type: string
        required: true
        description: Event stream or partition key.
    result_from: [read]
    steps:
      - id: store-read
        operation: store/projection.read
        input:
          data_source_ref: $input.data_source_ref
          resource: $input.resource
          aggregate_id: $input.aggregate_id
      - id: read
        inputs:
          result: $steps.store-read.provider_operation.result
        tool: { module: data-store.mjs, export: dataOperationResult }
        artifacts:
          wrap_as: data_operation_result
          packet: runx.data.operation_result.v1

  list_stream_heads:
    inputs:
      data_source_ref:
        type: string
        required: true
        description: The logical source inside the workspace's store.
      resource:
        type: string
        required: true
        description: Declared event resource whose latest stream events are listed.
      event_types:
        type: json
        required: false
        description: Optional array of at most 20 exact latest event types.
      limit:
        type: number
        required: false
        default: 50
        description: Maximum stream heads to return, capped at 100.
      cursor:
        type: string
        required: false
        description: Opaque cursor returned by the previous page.
    result_from: [read]
    steps:
      - id: store-read
        operation: store/heads.list
        input:
          data_source_ref: $input.data_source_ref
          resource: $input.resource
          event_types: $input.event_types
          limit: $input.limit
          cursor: $input.cursor
      - id: read
        inputs:
          result: $steps.store-read.provider_operation.result
        tool: { module: data-store.mjs, export: dataOperationResult }
        artifacts:
          wrap_as: data_operation_result
          packet: runx.data.operation_result.v1

  append_and_readback:
    default: true
    inputs:
      data_source_ref:
        type: string
        required: true
        description: The logical source inside the workspace's store.
      resource:
        type: string
        required: true
        description: Declared event resource or stream family.
      aggregate_id:
        type: string
        required: true
        description: Event stream or partition key.
      expected_version:
        type: number
        required: true
        description: Current stream version required before append.
      idempotency_key:
        type: string
        required: true
        description: Stable retry key for this event.
      event:
        type: json
        required: true
        description: Domain event or transition packet to append.
      observed_at:
        type: string
        required: false
        description: Caller-observed RFC 3339 commit time; defaults to the time of the append.
    result_from: [append, readback]
    steps:
      - id: store-append
        operation: store/events.append
        idempotency_key: $input.idempotency_key
        input:
          data_source_ref: $input.data_source_ref
          resource: $input.resource
          aggregate_id: $input.aggregate_id
          expected_version: $input.expected_version
          event: $input.event
          observed_at: $input.observed_at
      - id: append
        inputs:
          result: $steps.store-append.provider_operation.result
        tool: { module: data-store.mjs, export: dataOperationResult }
        artifacts:
          wrap_as: data_operation_result
          packet: runx.data.operation_result.v1
      - id: store-readback
        operation: store/projection.read
        input:
          data_source_ref: $input.data_source_ref
          resource: $input.resource
          aggregate_id: $input.aggregate_id
      - id: readback
        inputs:
          result: $steps.store-readback.provider_operation.result
        tool: { module: data-store.mjs, export: dataOperationResult }
        artifacts:
          wrap_as: data_operation_result
          packet: runx.data.operation_result.v1
