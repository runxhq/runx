skill: github-pr-comment
version: "0.3.6"

catalog:
  kind: graph
  audience: public
  visibility: public
  role: canonical
  execution: execute
  completion: provider_readback
  approval: conditional
  category: code

input_definitions:
  repository:
    type: string
    required: true
    description: Exact GitHub repository slug as owner/name.
    schema: { pattern: '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$', maxLength: 201 }
  pr_number:
    type: string
    required: true
    description: Positive decimal pull-request number.
    schema: { pattern: '^[1-9][0-9]*$', maxLength: 20 }
  body:
    type: string
    required: true
    description: Exact review note body bound into approval and provider readback.
    schema: { minLength: 1, maxLength: 65536 }
  idempotency_key:
    type: string
    required: true
    description: Stable retry key for this exact repository, pull request, and body.
    schema: { minLength: 8, maxLength: 256, pattern: '^[A-Za-z0-9._:-]+$' }
harness:
  files:
    - fixtures/bin/gh
    - fixtures/support/composed.graph
  cases:
    - name: github-pr-comment-merge-refused
      runner: merge-refused
      inputs:
        repository: runxhq/runx
        pr_number: "42"
      caller:
        provider_responses:
          principal_id: operator
          grant:
            grant_id: github-mcp-pr-comment
            provider: github
            scopes: [pr.comment]
      expect:
        status: policy_denied
        receipt:
          schema: runx.receipt.v1
          state: sealed
          disposition: blocked
          reason: authority_denied

connectors:
  github:
    operations: [comments.create, pullrequest.merge]
runners:
  post:
    default: true
    inputs:
      repository:
        definition: repository
      pr_number:
        definition: pr_number
      body:
        definition: body
      idempotency_key:
        definition: idempotency_key
    examples:
      - repository: runxhq/runx
        pr_number: "42"
        body: The reviewed path is sound; please add the missing harness case.
        idempotency_key: runxhq-runx-pr-42-connect-note-v1
    result_from: [post-comment]
    steps:
      - id: post-comment
        operation: github/comments.create
        idempotency_key: $input.idempotency_key
        input:
          repository: $input.repository
          comments:
            - number: $input.pr_number
              body: $input.body
  merge-refused:
    inputs:
      repository:
        definition: repository
      pr_number:
        definition: pr_number
    examples:
      - repository: runxhq/runx
        pr_number: "42"
    result_from: [merge_pr]
    steps:
      - id: merge_pr
        operation: github/pullrequest.merge
        idempotency_key: github-pr-comment-merge
        input:
          repository: "$input.repository"
          pr_number: "$input.pr_number"
