version: "0.1.5"
minimum_runx: 0.12.0
default_method: send
catalog:
  visibility: public
  category: ops
connectors:
  reply:
    choose: $input.expected_provider
    from:
      - slack
methods:
  send:
    description: Post one message to a channel, planning it, asking approval at the live post, posting once and reading it back.
    inputs:
      channel_locator:
        type: string
        description: Exact slack://workspace/channel destination.
      text:
        type: string
        description: Exact Slack message to bind, approve, post, and read back.
        minLength: 1
        maxLength: 40000
        pattern: \S
      principal:
        type: string
        description: Principal the notification is posted as.
      provider_context:
        optional: true
      idempotency_key:
        type: string
        description: Stable retry key for this exact notification.
    result_from:
      - deliver
    examples:
      - channel_locator: slack://acme/C0123
        principal: ops-bot
        idempotency_key: deploy-note-2026-11-05
        text: Today's deploy finished. Exports now run in the background.
    steps:
      - id: plan
        skill: .#plan_post
        inputs:
          channel: $input.channel_locator
          content:
            message: $input.text
          principal: $input.principal
          provider_context: $input.provider_context
      - id: deliver
        skill: .#post
        inputs:
          channel_locator: $input.channel_locator
          text: $input.text
          idempotency_key: $input.idempotency_key
          notification_plan: $steps.plan.notify_plan
  plan_post_exact:
    description: Plan a post whose destination, principal and text an operator already chose under its own policy, with no second judgment. Posts nothing.
    inputs:
      channel:
        type: string
        description: Exact slack://workspace/channel destination for a message already selected by the caller.
        pattern: ^slack://[A-Z][A-Z0-9]+/[CGD][A-Z0-9]+$
        maxLength: 300
      content:
        type: object
        description: Either one inline Slack message or one existing content reference with its SHA-256 digest.
        additionalProperties: false
        properties:
          message:
            type: string
            minLength: 1
            maxLength: 40000
            pattern: \S
          content_uri:
            type: string
            minLength: 1
            maxLength: 2048
          digest:
            type: string
            pattern: ^sha256:[0-9a-f]{64}$
        oneOf:
          - required:
              - message
          - required:
              - content_uri
              - digest
      principal:
        type: string
        description: Exact principal bound to the later provider permission grant.
    examples:
      - channel: slack://T123/C456
        content:
          message: A new personal update needs attention.
        principal: runx:principal:operator
    result_from:
      - finalize
    steps:
      - id: prepare
        inputs:
          channel: $input.channel
          content: $input.content
          principal: $input.principal
        tool:
          module: post.mjs
          export: prepareNotification
        outputs:
          notification_admission: {type: object}
          digest_input: {type: string}
      - id: digest-content
        tool: data.digest
        inputs:
          encoding: utf8_text
          value: $steps.prepare.digest_input
      - id: bind-content
        inputs:
          notification_admission: $steps.prepare.notification_admission
          digest_result: $steps.digest-content.digest_result
        tool:
          module: post.mjs
          export: bindNotification
        outputs:
          slack_context: {type: object}
      - id: finalize
        inputs:
          slack_context: $steps.bind-content.slack_context
        tool:
          module: post.mjs
          export: finalizeExactNotification
        outputs:
          notify_plan: {type: object, packet: runx/message-send.notification_plan.v1}
  plan_post:
    description: Plan one channel post, checking its destination, digesting its text and binding the plan, without posting or asking approval. Post it with post.
    inputs:
      channel:
        type: string
        description: "Slack #name, channel id, or exact slack://workspace/channel locator."
      content:
        type: object
        description: Either one inline Slack message or one existing content reference with its SHA-256 digest.
        additionalProperties: false
        properties:
          message:
            type: string
            minLength: 1
            maxLength: 40000
            pattern: \S
          content_uri:
            type: string
            minLength: 1
            maxLength: 2048
          digest:
            type: string
            pattern: ^sha256:[0-9a-f]{64}$
        oneOf:
          - required:
              - message
          - required:
              - content_uri
              - digest
      principal:
        type: string
        description: Principal the notification would be posted as.
      provider_context:
        description: Connector and workspace readiness supplied to the send plan.
        optional: true
    examples:
      - channel: slack://T123/C456
        content:
          message: Release 0.8.2 is live.
        principal: runx:principal:kam
        provider_context:
          provider: slack
          connector_status: ready
    result_from:
      - finalize
      - reject
    steps:
      - id: prepare
        inputs:
          channel: $input.channel
          content: $input.content
          principal: $input.principal
        tool:
          module: post.mjs
          export: prepareNotification
        outputs:
          notification_admission: {type: object}
          digest_input: {type: string}
      - id: digest-content
        tool: data.digest
        inputs:
          encoding: utf8_text
          value: $steps.prepare.digest_input
      - id: bind-content
        inputs:
          notification_admission: $steps.prepare.notification_admission
          digest_result: $steps.digest-content.digest_result
        tool:
          module: post.mjs
          export: bindNotification
        outputs:
          slack_context: {type: object}
      - id: authorize
        when:
          value: $steps.bind-content.slack_context.decision
          equals: ready
        skill: .#plan
        inputs:
          objective: Authorize one digest-bound Slack notification for later provider delivery.
          principal: $input.principal
          audience: $input.channel
          provider_context: $input.provider_context
          slack_context: $steps.bind-content.slack_context
      - id: finalize
        when:
          value: $steps.bind-content.slack_context.decision
          equals: ready
        inputs:
          slack_context: $steps.bind-content.slack_context
          send_plan: $steps.authorize.send_plan
        tool:
          module: post.mjs
          export: finalizeNotification
        outputs:
          notify_plan: {type: object, packet: runx/message-send.notification_plan.v1}
      - id: reject
        when:
          value: $steps.bind-content.slack_context.decision
          equals: blocked
        inputs:
          slack_context: $steps.bind-content.slack_context
        tool:
          module: post.mjs
          export: finalizeNotification
        outputs:
          notify_plan: {type: object, packet: runx/message-send.notification_plan.v1}
  post:
    description: Post a planned message once, exactly as planned, under approval or a standing authority, and read it back.
    inputs:
      notification_plan:
        packet: runx/message-send.notification_plan.v1
        description: Exact notify_plan emitted by the plan runner.
      channel_locator:
        type: string
        description: Exact slack://workspace/channel locator bound by the plan and connector grant.
      text:
        type: string
        description: Exact message text whose digest must match notification_plan.
        minLength: 1
        maxLength: 40000
        pattern: \S
      idempotency_key:
        type: string
        description: Stable UUID for this exact Slack delivery.
    examples:
      - notification_plan:
          schema: runx/message-send.notification_plan.v1
          decision: ready_for_provider
          provider: slack
          principal: runx:principal:kam
          channel: slack://T123/C456
          content_uri: inline:sha256:2497ff7c585df614f84f034872869ceff21afbaaab7230fb9b1fa0d271a122fb
          content_digest: sha256:2497ff7c585df614f84f034872869ceff21afbaaab7230fb9b1fa0d271a122fb
          send_plan:
            decision: ready
          provider_status: not_called
          delivery_status: not_sent
          downstream_handoff:
            skill: message-send
            runner: post
            state: ready_for_approval
          validation:
            status: pass
            findings: []
        channel_locator: slack://T123/C456
        text: Release 0.8.2 is live.
        idempotency_key: 00000000-0000-4000-8000-000000000001
    result_from:
      - hold-plan
      - hold-content
      - readback
    steps:
      - id: digest
        tool: data.digest
        inputs:
          value: $input.text
          encoding: utf8_text
      - id: bind-plan
        tool: data.compare
        inputs:
          actual:
            decision: $input.notification_plan.decision
            provider: $input.notification_plan.provider
            channel: $input.notification_plan.channel
            provider_status: $input.notification_plan.provider_status
            delivery_status: $input.notification_plan.delivery_status
          expected:
            decision: ready_for_provider
            provider: slack
            channel: $input.channel_locator
            provider_status: not_called
            delivery_status: not_sent
      - id: bind-content
        tool: data.compare
        when:
          value: $steps.bind-plan.comparison.equal
          equals: true
        inputs:
          expected: $input.notification_plan.content_digest
          actual: $steps.digest.digest_result.digest
      - id: hold-plan
        when:
          value: $steps.bind-plan.comparison.equal
          equals: false
        tool:
          module: reply.mjs
          export: holdMessage
        inputs:
          reply_plan:
            reason: Message destination or delivery plan changed; prepare the exact plan again before delivery.
        outputs:
          work_result: {type: object, packet: runx.work_outcome.v1}
      - id: hold-content
        when:
          value: $steps.bind-content.comparison.equal
          equals: false
        tool:
          module: reply.mjs
          export: holdMessage
        inputs:
          reply_plan:
            reason: Message text differs from the approved plan; prepare and approve the changed content before delivery.
        outputs:
          work_result: {type: object, packet: runx.work_outcome.v1}
      - id: deliver
        operation: slack/channel.post
        idempotency_key: $input.idempotency_key
        when:
          value: $steps.bind-content.comparison.equal
          equals: true
        approval:
          reason: Approve posting this exact digest-bound Slack notification.
          type: slack_message
        result:
          required:
            - message_locator
            - conversation_locator
            - content_digest
            - occurred_at
          equals:
            conversation_locator: $input.channel_locator
            content_digest: $input.notification_plan.content_digest
        inputs:
          channel_locator: $input.channel_locator
          text: $input.text
      - id: prepare-readback
        when:
          value: $steps.bind-content.comparison.equal
          equals: true
        inputs:
          text: $input.text
          delivery: $steps.deliver.provider_operation
          operation: channel.post
        tool:
          module: post.mjs
          export: prepareMessageReadback
        outputs:
          read_request: {type: object}
      - id: readback
        when:
          value: $steps.bind-content.comparison.equal
          equals: true
        operation: slack/channel.post.read
        result:
          required:
            - message_locator
            - conversation_locator
            - content_digest
            - occurred_at
          equals: $steps.deliver.provider_operation.result
        inputs: $steps.prepare-readback.read_request
  reconcile_post:
    description: Independently observe one selected message after an uncertain post, without resending or changing the original native custody.
    inputs:
      notification_plan:
        packet: runx/message-send.notification_plan.v1
      channel_locator:
        type: string
      text:
        type: string
      message_locator:
        type: string
      failed_at:
        type: string
    result_from:
      - finish
    steps:
      - id: digest
        tool: data.digest
        inputs:
          value: $input.text
          encoding: utf8_text
      - id: prepare-readback
        tool:
          module: post.mjs
          export: prepareReconciliationRead
        inputs:
          notification_plan: $input.notification_plan
          channel_locator: $input.channel_locator
          message_locator: $input.message_locator
          text: $input.text
          failed_at: $input.failed_at
          digest_result: $steps.digest.digest_result
        outputs:
          read_request: {type: object}
          expected_result: {type: object}
      - id: read
        operation: slack/channel.post.read
        inputs: $steps.prepare-readback.read_request
        result:
          required:
            - message_locator
            - conversation_locator
            - content_digest
            - occurred_at
          equals: $steps.prepare-readback.expected_result
      - id: finish
        tool:
          module: post.mjs
          export: reconcileExactNotification
        inputs:
          provider_operation: $steps.read.provider_operation
          failed_at: $input.failed_at
        outputs:
          reconciliation: {type: object}
  plan:
    description: Authorize a message without sending it, binding the principal, audience, content digest, consent and approval into a send plan.
    inputs:
      objective:
        type: string
        description: Bounded send-planning or authorization objective; this explicit runner does not deliver.
      principal:
        type: string
        description: Principal the message is sent as.
      provider_context:
        description: Provider/account readiness, connector, or MCP status.
        optional: true
      audience:
        description: Recipient, list, segment, thread, channel, or audience brief.
        optional: true
      content:
        description: Digest, draft id, template id, campaign id, or stable content reference.
        optional: true
      consent_basis:
        type: string
        description: Why the recipient or audience may receive this message.
        optional: true
      operator_context:
        type: string
        description: Approval posture, legal constraints, or extra guardrails.
        optional: true
      connector:
        description: Provider and target identity available to the direct send; planning never receives credentials.
        optional: true
    steps:
      - id: plan
        agent: message-send
        inputs:
          objective: $input.objective
          principal: $input.principal
          provider_context: $input.provider_context
          audience: $input.audience
          content: $input.content
          consent_basis: $input.consent_basis
          operator_context: $input.operator_context
          connector: $input.connector
        outputs:
          send_plan: {type: object, packet: runx/message-send.plan.v1}
  reply:
    description: Reply once in a conversation from an admitted source packet, under exact approval, and read the reply back.
    inputs:
      source_context:
        packet: runx.source_packet.v1
      turn_id:
        type: string
        pattern: ^sha256:[0-9a-f]{64}$
      expected_provider:
        type: string
      thread_locator:
        type: string
      draft_message:
        type: string
        minLength: 1
        maxLength: 40000
    result_from:
      - held
      - finish
    steps:
      - id: digest
        tool: data.digest
        inputs:
          value: $input.draft_message
          encoding: utf8_text
      - id: prepare
        inputs:
          source_context: $input.source_context
          turn_id: $input.turn_id
          expected_provider: $input.expected_provider
          thread_locator: $input.thread_locator
          draft_message: $input.draft_message
          digest: $steps.digest.digest_result
        tool:
          module: reply.mjs
          export: prepareReply
        outputs:
          reply_plan: {type: object}
      - id: held
        when:
          value: $steps.prepare.reply_plan.ready
          equals: false
        inputs:
          reply_plan: $steps.prepare.reply_plan
        tool:
          module: reply.mjs
          export: holdMessage
        outputs:
          work_result: {type: object, packet: runx.work_outcome.v1}
      - id: deliver
        when:
          value: $steps.prepare.reply_plan.ready
          equals: true
        operation: reply/thread.reply
        approval:
          reason: Approve sending this exact reply to the bound conversation.
          type: message_delivery
        idempotency_key: $steps.prepare.reply_plan.idempotency_key
        inputs: $steps.prepare.reply_plan.request
      - id: prepare_readback
        when:
          value: $steps.prepare.reply_plan.ready
          equals: true
        inputs:
          reply_plan: $steps.prepare.reply_plan
          mutation: $steps.deliver.provider_operation
        tool:
          module: reply.mjs
          export: prepareReadback
        outputs:
          read_request: {type: object}
      - id: readback
        when:
          value: $steps.prepare.reply_plan.ready
          equals: true
        operation: reply/thread.reply.read
        confirms: deliver
        inputs: $steps.prepare_readback.read_request
      - id: finish
        when:
          value: $steps.prepare.reply_plan.ready
          equals: true
        inputs:
          reply_plan: $steps.prepare.reply_plan
          mutation: $steps.deliver.provider_operation
          readback: $steps.readback.provider_operation
        tool:
          module: reply.mjs
          export: finishReply
        outputs:
          work_result: {type: object, packet: runx.work_outcome.v1}
  plan_reply:
    description: Plan one Slack thread reply, binding the thread and the text's digest, without sending it. Deliver it with deliver_reply.
    inputs:
      principal:
        type: string
        description: Principal represented by the connected Slack identity.
      thread_locator:
        type: string
        description: Exact Slack thread that would receive the reply.
        pattern: ^slack://[A-Z][A-Z0-9]+/[CGD][A-Z0-9]+/[0-9]+\.[0-9]+$
        maxLength: 300
      text:
        type: string
        description: Exact proposed reply text.
        minLength: 1
        maxLength: 40000
      provider_context:
        description: Connector and workspace readiness supplied to the send plan.
        optional: true
      operator_context:
        type: string
        description: Purpose, constraints, and approval posture for this reply.
        optional: true
    examples:
      - principal: user:kam
        thread_locator: slack://T123ABC/C123ABC/1750000000.000001
        text: I’ll verify this now.
        provider_context:
          connector: runx-connect
          workspace: T123ABC
        operator_context: Reply only in the supplied thread and require approval before delivery.
    result_from:
      - authorize
    steps:
      - id: digest
        tool: data.digest
        inputs:
          value: $input.text
          encoding: utf8_text
      - id: authorize
        skill: .#plan
        inputs:
          objective: Authorize one exact Slack thread reply for later provider delivery.
          principal: $input.principal
          provider_context: $input.provider_context
          audience:
            type: thread
            locator: $input.thread_locator
            requires_reconfirmation: false
          operator_context: $input.operator_context
          content: $steps.digest.digest_result
  deliver_reply:
    description: Deliver a reply planned by plan_reply once, under approval, and read it back.
    inputs:
      send_plan:
        packet: runx/message-send.plan.v1
        description: Exact send_plan emitted by plan_reply.
      thread_locator:
        type: string
        description: Exact Slack thread locator bound by the plan and Connect grant.
        pattern: ^slack://[A-Z][A-Z0-9]+/[CGD][A-Z0-9]+/[0-9]+\.[0-9]+$
        maxLength: 300
      text:
        type: string
        description: Exact reply text whose digest must match the plan.
        minLength: 1
        maxLength: 40000
        pattern: \S
      idempotency_key:
        type: string
        description: Stable UUID for this exact Slack reply.
        format: uuid
    examples:
      - send_plan:
          decision: ready
          action_family: message-send
          principal:
            type: user
            uri: user:kam
          provider:
            name: slack
            account_id: workspace:T123ABC
            runtime_path: slack
          send_class: internal
          channel: chat
          audience:
            type: thread
            locator: slack://T123ABC/C123ABC/1750000000.000001
            requires_reconfirmation: false
          content:
            draft_uri: inline
            digest: sha256:8604f5c08db8d76b6fa8066c769fbdc6a4992101373d0d17bcfe426cf8e77647
            subject_or_title: Slack thread reply
          gates:
            preflight_required: true
            human_approval_required: true
            approval_id: slack.deliver-reply.approval
          blockers: []
          provider_actions:
            - thread.reply
          evidence_locators: []
          success_checkpoint:
            milestone: plan_ready
            description: Digest-bound Slack reply awaits approved provider execution.
        thread_locator: slack://T123ABC/C123ABC/1750000000.000001
        text: I’ll verify this now.
        idempotency_key: 00000000-0000-4000-8000-000000000001
    result_from:
      - hold-plan
      - hold-content
      - readback
    steps:
      - id: digest
        tool: data.digest
        inputs:
          value: $input.text
          encoding: utf8_text
      - id: bind-plan
        tool: data.compare
        inputs:
          actual:
            decision: $input.send_plan.decision
            provider: $input.send_plan.provider.name
            channel: $input.send_plan.channel
            audience: $input.send_plan.audience.locator
            approval_required: $input.send_plan.gates.human_approval_required
          expected:
            decision: ready
            provider: slack
            channel: chat
            audience: $input.thread_locator
            approval_required: true
      - id: bind-content
        tool: data.compare
        when:
          value: $steps.bind-plan.comparison.equal
          equals: true
        inputs:
          expected: $input.send_plan.content.digest
          actual: $steps.digest.digest_result.digest
      - id: hold-plan
        when:
          value: $steps.bind-plan.comparison.equal
          equals: false
        tool:
          module: reply.mjs
          export: holdMessage
        inputs:
          reply_plan:
            reason: Message destination or delivery plan changed; prepare the exact plan again before delivery.
        outputs:
          work_result: {type: object, packet: runx.work_outcome.v1}
      - id: hold-content
        when:
          value: $steps.bind-content.comparison.equal
          equals: false
        tool:
          module: reply.mjs
          export: holdMessage
        inputs:
          reply_plan:
            reason: Message text differs from the approved plan; prepare and approve the changed content before delivery.
        outputs:
          work_result: {type: object, packet: runx.work_outcome.v1}
      - id: deliver
        operation: slack/thread.reply
        idempotency_key: $input.idempotency_key
        when:
          value: $steps.bind-content.comparison.equal
          equals: true
        approval:
          reason: Approve posting this exact digest-bound Slack thread reply.
          type: slack_message
        result:
          required:
            - message_locator
            - conversation_locator
            - thread_locator
            - content_digest
            - occurred_at
          equals:
            thread_locator: $input.thread_locator
            content_digest: $input.send_plan.content.digest
        inputs:
          thread_locator: $input.thread_locator
          text: $input.text
      - id: prepare-readback
        when:
          value: $steps.bind-content.comparison.equal
          equals: true
        inputs:
          text: $input.text
          delivery: $steps.deliver.provider_operation
          operation: thread.reply
        tool:
          module: post.mjs
          export: prepareMessageReadback
        outputs:
          read_request: {type: object}
      - id: readback
        when:
          value: $steps.bind-content.comparison.equal
          equals: true
        operation: slack/thread.reply.read
        result:
          required:
            - message_locator
            - conversation_locator
            - thread_locator
            - content_digest
            - occurred_at
          equals: $steps.deliver.provider_operation.result
        inputs: $steps.prepare-readback.read_request
