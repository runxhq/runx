name: message-send-composes-in-graph
kind: graph
target: support/composed.graph
caller:
  answers:
    plan:
      send_plan:
        decision: ready
        action_family: message-send
        principal: { type: team, uri: "team:operations" }
        provider: { name: slack, account_id: "workspace:ops", runtime_path: slack }
        send_class: internal
        channel: chat
        audience: { type: channel, locator: "#ops", requires_reconfirmation: false }
        content:
          draft_uri: inline
          digest: sha256:d55345493cde3df4ca21ae7617ca671880a98fdf3eb283482a198f8def5caae6
          subject_or_title: Operations update
        gates: { preflight_required: true, human_approval_required: true, approval_id: "" }
        blockers: []
        provider_actions: [post_message]
        evidence_locators: []
        success_checkpoint:
          milestone: plan_ready
          description: Digest-bound Slack notification awaits approved provider execution.
expect:
  status: sealed
  steps: [message-send, digest]
  receipt: { schema: runx.receipt.v1 }
