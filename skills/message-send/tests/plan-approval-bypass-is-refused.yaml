      send_plan:
        decision: refused
        action_family: message-send
        principal:
          type: account
          uri: account:growth-demo
        provider:
          name: slack
          account_id: acct_demo
          runtime_path: provider.send
        send_class: campaign
        channel: email
        audience:
          type: segment
          locator: customers-active
          requires_reconfirmation: false
        content:
          draft_uri: campaign:launch
          digest: sha256:dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd
          subject_or_title: Launch announcement
        gates:
          preflight_required: true
          human_approval_required: true
          approval_id: ""
        blockers:
          - live customer send approval cannot be bypassed
        provider_actions: []
        evidence_locators:
          - provider_context:slack
        success_checkpoint:
          milestone: send_refused
          description: No provider action is authorized from a gate-bypass request.
      ending: blocked
      ending_reason: Live customer send approval cannot be bypassed.
expect:
