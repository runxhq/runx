  principal: account:growth-demo
  provider_context:
    provider: slack
    account_id: acct_demo
    runtime_path: provider.send
    domain_verified: true
  audience:
    type: segment
    locator: customers-active
  content:
    draft_uri: campaign:launch
    digest: sha256:dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd
    subject_or_title: Launch announcement
  consent_basis: Active customers with announcement consent.
  operator_context: Refuse any request to bypass approval for a live customer send.
host:
