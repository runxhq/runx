version: "0.3.6"
minimum_runx: 0.12.0
catalog:
  visibility: public
  category: security

methods:
  sign-receipt:
    inputs:
      action:
        type: string
        description: What happened outside Runx.
      evidence:
        description: Opaque references, sha256 digests, and what each locator proves.
      principal:
        type: string
        description: Actor named by the attestation.
      claim:
        type: string
        description: Exact assertion to bind into the receipt.
      scope:
        type: object
        description: Bound on downstream reliance.
        additionalProperties: true
        optional: true
    result_from: [attest]
    examples:
      - action: Issued a goodwill refund in the provider console for order 7741.
        principal: ops:jordan
        claim: A refund for order 7741 was completed in the provider console.
        evidence:
          - locator: provider:refund:re_3PqL2x
            digest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
            proves: The provider shows the refund settled for order 7741.
    steps:
      - id: attest
        tool: receipt.attest
        inputs:
          action: $input.action
          evidence: $input.evidence
          principal: $input.principal
          claim: $input.claim
          scope: $input.scope
