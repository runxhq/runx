name: sourcey-lifecycle-builds-verifies-and-packages
kind: graph
target: support/sourcey-lifecycle.graph
operator_journeys:
  - mode: standalone
    exercises_runner: sourcey
    confusors: [release, answer-from-docs]
    request: Generate and verify this project's documentation with Sourcey.
    expected_outcome: Complete discovery, bounded authoring, critique, verification, and package handoff with truthful artifacts.
  - mode: composed
    request: Continue Sourcey documentation from this bounded discovery plan and existing source set.
    expected_outcome: Reuse the discovery report and existing sources without rediscovery, then verify and package the documentation result.
    prior_evidence:
      - The bounded Sourcey discovery report, configuration, and existing source inventory supplied by the fixture.
    must_not_repeat:
      - Do not rediscover the project identity or documentation inputs.
      - Do not rewrite sources already accepted by the bounded plan.
caller:
  answers:
    agent.sourcey-discover.output:
      discovery_report:
        discovered:
          brand_name: Runx Sourcey Journey
          homepage_url: https://runx.example.test
          docs_inputs:
            mode: config
            config: sourcey.config.ts
        plan:
          disposition: preserve_existing_sources
    agent.sourcey-author.output:
      doc_bundle:
        files: []
        summary: Existing fixture sources already satisfy the bounded plan.
    agent.sourcey-critique.output:
      evaluation_report:
        quality:
          verdict: pass
          grounding: fixture-backed
        findings: []
        recommendations: []
    agent.sourcey-revise.output:
      revision_bundle:
        files: []
        summary: No revision is required after the passing build review.
expect:
  status: sealed
  receipt:
    schema: runx.receipt.v1
    state: sealed
    disposition: closed
    child_receipt_count: 2
  steps:
    - seed-workspace
    - run-sourcey
  step_outputs:
    seed-workspace:
      subset:
        fixture_workspace:
          data:
            file_count: 3
    run-sourcey:
      subset:
        sourcey_packet:
          data:
            verified: true
            contains_doctype: true
            discovery_report:
              discovered:
                brand_name: Runx Sourcey Journey
            build_report:
              generated: true
              index_title: Runx Sourcey Journey
            evaluation_report:
              quality:
                verdict: pass
            revision_bundle:
              summary: No revision is required after the passing build review.
            verification_proof:
              verified: true
metadata:
  public_skill: sourcey
  source_case: sourcey-lifecycle-builds-verifies-and-packages
  source: skills-fixture
  graph_shape: sourcey_operator_journey
