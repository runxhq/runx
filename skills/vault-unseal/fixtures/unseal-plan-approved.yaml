name: vault-unseal-prepares-bounded-request
kind: skill
target: ..
runner: vault-unseal
operator_journeys:
  - mode: standalone
    confusors: [least-privilege, policy-draft]
    request: Unseal this vault reference for one ten-minute Drive export operation.
    expected_outcome: Return an exact approved time-bounded request and opaque handle metadata without exposing secret material.
  - mode: composed
    request: Continue the Drive export from this approved vault-unseal plan.
    expected_outcome: Reuse purpose, scope, principal, and TTL without reauthorizing or exposing the credential.
    prior_evidence:
      - The exact secret reference, purpose, scope, principal, and TTL supplied in the fixture.
    must_not_repeat:
      - Do not request approval again for the same exact plan.
      - Do not reveal or reacquire raw secret material downstream.
inputs:
  secret_ref: vault://drive/service-account
  purpose: Sign one Drive export request for the monthly reports job
  ttl: 10m
  scope: {resource: drive.files, action: export, path: /reports/*}
  principal: svc/report-exporter
expect:
  status: sealed
  output:
    subset:
      unseal_plan:
        data:
          decision: ready_for_approval
          ttl_minutes: 10
          execution:
            provider_status: not_called
            handle_issued: false
            secret_material_exposed: false
          downstream_handoff:
            skill: vault-unseal
            runner: execute
            state: ready_for_approval
  receipt: {schema: runx.receipt.v1}
metadata: {public_skill: vault-unseal, source_case: bounded-plan, source: skills-fixture}
