name: vault-unseal-default-issues-and-verifies-handle
kind: skill
target: ..
operator_journeys:
  - mode: standalone
    confusors: [least-privilege, policy-draft]
    request: Unseal one scoped time-bounded opaque vault handle for this principal.
    expected_outcome: Issue the approved opaque handle once, verify it through provider readback, and never expose secret material.
inputs:
  provider: vault
  secret_ref: vault://drive/service-account
  purpose: Sign one Drive export request for the monthly reports job
  ttl: 10m
  scope: { resource: drive.files, action: export, path: /reports/* }
  principal: svc/report-exporter
  idempotency_key: vault-unseal-monthly-report-001
caller:
  provider_responses:
    principal_id: report-exporter-fixture
    grant:
        grant_id: vault-unseal-fixture
        provider: vault
        scopes: [secret.unseal, handle.read]
    operations:
      - operation: secret.unseal
        target: vault://drive/service-account
        access: mutate
        result:
          handle_ref: handle://drive/export/monthly-001
          expires_at: "2026-08-11T00:10:00Z"
          status: active
      - operation: handle.read
        target: handle://drive/export/monthly-001
        access: read
        result:
          handle_ref: handle://drive/export/monthly-001
          expires_at: "2026-08-11T00:10:00Z"
          status: active
  approvals:
    "issue-handle": true
expect:
  status: sealed
  steps: [plan, issue-handle, readback]
  step_outputs:
    readback:
      subset:
        provider_operation:
          data:
            status: success
            result: { handle_ref: handle://drive/export/monthly-001, status: active }
  receipt: { schema: runx.receipt.v1, state: sealed, disposition: closed }
metadata: { public_skill: vault-unseal, source_case: direct-default-success, source: skills-fixture }
