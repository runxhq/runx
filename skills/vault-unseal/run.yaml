skill: vault-unseal
version: "0.4.4"

catalog:
  kind: skill
  audience: public
  visibility: public
  role: canonical
  runtime_path: vault
  execution: execute
  completion: provider_readback
  requires_adapter: true
  approval: required
  category: security

input_definitions:
  secret_ref:
    type: string
    required: true
    description: Opaque vault, secret, or handle reference; never a secret value.
    schema: { pattern: '^(?:vault|secret|handle)://[A-Za-z0-9._/-]+$' }
  purpose:
    type: string
    required: true
    description: Bounded reason the handle is needed.
    schema: { minLength: 1, maxLength: 500 }
  ttl:
    type: string
    required: true
    description: Time-to-live from one minute through one hour.
    schema: { pattern: '^[0-9]+[mh]$' }
  scope:
    type: object
    required: true
    description: Exact resource and action the opaque handle may unlock, with an optional bounded path.
    schema:
      required: [resource, action]
      properties:
        resource: { type: string, minLength: 1, maxLength: 512 }
        action: { type: string, minLength: 1, maxLength: 128 }
        path: { type: string, minLength: 1, maxLength: 2048 }

connectors:
  vault:
    operations: [secret.unseal, handle.read]
    connector_from: $input.provider
    allowed_connectors: [vault]
runners:
  vault-unseal:
    inputs:
      secret_ref:
        definition: secret_ref
      purpose:
        definition: purpose
      ttl:
        definition: ttl
      scope:
        definition: scope
      principal:
        type: string
        required: true
        description: Principal attributed to the future access.
      policy_notes:
        type: string
        required: false
        description: Policy context preserved for the downstream approver.
    examples:
      - secret_ref: vault://drive/service-account
        purpose: Sign one Drive export request for the monthly reports job.
        ttl: 10m
        scope: { resource: drive.files, action: export, path: /reports/* }
        principal: svc/report-exporter
        policy_notes: The handle is limited to one monthly export.
    steps:
      - id: vault-unseal
        tool: { module: vault-unseal.mjs }
        inputs:
          secret_ref: $input.secret_ref
          purpose: $input.purpose
          ttl: $input.ttl
          scope: $input.scope
          principal: $input.principal
          policy_notes: $input.policy_notes
        outputs:
          unseal_plan: object
        artifacts:
          named_emits:
            unseal_plan: unseal_plan
          packets:
            unseal_plan: runx.unseal.v1

  execute:
    default: true
    inputs:
      provider:
        type: string
        required: true
        description: Expected configured vault provider name.
      secret_ref:
        definition: secret_ref
      purpose:
        definition: purpose
      ttl:
        definition: ttl
      scope:
        definition: scope
      principal:
        type: string
        required: true
        description: Principal receiving the future opaque handle.
      policy_notes:
        type: string
        required: false
        description: Policy context preserved for the approver and provider.
      idempotency_key:
        type: string
        required: true
        description: Stable retry key for this exact unseal request.
    examples:
      - provider: vault
        secret_ref: vault://drive/service-account
        purpose: Sign one Drive export request for the monthly reports job.
        ttl: 10m
        scope: { resource: drive.files, action: export, path: /reports/* }
        principal: svc/report-exporter
        policy_notes: The handle is limited to one monthly export.
        idempotency_key: vault-vault-vault-001
    result_from: [readback]
    steps:
      - id: plan
        inputs:
          secret_ref: $input.secret_ref
          purpose: $input.purpose
          ttl: $input.ttl
          scope: $input.scope
          principal: $input.principal
          policy_notes: $input.policy_notes
        tool: { module: vault-unseal.mjs }
        outputs:
          unseal_plan: object
        artifacts:
          named_emits:
            unseal_plan: unseal_plan
          packets:
            unseal_plan: runx.unseal.v1

      - id: issue-handle
        when:
          value: $steps.plan.unseal_plan.data.decision
          equals: ready_for_approval
        operation: vault/secret.unseal
        idempotency_key: $input.idempotency_key
        approval:
          reason: Approve issuing this exact time-bounded secret handle.
          type: vault_unseal
        result_fields: [handle_ref, expires_at, status]
        input:
          secret_ref: $input.secret_ref
          purpose: $input.purpose
          ttl: $input.ttl
          scope: $input.scope
          principal: $input.principal

      - id: readback
        when:
          value: $steps.plan.unseal_plan.data.decision
          equals: ready_for_approval
        operation: vault/handle.read
        result_fields: [handle_ref, expires_at, status]
        expected_result: $steps.issue-handle.provider_operation.data.result
        input: $steps.issue-handle.provider_operation.data.result
