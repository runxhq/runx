name: reports-native-history-and-catalog-coverage
inputs:
  objective: Show how Runx behaved over the supplied window.
  scope: workspace
  runs:
    - run_id: run_release_1
      skill: release
      state: sealed
      outcome: completed
    - run_id: run_release_2
      skill: release
      state: sealed
      outcome: blocked
  catalog_items:
    - name: release
      status: ok
      fixtures: 2
      test_cases: 1
    - name: untested
      status: ok
      fixtures: 0
      test_cases: 0
expect:
  status: sealed
  receipt:
    schema: runx.receipt.v1
  output:
    subset:
      history_report:
        schema: runx/run-history.report.v1
        decision: ready
        catalog:
          entry_count: 2
          tested_entry_count: 1
          untested_entry_count: 1
          coverage_rate: 0.5
        runs:
          terminal_count: 2
          pending_count: 0
          completed_rate: 0.5
          refusal_rate: 0.5
          unreadable: []
        sources:
          history: supplied_replay
          catalog: supplied_replay
