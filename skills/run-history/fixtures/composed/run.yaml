minimum_runx: 0.12.0
catalog:
  visibility: internal
methods:
  run:
    steps:
      - id: run-history
        skill: ../..#report
        inputs:
          objective: Show how Runx behaved over the supplied window.
          scope: workspace
          runs:
            - run_id: run_release_1
              skill: release
              state: sealed
              outcome: completed
            - run_id: run_release_2
              skill: release
              state: sealed
              outcome: blocked
          catalog_items:
            - name: release
              status: ok
              fixtures: 2
              harness_cases: 1
            - name: untested
              status: ok
              fixtures: 0
              harness_cases: 0
      - id: digest
        tool: data.digest
        inputs:
          value: $steps.run-history
