version: "0.2.13"
minimum_runx: 0.12.0
catalog:
  visibility: public
  category: data
methods:
  report:
    inputs:
      objective:
        type: string
        description: The bounded history question.
        minLength: 1
        pattern: \S
      scope:
        type: string
        default: workspace
        description: workspace, all, or one skill/subject name.
        optional: true
      period:
        type: string
        description: Relative lookback such as 7d or 30d, or an RFC 3339 lower bound.
        optional: true
      as_of:
        type: string
        description: Optional RFC3339 anchor for a reproducible relative lookback.
        optional: true
      limit:
        type: integer
        default: 1000
        description: Maximum runs to inspect; must be from 1 to 1000.
        minimum: 1
        maximum: 1000
        optional: true
      runs:
        type: array
        description: Already-windowed native run projections for controlled replay; pair with catalog_items. Period/as_of cannot be reapplied to replay.
        items:
          type: object
          required:
            - run_id
            - skill
            - state
          additionalProperties: true
          properties:
            run_id:
              type: string
              minLength: 1
            skill:
              type: string
              minLength: 1
            state:
              type: string
              minLength: 1
            outcome:
              type:
                - string
                - "null"
        optional: true
      catalog_items:
        type: array
        description: Explicit catalog rows paired with runs for deterministic replay.
        items:
          type: object
          required:
            - name
          additionalProperties: true
          properties:
            name:
              type: string
              minLength: 1
            fixtures:
              type: integer
              minimum: 0
            test_cases:
              type: integer
              minimum: 0
        optional: true
    result_from:
      - finalize-live
      - finalize-replay
    examples:
      - objective: Which runs failed this week, and why?
    steps:
      - id: prepare
        inputs:
          objective: $input.objective
          scope: $input.scope
          period: $input.period
          as_of: $input.as_of
          limit: $input.limit
          runs: $input.runs
          catalog_items: $input.catalog_items
        tool:
          module: run-history.mjs
          export: prepareHistory
        outputs:
          history_context: {type: object}
      - id: history
        when:
          value: $steps.prepare.history_context.path
          equals: live
        tool: run.list
        inputs:
          skill: $steps.prepare.history_context.skill_filter
          since: $steps.prepare.history_context.since
          period: $steps.prepare.history_context.lookback
          as_of: $steps.prepare.history_context.as_of
          limit: $steps.prepare.history_context.limit
          until: $steps.prepare.history_context.as_of
      - id: catalog
        when:
          value: $steps.prepare.history_context.path
          equals: live
        tool: runx.skill.inspect
        inputs:
          repo_root: .
      - id: finalize-live
        when:
          value: $steps.prepare.history_context.path
          equals: live
        tool:
          module: run-history.mjs
          export: finalizeHistory
        outputs:
          history_report:
            type: object
          history_report_packet: {packet: runx/run-history.report.v1}
        result_as: history_report_packet
        inputs:
          history_context: $steps.prepare.history_context
          run_list: $steps.history.run_list
          authoring_context: $steps.catalog.authoring_context
          runs: $input.runs
          catalog_items: $input.catalog_items
      - id: finalize-replay
        when:
          value: $steps.prepare.history_context.path
          equals: replay
        inputs:
          runs: $input.runs
          catalog_items: $input.catalog_items
          history_context: $steps.prepare.history_context
        tool:
          module: run-history.mjs
          export: finalizeHistory
        outputs:
          history_report:
            type: object
          history_report_packet: {packet: runx/run-history.report.v1}
        result_as: history_report_packet
