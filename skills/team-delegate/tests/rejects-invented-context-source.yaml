name: rejects-invented-context-source
inputs:
  objective: Review the reported setup-guide drift before preparing a documentation draft.
  roster:
    - member: researcher
      skill: runx/prior-art
      runner: prior-art-agent
      scope_ceiling:
        - fs.read
      capabilities: Inspect the operator-selected local source paths and return cited findings or missing evidence. No code edits or provider calls.
    - member: writer
      skill: runx/ghostwrite
      runner: draft
      scope_ceiling: []
      capabilities: Draft only from actual review findings when those are available.
  evidence:
    - source_id: issue:docs-drift
      text: The operator reports possible setup-guide drift and selects README.md for inspection. Treat the report as a claim; verify the document before asserting an omission.
host:
  answers:
    plan:
      draft:
        decision: propose
        rationale: The source review is ready; documentation writing waits for its actual findings.
        assignments:
          - member: researcher
            task: Inspect README.md against the supplied report about explicit connection selection. Return source-bound findings or identify missing evidence; do not edit documentation.
            input_context:
              objective: Inspect README.md against the supplied report about explicit connection selection. Return source-bound findings or identify missing evidence; do not edit documentation.
              repo_root: .
              source_paths:
                - README.md
              graph_purpose: Documentation source review
              audience: Local operator
            source_ids:
              - not-supplied
            needed_scope: []
            acceptance:
              - Return findings cited to the selected document, or identify missing source evidence.
              - Do not edit the document or claim the writer has run.
            verification: Check the receiver receipt and source-bound review; keep unavailable evidence explicit.
        missing_context:
          - The writer needs the source-review findings before drafting.
expect:
  status: sealed
  step_outputs:
    finalize:
      subset:
        delegation_packet:
          data:
            decision: held
            execution_status: not_started
