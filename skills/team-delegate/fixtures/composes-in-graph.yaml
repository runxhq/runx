name: team-delegate-composes-in-graph
kind: graph
target: support/composed.graph
caller:
  answers:
    delegate#plan:
      draft:
        decision: propose
        rationale: The source review is ready; documentation writing waits for its
          actual findings.
        assignments:
          - member: researcher
            task: Inspect README.md against the supplied report about explicit connection
              selection. Return source-bound findings or identify missing
              evidence; do not edit documentation.
            input_context:
              objective: Inspect README.md against the supplied report about explicit
                connection selection. Return source-bound findings or identify
                missing evidence; do not edit documentation.
              repo_root: .
              source_paths:
                - README.md
              graph_purpose: Documentation source review
              audience: Local operator
            source_ids:
              - issue:docs-drift
            needed_scope: []
            acceptance:
              - Return findings cited to the selected document, or identify
                missing source evidence.
              - Do not edit the document or claim the writer has run.
            verification: Check the receiver receipt and source-bound review; keep
              unavailable evidence explicit.
        missing_context:
          - The writer needs the source-review findings before drafting.
expect:
  status: sealed
  steps:
    - delegate
    - digest
