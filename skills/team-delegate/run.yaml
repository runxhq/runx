version: "0.1.17"
minimum_runx: 0.12.0
catalog:
  visibility: public
  category: ops
methods:
  delegate:
    inputs:
      objective:
        type: string
        description: Bounded work to divide among the declared members.
        minLength: 1
        maxLength: 10000
      roster:
        type: array
        description: Operator-selected members and exact skill/method targets. Scope ceilings are planning limits, never grants.
        minItems: 1
        maxItems: 20
        items:
          type: object
          required:
            - member
            - skill
            - method
            - scope_ceiling
            - capabilities
          additionalProperties: false
          properties:
            member:
              type: string
              minLength: 1
              maxLength: 200
            skill:
              type: string
              minLength: 1
              maxLength: 1000
            method:
              type: string
              minLength: 1
              maxLength: 200
            scope_ceiling:
              type: array
              maxItems: 100
              items:
                type: string
                minLength: 1
                maxLength: 500
            capabilities:
              type: string
              minLength: 1
              maxLength: 10000
      evidence:
        type: array
        description: Already-collected source context to carry into each relevant assignment.
        maxItems: 100
        items:
          type: object
          required:
            - source_id
            - text
          additionalProperties: false
          properties:
            source_id:
              type: string
              minLength: 1
              maxLength: 2000
            text:
              type: string
              minLength: 1
              maxLength: 50000
      constraints:
        type: string
        default: ""
        description: Time, cost, sequencing and handoff constraints; no implicit approval.
        optional: true
    result_from:
      - finalize
    examples:
      - objective: Triage this week's export failures and prepare a customer reply.
        roster:
          - member: support-agent
            skill: support-triage
            method: triage
            scope_ceiling:
              - read customer tickets
            capabilities: Reads support tickets and drafts unsent replies.
        evidence:
          - source_id: helpdesk:ticket-5512
            text: Our nightly export has timed out three times this week.
    steps:
      - id: input-digest
        tool: data.digest
        inputs:
          value:
            objective: $input.objective
            roster: $input.roster
            evidence: $input.evidence
            constraints: $input.constraints
      - id: plan
        agent: team-delegate
        inputs:
          objective: $input.objective
          roster: $input.roster
          evidence: $input.evidence
          constraints: $input.constraints
        outputs:
          draft:
            type: object
            required:
              - decision
              - rationale
              - assignments
              - missing_context
            additionalProperties: false
            properties:
              decision:
                enum:
                  - propose
                  - needs_input
              rationale:
                type: string
                minLength: 1
                maxLength: 5000
              assignments:
                type: array
                maxItems: 20
                items:
                  type: object
                  required:
                    - member
                    - task
                    - input_context
                    - source_ids
                    - needed_scope
                    - acceptance
                    - verification
                  additionalProperties: false
                  properties:
                    member:
                      type: string
                      minLength: 1
                      maxLength: 200
                    task:
                      type: string
                      minLength: 1
                      maxLength: 10000
                    input_context:
                      type: object
                      additionalProperties: true
                    source_ids:
                      type: array
                      maxItems: 50
                      items:
                        type: string
                        minLength: 1
                        maxLength: 2000
                    needed_scope:
                      type: array
                      maxItems: 100
                      items:
                        type: string
                        minLength: 1
                        maxLength: 500
                    acceptance:
                      type: array
                      maxItems: 30
                      items:
                        type: string
                        minLength: 1
                        maxLength: 2000
                      minItems: 1
                    verification:
                      type: string
                      minLength: 1
                      maxLength: 5000
              missing_context:
                type: array
                maxItems: 30
                items:
                  type: string
                  minLength: 1
                  maxLength: 2000
      - id: finalize
        tool:
          module: team-delegate.mjs
        inputs:
          objective: $input.objective
          roster: $input.roster
          evidence: $input.evidence
          constraints: $input.constraints
          draft: $steps.plan.draft
          input_digest: $steps.input-digest.digest_result.digest
        outputs:
          delegation_packet:
            type: object
            packet: runx/team-delegate.delegation.v1
