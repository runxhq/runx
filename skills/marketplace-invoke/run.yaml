skill: marketplace-invoke
version: "0.4.3"
catalog:
  kind: graph
  audience: operator
  visibility: public
  role: canonical
  execution: execute
  completion: provider_readback
  approval: required
  category: payments
connectors:
  artifact:
    operations: [artifact.allocate]
runners:
  invoke:
    default: true
    inputs:
      marketplace_offer:
        type: object
        required: true
        description: Immutable mediation terms injected by paid listing admission; callers cannot supply or override this field.
        schema:
          additionalProperties: false
          required: [listing_ref, endpoint_url, vendor_offer_revision, vendor_package_digest, vendor_amount_minor, platform_fee_minor, currency, settlement_family, expected_receipt_class, vendor_ref]
          properties:
            listing_ref: { type: string, pattern: '^runx:listing:\S+$', maxLength: 512 }
            endpoint_url: { type: string, pattern: '^https://\S+$', maxLength: 2048 }
            vendor_offer_revision:
              type: object
              additionalProperties: false
              required: [offer_id, revision, revision_digest, input_schema_digest, output_schema_digest]
              properties:
                offer_id: { type: string, minLength: 1 }
                revision: { type: string, minLength: 1 }
                revision_digest: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
                input_schema_digest: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
                output_schema_digest: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
            vendor_package_digest: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
            vendor_amount_minor: { type: integer, minimum: 1, maximum: 9007199254740991 }
            platform_fee_minor: { type: integer, minimum: 1, maximum: 9007199254740991 }
            currency: { type: string, pattern: '^[A-Z]{3}$' }
            settlement_family: { type: string, pattern: '^[a-z0-9][a-z0-9._-]{0,63}$' }
            expected_receipt_class: { type: string, const: executed }
            prepared_price:
              type: object
              additionalProperties: false
              required: [source_invocation_id, input_digest]
              properties:
                source_invocation_id: { type: string, minLength: 1, maxLength: 128 }
                input_digest: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
            vendor_ref:
              type: object
              additionalProperties: false
              required: [type, uri]
              properties:
                type: { type: string, const: principal }
                uri: { type: string, pattern: '^runx:principal:\S+$', maxLength: 512 }
      resource_request:
        type: object
        required: true
        description: Provider-neutral request for the exact listed vendor endpoint; settlement adapters derive their protocol envelope from this value.
        schema:
          additionalProperties: false
          required: [body]
          properties:
            body: { type: object, additionalProperties: true }
            headers:
              type: object
              additionalProperties: { type: string, maxLength: 4096 }
            timeout_ms: { type: integer, minimum: 1, maximum: 120000 }
            max_response_bytes: { type: integer, minimum: 1, maximum: 26214400 }
      idempotency_seed: { type: string, required: true, description: Admission-owned retry identity for this marketplace purchase, schema: { minLength: 16, maxLength: 500 } }
    examples:
      - marketplace_offer:
          listing_ref: runx:listing:ausca/document-ocr@ocr-fixed-r2#invoke
          endpoint_url: https://vendor.example/v1/invocations
          vendor_offer_revision:
            offer_id: document.ocr
            revision: ocr-fixed-r2
            revision_digest: "sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
            input_schema_digest: "sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
            output_schema_digest: "sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc"
          vendor_package_digest: "sha256:dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd"
          vendor_amount_minor: 25
          platform_fee_minor: 5
          currency: USD
          settlement_family: x402
          expected_receipt_class: executed
          vendor_ref: { type: principal, uri: runx:principal:ausca }
        resource_request:
          body:
            offer_id: document.ocr
            offer_revision: ocr-fixed-r2
            offer_revision_digest: "sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
            input_schema_digest: "sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
            output_schema_digest: "sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc"
            canonicalizer_version: runx.receipt.c14n.v1
            input: { artifact_ref: "runx:artifact:document-1" }
          max_response_bytes: 26214400
        idempotency_seed: marketplace-purchase-0001
    result_from: [schedule]
    steps:
      - id: x402
        skill: ../x402-pay
        runner: settle
        inputs:
          payment_signal:
            resource:
              url: $input.marketplace_offer.endpoint_url
              method: POST
              body: $input.resource_request.body
              headers: $input.resource_request.headers
              timeout_ms: $input.resource_request.timeout_ms
              max_response_bytes: $input.resource_request.max_response_bytes
            amount_minor: $input.marketplace_offer.vendor_amount_minor
            parent_binding: current_paid_invocation
          parent_payment_authority:
            term_id: $input.idempotency_seed
            currency: $input.marketplace_offer.currency
            max_amount_minor: $input.marketplace_offer.vendor_amount_minor
            counterparty: $input.marketplace_offer.endpoint_url
          marketplace_offer: $input.marketplace_offer
          idempotency_seed: $input.idempotency_seed
      - id: schedule
        inputs:
          marketplace_offer: $input.marketplace_offer
          resource_url: $input.marketplace_offer.endpoint_url
          settlement: $steps.x402.provider_operation.result
        tool: { module: readback.mjs, export: scheduleMarketplaceReadback, timeout_seconds: 5 }
        outputs: { schedule_intent: { type: object } }
        artifacts:
          named_emits: { schedule_intent: schedule_intent }
          packets: { schedule_intent: runx.external_job_schedule_intent.v1 }

  vendor-readback:
    inputs:
      request:
        type: json
        required: true
        description: Runx-owned current-V1 durable stage request.
    result_from: [waiting-result, failed-result, ready-result]
    steps:
      - id: plan
        inputs: { request: $input.request }
        tool: { module: readback.mjs, export: planMarketplaceReadback, timeout_seconds: 5 }
        outputs: { readback_input: object, provider_job_ref: object, checkpoint: object }

      - id: readback
        skill: ../x402-pay
        runner: readback
        inputs:
          resource_url: $steps.plan.readback_input.resource_url
          payment_ref: $steps.plan.readback_input.payment_ref

      - id: interpret
        inputs:
          checkpoint: $steps.plan.checkpoint
          provider_job_ref: $steps.plan.provider_job_ref
          readback: $steps.readback.provider_operation.result
        tool: { module: readback.mjs, export: interpretMarketplaceReadback, timeout_seconds: 5 }
        outputs: { action: object }

      - id: waiting-result
        when: { value: $steps.interpret.action.kind, equals: waiting }
        inputs:
          action: $steps.interpret.action
        tool: { module: readback.mjs, export: finishMarketplaceWaiting, timeout_seconds: 5 }
        outputs: { stage_result: { type: object } }
        artifacts:
          named_emits: { stage_result: stage_result }
          packets: { stage_result: runx.external_job_stage.result.v1 }

      - id: digest-failure
        when: { value: $steps.interpret.action.kind, equals: failed }
        tool: data.digest
        inputs:
          value: $steps.interpret.action.evidence

      - id: failed-result
        when: { value: $steps.interpret.action.kind, equals: failed }
        inputs:
          action: $steps.interpret.action
          digest_result: $steps.digest-failure.digest_result
        tool: { module: readback.mjs, export: finishMarketplaceFailure, timeout_seconds: 5 }
        outputs: { stage_result: { type: object } }
        artifacts:
          named_emits: { stage_result: stage_result }
          packets: { stage_result: runx.external_job_stage.result.v1 }

      - id: allocate-result
        when: { value: $steps.interpret.action.kind, equals: ready }
        operation: artifact/artifact.allocate
        # One result per vendor job, whichever readback lands it.
        idempotency_key: $steps.interpret.action.provider_job_ref.uri
        input:
          purpose: runx.marketplace.vendor-result.v1
          media_type: application/json
          value: $steps.interpret.action.result

      - id: digest-completion
        when: { value: $steps.interpret.action.kind, equals: ready }
        tool: data.digest
        inputs:
          value: $steps.interpret.action.evidence

      - id: ready-result
        when: { value: $steps.interpret.action.kind, equals: ready }
        inputs:
          action: $steps.interpret.action
          artifact_result: $steps.allocate-result.provider_operation.result
          digest_result: $steps.digest-completion.digest_result
        tool: { module: readback.mjs, export: finishMarketplaceReady, timeout_seconds: 5 }
        outputs: { stage_result: { type: object } }
        artifacts:
          named_emits: { stage_result: stage_result }
          packets: { stage_result: runx.external_job_stage.result.v1 }
