[package]
# Integration tests compile as a single binary (tests/integration.rs); see
# .scafld/specs/active/test-surface-build-consolidation.md.
autotests = false
name = "runx-cli"
# Kept in lockstep with packages/cli/package.json (the npm distribution line).
# The release workflow stamps this from the npm manifest before building.
version = "0.10.2"
publish = false
edition.workspace = true
rust-version.workspace = true
description = "Native launcher for the runx governed agent workflow CLI."
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["runx", "cli", "agents", "workflow", "receipts"]
categories = ["command-line-utilities", "development-tools"]
include = ["Cargo.toml", "README.md", "src/**/*.rs"]

[lints]
workspace = true

[features]
default = []

[dependencies]
base64 = "0.23.1"
chrono = "0.4.45"
ctrlc = "3.5.2"
ring = "0.17.14"
# A credential typed at a terminal is read without echo.
rpassword = "7.5.4"
runx-contracts.workspace = true
runx-parser.workspace = true
runx-receipts.workspace = true
runx-runtime = { workspace = true, features = ["mcp", "mcp-http-server", "agent", "store"] }
runx-x402.workspace = true
serde.workspace = true
serde_json.workspace = true
url.workspace = true

[dev-dependencies]
rusqlite = { version = "0.40.1", default-features = false, features = ["bundled"] }
rustix = { version = "1.1.4", features = ["process"] }

[[bin]]
name = "runx"
path = "src/main.rs"
test = false
bench = false

# Debian/Ubuntu packaging (cargo-deb). Built per-arch in CI with --target and
# attached to the GitHub Release.
[package.metadata.deb]
maintainer = "runxhq <dev@runx.ai>"
copyright = "2026, runxhq"
extended-description = "Native governed runtime for agent skills, tools, graphs, and packets."
section = "utils"
priority = "optional"
assets = [
    ["target/release/runx", "usr/bin/", "755"],
    ["target/release/runx-js-worker", "usr/bin/", "755"],
]

[[test]]
name = "integration"
path = "tests/integration.rs"
