[workspace]
members = [
    "runx-cli",
    "runx-contracts",
    "runx-core",
    "runx-js-worker",
    "runx-parser",
    "runx-contracts-derive",
    "runx-receipts",
    "runx-runtime",
    "runx-sdk",
    "runx-x402",
]
resolver = "3"

[workspace.dependencies]
dotenvy = "0.15.7"
fs2 = "0.4.3"
runx-contracts = { path = "runx-contracts", version = "0.1.0" }
runx-contracts-derive = { path = "runx-contracts-derive", version = "0.1.0" }
runx-core = { path = "runx-core", version = "0.1.0" }
runx-parser = { path = "runx-parser", version = "0.1.0" }
runx-receipts = { path = "runx-receipts", version = "0.0.2" }
runx-runtime = { path = "runx-runtime", version = "0.1.0" }
runx-x402 = { path = "runx-x402", version = "0.2.0" }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.149"
serde_path_to_error = "0.1.20"
serde_norway = "0.9.42"
sha2 = "0.11.0"
subtle = "2.6.1"
thiserror = "2.0.20"
url = "2.5.8"
zeroize = "1.9.0"

[workspace.package]
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/runxhq/runx"
homepage = "https://runx.ai"

# Release binaries are the hot local runtime path. Favor throughput first; npm
# platform packages can absorb the binary size tradeoff.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"

# Dev and test builds are the inner loop. Full debuginfo (debug = 2) is the
# dominant codegen and link cost on macOS; line tables keep backtraces useful
# while cutting both. Drop to 0 if you never attach a debugger.
[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
wildcard_imports = "deny"
