[package]
name = "runx-runtime"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Native Rust runtime for local runx execution, adapters, process supervision, harness replay, and receipts."
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["runx", "runtime", "agents", "governance", "mcp"]
categories = ["development-tools"]
include = ["Cargo.toml", "README.md", "assets/VOICE.md", "bundled-skills.json", "src/**/*.rs"]
# Integration tests are compiled as a single binary (tests/integration.rs) so the
# crate and its heavy deps link once instead of once per test file. Each test file
# is a module of that binary; see .scafld/specs/active/test-surface-build-consolidation.md.
autotests = false

[lints]
workspace = true

[features]
default = []
mcp = ["dep:rmcp", "rmcp/transport-streamable-http-client-reqwest", "dep:sse-stream", "dep:bytes", "dep:http-body-util", "tokio/process", "tokio/io-util", "tokio/sync"]
# Expose the governed MCP server over streamable HTTP/SSE (rmcp's tower service
# driven by hyper). Inbound HTTP server surface; gated behind its own feature.
mcp-http-server = [
    "mcp",
    "rmcp/transport-streamable-http-server",
    "dep:bytes",
    "dep:http",
    "dep:http-body-util",
    "dep:hyper",
    "dep:hyper-util",
    "dep:tower-service",
]
agent = []
# The store connector's Postgres and Redis backends; SQLite is always present.
store = ["dep:postgres", "dep:tokio-postgres-rustls", "dep:redis"]

[dependencies]
aes-gcm = "0.11.0"
base64 = "0.23.1"
dotenvy.workspace = true
fs2.workspace = true
bytes = { version = "1.11.1", optional = true }
http = { version = "1.4.0", optional = true }
http-body-util = { version = "0.1.5", optional = true }
httpdate = "1.0.3"
# SIMD substring search for credential redaction (already in the tree via regex).
memchr = "2.8.3"
runx-contracts.workspace = true
runx-core.workspace = true
runx-parser.workspace = true
runx-receipts.workspace = true
# gzip/brotli/deflate/zstd + http2 so the governed fetch transport negotiates and
# decodes like a real browser; a no-compression, http1-only client is a bot tell to
# Cloudflare and friends. The response cap measures DECODED bytes (streaming guard in
# read_response_body) when a caller sets one, so a decompression bomb stays bounded.
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider", "json", "gzip", "brotli", "deflate", "zstd", "http2"] }
ring = "0.17.14"
regex.workspace = true
# Ignore-file aware walking (`.gitignore`, `.ignore`) for the native listing
# and search tools, the same rules ripgrep applies.
ignore = "0.4.33"
globset = "0.4.20"
# Whether a lock's path still names the file a driver locked.
same-file = "1.0.6"
# The unified diff an edit's approval shows.
similar = "3.2.0"
rusqlite = { version = "0.40.1", default-features = false, features = ["backup", "bundled", "cache"] }
postgres = { version = "0.19.14", default-features = false, optional = true }
tokio-postgres-rustls = { version = "0.14.0", optional = true }
redis = { version = "1.7.1", default-features = false, features = ["script", "tls-rustls"], optional = true }
jsonschema = { version = "0.56.0", default-features = false }
# Drive rustls with the ring provider (already linked via `ring`) instead of
# reqwest's default aws-lc-rs, so the vendored aws-lc-sys C crypto blob is not
# compiled in. ring is then the single, unambiguous process-default provider.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-root-certs = "1.0.9"
rustix = { version = "1.1.4", features = ["fs", "process"] }
rmcp = { version = "=3.3.0", default-features = false, features = ["client", "server"], optional = true }
# Parse a remote MCP server's bounded SSE body into rmcp's event stream; the same
# version rmcp's client uses.
sse-stream = { version = "=0.2.5", optional = true }
# Drive rmcp's StreamableHttpService (a tower service) over a TCP listener for the
# MCP-over-HTTP server. Both crates are already in the tree via reqwest/rmcp.
hyper = { version = "=1.11.1", default-features = false, features = ["server", "http1"], optional = true }
# http1 only (MCP streamable-http is http1.1 + SSE); avoids pulling http2/h2 into
# the inbound server. service = TowerToHyperService, tokio = TokioIo.
hyper-util = { version = "=0.1.20", default-features = false, features = ["service", "tokio"], optional = true }
serde.workspace = true
serde_json.workspace = true
serde_path_to_error.workspace = true
sha2.workspace = true
hmac = "0.13.0"
subtle.workspace = true
thiserror.workspace = true
tempfile = "3.23.0"
tokio = { version = "=1.53.1", default-features = false, features = ["rt", "rt-multi-thread", "net", "time"] }
tower-service = { version = "0.3.3", optional = true }
url.workspace = true
wait-timeout = "0.2.1"
zeroize.workspace = true

[target.'cfg(unix)'.dependencies]
# A graceful stop on SIGTERM, beside ctrlc's forced interrupt on SIGINT.
signal-hook = { version = "0.4.5", default-features = false }

[target.'cfg(windows)'.dependencies]
# std::process does not expose race-free Job Object assignment. process-wrap
# creates children suspended, assigns them to a per-execution job, then resumes
# them; win32job owns the outer kill-on-close job that covers abrupt Runx exit.
process-wrap = { version = "=10.0.0", default-features = false, features = ["std", "tokio1", "job-object"] }
win32job = "2.0.3"

[dev-dependencies]
criterion = "0.8.2"
proptest = { version = "1.11.0", default-features = false, features = ["std"] }

[lib]
name = "runx_runtime"
path = "src/lib.rs"

[[test]]
name = "integration"
path = "tests/integration.rs"

[[bench]]
name = "graph_throughput"
harness = false
required-features = ["agent"]
