name: ci

env:
  CARGO_INCREMENTAL: "0"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A pull request's newer push supersedes its older run. A main push never
# cancels another: each run classifies only its own diff, so a cancelled push
# would leave its changes unverified.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  classify:
    runs-on: ubuntu-24.04
    outputs:
      full: ${{ steps.changes.outputs.full }}
      skills: ${{ steps.changes.outputs.skills }}
      core_skills: ${{ steps.changes.outputs.core_skills }}
      windows: ${{ steps.changes.outputs.windows }}
      release: ${{ steps.changes.outputs.release }}
      light: ${{ steps.changes.outputs.light }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan committed tree for secrets
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          scan_dir="$RUNNER_TEMP/gitleaks-tree"
          mkdir -p "$scan_dir"
          git archive --format=tar HEAD | tar -xf - -C "$scan_dir"
          "$RUNNER_TEMP/gitleaks" dir --redact --verbose --exit-code 1 "$scan_dir"

      - name: Classify affected proofs
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          node --test scripts/classify-ci-changes.test.mjs
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            base_ref=""
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_ref="${{ github.event.pull_request.base.sha }}"
          elif [[ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            base_ref="${{ github.event.before }}"
          else
            base_ref=""
          fi
          if [[ -z "$base_ref" ]]; then
            {
              echo "full=true"
              echo "skills=true"
              echo "core_skills=$(node --input-type=module -e 'import { bundledCoreSkills } from "./scripts/classify-ci-changes.mjs"; console.log(bundledCoreSkills().join(","))')"
              echo "windows=true"
              echo "release=true"
              echo "light=false"
              echo "summary=no stable diff base; running all checks"
            } >> "$GITHUB_OUTPUT"
          else
            node scripts/classify-ci-changes.mjs "$base_ref" HEAD
          fi

      - name: Check plan
        run: echo "${{ steps.changes.outputs.summary }}"

      - name: Setup pnpm for light checks
        if: steps.changes.outputs.light == 'true' || steps.changes.outputs.release == 'true'
        uses: pnpm/action-setup@v6
        with:
          version: 10.18.2

      - name: Setup Node for light checks
        if: steps.changes.outputs.light == 'true' || steps.changes.outputs.release == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies for light checks
        if: steps.changes.outputs.light == 'true' || steps.changes.outputs.release == 'true'
        run: pnpm install --frozen-lockfile

      - name: Documentation and release-surface checks
        if: steps.changes.outputs.light == 'true'
        run: |
          pnpm domains:check
          pnpm docs:api:check
          pnpm release:version:check
          node scripts/generate-runx-maintained-lock.mjs --check

      # Release tooling runs only in the release workflow, so a change to it is
      # proven here, cheaply: every release script parses, the version is in
      # sync, and the version's notes are complete.
      - name: Release tooling checks
        if: steps.changes.outputs.release == 'true'
        run: |
          bash -n scripts/publish-npm-tarball.sh
          bash -n scripts/pack-typescript-packages.sh
          for script in scripts/build-release-archives.ts scripts/check-rust-cli-release-artifacts.ts \
            scripts/check-runx-cli-release-notes.mjs scripts/global-npm-prefix.mjs \
            scripts/publish-winget-manifest.mjs scripts/release-platform-matrix.mjs \
            scripts/release-rust-cli.ts scripts/runx-cli-release-profile.mjs \
            scripts/set-release-version.ts scripts/smoke-released-cli-live.mjs scripts/smoke-runx-image.mjs; do
            node --check "$script"
          done
          pnpm release:version:check
          node scripts/check-runx-cli-release-notes.mjs --version "$(node -p "require('./packages/cli/package.json').version")"
          node scripts/check-publishable-package-manifests.mjs
          node --test scripts/build-channel-input.test.mjs scripts/check-publishable-package-manifests.test.mjs

  linux-checks:
    needs: classify
    if: needs.classify.outputs.full == 'true' || needs.classify.outputs.skills == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      RUNX_SKILL_VERSION_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.18.2

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # Only the pinned toolchain is installed before the cache key is taken:
      # the public API check installs its own pinned nightly when it runs, so
      # no toolchain outside rust-toolchain.toml can move the key.
      - name: Setup pinned Rust toolchain
        run: rustup show

      - name: Restore Rust CI tools
        if: needs.classify.outputs.full == 'true'
        id: rust-ci-tools
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/cargo-nextest
            ~/.cargo/bin/cargo-deny
            ~/.cargo/bin/cargo-public-api
          key: rust-ci-tools-${{ runner.os }}-${{ runner.arch }}-nextest-0.9.140-deny-0.20.2-public-api-0.51.0-v1

      - name: Install Rust test and advisory tools
        if: >-
          needs.classify.outputs.full == 'true' &&
          steps.rust-ci-tools.outputs.cache-hit != 'true'
        uses: taiki-e/install-action@v2.87.11
        with:
          # Prebuilt binaries avoid compiling CI-only tools on cache misses.
          # Keep cargo-public-api aligned with check-rust-kernel-parity.mjs.
          tool: cargo-nextest@0.9.140,cargo-deny@0.20.2,cargo-public-api@0.51.0

      - name: Verify Rust CI tools
        if: needs.classify.outputs.full == 'true'
        run: |
          cargo nextest --version
          cargo deny --version
          cargo public-api --version

      - name: Restore check caches
        uses: actions/cache@v6
        with:
          path: |
            node_modules/.cache/tsc
            .build
          key: ${{ runner.os }}-oss-checks-${{ hashFiles('pnpm-lock.yaml', 'package.json', 'tsconfig*.json', 'packages/**/tsconfig.json', 'packages/**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-oss-checks-

      # The one Linux debug cache: main writes it, and the release verify and
      # runtime quality jobs, which build the same workspace, restore it.
      - name: Cache Rust workspace
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates
          shared-key: linux-debug

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Fast correctness and drift gates
        if: needs.classify.outputs.full == 'true'
        run: |
          pnpm verify:fast
          pnpm verify:fast:plan-check

      - name: Build the core skill harness runtime
        if: needs.classify.outputs.skills == 'true' && needs.classify.outputs.full != 'true'
        # A core skill change runs against the real runtime, without the
        # fixture generators or the workspace-wide Rust corpora.
        run: cargo build -p runx-js-worker -p runx-cli --manifest-path crates/Cargo.toml

      - name: Heavy graph scenarios
        if: needs.classify.outputs.full == 'true'
        run: pnpm test:heavy:graph

      - name: Full Rust checks
        if: needs.classify.outputs.full == 'true'
        working-directory: crates
        run: |
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo nextest run --workspace --all-features --no-fail-fast
          cargo test --workspace --all-features --doc
          cargo package -p runx-cli --list

      - name: Rust license and dependency policy
        if: needs.classify.outputs.full == 'true'
        run: |
          cargo metadata --manifest-path crates/Cargo.toml --format-version 1 \
            | node scripts/check-license-edges.mjs --check edges
          cargo deny --manifest-path crates/Cargo.toml check advisories bans licenses sources

      - name: Rust public API snapshot
        if: needs.classify.outputs.full == 'true'
        run: node scripts/check-rust-kernel-parity.mjs --api-only

      # The core skills ship in the binary, so their bundle, audit and
      # harnesses are a CLI proof. Vendor skills are product content the
      # registry proves when it publishes them; CI runs none of them.
      - name: Core skills
        if: needs.classify.outputs.skills == 'true'
        run: |
          pnpm bundled-skills:check
          node scripts/audit-core-skills.mjs --check --json --runx-bin crates/target/debug/runx \
            --skills "${{ needs.classify.outputs.core_skills }}" > /dev/null
          node scripts/harness-sweep.mjs --runx-bin crates/target/debug/runx --no-build \
            --skills "${{ needs.classify.outputs.core_skills }}"

  windows-process-lifecycle:
    needs: classify
    if: needs.classify.outputs.windows == 'true'
    # Windows owns process-tree semantics that Linux cannot prove. Keep the lane
    # narrow and avoid repeating the workspace suite on a premium runner.
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Setup pinned Rust toolchain
        run: rustup show
      - name: Cache Rust workspace
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates
      - name: Prove Windows process trees and private files
        working-directory: crates
        run: cargo test -p runx-runtime -- windows_ private_file local_key signs_with_the_selected_home_key --test-threads=1 --nocapture
      - name: Prove watchdog timeout semantics
        run: node scripts/harness-sweep.mjs --self-test

  # Branch protection requires this stable aggregate context. Keep it as the
  # one merge wall while the two platform jobs remain independently visible.
  checks:
    if: always()
    runs-on: ubuntu-latest
    needs:
      - classify
      - linux-checks
      - windows-process-lifecycle
    steps:
      - name: Done
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          LINUX_RESULT: ${{ needs.linux-checks.result }}
          WINDOWS_RESULT: ${{ needs.windows-process-lifecycle.result }}
        run: |
          set -euo pipefail
          for result in "$CLASSIFY_RESULT" "$LINUX_RESULT" "$WINDOWS_RESULT"; do
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "CI lane ended with $result" >&2
              exit 1
            fi
          done
          echo "All affected CI lanes passed."
