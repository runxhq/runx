name: x402-pay-ledger-governed-refusal
steps:
  - id: quote
    skill: ../../skills/x402-pay-paid-echo-quote
    inputs:
      payment_signal:
        signal_type: effect_required
        challenge_id: ch_mock_paid_echo_cap_exceeded
        amount_minor: 125
        currency: USD
        rail: mock
        counterparty: merchant:paid-echo
        operation: paid.echo
  - id: reserve
    skill: ../../skills/x402-pay-negative-cap-exceeded-reserve
    context:
      payment_quote_packet: quote.payment_quote_packet.data
  - id: approve-spend
    ask: { gate: spend-approval, reason: Approve cap-exceeded payment fixture., type: payment }
    inputs:
      amount_minor: 125
      currency: USD
policy:
  guards:
    - step: approve-spend
      field: reserve.payment_reservation_packet.data.spend_capability_ref.uri
      equals: runx:payment-capability:paid-echo-spend-1
