name: x402-pay-negative-quote-drift
steps:
  - id: quote
    skill: ../../skills/x402-pay-paid-echo-quote
    inputs:
      payment_signal:
        signal_type: effect_required
        challenge_id: ch_mock_paid_echo_quote_drift
        amount_minor: 125
        currency: USD
        rail: mock
        counterparty: merchant:paid-echo
        operation: paid.echo
  - id: reserve
    skill: ../../skills/x402-pay-negative-quote-drift-reserve
    inputs:
      payment_quote_packet: $steps.quote.payment_quote_packet
  - id: approve-spend
    ask: { gate: spend-approval, reason: Approve quote-drift payment fixture., type: payment }
    inputs:
      amount_minor: 175
      currency: USD
  - id: fulfill
    skill: ../../skills/x402-pay-paid-echo-fulfill
    scopes:
      - payment:spend
    inputs:
      reserved_payment_authority: $steps.reserve.payment_reservation_packet.reserved_payment_authority
      spend_capability_ref: $steps.reserve.payment_reservation_packet.spend_capability_ref
      idempotency: $steps.reserve.payment_reservation_packet.idempotency
policy:
  guards:
    - step: fulfill
      value: $steps.approve-spend.approval_decision.approved
      equals: true
