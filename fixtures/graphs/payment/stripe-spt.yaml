name: stripe-spt-payment
steps:
  - id: quote
    skill: ../../skills/stripe-spt-quote
    inputs:
      payment_signal:
        signal_type: effect_required
        challenge_id: ch_stripe_spt_001
        amount_minor: 125
        currency: USD
        rail: stripe-spt
        counterparty: merchant:stripe-demo
        operation: search.paid
  - id: reserve
    skill: ../../skills/stripe-spt-reserve
    inputs:
      payment_quote_packet: $steps.quote.payment_quote_packet
  - id: approve-spend
    ask: { gate: stripe-spt.spend.approval, reason: Approve Stripe SPT settlement before rail execution., type: payment }
    inputs:
      amount_minor: 125
      currency: USD
  - id: fulfill
    skill: ../../skills/stripe-spt-fulfill
    scopes:
      - payment:spend
    inputs:
      payment_challenge:
        signal_type: effect_required
        challenge_id: ch_stripe_spt_001
        amount_minor: 125
        currency: USD
        rail: stripe-spt
        counterparty: merchant:stripe-demo
        operation: search.paid
      rail_profile_ref: rail-profile:stripe-spt:test
      reserved_payment_authority: $steps.reserve.payment_reservation_packet.reserved_payment_authority
      spend_capability_ref: $steps.reserve.payment_reservation_packet.spend_capability_ref
      idempotency: $steps.reserve.payment_reservation_packet.idempotency
      quote_packet: $steps.quote.payment_quote_packet
policy:
  guards:
    - step: fulfill
      value: $steps.approve-spend.approval_decision.approved
      equals: true
