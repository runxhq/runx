name: x402-pay-negative-cap-exceeded
steps:
  - id: quote
    skill: ../../skills/x402-pay-paid-echo-quote
    inputs:
      payment_signal:
        signal_type: effect_required
        challenge_id: ch_mock_paid_echo_cap_exceeded
        amount_minor: 125
        currency: USD
        rail: mock
        counterparty: merchant:paid-echo
        operation: paid.echo
  - id: reserve
    skill: ../../skills/x402-pay-negative-cap-exceeded-reserve
    context:
      payment_quote_packet: quote.payment_quote_packet.data
  - id: approve-spend
    ask: { gate: spend-approval, reason: Approve cap-exceeded payment fixture., type: payment }
    inputs:
      amount_minor: 125
      currency: USD
  - id: fulfill
    skill: ../../skills/x402-pay-paid-echo-fulfill
    scopes:
      - payment:spend
    idempotency_key: paid-echo-cap-exceeded-fulfill
    context:
      reserved_payment_authority: reserve.payment_reservation_packet.data.reserved_payment_authority
      spend_capability_ref: reserve.payment_reservation_packet.data.spend_capability_ref
      idempotency: reserve.payment_reservation_packet.data.idempotency
policy:
  guards:
    - step: fulfill
      field: approve-spend.approval_decision.data.approved
      equals: true
