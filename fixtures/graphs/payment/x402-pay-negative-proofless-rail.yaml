name: x402-pay-negative-proofless-rail
steps:
  - id: quote
    skill: ../../skills/x402-pay-paid-echo-quote
    inputs:
      payment_signal:
        signal_type: effect_required
        challenge_id: ch_mock_paid_echo_proofless_rail
        amount_minor: 125
        currency: USD
        rail: mock
        counterparty: merchant:paid-echo
        operation: paid.echo
  - id: reserve
    skill: ../../skills/x402-pay-paid-echo-reserve
    inputs:
      payment_quote_packet: $steps.quote.payment_quote_packet.data
  - id: approve-spend
    ask: { gate: spend-approval, reason: Approve proofless rail fixture., type: payment }
    inputs:
      amount_minor: 125
      currency: USD
  - id: fulfill
    skill: ../../skills/x402-pay-negative-proofless-fulfill
    scopes:
      - payment:spend
    inputs:
      reserved_payment_authority: $steps.reserve.payment_reservation_packet.data.reserved_payment_authority
      spend_capability_ref: $steps.reserve.payment_reservation_packet.data.spend_capability_ref
      idempotency: $steps.reserve.payment_reservation_packet.data.idempotency
  - id: echo
    skill: ../../skills/x402-pay-paid-echo-tool
    inputs:
      message: should not run
      payment_capability_ref: $steps.fulfill.effect_evidence_packet.data.credential_envelope.credential_ref
      payment_proof_ref: $steps.fulfill.effect_evidence_packet.data.rail_proof.proof_ref
policy:
  guards:
    - step: fulfill
      value: $steps.approve-spend.approval_decision.data.approved
      equals: true
