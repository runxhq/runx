schema: runx.connector.v1
id: fixture/tracker
name: Fixture Tracker
description: Read bounded team issues of a tracker fixture.
runtime_capability: false
auth:
  credentials:
    access_token:
      kind: oauth2
      fields:
        - {name: access_token, label: tracker OAuth access token}
      delivery: {env: TRACKER_ACCESS_TOKEN}
      audience: [tracker.fixture.invalid]
    api_key:
      kind: api_key
      fields:
        - {name: api_key, label: tracker API key}
      delivery: {env: TRACKER_API_KEY}
      audience: [tracker.fixture.invalid]
placements:
  local:
    auth: [credentials]
  hosted: {auth: credential, credential: api_key}
operations:
  issues.list:
    description: Read one bounded page of issues from the exact selected team; preserves provider continuation metadata.
    verb: read
    scopes: [read]
    credentials: [access_token, api_key]
    hosted: {}
    target:
      template: {$concat: ['https://tracker.fixture.invalid/team/', {$argument: /team_id}, '/issues']}
    input_schema:
      type: object
      additionalProperties: false
      required: [team_id, limit]
      properties:
        team_id: {type: string, pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'}
        limit: {type: integer, minimum: 1, maximum: 100}
        after: {type: string, minLength: 1, maxLength: 4096}
    result_fields: [issues]
    implementation:
      http:
        allowed_hosts: [tracker.fixture.invalid]
        auth:
          access_token: {type: bearer, field: access_token}
          api_key: {type: header, name: authorization, field: api_key}
        requests:
          - method: POST
            url: https://tracker.fixture.invalid/graphql
            headers: {accept: application/json}
            body:
              query: >-
                query TeamIssues($team: String!, $first: Int!, $after: String) {
                  team(id: $team) {
                    id name
                    issues(first: $first, after: $after) {
                      nodes { id identifier title description url createdAt updatedAt archivedAt
                        state { id name type } assignee { id name } project { id name } }
                      pageInfo { hasNextPage endCursor }
                    }
                  }
                }
              variables: {team: {$argument: /team_id}, first: {$argument: /limit}, after: {$argument: /after}}
        decode:
          - {op: auto_json}
          - {op: reject_present, path: /errors}
          - {op: field, path: /data}
