schema: runx.connector.v1
id: fixture/forum
name: Fixture Forum
description: Read recent posts on a forum fixture and publish posts as an agent account.
runtime_capability: false
auth:
  credentials:
    api_key:
      kind: api_key
      fields:
        - name: api_key
          label: forum API key
      delivery:
        env: FORUM_API_KEY
      audience: [forum.fixture.invalid]
placements:
  local:
    auth: [credentials]
operations:
  feed.scan:
    description: Read one page of the newest posts, optionally in one submolt.
    verb: read
    scopes: [feed.read]
    credentials: [api_key]
    target:
      template: "https://forum.fixture.invalid/api/v1/posts"
    input_schema:
      type: object
      required: [limit]
      additionalProperties: false
      properties:
        limit: {type: integer, minimum: 1, maximum: 100}
        submolt: {type: string, pattern: '^[A-Za-z0-9_-]{1,64}$'}
    result_fields: [posts]
    implementation:
      http:
        allowed_hosts: [forum.fixture.invalid]
        auth: {api_key: {type: bearer, field: api_key}}
        requests:
          - method: GET
            url: "https://forum.fixture.invalid/api/v1/posts"
            query:
              sort: new
              limit: {"$argument": "/limit"}
              submolt: {"$argument": "/submolt"}
            headers: {accept: application/json}
        result_paths:
          posts: acknowledgement.posts
