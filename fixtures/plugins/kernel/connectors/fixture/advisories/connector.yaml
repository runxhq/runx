schema: runx.connector.v1
name: fixture/advisories
title: Fixture Advisories
description: Read advisory records from an advisory fixture by id.
auth:
  none: {}
placements:
  local:
    auth: [none]
operations:
  vulnerabilities.read:
    description: Read complete advisory records by id.
    verb: read
    scopes: [vulnerabilities.read]
    target:
      template: "https://advisories.fixture.invalid/v1/vulns"
    input_schema:
      type: object
      required: [ids]
      additionalProperties: false
      properties:
        ids:
          type: array
          maxItems: 50
          uniqueItems: true
          items: {type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{0,99}$"}
    result_fields: [advisories]
    implementation:
      http:
        allowed_hosts: [advisories.fixture.invalid]
        requests:
          - each: {"$argument": "/ids"}
            http_method: GET
            url: {"$concat": ["https://advisories.fixture.invalid/v1/vulns/", {"$item": ""}]}
