schema: runx.connector.v1
name: fixture/browser
title: Fixture Browser
description: Account-bound local browser identity and process execution fixture.
auth:
  session:
    kind: host_browser
    process: {tool: browser.probe}
parameters:
  type: object
  additionalProperties: false
  required: [account]
  properties:
    account: {type: string, minLength: 1}
placements:
  local: {auth: [session]}
operations:
  account.inspect:
    description: Read one bound account.
    verb: read
    scopes: [browser.read]
    target: {template: 'browser://account'}
    implementation:
      process: {tool: browser.probe}
