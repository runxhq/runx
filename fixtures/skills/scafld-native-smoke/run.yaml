version: "0.1.0"
minimum_runx: 0.12.0
methods:
  default:
    inputs:
      task_id:
        type: string
        description: Optional scafld task id for the smoke workspace.
        optional: true
      title:
        type: string
        description: Optional task title.
        optional: true
      scafld_bin:
        type: string
        description: Explicit scafld executable path; defaults to SCAFLD_BIN.
        optional: true
    steps:
      - id: default
        tool: {command: python3, args: [./run.py], timeout_seconds: 60}
        inputs:
          task_id: $input.task_id
          title: $input.title
          scafld_bin: $input.scafld_bin
        outputs:
          ok: {type: boolean}
          scafld_version: {type: string}
          task_id: {type: string}
          init: {type: object}
          plan: {type: object}
          validate: {type: object}
          approve: {type: object}
          build: {type: object}
          status: {type: object}
          handoff: {type: string}
          steps: {type: array}
