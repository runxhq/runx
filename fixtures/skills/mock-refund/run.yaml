version: "0.5.0"
minimum_runx: 0.12.0
catalog:
  visibility: internal
  category: payments
methods:
  mock:
    inputs:
      original_receipt_ref: {type: string}
      refund_request: {}
      parent_payment_authority: {}
      idempotency_key: {type: string}
    result_from: [simulate]
    steps:
      - id: simulate
        inputs:
          original_receipt_ref: $input.original_receipt_ref
          refund_request: $input.refund_request
          parent_payment_authority: $input.parent_payment_authority
          idempotency_key: $input.idempotency_key
        tool: {module: mock-refund.mjs, export: simulateRefund}
        outputs:
          refund_result: {type: object}
