skill: mock-refund
version: "0.5.0"
catalog:
  kind: graph
  audience: builder
  visibility: internal
  role: harness-fixture
  part_of: [runx/refund]
  execution: read
  completion: runtime_receipt
  approval: none
  category: payments
harness:
  cases:
    - name: mock-refund-remains-local
      inputs:
        original_receipt_ref: receipt:mock:charge-001
        refund_request: { amount_minor: 125, currency: USD, reason: test }
        parent_payment_authority: { term_id: authority:mock }
        idempotency_key: mock-refund-001
      expect:
        status: sealed
        steps: [simulate]
        step_outputs:
          simulate:
            subset:
              refund_result:
                data: { status: simulated, settlement_family: mock, amount_minor: 125, currency: USD }
        receipt: { schema: runx.receipt.v1 }
runners:
  mock:
    default: true
    inputs:
      original_receipt_ref: { type: string, required: true }
      refund_request: { type: json, required: true }
      parent_payment_authority: { type: json, required: true }
      idempotency_key: { type: string, required: true }
    result_from: [simulate]
    steps:
      - id: simulate
        inputs:
          original_receipt_ref: $input.original_receipt_ref
          refund_request: $input.refund_request
          parent_payment_authority: $input.parent_payment_authority
          idempotency_key: $input.idempotency_key
        tool: { module: mock-refund.mjs, export: simulateRefund }
        outputs:
          refund_result: object
        artifacts:
          named_emits: { refund_result: refund_result }
