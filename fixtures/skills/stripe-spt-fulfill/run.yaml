skill: pay-fulfill-rail
version: "0.1.0"
runners:
  default:
    default: true
    inputs:
      reserved_payment_authority:
        type: object
        required: true
      spend_capability_ref:
        type: object
        required: true
      idempotency:
        type: object
        required: true
      quote_packet:
        type: object
        required: true
      payment_challenge:
        type: object
        required: true
      rail_profile_ref:
        type: string
        required: true
    steps:
      - id: default
        tool: { command: sh, args: [./run.sh], timeout_seconds: 10 }
        inputs:
          reserved_payment_authority: $input.reserved_payment_authority
          spend_capability_ref: $input.spend_capability_ref
          idempotency: $input.idempotency
          quote_packet: $input.quote_packet
          payment_challenge: $input.payment_challenge
          rail_profile_ref: $input.rail_profile_ref
        artifacts:
          named_emits:
            effect_evidence_packet: runx.payment.effect_evidence_packet.v1
