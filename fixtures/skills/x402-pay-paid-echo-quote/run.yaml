skill: pay-quote
version: "0.1.0"
runners:
  default:
    default: true
    inputs:
      payment_signal:
        type: object
        required: true
    steps:
      - id: default
        tool: { command: sh, args: [./run.sh], timeout_seconds: 10 }
        inputs:
          payment_signal: $input.payment_signal
        artifacts:
          named_emits:
            payment_quote_packet: runx.payment.payment_quote_packet.v1
