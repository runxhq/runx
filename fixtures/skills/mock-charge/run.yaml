version: "0.5.0"
minimum_runx: 0.12.0
catalog:
  visibility: internal
  category: payments
methods:
  mock:
    inputs:
      mcp_tool_call: {}
      provider_policy: {}
      idempotency_seed: {type: string}
    result_from: [simulate]
    steps:
      - id: simulate
        inputs:
          mcp_tool_call: $input.mcp_tool_call
          provider_policy: $input.provider_policy
          idempotency_seed: $input.idempotency_seed
        tool: {module: mock-charge.mjs, export: simulateCharge}
        outputs:
          charge_result: {type: object}
