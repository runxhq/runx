skill: mock-pay
version: "0.4.0"
catalog:
  kind: graph
  audience: builder
  visibility: internal
  role: harness-fixture
  part_of: [runx/spend]
  execution: read
  completion: runtime_receipt
  approval: none
  category: payments
harness:
  cases:
    - name: mock-pay-remains-local
      inputs:
        payment_signal: { challenge_id: ch_mock_001, amount_minor: 125, currency: USD, rail: mock, counterparty: merchant:demo }
        parent_payment_authority: { term_id: authority:mock }
        idempotency_seed: mock-pay-001
      expect:
        status: sealed
        steps: [simulate]
        step_outputs:
          simulate:
            subset:
              payment_result:
                data: { status: simulated, rail: mock, amount_minor: 125, currency: USD }
        receipt: { schema: runx.receipt.v1 }
runners:
  mock:
    default: true
    inputs:
      payment_signal: { type: json, required: true, description: Mock payment signal. }
      parent_payment_authority: { type: json, required: true, description: Mock authority evidence. }
      idempotency_seed: { type: string, required: true, description: Stable mock idempotency material. }
    result_from: [simulate]
    steps:
      - id: simulate
        inputs:
          payment_signal: $input.payment_signal
          parent_payment_authority: $input.parent_payment_authority
          idempotency_seed: $input.idempotency_seed
        tool: { module: mock-pay.mjs, export: simulatePayment }
        outputs:
          payment_result: object
        artifacts:
          named_emits: { payment_result: payment_result }
