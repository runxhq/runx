version: "0.4.0"
minimum_runx: 0.12.0
catalog:
  visibility: internal
  category: payments
methods:
  mock:
    inputs:
      payment_signal: {description: Mock payment signal.}
      parent_payment_authority: {description: Mock authority evidence.}
      idempotency_seed: {type: string, description: Stable mock idempotency material.}
    result_from: [simulate]
    steps:
      - id: simulate
        inputs:
          payment_signal: $input.payment_signal
          parent_payment_authority: $input.parent_payment_authority
          idempotency_seed: $input.idempotency_seed
        tool: {module: mock-pay.mjs, export: simulatePayment}
        outputs:
          payment_result: {type: object}
