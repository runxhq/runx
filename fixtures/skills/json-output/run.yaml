version: "0.1.0"
minimum_runx: 0.12.0
methods:
  default:
    inputs:
      message:
        type: string
        optional: true
      recommendation:
        type: string
        optional: true
      confidence:
        type: number
        optional: true
      risk_score:
        type: number
        optional: true
      budget:
        type: string
        optional: true
    steps:
      - id: default
        tool: {command: sh, args: [./run.sh]}
        inputs:
          message: $input.message
          recommendation: $input.recommendation
          confidence: $input.confidence
          risk_score: $input.risk_score
          budget: $input.budget
        outputs:
          result: {}
        result_as: result
