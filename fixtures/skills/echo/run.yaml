skill: echo
version: "0.1.0"

catalog:
  kind: skill
  audience: system
  visibility: internal
  role: harness-fixture
  part_of: [cli-parity]

harness:
  cases:
    - name: echo-alpha
      inputs:
        message: alpha
      expect:
        status: sealed
    - name: echo-beta
      inputs:
        message: beta
      expect:
        status: sealed

runners:
  default:
    default: true
    inputs:
      message:
        type: string
        required: true
        description: Message to echo.
    steps:
      - id: default
        tool: { command: sh, args: [./run.sh] }
        inputs:
          message: $input.message
        outputs:
          message: string
