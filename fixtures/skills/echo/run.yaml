version: "0.1.0"
minimum_runx: 0.12.0

catalog:
  visibility: internal

methods:
  default:
    inputs:
      message:
        type: string
        description: Message to echo.
    steps:
      - id: default
        tool: {command: sh, args: [./run.sh]}
        inputs:
          message: $input.message
        outputs:
          message: {type: string}
