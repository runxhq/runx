schema: runx.connector.v1
id: aws
name: AWS
description: Store and read S3 objects and run Textract and Transcribe jobs in one AWS account.
auth:
  credentials:
    access_key:
      kind: aws_credentials_v1
      fields:
        - {name: region, label: AWS region, secret: false}
        - {name: account_id, label: AWS account ID, secret: false}
        - {name: access_key_id, label: AWS access key ID}
        - {name: secret_access_key, label: AWS secret access key}
        - {name: session_token, label: AWS session token, required: false}
      delivery:
        env: AWS_CREDENTIALS
      audience: ["*.amazonaws.com"]
placements:
  hosted:
    auth: credential
    credential: access_key
operations:
  aws.s3.put:
    description: Write one object of at most 10 MiB to an S3 bucket.
    verb: write
    scopes: [aws.s3.write]
    target:
      template: {"$argument": "/target"}
    readback: aws.s3.head
    result_fields: [object_ref, content_digest, size_bytes, version_ref, recovered]
    hosted: {}
  aws.s3.head:
    description: Read the metadata of one S3 object.
    verb: read
    scopes: [aws.s3.read]
    target:
      template: {"$argument": "/target"}
    result_fields: [object_ref, content_digest, size_bytes, version_ref]
    hosted: {}
  aws.s3.get:
    description: Read the bytes of one S3 object of at most 10 MiB.
    verb: read
    scopes: [aws.s3.read]
    target:
      template: {"$argument": "/target"}
    result_fields: [object_ref, content_digest, size_bytes, version_ref, data_base64]
    hosted: {}
  aws.s3.delete:
    description: Delete one object from an S3 bucket.
    verb: write
    scopes: [aws.s3.write]
    target:
      template: {"$argument": "/target"}
    result_fields: [object_ref, size_bytes, version_ref, recovered]
    hosted: {}
  aws.textract.detect:
    description: Detect the text lines in one document of at most 5 MiB with Textract.
    verb: read
    scopes: [aws.textract.read]
    target:
      template: {"$argument": "/target"}
    result_fields: [document_ref, lines]
    hosted: {}
  aws.textract.analysis.start:
    description: Start a Textract document analysis job on one S3 object.
    verb: write
    scopes: [aws.textract.execute]
    target:
      template: {"$argument": "/target"}
    readback: aws.textract.analysis.inspect
    guarantees:
      provider_idempotency: enforced
    result_fields: [job_ref, status, blocks]
    hosted: {}
  aws.textract.analysis.inspect:
    description: Read the status and blocks of a Textract analysis job.
    verb: read
    scopes: [aws.textract.read]
    target:
      template: {"$argument": "/target"}
    result_fields: [job_ref, status, blocks, next_token, failure_reason]
    hosted: {}
  aws.transcribe.start:
    description: Start a Transcribe job on one S3 media object.
    verb: write
    scopes: [aws.transcribe.execute]
    target:
      template: {"$argument": "/target"}
    readback: aws.transcribe.inspect
    guarantees:
      provider_idempotency: enforced
    result_fields: [job_ref, status, output_available, failure_reason, recovered]
    hosted: {}
  aws.transcribe.inspect:
    description: Read the status of a Transcribe job.
    verb: read
    scopes: [aws.transcribe.read]
    target:
      template: {"$argument": "/target"}
    result_fields: [job_ref, status, output_available, failure_reason]
    hosted: {}
