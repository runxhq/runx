schema: runx.connector.v1
id: ausca-inbox
name: Ausca Inbox
description: Provision and extend Ausca agent inboxes for paid invocations.
category: agent-tools
runtime_capability: false
auth:
  credentials:
    service_token:
      kind: service_token_v1
      fields:
        - {name: schema, label: Ausca inbox credential schema, secret: false}
        - {name: origin, label: Ausca inbox service origin, secret: false}
        - {name: token, label: Ausca inbox service token}
      delivery:
        env: AUSCA_INBOX_SERVICE_TOKEN
      audience: [inbox.ausca.com]
placements:
  hosted:
    auth: credential
    credential: service_token
    callers: runtime
operations:
  ausca.inbox.provision:
    description: Provision one agent inbox for the current paid invocation.
    verb: write
    scopes: [ausca.inbox.provision]
    target:
      template: "ausca:agent-inbox"
    hosted: {}
  ausca.inbox.extend:
    description: Extend the lifetime of one agent inbox.
    verb: write
    scopes: [ausca.inbox.extend]
    target:
      template: "ausca:agent-inbox"
    hosted: {}
