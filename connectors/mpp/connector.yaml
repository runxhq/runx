schema: runx.connector.v1
id: mpp
name: Machine Payments Protocol
description: Charge, pay, refund and settle invoices on the Machine Payments Protocol rail. Declared only; no placement implements it yet.
auth:
  delegated: {}
placements:
  hosted:
    auth: delegated
operations:
  payment.charge:
    description: Charge one admitted paid call with the caller's settlement credential.
    verb: write
    scopes: [payment.charge]
    target:
      template: {"$argument": "/provider_policy/counterparty"}
    approval: required
    amount: required
    readback: payment.charge.read
    input_schema:
      type: object
      required: [mcp_tool_call, provider_policy, credential_ref, verify_capability_ref]
      additionalProperties: false
      properties:
        mcp_tool_call: {type: object}
        provider_policy:
          type: object
          required: [counterparty]
          properties:
            counterparty: {type: string, minLength: 1}
        credential_ref: {type: string, minLength: 1}
        verify_capability_ref: {type: string, minLength: 1}
    result_fields: [charge_ref, settlement_family, status, credential_ref]
  payment.charge.read:
    description: Read back one charge.
    verb: read
    scopes: [payment.charge.read]
    target:
      template: {"$argument": "/charge_ref"}
    input_schema:
      type: object
      required: [charge_ref]
      properties:
        charge_ref: {type: string, minLength: 1}
    result_fields: [charge_ref, settlement_family, status, credential_ref]
  payment.refund:
    description: Refund part or all of one settled payment under its parent authority.
    verb: write
    scopes: [payment.refund]
    target:
      template: {"$argument": "/original_receipt_ref"}
    approval: required
    amount: required
    readback: payment.refund.read
    input_schema:
      type: object
      required: [original_receipt_ref, refund_request, parent_payment_authority]
      additionalProperties: false
      properties:
        original_receipt_ref: {type: string, minLength: 1}
        refund_request: {type: object}
        parent_payment_authority: {type: object}
    result_fields: [refund_ref, original_receipt_ref, amount_minor, currency, status]
  payment.refund.read:
    description: Read back one refund.
    verb: read
    scopes: [payment.refund.read]
    target:
      template: {"$argument": "/original_receipt_ref"}
    input_schema:
      type: object
      required: [refund_ref, original_receipt_ref]
      properties:
        refund_ref: {type: string, minLength: 1}
        original_receipt_ref: {type: string, minLength: 1}
    result_fields: [refund_ref, original_receipt_ref, amount_minor, currency, status]
  payment.spend:
    description: Pay one payment requirement under a parent spend authority.
    verb: write
    scopes: [payment.spend]
    target:
      template: {"$argument": "/payment_signal/counterparty"}
    approval: required
    amount: required
    readback: payment.spend.read
    input_schema:
      type: object
      required: [payment_signal, parent_payment_authority, rail_profile_ref]
      additionalProperties: false
      properties:
        payment_signal:
          type: object
          required: [counterparty]
          properties:
            counterparty: {type: string, minLength: 1}
        parent_payment_authority: {type: object}
        rail_profile_ref: {type: string, minLength: 1}
        payment_admission: {type: object}
        realm: {type: string}
    result_fields: [payment_ref, rail, amount_minor, currency, status]
  payment.spend.read:
    description: Read back one payment.
    verb: read
    scopes: [payment.spend.read]
    target:
      template: {"$argument": "/payment_ref"}
    input_schema:
      type: object
      required: [payment_ref]
      properties:
        payment_ref: {type: string, minLength: 1}
    result_fields: [payment_ref, rail, amount_minor, currency, status]
  payment.invoice.settle:
    description: Settle one invoice to its payee under a parent payment authority.
    verb: write
    scopes: [payment.invoice.settle]
    target:
      template: {"$argument": "/invoice_ref"}
    approval: required
    amount: required
    readback: payment.invoice.read
    input_schema:
      type: object
      required: [invoice_ref, amount_minor, currency, payee, rail_profile_ref, parent_payment_authority]
      additionalProperties: false
      properties:
        invoice_ref: {type: string, minLength: 1}
        amount_minor: {type: integer, minimum: 1}
        currency: {type: string, pattern: '^[A-Z]{3}$'}
        payee: {type: object}
        rail_profile_ref: {type: string, minLength: 1}
        parent_payment_authority: {type: object}
        realm: {type: string}
    result_fields: [payment_ref, invoice_ref, amount_minor, currency, status]
  payment.invoice.read:
    description: Read back one invoice settlement.
    verb: read
    scopes: [payment.invoice.read]
    target:
      template: {"$argument": "/invoice_ref"}
    input_schema:
      type: object
      required: [invoice_ref]
      properties:
        invoice_ref: {type: string, minLength: 1}
        payment_ref: {type: string}
    result_fields: [payment_ref, invoice_ref, amount_minor, currency, status]
