schema: runx.connector.v1
id: google/analytics
name: Google Analytics
description: Read Google Analytics 4 properties, metadata and reports.
category: analytics
runtime_capability: false
auth:
  delegated: {principal: {url: "https://openidconnect.googleapis.com/v1/userinfo", id: sub, login: sub}}
placements:
  hosted:
    auth: delegated
operations:
  properties.list:
    description: List the Analytics properties the connected account can read.
    verb: read
    scopes: [properties.read]
    target:
      template: "google-analytics://properties"
    result_fields: [properties]
    hosted:
      provider_scopes: ["https://www.googleapis.com/auth/analytics.readonly", "openid"]
  metadata.get:
    description: Read the dimensions and metrics available on a property.
    verb: read
    scopes: [metadata.read]
    target:
      template: {"$argument": "/property"}
    result_fields: [property, dimensions, metrics, fetched_at]
    hosted:
      provider_scopes: ["https://www.googleapis.com/auth/analytics.readonly", "openid"]
  reports.run:
    description: Run a standard report on a property.
    verb: read
    scopes: [reports.read]
    target:
      template: {"$argument": "/property"}
    result_fields: [property, request, dimension_headers, metric_headers, rows, row_count, pagination, metadata, property_quota, fetched_at]
    hosted:
      provider_scopes: ["https://www.googleapis.com/auth/analytics.readonly", "openid"]
  reports.run_realtime:
    description: Run a realtime report on a property.
    verb: read
    scopes: [reports.realtime.read]
    target:
      template: {"$argument": "/property"}
    result_fields: [property, request, dimension_headers, metric_headers, rows, row_count, pagination, metadata, property_quota, fetched_at]
    hosted:
      provider_scopes: ["https://www.googleapis.com/auth/analytics.readonly", "openid"]
