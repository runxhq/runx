schema: runx.connector.v1
id: google/calendar
name: Google Calendar
description: Read Google Calendar events and busy intervals.
category: productivity
runtime_capability: false
auth:
  delegated: {principal: {url: "https://openidconnect.googleapis.com/v1/userinfo", id: sub, login: sub}}
placements:
  hosted:
    auth: delegated
operations:
  events.list:
    description: List events on a calendar within a window of at most 30 days.
    verb: read
    scopes: [events.read]
    target:
      template: {"$argument": "/calendar_id"}
    result_fields: [calendar_id, time_min, time_max, events, complete, next_page_token, fetched_at]
    hosted:
      provider_scopes: ["https://www.googleapis.com/auth/calendar.events.readonly", "openid"]
  freebusy.query:
    description: Read busy intervals on a calendar within a window of at most 30 days.
    verb: read
    scopes: [freebusy.read]
    target:
      template: {"$argument": "/calendar_id"}
    result_fields: [calendar_id, time_min, time_max, complete, errors, busy, fetched_at]
    hosted:
      provider_scopes: ["https://www.googleapis.com/auth/calendar.events.freebusy", "openid"]
