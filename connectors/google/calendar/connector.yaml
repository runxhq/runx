schema: runx.connector.v1
name: google/calendar
title: Google Calendar
description: Read Google Calendar events and busy intervals.
category: productivity
auth:
  delegated: {principal: {url: "https://openidconnect.googleapis.com/v1/userinfo", id: sub, login: sub}}
placements:
  hosted:
    auth: delegated
operations:
  events.list:
    description: Read one bounded page of expanded calendar events within a selected window. Pass page_token to continue the same query.
    verb: read
    cost: {usd_micro: 0, per: request, source: docs, source_url: 'https://developers.google.com/workspace/calendar/api/guides/quota'}
    scopes: [events.read]
    target:
      template: {"$argument": "/calendar_id"}
    result_fields: [calendar_id, time_min, time_max, events, page_token, complete, next_page_token, fetched_at]
    provider_scopes: ["https://www.googleapis.com/auth/calendar.events.readonly", "openid"]
  freebusy.query:
    description: Read busy intervals on a calendar within a selected positive window.
    verb: read
    cost: {usd_micro: 0, per: request, source: docs, source_url: 'https://developers.google.com/workspace/calendar/api/guides/quota'}
    scopes: [freebusy.read]
    target:
      template: {"$argument": "/calendar_id"}
    result_fields: [calendar_id, time_min, time_max, complete, errors, busy, fetched_at]
    provider_scopes: ["https://www.googleapis.com/auth/calendar.events.freebusy", "openid"]
