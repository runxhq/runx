schema: runx.connector.v1
name: slack
title: Slack
description: Search, read and post messages in Slack workspaces.
category: communication
auth:
  delegated: {principal: {url: "https://slack.com/api/auth.test", id: user_id, login: user}}
placements:
  hosted:
    auth: delegated
references:
  - {kind: thread, locator: "slack://[^/]+/[^/]+/[0-9]+\\.[0-9]+"}
operations:
  messages.search:
    description: Search messages the connected member can see.
    verb: read
    scopes: [messages.search]
    target:
      template: "slack://messages"
    result_fields: [provider, external_tenant_ref, connected_subject_ref, messages, next_cursor]
    provider_scopes: ["search:read.public", "search:read.private", "search:read.im", "search:read.mpim"]
  thread.read:
    description: Read one page of messages in a thread.
    verb: read
    scopes: [thread.read]
    target:
      template: {"$argument": "/thread_locator"}
    result_fields: [provider, external_tenant_ref, connected_subject_ref, thread_locator, messages, next_cursor]
    provider_scopes: ["channels:history", "groups:history", "im:history", "mpim:history"]
  thread.reply:
    description: Reply in a thread.
    verb: write
    scopes: [thread.reply]
    target:
      template: {"$argument": "/thread_locator"}
    result_fields: [provider, external_tenant_ref, connected_subject_ref, conversation_locator, thread_locator, message_locator, occurred_at, content_digest, idempotency_key]
    provider_scopes: ["chat:write"]
  thread.reply.read:
    description: Read back one reply in a thread.
    verb: read
    scopes: [thread.reply.read]
    target:
      template: {"$argument": "/thread_locator"}
    result_fields: [provider, external_tenant_ref, connected_subject_ref, conversation_locator, thread_locator, message_locator, occurred_at, content_digest]
    provider_scopes: ["channels:history", "groups:history", "im:history", "mpim:history"]
  file.read:
    description: Read one image file attached to a message.
    verb: read
    scopes: [file.read]
    target:
      template: {"$argument": "/file_locator"}
    result_fields: [provider, external_tenant_ref, connected_subject_ref, file_locator, name, mimetype, size_bytes, image_width, image_height, content_digest, data_base64]
    provider_scopes: ["files:read"]
  channel.post:
    description: Post a message to a channel.
    verb: write
    scopes: [channel.post]
    target:
      template: {"$argument": "/channel_locator"}
      pattern: "slack://[^/]+/[^/]+"
    approval: required
    idempotency_key_format: uuid
    result_fields: [provider, external_tenant_ref, connected_subject_ref, conversation_locator, message_locator, occurred_at, content_digest, idempotency_key]
    effect:
      kind: thread
      locator: {"$result": "/message_locator"}
    provider_scopes: ["chat:write"]
  channel.post.read:
    description: Read back one message posted to a channel.
    verb: read
    scopes: [channel.post.read]
    target:
      template: {"$argument": "/conversation_locator"}
    result_fields: [provider, external_tenant_ref, connected_subject_ref, conversation_locator, message_locator, occurred_at, content_digest]
    provider_scopes: ["channels:history", "groups:history", "im:history", "mpim:history"]
