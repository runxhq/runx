schema: runx.connector.v1
id: nitrosend
name: Nitrosend
description: Review email content and import consented contacts in Nitrosend.
auth:
  credentials:
    api_key:
      kind: api_key
      fields:
        - name: api_key
          label: Nitrosend API key
          prefixes: [nskey_live_, nskey_test_]
      delivery:
        env: NITROSEND_API_KEY
      audience: [api.nitrosend.com]
placements:
  hosted:
    auth: credential
    credential: api_key
  local:
    auth: [credentials]
    mcp_server:
      transport: streamable_http
      url: "https://api.nitrosend.com/mcp"
      auth: {api_key: {type: bearer, field: api_key}}
      headers:
        x-brand-sid: {"$argument": "/brand_sid"}
operations:
  content.review:
    description: Review an email subject and HTML for accessibility and spam signals.
    verb: read
    scopes: [content.review]
    credentials: [api_key]
    target:
      template: "nitrosend://content-review"
    input_schema:
      type: object
      required: [subject, html]
      additionalProperties: false
      properties:
        subject: {type: string, maxLength: 998, description: At most 998 UTF-8 bytes, one RFC 5322 header line.}
        html: {type: string, minLength: 1, maxLength: 262144, description: At most 262144 UTF-8 bytes.}
        timeout_ms: {type: integer, minimum: 1, maximum: 120000}
    result_fields: [subject, html_size_bytes, html_digest, text_preview, text_length, accessibility, spam_score, warnings]
    hosted: {}
  contacts.import.preview:
    description: Validate one consented local CSV of contacts against its import reservation without uploading it.
    verb: read
    scopes: ["nitrosend:read"]
    credentials: [api_key]
    target:
      template: {"$argument": "/source_id"}
    input_schema:
      type: object
      required: [csv_path, source_id, consent_basis, dry_run]
      additionalProperties: false
      properties:
        csv_path: {type: string, minLength: 1}
        source_id: {type: string, minLength: 1}
        consent_basis: {type: string, minLength: 1}
        columns: {type: object}
        options: {type: object}
        dry_run: {const: true}
        brand_sid: {type: string, pattern: "^[A-Za-z0-9_-]{1,64}$"}
    implementation:
      process:
        tool: nitrosend.bulk_import
        runtime_scopes: ["net:http", "fs:read"]
  contacts.import:
    description: Upload and import one consented local CSV of contacts. The import completes asynchronously; entities.query reads it.
    verb: write
    scopes: ["nitrosend:write"]
    credentials: [api_key]
    target:
      template: {"$argument": "/source_id"}
    approval: required
    guarantees:
      readback: unavailable
    input_schema:
      type: object
      required: [csv_path, source_id, consent_basis]
      additionalProperties: false
      properties:
        csv_path: {type: string, minLength: 1}
        source_id: {type: string, minLength: 1}
        consent_basis: {type: string, minLength: 1}
        columns: {type: object}
        options: {type: object}
        dry_run: {const: false}
        brand_sid: {type: string, pattern: "^[A-Za-z0-9_-]{1,64}$"}
    implementation:
      process:
        tool: nitrosend.bulk_import
        runtime_scopes: ["net:http", "fs:read"]
  thread.reply:
    description: Reply in one Nitrosend inbox conversation.
    verb: write
    scopes: [thread.reply]
    credentials: [api_key]
    target:
      template: {"$argument": "/thread_locator"}
    readback: thread.reply.read
  thread.reply.read:
    description: Read back one reply in a Nitrosend inbox conversation.
    verb: read
    scopes: [thread.reply.read]
    credentials: [api_key]
    target:
      template: {"$argument": "/thread_locator"}
  status.read:
    description: Read account, brand and delivery readiness.
    verb: read
    scopes: ["nitrosend:read"]
    credentials: [api_key]
    target:
      template: "nitrosend://account"
    input_schema:
      type: object
      additionalProperties: false
      properties:
        brand_sid: {type: string, pattern: "^[A-Za-z0-9_-]{1,64}$"}
    implementation:
      mcp:
        tool: nitro_get_status
        arguments: {}
        tool_digest: "sha256:a759150ed52e67e56e1e15423126669d4caf7a47d24a91b92746456123353541"
  entities.query:
    description: Read one page of a brand's flows, campaigns, templates, segments, contacts, lists, events, imports, messages, suppressions, history or products.
    verb: read
    scopes: ["nitrosend:read"]
    credentials: [api_key]
    target:
      template: "nitrosend://account"
    input_schema:
      type: object
      required: [arguments]
      additionalProperties: false
      properties:
        brand_sid: {type: string, pattern: "^[A-Za-z0-9_-]{1,64}$"}
        arguments:
          type: object
          required: [entity]
          additionalProperties: false
          properties:
            entity: {enum: [flows, campaigns, templates, segments, contacts, lists, events, imports, messages, suppressions, history, products]}
            filters: {type: object, maxProperties: 10}
            page: {type: integer, minimum: 1}
            per: {type: integer, minimum: 1, maximum: 50}
    implementation:
      mcp:
        tool: nitro_query
        arguments: {"$argument": "/arguments"}
        tool_digest: "sha256:4000a8ccb14b2dafe9dbdd2a5948b95cd14b000f1c7d9d8b56238e84af7403b1"
  inbox.read:
    description: List the brand's mailbox, or read one thread, page or message body.
    verb: read
    scopes: ["nitrosend:read"]
    credentials: [api_key]
    target:
      template: "nitrosend://inbox"
    input_schema:
      type: object
      required: [arguments]
      additionalProperties: false
      properties:
        brand_sid: {type: string, pattern: "^[A-Za-z0-9_-]{1,64}$"}
        arguments:
          type: object
          required: [command]
          maxProperties: 9
          properties:
            command: {enum: [list_mailbox, get_thread, get_thread_page, get_message_body]}
    implementation:
      mcp:
        tool: nitro_inbox
        arguments: {"$argument": "/arguments"}
        tool_digest: "sha256:baff17ef776baa4988eb012f73ef23a6d0a7f227894674ba0fd3cdf68fbb42f5"
  sender.read:
    description: Read the brand's sender configuration.
    verb: read
    scopes: ["nitrosend:read"]
    credentials: [api_key]
    target:
      template: "nitrosend://sender"
    input_schema:
      type: object
      additionalProperties: false
      properties:
        brand_sid: {type: string, pattern: "^[A-Za-z0-9_-]{1,64}$"}
    implementation:
      mcp:
        tool: nitro_configure_account
        arguments: {}
        tool_digest: "sha256:5985520a4a0e40bd495739d4f0d1c7495e1bcc7d8e2654b9e419edec6bef1a1e"
  insights.read:
    description: Read analytics for the account, a flow, a campaign or a message.
    verb: read
    scopes: ["nitrosend:read"]
    credentials: [api_key]
    target:
      template: "nitrosend://insights"
    input_schema:
      type: object
      required: [arguments]
      additionalProperties: false
      properties:
        brand_sid: {type: string, pattern: "^[A-Za-z0-9_-]{1,64}$"}
        arguments:
          type: object
          required: [scope]
          additionalProperties: false
          properties:
            scope: {enum: [account, flow, campaign, message]}
            entity_id: {type: integer, minimum: 1}
            period: {enum: [7d, 30d, 90d]}
    implementation:
      mcp:
        tool: nitro_get_insights
        arguments: {"$argument": "/arguments"}
        tool_digest: "sha256:697aaaa266de465530fb4ffc3584cbe7285612991974d8d6262f865bcca2233e"
  delivery.review:
    description: Review a template, flow or campaign for delivery readiness.
    verb: read
    scopes: ["nitrosend:read"]
    credentials: [api_key]
    target:
      template: "nitrosend://delivery"
    input_schema:
      type: object
      required: [arguments]
      additionalProperties: false
      properties:
        brand_sid: {type: string, pattern: "^[A-Za-z0-9_-]{1,64}$"}
        arguments:
          type: object
          additionalProperties: false
          properties:
            target_type: {enum: [template, flow, campaign]}
            target_id: {type: integer, minimum: 1}
            revision_id: {type: integer, minimum: 1}
            contact_id: {type: integer, minimum: 1}
    implementation:
      mcp:
        tool: nitro_review_delivery
        arguments: {"$argument": "/arguments"}
        tool_digest: "sha256:08b36ab9a8ea73c17b044d3ceb6c5f0b307f2f963004d3138ade04dea9579017"
  billing.status:
    description: Read the account's subscription status.
    verb: read
    scopes: ["nitrosend:read"]
    credentials: [api_key]
    target:
      template: "nitrosend://billing"
    input_schema:
      type: object
      additionalProperties: false
      properties:
        brand_sid: {type: string, pattern: "^[A-Za-z0-9_-]{1,64}$"}
    implementation:
      mcp:
        tool: nitro_manage_billing
        arguments: {operation: status}
        tool_digest: "sha256:06a7f76ca2ed3b8749bba474cd16e2810a94823a632647d7f64e8bb3420945a7"
  billing.plans:
    description: Read the plans the account may choose.
    verb: read
    scopes: ["nitrosend:read"]
    credentials: [api_key]
    target:
      template: "nitrosend://billing"
    input_schema:
      type: object
      additionalProperties: false
      properties:
        brand_sid: {type: string, pattern: "^[A-Za-z0-9_-]{1,64}$"}
    implementation:
      mcp:
        tool: nitro_manage_billing
        arguments: {operation: plans}
        tool_digest: "sha256:06a7f76ca2ed3b8749bba474cd16e2810a94823a632647d7f64e8bb3420945a7"
  checkout.status:
    description: Read one plan purchase started by a checkout.
    verb: read
    scopes: ["nitrosend:read"]
    credentials: [api_key]
    target:
      template: "nitrosend://billing"
    input_schema:
      type: object
      required: [purchase_id]
      additionalProperties: false
      properties:
        brand_sid: {type: string, pattern: "^[A-Za-z0-9_-]{1,64}$"}
        purchase_id: {type: integer, minimum: 1}
    implementation:
      mcp:
        tool: nitro_manage_billing
        arguments: {operation: checkout_status, params: {purchase_id: {"$argument": "/purchase_id"}}}
        tool_digest: "sha256:06a7f76ca2ed3b8749bba474cd16e2810a94823a632647d7f64e8bb3420945a7"
  plan.checkout:
    description: Start a hosted checkout or confirm an in-place change to one plan. The purchase completes asynchronously; checkout.status reads it.
    verb: write
    scopes: ["nitrosend:billing"]
    credentials: [api_key]
    target:
      template: "nitrosend://billing"
    approval: required
    guarantees:
      readback: unavailable
    input_schema:
      type: object
      required: [plan_id]
      additionalProperties: false
      properties:
        brand_sid: {type: string, pattern: "^[A-Za-z0-9_-]{1,64}$"}
        plan_id: {type: integer, minimum: 1}
    implementation:
      mcp:
        tool: nitro_manage_billing
        arguments: {operation: checkout, params: {plan_id: {"$argument": "/plan_id"}, confirm: true}, idempotency_key: {"$runx": "idempotency_key"}}
        tool_digest: "sha256:06a7f76ca2ed3b8749bba474cd16e2810a94823a632647d7f64e8bb3420945a7"
  sender.configure:
    description: Change the brand's sender name, address, reply-to or test recipients.
    verb: update
    scopes: ["nitrosend:write"]
    credentials: [api_key]
    target:
      template: "nitrosend://sender"
    approval: required
    input_schema:
      type: object
      required: [arguments]
      additionalProperties: false
      properties:
        brand_sid: {type: string, pattern: "^[A-Za-z0-9_-]{1,64}$"}
        arguments:
          type: object
          minProperties: 1
          additionalProperties: false
          properties:
            from_email: {type: string, minLength: 3, maxLength: 320}
            from_name: {type: string, minLength: 1, maxLength: 200}
            reply_to: {type: string, minLength: 3, maxLength: 320}
            test_email_recipients: {type: array, maxItems: 10, items: {type: string, maxLength: 320}}
    implementation:
      mcp:
        tool: nitro_configure_account
        arguments: {"$argument": "/arguments"}
        tool_digest: "sha256:5985520a4a0e40bd495739d4f0d1c7495e1bcc7d8e2654b9e419edec6bef1a1e"
        readback:
          tool: nitro_configure_account
          arguments: {}
          tool_digest: "sha256:5985520a4a0e40bd495739d4f0d1c7495e1bcc7d8e2654b9e419edec6bef1a1e"
          matches:
            - {expected: {source: acknowledgement, path: result.sender.from_email}, observed: result.sender.from_email}
            - {expected: {source: acknowledgement, path: result.sender.from_name}, observed: result.sender.from_name}
            - {expected: {source: acknowledgement, path: result.sender.reply_to}, observed: result.sender.reply_to}
            - {expected: {source: acknowledgement, path: result.test_email_recipients}, observed: result.test_email_recipients}
  campaign.approve:
    description: Approve one reviewed campaign configuration. It does not send.
    verb: update
    scopes: ["nitrosend:send"]
    credentials: [api_key]
    target:
      template: "nitrosend://delivery"
    approval: required
    guarantees:
      readback: unavailable
    input_schema:
      type: object
      required: [target_id]
      additionalProperties: false
      properties:
        brand_sid: {type: string, pattern: "^[A-Za-z0-9_-]{1,64}$"}
        target_id: {type: integer, minimum: 1}
        revision_id: {type: integer, minimum: 1}
    implementation:
      mcp:
        tool: nitro_control_delivery
        arguments: {target_type: campaign, operation: approve, target_id: {"$argument": "/target_id"}, revision_id: {"$argument": "/revision_id"}}
        tool_digest: "sha256:b25bbef3a463c528a89b89f280786b45d132de8deca3d9073c1ae2c8f10a6813"
  flow.approve:
    description: Approve one reviewed flow configuration. It does not activate it.
    verb: update
    scopes: ["nitrosend:send"]
    credentials: [api_key]
    target:
      template: "nitrosend://delivery"
    approval: required
    guarantees:
      readback: unavailable
    input_schema:
      type: object
      required: [target_id]
      additionalProperties: false
      properties:
        brand_sid: {type: string, pattern: "^[A-Za-z0-9_-]{1,64}$"}
        target_id: {type: integer, minimum: 1}
        revision_id: {type: integer, minimum: 1}
    implementation:
      mcp:
        tool: nitro_control_delivery
        arguments: {target_type: flow, operation: approve, target_id: {"$argument": "/target_id"}, revision_id: {"$argument": "/revision_id"}}
        tool_digest: "sha256:b25bbef3a463c528a89b89f280786b45d132de8deca3d9073c1ae2c8f10a6813"
  campaign.send:
    description: Send one approved campaign to its live audience now.
    verb: execute
    scopes: ["nitrosend:send"]
    credentials: [api_key]
    target:
      template: "nitrosend://delivery"
    approval: required
    guarantees:
      readback: unavailable
    input_schema:
      type: object
      required: [target_id]
      additionalProperties: false
      properties:
        brand_sid: {type: string, pattern: "^[A-Za-z0-9_-]{1,64}$"}
        target_id: {type: integer, minimum: 1}
        revision_id: {type: integer, minimum: 1}
        confirm_send_to_all: {type: boolean}
    implementation:
      mcp:
        tool: nitro_control_delivery
        arguments: {target_type: campaign, operation: live, target_id: {"$argument": "/target_id"}, revision_id: {"$argument": "/revision_id"}, confirm_send_to_all: {"$argument": "/confirm_send_to_all"}, idempotency_key: {"$runx": "idempotency_key"}}
        tool_digest: "sha256:b25bbef3a463c528a89b89f280786b45d132de8deca3d9073c1ae2c8f10a6813"
  campaign.schedule:
    description: Schedule one approved campaign for its live audience.
    verb: execute
    scopes: ["nitrosend:send"]
    credentials: [api_key]
    target:
      template: "nitrosend://delivery"
    approval: required
    guarantees:
      readback: unavailable
    input_schema:
      type: object
      required: [target_id]
      additionalProperties: false
      properties:
        brand_sid: {type: string, pattern: "^[A-Za-z0-9_-]{1,64}$"}
        target_id: {type: integer, minimum: 1}
        revision_id: {type: integer, minimum: 1}
        scheduled_at: {type: string, format: date-time}
        confirm_send_to_all: {type: boolean}
    implementation:
      mcp:
        tool: nitro_control_delivery
        arguments: {target_type: campaign, operation: schedule, target_id: {"$argument": "/target_id"}, revision_id: {"$argument": "/revision_id"}, scheduled_at: {"$argument": "/scheduled_at"}, confirm_send_to_all: {"$argument": "/confirm_send_to_all"}, idempotency_key: {"$runx": "idempotency_key"}}
        tool_digest: "sha256:b25bbef3a463c528a89b89f280786b45d132de8deca3d9073c1ae2c8f10a6813"
  flow.activate:
    description: Activate one approved flow so it runs for its trigger.
    verb: execute
    scopes: ["nitrosend:send"]
    credentials: [api_key]
    target:
      template: "nitrosend://delivery"
    approval: required
    guarantees:
      readback: unavailable
    input_schema:
      type: object
      required: [target_id]
      additionalProperties: false
      properties:
        brand_sid: {type: string, pattern: "^[A-Za-z0-9_-]{1,64}$"}
        target_id: {type: integer, minimum: 1}
        revision_id: {type: integer, minimum: 1}
    implementation:
      mcp:
        tool: nitro_control_delivery
        arguments: {target_type: flow, operation: live, target_id: {"$argument": "/target_id"}, revision_id: {"$argument": "/revision_id"}}
        tool_digest: "sha256:b25bbef3a463c528a89b89f280786b45d132de8deca3d9073c1ae2c8f10a6813"
  segment.define:
    description: Define or preview one segment from filters.
    verb: write
    scopes: ["nitrosend:write"]
    credentials: [api_key]
    target:
      template: "nitrosend://segments"
    approval: required
    guarantees:
      readback: unavailable
    input_schema:
      type: object
      required: [arguments]
      additionalProperties: false
      properties:
        brand_sid: {type: string, pattern: "^[A-Za-z0-9_-]{1,64}$"}
        arguments:
          type: object
          required: [filters]
          additionalProperties: false
          properties:
            filters: {}
            name: {type: string, minLength: 1, maxLength: 200}
            preview_only: {type: boolean}
            segment_id: {type: integer, minimum: 1}
            idempotency_key: {type: string, minLength: 1, maxLength: 200}
    implementation:
      mcp:
        tool: nitro_define_segment
        arguments: {"$argument": "/arguments"}
        tool_digest: "sha256:63d6e6c15119e973577cdb8abe767e69ae6c1cefa3a300b810efae14e801367e"
  test_message.preview:
    description: Validate one test of a template, flow step or campaign for its recipients without dispatching it.
    verb: read
    scopes: ["nitrosend:read"]
    credentials: [api_key]
    target:
      template: "nitrosend://test-message"
    input_schema:
      type: object
      required: [target_type, target_id, channel, to]
      additionalProperties: false
      properties:
        brand_sid: {type: string, pattern: "^[A-Za-z0-9_-]{1,64}$"}
        target_type: {enum: [template, flow, campaign]}
        target_id: {type: integer, minimum: 1}
        revision_id: {type: integer, minimum: 1}
        action_id: {type: integer, minimum: 1}
        template_id: {type: integer, minimum: 1}
        channel: {enum: [auto, email, sms]}
        to: {type: array, minItems: 1, maxItems: 5, items: {type: string, minLength: 1, maxLength: 320}}
        data: {type: object}
    implementation:
      mcp:
        tool: nitro_send_test_message
        arguments: {target_type: {"$argument": "/target_type"}, target_id: {"$argument": "/target_id"}, revision_id: {"$argument": "/revision_id"}, action_id: {"$argument": "/action_id"}, template_id: {"$argument": "/template_id"}, channel: {"$argument": "/channel"}, to: {"$argument": "/to"}, data: {"$argument": "/data"}, dry_run: true}
        tool_digest: "sha256:55fce39a3be9a762b665dcd9b70b84bb65d0daa71b460d5d00d3aa533d479659"
  test_message.send:
    description: Send one test of a template, flow step or campaign to its recipients.
    verb: write
    scopes: ["nitrosend:send"]
    credentials: [api_key]
    target:
      template: "nitrosend://test-message"
    approval: required
    guarantees:
      readback: unavailable
    input_schema:
      type: object
      required: [target_type, target_id, channel, to]
      additionalProperties: false
      properties:
        brand_sid: {type: string, pattern: "^[A-Za-z0-9_-]{1,64}$"}
        target_type: {enum: [template, flow, campaign]}
        target_id: {type: integer, minimum: 1}
        revision_id: {type: integer, minimum: 1}
        action_id: {type: integer, minimum: 1}
        template_id: {type: integer, minimum: 1}
        channel: {enum: [auto, email, sms]}
        to: {type: array, minItems: 1, maxItems: 5, items: {type: string, minLength: 1, maxLength: 320}}
        data: {type: object}
    implementation:
      mcp:
        tool: nitro_send_test_message
        arguments: {target_type: {"$argument": "/target_type"}, target_id: {"$argument": "/target_id"}, revision_id: {"$argument": "/revision_id"}, action_id: {"$argument": "/action_id"}, template_id: {"$argument": "/template_id"}, channel: {"$argument": "/channel"}, to: {"$argument": "/to"}, data: {"$argument": "/data"}, idempotency_key: {"$runx": "idempotency_key"}, dry_run: false}
        tool_digest: "sha256:55fce39a3be9a762b665dcd9b70b84bb65d0daa71b460d5d00d3aa533d479659"
  message.preview:
    description: Validate one transactional email or SMS without sending it.
    verb: read
    scopes: ["nitrosend:read"]
    credentials: [api_key]
    target:
      template: "nitrosend://messages"
    input_schema:
      type: object
      required: [channel, to]
      additionalProperties: false
      properties:
        brand_sid: {type: string, pattern: "^[A-Za-z0-9_-]{1,64}$"}
        channel: {enum: [email, sms]}
        to: {type: string, minLength: 3, maxLength: 320}
        subject: {type: string, maxLength: 998}
        body: {type: string, maxLength: 262144}
        template_id: {type: integer, minimum: 1}
        data: {type: object}
    implementation:
      mcp:
        tool: nitro_send_message
        arguments: {channel: {"$argument": "/channel"}, to: {"$argument": "/to"}, subject: {"$argument": "/subject"}, body: {"$argument": "/body"}, template_id: {"$argument": "/template_id"}, data: {"$argument": "/data"}, idempotency_key: runx-preview, dry_run: true}
        tool_digest: "sha256:068b11a00b20d3fcdbac6b416c35cac30b91d88f2cbdf3e5e4ff66bad89daab1"
  message.send:
    description: Send one transactional email or SMS to one recipient.
    verb: write
    scopes: ["nitrosend:send"]
    credentials: [api_key]
    target:
      template: "nitrosend://messages"
    approval: required
    input_schema:
      type: object
      required: [channel, to]
      additionalProperties: false
      properties:
        brand_sid: {type: string, pattern: "^[A-Za-z0-9_-]{1,64}$"}
        channel: {enum: [email, sms]}
        to: {type: string, minLength: 3, maxLength: 320}
        subject: {type: string, maxLength: 998}
        body: {type: string, maxLength: 262144}
        template_id: {type: integer, minimum: 1}
        data: {type: object}
    implementation:
      mcp:
        tool: nitro_send_message
