schema: runx.connector.v1
name: stripe
title: Stripe
description: Collect and refund payments on your Stripe account, with exact terms and independent processor readback.
category: payments
auth:
  credentials:
    key:
      kind: api_key
      fields:
      - name: api_key
        label: Stripe secret or restricted key
        prefixes:
        - sk_test_
        - sk_live_
        - rk_test_
        - rk_live_
      delivery:
        env: STRIPE_API_KEY
      audience:
      - api.stripe.com
placements:
  hosted:
    auth: credential
    credential: key
  local:
    auth:
    - credentials
operations:
  account.read:
    description: Read the account this credential belongs to.
    verb: read
    scopes:
    - payment.account.read
    credentials:
    - key
    target:
      template: stripe://account
    input_schema:
      type: object
      additionalProperties: false
      properties: {}
    result_fields:
    - account_id
    implementation:
      http:
        allowed_hosts:
        - api.stripe.com
        auth:
          key:
            type: bearer
            field: api_key
        requests:
        - id: account
          http_method: GET
          url: https://api.stripe.com/v1/account
          headers:
            stripe-version: 2026-09-30.endive
        decode:
        - op: auto_json
        - op: project
          fields:
            account_id: id
        preconditions: []
        result_paths:
          account_id: acknowledgement.account_id
  payment.stripe:
    description: Collect one exact payment using an existing Stripe payment method. Only a succeeded PaymentIntent independently read back with the approved terms confirms collection.
    verb: write
    approval: required
    scopes:
    - payment.stripe
    credentials:
    - key
    target:
      template:
        $concat:
        - stripe://
        - $argument: /account_id
        - /collections/
        - $argument: /reference
    input_schema:
      type: object
      required:
      - account_id
      - amount_minor
      - currency
      - payment_method_id
      - reference
      additionalProperties: false
      properties:
        account_id:
          type: string
          pattern: ^acct_[A-Za-z0-9]{1,64}$
        amount_minor:
          type: integer
          minimum: 1
          maximum: 99999999
        currency:
          type: string
          pattern: ^[a-z]{3}$
        payment_method_id:
          type: string
          pattern: ^pm_[A-Za-z0-9_]{1,128}$
        reference:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9_.:/-]{0,199}$
    result_fields:
    - payment_id
    - amount_minor
    - amount_received
    - currency
    - status
    - charge_id
    - reference
    implementation:
      http:
        allowed_hosts:
        - api.stripe.com
        auth:
          key:
            type: bearer
            field: api_key
        requests:
        - id: collect
          http_method: POST
          url: https://api.stripe.com/v1/payment_intents
          headers: &id002
            stripe-version: 2026-09-30.endive
            idempotency-key:
              $runx: idempotency_key
            stripe-account:
              $argument: /account_id
          body_encoding: form
          body:
            amount:
              $argument: /amount_minor
            currency:
              $argument: /currency
            payment_method:
              $argument: /payment_method_id
            confirm: true
            automatic_payment_methods[enabled]: true
            automatic_payment_methods[allow_redirects]: never
            metadata[runx_reference]:
              $argument: /reference
            metadata[runx_effect_key]:
              $runx: idempotency_key
        decode:
        - op: auto_json
        - op: project
          fields:
            payment_id: id
        preconditions:
        - request:
            id: account
            http_method: GET
            url: https://api.stripe.com/v1/account
            headers: &id001
              stripe-version: 2026-09-30.endive
              stripe-account:
                $argument: /account_id
          decode:
          - op: auto_json
          - op: project
            fields:
              account_id: id
          matches:
          - expected:
              source: argument
              path: account_id
            observed: account_id
        operation_id_path: payment_id
        readbacks:
        - request:
            id: payment
            http_method: GET
            url:
              $concat:
              - https://api.stripe.com/v1/payment_intents/
              - $response: write.json.payment_id
            headers: *id001
          decode:
          - op: auto_json
          - op: project
            fields:
              payment_id: id
              amount_minor: amount
              amount_received: amount_received
              currency: currency
              status: status
              charge_id: latest_charge
              reference: metadata.runx_reference
          matches:
          - expected:
              source: acknowledgement
              path: payment_id
            observed: payment_id
          - expected:
              source: argument
              path: amount_minor
            observed: amount_minor
          - expected:
              source: argument
              path: amount_minor
            observed: amount_received
          - expected:
              source: argument
              path: currency
            observed: currency
          - expected:
              source: argument
              path: reference
            observed: reference
          - expected:
              source: literal
              value: succeeded
            observed: status
        result_paths:
          payment_id: readbacks.0.payment_id
          amount_minor: readbacks.0.amount_minor
          amount_received: readbacks.0.amount_received
          currency: readbacks.0.currency
          status: readbacks.0.status
          charge_id: readbacks.0.charge_id
          reference: readbacks.0.reference
  payment.stripe.read:
    description: Read one PaymentIntent without exposing its client secret or customer payment details.
    verb: read
    scopes:
    - payment.stripe.read
    credentials:
    - key
    target:
      template:
        $concat:
        - stripe://
        - $argument: /account_id
        - /payments/
        - $argument: /payment_id
    input_schema:
      type: object
      required:
      - account_id
      - payment_id
      additionalProperties: false
      properties:
        account_id:
          type: string
          pattern: ^acct_[A-Za-z0-9]{1,64}$
        payment_id:
          type: string
          pattern: ^pi_[A-Za-z0-9]{1,128}$
    result_fields:
    - payment_id
    - amount_minor
    - amount_received
    - currency
    - status
    - charge_id
    implementation:
      http:
        allowed_hosts:
        - api.stripe.com
        auth:
          key:
            type: bearer
            field: api_key
        requests:
        - id: payment
          http_method: GET
          url:
            $concat:
            - https://api.stripe.com/v1/payment_intents/
            - $argument: /payment_id
          headers: *id001
        decode:
        - op: auto_json
        - op: project
          fields:
            payment_id: id
            amount_minor: amount
            amount_received: amount_received
            currency: currency
            status: status
            charge_id: latest_charge
        preconditions:
        - request:
            id: account
            http_method: GET
            url: https://api.stripe.com/v1/account
            headers: *id001
          decode:
          - op: auto_json
          - op: project
            fields:
              account_id: id
          matches:
          - expected:
              source: argument
              path: account_id
            observed: account_id
        result_paths:
          payment_id: acknowledgement.payment_id
          amount_minor: acknowledgement.amount_minor
          amount_received: acknowledgement.amount_received
          currency: acknowledgement.currency
          status: acknowledgement.status
          charge_id: acknowledgement.charge_id
  payment.stripe.lookup:
    description: 'Find one PaymentIntent by the native effect key recorded for the attempted collection. Search is eventually consistent: absence never proves a payment was not submitted. Multiple matches refuse.'
    verb: read
    scopes:
    - payment.stripe.read
    credentials:
    - key
    target:
      template:
        $concat:
        - stripe://
        - $argument: /account_id
        - /effects/
        - $argument: /effect_key
    input_schema:
      type: object
      required:
      - account_id
      - effect_key
      additionalProperties: false
      properties:
        account_id:
          type: string
          pattern: ^acct_[A-Za-z0-9]{1,64}$
        effect_key:
          type: string
          pattern: ^[A-Za-z0-9_:-]{1,200}$
    result_fields:
    - payment_id
    - amount_minor
    - amount_received
    - currency
    - status
    - charge_id
    - reference
    implementation:
      http:
        allowed_hosts:
        - api.stripe.com
        auth:
          key:
            type: bearer
            field: api_key
        requests:
        - id: lookup
          http_method: GET
          url: https://api.stripe.com/v1/payment_intents/search
          query:
            query:
              $concat:
              - metadata['runx_effect_key']:'
              - $argument: /effect_key
              - ''''
            limit: 2
          headers: *id001
        decode:
        - op: auto_json
        - op: reject_present
          path: data.1
        - op: field
          path: data.0
        - op: project
          fields:
            payment_id: id
            amount_minor: amount
            amount_received: amount_received
            currency: currency
            status: status
            charge_id: latest_charge
            reference: metadata.runx_reference
        preconditions:
        - request:
            id: account
            http_method: GET
            url: https://api.stripe.com/v1/account
            headers: *id001
          decode:
          - op: auto_json
          - op: project
            fields:
              account_id: id
          matches:
          - expected:
              source: argument
              path: account_id
            observed: account_id
        result_paths:
          payment_id: acknowledgement.payment_id
          amount_minor: acknowledgement.amount_minor
          amount_received: acknowledgement.amount_received
          currency: acknowledgement.currency
          status: acknowledgement.status
          charge_id: acknowledgement.charge_id
          reference: acknowledgement.reference
  payment.stripe.refund:
    description: Refund one original PaymentIntent on its account and currency. Stripe atomically enforces its remaining refundable amount, including concurrent partial refunds.
    verb: write
    approval: required
    scopes:
    - payment.stripe.refund
    credentials:
    - key
    target:
      template:
        $concat:
        - stripe://
        - $argument: /account_id
        - /payments/
        - $argument: /payment_id
    input_schema:
      type: object
      required:
      - account_id
      - payment_id
      - amount_minor
      - currency
      additionalProperties: false
      properties:
        account_id:
          type: string
          pattern: ^acct_[A-Za-z0-9]{1,64}$
        payment_id:
          type: string
          pattern: ^pi_[A-Za-z0-9]{1,128}$
        amount_minor:
          type: integer
          minimum: 1
          maximum: 99999999
        currency:
          type: string
          pattern: ^[a-z]{3}$
    result_fields:
    - refund_id
    - payment_id
    - amount_minor
    - currency
    - status
    implementation:
      http:
        allowed_hosts:
        - api.stripe.com
        auth:
          key:
            type: bearer
            field: api_key
        requests:
        - id: refund
          http_method: POST
          url: https://api.stripe.com/v1/refunds
          headers: *id002
          body_encoding: form
          body:
            payment_intent:
              $argument: /payment_id
            amount:
              $argument: /amount_minor
            metadata[runx_effect_key]:
              $runx: idempotency_key
        decode:
        - op: auto_json
        - op: project
          fields:
            refund_id: id
        preconditions:
        - request:
            id: account
            http_method: GET
            url: https://api.stripe.com/v1/account
            headers: *id001
          decode:
          - op: auto_json
          - op: project
            fields:
              account_id: id
          matches:
          - expected:
              source: argument
              path: account_id
            observed: account_id
        - request:
            id: original
            http_method: GET
            url:
              $concat:
              - https://api.stripe.com/v1/payment_intents/
              - $argument: /payment_id
            headers: *id001
          decode:
          - op: auto_json
          - op: project
            fields:
              payment_id: id
              amount_minor: amount
              amount_received: amount_received
              currency: currency
              status: status
              charge_id: latest_charge
          matches:
          - expected:
              source: argument
              path: payment_id
            observed: payment_id
          - expected:
              source: argument
              path: currency
            observed: currency
          - expected:
              source: literal
              value: succeeded
            observed: status
        operation_id_path: refund_id
        readbacks:
        - request:
            id: refund_read
            http_method: GET
            url:
              $concat:
              - https://api.stripe.com/v1/refunds/
              - $response: write.json.refund_id
            headers: *id001
          decode:
          - op: auto_json
          - op: project
            fields:
              refund_id: id
              payment_id: payment_intent
              amount_minor: amount
              currency: currency
              status: status
          matches:
          - expected:
              source: acknowledgement
              path: refund_id
            observed: refund_id
          - expected:
              source: argument
              path: payment_id
            observed: payment_id
          - expected:
              source: argument
              path: amount_minor
            observed: amount_minor
          - expected:
              source: argument
              path: currency
            observed: currency
          - expected:
              source: literal
              value: succeeded
            observed: status
        result_paths:
          refund_id: readbacks.0.refund_id
          payment_id: readbacks.0.payment_id
          amount_minor: readbacks.0.amount_minor
          currency: readbacks.0.currency
          status: readbacks.0.status
    amount:
      units:
        $argument: /amount_minor
      currency:
        $argument: /currency
  payment.stripe.refund.read:
    description: Read a Stripe refund and its actual processor status.
    verb: read
    scopes:
    - payment.stripe.refund.read
    credentials:
    - key
    target:
      template:
        $concat:
        - stripe://
        - $argument: /account_id
        - /refunds/
        - $argument: /refund_id
    input_schema:
      type: object
      required:
      - account_id
      - refund_id
      additionalProperties: false
      properties:
        account_id: &id003
          type: string
          pattern: ^acct_[A-Za-z0-9]{1,64}$
        refund_id:
          type: string
          pattern: ^re_[A-Za-z0-9]{1,128}$
    result_fields:
    - refund_id
    - payment_id
    - amount_minor
    - currency
    - status
    implementation:
      http:
        allowed_hosts:
        - api.stripe.com
        auth:
          key:
            type: bearer
            field: api_key
        requests:
        - id: refund
          http_method: GET
          url:
            $concat:
            - https://api.stripe.com/v1/refunds/
            - $argument: /refund_id
          headers: *id001
        decode:
        - op: auto_json
        - op: project
          fields:
            refund_id: id
            payment_id: payment_intent
            amount_minor: amount
            currency: currency
            status: status
        preconditions:
        - request:
            id: account
            http_method: GET
            url: https://api.stripe.com/v1/account
            headers: *id001
          decode:
          - op: auto_json
          - op: project
            fields:
              account_id: id
          matches:
          - expected:
              source: argument
              path: account_id
            observed: account_id
        result_paths:
          refund_id: acknowledgement.refund_id
          payment_id: acknowledgement.payment_id
          amount_minor: acknowledgement.amount_minor
          currency: acknowledgement.currency
          status: acknowledgement.status
  payment.stripe.charge.read:
    description: Read the original charge and its cumulative refunded amount before planning another partial refund.
    verb: read
    scopes:
    - payment.stripe.read
    credentials:
    - key
    target:
      template:
        $concat:
        - stripe://
        - $argument: /account_id
        - /charges/
        - $argument: /charge_id
    input_schema:
      type: object
      required:
      - account_id
      - charge_id
      additionalProperties: false
      properties:
        account_id: *id003
        charge_id:
          type: string
          pattern: ^ch_[A-Za-z0-9]{1,128}$
    result_fields:
    - charge_id
    - payment_id
    - amount_minor
    - amount_refunded
    - currency
    - status
    implementation:
      http:
        allowed_hosts:
        - api.stripe.com
        auth:
          key:
            type: bearer
            field: api_key
        requests:
        - id: charge
          http_method: GET
          url:
            $concat:
            - https://api.stripe.com/v1/charges/
            - $argument: /charge_id
          headers: *id001
        decode:
        - op: auto_json
        - op: project
          fields:
            charge_id: id
            payment_id: payment_intent
            amount_minor: amount
            amount_refunded: amount_refunded
            currency: currency
            status: status
        preconditions:
        - request:
            id: account
            http_method: GET
            url: https://api.stripe.com/v1/account
            headers: *id001
          decode:
          - op: auto_json
          - op: project
            fields:
              account_id: id
          matches:
          - expected:
              source: argument
              path: account_id
            observed: account_id
        result_paths:
          charge_id: acknowledgement.charge_id
          payment_id: acknowledgement.payment_id
          amount_minor: acknowledgement.amount_minor
          amount_refunded: acknowledgement.amount_refunded
          currency: acknowledgement.currency
          status: acknowledgement.status
  dispute.read:
    description: Read one exact dispute on the selected Stripe merchant account, including bank response state, deadline, evidence and submission count. Reading does not file evidence or concede liability.
    verb: read
    scopes:
    - dispute.read
    credentials:
    - key
    target:
      template:
        $concat:
        - stripe://
        - $argument: /account_id
        - /disputes/
        - $argument: /dispute_id
    input_schema:
      type: object
      required:
      - account_id
      - dispute_id
      additionalProperties: false
      properties:
        account_id:
          type: string
          pattern: ^acct_[A-Za-z0-9]{1,64}$
        dispute_id:
          type: string
          pattern: ^du_[A-Za-z0-9]{1,128}$
    result_fields:
    - dispute_id
    - charge_id
    - payment_id
    - amount_minor
    - currency
    - reason
    - status
    - due_by
    - past_due
    - has_evidence
    - submission_count
    - evidence
    - livemode
    implementation:
      http:
        allowed_hosts:
        - api.stripe.com
        auth:
          key:
            type: bearer
            field: api_key
        requests:
        - id: dispute
          http_method: GET
          url:
            $concat:
            - https://api.stripe.com/v1/disputes/
            - $argument: /dispute_id
          headers:
            stripe-version: 2026-09-30.endive
            stripe-account:
              $argument: /account_id
        decode:
        - op: auto_json
        - op: project
          fields:
            dispute_id: id
            charge_id: charge
            payment_id: payment_intent
            amount_minor: amount
            currency: currency
            reason: reason
            status: status
            due_by: evidence_details.due_by
            past_due: evidence_details.past_due
            has_evidence: evidence_details.has_evidence
            submission_count: evidence_details.submission_count
            evidence: evidence
            livemode: livemode
        preconditions:
        - request:
            id: account
            http_method: GET
            url: https://api.stripe.com/v1/account
            headers:
              stripe-version: 2026-09-30.endive
              stripe-account:
                $argument: /account_id
          decode:
          - op: auto_json
          - op: project
            fields:
              account_id: id
          matches:
          - expected:
              source: argument
              path: account_id
            observed: account_id
        result_paths:
          dispute_id: acknowledgement.dispute_id
          charge_id: acknowledgement.charge_id
          payment_id: acknowledgement.payment_id
          amount_minor: acknowledgement.amount_minor
          currency: acknowledgement.currency
          reason: acknowledgement.reason
          status: acknowledgement.status
          due_by: acknowledgement.due_by
          past_due: acknowledgement.past_due
          has_evidence: acknowledgement.has_evidence
          submission_count: acknowledgement.submission_count
          evidence: acknowledgement.evidence
          livemode: acknowledgement.livemode
  dispute.file:
    description: Submit the exact approved evidence to the bank, then read the same dispute and require the expected submission count. This is formal submission, not draft staging, acceptance, closing or refunding. Read current case first; submission_count must equal prior_submission_count plus one. Reconcile an uncertain attempt before another submission.
    verb: write
    approval: required
    scopes:
    - dispute.file
    credentials:
    - key
    target:
      template:
        $concat:
        - stripe://
        - $argument: /account_id
        - /disputes/
        - $argument: /dispute_id
    input_schema:
      type: object
      required:
      - account_id
      - dispute_id
      - charge_id
      - amount_minor
      - currency
      - expected_status
      - prior_submission_count
      - submission_count
      - evidence_form
      - amount_refunded
      - expected_evidence
      additionalProperties: false
      properties:
        account_id:
          type: string
          pattern: ^acct_[A-Za-z0-9]{1,64}$
        dispute_id:
          type: string
          pattern: ^du_[A-Za-z0-9]{1,128}$
        charge_id:
          type: string
          pattern: ^ch_[A-Za-z0-9]{1,128}$
        amount_minor:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        currency:
          type: string
          pattern: ^[a-z]{3}$
        expected_status:
          enum:
          - needs_response
          - warning_needs_response
        prior_submission_count:
          type: integer
          minimum: 0
        submission_count:
          type: integer
          minimum: 1
        evidence_form:
          type: object
          required:
          - submit
          minProperties: 2
          additionalProperties: false
          properties:
            submit:
              const: true
            evidence[access_activity_log]:
              type: string
              maxLength: 150000
            evidence[billing_address]:
              type: string
              maxLength: 150000
            evidence[cancellation_policy_disclosure]:
              type: string
              maxLength: 150000
            evidence[cancellation_rebuttal]:
              type: string
              maxLength: 150000
            evidence[customer_email_address]:
              type: string
              maxLength: 150000
            evidence[customer_name]:
              type: string
              maxLength: 150000
            evidence[customer_purchase_ip]:
              type: string
              maxLength: 150000
            evidence[duplicate_charge_explanation]:
              type: string
              maxLength: 150000
            evidence[duplicate_charge_id]:
              type: string
              maxLength: 150000
            evidence[product_description]:
              type: string
              maxLength: 150000
            evidence[refund_policy_disclosure]:
              type: string
              maxLength: 150000
            evidence[refund_refusal_explanation]:
              type: string
              maxLength: 150000
            evidence[service_date]:
              type: string
              maxLength: 150000
            evidence[shipping_address]:
              type: string
              maxLength: 150000
            evidence[shipping_carrier]:
              type: string
              maxLength: 150000
            evidence[shipping_date]:
              type: string
              maxLength: 150000
            evidence[shipping_tracking_number]:
              type: string
              maxLength: 150000
            evidence[uncategorized_text]:
              type: string
              maxLength: 150000
            evidence[cancellation_policy]:
              type: string
              pattern: ^(?:file_[A-Za-z0-9]{1,128})?$
            evidence[customer_communication]:
              type: string
              pattern: ^(?:file_[A-Za-z0-9]{1,128})?$
            evidence[customer_signature]:
              type: string
              pattern: ^(?:file_[A-Za-z0-9]{1,128})?$
            evidence[duplicate_charge_documentation]:
              type: string
              pattern: ^(?:file_[A-Za-z0-9]{1,128})?$
            evidence[receipt]:
              type: string
              pattern: ^(?:file_[A-Za-z0-9]{1,128})?$
            evidence[refund_policy]:
              type: string
              pattern: ^(?:file_[A-Za-z0-9]{1,128})?$
            evidence[service_documentation]:
              type: string
              pattern: ^(?:file_[A-Za-z0-9]{1,128})?$
            evidence[shipping_documentation]:
              type: string
              pattern: ^(?:file_[A-Za-z0-9]{1,128})?$
            evidence[uncategorized_file]:
              type: string
