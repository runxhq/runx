schema: runx.connector.v1
id: osv
name: OSV
description: Query the OSV open source vulnerability database by exact package version and read advisory records.
auth:
  none: {}
placements:
  local:
    auth: [none]
operations:
  vulnerabilities.query:
    description: Query vulnerabilities for exact package versions, one OSV query batch per request.
    verb: read
    scopes: [vulnerabilities.read]
    target:
      template: "https://api.osv.dev/v1/querybatch"
    input_schema:
      type: object
      required: [batches]
      additionalProperties: false
      properties:
        batches:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: object
            required: [queries]
            additionalProperties: false
            properties:
              queries:
                type: array
                minItems: 1
                maxItems: 500
                items:
                  type: object
                  required: [package, version]
                  additionalProperties: false
                  properties:
                    package:
                      type: object
                      required: [ecosystem, name]
                      additionalProperties: false
                      properties:
                        ecosystem: {type: string, minLength: 1, maxLength: 50}
                        name: {type: string, minLength: 1, maxLength: 300}
                    version: {type: string, minLength: 1, maxLength: 100}
    result_fields: [batches]
    implementation:
      http:
        allowed_hosts: [api.osv.dev]
        requests:
          - each: {"$argument": "/batches"}
            method: POST
            url: "https://api.osv.dev/v1/querybatch"
            body: {"queries": {"$item": "/queries"}}
  vulnerabilities.read:
    description: Read complete advisory records by OSV id.
    verb: read
    scopes: [vulnerabilities.read]
    target:
      template: "https://api.osv.dev/v1/vulns"
    input_schema:
      type: object
      required: [ids]
      additionalProperties: false
      properties:
        ids:
          type: array
          maxItems: 50
          uniqueItems: true
          items: {type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{0,99}$"}
    result_fields: [advisories]
    implementation:
      http:
        allowed_hosts: [api.osv.dev]
        requests:
          - each: {"$argument": "/ids"}
            method: GET
            url: {"$concat": ["https://api.osv.dev/v1/vulns/", {"$item": ""}]}
