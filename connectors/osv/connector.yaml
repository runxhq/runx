schema: runx.connector.v1
name: osv
title: OSV
description: Query the OSV open source vulnerability database by exact package version and read advisory records.
category: dev-tools
auth:
  none: {}
placements:
  local:
    auth:
      - none
operations:
  vulnerabilities.query:
    description: Query vulnerabilities for exact package versions, one OSV query batch per request.
    verb: read
    cost: {usd_micro: 0, per: request, source: observed}
    scopes:
      - vulnerabilities.read
    target:
      template: https://api.osv.dev/v1/querybatch
    input_schema:
      type: object
      required:
        - batches
      additionalProperties: false
      properties:
        batches:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: object
            required:
              - queries
            additionalProperties: false
            properties:
              queries:
                type: array
                minItems: 1
                maxItems: 500
                items:
                  type: object
                  required:
                    - package
                    - version
                  additionalProperties: false
                  properties:
                    package:
                      type: object
                      required:
                        - ecosystem
                        - name
                      additionalProperties: false
                      properties:
                        ecosystem:
                          type: string
                          minLength: 1
                          maxLength: 50
                        name:
                          type: string
                          minLength: 1
                          maxLength: 300
                    version:
                      type: string
                      minLength: 1
                      maxLength: 100
    result_fields:
      - batches
    implementation:
      http:
        allowed_hosts:
          - api.osv.dev
        requests:
          - each:
              $argument: /batches
            http_method: POST
            url: https://api.osv.dev/v1/querybatch
            body:
              queries:
                $item: /queries
  vulnerabilities.read:
    description: Read complete advisory records by OSV id.
    verb: read
    cost: {usd_micro: 0, per: request, source: observed}
    scopes:
      - vulnerabilities.read
    target:
      template: https://api.osv.dev/v1/vulns
    input_schema:
      type: object
      required:
        - ids
      additionalProperties: false
      properties:
        ids:
          type: array
          maxItems: 50
          uniqueItems: true
          items:
            type: string
            pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,99}$
    result_fields:
      - advisories
    implementation:
      http:
        allowed_hosts:
          - api.osv.dev
        requests:
          - each:
              $argument: /ids
            http_method: GET
            url:
              $concat:
                - https://api.osv.dev/v1/vulns/
                - $item: ""
  vulnerabilities.query_pages:
    description: Read full OSV vulnerability records for exact package versions, continuing each query with its own body cursor. Preserve native partial and unstarted outcomes.
    verb: read
    cost: {usd_micro: 0, per: request, source: observed}
    scopes:
      - vulnerabilities.read
    target:
      template: https://api.osv.dev/v1/query
    input_schema:
      type: object
      required:
        - queries
      additionalProperties: false
      properties:
        queries:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: object
            required:
              - package
              - version
            additionalProperties: false
            properties:
              package:
                type: object
                required:
                  - ecosystem
                  - name
                additionalProperties: false
                properties:
                  ecosystem:
                    type: string
                    minLength: 1
                    maxLength: 50
                  name:
                    type: string
                    minLength: 1
                    maxLength: 300
              version:
                type: string
                minLength: 1
                maxLength: 100
              page_token:
                type: string
                minLength: 1
                maxLength: 16384
    result_fields:
      - queries
    implementation:
      http:
        allowed_hosts:
          - api.osv.dev
        requests:
          - each:
              $argument: /queries
            http_method: POST
            url: https://api.osv.dev/v1/query
            body:
              $item: ""
            pages:
              items: vulns
              next: {cursor: next_page_token, param: /page_token, in: body}
