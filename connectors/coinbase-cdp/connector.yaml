schema: runx.connector.v1
id: coinbase-cdp
name: Coinbase CDP
description: Quote, settle and refund x402 payments as a merchant through Coinbase CDP.
auth:
  credentials:
    api_key:
      kind: cdp_api_key
      fields:
        - name: api_key_id
          label: CDP API key ID
          secret: false
        - name: api_key_secret
          label: CDP API key secret
        - name: wallet_secret
          label: CDP wallet secret
          required: false
        - name: x402_pay_to
          label: x402 CDP settlement account address
          secret: false
          required: false
        - name: x402_owner
          label: x402 smart-account owner address (legacy active float)
          secret: false
          required: false
        - name: x402_network
          label: x402 network
          secret: false
          required: false
        - name: x402_asset
          label: x402 asset address
          secret: false
          required: false
        - name: x402_asset_decimals
          label: x402 asset decimals (derived; legacy input)
          secret: false
          required: false
        - name: x402_targets
          label: x402 settlement targets
          secret: false
          required: false
      delivery:
        env: COINBASE_CDP_API_KEY
      audience: [api.cdp.coinbase.com]
placements:
  hosted:
    auth: credential
    credential: api_key
operations:
  payment.x402.merchant.quote:
    description: Quote the x402 payment requirements for one resource.
    verb: read
    scopes: [payment.x402.merchant.read]
    target:
      template: {"$argument": "/resource"}
    result_fields: [quote_contract, resource, amount_minor, currency, accepts, quote_digest]
    hosted: {}
  payment.x402.merchant.settle:
    description: Verify and settle one x402 payment for a resource.
    verb: write
    scopes: [payment.x402.merchant.write]
    target:
      template: {"$argument": "/resource"}
    guarantees:
      provider_idempotency: enforced
      reconcile: payment.x402.merchant.lookup
    result_fields: [payment_contract, payment_ref, idempotency_key, request_binding_digest, resource, amount_minor, currency, status, settlement_ambiguous, reason, evidence_contract, payment_payload_digest, payment_requirements_digest, verification_ref, settlement_ref, payer, pay_to, network, asset, asset_decimals, settled_at]
    hosted: {}
  payment.x402.merchant.recover:
    description: Resume settlement of one staged x402 payment.
    verb: write
    scopes: [payment.x402.merchant.write]
    target:
      template: {"$argument": "/resource"}
    result_fields: [payment_contract, payment_ref, idempotency_key, request_binding_digest, resource, amount_minor, currency, status, settlement_ambiguous, reason, evidence_contract, payment_payload_digest, payment_requirements_digest, verification_ref, settlement_ref, payer, pay_to, network, asset, asset_decimals, settled_at]
    hosted: {}
  payment.x402.merchant.read:
    description: Read one x402 payment by its payment reference.
    verb: read
    scopes: [payment.x402.merchant.read]
    target:
      template: {"$argument": "/resource"}
    result_fields: [payment_contract, payment_ref, idempotency_key, request_binding_digest, resource, amount_minor, currency, status, settlement_ambiguous, reason, evidence_contract, payment_payload_digest, payment_requirements_digest, verification_ref, settlement_ref, payer, pay_to, network, asset, asset_decimals, settled_at]
    hosted: {}
  payment.x402.merchant.lookup:
    description: Find one x402 payment by its idempotency key and request binding.
    verb: read
    scopes: [payment.x402.merchant.read]
    target:
      template: {"$argument": "/resource"}
    result_fields: [payment_contract, payment_ref, idempotency_key, request_binding_digest, resource, amount_minor, currency, status, settlement_ambiguous, reason, evidence_contract, payment_payload_digest, payment_requirements_digest, verification_ref, settlement_ref, payer, pay_to, network, asset, asset_decimals, settled_at]
    hosted: {}
  payment.x402.merchant.refund:
    description: Refund all or part of one settled x402 payment.
    verb: write
    scopes: [payment.x402.merchant.write]
    target:
      template: {"$argument": "/resource"}
    guarantees:
      provider_idempotency: enforced
    result_fields: [refund_contract, refund_ref, payment_ref, idempotency_key, resource, amount_minor, currency, status, outcome_ambiguous, reason, evidence_contract, original_settlement_ref, provider_idempotency_key, refund_settlement_ref, payer, pay_to, network, asset, asset_decimals, settled_at]
    hosted: {}
  payment.x402.merchant.refund.read:
    description: Read one x402 refund by its refund reference.
    verb: read
    scopes: [payment.x402.merchant.read]
    target:
      template: {"$argument": "/resource"}
    result_fields: [refund_contract, refund_ref, payment_ref, idempotency_key, resource, amount_minor, currency, status, outcome_ambiguous, reason, evidence_contract, original_settlement_ref, provider_idempotency_key, refund_settlement_ref, payer, pay_to, network, asset, asset_decimals, settled_at]
    hosted: {}
