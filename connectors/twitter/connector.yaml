schema: runx.connector.v1
id: twitter
name: X (Twitter)
description: Read accounts and posts on X, publish posts, and act on accounts and posts.
auth:
  credentials:
    user:
      kind: oauth1_user
      fields:
        - name: consumer_key
        - name: consumer_secret
        - name: access_token
        - name: access_secret
      delivery:
        env: TWITTER_USER_AUTH
      audience: [api.x.com]
    app:
      kind: bearer_token
      fields:
        - name: token
      delivery:
        env: TWITTER_BEARER_TOKEN
      audience: [api.x.com]
placements:
  local:
    auth: [credentials]
operations:
  account.snapshot:
    description: Read the authenticated account's profile and public metrics.
    verb: read
    scopes: ["twitter:read"]
    credentials: [user]
    target:
      template: "https://api.x.com"
    input_schema:
      type: object
      additionalProperties: false
    result_fields: [account]
    implementation:
      http:
        allowed_hosts: [api.x.com]
        auth: {user: {type: oauth1}}
        requests:
          - id: self
            method: GET
            url: "https://api.x.com/2/users/me"
            query:
              user.fields: "created_at,description,public_metrics"
        decode: [{op: auto_json}]
        result_paths:
          account: acknowledgement.data
  account.posts.read:
    description: Read the authenticated account's posts, newest first, page by page up to the limit.
    verb: read
    scopes: ["twitter:read"]
    credentials: [user]
    target:
      template: "https://api.x.com"
    input_schema:
      type: object
      additionalProperties: false
      properties:
        limit: {type: integer, minimum: 1, maximum: 10000}
        page_size: {type: integer, minimum: 10, maximum: 100}
        cursor: {type: string, minLength: 1, maxLength: 512}
    result_fields: [account, posts, next]
    implementation:
      http:
        allowed_hosts: [api.x.com]
        auth: {user: {type: oauth1}}
        requests:
          - id: self
            method: GET
            url: "https://api.x.com/2/users/me"
            query:
              user.fields: "created_at,description,public_metrics"
          - id: posts
            method: GET
            url: {"$concat": ["https://api.x.com/2/users/", {"$response": "self.json.data.id"}, "/tweets"]}
            query:
              tweet.fields: "created_at,public_metrics,entities,referenced_tweets,in_reply_to_user_id"
              max_results: {"$argument": "/page_size"}
              pagination_token: {"$argument": "/cursor"}
            pages:
              param: pagination_token
              cursor: meta.next_token
              items: data
              limit: {"$argument": "/limit"}
        decode: [{op: auto_json}]
        result_paths:
          account: acknowledgement.0.data
          posts: acknowledgement.1.items
          next: acknowledgement.1.next
  account.mentions.read:
    description: Read recent posts that mention the authenticated account, page by page up to the limit.
    verb: read
    scopes: ["twitter:read"]
    credentials: [user]
    target:
      template: "https://api.x.com"
