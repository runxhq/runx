            method: DELETE
            url: {"$concat": ["https://api.x.com/2/tweets/", {"$item": ""}]}
        decode: [{op: auto_json}]
        result_paths:
          outcomes: acknowledgement
        rate_limit: {reset_header: x-rate-limit-reset}
