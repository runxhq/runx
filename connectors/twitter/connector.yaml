  posts.delete:
    description: Delete each listed post of the account. Each answer states the resulting state, which is the evidence; X offers no read of one item cheap enough to confirm a batch.
    verb: delete
    scopes: ["twitter:write"]
    credentials: [user]
    target:
      template: "https://api.x.com/2/tweets"
    approval: required
    guarantees:
      provider_idempotency: inherent
      readback: unavailable
    input_schema:
      type: object
      required: [post_ids]
      additionalProperties: false
      properties:
        post_ids: {type: array, minItems: 1, maxItems: 50, uniqueItems: true, items: {type: string, pattern: "^[0-9]{1,19}$"}}
    result_fields: [outcomes]
    implementation:
      http:
        allowed_hosts: [api.x.com]
        auth: {user: {type: oauth1}}
        requests:
