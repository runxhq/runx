  post.create:
    description: Publish one post to the account's public timeline.
    verb: write
    scopes: ["twitter:write"]
    credentials: [user]
    target:
      template: "https://api.x.com/2/tweets"
    approval: required
    input_schema:
      type: object
      required: [text]
      additionalProperties: false
      properties:
        text: {type: string, minLength: 1, maxLength: 4000}
    result_fields: [post]
    implementation:
      http:
        allowed_hosts: [api.x.com]
        auth: {user: {type: oauth1}}
        requests:
          - id: post
            method: POST
            url: "https://api.x.com/2/tweets"
            body: {text: {"$argument": "/text"}}
        readbacks:
          - request:
              id: posted
              method: GET
              url: {"$concat": ["https://api.x.com/2/tweets/", {"$response": "write.json.data.id"}]}
            matches:
              - {expected: {source: acknowledgement, path: data.id}, observed: data.id}
        decode: [{op: auto_json}]
        operation_id_path: data.id
        result_paths:
          post: readbacks.0.data
