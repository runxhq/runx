schema: runx.connector.v1
id: google-search-console
name: Google Search Console
description: Read Search Console performance, URL inspections and sitemaps, and submit sitemaps.
auth:
  delegated: {}
placements:
  hosted:
    auth: delegated
operations:
  sites.list:
    description: List the Search Console properties the connected account can access.
    verb: read
    scopes: [sites.read]
    target:
      template: "google-search-console://sites"
    result_fields: [sites]
    hosted:
      provider_scopes: ["https://www.googleapis.com/auth/webmasters.readonly", "openid"]
  search.analytics.query:
    description: Query search performance rows for a property.
    verb: read
    scopes: [search.analytics.read]
    target:
      template: {"$argument": "/property"}
    result_fields: [property, start_date, end_date, dimensions, search_type, data_state, rows, row_count, aggregation_type, metadata, pagination, fetched_at]
    hosted:
      provider_scopes: ["https://www.googleapis.com/auth/webmasters.readonly", "openid"]
  url.inspect:
    description: Inspect the index status of one URL within a property.
    verb: read
    scopes: [url.inspect]
    target:
      template: {"$argument": "/inspection_url"}
    result_fields: [property, inspection_url, verdict, coverage_state, robots_txt_state, indexing_state, page_fetch_state, crawled_as, last_crawl_time, referring_urls, sitemap, amp, mobile_usability, rich_results, inspection_link, fetched_at]
    hosted:
      provider_scopes: ["https://www.googleapis.com/auth/webmasters.readonly", "openid"]
  sitemaps.list:
    description: List the sitemaps submitted for a property.
    verb: read
    scopes: [sitemaps.read]
    target:
      template: {"$argument": "/property"}
    result_fields: [property, sitemaps]
    hosted:
      provider_scopes: ["https://www.googleapis.com/auth/webmasters.readonly", "openid"]
  sitemaps.get:
    description: Read the status of one sitemap within a property.
    verb: read
    scopes: [sitemaps.read]
    target:
      template: {"$argument": "/sitemap_url"}
    result_fields: [property, sitemap_url, status, last_submitted, last_downloaded, error_count, warning_count]
    hosted:
      provider_scopes: ["https://www.googleapis.com/auth/webmasters.readonly", "openid"]
  sitemaps.submit:
    description: Submit a sitemap for a property.
    verb: write
    scopes: [sitemaps.submit]
    target:
      template: {"$argument": "/sitemap_url"}
    readback: sitemaps.get
    result_fields: [property, sitemap_url, accepted_at, idempotency_key]
    hosted:
      provider_scopes: ["https://www.googleapis.com/auth/webmasters", "openid"]
