version: "0.1.1"
minimum_runx: 0.12.0

catalog:
  visibility: public

methods:
  default:
    inputs:
      message:
        type: string
        description: Message to print from the example skill.
    steps:
      - id: default
        tool: {command: node, args: [run.mjs]}
        inputs:
          message: $input.message
        outputs:
          message: {type: string}
