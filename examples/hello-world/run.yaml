skill: hello-world
version: "0.1.1"

catalog:
  kind: skill
  audience: public
  visibility: public
  role: canonical

harness:
  cases:
    - name: hello-world-smoke
      runner: default
      operator_journeys:
        - mode: standalone
          confusors: [extract, web-fetch]
          request: Print this exact greeting through the example skill.
          expected_outcome: Return the supplied greeting from the advertised default runner in a sealed receipt.
        - mode: composed
          request: Print the greeting already selected by the prior example step.
          expected_outcome: Reuse the supplied greeting without rediscovering or rewriting it.
          prior_evidence:
            - The exact greeting supplied by the prior step.
          must_not_repeat:
            - Do not rediscover or rewrite the supplied greeting.
      inputs:
        message: hello from docs
      expect:
        status: sealed
        receipt:
          schema: runx.receipt.v1
          state: sealed
          disposition: closed

runners:
  default:
    default: true
    inputs:
      message:
        type: string
        required: true
        description: Message to print from the example skill.
    steps:
      - id: default
        tool: { command: node, args: [run.mjs] }
        inputs:
          message: $input.message
        outputs:
          message: string
