version: "0.1.0"
minimum_runx: 0.12.0
default_method: decide

catalog:
  visibility: public

methods:
  decide:
    description: Decide one iteration of the loop against the loop's policy, continuing, finishing, pausing for a person or refusing, and hand the outer loop its projection update and the next iteration's handoff.
    inputs:
      loop_id:
        type: string
        description: Stable id for the outer loop.
      iteration:
        type: number
        description: One-based number of this iteration of the loop.
      max_iterations:
        type: number
        description: Most iterations the loop's policy allows.
      objective:
        type: string
        description: Bounded objective for this iteration.
      previous_summary:
        type: string
        description: Projection summary from earlier sealed iterations.
        optional: true
      requested_tool:
        type: string
        description: Tool the model or upstream planner wants to use this iteration.
        optional: true
      scenario:
        type: string
        default: success
        description: "Fixture scenario: success, refusal, or pause."
        optional: true
    steps:
      - id: decide
        tool: {command: node, args: [loop/decide.mjs], timeout_seconds: 15}
        inputs:
          loop_id: $input.loop_id
          iteration: $input.iteration
          max_iterations: $input.max_iterations
          objective: $input.objective
          previous_summary: $input.previous_summary
          requested_tool: $input.requested_tool
          scenario: $input.scenario
        outputs:
          schema: {type: string}
          loop_id: {type: string}
          iteration_id: {type: string}
          iteration: {type: number}
          max_iterations: {type: number}
          objective: {type: string}
          previous_summary: {type: string}
          requested_tool: {type: string}
          allowed_tools: {type: array}
          decision: {type: string}
          reason_code: {type: string}
          next_iteration_allowed: {type: boolean}
          next_iteration_reason: {type: string}
          projection_update: {type: object}
          handoff: {description: "The next iteration's handoff, or null once the loop stops."}
          receipt_notes: {type: object}

  context-gate:
    description: Have an agent review the next iteration's plan against the loop operator's advisory context, returning a decision, a summary, the tool it would use and the stop condition.
    inputs:
      objective:
        type: string
        description: Objective for the paused/reviewed agent turn.
    steps:
      - id: review
        agent: review-loop-plan
        calls:
          tools: [fs.read]
        outputs:
          decision: {type: string}
          summary: {type: string}
          requested_tool: {type: string}
          stop_condition: {type: string}
        inputs:
          objective: "$input.objective"
        context:
          skills:
            - ./context/loop-operator
