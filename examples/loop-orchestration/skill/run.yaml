version: "0.1.0"
minimum_runx: 0.12.0
default_method: turn

catalog:
  visibility: public

methods:
  turn:
    description: Decide one loop turn against the loop's policy, continuing, finishing, pausing for a person or refusing, and hand the outer loop its projection update and next-turn handoff.
    inputs:
      loop_id:
        type: string
        description: Stable id for the outer loop.
      turn_index:
        type: number
        description: One-based turn number inside the loop.
      max_turns:
        type: number
        description: Maximum turns allowed by loop policy.
      objective:
        type: string
        description: Bounded objective for this turn.
      previous_summary:
        type: string
        description: Projection summary from previous sealed turns.
        optional: true
      requested_tool:
        type: string
        description: Tool the model or upstream planner wants to use this turn.
        optional: true
      scenario:
        type: string
        default: success
        description: "Fixture scenario: success, refusal, or pause."
        optional: true
    steps:
      - id: turn
        tool: {command: node, args: [loop/turn.mjs], timeout_seconds: 15}
        inputs:
          loop_id: $input.loop_id
          turn_index: $input.turn_index
          max_turns: $input.max_turns
          objective: $input.objective
          previous_summary: $input.previous_summary
          requested_tool: $input.requested_tool
          scenario: $input.scenario
        outputs:
          schema: {type: string}
          loop_id: {type: string}
          turn_id: {type: string}
          turn_index: {type: number}
          max_turns: {type: number}
          objective: {type: string}
          previous_summary: {type: string}
          requested_tool: {type: string}
          allowed_tools: {type: array}
          decision: {type: string}
          reason_code: {type: string}
          next_turn_allowed: {type: boolean}
          next_turn_reason: {type: string}
          projection_update: {type: object}
          handoff: {description: "Next-turn handoff, or null once the loop stops."}
          receipt_notes: {type: object}

  context-gate:
    description: Have an agent review the next turn's plan against the loop operator's advisory context, returning a decision, a summary, the tool it would use and the stop condition.
    inputs:
      objective:
        type: string
        description: Objective for the paused/reviewed agent turn.
    steps:
      - id: review
        agent: review-loop-plan
        calls:
          tools: [fs.read]
        outputs:
          decision: {type: string}
          summary: {type: string}
          requested_tool: {type: string}
          stop_condition: {type: string}
        inputs:
          objective: "$input.objective"
        context:
          skills:
            - ./context/loop-operator
