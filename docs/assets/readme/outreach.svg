<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="454" viewBox="0 0 1120 454" role="img" aria-labelledby="title desc">
  <title id="title">Outreach: facts, fit, writing context and delivery</title>
  <desc id="desc">Lead-enrichment feeds lead-qualify. Research, brand-voice, taste-profile and recipient contact eligibility feed cold-outreach. Inside it, ghostwrite admit precedes a writing turn and ghostwrite verify. The caller hands an accepted draft to message-send plan and a selected email provider. Approval gates delivery; readback and recipient outcomes inform future contact. Missing evidence or eligibility produces a hold.</desc>
  <defs>
    <style>
      :root{color-scheme:light dark;--bg:#fcfbf9;--card:#fff;--line:#e4e0d9;--ink:#242522;--muted:#666963;--p:#7957be;--t:#087f79;--a:#b06c10;--b:#346ab6}
      @media(prefers-color-scheme:dark){:root{--bg:#141719;--card:#1b1f22;--line:#343a3c;--ink:#f0f1eb;--muted:#aeb7b2;--p:#ba9af0;--t:#5ed1bd;--a:#f2bf67;--b:#8ab4f3}}
      .title{font:650 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:var(--ink)}
      .label{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:var(--muted)}
      .small{font:12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:var(--muted)}
      .code{font:14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:var(--ink)}
      .card{fill:var(--card);stroke:var(--line);stroke-width:1.2}
      .edge{fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
      .handoff{stroke-dasharray:4 5}
    </style>
    <marker id="arrow" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L6 3 L0 6" fill="var(--muted)"/></marker>
  </defs>
  <rect x="1" y="1" width="1118" height="452" rx="16" fill="var(--bg)" stroke="var(--line)"/>
  <path class="edge handoff" d="M274 61 H310" stroke="var(--p)"/>
  <path class="edge handoff" d="M420 98 V140" stroke="var(--p)"/>
  <path class="edge handoff" d="M685 98 V140" stroke="var(--t)"/>
  <path class="edge handoff" d="M965 98 V140" stroke="var(--p)"/>
  <path class="edge handoff" d="M274 181 H310" stroke="var(--a)"/>
  <path class="edge" d="M310 237 H290 Q282 237 282 245 V263 H274" stroke="var(--a)"/>
  <path class="edge handoff" d="M949 260 V279 Q949 291 937 291 H432 Q420 291 420 303 V322" stroke="var(--t)"/>
  <path class="edge handoff" d="M530 362 H640" stroke="var(--t)"/>
  <path class="edge" d="M900 362 H962" stroke="var(--t)"/>
  <path class="edge handoff" d="M1027 402 V416 Q1027 430 1013 430 H28 Q12 430 12 414 V197 Q12 181 24 181" stroke="var(--b)" opacity=".65"/>
  <rect class="card" x="24" y="24" width="250" height="74" rx="11"/>
  <text class="title" x="42" y="55">lead-enrichment</text><text class="label" x="42" y="80">Matched facts + provenance</text>
  <rect class="card" x="310" y="24" width="220" height="74" rx="11"/>
  <text class="title" x="328" y="55">lead-qualify</text><text class="label" x="328" y="80">Fit against your ICP</text>
  <rect class="card" x="575" y="24" width="220" height="74" rx="11"/>
  <text class="title" x="593" y="55">research</text><text class="label" x="593" y="80">Facts + source digests</text>
  <rect class="card" x="840" y="24" width="250" height="74" rx="11"/>
  <text class="title" x="858" y="55">brand-voice · taste-profile</text><text class="label" x="858" y="80">Scoped writing context</text>
  <rect class="card" x="24" y="147" width="250" height="68" rx="11"/>
  <text class="title" x="42" y="175">Contact policy</text><text class="label" x="42" y="198">Recipient + suppression state</text>
  <rect x="24" y="237" width="250" height="53" rx="11" fill="var(--card)" stroke="var(--a)" stroke-dasharray="3 4"/>
  <text class="title" x="42" y="260">Hold</text><text class="small" x="42" y="279">Eligibility or evidence missing</text>
  <rect x="310" y="140" width="780" height="120" rx="12" fill="var(--card)" stroke="var(--p)" stroke-opacity=".65" stroke-width="1.3"/>
  <text class="title" x="330" y="169">cold-outreach</text>
  <rect class="card" x="330" y="187" width="210" height="54" rx="8"/>
  <text class="code" x="435" y="219" text-anchor="middle">ghostwrite#admit</text>
  <path class="edge" d="M540 214 H584" stroke="var(--p)"/>
  <rect class="card" x="584" y="187" width="210" height="54" rx="8"/>
  <text class="title" x="689" y="219" text-anchor="middle">Write the email</text>
  <path class="edge" d="M794 214 H838" stroke="var(--p)"/>
  <rect class="card" x="838" y="187" width="232" height="54" rx="8"/>
  <text class="code" x="954" y="219" text-anchor="middle">ghostwrite#verify</text>
  <rect class="card" x="310" y="322" width="220" height="80" rx="11"/>
  <text class="code" x="328" y="352">message-send#plan</text><text class="label" x="328" y="378">Exact draft + audience</text>
  <path d="M585 352 L595 362 L585 372 L575 362 Z" fill="var(--bg)" stroke="var(--t)" stroke-width="1.8"/>
  <text class="small" x="585" y="391" text-anchor="middle">Approval</text>
  <rect class="card" x="640" y="322" width="260" height="80" rx="11"/>
  <text class="title" x="658" y="352">Nitrosend / email provider</text><text class="label" x="658" y="378">Preflight + exact approved delivery</text>
  <rect class="card" x="962" y="322" width="130" height="80" rx="11"/>
  <text class="title" x="1027" y="352" text-anchor="middle">Readback</text><text class="label" x="1027" y="378" text-anchor="middle">Provider result</text>
</svg>
